<!-- SUBSTITUI TODO O SEU <div id="liveM"> POR ESSE MELHORADO: -->
<div id="liveM">
<video id="liveV" style="width:100%;height:100%;object-fit:cover" autoplay muted playsinline></video>

<!-- TOPO MELHORADO -->
<div style="position:absolute;top:0;left:0;right:0;padding:12px;display:flex;justify-content:space-between;z-index:10;background:linear-gradient(180deg,rgba(0,0,0,.8),transparent)">
<div style="display:flex;gap:8px;align-items:center">
<div style="background:#fe2c55;padding:6px 12px;border-radius:6px;font-weight:900;font-size:11px;display:flex;gap:6px;align-items:center;border:2px solid #fff">
<div class="dot"></div> AO VIVO
</div>
<div id="liveT" style="background:rgba(0,0,0,.75);padding:6px 12px;border-radius:20px;font-size:13px;font-weight:900;border:1px solid rgba(255,255,255,.3);min-width:68px;text-align:center">00:00</div>
</div>
<button onclick="closeAll()" style="width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.6);border:1.5px solid rgba(255,255,255,.3);color:#fff;font-size:16px">✕</button>
</div>

<!-- INFO TEMPO MELHORADA - CENTRO -->
<div style="position:absolute;top:58px;left:50%;transform:translateX(-50%);z-index:10;display:flex;flex-direction:column;gap:6px;align-items:center">
<div id="liveI" style="background:rgba(0,0,0,.75);padding:7px 14px;border-radius:20px;font-size:11px;font-weight:800;border:1px solid rgba(255,215,0,.4);color:#FFD700;white-space:nowrap;text-align:center"></div>
<div id="liveBarWrap" style="width:180px;height:6px;background:rgba(255,255,255,.2);border-radius:3px;overflow:hidden">
<div id="liveBar" style="height:100%;width:0%;background:linear-gradient(90deg,#fe2c55,#FFD700);transition:width 1s linear"></div>
</div>
</div>

<!-- CHAT FAKE AO VIVO -->
<div id="liveChat" style="position:absolute;left:10px;bottom:110px;right:80px;z-index:10;display:flex;flex-direction:column;gap:5px;pointer-events:none"></div>

<!-- BOTÃO GRAVAR MELHORADO -->
<button id="liveB" onclick="togLive()" style="position:absolute;bottom:20px;left:50%;transform:translateX(-50%);width:76px;height:76px;border-radius:50%;background:#fe2c55;border:5px solid #fff;color:#fff;font-size:28px;box-shadow:0 0 20px rgba(254,44,85,.6);z-index:10">●</button>

<div style="position:absolute;bottom:6px;left:50%;transform:translateX(-50%);z-index:10;font-size:9px;color:rgba(255,255,255,.6);font-weight:700;white-space:nowrap">⏱️ LIMITE: 30 MIN/DIA • GRAVAÇÃO SALVA NO FEED</div>
</div>

<script>
// ===== FUNÇÕES LIVE MELHORADAS - SUBSTITUI AS ANTIGAS =====
const LIM=1800; // 30 min em segundos
let liveTmr=null,liveS=0,liveRec=false,liveChatTmr=null;

function getUso(){let d=JSON.parse(localStorage.getItem('liveUso')||'{}');if(d.data!==new Date().toDateString())return 0;return d.seg||0}
function saveUso(s){localStorage.setItem('liveUso',JSON.stringify({data:new Date().toDateString(),seg:s}))}

function openLive(){
let resta=LIM-getUso();
if(resta<=0){toast('⏰ Você usou seus 30min de LIVE hoje! Volta amanhã 👑');return}
document.getElementById('liveM').style.display='flex';
navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true}).then(s=>{
stream=s;document.getElementById('liveV').srcObject=s;
liveS=0;liveRec=false;
let temMin=Math.floor(resta/60);
let temSec=resta%60;
document.getElementById('liveI').innerText=`🔋 Hoje: ${temMin}:${String(temSec).padStart(2,'0')} restante • Clique ● para gravar`;
document.getElementById('liveT').innerText='00:00';
document.getElementById('liveBar').style.width='0%';
document.getElementById('liveChat').innerHTML='';
startFakeChat();
}).catch(()=>toast('Permita câmera + microfone'))
}

function startFakeChat(){
let msgs=["@carlos entrou na live","@ana: 🔥🔥🔥","@pedro: manda salve!","@julia: lindo demais","@work_fan entrou","@maria: amei!","@joao: top!!"];
let i=0;
liveChatTmr=setInterval(()=>{
if(i>=msgs.length)i=0;
let d=document.createElement('div');
d.style.cssText="background:rgba(0,0,0,.6);padding:5px 10px;border-radius:12px;font-size:10px;animation:fadeIn.3s";
d.innerText=msgs[i++];
document.getElementById('liveChat').appendChild(d);
if(document.getElementById('liveChat').children.length>4)document.getElementById('liveChat').firstChild.remove();
},2500);
}

function togLive(){
let b=document.getElementById('liveB');
let faltaEl=document.getElementById('liveI');
let bar=document.getElementById('liveBar');
let timeEl=document.getElementById('liveT');

if(!liveRec){
// COMEÇAR A GRAVAR
liveRec=true;
b.innerText='■';
b.style.background='#fff';
b.style.color='#fe2c55';
b.style.transform='translateX(-50%) scale(1.1)';
toast('🔴 LIVE GRAVANDO - Tempo contando!');

liveTmr=setInterval(()=>{
liveS++;
let tot=getUso()+liveS;
saveUso(tot);
let falta=LIM-tot;

if(falta<=0){
// ACABOU OS 30 MIN
clearInterval(liveTmr);
clearInterval(liveChatTmr);
saveLiveVideo();
toast('⏰ 30min acabaram! LIVE salva no feed!');
closeAll();
return;
}

let m=String(Math.floor(liveS/60)).padStart(2,'0');
let sc=String(liveS%60).padStart(2,'0');
timeEl.innerText=`${m}:${sc}`;

let faltaM=Math.floor(falta/60);
let faltaS=falta%60;
faltaEl.innerText=`🔴 GRAVANDO ${m}:${sc} | Resta hoje: ${faltaM}:${String(faltaS).padStart(2,'0')}`;

let pct=(liveS/(LIM-getUso()+liveS))*100;
bar.style.width=Math.min(pct,100)+'%';

if(falta<=60) faltaEl.style.color='#ff4444';
else faltaEl.style.color='#FFD700';

},1000);

}else{
// PARAR DE GRAVAR
liveRec=false;
b.innerText='●';
b.style.background='#fe2c55';
b.style.color='#fff';
b.style.transform='translateX(-50%) scale(1)';
clearInterval(liveTmr);
clearInterval(liveChatTmr);
faltaEl.innerText=`⏸️ Pausado em ${timeEl.innerText} • Clique ● para continuar ou ✕ para salvar`;
toast(`⏸️ Pausado - ${timeEl.innerText} gravados`);
if(liveS>3) saveLiveVideo();
}
}

function saveLiveVideo(){
if(liveS<2) return;
let me=getU();
let thumbCanvas=document.createElement('canvas');
let v=document.getElementById('liveV');
thumbCanvas.width=720; thumbCanvas.height=1280;
try{thumbCanvas.getContext('2d').drawImage(v,0,0,720,1280);}catch{}
let thumb=thumbCanvas.toDataURL('image/jpeg',0.7);

allVideos.unshift({
id:Date.now(),
data:thumb,
desc:`Minha LIVE 🔴 ${String(Math.floor(liveS/60)).padStart(2,'0')}:${String(liveS%60).padStart(2,'0')} - Ao vivo hoje! #live #aovivo`,
type:'foto',
likes:0,
owner:me.nick,
commentsList:["Live top!","Arrasou na live 🔥"],
music:`LIVE • ${String(Math.floor(liveS/60)).padStart(2,'0')}:${String(liveS%60).padStart(2,'0')}`
});
saveB();
try{let tx=db.transaction('videos','readwrite');tx.objectStore('videos').add(allVideos[0])}catch{}
render();
}

function closeAll(){
document.querySelectorAll('.modal').forEach(m=>m.style.display='none');
document.getElementById('cam').style.display='none';
document.getElementById('liveM').style.display='none';
if(stream){try{stream.getTracks().forEach(x=>x.stop())}catch{} stream=null}
clearInterval(recT);clearInterval(liveTmr);clearInterval(liveChatTmr);
document.getElementById('recP').style.width='0%';
if(liveS>0) saveUso(getUso());
}
</script>
