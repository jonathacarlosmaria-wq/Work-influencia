<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WORK INFLUÊNCIA</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#000;height:100dvh;overflow:hidden;font-family:Montserrat,sans-serif}
#splash{position:fixed;inset:0;background:#000;z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column}
.t{font-family:Anton,sans-serif;font-size:62px;line-height:.9}
.w{animation:w8 8s forwards}.i{animation:i8 8s forwards;margin-top:8px}
@keyframes w8{0%{color:red;transform:scale(.4);opacity:0}20%{opacity:1;transform:scale(1.1)}50%{color:orange}100%{background:linear-gradient(100deg,#D4AF37,#FFD700,#FFF,#FFD700);background-size:400% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;transform:scale(1.3);background-position:400% 0}}
@keyframes i8{0%{color:#400;opacity:0}30%{opacity:1;color:gold}100%{background:linear-gradient(100deg,#D4AF37,#FFD700,#FFF,#FFD700);background-size:400% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;transform:scale(1.3);background-position:400% 0}}
.fire{position:absolute;bottom:-30px;left:0;right:0;height:80px;background:linear-gradient(to top,red,orange,gold,transparent);filter:blur(10px);opacity:0;animation:f8 8s forwards}
@keyframes f8{30%{opacity:1;transform:scaleY(1.4)}100%{opacity:0}}
.sub{margin-top:30px;color:#D4AF37;letter-spacing:10px;font-size:11px;font-weight:900;opacity:0;animation:s8 8s forwards}
@keyframes s8{85%{opacity:0}100%{opacity:1}}
.app{height:100dvh;display:flex;flex-direction:column;opacity:0}
.topbar{height:52px;display:flex;justify-content:space-between;align-items:center;padding:0 16px;border-bottom:1px solid #222;color:#fff;background:#000;z-index:10}
.logo{font-weight:900}.logo span{color:#D4AF37}
.saldo{border:1px solid #D4AF37;color:#D4AF37;padding:6px 14px;border-radius:20px;font-size:13px}
.feed{flex:1;position:relative;background:#111;overflow:hidden}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;pointer-events:none}
.ov{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.85) 0%,transparent 60%);pointer-events:none}
.right{position:absolute;right:12px;bottom:110px;display:flex;flex-direction:column;gap:16px;z-index:20}
.btn{width:52px;height:52px;background:rgba(255,255,255,.15);backdrop-filter:blur(10px);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;border:1px solid rgba(212,175,55,.3);cursor:pointer}
.btn:active{transform:scale(.9)}
.count{font-size:11px;font-weight:900;text-align:center;color:#fff;margin-top:4px}
.info{position:absolute;left:16px;right:85px;bottom:16px;z-index:20;color:#fff;pointer-events:none}
.info.u{font-weight:900;font-size:16px}.info.d{font-size:13px;margin:4px 0}.info.h{color:#D4AF37;font-size:12px}
.bottom{height:62px;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;align-items:center;z-index:30}
.tab{color:#666;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:8px 16px;border-radius:10px}
.tab.active{color:#D4AF37;background:rgba(212,175,55,.12)}.tab b{font-size:20px}
.add{width:40px;height:28px;background:#D4AF37;border-radius:8px;color:#000;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:100;display:none;flex-direction:column}
.modal.on{display:flex}
.mh{height:54px;display:flex;justify-content:space-between;align-items:center;padding:0 18px;border-bottom:1px solid #222;color:#fff;font-weight:900}
.mb{flex:1;overflow:auto;padding:16px}
.card{background:#151515;border:1px solid #222;border-radius:14px;padding:14px;margin-bottom:12px;color:#fff}
input,textarea{width:100%;background:#000;border:1px solid #333;color:#fff;padding:12px;border-radius:10px;margin-bottom:10px;font-family:Montserrat}
button.main{width:100%;background:linear-gradient(90deg,#D4AF37,#B8941F);border:none;padding:14px;border-radius:12px;font-weight:900;color:#000}
button.sec{background:#222;color:#fff}
.comment{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #222}
.ava{width:32px;height:32px;background:#D4AF37;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#000;font-weight:900;font-size:12px;flex-shrink:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gcard{aspect-ratio:3/4;background-size:cover;background-position:center;border-radius:12px;border:1px solid #222;position:relative}
.gcard span{position:absolute;bottom:6px;left:6px;background:rgba(0,0,0,.7);padding:4px 8px;border-radius:20px;font-size:10px;font-weight:900}
</style>
</head>
<body>
<div id="splash"><div style="position:relative;text-align:center"><div class="t w">WORK</div><div class="fire"></div><div class="t i" style="color:gold">INFLUÊNCIA</div></div><div class="sub">PREMIUM</div></div>

<div class="app" id="app">
<div class="topbar"><div class="logo">★ WORK <span>INFLUÊNCIA</span></div><div class="saldo">R$ 40,80</div></div>
<div class="feed" id="feed"></div>
<div class="bottom">
<div class="tab active" id="tInicio" onclick="tabInicio()"><b>⌂</b>Início</div>
<div class="tab" id="tExp" onclick="tabExplorar()"><b>◎</b>Explorar</div>
<div class="tab" onclick="tabCriar()"><div class="add">+</div></div>
<div class="tab" onclick="tabCarteira()"><b>◧</b>Carteira</div>
<div class="tab" onclick="tabPerfil()"><b>◉</b>Perfil</div>
</div>
</div>

<div class="modal" id="mComment"><div class="mh"><span>COMENTÁRIOS</span><span onclick="closeM()" style="font-size:28px">×</span></div><div class="mb"><div id="listC"></div><div class="card"><input id="inC" placeholder="Escreva..."><button class="main" onclick="enviarC()">ENVIAR</button></div></div></div>
<div class="modal" id="mPerfil"><div class="mh"><span>PERFIL</span><span onclick="closeM()" style="font-size:28px">×</span></div><div class="mb"><div class="card" style="text-align:center"><div style="width:80px;height:80px;background:#D4AF37;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:32px;color:#000;font-weight:900">U</div><b>@usuario.teste</b><p style="color:#D4AF37;margin:8px 0">R$ 40,80</p><input id="senha" type="password" placeholder="admin123"><button class="main" onclick="entrarAdmin()">ADMIN</button><br><br><button class="main sec" onclick="closeM()">VOLTAR</button></div></div></div>
<div class="modal" id="mAdmin"><div class="mh"><span>ADMIN</span><span onclick="closeM()" style="font-size:28px">×</span></div><div class="mb"><div class="card"><input id="aU" placeholder="@usuario"><input id="aD" placeholder="Descrição"><input id="aH" placeholder="#hashtag"><input id="aI" placeholder="Link imagem"><button class="main" onclick="publicar()">PUBLICAR VÍDEO</button></div><div class="card"><input id="aS" placeholder="Novo saldo"><button class="main" onclick="mudarSaldo()">ATUALIZAR SALDO</button></div><button class="main sec" onclick="closeM()">FECHAR</button></div></div>
<div class="modal" id="mWallet"><div class="mh"><span>CARTEIRA</span><span onclick="closeM()" style="font-size:28px">×</span></div><div class="mb"><div class="card" style="text-align:center"><p>SALDO</p><p style="font-size:32px;color:#D4AF37;font-weight:900" id="sWallet">R$ 40,80</p></div></div></div>
<div class="modal" id="mExplore"><div class="mh"><span>EXPLORAR</span><span onclick="closeM()" style="font-size:28px">×</span></div><div class="mb"><div class="grid" id="gridE"></div></div></div>
<div class="modal" id="mCreate"><div class="mh"><span>CRIAR</span><span onclick="closeM()" style="font-size:28px">×</span></div><div class="mb"><div class="card"><input id="cU" placeholder="@seu usuario"><textarea id="cD" placeholder="Descrição" rows="3"></textarea><input id="cH" placeholder="#hashtag"><input id="cI" placeholder="Link imagem"><button class="main" onclick="criarV()">POSTAR</button></div></div></div>

<script>
let videos=[
{user:"@mariana.influ",desc:"Dica de ouro para ganhar pontos",hash:"#workinfluencia",img:"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?q=80&w=1000",likes:1243,liked:false,com:2,gift:12,share:34,comments:[{u:"@joao",t:"Top!"},{u:"@ana",t:"Como faz?"}]},
{user:"@joao.influ",desc:"Como crescer rápido aqui",hash:"#dicas",img:"https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=1000",likes:890,liked:false,com:1,gift:8,share:22,comments:[{u:"@maria",t:"Ensina"}]}
];
let cur=0;
let saldo="40,80";

function render(){
let v=videos[cur];
document.getElementById('feed').innerHTML=`
<div class="bg" style="background-image:url('${v.img}')"></div>
<div class="ov"></div>
<div class="right">
<div onclick="curtir()"><div class="btn" id="btnLike" style="${v.liked?'background:#ff1744;color:#fff':''}">${v.liked?'♥':'♡'}</div><div class="count">${v.likes}</div></div>
<div onclick="abrirComent()"><div class="btn">💬</div><div class="count">${v.com}</div></div>
<div onclick="presente()"><div class="btn">🎁</div><div class="count">${v.gift}</div></div>
<div onclick="compartilhar()"><div class="btn">↗</div><div class="count">${v.share}</div></div>
</div>
<div class="info"><div class="u">${v.user}</div><div class="d">${v.desc}</div><div class="h">${v.hash}</div></div>
`;
}
setTimeout(()=>{let s=document.getElementById('splash');s.style.transition='opacity 1s';s.style.opacity='0';setTimeout(()=>{s.style.display='none';document.getElementById('app').style.opacity='1';document.getElementById('app').style.transition='opacity.6s';render()},1000)},8000);

function curtir(){
let v=videos[cur];
if(!v.liked){v.likes++;v.liked=true}else{v.likes--;v.liked=false}
render();
}
function abrirComent(){
let v=videos[cur];
document.getElementById('listC').innerHTML=v.comments.map(c=>`<div class="comment"><div class="ava">${c.u[1].toUpperCase()}</div><div><b style="font-size:13px">${c.u}</b><p style="font-size:13px;color:#ccc">${c.t}</p></div></div>`).join('')||'<p style="color:#666;text-align:center">Nenhum comentário</p>';
document.getElementById('mComment').classList.add('on');
}
function enviarC(){
let i=document.getElementById('inC');if(!i.value.trim())return;
videos[cur].comments.push({u:"@usuario.teste",t:i.value});videos[cur].com++;i.value='';abrirComent();render();
}
function presente(){
videos[cur].gift++;
alert('🎁 Presente enviado para '+videos[cur].user);
render();
}
function compartilhar(){
videos[cur].share++;
alert('Link copiado: '+location.href+'\nCompartilhe com seus amigos!');
render();
}
function tabInicio(){closeM();render();setActive('tInicio')}
function tabExplorar(){
let g=document.getElementById('gridE');
g.innerHTML=videos.map((v,i)=>`<div class="gcard" style="background-image:url('${v.img}')" onclick="cur=${i};closeM();render();setActive('tInicio')"><span>${v.user}</span></div>`).join('');
document.getElementById('mExplore').classList.add('on');setActive('tExp');
}
function tabCriar(){document.getElementById('mCreate').classList.add('on')}
function tabCarteira(){document.getElementById('sWallet').innerText='R$ '+saldo;document.getElementById('mWallet').classList.add('on')}
function tabPerfil(){document.getElementById('mPerfil').classList.add('on')}
function entrarAdmin(){if(document.getElementById('senha').value==='admin123'){closeM();document.getElementById('mAdmin').classList.add('on')}else alert('Senha: admin123')}
function publicar(){
let u=document.getElementById('aU').value||'@novo';let d=document.getElementById('aD').value||'Novo vídeo';let h=document.getElementById('aH').value||'#work';let im=document.getElementById('aI').value||'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?q=80&w=1000';
videos.unshift({user:u,desc:d,hash:h,img:im,likes:0,liked:false,com:0,gift:0,share:0,comments:[]});cur=0;closeM();render();
}
function criarV(){
let u=document.getElementById('cU').value||'@usuario.teste';let d=document.getElementById('cD').value||'Meu vídeo novo';let h=document.getElementById('cH').value||'#work';let im=document.getElementById('cI').value||'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?q=80&w=1000';
videos.unshift({user:u,desc:d,hash:h,img:im,likes:0,liked:false,com:0,gift:0,share:0,comments:[]});cur=0;closeM();render();
}
function mudarSaldo(){let ns=document.getElementById('aS').value;if(ns){saldo=ns;document.querySelectorAll('.saldo').forEach(e=>e.innerText='R$ '+saldo);closeM()}}
function closeM(){document.querySelectorAll('.modal').forEach(m=>m.classList.remove('on'))}
function setActive(id){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById(id).classList.add('active')}

// swipe
let sy=0;
document.addEventListener('touchstart',e=>sy=e.touches[0].clientY);
document.addEventListener('touchend',e=>{
if(document.querySelector('.modal.on'))return;
let d=sy-e.changedTouches[0].clientY;
if(Math.abs(d)>60){if(d>0&&cur<videos.length-1)cur++;if(d<0&&cur>0)cur--;render()}
});
</script>
</body>
</html>
