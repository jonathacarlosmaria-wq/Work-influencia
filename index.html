<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WORK - FOTO VIDEO GALERIA LIVE FINAL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#000;color:#fff;font-family:Arial;height:100dvh;overflow:hidden}
.app{height:100dvh;display:flex;flex-direction:column}
.stage{flex:1;position:relative;background:#000;overflow:hidden;touch-action:none}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
.grad{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.95) 0%,transparent 60%)}
.top{position:absolute;top:10px;left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:10}
.pill{padding:7px 12px;border-radius:20px;font-size:10px;font-weight:900;background:rgba(0,0,0,.7);border:1px solid #333}.pill.on{background:#FFD700;color:#000}
.actions{position:absolute;right:8px;bottom:125px;display:flex;flex-direction:column;gap:14px;z-index:20;width:70px;align-items:center}
.cnt{font-size:9px;font-weight:900;margin-top:3px;background:rgba(0,0,0,.6);padding:2px 6px;border-radius:10px}
.meta{position:absolute;left:10px;bottom:12px;right:84px;z-index:10;background:rgba(0,0,0,.55);padding:10px;border-radius:16px;border:1px solid #333}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:1000;display:none;flex-direction:column}.modal.on{display:flex!important}
#toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#FFD700;color:#000;padding:12px 20px;border-radius:20px;z-index:8000;display:none;font-weight:900;max-width:80%;text-align:center}#toast.on{display:block!important}
.nav{height:115px!important;background:linear-gradient(180deg,#FFE55C,#FFD700,#D4AF37)!important;display:flex;justify-content:space-around;align-items:stretch;border-radius:26px 26px 0 0;margin-top:-16px;z-index:50;border-top:3px solid #FFD700;box-shadow:0 -4px 22px rgba(255,215,0,.5);padding:6px 4px 10px 4px}
.tab{color:#000;font-size:13px;font-weight:900;text-align:center;border-radius:18px;min-width:62px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;margin:0 3px;height:100%;background:rgba(0,0,0,.08);border:1.5px solid rgba(0,0,0,.1)}
.tab.on{background:#000!important;color:#FFD700!important;border:2px solid #000}
.tab div:first-child{font-size:30px!important;line-height:1;margin-bottom:4px}
.create{width:78px;height:78px;background:#000;border-radius:22px;display:flex;align-items:center;justify-content:center;border:3px solid #000;box-shadow:0 6px 20px rgba(0,0,0,.5),0 0 25px rgba(255,215,0,.7);margin:0 4px;align-self:center}
.create span{background:linear-gradient(145deg,#FFE55C,#FFD700,#D4AF37);color:#000;width:100%;height:100%;display:flex;align-items:center;justify-content:center;border-radius:18px;font-size:42px;font-weight:900}
.abtn{width:56px;height:56px;border-radius:18px;background:#1e1e1e;border:1.5px solid #D4AF37;display:flex;align-items:center;justify-content:center;font-size:22px}
.btn-gold{background:linear-gradient(145deg,#FFE55C,#FFD700,#D4AF37)!important;color:#000!important;border:2px solid #FFD700!important;font-weight:900}
.input{width:100%;background:#111;border:1px solid #333;padding:11px;border-radius:12px;color:#fff;margin-top:7px}
#cam{position:fixed;inset:0;background:#000;z-index:9999;display:none;flex-direction:column}
#camEl{flex:1;width:100%;height:100%;object-fit:cover;background:#111}
.cam-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:14px;z-index:10;background:linear-gradient(180deg,rgba(0,0,0,.8),transparent)}
.cam-modes{position:absolute;bottom:105px;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:10}
.cam-modes button{padding:10px 14px;border-radius:20px;font-weight:900;font-size:11px;border:1.5px solid #fff}
.cam-bottom{position:absolute;bottom:0;left:0;right:0;padding:14px 10px 22px;display:flex;gap:8px;align-items:center;z-index:10;background:linear-gradient(0deg,rgba(0,0,0,.9),transparent)}
.progress{position:absolute;bottom:0;left:0;height:5px;background:#FFD700;transition:.2s;z-index:20}
.galBtn{width:52px;height:52px;border-radius:50%;border:2px solid #FFD700;background:rgba(255,215,0,.25);color:#FFD700;font-size:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 12px rgba(255,215,0,.5)}
</style>
</head>
<body>
<div id="toast"></div>
<div class="app"><div class="stage" id="stage"></div>
<div class="nav">
<div class="tab on" onclick="goHome()"><div>🏠</div>Início</div>
<div class="tab" onclick="goMy()"><div>◧</div>Meus</div>
<div onclick="goCam()"><div class="create"><span>+</span></div></div>
<div class="tab" onclick="goCam(true)"><div>🔴</div>LIVE</div>
<div class="tab" onclick="goProfile()"><div>👤</div>Eu</div>
</div></div>

<div id="cam">
<video id="camEl" autoplay muted playsinline></video>
<canvas id="photoCanvas" style="display:none"></canvas>
<div class="progress" id="camProgress" style="width:0%"></div>
<div class="cam-top">
<button onclick="closeCam()" style="width:42px;height:42px;background:rgba(0,0,0,.7);border:2px solid #fff;border-radius:50%;color:#fff;font-size:20px">✕</button>
<div style="display:flex;flex-direction:column;align-items:center;gap:4px">
<span id="camModeLabel" style="background:#FFD700;color:#000;padding:5px 12px;border-radius:12px;font-size:11px;font-weight:900">📸 FOTO</span>
<span id="camTimer" style="background:#ff0000;padding:6px 14px;border-radius:20px;font-size:11px;font-weight:900;display:none">● 00:00 / 01:30</span>
</div>
<button onclick="postCurrent()" style="background:#fff;color:#000;border:none;padding:10px 18px;border-radius:22px;font-weight:900;font-size:12px">POSTAR</button>
</div>

<div class="cam-modes">
<button id="btnFoto" onclick="setCamMode('foto')" style="background:#FFD700;color:#000;border-color:#000">📸 FOTO</button>
<button id="btnVideo" onclick="setCamMode('video')" style="background:rgba(0,0,0,.6);color:#fff">📹 VÍDEO 1:30</button>
<button id="btnLive" onclick="setCamMode('live')" style="background:rgba(0,0,0,.6);color:#fff">🔴 LIVE 1x/DIA</button>
</div>

<div class="cam-bottom">
<button onclick="flipCam()" style="width:48px;height:48px;border-radius:50%;border:2px solid #FFD700;background:rgba(255,255,255,.2);color:#fff;font-size:20px">🔄</button>
<button class="galBtn" onclick="document.getElementById('galleryInput').click()">🖼️</button>
<input id="descInp" placeholder="Legenda..." style="flex:1;padding:13px 14px;border-radius:24px;background:rgba(0,0,0,.6);border:1.5px solid #FFD700;color:#fff;outline:none;font-size:13px">
<button id="shutterBtn" onclick="captureAction()" style="width:74px;height:74px;background:#fff;border-radius:50%;border:4px solid #000;display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 0 20px rgba(255,215,0,.8)">📸</button>
</div>
</div>

<div class="modal" id="profileM"><div style="flex:1" onclick="closeAll()"></div><div style="position:absolute;bottom:0;left:0;right:0;background:#1e1e1e;border-radius:28px 28px 0 0;padding:16px;border-top:3px solid #FFD700;max-height:94vh;overflow:auto">
<div style="display:flex;justify-content:space-between"><b style="color:#FFD700">👤 PERFIL - GALERIA + CÂMERA</b><span onclick="closeAll()" style="font-size:26px;color:#FFD700">×</span></div>
<div style="text-align:center;padding:12px;background:rgba(0,0,0,.3);border-radius:20px;margin:10px 0">
<div id="avatarBox" style="width:110px;height:110px;margin:0 auto;border-radius:28px;background:#111;border:3px solid #FFD700;display:flex;align-items:center;justify-content:center;overflow:hidden">👤</div>
<h3 id="profileName">Jonatha</h3><p id="profileNick" style="color:#FFD700;font-size:12px">@jonathacarlosmaria</p>
<div style="margin-top:10px;background:rgba(255,215,0,.1);border:1px solid #FFD700;border-radius:12px;padding:10px;text-align:left">
<div style="font-size:11px;color:#fff">📸 Foto câmera/galeria: <span style="color:#FFD700">sem limite</span></div>
<div style="font-size:11px;color:#fff">📹 Vídeo câmera/galeria: <span style="color:#FFD700">1:30 max (corta auto)</span></div>
<div style="font-size:11px;color:#fff">🔴 LIVE câmera: <span style="color:#FFD700" id="liveUsedLabel">0/1 hoje - 0:00/30:00</span></div>
</div>
</div>
<button onclick="pickAvatar()" style="width:100%;padding:10px;border-radius:12px;background:rgba(255,215,0,.12);color:#FFD700;border:1.5px dashed #FFD700;font-weight:800">📸 Trocar Foto</button>
<button onclick="document.getElementById('galleryInput').click()" style="width:100%;margin-top:10px;padding:14px;border-radius:14px;background:linear-gradient(145deg,#FFE55C,#FFD700);color:#000;font-weight:900;border:2px solid #000;font-size:13px">🖼️ ABRIR GALERIA - ESCOLHER FOTO OU VÍDEO (1:30)</button>
<input id="inName" class="input" placeholder="Nome"><input id="inNick" class="input" placeholder="Nick"><button onclick="saveProfile()" class="btn-gold" style="width:100%;padding:12px;border-radius:16px;margin-top:10px">💾 SALVAR</button>
<input type="file" id="galleryInput" accept="image/*,video/*" style="display:none">
<button onclick="resetLiveForTest()" style="width:100%;margin-top:8px;padding:8px;border-radius:10px;background:rgba(255,0,0,.12);color:#ff6b6b;border:1px solid #550000;font-size:10px">Reset LIVE (teste)</button>
</div></div>

<div class="modal" id="myM"><div style="flex:1" onclick="closeAll()"></div><div style="position:absolute;bottom:0;left:0;right:0;background:#1d1d1d;border-radius:28px 28px 0 0;padding:16px;border-top:2px solid #FFD700;max-height:80vh;overflow:auto"><b style="color:#FFD700">✨ Meus</b><span style="float:right" onclick="closeAll()">×</span><div id="myGrid" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:12px"></div></div></div>
<input type="file" id="fileAvatar" accept="image/*" style="display:none">

<script>
let db=null,stream=null,rec=null,chunks=[],cur=0,facing='user',isFollowing=false,camMode='foto',photoData=null,camTimerInt=null,camStartTime=0,isLiveMode=false;
const VIDEO_MAX=90*1000, LIVE_MAX=30*60*1000;
let allVideos=[{id:1,desc:"FOTO + VIDEO 1:30 GALERIA + LIVE 1x 30min",img:"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?q=80&w=1000",likes:230,share:20,type:'foto'}];
function toast(t){let e=document.getElementById('toast');e.innerText=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),3200)}
function closeAll(){document.querySelectorAll('.modal').forEach(m=>{m.classList.remove('on');m.style.display='none'})}
function goHome(){closeAll();render()}
function goMy(){loadAll().then(vs=>{document.getElementById('myGrid').innerHTML=vs.map(v=>{if(v.type==='foto'||(v.data&&v.data.startsWith('data:image')))return `<img src="${v.data}" style="width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:12px">`;return `<video src="${v.data}" style="width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:12px"></video>`}).join('')||'<div style="color:#888">Nenhum</div>';document.getElementById('myM').classList.add('on');document.getElementById('myM').style.display='flex';});}
function goProfile(){let c=JSON.parse(localStorage.getItem('work_current_user')||'null');if(!c){c={id:1,nick:'jonathacarlosmaria',name:'Jonatha'};localStorage.setItem('work_current_user',JSON.stringify(c));}document.getElementById('inName').value=c.name;document.getElementById('inNick').value=c.nick;document.getElementById('profileName').innerText=c.name;document.getElementById('profileNick').innerText='@'+c.nick;if(c.avatar)document.getElementById('avatarBox').innerHTML=`<img src="${c.avatar}" style="width:100%;height:100%;object-fit:cover">`;updateLiveLabel();document.getElementById('profileM').classList.add('on');document.getElementById('profileM').style.display='flex';}
function saveProfile(){let c=JSON.parse(localStorage.getItem('work_current_user'));c.name=document.getElementById('inName').value;c.nick=document.getElementById('inNick').value;localStorage.setItem('work_current_user',JSON.stringify(c));toast('✅ Salvo');render();}
function render(){let v=allVideos[cur];let c=JSON.parse(localStorage.getItem('work_current_user')||'null');let avatar=c&&c.avatar?c.avatar:v.img||v.data;let media=v.type==='foto'||(v.data&&v.data.startsWith('data:image'))?`<div class="bg" style="background-image:url('${v.data||v.img}')"></div>`:(v.data?`<video src="${v.data}" autoplay loop muted playsinline style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"></video>`:`<div class="bg" style="background-image:url('${v.img}')"></div>`);document.getElementById('stage').innerHTML=`${media}<div class="grad"></div><div class="top"><div class="pill">${cur+1}/${allVideos.length}</div><div class="pill on">${v.type==='foto'?'📸 FOTO':(v.isLive?'🔴 LIVE 1x':'📹 1:30')}</div></div><div class="actions"><div style="position:relative;width:58px;height:58px;margin-bottom:6px" onclick="toggleFollow()"><div style="width:56px;height:56px;border-radius:50%;border:3px solid #FFD700;overflow:hidden"><img src="${avatar}" style="width:100%;height:100%;object-fit:cover"></div><div style="position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:24px;height:24px;background:${isFollowing?'#000':'#FF3B30'};border:2px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px">${isFollowing?'✓':'+'}</div></div><div onclick="like()"><div class="abtn">❤️</div><div class="cnt">${v.likes||0}</div></div><div onclick="share()"><div class="abtn">🔗</div><div class="cnt">${v.share||0}</div></div></div><div class="meta"><div style="font-weight:700">${v.desc}</div><div style="font-size:10px;color:#FFD700">Foto livre | Vídeo 1:30 | LIVE 30min 1x/dia</div></div>`;}
function like(){allVideos[cur].likes=(allVideos[cur].likes||0)+1;render();toast('❤️')}function share(){toast('🔗 Copiado')}function toggleFollow(){isFollowing=!isFollowing;render();toast(isFollowing?'✅ Seguindo':'❌')}
function getLiveInfo(){let today=new Date().toDateString();let d=localStorage.getItem('work_live_date');let c=parseInt(localStorage.getItem('work_live_count')||'0');let u=parseInt(localStorage.getItem('work_live_used')||'0');if(d!==today){localStorage.setItem('work_live_date',today);localStorage.setItem('work_live_count','0');localStorage.setItem('work_live_used','0');return{count:0,used:0}}return{count:c,used:u}}
function canDoLive(){let i=getLiveInfo();if(i.count>=1)return{ok:false,msg:'🚫 Você já fez sua LIVE hoje! Só 1 por dia. Volta amanhã 🔴'};return{ok:true,remaining:LIVE_MAX-i.used}}
function registerLive(){localStorage.setItem('work_live_date',new Date().toDateString());let c=parseInt(localStorage.getItem('work_live_count')||'0')+1;localStorage.setItem('work_live_count',c.toString());updateLiveLabel()}
function addLiveTime(ms){let u=parseInt(localStorage.getItem('work_live_used')||'0')+ms;localStorage.setItem('work_live_used',u.toString());updateLiveLabel()}
function updateLiveLabel(){let i=getLiveInfo();let m=Math.floor(i.used/60000);let s=Math.floor((i.used%60000)/1000);let el=document.getElementById('liveUsedLabel');if(el)el.innerText=`${i.count}/1 hoje - ${m}:${String(s).padStart(2,'0')}/30:00`;}
function resetLiveForTest(){localStorage.setItem('work_live_count','0');localStorage.setItem('work_live_used','0');updateLiveLabel();toast('🔄 LIVE resetada')}
function formatTime(ms){let t=Math.floor(ms/1000);let m=Math.floor(t/60);let s=t%60;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function setCamMode(mode){
 camMode=mode; photoData=null;
 document.getElementById('btnFoto').style.background=mode==='foto'?'#FFD700':'rgba(0,0,0,.6)';
 document.getElementById('btnVideo').style.background=mode==='video'?'#FFD700':'rgba(0,0,0,.6)';
 document.getElementById('btnLive').style.background=mode==='live'?'#ff0000':'rgba(0,0,0,.6)';
 document.getElementById('btnFoto').style.color=mode==='foto'?'#000':'#fff';
 document.getElementById('btnVideo').style.color=mode==='video'?'#000':'#fff';
 let label=document.getElementById('camModeLabel'),timer=document.getElementById('camTimer'),shutter=document.getElementById('shutterBtn'),progress=document.getElementById('camProgress');
 if(camTimerInt){clearInterval(camTimerInt);camTimerInt=null} progress.style.width='0%';
 if(mode==='foto'){label.innerText='📸 FOTO';timer.style.display='none';shutter.innerText='📸';progress.style.background='#FFD700';if(rec){try{rec.stop()}catch{}}}
 if(mode==='video'){label.innerText='📹 VIDEO 1:30';timer.style.display='block';shutter.innerText='⏺️';progress.style.background='#FFD700';startRec(false)}
 if(mode==='live'){let chk=canDoLive();if(!chk.ok){toast(chk.msg);setCamMode('foto');return} label.innerText='🔴 LIVE 1x 30min';timer.style.display='block';shutter.innerText='🔴';progress.style.background='#ff0000';startRec(true)}
}
function captureAction(){
 if(camMode==='foto'){let v=document.getElementById('camEl');let c=document.getElementById('photoCanvas');c.width=v.videoWidth||720;c.height=v.videoHeight||1280;c.getContext('2d').drawImage(v,0,0,c.width,c.height);photoData=c.toDataURL('image/jpeg',0.85);toast('📸 Foto capturada! POSTAR');document.getElementById('shutterBtn').innerText='✅';if(navigator.vibrate)navigator.vibrate(60);}
 else{toast(camMode==='live'?'🔴 LIVE gravando... POSTAR encerra':'📹 Gravando 1:30... POSTAR finaliza');}
}
function goCam(isLive=false){document.getElementById('cam').style.display='flex';navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:true}).then(s=>{stream=s;document.getElementById('camEl').srcObject=s;setCamMode(isLive?'live':'foto');}).catch(()=>toast('❌ Permita câmera'));}
function startRec(isLive){
 isLiveMode=isLive; chunks=[]; if(stream){rec=new MediaRecorder(stream,{mimeType:'video/webm'});rec.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data)};rec.start(200);camStartTime=Date.now();if(isLive)registerLive();
  camTimerInt=setInterval(()=>{let elapsed=Date.now()-camStartTime;let limit=isLive?LIVE_MAX:VIDEO_MAX;let remain=limit-elapsed;if(remain<0)remain=0;document.getElementById('camTimer').innerText=isLive?`🔴 ${formatTime(elapsed)} / 30:00`:`● ${formatTime(elapsed)} / 01:30`;document.getElementById('camProgress').style.width=`${Math.min(100,(elapsed/limit)*100)}%`;if(!isLive&&elapsed>=VIDEO_MAX){toast('⏱️ 1:30!');postCurrent();return}if(isLive&&elapsed>=limit){toast('⏱️ LIVE 30min fim!');postCurrent();return}},200);
 }
}
function closeCam(){if(camTimerInt){clearInterval(camTimerInt);camTimerInt=null}if(isLiveMode&&camStartTime){let el=Date.now()-camStartTime;if(el>1000)addLiveTime(el)}if(rec){try{rec.stop()}catch{}rec=null}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}document.getElementById('cam').style.display='none';document.getElementById('camProgress').style.width='0%';photoData=null}
function flipCam(){facing=facing==='user'?'environment':'user';if(stream)stream.getTracks().forEach(t=>t.stop());navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:true}).then(s=>{stream=s;document.getElementById('camEl').srcObject=s;});}
function postCurrent(){
 if(camMode==='foto'){if(!photoData){toast('📸 Tire foto!');return}let tx=db.transaction('videos','readwrite');let vid={id:Date.now(),data:photoData,desc:document.getElementById('descInp').value||'Foto câmera 📸',type:'foto',likes:0,share:0};tx.objectStore('videos').add(vid);tx.oncomplete=()=>{allVideos.unshift({id:vid.id,desc:vid.desc,data:vid.data,type:'foto',likes:0,share:0});closeCam();document.getElementById('descInp').value='';toast('✅ Foto postada!');render()}}
 else{if(!rec||chunks.length===0){toast('❌ Grave');return}if(camTimerInt){clearInterval(camTimerInt);camTimerInt=null}let elapsed=Date.now()-camStartTime;if(isLiveMode)addLiveTime(elapsed);rec.stop();let blob=new Blob(chunks,{type:'video/webm'});let r=new FileReader();r.onload=e=>{let tx=db.transaction('videos','readwrite');let vid={id:Date.now(),data:e.target.result,desc:document.getElementById('descInp').value||(isLiveMode?'LIVE 30min 🔴':'Vídeo 1:30 📹'),type:isLiveMode?'live':'video',isLive:isLiveMode,duration:elapsed,likes:0,share:0};tx.objectStore('videos').add(vid);tx.oncomplete=()=>{allVideos.unshift({id:vid.id,desc:vid.desc,data:vid.data,type:vid.type,isLive:vid.isLive,likes:0,share:0});closeCam();document.getElementById('descInp').value='';chunks=[];toast(isLiveMode?'✅ LIVE salva! 1x/dia':'✅ Vídeo 1:30 postado!');render()}};r.readAsDataURL(blob);}
}
function initDB(){return new Promise(r=>{let q=indexedDB.open('WorkDB_FOTO_GALERIA_FINAL',1);q.onupgradeneeded=e=>e.target.result.createObjectStore('videos',{keyPath:'id'});q.onsuccess=e=>{db=e.target.result;r()}})}
function loadAll(){return new Promise(r=>{if(!db)return r([]);let tx=db.transaction('videos','readonly');let req=tx.objectStore('videos').getAll();req.onsuccess=()=>r(req.result)})}
function pickAvatar(){document.getElementById('fileAvatar').click()}
document.getElementById('fileAvatar').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=ev=>{let b64=ev.target.result;let c=JSON.parse(localStorage.getItem('work_current_user')||'{}');c.avatar=b64;localStorage.setItem('work_current_user',JSON.stringify(c));document.getElementById('avatarBox').innerHTML=`<img src="${b64}" style="width:100%;height:100%;object-fit:cover">`;render();};rd.readAsDataURL(f);});
document.getElementById('galleryInput').addEventListener('change',e=>{
 let f=e.target.files[0];if(!f)return;
 if(f.type.startsWith('video/')){
  let vid=document.createElement('video');vid.preload='metadata';vid.onloadedmetadata=()=>{
   URL.revokeObjectURL(vid.src);
   if(vid.duration>90)toast(`✂️ Vídeo ${Math.floor(vid.duration)}s será limitado a 1:30`);
   let rd=new FileReader();rd.onload=ev=>{
    let tx=db.transaction('videos','readwrite');let obj={id:Date.now(),data:ev.target.result,desc:'Vídeo galeria (1:30 max) 📹',type:'video',likes:0,share:0,duration:Math.min(vid.duration,90)*1000};tx.objectStore('videos').add(obj);tx.oncomplete=()=>{allVideos.unshift({id:obj.id,desc:obj.desc,data:obj.data,type:'video',likes:0,share:0});toast('✅ Vídeo galeria 1:30 postado!');render();closeAll();}};rd.readAsDataURL(f);
  };vid.src=URL.createObjectURL(f);
 }else{
  let rd=new FileReader();rd.onload=ev=>{let tx=db.transaction('videos','readwrite');let obj={id:Date.now(),data:ev.target.result,desc:'Foto galeria 📸',type:'foto',likes:0,share:0};tx.objectStore('videos').add(obj);tx.oncomplete=()=>{allVideos.unshift({id:obj.id,desc:obj.desc,data:obj.data,type:'foto',likes:0,share:0});toast('✅ Foto galeria postada!');render();closeAll();}};rd.readAsDataURL(f);
 }
});
let sy=0;const st=document.getElementById('stage');st.addEventListener('touchstart',e=>{sy=e.touches[0].clientY},{passive:true});st.addEventListener('touchend',e=>{let d=sy-e.changedTouches[0].clientY;if(Math.abs(d)>60){if(d>0)cur=(cur+1)%allVideos.length;else cur=(cur-1+allVideos.length)%allVideos.length;render();}},{passive:true});
initDB().then(async()=>{let saved=await loadAll();saved.reverse().forEach(v=>{allVideos.unshift({id:v.id,desc:v.desc,data:v.data,type:v.type||'video',isLive:v.isLive,likes:0,share:0})});render();if(!localStorage.getItem('work_current_user')){let u={id:1,nick:'jonathacarlosmaria',name:'Jonatha'};localStorage.setItem('work_current_user',JSON.stringify(u));}updateLiveLabel();});
</script>
