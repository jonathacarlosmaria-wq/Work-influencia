<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WORK GOLD V51 NORMAL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center;height:100dvh;overflow:hidden}
.app{width:100%;max-width:420px;height:100dvh;background:#000;position:relative;display:flex;flex-direction:column}
.stage{flex:1;position:relative;background:#000;overflow:hidden}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;background-color:#111}
.shadow{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.1) 0%,transparent 35%,rgba(0,0,0,.4) 70%,rgba(0,0,0,.9) 100%)}
.top{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:10;background:#1a1a1a;border:1.5px solid #FFD700;border-radius:100px;padding:4px;display:flex;gap:6px}
.pill{padding:8px 16px;border-radius:100px;font-size:12px;font-weight:900;color:#888}.pill.on{background:#FFD700;color:#000}
.live{position:absolute;top:12px;right:12px;z-index:10;background:#1a1a1a;border:1.5px solid #FFD700;color:#FFD700;padding:5px 10px;border-radius:100px;font-size:10px;font-weight:900}
.right{position:absolute;right:8px;bottom:110px;z-index:20;display:flex;flex-direction:column;gap:16px;align-items:center}
.btn{width:50px;height:50px;border-radius:50%;background:#1f1f1f;border:1.8px solid #FFD700;display:flex;align-items:center;justify-content:center;font-size:20px}
.num{font-size:11px;font-weight:900;margin-top:4px;color:#fff}
.bottom{position:absolute;left:10px;right:75px;bottom:18px;z-index:10}
.card{background:rgba(20,20,20,.85);border:1px solid rgba(255,215,0,.35);border-radius:14px;padding:10px}
.nav{height:62px;min-height:62px;background:#0c0c0c;border-top:1.5px solid #FFD700;display:flex;justify-content:space-around;align-items:center;z-index:30}
.ntab{color:#666;font-size:9px;font-weight:900;text-align:center;flex:1}.ntab.on{color:#FFD700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:999;display:none;max-width:420px;left:50%;transform:translateX(-50%);align-items:flex-end}.modal.on{display:flex}
.box{background:#151515;border-top:2.5px solid #FFD700;border-radius:20px 20px 0 0;width:100%;max-height:78vh;display:flex;flex-direction:column}
.list{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.input-bar{padding:10px;background:#0f0f0f;border-top:1.5px solid #FFD700;display:flex;gap:8px;align-items:center;padding-bottom:18px}
.inp{flex:1;background:#222;border:1.5px solid #FFD700;border-radius:100px;padding:13px 16px;color:#fff;font-size:16px;outline:none}
.send{padding:12px 20px;border-radius:100px;background:#FFD700;color:#000;font-weight:900;border:none}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#FFD700;color:#000;padding:10px 16px;border-radius:100px;font-weight:900;display:none;z-index:10000}.toast.on{display:block}
</style>
</head>
<body>
<div id="toast" class="toast"></div>
<div class="app">
<div class="stage" id="stage">
<div class="bg" id="bg"></div><div class="shadow"></div>
<div class="top"><div class="pill">Seguindo</div><div class="pill on">Para você</div></div>
<div class="live">🔴 LIVE</div>

<div class="right">
<div onclick="like()" style="text-align:center"><div class="btn" id="bL">🤍</div><div class="num" id="nL">120.3K</div></div>
<div onclick="openC()" style="text-align:center"><div class="btn" style="background:#FFD700;color:#000;border-color:#000">💬</div><div class="num" id="nC">3</div></div>
<div onclick="save()" style="text-align:center"><div class="btn" id="bS">🔖</div><div class="num" id="nS">Salvar</div></div>
<div onclick="share()" style="text-align:center"><div class="btn">↗</div><div class="num">Share</div></div>
</div>

<div class="bottom"><div class="card"><div style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><div style="width:32px;height:32px;border-radius:50%;background:#222;border:2px solid #FFD700;display:flex;align-items:center;justify-content:center;color:#FFD700;font-weight:900" id="uP">L</div><div style="color:#FFD700;font-weight:900;font-size:13px" id="uN">@lux.studio</div></div><div style="font-size:12px;line-height:1.3" id="uD">Golden city views at sunset ✨ #gold</div></div></div>
</div>
<div class="nav">
<div class="ntab on">⌂<br>Início</div>
<div class="ntab">⌕<br>Buscar</div>
<div class="ntab"><div style="width:44px;height:44px;border-radius:50%;background:#000;border:2px solid #FFD700;display:flex;align-items:center;justify-content:center;color:#FFD700;font-size:22px;margin:0 auto">+</div></div>
<div class="ntab">◎<br>LIVE</div>
<div class="ntab">👑<br>Eu</div>
</div>
</div>

<div class="modal" id="mC">
<div style="flex:1" onclick="closeM()"></div>
<div class="box">
<div style="padding:12px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2a2a2a">
<div><b style="color:#FFD700" id="cT">💬 3 comentários</b><div style="font-size:10px;color:#888">@lux.studio</div></div>
<button onclick="closeM()" style="width:30px;height:30px;border-radius:50%;background:#222;border:1px solid #FFD700;color:#FFD700">×</button>
</div>
<div class="list" id="cL"></div>
<div class="input-bar">
<input id="cI" class="inp" placeholder="Escreva um comentário...">
<button class="send" onclick="sendC()">Enviar</button>
</div>
</div>
</div>

<script>
let cur=0;
let posts=[
{img:"https://images.unsplash.com/photo-1514565131-fce0801e5785?q=80&w=1000",desc:"Golden city views at sunset ✨ #gold #luxury",owner:"lux.studio",likes:120300,liked:false,saved:false,coms:["Lindo demais! 😍","Gold vibes ✨","Top 👑"]},
{img:"https://images.unsplash.com/photo-1506905925346-21bda4d32df4?q=80&w=1000",desc:"Sunset Gold perfeito 👑 #golden",owner:"gold.travel",likes:89200,liked:false,saved:false,coms:["Que vista!","Perfeito"]},
];
const $=id=>document.getElementById(id);
function toast(t){$('toast').innerText=t;$('toast').classList.add('on');setTimeout(()=>$('toast').classList.remove('on'),2000)}
function closeM(){$('mC').classList.remove('on')}
function fmt(n){return n>=1000?(n/1000).toFixed(1).replace('.0','')+'K':n}
function load(){
try{let b=JSON.parse(localStorage.getItem('v51')||'[]');if(b.length)posts=b}catch{}
let p=posts[cur];
$('bg').style.backgroundImage=`url('${p.img}')`;
$('uN').innerText='@'+p.owner;
$('uD').innerText=p.desc;
$('uP').innerText=p.owner[0].toUpperCase();
$('nL').innerText=fmt(p.likes);
$('nC').innerText=p.coms.length;
$('bL').innerText=p.liked?'💛':'🤍';
$('bS').innerText=p.saved?'⭐':'🔖';
$('nS').innerText=p.saved?'Salvo':'Salvar';
$('cT').innerText=`💬 ${p.coms.length} comentários`;
$('cL').innerHTML=p.coms.map((c,i)=>`<div style="display:flex;gap:8px"><div style="width:26px;height:26px;border-radius:50%;background:#FFD700;color:#000;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:10px">${i+1}</div><div style="flex:1;background:#222;border-radius:10px;padding:8px 10px"><b style="color:#FFD700;font-size:11px">@gold_${i+1}</b><div style="font-size:12px;margin-top:2px">${c}</div></div></div>`).join('');
localStorage.setItem('v51',JSON.stringify(posts));
}
function like(){let p=posts[cur];p.liked=!p.liked;p.likes+=p.liked?1:-1;load();toast(p.liked?'💛 Curtiu!':'Descurtiu')}
function save(){let p=posts[cur];p.saved=!p.saved;load();toast(p.saved?'⭐ Salvo!':'Removido')}
function share(){navigator.clipboard.writeText(location.href).then(()=>toast('🔗 Link copiado!'))}
function openC(){load();$('mC').classList.add('on');setTimeout(()=>$('cI').focus(),150)}
function sendC(){let i=$('cI');let t=i.value.trim();if(!t)return;posts[cur].coms.push(t);i.value='';load();openC();toast('Enviado ✨')}

$('cI').addEventListener('keydown',e=>{if(e.key==='Enter')sendC()});
let sy=0;$('stage').addEventListener('touchstart',e=>sy=e.touches[0].clientY,{passive:true});
$('stage').addEventListener('touchend',e=>{let d=sy-e.changedTouches[0].clientY;if(Math.abs(d)>60){if(d>0){cur++;if(cur>=posts.length)cur=0}else{cur--;if(cur<0)cur=posts.length-1}load()}},{passive:true});
load();
</script>
</body>
</html>
