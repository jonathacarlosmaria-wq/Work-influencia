<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WORK V36.1 OFICIAL - LIVE TEMPO FIX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#000;overflow:hidden;display:flex;justify-content:center;font-family:system-ui,Arial}
.app{width:100%;max-width:440px;height:100dvh;background:#000;position:relative;display:flex;flex-direction:column;overflow:hidden}
.stage{flex:1;width:100%;position:relative;background:#000;overflow:hidden;touch-action:pan-y}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
.vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,transparent 30%,transparent 62%,rgba(0,0,0,.92) 100%)}
.top{position:absolute;top:0;left:0;right:0;height:46px;display:flex;align-items:center;justify-content:center;gap:20px;z-index:30}
.t-tab{color:rgba(255,255,255,.55);font-size:14.5px;font-weight:600;padding:6px 0;border-bottom:2.5px solid transparent;cursor:pointer}
.t-tab.on{color:#fff;border-color:#fff;font-weight:800}
.live{position:absolute;top:54px;left:10px;z-index:20;background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.2);padding:6px 12px;border-radius:20px;font-size:10px;font-weight:900;display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;background:#ff2c55;border-radius:50%;animation:b 1s infinite}@keyframes b{50%{opacity:.3}}
.right{position:absolute;right:8px;bottom:88px;z-index:30;display:flex;flex-direction:column;gap:18px;align-items:center;width:62px}
.act{width:62px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.abtn{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.18);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;font-size:24px;position:relative;overflow:hidden;flex-shrink:0}
.abtn img{width:100%;height:100%;object-fit:cover;display:block}
.abtn.follow{border:2.8px solid #FFD700;background:#111}
.cnt{font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 6px #000;text-align:center}
.badge{position:absolute;bottom:-3px;left:50%;transform:translateX(-50%);width:20px;height:20px;border-radius:50%;border:2px solid #000;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900}
.badge.plus{background:#fe2c55;color:#fff}
.badge.ok{background:#00e676;color:#fff}
.bot{position:absolute;left:12px;right:80px;bottom:12px;z-index:20;color:#fff;pointer-events:none}
.bot *{pointer-events:auto}
.urow{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.upic{width:40px;height:40px;border-radius:50%;border:2px solid #fff;object-fit:cover;background:#222;flex-shrink:0;display:block}
.uname{font-weight:800;font-size:14px}
.fmini{margin-left:8px;padding:5px 12px;border-radius:18px;font-size:11px;font-weight:900;border:1.5px solid #fff;cursor:pointer}
.fmini.follow{background:transparent;color:#fff}
.fmini.following{background:#fff;color:#000}
.desc{font-size:13px;line-height:1.32;opacity:.96;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.music{margin-top:6px;font-size:11px;opacity:.85;display:flex;gap:5px;align-items:center}
.prog{position:absolute;bottom:0;left:0;height:3px;background:#fe2c55;z-index:40}
.nav{height:68px;min-height:68px;flex-shrink:0;background:#000;border-top:1px solid #1e1e1e;display:flex;align-items:center;justify-content:space-around;z-index:50;width:100%}
.ntab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:#555;font-size:9px;font-weight:700;cursor:pointer;justify-content:center;height:100%}
.ntab.on{color:#fff}
.ntab div:first-child{font-size:22px;line-height:1}
.nplus{width:44px;height:28px;background:#fff;border-radius:7px;display:flex;align-items:center;justify-content:center;position:relative}
.nplus span{color:#000;font-weight:900;font-size:20px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:1000;display:none;flex-direction:column}.modal.on{display:flex!important}
#toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;color:#000;padding:11px 20px;border-radius:22px;font-weight:800;font-size:12px;z-index:9000;display:none}#toast.on{display:block}
.input{width:100%;background:#1c1c1e;border:1px solid #2c2c2e;padding:12px;border-radius:12px;color:#fff;margin-top:8px;font-size:13px;outline:none}
#cam{position:fixed;inset:0;background:#000;z-index:9999;display:none;flex-direction:column;width:100%;max-width:440px;left:50%;transform:translateX(-50%)}
#camEl{flex:1;width:100%;object-fit:cover;background:#111}
#liveM{position:fixed;inset:0;background:#000;z-index:9998;display:none;flex-direction:column;width:100%;max-width:440px;left:50%;transform:translateX(-50%)}
.heart{position:absolute;font-size:86px;animation:pop.9s forwards;pointer-events:none;z-index:80}@keyframes pop{0%{transform:translate(-50%,-50%) scale(0);opacity:0}15%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{transform:translate(-50%,-85%) scale(1);opacity:0}}
.bounce{animation:bou.45s}@keyframes bou{50%{transform:scale(1.3)}}
</style>
</head>
<body>
<div id="toast"></div>
<div class="app">
<div class="stage" id="stage"></div>

<div class="nav">
<div class="ntab on" onclick="goHome()"><div>🏠</div>Início</div>

</div>
</div>

<div id="adminBar" style="position:fixed;top:56px;left:calc(50% - 210px);z-index:700;display:flex;flex-direction:column;gap:5px;pointer-events:none">
<div style="pointer-events:auto;display:flex;flex-direction:column;gap:5px">
<button onclick="openAdmin()" style="padding:7px 12px;border-radius:18px;background:#fe2c55;color:#fff;font-weight:900;border:2px solid #fff;font-size:9px;cursor:pointer">👑 <span id="onlineCount">0</span> ONLINE</button>
<div style="background:rgba(0,0,0,.75);padding:4px 8px;border-radius:10px;font-size:8px;color:#FFD700;border:1px solid rgba(255,255,255,.2);font-weight:800">👤 <span id="currentNick">@jonatha</span> • <span id="followCount">0</span></div>
</div>
</div>

<div id="cam"><video id="camEl" autoplay muted playsinline></video><canvas id="photoCanvas" style="display:none"></canvas><div style="position:absolute;top:0;left:0;right:0;padding:10px;display:flex;justify-content:space-between;z-index:10;background:linear-gradient(180deg,rgba(0,0,0,.7),transparent)"><button onclick="closeAll()" style="width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);color:#fff">✕</button><div id="camL" style="background:#fff;color:#000;padding:5px 12px;border-radius:14px;font-size:10px;font-weight:900">FOTO HD</div><button onclick="postNow()" style="background:#fe2c55;color:#fff;border:none;padding:7px 16px;border-radius:18px;font-weight:900;font-size:11px">Postar</button></div><div style="position:absolute;bottom:88px;left:0;right:0;display:flex;justify-content:center;gap:7px;z-index:10"><button id="bF" onclick="setM('foto')" style="padding:7px 14px;border-radius:18px;background:#fff;color:#000;font-weight:800;border:none;font-size:10px">FOTO</button><button id="bV" onclick="setM('video')" style="padding:7px 14px;border-radius:18px;background:rgba(255,255,255,.15);color:#fff;font-weight:800;border:1px solid rgba(255,255,255,.2);font-size:10px">VÍDEO 60s</button><button id="bL" onclick="setM('live')" style="padding:7px 14px;border-radius:18px;background:rgba(255,255,255,.15);color:#fff;font-weight:800;border:1px solid rgba(255,255,255,.2);font-size:10px">LIVE</button></div><div style="position:absolute;bottom:0;left:0;right:0;padding:12px;display:flex;align-items:center;gap:10px;background:linear-gradient(0deg,#000,transparent)"><input id="descInp" placeholder="Legenda #hashtags..." style="flex:1;padding:11px 14px;border-radius:22px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:11px"><button id="shut" onclick="cap()" style="width:66px;height:66px;border-radius:50%;background:#fff;border:4px solid rgba(255,255,255,.25);font-size:22px;flex-shrink:0">📸</button><button onclick="openGal()" style="width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);color:#fff">🖼️</button></div><div id="recP" style="position:absolute;bottom:0;left:0;height:4px;background:#fe2c55;width:0%"></div></div>

<div id="liveM">
<video id="liveV" style="width:100%;height:100%;object-fit:cover" autoplay muted playsinline></video>
<div style="position:absolute;top:0;left:0;right:0;padding:10px;display:flex;justify-content:space-between;z-index:10;background:linear-gradient(180deg,rgba(0,0,0,.7),transparent)">
<div style="display:flex;gap:6px;align-items:center">
<div style="background:#fe2c55;padding:6px 12px;border-radius:6px;font-weight:900;font-size:10px;display:flex;gap:5px;align-items:center;border:1px solid #fff"><div class="dot"></div>AO VIVO</div>
<div id="liveT" style="background:#000;padding:6px 12px;border-radius:16px;font-size:13px;font-weight:900;border:1px solid #fff;min-width:60px;text-align:center;color:#fff">00:00</div>
</div>
<button onclick="closeAll()" style="width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.6);border:none;color:#fff;font-size:16px">✕</button>
</div>
<div id="liveI" style="position:absolute;top:56px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);padding:8px 14px;border-radius:20px;font-size:11px;font-weight:800;z-index:10;border:1.5px solid #FFD700;color:#FFD700;text-align:center;white-space:nowrap;min-width:200px">Clique no ● para começar</div>
<div style="position:absolute;top:94px;left:50%;transform:translateX(-50%);width:200px;height:4px;background:rgba(255,255,255,.25);border-radius:2px;z-index:10;overflow:hidden">
<div id="liveBar" style="height:100%;width:0%;background:#fe2c55;transition:width 1s linear"></div>
</div>
<button id="liveB" onclick="togLive()" style="position:absolute;bottom:24px;left:50%;transform:translateX(-50%);width:72px;height:72px;border-radius:50%;background:#fe2c55;border:4px solid #fff;color:#fff;font-size:28px;z-index:10">●</button>
</div>

<div class="modal" id="profileM"><div style="flex:1" onclick="closeAll()"></div><div style="background:#121212;border-radius:20px 20px 0 0;padding:14px;max-height:86vh;overflow:auto"><div style="display:flex;justify-content:space-between"><b>Perfil</b><span onclick="closeAll()" style="font-size:20px;cursor:pointer">×</span></div><div style="text-align:center;margin-top:12px"><div style="position:relative;display:inline-block"><img id="pPrev" style="width:88px;height:88px;border-radius:50%;border:3px solid #fff;object-fit:cover;display:none"><div id="pPh" style="width:88px;height:88px;border-radius:50%;background:#222;display:flex;align-items:center;justify-content:center;font-size:32px">👤</div><button onclick="document.getElementById('pInp').click()" style="position:absolute;bottom:0;right:0;width:28px;height:28px;border-radius:50%;background:#fe2c55;border:2px solid #121212;color:#fff;font-weight:900">+</button></div><input type="file" id="pInp" accept="image/*" style="display:none"><div id="pName" style="font-weight:800;margin-top:10px"></div><div id="pNick" style="color:#777;font-size:12px"></div><div style="display:flex;gap:20px;justify-content:center;margin-top:12px"><div style="text-align:center"><div id="pFol" style="font-weight:900;font-size:17px">0</div><div style="font-size:10px;color:#666">Seguidores</div></div><div style="text-align:center"><div id="pFing" style="font-weight:900;font-size:17px">0</div><div style="font-size:10px;color:#666">Seguindo</div></div><div style="text-align:center"><div id="pLikes" style="font-weight:900;font-size:17px">0</div><div style="font-size:10px;color:#666">Curtidas</div></div></div></div><input id="inName" class="input" placeholder="Nome"><input id="inNick" class="input" placeholder="@nick"><button onclick="saveP()" style="width:100%;margin-top:10px;padding:13px;border-radius:12px;background:#fe2c55;color:#fff;font-weight:900;border:none">Salvar</button><input type="file" id="gInp" accept="video/*,image/*" multiple style="display:none"><button onclick="openGal()" style="width:100%;margin-top:8px;padding:11px;border-radius:12px;background:#1e1e1e;color:#fff;font-weight:700;border:1px solid #2a2a2a">🖼️ Galeria</button></div></div>

<div class="modal" id="cM"><div style="flex:1" onclick="closeAll()"></div><div style="background:#121212;border-radius:20px 20px 0 0;padding:12px;max-height:70vh;display:flex;flex-direction:column"><div style="display:flex;justify-content:space-between"><b id="cC">Comentários</b><span onclick="closeAll()" style="cursor:pointer">×</span></div><div id="cL" style="flex:1;overflow:auto;margin-top:10px;display:flex;flex-direction:column;gap:10px"></div><div style="display:flex;gap:8px;margin-top:10px"><input id="cI" class="input" style="flex:1;margin:0" placeholder="Comentar..."><button onclick="sendC()" style="padding:10px 16px;border-radius:20px;background:#fe2c55;color:#fff;font-weight:800;border:none">Enviar</button></div></div></div>

<div class="modal" id="adminM"><div style="flex:1" onclick="closeAll()"></div><div style="background:#0e0e0e;border-radius:20px 20px 0 0;padding:14px;max-height:86vh;overflow:auto;border-top:2px solid #fe2c55"><div style="display:flex;justify-content:space-between"><b style="color:#fe2c55">👑 ADMIN</b><span onclick="closeAll()" style="color:#fe2c55;font-size:20px;cursor:pointer">×</span></div><div id="aS" style="margin-top:10px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px"></div><div id="aO" style="margin-top:10px"></div><div id="aU" style="margin-top:10px"></div></div></div>

<script>
const ADMIN="jonathacarlosmaria";
let db=null,stream=null,cur=0,mode='foto',photoData=null,allVideos=[],rec=null,chunks=[],recT=null,recS=0;
const LIM=1800;
let liveTmr=null,liveS=0,liveRec=false;

function toast(t){let e=document.getElementById('toast');e.innerText=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)}
function closeAll(){document.querySelectorAll('.modal').forEach(m=>m.style.display='none');document.getElementById('cam').style.display='none';document.getElementById('liveM').style.display='none';if(stream){try{stream.getTracks().forEach(x=>x.stop())}catch{} stream=null}clearInterval(recT);clearInterval(liveTmr);document.getElementById('recP').style.width='0%';document.getElementById('liveBar').style.width='0%'}
function getU(){try{let u=JSON.parse(localStorage.getItem('work_current_user')||'{}');if(!u.nick)u={nick:ADMIN,name:"Jonatha",pic:localStorage.getItem('work_owner_pic')||""};return u}catch{return {nick:ADMIN,name:"Jonatha",pic:""}}}
function getPic(n){let me=getU();if(me.nick===n&&me.pic)return me.pic;let us=JSON.parse(localStorage.getItem('work_all_users')||'[]');let f=us.find(x=>x.nick===n);return f&&f.pic?f.pic:""}
function track(){let u=getU();let o=JSON.parse(localStorage.getItem('work_online_users')||'{}');o[u.nick]={name:u.name,nick:u.nick,last:Date.now(),pic:u.pic||""};localStorage.setItem('work_online_users',JSON.stringify(o));up()}
function getOn(){let o=JSON.parse(localStorage.getItem('work_online_users')||'{}');let now=Date.now();return Object.values(o).filter(x=>now-x.last<300000)}
function up(){let on=getOn();document.getElementById('onlineCount').innerText=on.length;document.getElementById('currentNick').innerText='@'+getU().nick;document.getElementById('followCount').innerText=getFollowers(getU().nick).length}
function getFollowers(n){let all=JSON.parse(localStorage.getItem('work_follows')||'{}');let f=[];for(let k in all)if(all[k].includes(n))f.push(k);return f}
function getFollowing(n){return JSON.parse(localStorage.getItem('work_follows')||'{}')[n]||[]}
function isFollowing(t){let me=getU().nick;if(me===t)return false;return getFollowing(me).includes(t)}
function toggleFollow(t){let me=getU().nick;if(me===t){toast('Não pode seguir você');return}let all=JSON.parse(localStorage.getItem('work_follows')||'{}');if(!all[me])all[me]=[];let i=all[me].indexOf(t);if(i>=0){all[me].splice(i,1);toast('Deixou de seguir')}else{all[me].push(t);toast('✅ Seguindo @'+t)}localStorage.setItem('work_follows',JSON.stringify(all));render();up();upd()}
function upd(){let c=getU();document.getElementById('pName').innerText=c.name;document.getElementById('pNick').innerText='@'+c.nick;document.getElementById('pFol').innerText=getFollowers(c.nick).length;document.getElementById('pFing').innerText=getFollowing(c.nick).length;document.getElementById('pLikes').innerText=allVideos.filter(v=>v.owner===c.nick).reduce((s,v)=>s+(v.likes||0),0);let pr=document.getElementById('pPrev');let ph=document.getElementById('pPh');if(c.pic){pr.src=c.pic;pr.style.display='block';ph.style.display='none';document.getElementById('navPic').innerHTML=`<img src="${c.pic}" style="width:22px;height:22px;border-radius:50%;object-fit:cover">`}else{pr.style.display='none';ph.style.display='flex';document.getElementById('navPic').innerText='👤'}}
function goHome(){closeAll();render()}
function goProfile(){let c=getU();document.getElementById('inName').value=c.name;document.getElementById('inNick').value=c.nick;upd();document.getElementById('profileM').style.display='flex'}
function saveP(){let c=getU();c.name=document.getElementById('inName').value.trim()||c.name;c.nick=document.getElementById('inNick').value.trim().replace('@','')||c.nick;localStorage.setItem('work_current_user',JSON.stringify(c));if(c.pic)localStorage.setItem('work_owner_pic',c.pic);let us=JSON.parse(localStorage.getItem('work_all_users')||'[]');let idx=us.findIndex(u=>u.nick===c.nick);if(idx>=0){us[idx].name=c.name;us[idx].pic=c.pic||""}else us.push({nick:c.nick,name:c.name,pic:c.pic||"",created:Date.now()});localStorage.setItem('work_all_users',JSON.stringify(us));track();upd();up();toast('✅ Salvo!');render()}
document.getElementById('pInp').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=ev=>{let c=getU();c.pic=ev.target.result;localStorage.setItem('work_current_user',JSON.stringify(c));localStorage.setItem('work_owner_pic',c.pic);let us=JSON.parse(localStorage.getItem('work_all_users')||'[]');let idx=us.findIndex(u=>u.nick===c.nick);if(idx>=0)us[idx].pic=c.pic;else us.push({nick:c.nick,name:c.name,pic:c.pic});localStorage.setItem('work_all_users',JSON.stringify(us));upd();up();render();toast('📸 Foto no SEGUIR!')};rd.readAsDataURL(f)});
function saveB(){try{let b=allVideos.filter(v=>v.id!==1).slice(0,100).map(v=>({id:v.id,desc:v.desc,data:v.data,type:v.type,owner:v.owner,likes:v.likes,comments:v.commentsList}));localStorage.setItem('work_backup_videos',JSON.stringify(b))}catch{}}
function loadB(){try{return JSON.parse(localStorage.getItem('work_backup_videos')||'[]')}catch{return[]}}
function getUso(){let d=JSON.parse(localStorage.getItem('liveUso')||'{}');if(d.data!==new Date().toDateString())return 0;return d.seg||0}
function saveUso(s){localStorage.setItem('liveUso',JSON.stringify({data:new Date().toDateString(),seg:s}))}
function fmt(n){if(n>=1000000)return (n/1000000).toFixed(1)+'M';if(n>=1000)return (n/1000).toFixed(1)+'K';return n}
function render(){
if(allVideos.length===0) allVideos=[{id:1,desc:"WORK V36.1 OFICIAL - LIVE COM TEMPO FIX! 👑 #work #live",img:"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?q=80&w=1000",type:'foto',owner:ADMIN,likes:22400,commentsList:["Tempo aparecendo!","Live fixada!"],music:"som original"}];
let v=allVideos[cur];
let following=isFollowing(v.owner);
let pic=getPic(v.owner);
let inner=pic?`<img src="${pic}">`:`<div style="width:100%;height:100%;background:#222;display:flex;align-items:center;justify-content:center;font-weight:900">${v.owner[0].toUpperCase()}</div>`;
let badge=following?`<div class="badge ok">✓</div>`:`<div class="badge plus">+</div>`;
let upic=pic?`<img src="${pic}" class="upic">`:`<div class="upic" style="display:flex;align-items:center;justify-content:center;background:#222;font-weight:900">${v.owner[0].toUpperCase()}</div>`;
let media=`<div class="bg" style="background-image:url('${v.data||v.img}')"></div>`;
document.getElementById('stage').innerHTML=`${media}<div class="grad"></div><div class="top"><div class="t-tab">Seguindo</div><div class="t-tab on">Para você</div></div><div class="live"><div class="dot"></div>${Math.floor(Math.random()*800+150)} • @${v.owner}</div><div class="right"><div class="act" onclick="toggleFollow('${v.owner}')"><div class="abtn follow">${inner}${badge}</div></div><div class="act" onclick="like(event)"><div class="abtn" id="lb">❤️</div><div class="cnt">${fmt(v.likes||0)}</div></div><div class="act" onclick="openC()"><div class="abtn">💬</div><div class="cnt">${(v.commentsList||[]).length}</div></div><div class="act" onclick="share()"><div class="abtn">↗️</div><div class="cnt">Share</div></div></div><div class="bot"><div class="urow">${upic}<div class="uname">@${v.owner}</div><div class="fmini ${following?'following':'follow'}" onclick="toggleFollow('${v.owner}')">${following?'Seguindo':'Seguir'}</div></div><div class="desc">${v.desc}</div><div class="music">🎵 ${v.music||'som original'}</div></div>`;
}
function like(e){let v=allVideos[cur];v.likes=(v.likes||0)+1;saveB();let h=document.createElement('div');h.className='heart';h.innerText='❤️';h.style.left=(e.clientX||200)+'px';h.style.top=(e.clientY||300)+'px';document.getElementById('stage').appendChild(h);setTimeout(()=>h.remove(),900);render()}
function openC(){let v=allVideos[cur];document.getElementById('cC').innerText=v.commentsList.length+' comentários';document.getElementById('cL').innerHTML=v.commentsList.map(c=>`<div style="display:flex;gap:8px"><div style="width:28px;height:28px;border-radius:50%;background:#222;display:flex;align-items:center;justify-content:center">👤</div><div><b style="font-size:11px">@user</b><div style="font-size:12px;margin-top:2px">${c}</div></div></div>`).join('');document.getElementById('cM').style.display='flex'}
function sendC(){let i=document.getElementById('cI');let t=i.value.trim();if(!t)return;let v=allVideos[cur];if(!v.commentsList)v.commentsList=[];v.commentsList.push(t);i.value='';saveB();openC();render()}
function share(){navigator.clipboard.writeText(location.href).then(()=>toast('🔗 Link copiado!'))}
function setM(m){mode=m;document.getElementById('bF').style.background=m==='foto'?'#fff':'rgba(255,255,255,.15)';document.getElementById('bF').style.color=m==='foto'?'#000':'#fff';document.getElementById('bV').style.background=m==='video'?'#fff':'rgba(255,255,255,.15)';document.getElementById('bV').style.color=m==='video'?'#000':'#fff';document.getElementById('bL').style.background=m==='live'?'#fe2c55':'rgba(255,255,255,.15)';document.getElementById('camL').innerText=m==='foto'?'FOTO HD':m==='video'?'VÍDEO 60s':'LIVE 30MIN';document.getElementById('shut').innerText=m==='foto'?'📸':'●';document.getElementById('shut').style.background=m==='live'?'#fe2c55':'#fff'}
function goCam(){document.getElementById('cam').style.display='flex';navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true}).then(s=>{stream=s;document.getElementById('camEl').srcObject=s;setM('foto')}).catch(()=>toast('Permita câmera'))}
function cap(){
if(mode==='foto'){let v=document.getElementById('camEl');let c=document.getElementById('photoCanvas');c.width=v.videoWidth||1080;c.height=v.videoHeight||1920;c.getContext('2d').drawImage(v,0,0,c.width,c.height);photoData=c.toDataURL('image/jpeg',0.9);toast('✅ Foto pronta!');document.getElementById('shut').innerText='✅'}
else if(mode==='video'){if(!rec){chunks=[];rec=new MediaRecorder(stream,{mimeType:'video/webm'});rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{let b=new Blob(chunks,{type:'video/webm'});let rd=new FileReader();rd.onload=ev=>{photoData=ev.target.result;toast('✅ Vídeo pronto!')};rd.readAsDataURL(b)};rec.start();recS=0;recT=setInterval(()=>{recS++;document.getElementById('recP').style.width=(recS/60*100)+'%';if(recS>=60){toggleV()}},1000);document.getElementById('shut').innerText='■';document.getElementById('shut').style.background='#fe2c55';toast('🔴 Gravando 60s')}else toggleV()}
else if(mode==='live'){closeAll();openLive()}
}
function toggleV(){if(rec&&rec.state==='recording'){rec.stop();clearInterval(recT);document.getElementById('shut').innerText='✅';document.getElementById('shut').style.background='#fff'}}
function openLive(){
let resta=LIM-getUso();
if(resta<=0){toast('⏰ 30min acabaram hoje!');return}
document.getElementById('liveM').style.display='flex';
navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true}).then(s=>{
stream=s;document.getElementById('liveV').srcObject=s;liveS=0;liveRec=false;
document.getElementById('liveT').innerText='00:00';
document.getElementById('liveBar').style.width='0%';
document.getElementById('liveI').innerText=`Você tem ${Math.floor(resta/60)}:${String(resta%60).padStart(2,'0')} hoje - Clique ●`;
document.getElementById('liveI').style.display='block';
toast('🔴 LIVE com tempo! Aperte ●');
}).catch(()=>toast('Permita câmera'))
}
function togLive(){
let b=document.getElementById('liveB');
let t=document.getElementById('liveT');
let info=document.getElementById('liveI');
let bar=document.getElementById('liveBar');
if(!liveRec){
liveRec=true;b.innerText='■';b.style.background='#fff';b.style.color='#fe2c55';toast('🔴 Gravando - Tempo contando!');
liveTmr=setInterval(()=>{
liveS++;let total=getUso()+liveS;saveUso(total);let falta=LIM-total;
let m=String(Math.floor(liveS/60)).padStart(2,'0');let sc=String(liveS%60).padStart(2,'0');
t.innerText=`${m}:${sc}`;
let faltaM=Math.floor(falta/60);let faltaS=falta%60;
info.innerText=`🔴 Gravando ${m}:${sc} | Resta: ${faltaM}:${String(faltaS).padStart(2,'0')}`;
bar.style.width=(liveS/30)+'%';
if(falta<=0){clearInterval(liveTmr);toast('⏰ 30min!');closeAll()}
},1000);
}else{
liveRec=false;b.innerText='●';b.style.background='#fe2c55';b.style.color='#fff';clearInterval(liveTmr);
info.innerText=`⏸️ Pausado em ${t.innerText} - Clique ● para continuar`;
toast(`⏸️ Pausado ${t.innerText}`);
}
}
function postNow(){let me=getU();if(!photoData){toast('Capture primeiro');return}let obj={id:Date.now(),data:photoData,desc:document.getElementById('descInp').value||'Foto #work',type:mode==='foto'?'foto':'video',likes:0,owner:me.nick,commentsList:[],music:'som original'};allVideos.unshift(obj);saveB();closeAll();document.getElementById('descInp').value='';photoData=null;toast('✅ Postado!');render()}
function openGal(){document.getElementById('gInp').click()}
document.getElementById('gInp').addEventListener('change',e=>{let files=Array.from(e.target.files);files.forEach(f=>{let rd=new FileReader();rd.onload=ev=>{allVideos.unshift({id:Date.now()+Math.random(),data:ev.target.result,desc:f.name,type:f.type.startsWith('video')?'video':'foto',likes:0,owner:getU().nick,commentsList:[],music:'original'});saveB();toast(`✅ Importado!`);render()};rd.readAsDataURL(f)})});
function openAdmin(){if(getU().nick!==ADMIN){toast('Só ADM');return}document.getElementById('adminM').style.display='flex'}
function initDB(){return new Promise(r=>{let q=indexedDB.open('WorkUltra361',36);q.onupgradeneeded=e=>{if(!e.target.result.objectStoreNames.contains('videos'))e.target.result.createObjectStore('videos',{keyPath:'id'})};q.onsuccess=e=>{db=e.target.result;r()};q.onerror=()=>{db=null;r()}})}
function loadAll(){return new Promise(r=>{if(!db){r(loadB());return}try{let tx=db.transaction('videos','readonly');let req=tx.objectStore('videos').getAll();req.onsuccess=()=>{r(req.result.length?req.result:loadB())};req.onerror=()=>r(loadB())}catch{r(loadB())}})}
let sy=0;document.getElementById('stage').addEventListener('touchstart',e=>{sy=e.touches[0].clientY},{passive:true});document.getElementById('stage').addEventListener('touchend',e=>{let d=sy-e.changedTouches[0].clientY;if(Math.abs(d)>60){if(d>0){cur++;if(cur>=allVideos.length)cur=0}else{cur--;if(cur<0)cur=allVideos.length-1}render()}},{passive:true});
initDB().then(async()=>{let saved=await loadAll();saved.reverse().forEach(v=>{allVideos.unshift({id:v.id,desc:v.desc||"",data:v.data||"",type:v.type||'foto',img:v.img||"",likes:v.likes||0,owner:v.owner||ADMIN,commentsList:v.comments||v.commentsList||[],music:v.music||'som original'})});render();if(!localStorage.getItem('work_current_user'))localStorage.setItem('work_current_user',JSON.stringify({nick:ADMIN,name:"Jonatha",pic:localStorage.getItem('work_owner_pic')||""}));track();setInterval(track,25000);upd();up();toast('✅ OFICIAL - LIVE TEMPO FIX!');});
</script>
</body>
</html>
