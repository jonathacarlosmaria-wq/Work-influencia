<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WORK - FINAL DENTRO DA TELA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#000;color:#fff;font-family:Arial;height:100dvh;overflow:hidden}
.app{height:100dvh;display:flex;flex-direction:column}
.stage{flex:1;position:relative;background:#000;overflow:hidden;touch-action:none}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
.grad{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.92) 0%,transparent 60%)}
.top{position:absolute;top:8px;left:0;right:0;display:flex;justify-content:center;gap:5px;z-index:10;padding:0 10px}
.pill{padding:6px 10px;border-radius:20px;font-size:9px;font-weight:900;background:rgba(0,0,0,.75);border:1px solid #333;white-space:nowrap}.pill.on{background:#FFD700;color:#000}

/* === CORREÇÃO - BOTÕES 100% DENTRO DA TELA === */
.actions{position:absolute;right:3px;bottom:118px;display:flex;flex-direction:column;gap:7px;z-index:30;width:58px;align-items:center;justify-content:flex-start}
.action-item{display:flex;flex-direction:column;align-items:center;width:100%}
.abtn{width:48px;height:48px;border-radius:14px;background:rgba(28,28,28,.92);border:2px solid #FFD700;display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 3px 10px rgba(0,0,0,.7);transition:.2s;flex-shrink:0}
.abtn:active{transform:scale(.84)}
.abtn.gold{background:linear-gradient(145deg,#FFE55C,#FFD700,#D4AF37)!important;color:#000!important;border:2px solid #000!important;box-shadow:0 0 12px rgba(255,215,0,.75)!important;animation:goldPulse 2s infinite}
@keyframes goldPulse{0%,100%{transform:scale(1);box-shadow:0 0 10px rgba(255,215,0,.6)}50%{transform:scale(1.04);box-shadow:0 0 18px rgba(255,215,0,.9)}}
.cnt{font-size:7px;font-weight:900;margin-top:3px;background:rgba(0,0,0,.85);padding:2px 5px;border-radius:8px;min-width:32px;text-align:center;color:#fff;border:1px solid rgba(255,255,255,.15);line-height:1}
.flyHeart{position:absolute;right:18px;bottom:160px;font-size:26px;pointer-events:none;z-index:100;animation:flyUp 1s forwards}
@keyframes flyUp{0%{transform:translateY(0) scale(.5);opacity:1}100%{transform:translateY(-160px) scale(1.6);opacity:0}}

.meta{position:absolute;left:8px;bottom:8px;right:66px;z-index:10;background:rgba(0,0,0,.62);padding:9px 10px;border-radius:14px;border:1px solid #333}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:1000;display:none;flex-direction:column}.modal.on{display:flex!important}
#toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#FFD700;color:#000;padding:10px 18px;border-radius:18px;z-index:8000;display:none;font-weight:900;font-size:12px;max-width:80%;text-align:center}#toast.on{display:block!important}
.nav{height:102px!important;background:linear-gradient(180deg,#FFE55C,#FFD700,#D4AF37)!important;display:flex;justify-content:space-around;align-items:stretch;border-radius:22px 22px 0 0;margin-top:-12px;z-index:50;border-top:3px solid #FFD700;padding:4px 2px 6px 2px}
.tab{color:#000;font-size:10px;font-weight:900;text-align:center;border-radius:14px;min-width:54px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 2px;height:100%;background:rgba(0,0,0,.07);border:1.5px solid rgba(0,0,0,.1)}
.tab.on{background:#000!important;color:#FFD700!important;border:2px solid #000}.tab div:first-child{font-size:24px!important}
.create{width:66px;height:66px;background:#000;border-radius:18px;display:flex;align-items:center;justify-content:center;border:3px solid #000;margin:0 2px;align-self:center}.create span{background:linear-gradient(145deg,#FFE55C,#FFD700,#D4AF37);color:#000;width:100%;height:100%;display:flex;align-items:center;justify-content:center;border-radius:14px;font-size:36px;font-weight:900}
.input{width:100%;background:#111;border:1px solid #333;padding:10px;border-radius:12px;color:#fff;margin-top:6px;font-size:13px}
#cam{position:fixed;inset:0;background:#000;z-index:9999;display:none;flex-direction:column}#camEl{flex:1;width:100%;height:100%;object-fit:cover;background:#111}.cam-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px;z-index:10;background:linear-gradient(180deg,rgba(0,0,0,.8),transparent)}.cam-modes{position:absolute;bottom:95px;left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:10}.cam-modes button{padding:8px 11px;border-radius:18px;font-weight:900;font-size:10px;border:1.5px solid #fff}.cam-bottom{position:absolute;bottom:0;left:0;right:0;padding:10px 8px 16px;display:flex;gap:8px;align-items:center;z-index:10;background:linear-gradient(0deg,rgba(0,0,0,.9),transparent)}.progress{position:absolute;bottom:0;left:0;height:4px;background:#FFD700;z-index:20}
.soundBig{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.5);width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;border:3px solid #FFD700;z-index:20}
</style>
</head>
<body>
<div id="toast"></div>
<div class="app"><div class="stage" id="stage"></div>
<div class="nav">
<div class="tab on" onclick="goHome()"><div>🏠</div>Início</div>
<div class="tab" onclick="goMy()"><div>◧</div>Meus</div>
<div onclick="goCam()"><div class="create"><span>+</span></div></div>
<div class="tab" onclick="goCam(true)"><div>🔴</div>LIVE</div>
<div class="tab" onclick="goProfile()"><div>👤</div>Eu</div>
</div></div>

<div id="cam"><video id="camEl" autoplay muted playsinline></video><canvas id="photoCanvas" style="display:none"></canvas><div class="progress" id="camProgress" style="width:0%"></div><div class="cam-top"><button onclick="closeCam()" style="width:36px;height:36px;background:rgba(0,0,0,.7);border:2px solid #fff;border-radius:50%;color:#fff">✕</button><div style="display:flex;flex-direction:column;align-items:center;gap:3px"><span id="camModeLabel" style="background:#FFD700;color:#000;padding:4px 10px;border-radius:10px;font-size:10px;font-weight:900">📸 FOTO</span><span id="camTimer" style="background:#ff0000;padding:4px 10px;border-radius:18px;font-size:10px;display:none">● 00:00</span></div><button onclick="postCurrent()" style="background:#00ff00;color:#000;border:none;padding:9px 14px;border-radius:18px;font-weight:900;font-size:11px">💾 SALVAR</button></div><div class="cam-modes"><button id="btnFoto" onclick="setCamMode('foto')" style="background:#FFD700;color:#000">📸 FOTO</button><button id="btnVideo" onclick="setCamMode('video')" style="background:rgba(0,0,0,.6);color:#fff">📹 1:30</button><button id="btnLive" onclick="setCamMode('live')" style="background:rgba(0,0,0,.6);color:#fff">🔴 LIVE</button></div><div class="cam-bottom"><div style="flex:1"></div><input id="descInp" placeholder="Legenda..." style="flex:1;max-width:58%;padding:11px 13px;border-radius:20px;background:rgba(0,0,0,.6);border:1.5px solid #FFD700;color:#fff;font-size:12px"><button id="shutterBtn" onclick="captureAction()" style="width:60px;height:60px;background:#fff;border-radius:50%;border:3px solid #000;font-size:22px">📸</button><div style="flex:1"></div></div></div>

<div class="modal" id="profileM"><div style="flex:1" onclick="closeAll()"></div><div style="position:absolute;bottom:0;left:0;right:0;background:#1e1e1e;border-radius:24px 24px 0 0;padding:14px;border-top:3px solid #FFD700"><b style="color:#FFD700">👤 PERFIL</b><span onclick="closeAll()" style="float:right;font-size:22px;color:#FFD700">×</span><h3 id="profileName" style="font-size:16px;margin-top:8px"></h3><p id="profileNick" style="color:#FFD700;font-size:11px"></p><button onclick="openGalleryAuto()" style="width:100%;margin-top:10px;padding:13px;border-radius:12px;background:linear-gradient(145deg,#FFE55C,#FFD700);color:#000;font-weight:900;border:2px solid #000;font-size:13px">🖼️ IMPORTAR GALERIA</button><input id="inName" class="input" placeholder="Seu nome"><input id="inNick" class="input" placeholder="Seu @nick"><button onclick="saveProfile()" style="width:100%;padding:11px;border-radius:12px;margin-top:8px;background:#FFD700;color:#000;font-weight:900">💾 SALVAR</button><input type="file" id="galleryInput" accept="video/*,image/*" multiple style="display:none"></div></div>
<div class="modal" id="galleryAutoM"><div style="flex:1" onclick="closeAll()"></div><div style="position:absolute;bottom:0;left:0;right:0;background:#1d1d1d;border-radius:24px 24px 0 0;padding:14px;border-top:3px solid #FFD700;max-height:84vh;overflow:auto"><div style="display:flex;justify-content:space-between"><b style="color:#FFD700;font-size:14px">📱 GALERIA</b><span onclick="closeAll()" style="font-size:22px;color:#FFD700">×</span></div><div style="margin-top:10px;display:flex;justify-content:space-between;align-items:center"><span id="galleryCount" style="color:#FFD700;font-weight:900;font-size:11px">0 itens</span><button onclick="importAllGallery()" id="importAllBtn" style="padding:8px 14px;border-radius:18px;background:#0a0;color:#fff;font-weight:900;display:none;font-size:11px">✅ IMPORTAR</button></div><div id="galleryAutoGrid" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px;max-height:46vh;overflow:auto"></div></div></div>
<div class="modal" id="commentsM"><div style="flex:1" onclick="closeAll()"></div><div style="position:absolute;bottom:0;left:0;right:0;background:#1e1e1e;border-radius:24px 24px 0 0;padding:14px;border-top:3px solid #FFD700;max-height:70vh;overflow:auto"><div style="display:flex;justify-content:space-between"><b style="color:#FFD700;font-size:14px">💬 Comentários</b><span onclick="closeAll()" style="font-size:22px;color:#FFD700">×</span></div><div id="commentsList" style="margin-top:10px"></div><div style="display:flex;gap:6px;margin-top:10px"><input id="commentInput" class="input" style="flex:1;margin:0" placeholder="Escreve..."><button onclick="sendComment()" style="padding:9px 13px;border-radius:10px;background:#FFD700;color:#000;font-weight:900;font-size:12px">Enviar</button></div></div></div>
<div class="modal" id="shareM"><div style="flex:1" onclick="closeAll()"></div><div style="position:absolute;bottom:0;left:0;right:0;background:#1d1d1d;border-radius:24px 24px 0 0;padding:16px;border-top:3px solid #FFD700"><div style="text-align:center"><b style="color:#FFD700;font-size:14px">↗️ Compartilhar</b><div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px"><button onclick="shareWhats()" style="padding:11px;border-radius:11px;background:#25D366;color:#fff;font-weight:900;border:none;font-size:12px">💬 WhatsApp</button><button onclick="shareCopy()" style="padding:11px;border-radius:11px;background:#111;color:#FFD700;border:1.5px solid #FFD700;font-weight:900;font-size:12px">🔗 Copiar</button><button onclick="shareFace()" style="padding:11px;border-radius:11px;background:#1877F2;color:#fff;font-weight:900;border:none;font-size:12px">📘 Facebook</button><button onclick="shareSystem()" style="padding:11px;border-radius:11px;background:#FFD700;color:#000;font-weight:900;border:none;font-size:12px">📤 Mais</button></div></div></div></div>
<div class="modal" id="myM"><div style="flex:1" onclick="closeAll()"></div><div style="position:absolute;bottom:0;left:0;right:0;background:#1d1d1d;border-radius:24px 24px 0 0;padding:14px;border-top:2px solid #FFD700;max-height:76vh;overflow:auto"><b style="color:#FFD700;font-size:14px">✨ Meus vídeos</b><span style="float:right" onclick="closeAll()">×</span><div id="myGrid" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px"></div></div></div>
<div class="modal" id="deleteM"><div style="flex:1" onclick="closeAll()"></div><div style="position:absolute;bottom:0;left:0;right:0;background:#1d1d1d;border-radius:24px 24px 0 0;padding:16px;border-top:3px solid #ff0000"><div style="text-align:center"><h3 style="color:#ff4444;font-size:15px">Apagar vídeo?</h3><div id="deletePreview" style="margin-top:8px;background:#000;border-radius:10px;padding:6px;font-size:11px"></div><div style="display:flex;gap:8px;margin-top:12px"><button onclick="closeAll()" style="flex:1;padding:11px;border-radius:10px;background:#111;color:#fff;font-size:12px">Cancelar</button><button onclick="confirmDelete()" style="flex:1;padding:11px;border-radius:10px;background:#ff0000;color:#fff;font-weight:900;font-size:12px">🗑️ Apagar</button></div></div></div></div>

<script>
const APP_OWNER_NICK="jonathacarlosmaria";
let db=null,stream=null,rec=null,chunks=[],cur=0,camMode='foto',photoData=null,camTimerInt=null,camStartTime=0,VIDEO_MAX=90000,LIVE_MAX=1800000,allVideos=[],galleryFiles=[],deleteId=null,currentMuted=true;
function toast(t){let e=document.getElementById('toast');e.innerText=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2400)}
function closeAll(){document.querySelectorAll('.modal').forEach(m=>{m.classList.remove('on');m.style.display='none'})}
function getCurrentUser(){return JSON.parse(localStorage.getItem('work_current_user')||'{"nick":"'+APP_OWNER_NICK+'","name":"Jonatha"}')}
function goHome(){closeAll();render()}
function goMy(){let myNick=getCurrentUser().nick;let myVideos=allVideos.filter(v=>v.owner===myNick);document.getElementById('myGrid').innerHTML=myVideos.map(v=>{let media=v.type==='foto'||(v.data&&v.data.startsWith('data:image'))?`<img src="${v.data||v.img}" style="width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:10px">`:`<video src="${v.data}" controls playsinline style="width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:10px"></video>`;return `<div style="position:relative;border:2px solid #0a0;border-radius:10px;overflow:hidden">${media}<button onclick="askDelete(${v.id})" style="position:absolute;bottom:4px;right:4px;background:#ff0000;color:#fff;border:1px solid #fff;border-radius:12px;padding:2px 6px;font-size:9px">🗑️</button></div>`}).join('')||'<div style="text-align:center;padding:16px;color:#888;font-size:12px">Nenhum vídeo</div>';document.getElementById('myM').classList.add('on');document.getElementById('myM').style.display='flex';}
function goProfile(){let c=getCurrentUser();document.getElementById('inName').value=c.name;document.getElementById('inNick').value=c.nick;document.getElementById('profileName').innerText=c.name;document.getElementById('profileNick').innerText='@'+c.nick+' • '+allVideos.filter(v=>v.owner===c.nick).length+' vídeos';document.getElementById('profileM').classList.add('on');document.getElementById('profileM').style.display='flex';}
function saveProfile(){let c=getCurrentUser();c.name=document.getElementById('inName').value.trim()||c.name;c.nick=document.getElementById('inNick').value.trim().replace('@','')||c.nick;localStorage.setItem('work_current_user',JSON.stringify(c));toast('✅ @'+c.nick);render();}
function saveToBackup(){try{let b=allVideos.filter(v=>v.id!==1).slice(0,60).map(v=>({id:v.id,desc:v.desc,data:v.data,type:v.type,owner:v.owner,likes:v.likes||0,comments:v.commentsList||[] }));localStorage.setItem('work_backup_videos',JSON.stringify(b));}catch{}}
function loadFromBackup(){try{let b=JSON.parse(localStorage.getItem('work_backup_videos')||'[]');if(b.length>0)return b;}catch{}return [];}
function openGalleryAuto(){document.getElementById('galleryInput').click();}
function handleGalleryFiles(files){galleryFiles=Array.from(files);document.getElementById('galleryAutoM').classList.add('on');document.getElementById('galleryAutoM').style.display='flex';document.getElementById('galleryCount').innerText=galleryFiles.length+' itens';document.getElementById('importAllBtn').style.display='block';let grid=document.getElementById('galleryAutoGrid');grid.innerHTML='';galleryFiles.forEach((f,i)=>{let url=URL.createObjectURL(f);let isVid=f.type.startsWith('video/');let el=document.createElement('div');el.style.cssText='position:relative;aspect-ratio:9/16;background:#111;border-radius:10px;overflow:hidden;border:2px solid #FFD700';el.innerHTML=isVid?`<video src="${url}" style="width:100%;height:100%;object-fit:cover" muted></video><div style="position:absolute;top:4px;right:4px"><input type="checkbox" checked data-i="${i}" class="gCheck" style="width:18px;height:18px"></div>`: `<img src="${url}" style="width:100%;height:100%;object-fit:cover"><div style="position:absolute;top:4px;right:4px"><input type="checkbox" checked data-i="${i}" class="gCheck" style="width:18px;height:18px"></div>`;grid.appendChild(el);});}
function importAllGallery(){let checks=document.querySelectorAll('.gCheck:checked');if(!checks.length){toast('Selecione um');return}let curUser=getCurrentUser();let done=0;checks.forEach(ch=>{let f=galleryFiles[parseInt(ch.dataset.i)];let rd=new FileReader();rd.onload=ev=>{let id=Date.now()+Math.random();let obj={id:id,data:ev.target.result,desc:f.name,type:f.type.startsWith('video/')?'video':'foto',likes:0,owner:curUser.nick,commentsList:[]};allVideos.unshift(obj);saveToBackup();try{let tx=db.transaction('videos','readwrite');tx.objectStore('videos').add(obj);}catch{}done++;if(done===checks.length){toast(`✅ ${done} salvos!`);closeAll();render();}};rd.readAsDataURL(f);});}
document.getElementById('galleryInput').addEventListener('change',e=>{ if(e.target.files.length) handleGalleryFiles(e.target.files); });
function askDelete(id){deleteId=id;let v=allVideos.find(x=>x.id===id);document.getElementById('deletePreview').innerText=`@${v.owner} - ${v.desc}`;document.getElementById('deleteM').classList.add('on');document.getElementById('deleteM').style.display='flex';}
function confirmDelete(){let id=deleteId;allVideos=allVideos.filter(x=>x.id!==id);saveToBackup();try{let tx=db.transaction('videos','readwrite');tx.objectStore('videos').delete(id);}catch{}if(cur>=allVideos.length)cur=0;closeAll();render();toast('🗑️ Apagado');}

function render(){
if(allVideos.length===0)allVideos=[{id:1,desc:"WORK - lateral completa",img:"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?q=80&w=1000",type:'foto',owner:APP_OWNER_NICK,likes:10,commentsList:["Top! 👑"]}];
let v=allVideos[cur];
let media=v.type==='foto'||(v.data&&v.data.startsWith('data:image'))?`<div class="bg" style="background-image:url('${v.data||v.img}')"></div>`:`<video id="mainVideo" src="${v.data}" autoplay loop muted playsinline style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"></video><div id="soundBtn" class="soundBig" onclick="toggleSound()" style="display:${currentMuted?'flex':'none'}">${currentMuted?'🔇':'🔊'}</div>`;
document.getElementById('stage').innerHTML=`${media}<div class="grad"></div>
<div class="top"><div class="pill">1/1 SALVOS</div><div class="pill on">✅ @${v.owner}</div></div>

<div class="actions">
<div class="action-item" onclick="like()"><div class="abtn" style="border-color:#ff2d55">❤️</div><div class="cnt">${v.likes||10}</div></div>
<div class="action-item" onclick="openComments()"><div class="abtn" style="border-color:#00d4ff">💬</div><div class="cnt">${(v.commentsList||[]).length}</div></div>
<div class="action-item" onclick="openGalleryAuto()"><div class="abtn gold">🖼️</div><div class="cnt" style="background:linear-gradient(145deg,#FFE55C,#FFD700);color:#000;border-color:#000">Galeria</div></div>
<div class="action-item" onclick="openShare()"><div class="abtn" style="border-color:#4da3ff">↗️</div><div class="cnt">Share</div></div>
<div class="action-item" onclick="toggleSound()"><div class="abtn" style="border-color:${currentMuted?'#ff5050':'#00e676'}">${currentMuted?'🔇':'🔊'}</div><div class="cnt">${currentMuted?'Mudo':'Som'}</div></div>
<div class="action-item" onclick="askDelete(${v.id})"><div class="abtn" style="background:#ff1a1a!important;border-color:#fff!important">🗑️</div><div class="cnt" style="color:#ff6666">Apagar</div></div>
</div>

<div class="meta"><div style="font-weight:700;font-size:12px;line-height:1.2">WORK - lateral completa</div><div style="font-size:9px;color:#FFD700;margin-top:3px">💬 ${(v.commentsList||[]).length} comentários | 🖼️ Galeria | ↗️ Share | @${v.owner}</div></div>`;

let vid=document.getElementById('mainVideo');if(vid){vid.muted=currentMuted}
}

function like(){let v=allVideos[cur];v.likes=(v.likes||0)+1;let h=document.createElement('div');h.className='flyHeart';h.innerText='❤️';document.getElementById('stage').appendChild(h);setTimeout(()=>h.remove(),1000);saveToBackup();render();toast('❤️ Curtiu!');}
function openComments(){let v=allVideos[cur];document.getElementById('commentsList').innerHTML=(v.commentsList||[]).map(c=>`<div style="background:rgba(255,255,255,.08);padding:8px;border-radius:10px;margin-bottom:5px;border-left:2px solid #00d4ff;font-size:11px">💬 ${c}</div>`).join('')||'<div style="text-align:center;color:#888;padding:14px;font-size:11px">Seja o primeiro!</div>';document.getElementById('commentsM').classList.add('on');document.getElementById('commentsM').style.display='flex';}
function sendComment(){let txt=document.getElementById('commentInput').value.trim();if(!txt)return;let v=allVideos[cur];if(!v.commentsList)v.commentsList=[];v.commentsList.push(txt);document.getElementById('commentInput').value='';saveToBackup();openComments();render();toast('💬');}
function openShare(){document.getElementById('shareM').classList.add('on');document.getElementById('shareM').style.display='flex';}
function shareWhats(){let v=allVideos[cur];window.open(`https://wa.me/?text=${encodeURIComponent(`WORK de @${v.owner}: ${v.desc} https://jonathacarlosmaria-wq.github.io/Work-influencia/`)}`);}
function shareCopy(){navigator.clipboard.writeText(location.href).then(()=>toast('✅ Copiado!'));}
function shareFace(){window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(location.href)}`);}
function shareSystem(){if(navigator.share){navigator.share({title:'WORK',url:location.href})}else{shareCopy()}}
function toggleSound(){let vid=document.getElementById('mainVideo');if(!vid){currentMuted=!currentMuted;render();return}currentMuted=!currentMuted;vid.muted=currentMuted;render();if(!currentMuted)vid.play().catch(()=>{});}
function setCamMode(mode){camMode=mode;photoData=null;document.getElementById('btnFoto').style.background=mode==='foto'?'#FFD700':'rgba(0,0,0,.6)';document.getElementById('btnVideo').style.background=mode==='video'?'#FFD700':'rgba(0,0,0,.6)';document.getElementById('btnLive').style.background=mode==='live'?'#ff0000':'rgba(0,0,0,.6)';let label=document.getElementById('camModeLabel'),timer=document.getElementById('camTimer'),progress=document.getElementById('camProgress');if(camTimerInt){clearInterval(camTimerInt);camTimerInt=null}progress.style.width='0%';if(mode==='foto'){label.innerText='📸 FOTO';timer.style.display='none';document.getElementById('shutterBtn').innerText='📸'}if(mode==='video'){label.innerText=`📹 1:30`;timer.style.display='block';document.getElementById('shutterBtn').innerText='⏺️';startRec(false)}if(mode==='live'){label.innerText=`🔴 LIVE`;timer.style.display='block';document.getElementById('shutterBtn').innerText='🔴';startRec(true)}}
function captureAction(){if(camMode==='foto'){let v=document.getElementById('camEl');let c=document.getElementById('photoCanvas');c.width=v.videoWidth||720;c.height=v.videoHeight||1280;c.getContext('2d').drawImage(v,0,0,c.width,c.height);photoData=c.toDataURL('image/jpeg',0.8);toast('📸 Pronta!');document.getElementById('shutterBtn').innerText='✅';}}
function goCam(isLive=false){document.getElementById('cam').style.display='flex';navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true}).then(s=>{stream=s;document.getElementById('camEl').srcObject=s;document.getElementById('camEl').muted=true;setCamMode(isLive?'live':'foto');}).catch(()=>toast('❌ Permita câmera'));}
function startRec(isLive){chunks=[];if(stream){try{rec=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9,opus'});}catch{rec=new MediaRecorder(stream);}rec.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data)};rec.start(100);camStartTime=Date.now();camTimerInt=setInterval(()=>{let elapsed=Date.now()-camStartTime;let limit=isLive?LIVE_MAX:VIDEO_MAX;document.getElementById('camTimer').innerText=`${isLive?'🔴':'●'} ${Math.floor(elapsed/1000)}s`;document.getElementById('camProgress').style.width=`${Math.min(100,(elapsed/limit)*100)}%`;if(elapsed>=limit)postCurrent();},100);}}
function closeCam(){if(camTimerInt){clearInterval(camTimerInt);camTimerInt=null}if(rec){try{rec.stop()}catch{}rec=null}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}document.getElementById('cam').style.display='none';document.getElementById('camProgress').style.width='0%';photoData=null}
function postCurrent(){let curUser=getCurrentUser();if(camMode==='foto'){if(!photoData){toast('Tire foto');return}let id=Date.now();let obj={id:id,data:photoData,desc:document.getElementById('descInp').value||'Foto @'+curUser.nick,type:'foto',likes:0,owner:curUser.nick,commentsList:[]};allVideos.unshift(obj);saveToBackup();try{let tx=db.transaction('videos','readwrite');tx.objectStore('videos').add(obj);}catch{}closeCam();document.getElementById('descInp').value='';toast('✅ FOTO SALVA!');render();}else{if(!rec||chunks.length===0){toast('Grave');return}if(camTimerInt){clearInterval(camTimerInt);camTimerInt=null}rec.stop();let blob=new Blob(chunks,{type:rec.mimeType||'video/webm'});let r=new FileReader();r.onload=e=>{let id=Date.now()+Math.random();let obj={id:id,data:e.target.result,desc:document.getElementById('descInp').value||'Vídeo 🔊 @'+curUser.nick,type:'video',likes:0,owner:curUser.nick,commentsList:[]};allVideos.unshift(obj);saveToBackup();try{let tx=db.transaction('videos','readwrite');tx.objectStore('videos').add(obj);}catch{}closeCam();document.getElementById('descInp').value='';chunks=[];currentMuted=false;toast('✅ COM SOM!');render();};r.readAsDataURL(blob);}}
function initDB(){return new Promise(r=>{let q=indexedDB.open('WorkDB_FINAL_FIX',19);q.onupgradeneeded=e=>{if(!e.target.result.objectStoreNames.contains('videos'))e.target.result.createObjectStore('videos',{keyPath:'id'})};q.onsuccess=e=>{db=e.target.result;r()};q.onerror=()=>{db=null;r();};});}
function loadAll(){return new Promise(r=>{if(!db){r(loadFromBackup());return;}try{let tx=db.transaction('videos','readonly');let req=tx.objectStore('videos').getAll();req.onsuccess=()=>{let res=req.result;if(res.length===0)res=loadFromBackup();r(res);};req.onerror=()=>{r(loadFromBackup());};}catch{r(loadFromBackup());}});}
let sy=0;const st=document.getElementById('stage');st.addEventListener('touchstart',e=>{sy=e.touches[0].clientY},{passive:true});st.addEventListener('touchend',e=>{let d=sy-e.changedTouches[0].clientY;if(Math.abs(d)>60){if(d>0){cur++;if(cur>=allVideos.length)cur=0}else{cur--;if(cur<0)cur=allVideos.length-1}currentMuted=true;render();}},{passive:true});
initDB().then(async()=>{let saved=await loadAll();saved.reverse().forEach(v=>{allVideos.unshift({id:v.id,desc:v.desc,data:v.data,type:v.type||'video',likes:v.likes||0,owner:v.owner||APP_OWNER_NICK,commentsList:v.commentsList||v.comments||[]})});render();if(!localStorage.getItem('work_current_user')){let u={id:1,nick:APP_OWNER_NICK,name:'Jonatha'};localStorage.setItem('work_current_user',JSON.stringify(u));}toast('✅ Corrigido! Tudo dentro da tela');});
</script>
