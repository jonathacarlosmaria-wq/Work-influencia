<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WORK - GRAVA 100% - JONATHA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial;height:100dvh;overflow:hidden}
.app{height:100dvh;display:flex;flex-direction:column}
.stage{flex:1;position:relative;background:#000;overflow:hidden}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
.grad{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.95) 0%,transparent 60%)}
.top{position:absolute;top:10px;left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:10}
.pill{padding:7px 12px;border-radius:20px;font-size:10px;font-weight:900;background:rgba(0,0,0,.7);border:1px solid #333}.pill.on{background:#FFD700;color:#000}
.actions{position:absolute;right:8px;bottom:125px;display:flex;flex-direction:column;gap:11px;z-index:20;width:70px;align-items:center}
.cnt{font-size:9px;font-weight:900;margin-top:3px;background:rgba(0,0,0,.6);padding:2px 6px;border-radius:10px}
.meta{position:absolute;left:10px;bottom:12px;right:84px;z-index:10;background:rgba(0,0,0,.55);padding:10px;border-radius:16px;border:1px solid #333}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:1000;display:none;flex-direction:column}.modal.on{display:flex!important}
#toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#FFD700;color:#000;padding:12px 20px;border-radius:20px;z-index:8000;display:none;font-weight:900;max-width:85%;text-align:center}#toast.on{display:block!important}
.nav{height:115px!important;background:linear-gradient(180deg,#FFE55C,#FFD700,#D4AF37)!important;display:flex;justify-content:space-around;align-items:stretch;border-radius:26px 26px 0 0;margin-top:-16px;z-index:50;border-top:3px solid #FFD700;padding:6px 4px 10px 4px}
.tab{color:#000;font-size:13px;font-weight:900;text-align:center;border-radius:18px;min-width:62px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;margin:0 3px;height:100%;background:rgba(0,0,0,.08);border:1.5px solid rgba(0,0,0,.1)}
.tab.on{background:#000!important;color:#FFD700!important;border:2px solid #000}.tab div:first-child{font-size:30px!important}
.create{width:78px;height:78px;background:#000;border-radius:22px;display:flex;align-items:center;justify-content:center;border:3px solid #000;margin:0 4px;align-self:center}.create span{background:linear-gradient(145deg,#FFE55C,#FFD700,#D4AF37);color:#000;width:100%;height:100%;display:flex;align-items:center;justify-content:center;border-radius:18px;font-size:42px;font-weight:900}
.abtn{width:54px;height:54px;border-radius:18px;background:#1e1e1e;border:1.5px solid #D4AF37;display:flex;align-items:center;justify-content:center;font-size:20px}
.btn-gold{background:linear-gradient(145deg,#FFE55C,#FFD700,#D4AF37)!important;color:#000!important;border:2px solid #FFD700!important;font-weight:900}
.input{width:100%;background:#111;border:1px solid #333;padding:11px;border-radius:12px;color:#fff;margin-top:7px}
#cam{position:fixed;inset:0;background:#000;z-index:9999;display:none;flex-direction:column}#camEl{flex:1;width:100%;height:100%;object-fit:cover;background:#111}.cam-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:14px;z-index:10;background:linear-gradient(180deg,rgba(0,0,0,.8),transparent)}.cam-modes{position:absolute;bottom:105px;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:10}.cam-modes button{padding:10px 14px;border-radius:20px;font-weight:900;font-size:11px;border:1.5px solid #fff}.cam-bottom{position:absolute;bottom:0;left:0;right:0;padding:14px 10px 22px;display:flex;gap:8px;align-items:center;z-index:10;background:linear-gradient(0deg,rgba(0,0,0,.9),transparent)}.progress{position:absolute;bottom:0;left:0;height:5px;background:#FFD700;transition:.2s;z-index:20}
.delBtn{background:rgba(255,0,0,.85)!important;border:2px solid #fff!important}
.soundBig{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.6);width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:36px;border:3px solid #FFD700;z-index:20;cursor:pointer}
.saveBadge{position:absolute;top:100px;left:12px;background:#0a0;color:#fff;padding:6px 12px;border-radius:20px;font-size:10px;font-weight:900;z-index:20}
</style>
</head>
<body>
<div id="toast"></div>
<div class="app"><div class="stage" id="stage"></div>
<div class="nav">
<div class="tab on" onclick="goHome()"><div>🏠</div>Início</div>
<div class="tab" onclick="goMy()"><div>◧</div>Meus</div>
<div onclick="goCam()"><div class="create"><span>+</span></div></div>
<div class="tab" onclick="goCam(true)"><div>🔴</div>LIVE</div>
<div class="tab" onclick="goProfile()"><div>👤</div>Eu</div>
</div></div>

<div id="cam">
<video id="camEl" autoplay muted playsinline></video><canvas id="photoCanvas" style="display:none"></canvas>
<div class="progress" id="camProgress" style="width:0%"></div>
<div class="cam-top">
<button onclick="closeCam()" style="width:42px;height:42px;background:rgba(0,0,0,.7);border:2px solid #fff;border-radius:50%;color:#fff;font-size:20px">✕</button>
<div style="display:flex;flex-direction:column;align-items:center;gap:4px">
<span id="camModeLabel" style="background:#FFD700;color:#000;padding:5px 12px;border-radius:12px;font-size:11px;font-weight:900">📸 FOTO</span>
<span id="camTimer" style="background:#ff0000;padding:6px 14px;border-radius:20px;font-size:11px;font-weight:900;display:none">● 00:00</span>
<span id="audioStatus" style="background:#0a0;padding:4px 10px;border-radius:20px;font-size:9px;font-weight:900;display:none">🎤 COM SOM</span>
</div>
<button onclick="postCurrent()" style="background:#00ff00;color:#000;border:none;padding:12px 20px;border-radius:22px;font-weight:900;font-size:13px">💾 SALVAR</button>
</div>
<div class="cam-modes">
<button id="btnFoto" onclick="setCamMode('foto')" style="background:#FFD700;color:#000">📸 FOTO</button>
<button id="btnVideo" onclick="setCamMode('video')" style="background:rgba(0,0,0,.6);color:#fff">📹 1:30</button>
<button id="btnLive" onclick="setCamMode('live')" style="background:rgba(0,0,0,.6);color:#fff">🔴 LIVE 1x</button>
</div>
<div class="cam-bottom">
<button onclick="flipCam()" style="width:48px;height:48px;border-radius:50%;border:2px solid #FFD700;background:rgba(255,255,255,.2);color:#fff">🔄</button>
<button id="galleryBtn" onclick="openGalleryAuto()" style="display:flex;flex-direction:column;align-items:center;width:62px;padding:6px 0;border-radius:14px;border:2px solid #FFD700;background:rgba(255,215,0,.25);color:#FFD700;font-weight:900"><span style="font-size:22px">🖼️</span><span style="font-size:7px">GALERIA</span></button>
<input id="descInp" placeholder="Legenda vai ficar salva pra sempre..." style="flex:1;padding:13px 14px;border-radius:24px;background:rgba(0,0,0,.6);border:1.5px solid #FFD700;color:#fff;outline:none">
<button id="shutterBtn" onclick="captureAction()" style="width:72px;height:72px;background:#fff;border-radius:50%;border:4px solid #000;font-size:28px">📸</button>
</div>
</div>

<div class="modal" id="profileM"><div style="flex:1" onclick="closeAll()"></div><div style="position:absolute;bottom:0;left:0;right:0;background:#1e1e1e;border-radius:28px 28px 0 0;padding:16px;border-top:3px solid #FFD700;max-height:94vh;overflow:auto">
<div style="display:flex;justify-content:space-between"><b style="color:#FFD700">👤 PERFIL</b><span onclick="closeAll()" style="font-size:26px;color:#FFD700">×</span></div>
<h3 id="profileName"></h3><p id="profileNick" style="color:#FFD700"></p>
<button onclick="openGalleryAuto()" style="width:100%;margin-top:10px;padding:16px;border-radius:14px;background:linear-gradient(145deg,#FFE55C,#FFD700);color:#000;font-weight:900;border:2px solid #000">🖼️ GALERIA - FICA SALVO</button>
<input id="inName" class="input" placeholder="Nome"><input id="inNick" class="input" placeholder="Nick"><button onclick="saveProfile()" class="btn-gold" style="width:100%;padding:12px;border-radius:16px;margin-top:10px">💾 SALVAR MEU NICK</button>
<div style="margin-top:10px;background:rgba(0,255,0,.15);padding:10px;border-radius:10px;font-size:11px;color:#0f0">🔒 AGORA GRAVA 100% - Vídeo fica salvo no app pra sempre até você apagar. Mesmo fechando o app.</div>
<div style="margin-top:10px;display:flex;gap:6px">
<button onclick="exportBackup()" style="flex:1;padding:10px;border-radius:10px;background:#111;color:#FFD700;border:1px solid #FFD700;font-size:11px">📤 Backup</button>
<button onclick="if(confirm('Apagar TODOS os vídeos?')){localStorage.removeItem('work_backup_videos');let tx=db.transaction('videos','readwrite');tx.objectStore('videos').clear();allVideos=[allVideos[0]];render();toast('🗑️ Apagado')}" style="flex:1;padding:10px;border-radius:10px;background:rgba(255,0,0,.2);color:#ff6b6b;border:1px solid #ff0000;font-size:11px">🗑️ Limpar tudo</button>
</div>
<input type="file" id="galleryInput" accept="video/*,image/*" multiple style="display:none">
</div></div>

<div class="modal" id="galleryAutoM"><div style="flex:1" onclick="closeAll()"></div><div style="position:absolute;bottom:0;left:0;right:0;background:#1d1d1d;border-radius:28px 28px 0 0;padding:16px;border-top:3px solid #FFD700;max-height:88vh;overflow:auto">
<div style="display:flex;justify-content:space-between"><b style="color:#FFD700">📱 VÍDEOS DO CELULAR - FICA GRAVADO</b><span onclick="closeAll()" style="font-size:26px;color:#FFD700">×</span></div>
<div style="margin-top:12px;display:flex;justify-content:space-between"><span id="galleryCount" style="color:#FFD700;font-weight:900">0</span><button onclick="importAllGallery()" id="importAllBtn" style="padding:10px 18px;border-radius:20px;background:#0a0;color:#fff;font-weight:900;display:none">✅ GRAVAR NO APP</button></div>
<div id="galleryAutoGrid" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px;max-height:50vh;overflow:auto"></div>
</div></div>

<div class="modal" id="myM"><div style="flex:1" onclick="closeAll()"></div><div style="position:absolute;bottom:0;left:0;right:0;background:#1d1d1d;border-radius:28px 28px 0 0;padding:16px;border-top:2px solid #FFD700;max-height:80vh;overflow:auto"><div style="display:flex;justify-content:space-between"><b style="color:#FFD700">✨ Meus vídeos - Ficam salvos pra sempre</b><span onclick="closeAll()">×</span></div><div id="myGrid" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:12px"></div></div></div>
<div class="modal" id="deleteM"><div style="flex:1" onclick="closeAll()"></div><div style="position:absolute;bottom:0;left:0;right:0;background:#1d1d1d;border-radius:28px 28px 0 0;padding:20px;border-top:3px solid #ff0000"><div style="text-align:center"><h3 style="color:#ff4444">Apagar vídeo salvo?</h3><div id="deletePreview" style="margin-top:12px;background:#000;border-radius:12px;padding:8px"></div><div style="display:flex;gap:10px;margin-top:16px"><button onclick="closeAll()" style="flex:1;padding:14px;border-radius:14px;background:#111;color:#fff">Cancelar</button><button onclick="confirmDelete()" style="flex:1;padding:14px;border-radius:14px;background:#ff0000;color:#fff;font-weight:900">🗑️ Apagar</button></div></div></div></div>

<script>
const APP_OWNER_NICK="jonathacarlosmaria";
let db=null,stream=null,rec=null,chunks=[],cur=0,facing='user',camMode='foto',photoData=null,camTimerInt=null,camStartTime=0,isLiveMode=false,VIDEO_MAX=90000,LIVE_MAX=1800000;
let allVideos=[];
let galleryFiles=[],deleteId=null,currentMuted=true;

function toast(t){let e=document.getElementById('toast');e.innerText=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),3000)}
function closeAll(){document.querySelectorAll('.modal').forEach(m=>{m.classList.remove('on');m.style.display='none'})}
function getCurrentUser(){return JSON.parse(localStorage.getItem('work_current_user')||'{"nick":"'+APP_OWNER_NICK+'","name":"Jonatha"}')}
function goHome(){closeAll();render()}

function goMy(){
 let myNick=getCurrentUser().nick;
 let myVideos=allVideos.filter(v=>v.owner===myNick);
 document.getElementById('myGrid').innerHTML=myVideos.map(v=>{
  let media=v.type==='foto'||(v.data&&v.data.startsWith('data:image'))?`<img src="${v.data||v.img}" style="width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:12px">`:`<video src="${v.data}" controls playsinline style="width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:12px"></video>`;
  return `<div style="position:relative;border:2px solid #0a0;border-radius:12px;overflow:hidden"><div style="position:absolute;top:4px;left:4px;background:#0a0;color:#fff;padding:2px 6px;border-radius:10px;font-size:8px;font-weight:900">✅ SALVO</div>${media}<div style="position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.7);padding:4px;font-size:8px">@${v.owner}</div><button onclick="askDelete(${v.id})" style="position:absolute;bottom:6px;right:6px;background:#ff0000;color:#fff;border:2px solid #fff;border-radius:20px;padding:4px 8px;font-size:10px;font-weight:900">🗑️</button></div>`;
 }).join('')||'<div style="grid-column:1/3;text-align:center;padding:20px;color:#888">Nenhum vídeo salvo ainda<br><span style="font-size:11px;color:#0f0">Grave um vídeo e clique em SALVAR - fica pra sempre!</span></div>';
 document.getElementById('myM').classList.add('on');document.getElementById('myM').style.display='flex';
}

function goProfile(){
 let c=getCurrentUser();
 document.getElementById('inName').value=c.name||'Jonatha';
 document.getElementById('inNick').value=c.nick||APP_OWNER_NICK;
 document.getElementById('profileName').innerText=c.name;
 document.getElementById('profileNick').innerText='@'+c.nick+' - '+allVideos.filter(v=>v.owner===c.nick).length+' vídeos salvos ✅';
 document.getElementById('profileM').classList.add('on');document.getElementById('profileM').style.display='flex';
}
function saveProfile(){
 let c=getCurrentUser();
 c.name=document.getElementById('inName').value.trim()||c.name;
 c.nick=document.getElementById('inNick').value.trim().replace('@','')||c.nick;
 localStorage.setItem('work_current_user',JSON.stringify(c));
 toast('✅ @'+c.nick+' - seus vídeos salvos!');
 render();
}

function saveToBackup(){
 try{
  let backup = allVideos.filter(v=>v.id!==1).slice(0,50).map(v=>({id:v.id,desc:v.desc,data:v.data,type:v.type,owner:v.owner,likes:v.likes||0}));
  localStorage.setItem('work_backup_videos', JSON.stringify(backup));
  console.log('Backup salvo:', backup.length);
 }catch(e){ console.log('Backup erro - vídeo grande demais, salvando só ID'); }
}

function loadFromBackup(){
 try{
  let b = JSON.parse(localStorage.getItem('work_backup_videos')||'[]');
  if(b.length>0){ console.log('Backup encontrado:', b.length); return b; }
 }catch{}
 return [];
}

function exportBackup(){ toast('📤 Backup: '+allVideos.length+' vídeos salvos no celular'); }

function openGalleryAuto(){document.getElementById('galleryInput').click();}
function handleGalleryFiles(files){
 galleryFiles=Array.from(files);
 document.getElementById('galleryAutoM').classList.add('on');document.getElementById('galleryAutoM').style.display='flex';
 document.getElementById('galleryCount').innerText=galleryFiles.length+' vídeos - vão ficar GRAVADOS';
 document.getElementById('importAllBtn').style.display='block';
 let grid=document.getElementById('galleryAutoGrid');grid.innerHTML='';
 galleryFiles.forEach((f,i)=>{
  let url=URL.createObjectURL(f);
  let isVid=f.type.startsWith('video/');
  let el=document.createElement('div');
  el.style.cssText='position:relative;aspect-ratio:9/16;background:#111;border-radius:12px;overflow:hidden;border:2px solid #0a0';
  el.innerHTML=isVid?`<video src="${url}" style="width:100%;height:100%;object-fit:cover" muted></video><div style="position:absolute;bottom:0;left:0;right:0;background:#0a0;color:#fff;padding:2px;font-size:7px;text-align:center">✅ VAI FICAR SALVO</div><div style="position:absolute;top:6px;right:6px"><input type="checkbox" checked data-i="${i}" class="gCheck" style="width:22px;height:22px"></div>`: `<img src="${url}" style="width:100%;height:100%;object-fit:cover"><div style="position:absolute;top:6px;right:6px"><input type="checkbox" checked data-i="${i}" class="gCheck" style="width:22px;height:22px"></div>`;
  grid.appendChild(el);
 });
}
function importAllGallery(){
 let checks=document.querySelectorAll('.gCheck:checked');
 if(!checks.length){toast('❌ Selecione');return}
 let curUser=getCurrentUser();
 toast(`⏳ GRAVANDO ${checks.length} no app...`);
 let done=0;
 checks.forEach(ch=>{
  let f=galleryFiles[parseInt(ch.dataset.i)];
  let rd=new FileReader();
  rd.onload=ev=>{
   let id=Date.now()+Math.random();
   let obj={id:id,data:ev.target.result,desc:f.name+' ✅ SALVO',type:f.type.startsWith('video/')?'video':'foto',likes:0,owner:curUser.nick,createdAt:Date.now()};
   // SALVA NO BANCO + BACKUP
   try{
    let tx=db.transaction('videos','readwrite');
    tx.objectStore('videos').add(obj);
    tx.oncomplete=()=>{
     allVideos.unshift({id:obj.id,desc:obj.desc,data:obj.data,type:obj.type,likes:0,owner:obj.owner});
     saveToBackup();
     done++;
     if(done===checks.length){toast(`✅ ${done} VÍDEOS GRAVADOS PRA SEMPRE!`);closeAll();render();}
    };
    tx.onerror=()=>{
     // Se falhar IndexedDB, salva só no backup
     allVideos.unshift({id:obj.id,desc:obj.desc,data:obj.data,type:obj.type,likes:0,owner:obj.owner});
     saveToBackup();
     done++;
     if(done===checks.length){toast(`✅ ${done} salvos no backup!`);closeAll();render();}
    };
   }catch(e){
    allVideos.unshift({id:obj.id,desc:obj.desc,data:obj.data,type:obj.type,likes:0,owner:obj.owner});
    saveToBackup();
    done++;
    if(done===checks.length){toast(`✅ ${done} salvos!`);closeAll();render();}
   }
  };
  rd.readAsDataURL(f);
 });
}
document.getElementById('galleryInput').addEventListener('change',e=>{ if(e.target.files.length) handleGalleryFiles(e.target.files); });

function askDelete(id){deleteId=id;let v=allVideos.find(x=>x.id===id);document.getElementById('deletePreview').innerHTML=`@${v.owner} - ${v.desc} - ✅ ESTAVA SALVO`;document.getElementById('deleteM').classList.add('on');document.getElementById('deleteM').style.display='flex';}
function confirmDelete(){
 let id=deleteId;
 allVideos=allVideos.filter(x=>x.id!==id);
 saveToBackup();
 try{let tx=db.transaction('videos','readwrite');tx.objectStore('videos').delete(id);}catch{}
 if(cur>=allVideos.length)cur=0;
 closeAll();render();goMy();
 toast('🗑️ Vídeo apagado do app!');
}

function render(){
 if(allVideos.length===0){ allVideos=[{id:1,desc:"Grave seu primeiro vídeo - vai ficar salvo pra sempre ✅",img:"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?q=80&w=1000",type:'foto',owner:APP_OWNER_NICK,likes:10}]; }
 let v=allVideos[cur];
 let mediaHtml='';
 if(v.type==='foto'||(v.data&&v.data.startsWith('data:image'))){
   mediaHtml=`<div class="bg" style="background-image:url('${v.data||v.img}')"></div>`;
 }else{
   mediaHtml=`<video id="mainVideo" src="${v.data}" autoplay loop muted playsinline style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"></video><div id="soundBtn" class="soundBig" onclick="toggleSound()">🔇</div><div class="saveBadge">✅ VÍDEO SALVO NO APP</div>`;
 }
 document.getElementById('stage').innerHTML=`${mediaHtml}<div class="grad"></div><div class="top"><div class="pill">${cur+1}/${allVideos.length} SALVOS</div><div class="pill on">✅ @${v.owner}</div></div><div class="actions"><div onclick="like()"><div class="abtn">❤️</div><div class="cnt">${v.likes||0}</div></div><div onclick="toggleSound()"><div class="abtn" id="actionSoundBtn" style="background:${currentMuted?'#333':'#FFD700'}">${currentMuted?'🔇':'🔊'}</div><div class="cnt">${currentMuted?'Mudo':'Som'}</div></div><div onclick="openGalleryAuto()"><div class="abtn" style="background:rgba(0,255,0,.3)">🖼️</div><div class="cnt" style="color:#0f0">Salvar</div></div><div onclick="askDelete(${v.id})"><div class="abtn delBtn">🗑️</div><div class="cnt" style="color:#ff4444">Apagar</div></div></div><div class="meta"><div style="font-weight:700">${v.desc}</div><div style="font-size:10px;color:#0f0">✅ SALVO NO APP - Não some mais | 👤 @${v.owner} | Toque 🔊 pra som</div></div>`;
 let vid=document.getElementById('mainVideo'); if(vid){vid.muted=currentMuted; vid.addEventListener('click',toggleSound);}
}

function toggleSound(){let vid=document.getElementById('mainVideo');if(!vid)return;currentMuted=!vid.muted;vid.muted=currentMuted;let btn=document.getElementById('soundBtn');if(btn)btn.innerText=currentMuted?'🔇':'🔊';toast(currentMuted?'🔇':'🔊 Com som!');if(!currentMuted)vid.play().catch(()=>{});}
function like(){allVideos[cur].likes=(allVideos[cur].likes||0)+1;saveToBackup();render();}

function setCamMode(mode){
 camMode=mode; photoData=null;
 document.getElementById('btnFoto').style.background=mode==='foto'?'#FFD700':'rgba(0,0,0,.6)';
 document.getElementById('btnVideo').style.background=mode==='video'?'#FFD700':'rgba(0,0,0,.6)';
 document.getElementById('btnLive').style.background=mode==='live'?'#ff0000':'rgba(0,0,0,.6)';
 let galBtn=document.getElementById('galleryBtn'); if(galBtn) galBtn.style.display=mode==='live'?'none':'flex';
 let label=document.getElementById('camModeLabel'); if(camTimerInt){clearInterval(camTimerInt);camTimerInt=null} document.getElementById('camProgress').style.width='0%';
 if(mode==='foto'){label.innerText='📸 FOTO';document.getElementById('camTimer').style.display='none';document.getElementById('audioStatus').style.display='none';document.getElementById('shutterBtn').innerText='📸'}
 if(mode==='video'){label.innerText=`📹 VIDEO COM SOM + SALVO`;document.getElementById('camTimer').style.display='block';document.getElementById('audioStatus').style.display='block';document.getElementById('shutterBtn').innerText='⏺️';startRec(false)}
 if(mode==='live'){label.innerText=`🔴 LIVE SEM GALERIA`;document.getElementById('camTimer').style.display='block';document.getElementById('audioStatus').style.display='block';document.getElementById('shutterBtn').innerText='🔴';startRec(true)}
}
function captureAction(){if(camMode==='foto'){let v=document.getElementById('camEl');let c=document.getElementById('photoCanvas');c.width=v.videoWidth||720;c.height=v.videoHeight||1280;c.getContext('2d').drawImage(v,0,0,c.width,c.height);photoData=c.toDataURL('image/jpeg',0.8);toast('📸 Foto pronta pra salvar!');document.getElementById('shutterBtn').innerText='✅';}}
function goCam(isLive=false){
 document.getElementById('cam').style.display='flex';
 navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}).then(s=>{
  stream=s;
  document.getElementById('camEl').srcObject=s;
  document.getElementById('camEl').muted=true;
  setCamMode(isLive?'live':'foto');
  toast('🎤 Pronto pra gravar com som e salvar!');
 }).catch(e=>{toast('❌ Permita câmera e microfone');});
}
function startRec(isLive){
 isLiveMode=isLive; chunks=[];
 if(stream){
  let mime='video/webm;codecs=vp9,opus'; if(!MediaRecorder.isTypeSupported(mime)) mime='video/webm;codecs=vp8,opus'; if(!MediaRecorder.isTypeSupported(mime)) mime='video/webm';
  try{ rec=new MediaRecorder(stream,{mimeType:mime, audioBitsPerSecond:128000}); }catch{ rec=new MediaRecorder(stream); }
  rec.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data)};
  rec.start(100);
  camStartTime=Date.now();
  camTimerInt=setInterval(()=>{
   let elapsed=Date.now()-camStartTime;
   let limit=isLive?LIVE_MAX:VIDEO_MAX;
   document.getElementById('camTimer').innerText=`${isLive?'🔴':'●'} ${Math.floor(elapsed/1000)}s 🎤 SALVANDO`;
   document.getElementById('camProgress').style.width=`${Math.min(100,(elapsed/limit)*100)}%`;
   if(elapsed>=limit) postCurrent();
  },100);
 }
}
function closeCam(){if(camTimerInt){clearInterval(camTimerInt);camTimerInt=null}if(rec){try{rec.stop()}catch{}rec=null}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}document.getElementById('cam').style.display='none';document.getElementById('camProgress').style.width='0%';photoData=null}
function flipCam(){facing=facing==='user'?'environment':'user';if(stream)stream.getTracks().forEach(t=>t.stop());navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:true}).then(s=>{stream=s;document.getElementById('camEl').srcObject=s;document.getElementById('camEl').muted=true;});}

function postCurrent(){
 let curUser=getCurrentUser();
 if(camMode==='foto'){
  if(!photoData){toast('Tire foto');return}
  let id=Date.now();
  let obj={id:id,data:photoData,desc:document.getElementById('descInp').value||'Foto ✅ SALVA de @'+curUser.nick,type:'foto',likes:0,owner:curUser.nick};
  // SALVA DUPLO
  allVideos.unshift({id:obj.id,desc:obj.desc,data:obj.data,type:obj.type,likes:0,owner:obj.owner});
  saveToBackup();
  try{let tx=db.transaction('videos','readwrite');tx.objectStore('videos').add(obj);}catch{}
  closeCam();document.getElementById('descInp').value='';toast('✅ FOTO GRAVADA NO APP PRA SEMPRE!');render();
 }else{
  if(!rec||chunks.length===0){toast('Grave primeiro');return}
  if(camTimerInt){clearInterval(camTimerInt);camTimerInt=null}
  rec.stop();
  let blob=new Blob(chunks,{type:rec.mimeType||'video/webm'});
  if(blob.size<500){toast('❌ Grave de novo - muito curto');return}
  let r=new FileReader();
  r.onload=e=>{
   let id=Date.now()+Math.random();
   let obj={id:id,data:e.target.result,desc:document.getElementById('descInp').value||'Vídeo com som 🔊 ✅ SALVO de @'+curUser.nick,type:'video',likes:0,owner:curUser.nick};
   allVideos.unshift({id:obj.id,desc:obj.desc,data:obj.data,type:obj.type,likes:0,owner:obj.owner});
   saveToBackup();
   try{
    let tx=db.transaction('videos','readwrite');
    tx.objectStore('videos').add(obj);
    tx.oncomplete=()=>{ toast('✅ VÍDEO COM SOM SALVO PRA SEMPRE! 🔊'); };
   }catch{ toast('✅ VÍDEO SALVO NO BACKUP! 🔊'); }
   closeCam();document.getElementById('descInp').value='';chunks=[];currentMuted=false;render();
  };
  r.readAsDataURL(blob);
 }
}

function initDB(){
 return new Promise(r=>{
  let q=indexedDB.open('WorkDB_GRAVA_100_FINAL',10);
  q.onupgradeneeded=e=>{ if(!e.target.result.objectStoreNames.contains('videos')) e.target.result.createObjectStore('videos',{keyPath:'id'}) };
  q.onsuccess=e=>{db=e.target.result;r()};
  q.onerror=()=>{db=null;r();};
 });
}
function loadAll(){
 return new Promise(r=>{
  if(!db){ r(loadFromBackup()); return; }
  try{
   let tx=db.transaction('videos','readonly');
   let req=tx.objectStore('videos').getAll();
   req.onsuccess=()=>{ let res=req.result; if(res.length===0) res=loadFromBackup(); r(res); };
   req.onerror=()=>{ r(loadFromBackup()); };
  }catch{ r(loadFromBackup()); }
 });
}

let sy=0;const st=document.getElementById('stage');
st.addEventListener('touchstart',e=>{sy=e.touches[0].clientY},{passive:true});
st.addEventListener('touchend',e=>{
 let d=sy-e.changedTouches[0].clientY;
 if(Math.abs(d)>60){
  if(d>0){cur++;if(cur>=allVideos.length)cur=0}else{cur--;if(cur<0)cur=allVideos.length-1}
  currentMuted=true;render();
 }
},{passive:true});

initDB().then(async()=>{
 let saved=await loadAll();
 console.log('Carregados:', saved.length);
 saved.reverse().forEach(v=>{ allVideos.unshift({id:v.id,desc:v.desc,data:v.data,type:v.type||'video',likes:v.likes||0,owner:v.owner||APP_OWNER_NICK}) });
 // Se ainda vazio, tenta backup
 if(allVideos.length===0){
  let b=loadFromBackup();
  b.forEach(v=> allVideos.unshift(v));
 }
 render();
 if(!localStorage.getItem('work_current_user')){
  let u={id:1,nick:APP_OWNER_NICK,name:'Jonatha Dono'};
  localStorage.setItem('work_current_user',JSON.stringify(u));
 }
 toast('✅ APP PRONTO - '+allVideos.length+' vídeos salvos ✅');
});
</script>
