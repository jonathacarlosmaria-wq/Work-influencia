<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WORK FIRE - SOM UNICO</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100dvh;background:#000;overflow:hidden;font-family:-apple-system,sans-serif}
#app{width:100%;max-width:420px;height:100dvh;margin:0 auto;background:#000;display:flex;flex-direction:column;position:relative}
#feed{flex:1;overflow-y:scroll;scroll-snap-type:y mandatory}
#feed::-webkit-scrollbar{display:none}
.post{height:100dvh;width:100%;position:relative;scroll-snap-align:start;background:#111;flex-shrink:0;overflow:hidden}
.post video{width:100%;height:100%;object-fit:cover;display:block}
.post::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 20%,rgba(0,0,0,.2) 60%,rgba(0,0,0,.9) 100%);pointer-events:none;z-index:1}
.rightBar{position:absolute;right:8px;bottom:90px;z-index:10;display:flex;flex-direction:column;gap:12px;width:60px}
.btnTik{border:none;background:none;display:flex;flex-direction:column;align-items:center;cursor:pointer;width:100%}
.iconTik{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;background:rgba(35,35,35,.85);border:1.5px solid rgba(255,255,255,.18)}
.iconTik.fire.on{background:#ff4500;box-shadow:0 0 18px #ff4500}
.iconTik.share.on{background:#00ff88;color:#000;box-shadow:0 0 12px #00ff88}
.txtTik{color:#fff;font-size:8.5px;font-weight:800;margin-top:3px;text-align:center}
.info{position:absolute;left:10px;right:76px;bottom:82px;z-index:10;background:rgba(0,0,0,.55);border:1px solid rgba(255,69,0,.22);border-radius:12px;padding:9px 10px}
.info b{color:#fff;font-size:11px}
.info div{color:#ddd;font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{height:64px;background:#0a0700;border-top:1.5px solid rgba(255,69,0,.35);display:flex;align-items:center;justify-content:space-around;z-index:30}
.nav button{flex:1;background:none;border:none;color:rgba(255,255,255,.5);font-size:8.5px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button.on{color:#ff8c00}
.plus{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#ff8c00,#ff2200);border:2.5px solid #fff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;margin-top:-20px}
.page{position:absolute;inset:0;background:#000;z-index:20;display:none;flex-direction:column;overflow-y:auto;padding-bottom:70px}
.page.show{display:flex}
.card{background:rgba(25,12,0,.92);border:1px solid rgba(255,69,0,.22);border-radius:12px;padding:12px;margin:10px}
.input{width:100%;padding:11px;background:#1e1100;border:1px solid rgba(255,69,0,.32);border-radius:10px;color:#fff;margin-top:7px;font-size:13px}
.btn{width:100%;padding:14px;background:linear-gradient(90deg,#ff4500,#ff8c00);border:none;border-radius:12px;color:#000;font-weight:900;margin-top:10px;font-size:13px;cursor:pointer}
.camBox{position:relative;width:100%;height:45vh;background:#000;border-radius:14px;overflow:hidden;border:2px solid #ff4500;margin-top:10px}
.camBox video{width:100%;height:100%;object-fit:cover}
.camBox video.mirror{transform:scaleX(-1)}
.timerCam{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(255,0,0,.9);color:#fff;padding:5px 14px;border-radius:20px;font-weight:900;font-size:13px;z-index:5}
.btnPostar{width:100%;padding:18px;background:linear-gradient(90deg,#00ff88,#00ff44);border:3px solid #fff;border-radius:14px;color:#000;font-weight:900;font-size:16px;margin-top:10px;display:none}
.btnPostar.show{display:block}
.soundBtn{position:absolute;left:12px;top:50%;transform:translateY(-50%);z-index:15;width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.65);border:2px solid #fff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer}
.soundBtn.on{background:#00ff88;border-color:#00ff88;color:#000;box-shadow:0 0 14px #00ff88}
#shareDrawer,#comDrawer{position:absolute;inset:0;z-index:60;display:none;flex-direction:column;justify-content:flex-end;background:rgba(0,0,0,.55)}
#shareDrawer.show,#comDrawer.show{display:flex}
.comSheet{width:100%;max-width:420px;margin:0 auto;background:#161616;border-radius:20px 20px 0 0;max-height:75vh;display:flex;flex-direction:column;border-top:1.5px solid rgba(255,69,0,.35)}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#00ff88;color:#000;padding:10px 18px;border-radius:20px;font-weight:900;font-size:12px;z-index:99}
</style>
</head>
<body>
<div id="app">
<div id="feed"></div>
<div id="shareDrawer" onclick="if(event.target.id==='shareDrawer')closeShare()"><div class="comSheet" style="padding:16px"><div style="width:36px;height:4px;background:rgba(255,255,255,.3);border-radius:10px;margin:0 auto 14px"></div><div style="display:flex;justify-content:space-between"><b style="color:#fff;font-size:14px">Compartilhar vídeo</b><button onclick="closeShare()" style="background:rgba(255,255,255,.1);border:none;color:#fff;width:28px;height:28px;border-radius:50%">X</button></div><div style="display:flex;gap:12px;margin-top:18px;justify-content:space-around"><button onclick="shareWhats()" style="background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:56px;height:56px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px"><i class="fa-brands fa-whatsapp"></i></div><span style="color:#fff;font-size:9px;font-weight:800">WhatsApp</span></button><button onclick="shareCopy()" style="background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:56px;height:56px;border-radius:50%;background:#333;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px"><i class="fa-solid fa-link"></i></div><span style="color:#fff;font-size:9px;font-weight:800">Copiar link</span></button><button onclick="shareSystem()" style="background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:56px;height:56px;border-radius:50%;background:#ff4500;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px"><i class="fa-solid fa-share-nodes"></i></div><span style="color:#fff;font-size:9px;font-weight:800">Mais</span></button></div><button onclick="closeShare()" style="width:100%;padding:14px;background:rgba(255,255,255,.08);border:none;border-radius:12px;color:#fff;font-weight:900;margin-top:18px">Cancelar</button></div></div>
<div id="pCriar" class="page"><div class="card" style="border:2px solid #ff4500"><h3 style="color:#ff4500">Postar 1:30</h3><div id="camOff"><button class="btn" onclick="startCam('user')">ABRIR CAMERA</button></div><div id="camBox" style="display:none"><video id="camVideo" autoplay muted playsinline></video></div><div id="previewArea" class="previewArea"><video id="previewVideo" style="width:100%;height:40vh;object-fit:cover" controls playsinline loop></video></div><button id="btnPostar" class="btnPostar" onclick="postar()">POSTAR AGORA - CLIQUE AQUI</button><input id="file" type="file" accept="image/*,video/*" style="color:#fff;width:100%;margin-top:12px"><input id="desc" class="input" placeholder="Legenda..."></div></div>
<div class="nav"><button id="b0" class="on" onclick="go(0)"><i class="fa-solid fa-house"></i><span>Inicio</span></button><button id="b2" onclick="go(2)"><div class="plus"><i class="fa-solid fa-plus"></i></div></button><button id="b4" onclick="go(4)"><i class="fa-solid fa-user"></i><span>Eu</span></button></div>
</div>
<script>
let db;function openDB(){return new Promise((res)=>{let req=indexedDB.open("WorkFireFixPostar",3);req.onupgradeneeded=e=>{let d=e.target.result;if(!d.objectStoreNames.contains("posts"))d.createObjectStore("posts",{keyPath:"id"})};req.onsuccess=e=>{db=e.target.result;res(db)};req.onerror=()=>res(null)})}
function savePostDB(p){if(!db)return Promise.resolve();return new Promise(r=>{let tx=db.transaction("posts","readwrite");tx.objectStore("posts").put(p);tx.oncomplete=()=>r()})}
function getAllPostsDB(){if(!db)return Promise.resolve([]);return new Promise(r=>{let tx=db.transaction("posts","readonly");let req=tx.objectStore("posts").getAll();req.onsuccess=()=>r(req.result||[])})}
let uid=localStorage.getItem("uid")||"u_"+Math.random().toString(36).slice(2,7);localStorage.setItem("uid",uid);
let userNome=localStorage.getItem("userNome")||"";let posts=[];let temp="",tempType="img";let stream=null,recorder=null,chunks=[];let recording=false,timerInt=null,sec=0,facing="user";
let videoAtivo=null;let somGlobal=localStorage.getItem('somGlobal')=='1';let observer=null;let shareIdx=null;
async function init(){await openDB();let stored=await getAllPostsDB();if(stored.length>0){posts=stored.sort((a,b)=>(b.time||0)-(a.time||0))}else{posts=[{id:Date.now(),owner:"fire.influencer",img:"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=700",desc:"SOM UNICO CORRIGIDO - so 1 video toca!",firedBy:[],likedBy:[],com:[],saveBy:[],sharedBy:[],isTop:true,type:"img",time:Date.now()}];for(let p of posts)await savePostDB(p)}render();setTimeout(setupObserver,500)}init();
function setupObserver(){if(observer)observer.disconnect();observer=new IntersectionObserver((entries)=>{entries.forEach(en=>{let v=en.target.querySelector('video');if(!v)return;if(en.isIntersecting&&en.intersectionRatio>=0.6){document.querySelectorAll('#feed video').forEach(o=>{if(o!==v){o.pause();o.muted=true}});videoAtivo=v;if(somGlobal){v.muted=false;v.volume=1}else{v.muted=true}v.play().catch(()=>{});atualizarBotoesSom()}else{v.pause();v.muted=true;if(videoAtivo===v)videoAtivo=null}})}, {threshold:0.6});document.querySelectorAll('.post').forEach(p=>observer.observe(p))}
function atualizarBotoesSom(){document.querySelectorAll('.post').forEach(post=>{let v=post.querySelector('video');let btn=post.querySelector('.soundBtn');if(!v||!btn)return;if(v===videoAtivo&&!v.muted&&!v.paused){btn.classList.add('on');btn.classList.remove('off');btn.innerHTML='<i class="fa-solid fa-volume-high"></i>'}else{btn.classList.add('off');btn.classList.remove('on');btn.innerHTML='<i class="fa-solid fa-volume-xmark"></i>'}})}
function toggleSomGlobal(btn){let post=btn.closest('.post');let video=post.querySelector('video');if(!video)return;document.querySelectorAll('#feed video').forEach(o=>{if(o!==video){o.muted=true;o.pause()}});if(video.muted){video.muted=false;video.volume=1;video.play().catch(()=>{});videoAtivo=video;somGlobal=true;localStorage.setItem('somGlobal','1')}else{video.muted=true;somGlobal=false;localStorage.setItem('somGlobal','0')}atualizarBotoesSom()}
function mostrarBotaoPostar(){document.getElementById("previewArea").classList.add("show");document.getElementById("btnPostar").classList.add("show")}
function closeShare(){let d=document.getElementById("shareDrawer");if(d){d.style.display="none";d.classList.remove("show")}shareIdx=null}
async function shareP(i,btn){shareIdx=i;let p=posts[i];if(!p.sharedBy)p.sharedBy=[];if(!p.sharedBy.includes(uid))p.sharedBy.push(uid);p.share=p.sharedBy.length;await savePostDB(p);render();if(navigator.share){try{await navigator.share({title:'WORK FIRE - @'+p.owner,text:p.desc,url:location.href});toastShare("Compartilhado!");closeShare();return}catch(e){}}document.getElementById("shareDrawer").style.display="flex";document.getElementById("shareDrawer").classList.add("show")}
function shareWhats(){let p=posts[shareIdx];let txt=(p?p.desc+" - ":"")+location.href+" FIRE!";window.open("https://wa.me/?text="+encodeURIComponent(txt),"_blank");toastShare("WhatsApp aberto!");closeShare()}
function shareCopy(){let url=location.href;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(()=>toastShare("Link copiado!"))}else{let ta=document.createElement("textarea");ta.value=url;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();toastShare("Link copiado!")}closeShare()}
function shareSystem(){let p=posts[shareIdx];if(navigator.share){navigator.share({title:'WORK FIRE',text:p?p.desc:'',url:location.href}).catch(()=>{shareCopy()})}else{shareCopy()}closeShare()}
function toastShare(m){let t=document.createElement("div");t.innerText=m;t.className="toast";document.body.appendChild(t);setTimeout(()=>{try{t.remove()}catch(e){}},2200)}
async function startCam(mode){facing=mode||facing;try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},audio:true});let v=document.getElementById("camVideo");v.srcObject=stream;if(facing==="user")v.classList.add("mirror");else v.classList.remove("mirror");document.getElementById("camBox").style.display="block";document.getElementById("camOff").style.display="none";document.getElementById("previewArea").classList.remove("show");document.getElementById("btnPostar").classList.remove("show")}catch(e){alert("Camera precisa HTTPS: "+e.message)}}
function stopCam(){try{if(stream)stream.getTracks().forEach(t=>t.stop())}catch(e){}stream=null;document.getElementById("camBox").style.display="none";document.getElementById("camOff").style.display="block";if(timerInt){clearInterval(timerInt);timerInt=null}if(recording)stopRec()}
function toggleRec(){if(!recording)startRec();else stopRec()}
function startRec(){if(!stream){alert("Abra camera");return}chunks=[];let mime="video/webm";try{recorder=new MediaRecorder(stream,{mimeType:mime})}catch(e){recorder=new MediaRecorder(stream)}recorder.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data)};recorder.onstop=()=>{let blob=new Blob(chunks,{type:'video/webm'});let url=URL.createObjectURL(blob);temp=url;tempType="video";let pv=document.getElementById("previewVideo");if(pv){pv.src=url}mostrarBotaoPostar()};recorder.start(200);recording=true;sec=0;timerInt=setInterval(()=>{sec++;if(sec>=90)stopRec()},1000)}
function stopRec(){try{if(recorder&&recording)recorder.stop()}catch(e){}recording=false;if(timerInt){clearInterval(timerInt);timerInt=null}}
function salvarTudo(){let n=document.getElementById("nomeUser").value.trim().replace(/@/g,"").toLowerCase();if(!n){alert("Digite nome");return}userNome=n;localStorage.setItem("userNome",n);render();alert("Salvo @"+n)}
function render(){let list=[...posts].sort((a,b)=>(b.isTop?1:0)-(a.isTop?1:0)||(b.time||0)-(a.time||0));document.getElementById("feed").innerHTML=list.map((p)=>{let idx=posts.indexOf(p);let shared=p.sharedBy&&p.sharedBy.includes(uid);let media="";if(p.type==="video"){media='<video src="'+p.img+'" loop playsinline muted preload="metadata" style="width:100%;height:100%;object-fit:cover"></video>'+'<button class="soundBtn off" onclick="toggleSomGlobal(this)"><i class="fa-solid fa-volume-xmark"></i></button>'}else{media='<div style="width:100%;height:100%;background:url(\''+p.img+'\') center/cover no-repeat"></div>'}return '<div class="post">'+media+'<div class="rightBar"><button class="btnTik" onclick="shareP('+idx+',this)"><div class="iconTik share '+(shared?'on':'')+'"><i class="fa-solid fa-share"></i></div><div class="txtTik">'+(p.sharedBy?p.sharedBy.length:p.share||0)+'<br>Compar</div></button></div><div class="info"><b>@'+p.owner+'</b> '+(p.type==="video"?'<span style="background:'+(somGlobal?'#00ff88':'#333')+';color:'+(somGlobal?'#000':'#fff')+';padding:2px 6px;border-radius:10px;font-size:8px">'+(somGlobal?'SOM ON':'SOM OFF')+'</span>':'')+'<div>'+(p.desc||'')+'</div></div></div>'}).join("");setTimeout(()=>{try{setupObserver()}catch(e){}},200)}
function go(n){document.querySelectorAll(".page").forEach(p=>p.classList.remove("show"));if(n==2)document.getElementById("pCriar").classList.add("show")}
function closeAll(){stopCam();document.querySelectorAll(".page").forEach(p=>p.classList.remove("show"))}
document.getElementById("file").addEventListener("change",e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=ev=>{if(f.type.startsWith("video")){temp=ev.target.result;tempType="video";let pv=document.getElementById("previewVideo");if(pv){pv.src=temp}mostrarBotaoPostar()}else{temp=ev.target.result;tempType="img";mostrarBotaoPostar()}};r.readAsDataURL(f)})
async function postar(){let d=document.getElementById("desc").value.trim()||"Meu video FIRE!";if(!temp){alert("Grave video!");return}let novo={id:Date.now()+Math.random(),owner:userNome||"anon",img:temp,desc:d,firedBy:[],likedBy:[],com:[],saveBy:[],sharedBy:[],share:0,isTop:false,type:tempType,time:Date.now()};await savePostDB(novo);posts.unshift(novo);temp="";document.getElementById("previewArea").classList.remove("show");document.getElementById("btnPostar").classList.remove("show");render();closeAll();stopCam();alert("Video postado!")}
</script>
</body>
</html>
