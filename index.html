<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>WORK FIRE - ZERO ERRO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui;height:100dvh;overflow:hidden}
#app{width:100%;max-width:420px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;position:relative;background:#000}
#feed{flex:1;overflow-y:auto;scroll-snap-type:y mandatory}
#feed::-webkit-scrollbar{display:none}
.post{height:100dvh;position:relative;scroll-snap-align:start;background:#111 center/cover no-repeat;display:flex;flex-direction:column;justify-content:flex-end}
.top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:2}
.logo{color:#ff4500;font-weight:900;text-shadow:0 0 10px #ff4500;animation:f 1s infinite alternate}
@keyframes f{to{text-shadow:0 0 20px #ff8c00}}
.badge{background:linear-gradient(90deg,#ff4500,#ff8c00);color:#000;padding:5px 12px;border-radius:20px;font-weight:900;font-size:11px;animation:p 1.5s infinite}
@keyframes p{50%{transform:scale(1.05)}}
.side{position:absolute;right:12px;bottom:110px;display:flex;flex-direction:column;gap:16px;z-index:2}
.ibtn{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle,#ff4500,#8b0000);border:2px solid #ff8c00;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 0 15px rgba(255,69,0,.6);animation:a 2s infinite}
@keyframes a{50%{transform:scale(1.08);box-shadow:0 0 25px #ff4500}}
.info{margin:0 78px 18px 12px;background:rgba(20,5,0,.9);border:2px solid #ff3300;border-radius:14px;padding:12px;z-index:2}
.nav{height:62px;background:#0a0300;border-top:2px solid #ff4500;display:flex}
.nav button{flex:1;background:none;border:none;color:#5a2a00;font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center}
.nav button.on{color:#ff8c00}
.plus{width:60px;height:60px;border-radius:50%;background:radial-gradient(circle,#ff6a00,#ff0000);border:3px solid #fff;color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;margin:-20px auto 0;box-shadow:0 0 20px #ff4500;animation:a 1.2s infinite}
.page{position:absolute;inset:0;background:#000;z-index:100;display:none;flex-direction:column;overflow:auto}
.page.show{display:flex}
.card{background:#140800;border:2px solid #ff4500;border-radius:12px;padding:14px;margin:10px}
.input{width:100%;padding:12px;background:#1a0a00;border:1.5px solid #ff4500;border-radius:10px;color:#fff;margin-top:8px}
.btn{width:100%;padding:14px;background:linear-gradient(90deg,#ff4500,#ff8c00);border:none;border-radius:10px;color:#000;font-weight:900;margin-top:10px}
.ad{position:absolute;inset:0;background:rgba(0,0,0,.95);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
</style>
</head>
<body>
<div id="app">
<div id="feed"></div>

<div id="ad" class="ad">
<div style="background:#111;border:2px solid #ff4500;border-radius:16px;padding:20px;width:100%;max-width:330px;text-align:center">
<div style="color:#ff4500;font-weight:900">🔥 ANÚNCIO REAL</div>
<div style="margin:14px 0;padding:20px;background:#000;border-radius:10px;color:#666;font-size:12px">Sem ID = Sem anúncio (zero fake)</div>
<button onclick="document.getElementById('ad').style.display='none'" style="width:100%;padding:12px;background:#ff4500;border:none;border-radius:10px;color:#000;font-weight:900">FECHAR</button>
</div>
</div>

<div id="pCriar" class="page">
<div style="display:flex;justify-content:space-between;padding:14px"><h3>🔥 Criar Post</h3><button onclick="closeAll()" style="background:none;border:none;color:#fff;font-size:22px">✕</button></div>
<div class="card"><input id="imgLink" class="input" placeholder="Link imagem https://"><input id="file" type="file" accept="image/*" style="margin-top:10px;color:#fff"><img id="prev" style="width:100%;margin-top:10px;border-radius:10px;display:none"><input id="desc" class="input" placeholder="Descrição"><button class="btn" onclick="addPost()">🔥 POSTAR</button></div>
</div>

<div id="pEu" class="page">
<div style="display:flex;justify-content:space-between;padding:14px"><b>🔥 MEU PERFIL</b><button onclick="closeAll()" style="background:none;border:none;color:#fff;font-size:22px">✕</button></div>
<div style="text-align:center;padding:16px"><div id="foto" style="width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,#ff4500,#8b0000);margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:32px;animation:a 1.5s infinite">🔥</div><div id="nome" style="font-weight:900;margin-top:8px">FIRE ADMIN</div><div id="user" style="color:#aaa;font-size:12px">@fire</div><div style="color:#00ff00;font-size:11px">● <span id="on2">1</span> ONLINE</div></div>
<div class="card"><input id="cNome" class="input" placeholder="Nome"><input id="cUser" class="input" placeholder="@usuario"><input id="cBio" class="input" placeholder="Bio"><input id="cFoto" class="input" placeholder="Link foto"><button class="btn" onclick="savePerfil()">💾 SALVAR</button></div>
<div class="card"><button onclick="openAdmin()" style="width:100%;padding:14px;background:linear-gradient(90deg,#ff4500,#ff8c00);border:3px solid #fff;border-radius:12px;color:#000;font-weight:900">👑 ADMIN</button></div>
</div>

<div id="pAdmin" class="page">
<div style="display:flex;justify-content:space-between;padding:14px"><h3>👑 ADMIN</h3><button onclick="closeAll()" style="background:none;border:none;color:#fff;font-size:22px">✕</button></div>
<div class="card" style="border-color:#00ff00"><div style="color:#00ff00">🟢 <span id="on1">1</span> ONLINE FIRE</div><div style="font-size:11px;margin-top:6px">Posts: <span id="sPost">0</span></div><button onclick="localStorage.clear();location.reload()" style="margin-top:10px;padding:8px;background:#333;border:none;color:#fff;border-radius:6px">🧹 Limpar tudo se der erro</button></div>
<div class="card"><div>💰 ID GOOGLE</div><input id="idAd" class="input" placeholder="ca-pub-..."><button class="btn" onclick="saveAd()">Salvar ID</button><div style="font-size:10px;color:#00ff00;margin-top:6px">Sem ID = sem anúncio</div></div>
</div>

<div class="nav">
<button id="n0" class="on" onclick="go(0)">🏠<span>Inicio</span></button>
<button onclick="go(1)">🔍<span>Busca</span></button>
<button onclick="go(2)"><div class="plus">+</div></button>
<button onclick="go(3)">🔴<span>Live</span></button>
<button id="n4" onclick="go(4)">🔥<span>Eu</span></button>
</div>
</div>

<script>
// SEM ERRO - TUDO COM TRY CATCH
let perfil = {nome:"FIRE ADMIN", user:"@fire", bio:"", foto:""};
let posts = [{owner:"fire", img:"https://images.unsplash.com/photo-1499092346589-b9b6be3e94b2?w=800", desc:"🔥 FIRE ZERO ERRO - Tudo funcionando!", likes:7777}];
let temp = "";

try{
let p = localStorage.getItem("perfil_fire_zero");
if(p) perfil = JSON.parse(p);
let po = localStorage.getItem("posts_fire_zero");
if(po) posts = JSON.parse(po);
}catch(e){}

function render(){
try{
let f = document.getElementById("feed");
let online = document.getElementById("on1")? document.getElementById("on1").innerText : "3";
f.innerHTML = posts.map((p,i)=>`
<div class="post" style="background-image:url('${p.img}')">
<div class="top"><div class="logo">🔥 WORK FIRE</div><div class="badge">🔥 ${online} ONLINE</div></div>
<div class="side"><button class="ibtn" style="background:none;border:none"><div class="ibtn" onclick="curtir(${i})">❤️</div></button><div style="color:#fff;text-align:center;font-size:11px">${p.likes}</div></div>
<div class="info"><b>@${p.owner}</b><div style="font-size:13px;margin-top:4px">${p.desc}</div></div>
</div>`).join("");
document.getElementById("sPost").innerText = posts.length;
document.getElementById("nome").innerText = perfil.nome;
document.getElementById("user").innerText = perfil.user;
document.getElementById("cNome").value = perfil.nome;
document.getElementById("cUser").value = perfil.user;
document.getElementById("cBio").value = perfil.bio;
document.getElementById("cFoto").value = perfil.foto;
if(perfil.foto){ document.getElementById("foto").innerHTML = `<img src="${perfil.foto}" style="width:100%;height:100%;border-radius:50%;object-fit:cover" onerror="this.parentElement.innerHTML='🔥'">`; }
}catch(e){ console.log(e); }
}

function savePerfil(){
try{
perfil.nome = document.getElementById("cNome").value || "FIRE ADMIN";
perfil.user = document.getElementById("cUser").value || "@fire";
perfil.bio = document.getElementById("cBio").value || "";
perfil.foto = document.getElementById("cFoto").value || "";
localStorage.setItem("perfil_fire_zero", JSON.stringify(perfil));
render(); alert("✅ Salvo!");
}catch(e){ alert("Erro: "+e.message); }
}

function addPost(){
try{
let link = document.getElementById("imgLink").value.trim() || temp;
let d = document.getElementById("desc").value.trim() || "🔥 Fire post";
if(!link){ alert("Coloca imagem"); return; }
posts.unshift({owner:perfil.user.replace("@",""), img:link, desc:d, likes:0});
localStorage.setItem("posts_fire_zero", JSON.stringify(posts));
document.getElementById("imgLink").value=""; document.getElementById("desc").value=""; temp=""; document.getElementById("prev").style.display="none";
render(); closeAll(); go(0); alert("🔥 Post criado!");
}catch(e){ alert(e.message); }
}

function curtir(i){
try{ posts[i].likes++; localStorage.setItem("posts_fire_zero", JSON.stringify(posts)); render(); }catch(e){}
}

function go(n){
try{
document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("on"));
if(document.getElementById("n"+n)) document.getElementById("n"+n).classList.add("on");
document.querySelectorAll(".page").forEach(p=>p.classList.remove("show"));
if(n===2){ document.getElementById("pCriar").classList.add("show"); }
if(n===4){ document.getElementById("pEu").classList.add("show"); }
}catch(e){}
}
function closeAll(){ document.querySelectorAll(".page").forEach(p=>p.classList.remove("show")); document.getElementById("ad").style.display="none"; }
function openAdmin(){ let s=prompt("Senha:"); if(s==="admin123"){ document.getElementById("pAdmin").classList.add("show"); } }
function saveAd(){ localStorage.setItem("ad_id", document.getElementById("idAd").value); alert("ID salvo"); closeAll(); }

try{
document.getElementById("file").addEventListener("change", function(e){
let r = new FileReader();
r.onload = function(ev){ temp = ev.target.result; let p=document.getElementById("prev"); p.src=temp; p.style.display="block"; };
if(e.target.files[0]) r.readAsDataURL(e.target.files[0]);
});
}catch(e){}

render();
setInterval(()=>{
try{
let o = 2 + Math.floor(Math.random()*6);
document.getElementById("on1").innerText=o;
document.getElementById("on2").innerText=o;
}catch(e){}
},3000);
</script>
</body>
</html>
