<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WORK - EU FIX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#000;color:#fff;font-family:-apple-system,Arial;height:100dvh;overflow:hidden}
.app{height:100dvh;display:flex;flex-direction:column}
.stage{flex:1;position:relative;background:#000;overflow:hidden;border-radius:0 0 28px 28px}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;border-radius:0 0 28px 28px}
.grad{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.96) 0%,transparent 58%);border-radius:0 0 28px 28px}
.prog{position:absolute;top:0;left:0;height:4px;background:linear-gradient(90deg,#D4AF37,#FFD700);z-index:20}
.top{position:absolute;top:10px;left:0;right:0;height:58px;display:flex;justify-content:center;align-items:center;gap:12px;z-index:10;padding:0 14px}
.pill{padding:10px 18px;border-radius:28px;font-size:12px;font-weight:900;background:rgba(0,0,0,.38);backdrop-filter:blur(20px);border:1.5px solid rgba(212,175,55,.28)}.pill.on{background:linear-gradient(145deg,#D4AF37,#FFD700);color:#000}
.actions{position:absolute;right:12px;bottom:102px;display:flex;flex-direction:column;gap:20px;z-index:10;align-items:center}
.act{display:flex;flex-direction:column;align-items:center;gap:6px}
.btn{width:64px;height:64px;border-radius:24px;background:linear-gradient(145deg,#1e1e1e,#0a0a0a);border:1.5px solid rgba(212,175,55,.38);display:flex;align-items:center;justify-content:center;font-size:26px}
.btn.mexendo{animation:mexe9s 9s ease-in-out}
@keyframes mexe9s{0%{transform:scale(1)}50%{transform:scale(1.3) rotate(10deg)}100%{transform:scale(1)}}
.cnt{font-size:10px;font-weight:900;background:rgba(0,0,0,.35);padding:3px 8px;border-radius:20px;border:1px solid rgba(212,175,55,.18)}
.meta{position:absolute;left:16px;bottom:18px;right:84px;z-index:10;background:rgba(0,0,0,.32);backdrop-filter:blur(24px);padding:14px 16px;border-radius:22px;border:1.5px solid rgba(212,175,55,.18)}
.user{font-weight:900;font-size:15px;display:flex;gap:8px;align-items:center}
.nav{height:96px!important;background:linear-gradient(180deg,#FFE55C,#FFD700,#D4AF37,#B8960C)!important;display:flex!important;justify-content:space-around!important;align-items:center!important;padding:12px 8px 18px!important;border-radius:32px 32px 0 0!important;margin-top:-20px!important;border-top:3px solid #FFD700!important;z-index:50!important;position:relative!important}
.tab{color:#3d2e00!important;font-size:10px;text-align:center;padding:10px 14px;border-radius:22px;min-width:64px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer!important;border:1.5px solid rgba(0,0,0,.18)!important;background:rgba(0,0,0,.12)!important;font-weight:800;user-select:none}
.tab.on{background:#000!important;color:#FFD700!important}
.ico{font-size:28px;display:block}
.create{width:78px;height:54px;border-radius:24px;background:#000!important;display:flex;align-items:center;justify-content:center;border:2px solid #FFD700!important}
.create span{background:linear-gradient(145deg,#FFD700,#D4AF37)!important;color:#000!important;width:100%;height:100%;display:flex;align-items:center;justify-content:center;border-radius:20px;font-size:36px;font-weight:900}
.profile-sheet{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(180deg,#1f1f1f,#0f0f0f);border-radius:32px 32px 0 0;max-height:88dvh;display:flex;flex-direction:column;padding:0;border-top:3px solid #FFD700;overflow:hidden;animation:up .35s}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.profile-head{padding:22px 20px 14px;text-align:center;background:linear-gradient(180deg,rgba(212,175,55,.12),transparent)}
.avatar-wrap{width:110px;height:110px;margin:0 auto 14px;position:relative;cursor:pointer}
.avatar{width:100%;height:100%;border-radius:28px;background:#111;border:3px solid #D4AF37;display:flex;align-items:center;justify-content:center;font-size:42px;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:25px}
.avatar-edit{position:absolute;bottom:-6px;right:-6px;width:36px;height:36px;border-radius:50%;background:linear-gradient(145deg,#FFD700,#D4AF37);border:2px solid #000;display:flex;align-items:center;justify-content:center}
.profile-body{padding:18px 20px 22px;overflow:auto}
.input-group{margin-bottom:14px}.input-label{font-size:10px;font-weight:900;color:#D4AF37;margin-bottom:6px;display:block;text-transform:uppercase}
.input{width:100%;background:rgba(0,0,0,.45);border:1.5px solid rgba(212,175,55,.22);border-radius:18px;padding:13px 16px;color:#fff;font-size:14px;font-weight:600;outline:none}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.save-btn{width:100%;background:linear-gradient(145deg,#FFD700,#D4AF37);color:#000;border:none;padding:16px;border-radius:22px;font-weight:900;font-size:15px;margin-top:8px}
.stats{display:flex;justify-content:space-around;margin:16px 0;background:rgba(212,175,55,.08);border:1px solid rgba(212,175,55,.15);border-radius:20px;padding:14px}
.stat{text-align:center}.stat b{font-size:18px;color:#FFD700;display:block}.stat span{font-size:10px;color:#8a6d3b}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:1000;display:none;flex-direction:column}.modal.on{display:flex!important}
#toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#1d1d1d;padding:14px 24px;border-radius:24px;z-index:3000;display:none;text-align:center;border:1.5px solid rgba(212,175,55,.3);font-size:12px;font-weight:800}#toast.on{display:block}
#cam{position:fixed;inset:0;background:#000;z-index:999;display:none;flex-direction:column}#cam.on{display:flex}
#camEl{width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>
<div id="toast"></div>
<div class="app">
<div class="stage" id="stage"></div>
<div class="nav">
<div class="tab on" onclick="WORK.mexe(this)"><span class="ico">⌂</span><span>Início</span></div>
<div class="tab" onclick="WORK.my()"><span class="ico">◧</span><span>Meus</span></div>
<div class="tab" onclick="WORK.openCam('video')"><div class="create"><span>+</span></div></div>
<div class="tab" onclick="WORK.openCam('live')"><span class="ico">●</span><span>LIVE</span></div>
<div class="tab" id="tabEu" onclick="WORK.openProfile()"><span class="ico" id="icoEu">👤</span><span>Eu</span></div>
</div>
</div>

<div class="modal" id="profileM">
<div style="flex:1" onclick="WORK.closeM()"></div>
<div class="profile-sheet">
<div class="profile-head">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
<span style="color:#D4AF37;font-weight:900">👤 MEU PERFIL</span>
<span onclick="WORK.closeM()" style="font-size:26px;color:#D4AF37;background:rgba(212,175,55,.15);width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid rgba(212,175,55,.3);cursor:pointer">×</span>
</div>
<div class="avatar-wrap" onclick="WORK.pickAvatar()">
<div class="avatar" id="avatarBox">👤</div>
<div class="avatar-edit">📷</div>
</div>
<h3 id="pNameView">Seu Nome</h3>
<p id="pNickView" style="font-size:13px;color:#D4AF37;margin-top:2px">@apelido</p>
<div class="stats">
<div class="stat"><b id="statV">0</b><span>VÍDEOS</span></div>
<div class="stat"><b id="statL">0</b><span>LIKES</span></div>
<div class="stat"><b id="statS">0</b><span>SEGUIDORES</span></div>
</div>
</div>
<div class="profile-body">
<div class="input-group"><span class="input-label">Foto - Vai aparecer no botão Seguir</span><button onclick="WORK.pickAvatar()" style="width:100%;background:rgba(212,175,55,.12);border:1.5px dashed rgba(212,175,55,.35);border-radius:18px;padding:12px;color:#D4AF37;font-weight:800">📸 Escolher Foto</button></div>
<div class="input-group"><span class="input-label">Nome</span><input id="inName" class="input" placeholder="Seu nome"></div>
<div class="row">
<div class="input-group"><span class="input-label">Apelido / @</span><input id="inNick" class="input" placeholder="apelido"></div>
<div class="input-group"><span class="input-label">Idade</span><input id="inAge" class="input" type="number" placeholder="25"></div>
</div>
<div class="input-group"><span class="input-label">Sobre você</span><textarea id="inBio" class="input" style="min-height:84px;resize:none" placeholder="Sobre você..." maxlength="120"></textarea></div>
<button class="save-btn" onclick="WORK.saveProfile()">💾 SALVAR PERFIL 👑</button>
</div>
</div>
</div>

<div class="modal" id="listM"><div style="flex:1" onclick="WORK.closeM()"></div><div style="position:absolute;bottom:0;left:0;right:0;background:#1d1d1d;border-radius:28px 28px 0 0;padding:18px;border-top:1.5px solid rgba(212,175,55,.28)"><div style="display:flex;justify-content:space-between;font-weight:900"><span style="color:#D4AF37">Meus vídeos • <span id="cMy">0</span></span><span onclick="WORK.closeM()" style="font-size:26px;color:#D4AF37">×</span></div><div id="grid" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px"></div></div></div>
<div id="cam"><video id="camEl" autoplay playsinline muted></video><button onclick="WORK.closeCam()" style="position:absolute;top:16px;left:16px;background:rgba(0,0,0,.5);color:#D4AF37;border:1.5px solid rgba(212,175,55,.3);padding:9px 16px;border-radius:24px;z-index:2">✕ Fechar</button></div>
<input type="file" id="fileAvatar" accept="image/*" style="display:none">
<input type="file" id="file" accept="video/*" style="display:none">

<script>
const WORK={
profile:{name:'',nick:'',age:'',bio:'',avatar:''},
videos:[
{id:'w1',user:"@work",desc:"Clica em EU agora funciona! 👑",img:"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?q=80&w=1000",likes:2451,liked:false,com:34,share:89,follow:false,type:"img",isDefault:true},
],
cur:0,
toast(t){let e=document.getElementById('toast');e.innerText=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2000)},
mexe(el){if(!el)return;el.classList.remove('mexendo');void el.offsetWidth;el.classList.add('mexendo');setTimeout(()=>el.classList.remove('mexendo'),9000)},
loadProfile(){try{let p=JSON.parse(localStorage.getItem('work_profile')||'null');if(p){this.profile=p;document.getElementById('inName').value=p.name||'';document.getElementById('inNick').value=p.nick||'';document.getElementById('inAge').value=p.age||'';document.getElementById('inBio').value=p.bio||'';if(p.avatar){document.getElementById('avatarBox').innerHTML=`<img src="${p.avatar}">`;document.getElementById('icoEu').innerHTML=`<img src="${p.avatar}" style="width:28px;height:28px;border-radius:50%;border:1.5px solid #FFD700;object-fit:cover">`}document.getElementById('pNameView').innerText=p.name||'Seu Nome';document.getElementById('pNickView').innerText=`@${p.nick||'apelido'} ${p.age?'• '+p.age+' anos':''}`}}catch{}},
openProfile(){
console.log('ABRINDO PERFIL - BOTAO EU CLICADO');
this.loadProfile();
let modal=document.getElementById('profileM');
modal.classList.add('on');
modal.style.display='flex';
document.getElementById('statV').innerText='0';
this.toast('👤 Perfil aberto!');
},
closeM(){
document.querySelectorAll('.modal').forEach(m=>{
m.classList.remove('on');
m.style.display='none';
});
},
saveProfile(){
let name=document.getElementById('inName').value.trim();
let nick=document.getElementById('inNick').value.trim().replace('@','');
let age=document.getElementById('inAge').value.trim();
let bio=document.getElementById('inBio').value.trim();
this.profile={...this.profile,name,nick,age,bio};
localStorage.setItem('work_profile',JSON.stringify(this.profile));
document.getElementById('pNameView').innerText=name||'Seu Nome';
document.getElementById('pNickView').innerText=`@${nick||'apelido'} ${age?'• '+age+' anos':''}`;
this.toast('👑 Perfil salvo! Sua foto no botão SEGUIR!');
this.closeM();
this.render();
},
pickAvatar(){document.getElementById('fileAvatar').click()},
render(){
let v=this.videos[this.cur];let prof=this.profile;
let media=`<div style="position:absolute;inset:0;background-size:cover;background-position:center;background-image:url('${v.img}')"></div>`;
let followBtn='';
if(prof.avatar){
followBtn=`<div style="position:relative;width:68px;height:68px;border-radius:26px;border:3px solid #FFD700;overflow:visible"><img src="${prof.avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:23px"><div style="position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);width:26px;height:26px;border-radius:50%;background:${v.follow?'#000':'linear-gradient(145deg,#FFD700,#D4AF37)'};border:2.5px solid #000;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:${v.follow?'#FFD700':'#000'}">${v.follow?'✓':'＋'}</div></div>`;
}else{
followBtn=`<div class="btn">${v.follow?'✓':'＋'}</div>`;
}
document.getElementById('stage').innerHTML=`
${media}<div style="position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.96) 0%,transparent 58%)"></div>
<div class="top"><div class="pill on">EU CORRIGIDO ✨</div></div>
<div class="actions">
<div class="act" onclick="WORK.mexe(this.querySelector('.btn'));WORK.like()"><div class="btn">${v.liked?'❤️':'♡'}</div><div class="cnt">${v.likes}</div></div>
<div class="act" onclick="WORK.follow()">${followBtn}<div class="cnt" style="margin-top:10px">${v.follow?'Seguindo':'Seguir'}</div></div>
</div>
<div class="meta"><div class="user">${prof.avatar?`<img src="${prof.avatar}" style="width:34px;height:34px;border-radius:50%;border:2px solid #D4AF37;object-fit:cover">`:''} ${prof.nick?'@'+prof.nick:v.user}</div><div style="font-size:13px;margin-top:6px">${prof.bio||v.desc}</div></div>
`;
},
like(){let v=this.videos[this.cur];v.liked=!v.liked;v.likes+=v.liked?1:-1;this.render()},
follow(){let v=this.videos[this.cur];v.follow=!v.follow;this.render();this.toast(v.follow?'👑 Seguindo!':'❌')},
my(){document.getElementById('listM').classList.add('on');document.getElementById('listM').style.display='flex';document.getElementById('cMy').innerText='0'},
openCam(){document.getElementById('cam').classList.add('on');navigator.mediaDevices.getUserMedia({video:true,audio:true}).then(s=>{document.getElementById('camEl').srcObject=s})},
closeCam(){document.getElementById('cam').classList.remove('on');let s=document.getElementById('camEl').srcObject;if(s) s.getTracks().forEach(t=>t.stop())}
};
document.getElementById('fileAvatar').addEventListener('change',e=>{
let f=e.target.files[0];if(!f)return;
let r=new FileReader();r.onload=ev=>{
let b64=ev.target.result;
WORK.profile.avatar=b64;
document.getElementById('avatarBox').innerHTML=`<img src="${b64}">`;
document.getElementById('icoEu').innerHTML=`<img src="${b64}" style="width:28px;height:28px;border-radius:50%;border:1.5px solid #FFD700;object-fit:cover">`;
localStorage.setItem('work_profile',JSON.stringify(WORK.profile));
WORK.toast('📸 Foto agora no botão SEGUIR!');
WORK.render();
};r.readAsDataURL(f);
});
WORK.render();WORK.loadProfile();
</script>
</body>
</html>
