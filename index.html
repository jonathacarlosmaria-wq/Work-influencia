<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100dvh;background:#000;overflow:hidden;font-family:-apple-system,sans-serif}
#splash{position:fixed;inset:0;z-index:99999;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity.9s ease}
#splash video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#splash::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,.15),rgba(0,0,0,.85))}
.s-content{position:relative;z-index:3;text-align:center}
.s-content h1{font-size:52px;font-weight:900;letter-spacing:-2px;text-shadow:0 0 15px #ff4500,0 0 40px #f00}
.sub{color:#ff8c00;font-weight:900;letter-spacing:6px;font-size:11px;margin-top:10px}
#loader{width:160px;height:3px;background:rgba(255,255,255,.2);border-radius:10px;margin:24px auto 0;overflow:hidden}
#loader div{width:0;height:100%;background:linear-gradient(90deg,#ff2a00,#ffae00);animation:load 5s linear forwards}
@keyframes load{to{width:100%}}
#app{width:100%;max-width:420px;height:100dvh;margin:0 auto;background:#000;display:flex;flex-direction:column;position:relative}
#feed{flex:1;overflow-y:scroll;scroll-snap-type:y mandatory;background:#000}
.post{height:100dvh;width:100%;position:relative;scroll-snap-align:start;background:#111 center/cover no-repeat;flex-shrink:0;overflow:hidden}
.post video{width:100%;height:100%;object-fit:cover;display:block;background:#000;position:absolute;inset:0}
.btnSom{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.65);width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;z-index:8;border:3px solid #fff}
.watermark{position:absolute;left:10px;top:14px;z-index:9;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.15);padding:4px 10px;border-radius:20px;color:rgba(255,255,255,.75);font-size:8.5px;font-weight:900}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#00ff88;color:#000;padding:10px 18px;border-radius:24px;font-weight:900;font-size:11px;z-index:9999;display:none}
.rightBar{position:absolute;right:8px;bottom:90px;z-index:10;display:flex;flex-direction:column;gap:12px;width:60px}
.btnTik{border:none;background:none;display:flex;flex-direction:column;align-items:center;cursor:pointer;width:100%}
.iconTik{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;background:rgba(35,35,35,.85);border:1.5px solid rgba(255,255,255,.18)}
.iconTik.fire{background:radial-gradient(circle at 30% 25%,#ff8c00,#ff4500 55%,#8b0000)}
.iconTik.fire.on{background:#ff4500}
.iconTik.heart.on{background:#ff1844}
.iconTik.save.on{background:#ffcc00;color:#000}
.txtTik{color:#fff;font-size:8.5px;font-weight:800;margin-top:3px;text-align:center}
.info{position:absolute;left:10px;right:76px;bottom:82px;z-index:10;background:rgba(0,0,0,.55);border:1px solid rgba(255,69,0,.22);border-radius:12px;padding:9px 10px}
.nav{height:64px;background:#0a0700;border-top:1.5px solid rgba(255,69,0,.35);display:flex;align-items:center;justify-content:space-around;z-index:30}
.nav button{flex:1;background:none;border:none;color:rgba(255,255,255,.5);font-size:8.5px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button.on{color:#ff8c00}
.plus{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#ff8c00,#ff2200);border:2.5px solid #fff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;margin-top:-20px}
.page{position:absolute;inset:0;background:#000;z-index:20;display:none;flex-direction:column;overflow-y:auto;padding-bottom:70px}
.page.show{display:flex}
.card{background:rgba(25,12,0,.92);border:1px solid rgba(255,69,0,.22);border-radius:12px;padding:12px;margin:10px}
.input{width:100%;padding:11px;background:#1e1100;border:1px solid rgba(255,69,0,.32);border-radius:10px;color:#fff;margin-top:7px}
.btn{width:100%;padding:14px;background:linear-gradient(90deg,#ff4500,#ff8c00);border:none;border-radius:12px;color:#000;font-weight:900;margin-top:10px;cursor:pointer}
.btnPostar{width:100%;padding:18px;background:linear-gradient(90deg,#00ff88,#00ff44);border:3px solid #fff;border-radius:14px;color:#000;font-weight:900;font-size:16px;margin-top:10px;display:none}
.btnPostar.show{display:block}
.previewArea{display:none;margin-top:10px;border:3px solid #00ff88;border-radius:14px;overflow:hidden;position:relative}
.previewArea.show{display:block}
</style>
</head>
<body>
<div id="splash"><video autoplay muted loop playsinline><source src="https://videos.pexels.com/video-files/3191572/3191572-uhd_2560_1440_25fps.mp4" type="video/mp4"></video><div class="s-content"><h1>work influencer</h1><div class="sub">🔥 CARREGANDO</div><div id="loader"><div></div></div></div></div>
<div id="app">
<div id="feed"></div>
<div id="toast"></div>
<div id="pCriar" class="page"><div class="card"><div id="previewArea" class="previewArea"><video id="previewVideo" style="width:100%;height:40vh;object-fit:cover" controls></video></div><button id="btnPostar" class="btnPostar" onclick="postar()">🚀 POSTAR AGORA 150MB</button><input id="file" type="file" accept="video/*"><input id="desc" class="input" placeholder="Legenda..."><input id="nomeUser" class="input" placeholder="Seu @nome"></div></div>
<div class="nav"><button id="b0" class="on" onclick="go(0)"><i class="fa-solid fa-house"></i>Inicio</button><button onclick="go(2)"><div class="plus">+</div></button><button onclick="go(4)"><i class="fa-solid fa-user"></i>Eu</button></div>
</div>
<script>
const SUPABASE_URL='https://rjrjdfwxqbjjfflqpydm.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ4cmpkZnd4cWJqamZmbHFweWRtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExNDg1MTksImV4cCI6MjEwNjcyNDUxOX0.HNJ0nJ_XJHNmjyWxhd7MyS2IrCLlWB85rIVKQqQrsQU';
const supa=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON);
let userNome=localStorage.getItem("userNome")||"",tempFileObj=null;
function toast(m){let t=document.getElementById('toast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500);}
async function postar(){
 let d=document.getElementById("desc").value||"Meu vídeo";
 if(!tempFileObj){alert("Escolhe vídeo");return;}
 let btn=document.getElementById("btnPostar");
 btn.innerText="⏳ ENVIANDO..."; btn.disabled=true;
 try{
   let nome=Date.now()+"_"+tempFileObj.name.replace(/\s/g,"_");
   let {error}=await supa.storage.from("videos").upload(nome,tempFileObj,{contentType:tempFileObj.type});
   if(error) throw error;
   let {data:pub}=supa.storage.from("videos").getPublicUrl(nome);
   await supa.from("posts").insert([{video_url:pub.publicUrl,username:userNome||"anon",description:d}]);
   toast("✅ POSTADO!"); location.reload();
 }catch(e){alert("Erro: "+e.message);} finally{btn.innerText="🚀 POSTAR AGORA 150MB"; btn.disabled=false;}
}
document.getElementById("file").addEventListener("change",e=>{
 let f=e.target.files[0]; tempFileObj=f;
 let url=URL.createObjectURL(f);
 document.getElementById("previewVideo").src=url;
 document.getElementById("previewArea").classList.add("show");
 document.getElementById("btnPostar").classList.add("show");
});
function go(n){document.querySelectorAll(".page").forEach(p=>p.classList.remove("show")); if(n==2) document.getElementById("pCriar").classList.add("show");}
setTimeout(()=>{let s=document.getElementById('splash'); if(s){s.style.opacity='0'; setTimeout(()=>s.remove(),900);}},4000);
</script>
</body>
</html>
