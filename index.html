<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WORK FIRE - COM FOTO PERFIL</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100dvh;background:#000;overflow:hidden;font-family:-apple-system,sans-serif}
#app{width:100%;max-width:420px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;background:#000;position:relative}
#feed{flex:1;overflow-y:scroll;scroll-snap-type:y mandatory}
#feed::-webkit-scrollbar{display:none}
.post{height:100dvh;width:100%;position:relative;scroll-snap-align:start;background:#0a0a0a center/cover no-repeat}
.post::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.8) 100%);pointer-events:none}
.sideL{position:absolute;left:10px;bottom:112px;display:flex;flex-direction:column;gap:16px;z-index:15;width:66px}
.sideR{position:absolute;right:10px;bottom:112px;display:flex;flex-direction:column;gap:16px;z-index:15;width:66px}
.b{border:none;background:none;display:flex;flex-direction:column;align-items:center;width:100%;cursor:pointer}
.i{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;backdrop-filter:blur(12px);transition:.25s}
.i.fire{background:radial-gradient(120% 120% at 30% 20%,#ff8a00 0%,#ff4500 40%,#8b0000 100%);border:1.5px solid rgba(255,140,0,.6);color:#fff}
.i.fire.active{box-shadow:0 0 24px rgba(255,0,0,.7);transform:scale(1.05)}
.i.heart,.i.chat,.i.share,.i.save{background:rgba(20,20,20,.65);border:1.5px solid rgba(255,255,255,.15);color:#fff}
.i.heart.liked{background:radial-gradient(120% 120% at 30% 20%,#ff5a8a 0%,#ff0040 60%,#cc0033 100%);transform:scale(1.05)}
.i.save.active{background:#ffcc00;color:#000}
@keyframes dance{0%{transform:scale(1)}15%{transform:scale(1.35,.65) rotate(-5deg)}30%{transform:scale(.7,1.35) rotate(5deg)}50%{transform:scale(1.15,.85) rotate(-3deg)}100%{transform:scale(1.05)}}
.i.anim{animation:dance.65s cubic-bezier(.34,1.56,.64,1)}
.c{color:#fff;font-size:10px;font-weight:700;margin-top:6px;text-align:center;text-shadow:0 1px 8px #000}
.info{position:absolute;left:82px;right:82px;bottom:86px;background:linear-gradient(180deg,rgba(20,10,0,.9),rgba(0,0,0,.9));border:1px solid rgba(255,69,0,.3);border-radius:14px;padding:10px 12px;z-index:10;backdrop-filter:blur(20px)}
.info b{color:#ff8c00;font-size:12px}
.meta{color:rgba(255,255,255,.6)!important;font-size:10px!important;display:flex;gap:8px;margin-top:6px!important}
.nav{height:70px;min-height:70px;background:linear-gradient(180deg,#0f0a00,#080300);border-top:1.5px solid rgba(255,69,0,.25);display:flex;align-items:center;z-index:20}
.nav button{flex:1;min-width:0;background:none;border:none;color:rgba(255,255,255,.4);font-size:9px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button.on{color:#ff8c00}
.nav button i{font-size:18px}
.plus{width:52px;height:52px;border-radius:50%;background:radial-gradient(120% 120% at 30% 20%,#ff8c00,#ff4500 50%,#cc2200);border:2.5px solid #fff;color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;margin-top:-26px;box-shadow:0 6px 20px rgba(255,69,0,.5),0 0 0 4px rgba(0,0,0,.8)}
.page{position:absolute;inset:0;background:#000;z-index:30;display:none;flex-direction:column;overflow:auto}
.page.show{display:flex}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:99;display:none;align-items:flex-end}
.sheet.show{display:flex}
.sheetBox{background:linear-gradient(180deg,#1e1400,#140a00);width:100%;border-radius:20px 20px 0 0;max-height:78dvh;display:flex;flex-direction:column}
.input{width:100%;padding:12px;background:rgba(30,15,0,.8);border:1px solid rgba(255,69,0,.3);border-radius:10px;color:#fff;margin-top:8px}
.btn{width:100%;padding:14px;background:linear-gradient(90deg,#ff4500,#ff8c00);border:none;border-radius:10px;color:#000;font-weight:900;margin-top:10px}
.card{background:linear-gradient(180deg,rgba(30,15,0,.9),rgba(20,8,0,.9));border:1px solid rgba(255,69,0,.2);border-radius:12px;padding:12px;margin:10px}
/* FOTO PERFIL */
.avatar{width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ff6a00,#8b0000);margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:36px;border:3px solid #ff8c00;box-shadow:0 0 20px rgba(255,69,0,.4);overflow:hidden;position:relative;cursor:pointer}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.edit{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.7);color:#ffcc00;font-size:9px;text-align:center;padding:3px;font-weight:900}
</style>
</head>
<body>
<div id="app">
<div id="feed"></div>

<div id="pBusca" class="page"><div style="display:flex;justify-content:space-between;padding:14px"><h3 style="color:#ff4500">🔍 Busca</h3><button onclick="closeAll()" style="background:none;border:none;color:#fff;font-size:20px"><i class="fa-solid fa-xmark"></i></button></div><div class="card"><input id="qBusca" class="input" placeholder="Buscar..." oninput="busca()"><div id="rBusca"></div></div></div>
<div id="pCriar" class="page"><div style="display:flex;justify-content:space-between;padding:14px"><h3 style="color:#ff4500">🔥 Criar</h3><button onclick="closeAll()" style="background:none;border:none;color:#fff;font-size:20px"><i class="fa-solid fa-xmark"></i></button></div><div class="card"><input id="file" type="file" accept="image/*,video/*" style="color:#fff;width:100%"><img id="prev" style="width:100%;margin-top:10px;border-radius:12px;display:none"><input id="desc" class="input" placeholder="Legenda..."><button class="btn" onclick="postar()">POSTAR</button></div></div>
<div id="pLive" class="page"><div style="display:flex;justify-content:space-between;padding:14px"><h3 style="color:#ff4500">🔴 Live Pix R$5</h3><button onclick="closeAll()" style="background:none;border:none;color:#fff;font-size:20px"><i class="fa-solid fa-xmark"></i></button></div><div id="liveBloq" class="card" style="border-color:#ffcc00;text-align:center"><b style="color:#ffcc00">Live bloqueada</b><div id="pixKey" style="background:#000;padding:10px;border-radius:10px;margin-top:8px;font-family:monospace;font-size:12px;color:#fff">Configure no Admin</div><button class="btn" style="background:linear-gradient(90deg,#ffcc00,#ff8c00)" onclick="pagarPix()">JÁ PAGUEI R$5</button></div><div id="liveOk" class="card" style="display:none;border-color:#00ff88;text-align:center"><b style="color:#00ff88">✅ Live liberada hoje!</b></div></div>

<div id="pEu" class="page">
<div style="display:flex;justify-content:space-between;padding:14px;align-items:center"><b style="color:#ff4500">Eu</b><div style="display:flex;gap:8px"><button onclick="abrirAdmin()" style="background:linear-gradient(90deg,#ffcc00,#ff8c00);border:none;padding:8px 14px;border-radius:20px;font-size:11px;font-weight:900;color:#000"><i class="fa-solid fa-crown"></i> ADMIN</button><button onclick="closeAll()" style="background:rgba(255,255,255,.1);border:none;color:#fff;width:32px;height:32px;border-radius:50%"><i class="fa-solid fa-xmark"></i></button></div></div>

<!-- CADASTRO USUÁRIO COM FOTO - NOVO -->
<div style="text-align:center;padding:12px">
<input id="fotoPerfil" type="file" accept="image/*" style="display:none" onchange="trocarFoto(this)">
<div class="avatar" onclick="document.getElementById('fotoPerfil').click()">
<div id="avatarConteudo">🔥</div>
<div class="edit"><i class="fa-solid fa-camera"></i> TROCAR FOTO</div>
</div>
<input id="nomeUser" class="input" placeholder="Seu @nome" style="text-align:center;font-weight:900;color:#ff8c00;margin-top:12px" oninput="salvarNome()">
<div style="color:#ff8c00;font-size:13px;margin-top:4px" id="nomeShow">@fire.user</div>
<div style="color:#666;font-size:10px;margin-top:4px">Toque na foto para colocar sua foto</div>
<div id="infoLive" style="color:#666;font-size:10px;margin-top:4px"></div>
<div style="color:#444;font-size:8px;margin-top:4px">ID: <span id="uidShow"></span></div>
</div>

<div id="adminBox" style="display:none" class="card">
<h4 style="color:#ffcc00"><i class="fa-solid fa-rectangle-ad"></i> Painel Admin com Propaganda</h4>
<input id="pixChave" class="input" placeholder="Sua chave Pix">
<button class="btn" style="background:#00ff88;color:#000" onclick="salvarPix()">SALVAR PIX</button>
<hr style="border:none;border-top:1px solid rgba(255,69,0,.2);margin:16px 0">
<label style="color:#ffcc00;font-size:11px;font-weight:900">PROPAGANDA NO FEED</label>
<input id="adTxt" class="input" placeholder="Texto da propaganda">
<div style="display:flex;gap:8px;margin-top:8px;align-items:center"><input id="adFreq" type="number" value="3" class="input" style="margin:0;width:70px"><label style="color:#fff;font-size:11px"><input type="checkbox" id="adOn"> Ativar</label></div>
<button class="btn" style="background:linear-gradient(90deg,#ffcc00,#ff8c00);color:#000" onclick="salvarAd()">SALVAR PROPAGANDA</button>
</div>

<div class="card"><b style="color:#ff8c00"><i class="fa-solid fa-bookmark"></i> Salvos</b><div id="listaSalvos"></div></div>
<div class="card"><b style="color:#ff8c00"><i class="fa-solid fa-clapperboard"></i> Meus vídeos</b><div id="meusVideos"></div></div>
</div>

<div class="nav">
<button id="b0" class="on" onclick="go(0)"><i class="fa-solid fa-house"></i><span>Inicio</span></button>
<button id="b1" onclick="go(1)"><i class="fa-solid fa-magnifying-glass"></i><span>Busca</span></button>
<button id="b2" onclick="go(2)"><div class="plus"><i class="fa-solid fa-plus"></i></div></button>
<button id="b3" onclick="go(3)"><i class="fa-solid fa-tower-broadcast"></i><span>Live</span></button>
<button id="b4" onclick="go(4)"><i class="fa-solid fa-user"></i><span>Eu</span></button>
</div>
</div>

<script>
let uid=localStorage.getItem("uid")||"u_"+Math.random().toString(36).slice(2,8);localStorage.setItem("uid",uid);
let userFoto=localStorage.getItem("userFoto")||"";
let userNome=localStorage.getItem("userNome")||"fire.user";
let posts=JSON.parse(localStorage.getItem("posts_pro")||"null")||[{owner:"fire.influencer",img:"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=700",desc:"Layout com foto de perfil! 🔥",firedBy:[],likedBy:[],com:[],saveBy:[],sharedBy:[],share:8,isTop:true}];
let cur=0,temp="",cfg=JSON.parse(localStorage.getItem("cfg")||"null")||{pixK:"Configure no Admin",adT:"",adF:3,adOn:false};

function save(){localStorage.setItem("posts_pro",JSON.stringify(posts));render();}
function saveCfg(){localStorage.setItem("cfg",JSON.stringify(cfg));render();}
function salvarNome(){let n=document.getElementById("nomeUser").value.trim().replace("@","")||"fire.user";userNome=n;localStorage.setItem("userNome",n);document.getElementById("nomeShow").innerText="@"+n;render();}
function trocarFoto(input){
let f=input.files[0];if(!f)return;
let r=new FileReader();r.onload=e=>{
userFoto=e.target.result;localStorage.setItem("userFoto",userFoto);
document.getElementById("avatarConteudo").innerHTML=`<img src="${userFoto}">`;
render();
};r.readAsDataURL(f);
}

function render(){
let list=[...posts].sort((a,b)=>(b.isTop?1:0)-(a.isTop?1:0));
let feed=[];list.forEach((p,i)=>{feed.push(p);if(cfg.adOn&&(i+1)%cfg.adF===0)feed.push({ad:true});});
document.getElementById("feed").innerHTML=feed.map(p=>{
if(p.ad) return `<div class="post" style="background:linear-gradient(135deg,#1a1a00,#332200);border:2px solid #ffcc00;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px"><div style="background:#ffcc00;color:#000;padding:4px 10px;border-radius:20px;font-size:9px;font-weight:900">ANÚNCIO</div><b style="color:#ffcc00">${cfg.adT||"Sua propaganda aqui"}</b></div>`;
let idx=posts.indexOf(p);let fired=p.firedBy.includes(uid),liked=p.likedBy.includes(uid),saved=p.saveBy.includes(uid);
return `<div class="post" style="background-image:url('${p.img}')"><div class="sideL"><button class="b" onclick="fire(${idx},this)"><div class="i fire ${fired?'active':''}"><i class="fa-solid fa-fire"></i></div><div class="c"><b>${(p.firedBy.length||0).toLocaleString('pt-BR')}</b><br>Chamas</div></button><button class="b" onclick="like(${idx},this)"><div class="i heart ${liked?'liked':''}"><i class="${liked?'fa-solid':'fa-regular'} fa-heart"></i></div><div class="c"><b>Curtir</b><br>${p.likedBy.length}</div></button><button class="b" onclick="openC(${idx})"><div class="i chat"><i class="fa-regular fa-comment-dots"></i></div><div class="c"><b>${p.com.length}</b><br>comen</div></button></div><div class="sideR"><button class="b" onclick="openS(${idx})"><div class="i share"><i class="fa-solid fa-rocket"></i></div><div class="c"><b>${p.sharedBy.length||p.share}</b><br>compar</div></button><button class="b" onclick="savePost(${idx},this)"><div class="i save ${saved?'active':''}"><i class="${saved?'fa-solid':'fa-regular'} fa-bookmark"></i></div><div class="c"><b>Salvar</b></div></button></div><div class="info"><b>@${p.owner}</b><div>${p.desc}</div><div class="meta"><span>🔥 ${p.firedBy.length}</span><span>💖 ${p.likedBy.length}</span></div></div></div>`;
}).join("");
document.getElementById("listaSalvos").innerHTML=posts.filter(p=>p.saveBy.includes(uid)).map(p=>`<div style="display:flex;gap:8px;margin-top:8px"><img src="${p.img}" style="width:44px;height:44px;border-radius:8px"><div style="color:#fff;font-size:11px">${p.desc}</div></div>`).join("")||"<div style='color:#555;font-size:11px'>Nenhum salvo</div>";
document.getElementById("meusVideos").innerHTML=posts.filter(p=>p.owner===userNome).map(p=>`<div style="display:flex;gap:8px;margin-top:8px;background:rgba(255,255,255,.05);padding:6px;border-radius:8px"><img src="${p.img}" style="width:44px;height:44px;border-radius:8px"><div style="color:#fff;font-size:11px">${p.desc}</div></div>`).join("")||"<div style='color:#555;font-size:11px'>Nenhum vídeo ainda</div>";
document.getElementById("pixKey").innerText=cfg.pixK;document.getElementById("pixChave").value=cfg.pixK!="Configure no Admin"?cfg.pixK:"";document.getElementById("adTxt").value=cfg.adT;document.getElementById("adFreq").value=cfg.adF;document.getElementById("adOn").checked=cfg.adOn;
document.getElementById("uidShow").innerText=uid;
document.getElementById("nomeUser").value=userNome;
document.getElementById("nomeShow").innerText="@"+userNome;
if(userFoto){document.getElementById("avatarConteudo").innerHTML=`<img src="${userFoto}">`;}
checkLive();
}
function anim(el){let i=el.querySelector('.i');i.classList.remove('anim');void i.offsetWidth;i.classList.add('anim');setTimeout(()=>i.classList.remove('anim'),700);}
function fire(i,btn){anim(btn);let p=posts[i];if(p.firedBy.includes(uid))p.firedBy=p.firedBy.filter(x=>x!==uid);else p.firedBy.push(uid);save();}
function like(i,btn){anim(btn);let p=posts[i];if(p.likedBy.includes(uid))p.likedBy=p.likedBy.filter(x=>x!==uid);else p.likedBy.push(uid);save();}
function savePost(i,btn){anim(btn);let p=posts[i];if(p.saveBy.includes(uid))p.saveBy=p.saveBy.filter(x=>x!==uid);else p.saveBy.push(uid);save();}
function openC(i){cur=i;let t=prompt("Comentar:");if(t){posts[i].com.push({u:userNome,t:t});save();}}
function openS(i){cur=i;if(!posts[i].sharedBy.includes(uid)){posts[i].sharedBy.push(uid);save();}window.open("https://wa.me/?text="+encodeURIComponent(location.href),"_blank");}
function go(n){document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("on"));document.getElementById("b"+n).classList.add("on");document.querySelectorAll(".page").forEach(p=>p.classList.remove("show"));if(n==1)document.getElementById("pBusca").classList.add("show");if(n==2)document.getElementById("pCriar").classList.add("show");if(n==3)document.getElementById("pLive").classList.add("show");if(n==4)document.getElementById("pEu").classList.add("show");}
function closeAll(){document.querySelectorAll(".page").forEach(p=>p.classList.remove("show"));document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("on"));document.getElementById("b0").classList.add("on");}
function abrirAdmin(){let s=prompt("Senha Admin:");if(s==="fire123"){document.getElementById("adminBox").style.display="block";document.getElementById("adminBox").scrollIntoView({behavior:"smooth"})}else if(s)alert("Senha: fire123");}
function salvarPix(){let k=document.getElementById("pixChave").value.trim();if(!k)return alert("Coloque Pix");cfg.pixK=k;saveCfg();alert("Pix salvo!");}
function salvarAd(){cfg.adT=document.getElementById("adTxt").value.trim();cfg.adF=parseInt(document.getElementById("adFreq").value)||3;cfg.adOn=document.getElementById("adOn").checked;saveCfg();alert("Propaganda salva!");}
function checkLive(){let pago=localStorage.getItem("livePago")===new Date().toDateString();document.getElementById("liveBloq").style.display=pago?"none":"block";document.getElementById("liveOk").style.display=pago?"block":"none";document.getElementById("infoLive").innerText=pago?"✅ Live liberada":"🔒 Bloqueada";}
function pagarPix(){localStorage.setItem("livePago",new Date().toDateString());checkLive();}
function busca(){let q=document.getElementById("qBusca").value.toLowerCase();let r=posts.filter(p=>p.desc.toLowerCase().includes(q));document.getElementById("rBusca").innerHTML=r.map(p=>`<div style="display:flex;gap:8px;margin-top:8px"><img src="${p.img}" style="width:44px;height:44px;border-radius:8px"><div style="color:#fff;font-size:11px">${p.desc}</div></div>`).join("")||"<div style='color:#555'>Nada</div>";}
document.getElementById("file").addEventListener("change",e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=ev=>{temp=ev.target.result;document.getElementById("prev").src=temp;document.getElementById("prev").style.display="block";};r.readAsDataURL(f);});
function postar(){let d=document.getElementById("desc").value.trim()||"Meu vídeo 🔥";if(!temp)return alert("Escolha foto/vídeo");posts.unshift({owner:userNome,img:temp,desc:d,firedBy:[],likedBy:[],com:[],saveBy:[],sharedBy:[],share:0,isTop:false});temp="";document.getElementById("prev").style.display="none";save();closeAll();}
render();
</script>
</body>
</html>
