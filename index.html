<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#ff4500">
<title>Work Influencia</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;color:#fff;min-height:100vh;padding-bottom:80px}
.topo{padding:16px;background:#0a0a0a;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222}
.topo h1{color:#ff4500;font-size:18px}
.botoes{display:flex;gap:8px;padding:12px}
.botoes button{flex:1;padding:14px;border-radius:12px;border:1px solid #333;background:#1a1a1a;color:#fff;font-weight:bold}
.botoes button.ativo{background:#ff8c00;color:#000;border-color:#ff8c00}
.area{margin:12px;background:#111;border-radius:16px;height:400px;overflow:hidden;border:1px solid #222;position:relative;display:flex;align-items:center;justify-content:center}
.area video{width:100%;height:100%;object-fit:cover}
.btn{width:calc(100% - 24px);margin:10px 12px;background:linear-gradient(90deg,#ff4500,#ff8c00);color:#fff;border:none;padding:16px;border-radius:14px;font-weight:bold;font-size:15px}
#btnGravar{display:none;background:#000;border:1px solid #ff8c00;color:#ff8c00}
#btnParar{display:none;background:#ff0000}
.timer{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.7);padding:6px 12px;border-radius:20px;font-size:14px}
.dot{position:absolute;top:12px;right:12px;width:12px;height:12px;background:red;border-radius:50%;animation:piscar 1s infinite}
@keyframes piscar{0%,100%{opacity:1}50%{opacity:0}}
.nav{position:fixed;bottom:0;left:0;right:0;background:#0a0a0a;border-top:1px solid #222;display:flex;justify-content:space-around;padding:10px 0}
.nav div{text-align:center;font-size:10px;opacity:.6}
.nav .plus{width:50px;height:50px;background:linear-gradient(90deg,#ff4500,#ff8c00);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;margin-top:-25px;opacity:1}
</style>
<script>
// MANIFEST DENTRO DO MESMO ARQUIVO - resolve PWABuilder e APK
const manifest={name:"work influencer",short_name:"Work",display:"standalone",start_url:".",background_color:"#000",theme_color:"#ff4500",icons:[{src:"https://cdn-icons-png.flaticon.com/512/833/833314.png",sizes:"512x512",type:"image/png"}]};
const blob=new Blob([JSON.stringify(manifest)],{type:"application/json"});
const urlManifest=URL.createObjectURL(blob);
document.write('<link rel="manifest" href="'+urlManifest+'">');
</script>
</head>
<body>
<div class="topo"><h1>📹 Postar 1:30</h1><span onclick="history.back()">✕</span></div>
<div class="botoes">
<button id="bFrente" onclick="abrir('user')">FRENTE</button>
<button id="bTras" onclick="abrir('environment')">TRÁS</button>
<button id="bTrocar" class="ativo" onclick="trocar()">TROCAR</button>
</div>
<div class="area" id="area"><div style="text-align:center"><div style="font-size:50px">📹</div><p style="margin-top:10px;color:#ff8c00">Grave seu vídeo 1:30!</p><p style="font-size:12px;opacity:.5;margin-top:5px">Toque em ABRIR CÂMERA</p></div></div>
<button class="btn" onclick="abrir('user')">ABRIR CÂMERA COM ÁUDIO</button>
<button class="btn" id="btnGravar" onclick="gravar()">● COMEÇAR GRAVAÇÃO</button>
<button class="btn" id="btnParar" onclick="parar()">■ PARAR E POSTAR</button>

<script>
let stream=null,recorder=null,chunks=[],facing='user',gravando=false,interval=null,sec=0;

async function abrir(f){
  facing=f;
  try{
    if(stream) stream.getTracks().forEach(t=>t.stop());
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:f},audio:true});
    document.getElementById('area').innerHTML='<video id="v" autoplay playsinline muted style="width:100%;height:100%;object-fit:cover"></video><div class="timer" id="timer">00:00</div><div class="dot" id="dot" style="display:none"></div>';
    const v=document.getElementById('v'); v.srcObject=stream; await v.play();
    document.getElementById('btnGravar').style.display='block';
    document.querySelectorAll('.botoes button').forEach(b=>b.classList.remove('ativo'));
    if(f==='user') document.getElementById('bFrente').classList.add('ativo'); else document.getElementById('bTras').classList.add('ativo');
  }catch(e){
    alert('PERMISSÃO BLOQUEADA! Faça isso:\n1. Configurações > Apps > Work Influencia\n2. Permissões > Câmera e Microfone > Permitir\n3. Feche e abra o app de novo\n\nErro: '+e.message);
  }
}
function trocar(){ abrir(facing==='user'?'environment':'user'); }
function gravar(){
  if(!stream) return abrir('user');
  chunks=[]; recorder=new MediaRecorder(stream);
  recorder.ondataavailable=e=>{if(e.data.size>0) chunks.push(e.data);};
  recorder.onstop=()=>{
    const blob=new Blob(chunks,{type:'video/webm'});
    const u=URL.createObjectURL(blob);
    document.getElementById('area').innerHTML='<video src="'+u+'" controls autoplay loop style="width:100%;height:100%;object-fit:cover"></video><div style="position:absolute;bottom:10px;left:10px;background:#ff4500;padding:6px 12px;border-radius:20px;font-size:12px">VÍDEO 1:30 PRONTO ✅</div>';
    alert('Vídeo gravado! '+ (blob.size/1024/1024).toFixed(1) +' MB');
  };
  recorder.start(); gravando=true; sec=0;
  document.getElementById('timer').style.display='block'; document.getElementById('timer').textContent='00:00 / 1:30';
  document.getElementById('dot').style.display='block';
  document.getElementById('btnGravar').style.display='none'; document.getElementById('btnParar').style.display='block';
  interval=setInterval(()=>{sec++; let m=String(Math.floor(sec/60)).padStart(2,'0'); let s=String(sec%60).padStart(2,'0'); document.getElementById('timer').textContent=m+':'+s+' / 1:30'; if(sec>=90) parar();},1000);
}
function parar(){ if(recorder&&gravando){ recorder.stop(); gravando=false; clearInterval(interval); document.getElementById('btnParar').style.display='none'; document.getElementById('btnGravar').style.display='block'; document.getElementById('btnGravar').innerText='● GRAVAR DE NOVO'; } }
</script>

<div class="nav"><div>🏠<br>Início</div><div>🔍<br>Busca</div><div class="plus">+</div><div>📡<br>Live</div><div>👤<br>Eu</div></div>
</body>
</html>
