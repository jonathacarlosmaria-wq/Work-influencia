<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WORK FIRE - LADO CERTO</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100dvh;background:#000;overflow:hidden;font-family:sans-serif}
#app{width:100%;max-width:420px;height:100dvh;margin:0 auto;background:#000;display:flex;flex-direction:column;position:relative}
#feed{flex:1;overflow-y:scroll;scroll-snap-type:y mandatory}#feed::-webkit-scrollbar{display:none}
.post{height:100dvh;width:100%;position:relative;scroll-snap-align:start;background:#0a0a0a center/cover no-repeat}
.post::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.85) 100%)}
.side{position:absolute;right:10px;bottom:110px;display:flex;flex-direction:column;gap:16px;z-index:10;width:62px;align-items:center}
.b{border:none;background:none;display:flex;flex-direction:column;align-items:center;width:100%;cursor:pointer}
.i{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;backdrop-filter:blur(12px);transition:.3s}
.i.fire{background:radial-gradient(#ff8a00,#ff4500);border:1.5px solid #ff8a00;color:#fff}
.i.fire.active{background:#ff0000;box-shadow:0 0 20px red;transform:scale(1.05)}
.i.heart,.i.chat,.i.share,.i.save{background:rgba(20,20,20,.7);border:1px solid rgba(255,255,255,.15);color:#fff}
.i.heart.liked{background:#ff2a6d;box-shadow:0 0 20px #ff2a6d}
.i.save.active{background:#ffcc00;color:#000}
@keyframes danca{0%{transform:scale(1)}20%{transform:scale(1.4,.6) rotate(-5deg)}40%{transform:scale(.7,1.4) rotate(5deg)}100%{transform:scale(1.05)}}
.i.anim{animation:danca.6s}
.c{color:#fff;font-size:10px;font-weight:700;margin-top:5px;text-align:center;text-shadow:0 1px 5px #000}
.info{position:absolute;left:10px;right:84px;bottom:80px;background:rgba(15,8,0,.9);border:1px solid rgba(255,69,0,.3);border-radius:12px;padding:10px;z-index:9;color:#fff}
.nav{height:68px;background:#100a00;border-top:1px solid rgba(255,69,0,.2);display:flex;align-items:center}
.nav button{flex:1;background:none;border:none;color:#666;font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center}
.nav button.on{color:#ff8c00}.plus{width:56px;height:56px;border-radius:50%;background:radial-gradient(#ff8c00,#ff4500);border:2px solid #fff;color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;margin-top:-26px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:99;display:none;align-items:flex-end}.sheet.show{display:flex}
.sheetBox{background:#1a1200;border-top:1px solid #ff450033;width:100%;border-radius:18px 18px 0 0;max-height:80dvh;display:flex;flex-direction:column}
.page{position:absolute;inset:0;background:#000;z-index:30;display:none;flex-direction:column;overflow:auto}.page.show{display:flex}
.input{width:100%;padding:11px;background:rgba(30,15,0,.9);border:1px solid #ff45004d;border-radius:10px;color:#fff;margin-top:8px}
.btn{width:100%;padding:13px;background:linear-gradient(90deg,#ff4500,#ff8c00);border:none;border-radius:10px;font-weight:900;margin-top:10px}
.shareGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px}
.shareItem{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:5px;color:#fff;font-size:9px;font-weight:700}
</style>
</head>
<body>
<div id="app">
<div id="feed"></div>
<div id="sC" class="sheet" onclick="this.classList.remove('show')"><div class="sheetBox"><div style="padding:12px;display:flex;justify-content:space-between"><b style="color:#ff8c00" id="ct">0 comentários</b><button onclick="document.getElementById('sC').classList.remove('show')" style="background:none;border:none;color:#fff"><i class="fa-solid fa-xmark"></i></button></div><div id="lC" style="flex:1;overflow:auto;padding:12px"></div><div style="padding:12px;display:flex;gap:8px"><input id="tC" class="input" style="margin:0;flex:1" placeholder="Comente..."><button onclick="sendC()" style="background:linear-gradient(90deg,#ff4500,#ff8c00);border:none;padding:0 16px;border-radius:10px;font-weight:900">></button></div></div></div>
<div id="sS" class="sheet" onclick="this.classList.remove('show')"><div class="sheetBox"><div style="padding:12px;display:flex;justify-content:space-between"><b style="color:#ff8c00">Compartilhar</b><button onclick="document.getElementById('sS').classList.remove('show')" style="background:none;border:none;color:#fff"><i class="fa-solid fa-xmark"></i></button></div><div class="shareGrid"><button class="shareItem" onclick="share('whatsapp')"><i class="fa-brands fa-whatsapp" style="color:#25D366;font-size:20px"></i>WhatsApp</button><button class="shareItem" onclick="share('facebook')"><i class="fa-brands fa-facebook" style="color:#1877F2;font-size:20px"></i>Facebook</button><button class="shareItem" onclick="share('instagram')"><i class="fa-brands fa-instagram" style="color:#E4405F;font-size:20px"></i>Instagram</button><button class="shareItem" onclick="share('twitter')"><i class="fa-brands fa-x-twitter" style="font-size:20px"></i>X</button><button class="shareItem" onclick="share('telegram')"><i class="fa-brands fa-telegram" style="color:#26A5E4;font-size:20px"></i>Telegram</button><button class="shareItem" onclick="share('tiktok')"><i class="fa-brands fa-tiktok" style="font-size:20px"></i>TikTok</button><button class="shareItem" onclick="share('copy')"><i class="fa-solid fa-link" style="color:#ff8c00;font-size:20px"></i>Copiar</button><button class="shareItem" onclick="share('native')"><i class="fa-solid fa-share-nodes" style="font-size:20px"></i>Mais</button></div></div></div>
<div id="pEu" class="page"><div style="padding:14px"><b style="color:#ff4500">Eu</b> <button onclick="document.querySelectorAll('.page').forEach(p=>p.classList.remove('show'))" style="float:right;background:none;border:none;color:#fff;font-size:20px"><i class="fa-solid fa-xmark"></i></button></div><div id="savedList" style="padding:12px"></div></div>
<div class="nav"><button class="on"><i class="fa-solid fa-house"></i>Inicio</button><button onclick="document.getElementById('pEu').classList.add('show')"><i class="fa-solid fa-fire"></i>Eu</button></div>
</div>
<script>
let uid=localStorage.getItem("uid")||"u_"+Math.random().toString(36).slice(2,7);localStorage.setItem("uid",uid);
let posts=JSON.parse(localStorage.getItem("posts"))||[{owner:"fire.work",img:"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=700",desc:"App no lado certo! Tudo na direita 🔥",firedBy:[],likedBy:[],com:[],saveBy:[],sharedBy:[]}];
let cur=0;function save(){localStorage.setItem("posts",JSON.stringify(posts));render();}
function anim(el){let i=el.querySelector('.i');i.classList.remove('anim');void i.offsetWidth;i.classList.add('anim');setTimeout(()=>i.classList.remove('anim'),600);}
function render(){document.getElementById("feed").innerHTML=posts.map((p,i)=>{let f=p.firedBy.includes(uid),l=p.likedBy.includes(uid),s=p.saveBy.includes(uid);return `<div class="post" style="background-image:url('${p.img}')"><div class="side"><button class="b" onclick="doFire(${i},this)"><div class="i fire ${f?'active':''}"><i class="fa-solid fa-fire"></i></div><div class="c">${p.firedBy.length}<br>${f?'Feito':'Chamas'}</div></button><button class="b" onclick="doLike(${i},this)"><div class="i heart ${l?'liked':''}"><i class="${l?'fa-solid':'fa-regular'} fa-heart"></i></div><div class="c">${p.likedBy.length}<br>${l?'Curtido':'Curtir'}</div></button><button class="b" onclick="anim(this);openC(${i})"><div class="i chat"><i class="fa-regular fa-comment-dots"></i></div><div class="c">${p.com.length}<br>Comen</div></button><button class="b" onclick="anim(this);openS(${i})"><div class="i share"><i class="fa-solid fa-share"></i></div><div class="c">${p.sharedBy.length}<br>Compar</div></button><button class="b" onclick="doSave(${i},this)"><div class="i save ${s?'active':''}"><i class="${s?'fa-solid':'fa-regular'} fa-bookmark"></i></div><div class="c">${s?'Salvo':'Salvar'}</div></button></div><div class="info"><b>@${p.owner}</b><div>${p.desc}</div></div></div>`}).join("");document.getElementById("savedList").innerHTML=posts.filter(p=>p.saveBy.includes(uid)).map(p=>`<div style="color:#fff;font-size:12px;margin:6px 0">${p.desc}</div>`).join("")||"Nada salvo";}
function doFire(i,b){anim(b);let p=posts[i];if(p.firedBy.includes(uid))p.firedBy=p.firedBy.filter(x=>x!==uid);else p.firedBy.push(uid);save();}
function doLike(i,b){anim(b);let p=posts[i];if(p.likedBy.includes(uid))p.likedBy=p.likedBy.filter(x=>x!==uid);else p.likedBy.push(uid);save();}
function doSave(i,b){anim(b);let p=posts[i];if(p.saveBy.includes(uid))p.saveBy=p.saveBy.filter(x=>x!==uid);else p.saveBy.push(uid);save();}
function openC(i){cur=i;document.getElementById("ct").innerText=posts[i].com.length+" comentários";document.getElementById("lC").innerHTML=posts[i].com.map(c=>`<div style="padding:8px 0;border-bottom:1px solid #222;color:#fff"><b style="color:#ff8c00">@${c.u}</b> ${c.t}</div>`).join("");document.getElementById("sC").classList.add("show");}
function sendC(){let t=document.getElementById("tC").value.trim();if(!t)return;posts[cur].com.push({u:"voce",t});document.getElementById("tC").value="";save();openC(cur);}
function openS(i){cur=i;document.getElementById("sS").classList.add("show");}
function share(tp){let url=location.href,text=encodeURIComponent(posts[cur].desc+" "+url);let m={whatsapp:`https://wa.me/?text=${text}`,facebook:`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`,telegram:`https://t.me/share/url?url=${encodeURIComponent(url)}`,twitter:`https://twitter.com/intent/tweet?text=${text}`};if(tp=='copy'){navigator.clipboard.writeText(url);alert("Link copiado!")}else if(tp=='native'&&navigator.share){navigator.share({text:posts[cur].desc,url})}else if(m[tp])window.open(m[tp],"_blank");else alert("Link: "+url);if(!posts[cur].sharedBy.includes(uid)){posts[cur].sharedBy.push(uid);save();}document.getElementById("sS").classList.remove("show");}
render();
</script>
</body>
</html>
