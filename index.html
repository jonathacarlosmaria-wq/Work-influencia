<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WORK FIRE - FINAL PROFISSIONAL</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100dvh;background:#000;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
#app{width:100%;max-width:420px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;background:#000;position:relative}
#feed{flex:1;overflow-y:scroll;scroll-snap-type:y mandatory;background:#000}
#feed::-webkit-scrollbar{display:none}
.post{height:100dvh;width:100%;position:relative;scroll-snap-align:start;background:#0a0a0a center/cover no-repeat;flex-shrink:0}
.post::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(0,0,0,.35) 65%,rgba(0,0,0,.88) 100%);pointer-events:none}
.sideL{position:absolute;left:10px;bottom:112px;display:flex;flex-direction:column;gap:16px;z-index:15;width:66px}
.sideR{position:absolute;right:10px;bottom:112px;display:flex;flex-direction:column;gap:16px;z-index:15;width:66px}
.b{border:none;background:none;display:flex;flex-direction:column;align-items:center;width:100%;cursor:pointer;position:relative}
.i{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;position:relative;transition:all .25s cubic-bezier(.34,1.56,.64,1);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.i.fire{background:radial-gradient(120% at 30% 20%,#ff8a00,#ff4500 45%,#8b0000);border:1.5px solid rgba(255,140,0,.6);box-shadow:0 4px 18px rgba(255,69,0,.45),inset 0 1px 2px rgba(255,255,255,.3);color:#fff}
.i.fire.active{background:radial-gradient(120% at 30% 20%,#ff3333,#ff0000 55%,#8b0000);border-color:#ff0000;box-shadow:0 0 26px rgba(255,0,0,.75),0 6px 20px rgba(255,0,0,.5);transform:scale(1.06)}
.i.heart{background:rgba(22,22,22,.72);border:1.5px solid rgba(255,255,255,.14);box-shadow:0 4px 16px rgba(0,0,0,.45);color:#fff}
.i.heart.liked{background:radial-gradient(120% at 30% 20%,#ff6a9a,#ff0040 65%,#cc0033);border-color:#ff2a6d;box-shadow:0 0 26px rgba(255,42,109,.65),0 6px 18px rgba(255,42,109,.45);transform:scale(1.06);color:#fff}
.i.chat,.i.share,.i.save{background:rgba(22,22,22,.68);border:1.5px solid rgba(255,255,255,.13);box-shadow:0 4px 16px rgba(0,0,0,.4);color:#fff}
.i.save.active{background:radial-gradient(120% at 30% 20%,#ffeb66,#ffaa00 65%,#ff8c00);border-color:#ffcc00;color:#000;box-shadow:0 0 22px rgba(255,204,0,.55)}
/* EFEITO DANÇA ESTICAR E VOLTA - VIDA PROFISSIONAL */
@keyframes dança{
0%{transform:scale(1) rotate(0)}
12%{transform:scale(1.45,.55) rotate(-6deg)}
28%{transform:scale(.62,1.45) rotate(6deg)}
45%{transform:scale(1.25,.75) rotate(-4deg)}
62%{transform:scale(.88,1.18) rotate(4deg)}
78%{transform:scale(1.08,.92) rotate(-2deg)}
90%{transform:scale(.98,1.02) rotate(1deg)}
100%{transform:scale(1.06) rotate(0)}
}
@keyframes dançaNormal{
0%{transform:scale(1)}12%{transform:scale(1.4,.6)}28%{transform:scale(.7,1.35)}45%{transform:scale(1.2,.8)}62%{transform:scale(.9,1.1)}100%{transform:scale(1)}
}
.i.anim{animation:dança .68s cubic-bezier(.34,1.56,.64,1)}
.i.animNormal{animation:dançaNormal .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,69,0,.7)}70%{box-shadow:0 0 0 14px rgba(255,69,0,0)}100%{box-shadow:0 0 0 0 rgba(255,69,0,0)}}
.burst{position:absolute;top:10%;left:50%;transform:translateX(-50%);font-size:28px;pointer-events:none;animation:burst .75s forwards;z-index:20}
@keyframes burst{0%{transform:translate(-50%,0) scale(0);opacity:1}100%{transform:translate(-50%,-90px) scale(2.2);opacity:0}}
.c{color:#fff;font-size:10px;font-weight:700;margin-top:6px;text-align:center;line-height:1.15;text-shadow:0 1px 10px rgba(0,0,0,.95);letter-spacing:.2px}
.c b{font-size:11px;font-weight:900;display:block}
.info{position:absolute;left:82px;right:82px;bottom:86px;background:linear-gradient(180deg,rgba(22,12,0,.92),rgba(0,0,0,.92));border:1px solid rgba(255,69,0,.28);border-radius:14px;padding:10px 12px;z-index:12;backdrop-filter:blur(22px)}
.meta{color:rgba(255,255,255,.55)!important;font-size:10px!important;display:flex;gap:8px;margin-top:6px!important;flex-wrap:wrap}
.nav{height:70px;background:linear-gradient(180deg,#100a00,#080300);border-top:1px solid rgba(255,69,0,.22);display:flex;align-items:center;z-index:20}
.nav button{flex:1;background:none;border:none;color:rgba(255,255,255,.38);font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.nav button.on{color:#ff8c00;text-shadow:0 0 14px rgba(255,140,0,.6)}
.plus{width:58px;height:58px;border-radius:50%;background:radial-gradient(120% at 30% 20%,#ff8c00,#ff4500 55%,#cc2200);border:2.5px solid #fff;color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;margin-top:-28px;box-shadow:0 6px 22px rgba(255,69,0,.55),0 0 0 4px rgba(0,0,0,.85);transition:.25s}
.plus.anim{animation:dança .6s}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(10px);z-index:99;display:none;align-items:flex-end}
.sheet.show{display:flex}
.sheetBox{background:linear-gradient(180deg,#1e1400,#140a00);border-top:1px solid rgba(255,69,0,.3);width:100%;border-radius:20px 20px 0 0;max-height:80dvh;display:flex;flex-direction:column}
.page{position:absolute;inset:0;background:#000;z-index:30;display:none;flex-direction:column;overflow:auto}
.page.show{display:flex}
.input{width:100%;padding:12px;background:rgba(30,15,0,.85);border:1px solid rgba(255,69,0,.3);border-radius:10px;color:#fff;margin-top:8px;outline:none}
.input:focus{border-color:#ff8c00;box-shadow:0 0 0 3px rgba(255,140,0,.15)}
.btn{width:100%;padding:14px;background:linear-gradient(90deg,#ff4500,#ff8c00);border:none;border-radius:10px;color:#000;font-weight:900;margin-top:10px;letter-spacing:.3px;box-shadow:0 4px 18px rgba(255,69,0,.35)}
.card{background:linear-gradient(180deg,rgba(30,15,0,.92),rgba(20,8,0,.92));border:1px solid rgba(255,69,0,.22);border-radius:12px;padding:12px;margin:10px}
.dot{width:7px;height:7px;background:#ff0000;border-radius:50%;position:absolute;top:1px;right:1px;box-shadow:0 0 10px #ff0000;animation:blink 1.5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>
<div id="app">
<div id="feed"></div>

<div id="sheetC" class="sheet" onclick="if(event.target==this)this.classList.remove('show')"><div class="sheetBox"><div style="padding:14px;display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,69,0,.15)"><b style="color:#ff8c00"><i class="fa-solid fa-comment-dots"></i> <span id="ct">0</span> comentários</b><button onclick="document.getElementById('sheetC').classList.remove('show')" style="background:none;border:none;color:#fff;font-size:18px"><i class="fa-solid fa-xmark"></i></button></div><div id="listC" style="flex:1;overflow:auto;padding:12px"></div><div style="padding:12px;display:flex;gap:8px;border-top:1px solid rgba(255,69,0,.15)"><input id="txtC" class="input" style="flex:1;margin:0" placeholder="Comente algo..."><button onclick="sendC()" style="background:linear-gradient(90deg,#ff4500,#ff8c00);border:none;padding:0 18px;border-radius:10px;font-weight:900;color:#000"><i class="fa-solid fa-paper-plane"></i></button></div></div></div>
<div id="sheetS" class="sheet" onclick="if(event.target==this)this.classList.remove('show')"><div class="sheetBox"><div style="padding:14px;display:flex;justify-content:space-between"><b style="color:#ff8c00"><i class="fa-solid fa-rocket"></i> Compartilhar • 1 por usuário</b><button onclick="document.getElementById('sheetS').classList.remove('show')" style="background:none;border:none;color:#fff;font-size:18px"><i class="fa-solid fa-xmark"></i></button></div><div style="padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px"><button onclick="shareW()" class="card" style="margin:0;text-align:center"><i class="fa-brands fa-whatsapp" style="font-size:24px;color:#25D366"></i><br><span style="font-size:11px">WhatsApp</span></button><button onclick="shareCopy()" class="card" style="margin:0;text-align:center"><i class="fa-solid fa-link" style="font-size:20px"></i><br><span style="font-size:11px">Copiar Link</span></button></div></div></div>

<div id="pBusca" class="page"><div style="display:flex;justify-content:space-between;padding:14px"><h3 style="color:#ff4500">🔍 Busca</h3><button onclick="closeAll()" style="background:none;border:none;color:#fff;font-size:20px"><i class="fa-solid fa-xmark"></i></button></div><div class="card"><input id="qBusca" class="input" placeholder="Buscar vídeos..." oninput="busca()"><div id="rBusca" style="margin-top:10px"></div></div></div>
<div id="pCriar" class="page"><div style="display:flex;justify-content:space-between;padding:14px"><h3 style="color:#ff4500">🔥 Criar 1:30 GRÁTIS</h3><button onclick="closeAll()" style="background:none;border:none;color:#fff;font-size:20px"><i class="fa-solid fa-xmark"></i></button></div><div class="card"><input id="file" type="file" accept="image/*,video/*" style="color:#fff;width:100%"><img id="prev" style="width:100%;margin-top:10px;border-radius:12px;display:none"><input id="desc" class="input" placeholder="Legenda..."><button class="btn" onclick="animBtn(this);postar()"><i class="fa-solid fa-fire"></i> POSTAR AGORA</button><div style="text-align:center;color:#00ff88;font-size:10px;margin-top:6px">✅ Vídeo 1:30 • Foto • Grátis • Frente/Traseira</div></div></div>
<div id="pLive" class="page"><div style="display:flex;justify-content:space-between;padding:14px"><h3 style="color:#ff4500"><i class="fa-solid fa-tower-broadcast"></i> Live Pix</h3><button onclick="closeAll()" style="background:none;border:none;color:#fff;font-size:20px"><i class="fa-solid fa-xmark"></i></button></div><div id="liveBloq" class="card" style="border-color:#ffcc00;text-align:center"><div style="font-size:38px">🔒</div><b style="color:#ffcc00">Live bloqueada</b><div style="font-size:11px;color:#aaa">Pague R$5 hoje para liberar 30min</div><div id="pixKey" style="background:#000;padding:10px;border-radius:10px;color:#fff;margin-top:10px;font-family:monospace;font-size:12px">Configure no Admin</div><button class="btn" style="background:linear-gradient(90deg,#ffcc00,#ff8c00)" onclick="animBtn(this);pagarPix()">💳 JÁ PAGUEI R$5 - LIBERAR HOJE</button></div><div id="liveOk" class="card" style="display:none;border-color:#00ff88;text-align:center"><div style="font-size:32px">✅</div><b style="color:#00ff88">Live liberada hoje!</b><button class="btn" style="background:#00ff88;color:#000" onclick="animBtn(this);alert('Ao vivo 30min liberado!')"><i class="fa-solid fa-video"></i> ENTRAR AO VIVO 30MIN</button></div></div>
<div id="pEu" class="page"><div style="display:flex;justify-content:space-between;padding:14px"><b style="color:#ff4500"><i class="fa-solid fa-fire"></i> Eu</b><div><button onclick="animBtn(this);admin()" style="background:linear-gradient(90deg,#ffcc00,#ff8c00);border:none;padding:7px 12px;border-radius:20px;font-size:10px;font-weight:900"><i class="fa-solid fa-crown"></i> ADMIN</button> <button onclick="closeAll()" style="background:none;border:none;color:#fff;font-size:20px;margin-left:8px"><i class="fa-solid fa-xmark"></i></button></div></div><div style="text-align:center;padding:12px"><div style="width:88px;height:88px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ff6a00,#8b0000);margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:34px;border:3px solid #ff8c00;box-shadow:0 0 24px rgba(255,69,0,.4)">🔥</div><div id="meuUser" style="color:#ff8c00;font-size:13px;margin-top:8px">@fire.user</div><div id="infoLive" style="color:#666;font-size:11px;margin-top:4px"></div><div style="color:#444;font-size:9px;margin-top:6px">ID: <span id="uidShow"></span> • 1 curtida por usuário • profissional</div></div><div id="adminBox" style="display:none" class="card"><h4 style="color:#ffcc00"><i class="fa-solid fa-gear"></i> Admin</h4><input id="pixChave" class="input" placeholder="Sua chave Pix"><button class="btn" style="background:#00ff88;color:#000" onclick="animBtn(this);salvarPix()">SALVAR PIX</button><input id="adTxt" class="input" placeholder="Texto propaganda (Adsense)"><div style="display:flex;gap:8px;margin-top:8px;align-items:center"><input id="adFreq" type="number" value="3" class="input" style="margin:0;width:70px"><label style="color:#fff;font-size:11px;display:flex;align-items:center;gap:6px"><input type="checkbox" id="adOn"> Ads a cada X vídeos</label></div><button class="btn" style="background:linear-gradient(90deg,#ffcc00,#ff8c00)" onclick="animBtn(this);salvarAd()">SALVAR ANÚNCIO</button><div style="display:flex;gap:6px;margin-top:10px"><button onclick="resetLikes()" style="flex:1;background:#331100;color:#ff8c00;border:1px solid #ff4500;padding:8px;border-radius:8px;font-size:10px">Reset Likes</button><button onclick="resetLive()" style="flex:1;background:#331100;color:#ff8c00;border:1px solid #ff4500;padding:8px;border-radius:8px;font-size:10px">Reset Live</button></div></div><div class="card"><b style="color:#ff8c00"><i class="fa-solid fa-bookmark"></i> Salvos</b><div id="listaSalvos" style="margin-top:8px"></div></div></div>

<div class="nav"><button id="b0" class="on" onclick="animBtn(this);go(0)"><i class="fa-solid fa-house" style="font-size:18px"></i><span>Inicio</span></button><button id="b1" onclick="animBtn(this);go(1)"><i class="fa-solid fa-magnifying-glass" style="font-size:18px"></i><span>Busca</span></button><button onclick="go(2)"><div class="plus"><i class="fa-solid fa-plus"></i></div></button><button id="b3" onclick="animBtn(this);go(3)"><i class="fa-solid fa-tower-broadcast" style="font-size:18px"></i><span>Live</span></button><button id="b4" onclick="animBtn(this);go(4)"><i class="fa-solid fa-fire" style="font-size:18px"></i><span>Eu</span></button></div>
</div>

<script>
let uid=localStorage.getItem("uid_final")||"u_"+Math.random().toString(36).slice(2,8)+"_"+Date.now().toString().slice(-4); localStorage.setItem("uid_final",uid);
let posts=JSON.parse(localStorage.getItem("posts_final_pro")||"null")||[{owner:"fire.influencer",img:"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=700",desc:"FINAL: Layout original + 1 por usuário + Botões dançam + Profissional!",fire:7793,firedBy:[],likedBy:[],com:[{u:"ana",t:"Perfeito! Tudo funcionando 🔥😍"}],saveBy:[],share:8,sharedBy:[],isTop:true}];
let cur=0,temp="",cfg=JSON.parse(localStorage.getItem("cfg_final")||"null")||{pixK:"Configure no Admin",adT:"",adF:3,adOn:false};

function save(){localStorage.setItem("posts_final_pro",JSON.stringify(posts)); render();}
function saveCfg(){localStorage.setItem("cfg_final",JSON.stringify(cfg)); render();}

function animBtn(el){
let t=el.querySelector('.i')||el.querySelector('.plus')||el;
if(!t || t.classList.contains('btn')){el.classList.add('animNormal'); setTimeout(()=>el.classList.remove('animNormal'),600); return;}
t.classList.remove('anim','animNormal'); void t.offsetWidth;
t.classList.add(t.classList.contains('fire')||t.classList.contains('heart')||t.classList.contains('save')?'anim':'animNormal');
setTimeout(()=>t.classList.remove('anim','animNormal'),700);
}

function burstEffect(btn,emoji){
let b=document.createElement('div'); b.className='burst'; b.innerText=emoji; btn.appendChild(b); setTimeout(()=>b.remove(),750);
}

function render(){
let list=[...posts].sort((a,b)=>(b.isTop?1:0)-(a.isTop?1:0));
let feed=[]; list.forEach((p,i)=>{feed.push(p); if(cfg.adOn && (i+1)%cfg.adF===0) feed.push({ad:true});});
document.getElementById("feed").innerHTML=feed.map(p=>{
if(p.ad) return `<div class="post" style="background:linear-gradient(135deg,#1a1a00,#332200);border:2px solid #ffcc00;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px"><div style="background:#ffcc00;color:#000;padding:4px 10px;border-radius:20px;font-size:9px;font-weight:900">📢 ANÚNCIO</div><b style="color:#ffcc00;font-size:13px">${cfg.adT||"Sua propaganda"}</b></div>`;
let idx=posts.indexOf(p);
let fired=p.firedBy.includes(uid);
let liked=p.likedBy.includes(uid);
let saved=p.saveBy.includes(uid);
return `<div class="post" style="background-image:url('${p.img}')">
<div class="sideL">
<button class="b" onclick="fire(${idx},this)"><div class="i fire ${fired?'active':''}"><i class="fa-solid fa-fire"></i>${!fired?'<span class="dot"></span>':''}</div><div class="c"><b>${(p.firedBy.length||p.fire).toLocaleString('pt-BR')}</b><span>${fired?'🔥 Feito':'Chamas'}</span></div></button>
<button class="b" onclick="like(${idx},this)"><div class="i heart ${liked?'liked':''}"><i class="${liked?'fa-solid':'fa-regular'} fa-heart"></i></div><div class="c"><b>${liked?'Curtido':'Curtir'}</b><span>${p.likedBy.length} likes</span></div></button>
<button class="b" onclick="animBtn(this);openC(${idx})"><div class="i chat"><i class="fa-regular fa-comment-dots"></i></div><div class="c"><b>${p.com.length}</b><span>comen</span></div></button>
</div>
<div class="sideR">
<button class="b" onclick="animBtn(this);openS(${idx})"><div class="i share"><i class="fa-solid fa-rocket"></i></div><div class="c"><b>${p.sharedBy.length||p.share}</b><span>compar</span></div></button>
<button class="b" onclick="savePost(${idx},this)"><div class="i save ${saved?'active':''}"><i class="${saved?'fa-solid':'fa-regular'} fa-bookmark"></i></div><div class="c"><b>${saved?'Salvo':'Salvar'}</b></div></button>
</div>
<div class="info"><b>@${p.owner} ${p.isTop?'<span style="background:#ffcc00;color:#000;padding:2px 6px;border-radius:10px;font-size:9px">🌟 INFLUENCER</span>':''}</b><div>${p.desc}</div><div class="meta"><span><i class="fa-solid fa-fire"></i> ${p.firedBy.length}</span><span><i class="fa-solid fa-heart"></
