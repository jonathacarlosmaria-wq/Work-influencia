<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WORK FIRE - BOTÕES FUNCIONANDO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100dvh;background:#000;overflow:hidden;font-family:system-ui,sans-serif}
#app{width:100%;max-width:420px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;background:#000;position:relative}
#feed{flex:1;overflow-y:scroll;scroll-snap-type:y mandatory}
#feed::-webkit-scrollbar{display:none}
.post{height:100dvh;width:100%;position:relative;scroll-snap-align:start;background:#111 center/cover no-repeat;flex-shrink:0}
.post video{width:100%;height:100%;object-fit:cover}
.sideL{position:absolute;left:8px;bottom:110px;display:flex;flex-direction:column;gap:14px;z-index:10;width:64px}
.sideR{position:absolute;right:8px;bottom:110px;display:flex;flex-direction:column;gap:14px;z-index:10;width:64px}
.b{border:none;background:none;display:flex;flex-direction:column;align-items:center;width:100%}
.i{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle,#ff6a00,#8b0000);border:2px solid #ff8c00;display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff}
.i.on{animation:estica .6s;box-shadow:0 0 18px #ff0000}
@keyframes estica{0%{transform:scale(1)}15%{transform:scale(1.4,.6)}30%{transform:scale(.7,1.4)}50%{transform:scale(1.2,.8)}70%{transform:scale(.9,1.1)}100%{transform:scale(1)}}
.c{color:#fff;font-size:10px;font-weight:800;margin-top:4px;text-align:center;text-shadow:0 1px 4px #000}
.info{position:absolute;left:80px;right:80px;bottom:85px;background:rgba(0,0,0,.85);border:1px solid #ff3300;border-radius:12px;padding:8px 10px;color:#fff;font-size:12px;z-index:5}
.nav{height:68px;background:#080300;border-top:2px solid #ff4500;display:flex;align-items:center;z-index:20}
.nav button{flex:1;background:none;border:none;color:#6b3a10;font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center}
.nav button.on{color:#ff8c00}
.plus{width:60px;height:60px;border-radius:50%;background:radial-gradient(circle,#ff6a00,#ff0000);border:3px solid #fff;color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;margin-top:-24px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:99;display:none;align-items:flex-end}
.sheet.show{display:flex}
.sheetBox{background:#140800;border-top:2px solid #ff4500;width:100%;border-radius:16px 16px 0 0;max-height:75dvh;display:flex;flex-direction:column}
.page{position:absolute;inset:0;background:#000;z-index:30;display:none;flex-direction:column;overflow:auto}
.page.show{display:flex}
.input{width:100%;padding:11px;background:#1a0a00;border:1px solid #ff4500;border-radius:9px;color:#fff;margin-top:8px}
.btn{width:100%;padding:13px;background:linear-gradient(90deg,#ff4500,#ff8c00);border:none;border-radius:9px;color:#000;font-weight:900;margin-top:10px}
.card{background:#140800;border:1px solid #ff4500;border-radius:11px;padding:12px;margin:10px}
</style>
</head>
<body>
<div id="app">
<div id="feed"></div>

<div id="sheetC" class="sheet" onclick="if(event.target==this)this.classList.remove('show')"><div class="sheetBox"><div style="padding:12px;display:flex;justify-content:space-between;border-bottom:1px solid #331100"><b style="color:#ff8c00">💬 <span id="ct">0</span></b><button onclick="document.getElementById('sheetC').classList.remove('show')" style="background:none;border:none;color:#fff;font-size:20px">✕</button></div><div id="listC" style="flex:1;overflow:auto;padding:10px"></div><div style="padding:10px;display:flex;gap:8px"><input id="txtC" class="input" style="flex:1;margin:0" placeholder="Comentar..."><button onclick="sendC()" style="background:#ff4500;border:none;padding:0 14px;border-radius:9px;font-weight:900">OK</button></div></div></div>
<div id="sheetS" class="sheet" onclick="if(event.target==this)this.classList.remove('show')"><div class="sheetBox"><div style="padding:12px;display:flex;justify-content:space-between"><b style="color:#ff8c00">🚀 Compartilhar</b><button onclick="document.getElementById('sheetS').classList.remove('show')" style="background:none;border:none;color:#fff;font-size:20px">✕</button></div><div style="padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px"><button onclick="shareW()" class="card" style="margin:0">💬 WhatsApp</button><button onclick="shareCopy()" class="card" style="margin:0">📋 Copiar Link</button></div></div></div>

<div id="pBusca" class="page"><div style="display:flex;justify-content:space-between;padding:12px"><h3 style="color:#ff4500">🔍 Busca</h3><button onclick="closeAll()" style="background:none;border:none;color:#fff;font-size:20px">✕</button></div><div class="card"><input id="qBusca" class="input" placeholder="Buscar..." oninput="busca()"><div id="rBusca" style="margin-top:8px"></div></div></div>
<div id="pCriar" class="page"><div style="display:flex;justify-content:space-between;padding:12px"><h3 style="color:#ff4500">🔥 Criar 1:30 GRÁTIS</h3><button onclick="closeAll()" style="background:none;border:none;color:#fff;font-size:20px">✕</button></div><div class="card"><input id="file" type="file" accept="image/*,video/*" style="color:#fff;width:100%"><img id="prev" style="width:100%;margin-top:8px;border-radius:10px;display:none"><input id="desc" class="input" placeholder="Descrição..."><button class="btn" onclick="postar()">POSTAR</button><div style="color:#00ff88;font-size:10px;text-align:center;margin-top:6px">✅ Vídeos 1:30 • Frente/Traseira • Grátis</div></div></div>
<div id="pLive" class="page"><div style="display:flex;justify-content:space-between;padding:12px"><h3 style="color:#ff4500">🔴 Live Pix - R$5/dia</h3><button onclick="closeAll()" style="background:none;border:none;color:#fff;font-size:20px">✕</button></div><div id="liveBloq" class="card" style="border-color:#ffcc00;text-align:center"><div style="font-size:36px">🔒</div><b style="color:#ffcc00">Live só quando pagar Pix hoje</b><div id="pixKey" style="background:#000;padding:8px;border-radius:8px;color:#fff;margin-top:8px;font-size:12px">Configure no Admin</div><button class="btn" style="background:#ffcc00" onclick="pagarPix()">JÁ PAGUEI R$5 - LIBERAR</button></div><div id="liveOk" class="card" style="display:none;border-color:#00ff88;text-align:center"><b style="color:#00ff88">✅ LIVE LIBERADA HOJE</b><div style="color:#fff;font-size:11px">Pode fazer live 30min hoje</div><button class="btn" style="background:#00ff88" onclick="alert('Live 30min liberada! (câmera aqui)')">ENTRAR AO VIVO 30MIN</button></div></div>
<div id="pEu" class="page"><div style="display:flex;justify-content:space-between;padding:12px"><b style="color:#ff4500">🔥 Eu</b><div><button onclick="admin()" style="background:#ffcc00;border:none;padding:6px 10px;border-radius:8px;font-size:10px;font-weight:900">ADMIN</button> <button onclick="closeAll()" style="background:none;border:none;color:#fff;font-size:20px">✕</button></div></div><div style="text-align:center;padding:10px"><div style="width:80px;height:80px;border-radius:50%;background:#ff4500;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:30px">🔥</div><div id="meuNome" style="color:#fff;margin-top:6px">FIRE USER</div><div id="meuUser" style="color:#ff8c00;font-size:12px">@fire.user</div><div id="infoLive" style="color:#888;font-size:10px"></div></div><div id="adminBox" style="display:none" class="card" style="border-color:#ffcc00"><h4 style="color:#ffcc00">ADMIN</h4><input id="pixChave" class="input" placeholder="Chave Pix"><input id="pixNome" class="input" placeholder="Nome Pix"><button class="btn" style="background:#00ff88" onclick="salvarPix()">SALVAR PIX</button><textarea id="adTxt" class="input" placeholder="Texto propaganda (quando tiver Adsense)"></textarea><div style="display:flex;gap:6px;margin-top:8px"><input id="adFreq" type="number" value="3" class="input" style="margin:0;width:60px"><label style="color:#fff;font-size:10px;display:flex;align-items:center"><input type="checkbox" id="adOn"> Ativar Ads a cada X vídeos</label></div><button class="btn" style="background:#ffcc00" onclick="salvarAd()">SALVAR ADS</button><div style="display:flex;gap:6px;margin-top:8px"><button onclick="resetTudo()" style="flex:1;background:#331100;color:#ff8c00;border:1px solid #ff4500;padding:8px;border-radius:8px;font-size:10px">Reset Likes</button><button onclick="resetLive()" style="flex:1;background:#331100;color:#ff8c00;border:1px solid #ff4500;padding:8px;border-radius:8px;font-size:10px">Reset Live</button></div></div><div class="card"><b style="color:#ff8c00">🔖 Salvos</b><div id="listaSalvos"></div></div></div>

<div class="nav"><button id="b0" class="on" onclick="go(0)"><span style="font-size:18px">🏠</span>Inicio</button><button id="b1" onclick="go(1)"><span style="font-size:18px">🔍</span>Busca</button><button onclick="go(2)"><div class="plus">+</div></button><button id="b3" onclick="go(3)"><span style="font-size:18px">🔴</span>Live</button><button id="b4" onclick="go(4)"><span style="font-size:18px">🔥</span>Eu</button></div>
</div>

<script>
let uid=localStorage.getItem("uid")||"u"+Math.random().toString(36).slice(2,9); localStorage.setItem("uid",uid);
let posts=JSON.parse(localStorage.getItem("posts_final")||"null")||[{owner:"fire.influencer",img:"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=700",desc:"LAYOUT ORIGINAL - BOTÕES FUNCIONANDO CERTINHO!",fire:7793,firedBy:[],like:0,likedBy:[],com:[{u:"ana",t:"Testando 🔥"}],saveBy:[],share:8,sharedBy:[],isTop:true}];
let cur=0, temp="", perfil={nome:"FIRE USER",user:"@fire.user"};
let cfg=JSON.parse(localStorage.getItem("cfg")||"null")||{pixK:"Configure no Admin",pixN:"WORK FIRE",adT:"",adF:3,adOn:false};
try{let p=JSON.parse(localStorage.getItem("perfil")); if(p) perfil=p;}catch(e){}

function save(){localStorage.setItem("posts_final",JSON.stringify(posts)); render();}
function saveCfg(){localStorage.setItem("cfg",JSON.stringify(cfg)); render();}

function render(){
let list=[...posts].sort((a,b)=>(b.isTop?1:0)-(a.isTop?1:0));
let feed=[]; list.forEach((p,i)=>{feed.push(p); if(cfg.adOn && (i+1)%cfg.adF===0) feed.push({ad:true});});
document.getElementById("feed").innerHTML=feed.map((p,idx)=>{
if(p.ad) return `<div class="post" style="background:linear-gradient(135deg,#1a1a00,#332200);border:2px solid #ffcc00;display:flex;align-items:center;justify-content:center"><b style="color:#ffcc00">📢 ${cfg.adT||"PROPAGANDA"}</b></div>`;
let realIdx=posts.indexOf(p);
let fired=p.firedBy&&p.firedBy.includes(uid);
let liked=p.likedBy&&p.likedBy.includes(uid);
let saved=p.saveBy&&p.saveBy.includes(uid);
let bg=p.img?`background-image:url('${p.img}')`:"background:#111";
return `<div class="post" style="${bg}">
<div class="sideL">
<button class="b" onclick="fire(${realIdx},this)"><div class="i ${fired?'on':''}" style="${fired?'background:radial-gradient(circle,#ff0000,#8b0000)':''}">🔥</div><div class="c">${p.firedBy?p.firedBy.length:p.fire||0}<br>chamas</div></button>
<button class="b" onclick="like(${realIdx},this)"><div class="i ${liked?'on':''}" style="${liked?'background:radial-gradient(circle,#ff2a6d,#ff0040)':''}">💖</div><div class="c">${liked?'Curtido':'Curtir'}<br>${p.likedBy?p.likedBy.length:0}</div></button>
<button class="b" onclick="openC(${realIdx})"><div class="i">💬</div><div class="c">${p.com.length}<br>comen</div></button>
</div>
<div class="sideR">
<button class="b" onclick="openS(${realIdx})"><div class="i">🚀</div><div class="c">${p.sharedBy?p.sharedBy.length:p.share||0}<br>compar</div></button>
<button class="b" onclick="savePost(${realIdx},this)"><div class="i ${saved?'on':''}" style="${saved?'background:radial-gradient(circle,#ffcc00,#ff8c00)':''}">🔖</div><div class="c">${saved?'Salvo':'Salvar'}</div></button>
</div>
<div class="info"><b style="color:#ff8c00">@${p.owner}</b> ${p.isTop?'🌟':''}<div>${p.desc}</div><div style="font-size:10px;color:#aaa">🔥 ${p.firedBy?p.firedBy.length:0} • 💖 ${p.likedBy?p.likedBy.length:0} • 1 por usuário</div></div>
</div>`;
}).join("");
document.getElementById("listaSalvos").innerHTML=posts.filter(p=>p.saveBy&&p.saveBy.includes(uid)).map(p=>`<div style="display:flex;gap:6px;margin-top:6px"><img src="${p.img}" style="width:44px;height:44px;border-radius:8px;object-fit:cover"><div style="color:#fff;font-size:11px">${p.desc}</div></div>`).join("")||"<div style='color:#666;font-size:11px'>Nenhum</div>";
document.getElementById("pixKey").innerText=cfg.pixK;
document.getElementById("pixChave").value=cfg.pixK!=="Configure no Admin"?cfg.pixK:"";
document.getElementById("pixNome").value=cfg.pixN;
document.getElementById("adTxt").value=cfg.adT;
document.getElementById("adFreq").value=cfg.adF;
document.getElementById("adOn").checked=cfg.adOn;
document.getElementById("meuNome").innerText=perfil.nome;
document.getElementById("meuUser").innerText=perfil.user;
checkLive();
}

function anim(el){let i=el.querySelector('.i'); if(!i) i=el; i.classList.remove('on'); void i.offsetWidth; i.classList.add('on'); setTimeout(()=>i.classList.remove('on'),600);}

// 🔥 BOTÃO CHAMAS - FUNCIONANDO CERTINHO 1 POR USUÁRIO
function fire(i,btn){anim(btn); if(!posts[i].firedBy) posts[i].firedBy=[]; let idx=posts[i].firedBy.indexOf(uid); if(idx>=0){posts[i].firedBy.splice(idx,1);}else{posts[i].firedBy.push(uid);} if(navigator.vibrate) navigator.vibrate(40); save();}

// 💖 BOTÃO CORAÇÃO - FUNCIONANDO CERTINHO 1 POR USUÁRIO
function like(i,btn){anim(btn); if(!posts[i].likedBy) posts[i].likedBy=[]; let idx=posts[i].likedBy.indexOf(uid); if(idx>=0){posts[i].likedBy.splice(idx,1);}else{posts[i].likedBy.push(uid);} if(navigator.vibrate) navigator.vibrate(30); save();}

// 💬 BOTÃO COMENTÁRIO - FUNCIONANDO
function openC(i){cur=i; document.getElementById("ct").innerText=posts[i].com.length; document.getElementById("listC").innerHTML=posts[i].com.map(c=>`<div style="padding:7px 0;border-bottom:1px solid #331100"><b style="color:#ff8c00">@${c.u}</b> <span style="color:#fff;font-size:13px">${c.t}</span></div>`).join(""); document.getElementById("sheetC").classList.add("show");}
function sendC(){let t=document.getElementById("txtC").value.trim(); if(!t) return; posts[cur].com.push({u:perfil.user.replace('@','')||"voce",t:t}); document.getElementById("txtC").value=""; save(); openC(cur);}

// 🚀 BOTÃO COMPARTILHAR - FUNCIONANDO
function openS(i){cur=i; document.getElementById("sheetS").classList.add("show");}
function shareW(){let p=posts[cur]; if(!p.sharedBy) p.sharedBy=[]; let url=location.href; window.open("https://wa.me/?text="+encodeURIComponent(p.desc+" "+url),"_blank"); if(!p.sharedBy.includes(uid)){p.sharedBy.push(uid); save();} document.getElementById("sheetS").classList.remove("show");}
function shareCopy(){navigator.clipboard.writeText(location.href); alert("Link copiado!"); let p=posts[cur]; if(!p.sharedBy) p.sharedBy=[]; if(!p.sharedBy.includes(uid)){p.sharedBy.push(uid); save();} document.getElementById("sheetS").classList.remove("show");}

// 🔖 BOTÃO SALVAR - FUNCIONANDO
function savePost(i,btn){anim(btn); if(!posts[i].saveBy) posts[i].saveBy=[]; let idx=posts[i].saveBy.indexOf(uid); if(idx>=0){posts[i].saveBy.splice(idx,1);}else{posts[i].saveBy.push(uid);} if(navigator.vibrate) navigator.vibrate(30); save();}

// NAVEGAÇÃO
function go(n){document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("on")); let el=document.getElementById("b"+n); if(el) el.classList.add("on"); document.querySelectorAll(".page").forEach(p=>p.classList.remove("show")); if(n==1) document.getElementById("pBusca").classList.add("show"); if(n==2) document.getElementById("pCriar").classList.add("show"); if(n==3) document.getElementById("pLive").classList.add("show"); if(n==4) document.getElementById("pEu").classList.add("show");}
function closeAll(){document.querySelectorAll(".page").forEach(p=>p.classList.remove("show")); document.getElementById("b0").classList.add("on");}
function busca(){let q=document.getElementById("qBusca").value.toLowerCase(); let r=posts.filter(p=>p.desc.toLowerCase().includes(q)); document.getElementById("rBusca").innerHTML=r.map(p=>`<div style="display:flex;gap:6px;margin-top:6px"><img src="${p.img}" style="width:40px;height:40px;border-radius:8px"><div style="color:#fff;font-size:11px">${p.desc}</div></div>`).join("")||"<div style='color:#666'>Nada</div>";}
function admin(){let s=prompt("Senha Admin:"); if(s==="fire123") document.getElementById("adminBox").style.display="block"; else if(s) alert("Senha: fire123");}
function salvarPix(){let k=document.getElementById("pixChave").value.trim(); let n=document.getElementById("pixNome").value.trim()||"WORK FIRE"; if(!k) return alert("Coloque Pix"); cfg.pixK=k; cfg.pixN=n; saveCfg(); alert("Pix salvo!");}
function salvarAd(){cfg.adT=document.getElementById("adTxt").value.trim(); cfg.adF=parseInt(document.getElementById("adFreq").value)||3; cfg.adOn=document.getElementById("adOn").checked; saveCfg(); alert("Ads salvo! A cada "+cfg.adF);}
function resetTudo(){if(confirm("Resetar curtidas?")){posts.forEach(p=>{p.firedBy=[]; p.likedBy=[]; p.saveBy=[]; p.sharedBy=[];}); save();}}
function resetLive(){localStorage.removeItem("livePago"); checkLive(); alert("Live resetada");}
function checkLive(){let pago=localStorage.getItem("livePago")===new Date().toDateString(); document.getElementById("liveBloq").style.display=pago?"none":"block"; document.getElementById("liveOk").style.display=pago?"block":"none"; document.getElementById("infoLive").innerText=pago?"✅ Live liberada hoje":"🔒 Live bloqueada - pague R$5";}
function pagarPix(){if(cfg.pixK==="Configure no Admin"){alert("Configure Pix no Admin"); return;} localStorage.setItem("livePago",new Date().toDateString()); checkLive(); alert("✅ Live liberada hoje! R$5 em "+cfg.pixK);}

// CRIAR POST - FUNCIONANDO
document.getElementById("file").addEventListener("change",e=>{let f=e.target.files[0]; if(!f) return; let r=new FileReader(); r.onload=ev=>{temp=ev.target.result; document.getElementById("prev").src=temp; document.getElementById("prev").style.display="block";}; r.readAsDataURL(f);});
function postar(){let d=document.getElementById("desc").value.trim()||"Meu vídeo 1:30 🔥"; if(!temp){alert("Escolha foto/vídeo!"); return;} let isTop=localStorage.getItem("livePago")===new Date().toDateString(); posts.unshift({owner:perfil.user.replace('@','')||"fire",img:temp,desc:d,fire:0,firedBy:[],like:0,likedBy:[],com:[],saveBy:[],share:0,sharedBy:[],isTop:isTop}); temp=""; document.getElementById("prev").style.display="none"; document.getElementById("desc").value=""; save(); closeAll();}

render();
</script>
</body>
</html>
