<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WORK - CAMERA FUNCIONANDO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;height:100dvh;overflow:hidden;font-family:Arial;color:#fff}
.app{height:100dvh;display:flex;flex-direction:column}
.feed{flex:1;position:relative;background:#111}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
.ov{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.8) 0%,transparent 60%)}
.live-btn{position:absolute;top:20px;left:14px;background:red;color:#fff;padding:8px 16px;border-radius:20px;font-weight:900;z-index:10;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.right{position:absolute;right:12px;bottom:100px;display:flex;flex-direction:column;gap:20px;z-index:10;text-align:center}
.btn{width:54px;height:54px;background:rgba(255,255,255,.2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px}
.bottom{height:60px;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;align-items:center}
.tab{color:#666;font-size:11px;text-align:center;cursor:pointer}.tab.active{color:#fff}
.plus{width:44px;height:30px;background:#fff;color:#000;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px}

/* CAMERA TELA CHEIA */
#camScreen{position:fixed;inset:0;background:#000;z-index:999;display:none;flex-direction:column}
#camScreen.on{display:flex}
#camera{width:100%;height:100%;object-fit:cover;background:#000}
.cam-top{position:absolute;top:0;left:0;right:0;height:60px;display:flex;justify-content:space-between;align-items:center;padding:0 16px;z-index:2;background:linear-gradient(180deg,rgba(0,0,0,.7),transparent)}
.cam-top button{background:rgba(0,0,0,.6);color:#fff;border:1px solid rgba(255,255,255,.3);padding:8px 16px;border-radius:20px;font-weight:700}
.cam-bottom{position:absolute;bottom:0;left:0;right:0;height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:2;background:linear-gradient(0deg,rgba(0,0,0,.9),transparent)}
.types{display:flex;gap:10px}
.type{padding:8px 16px;border-radius:20px;background:rgba(255,255,255,.15);font-size:12px;font-weight:700;color:#aaa}
.type.active{background:#fff;color:#000}
.controls{display:flex;align-items:center;gap:30px}
.ctrl{width:44px;height:44px;background:rgba(255,255,255,.15);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px}
.record{width:76px;height:76px;border-radius:50%;border:4px solid #fff;display:flex;align-items:center;justify-content:center}
.record div{width:60px;height:60px;background:red;border-radius:50%}
.record.rec div{width:28px;height:28px;border-radius:4px}
.timer{font-size:13px;font-weight:900;background:rgba(255,0,0,.8);padding:5px 12px;border-radius:20px;display:none}
.timer.on{display:block}
</style>
</head>
<body>
<div class="app" id="app">
<div class="feed" id="feed"></div>
<div class="bottom">
<div class="tab active" onclick="location.reload()">⌂ Início</div>
<div class="tab">◎ Descobrir</div>
<div class="tab" onclick="openCam('video')"><div class="plus">+</div></div>
<div class="tab" onclick="openCam('live')" style="color:red">● LIVE</div>
<div class="tab">◉ Eu</div>
</div>
</div>

<div id="camScreen">
<video id="camera" autoplay playsinline muted></video>
<div class="cam-top">
<button onclick="closeCam()">✕ Fechar</button>
<div class="timer" id="camTimer">00:00 / 01:30</div>
<button onclick="flipCam()">🔄 Virar</button>
</div>
<div class="cam-bottom">
<div class="types">
<div class="type active" id="tVideo" onclick="setMode('video')">VÍDEO 90s</div>
<div class="type" id="tLive" onclick="setMode('live')">LIVE 30min</div>
</div>
<div class="controls">
<div class="ctrl" onclick="document.getElementById('gal').click()">🖼️</div>
<div class="record" id="recBtn" onclick="pressRec()"><div></div></div>
<div class="ctrl">⚡</div>
</div>
<p id="camInfo" style="font-size:11px;color:#aaa">Toque no vermelho para gravar • Máx 1:30</p>
</div>
</div>

<input type="file" id="gal" accept="video/*" style="display:none">

<script>
let videos=[
{user:"@mariana",desc:"Dica de ouro",img:"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?q=80&w=1000",likes:1234,com:12,share:30},
{user:"@joao",desc:"Como crescer rápido",img:"https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=1000",likes:890,com:5,share:22}
];
let cur=0;
let stream=null, facing='user', mode='video', recorder=null, chunks=[], recSec=0, recInterval=null, isRec=false;

function render(){
let v=videos[cur];
document.getElementById('feed').innerHTML=`
<div class="bg" style="background-image:url('${v.img}')"></div>
<div class="ov"></div>
<div class="live-btn" onclick="openCam('live')">🔴 LIVE</div>
<div class="right">
<div><div class="btn">♡</div><div style="font-size:11px;margin-top:4px">${v.likes}</div></div>
<div><div class="btn">💬</div><div style="font-size:11px;margin-top:4px">${v.com}</div></div>
<div><div class="btn">↗</div><div style="font-size:11px;margin-top:4px">${v.share}</div></div>
<div><div class="btn">＋</div><div style="font-size:11px;margin-top:4px">Seguir</div></div>
</div>
<div style="position:absolute;left:14px;bottom:14px;right:80px;z-index:10"><b>${v.user}</b><p style="font-size:13px;margin-top:4px">${v.desc}</p></div>
`;
}
render();

async function openCam(m){
mode=m;
setMode(m);
document.getElementById('camScreen').classList.add('on');
document.getElementById('camTimer').classList.remove('on');
document.getElementById('camTimer').innerText='00:00 / 01:30';
document.getElementById('camInfo').innerText=m==='live'?'MODO LIVE - 30min por dia':'Toque no vermelho para gravar • Máx 1:30';
try{
console.log('Pedindo câmera...');
if(stream){stream.getTracks().forEach(t=>t.stop())}
// PRIMEIRO TENTA COM AUDIO
try{
stream=await navigator.mediaDevices.getUserMedia({
video:{facingMode:facing, width:{ideal:1280}, height:{ideal:720}},
audio:true
});
}catch(e){
// SE FALHAR AUDIO, TENTA SÓ VIDEO
console.log('Tentando só vídeo',e);
stream=await navigator.mediaDevices.getUserMedia({
video:{facingMode:facing},
audio:false
});
}
let video=document.getElementById('camera');
video.srcObject=stream;
await video.play();
console.log('Câmera abriu!');
}catch(err){
alert('❌ Câmera não abriu: '+err.message+'\n\n1. Use Chrome no celular\n2. Clique em PERMITIR quando pedir câmera\n3. Precisa ser HTTPS - seu link já é HTTPS\n\nErro: '+err.name);
console.error(err);
}
}

function closeCam(){
if(isRec) stopRec();
if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
document.getElementById('camScreen').classList.remove('on');
}

function setMode(m){
mode=m;
document.getElementById('tVideo').classList.toggle('active',m==='video');
document.getElementById('tLive').classList.toggle('active',m==='live');
document.getElementById('camInfo').innerText=m==='live'?'🔴 MODO LIVE - 30min/dia - Aperte vermelho para iniciar':'📹 MODO VÍDEO - Máx 1:30 - Aperte vermelho para gravar';
}

async function flipCam(){
facing=facing==='user'?'environment':'user';
if(stream){stream.getTracks().forEach(t=>t.stop())}
try{
stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:mode==='video'});
document.getElementById('camera').srcObject=stream;
await document.getElementById('camera').play();
}catch(e){alert('Erro ao virar: '+e.message)}
}

function pressRec(){
if(mode==='live'){startLiveCam();return}
if(!isRec) startRec(); else stopRec();
}

function startRec(){
if(!stream){alert('Câmera não iniciou, feche e abra de novo');return}
chunks=[];recorder=new MediaRecorder(stream);
recorder.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data)};
recorder.onstop=()=>{
let blob=new Blob(chunks,{type:'video/webm'});
let url=URL.createObjectURL(blob);
let v=document.createElement('video');v.src=url;
v.onloadedmetadata=()=>{
if(v.duration>90){alert('Muito longo! Máx 1:30');return}
if(confirm(`Vídeo de ${Math.round(v.duration)}s gravado! Postar agora?`)){
videos.unshift({user:"@voce",desc:"Vídeo gravado pela câmera! #work",img:url,likes:0,com:0,share:0,type:"video"});
cur=0;closeCam();render();
}
}
};
recorder.start();isRec=true;recSec=0;
document.getElementById('recBtn').classList.add('rec');
document.getElementById('camTimer').classList.add('on');
recInterval=setInterval(()=>{
recSec++;
let mm=String(Math.floor(recSec/60)).padStart(2,'0'), ss=String(recSec%60).padStart(2,'0');
document.getElementById('camTimer').innerText=`${mm}:${ss} / 01:30`;
if(recSec>=90) stopRec();
},1000);
}

function stopRec(){
if(!isRec)return;
clearInterval(recInterval);isRec=false;
document.getElementById('recBtn').classList.remove('rec');
if(recorder) recorder.stop();
}

function startLiveCam(){
let used=parseInt(localStorage.getItem('liveUsed')||'0');
if(used>=30){alert('Você já usou 30min hoje! Volta amanhã');return}
if(!confirm(`Iniciar LIVE? Você tem ${30-used} min hoje.`))return;
alert('🔴 LIVE iniciada! (câmera ao vivo)\n\nEm um app real, aqui entraria no servidor de Live.\nPor enquanto sua câmera está ao vivo!');
// Simula live
videos.unshift({user:"@voce",desc:"🔴 AO VIVO AGORA!",img:"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?q=80&w=1000",likes:0,com:0,share:0,isLive:true});
cur=0;closeCam();render();
localStorage.setItem('liveUsed',used+1);
}

document.getElementById('gal').addEventListener('change',e=>{
let file=e.target.files[0];if(!file)return;
let url=URL.createObjectURL(file);
let v=document.createElement('video');v.src=url;
v.onloadedmetadata=()=>{
if(v.duration>90){alert('Vídeo muito longo! Máx 1:30, seu tem '+Math.round(v.duration)+'s');return}
if(confirm(`Vídeo da galeria ${Math.round(v.duration)}s - Postar?`)){
videos.unshift({user:"@voce",desc:"Vídeo da galeria",img:url,likes:0,com:0,share:0,type:"video"});
cur=0;closeCam();render();
}
}
});

// Swipe
let sy=0;
document.addEventListener('touchstart',e=>sy=e.touches[0].clientY);
document.addEventListener('touchend',e=>{
if(document.getElementById('camScreen').classList.contains('on'))return;
let d=sy-e.changedTouches[0].clientY;
if(Math.abs(d)>60){if(d>0&&cur<videos.length-1)cur++;if(d<0&&cur>0)cur--;render()}
});
</script>
</body>
</html>
