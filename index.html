<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Work Influencia - FINAL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui}
body{background:#000;color:#fff;overflow:hidden;height:100dvh}
#feed{height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory}
.item{height:100dvh;scroll-snap-align:start;position:relative;background:#111;display:flex;align-items:center;justify-content:center}
video{width:100%;height:100%;object-fit:cover}
.info{position:absolute;bottom:80px;left:12px;right:70px}
.nick{font-weight:900;font-size:16px;text-shadow:0 2px 10px #000}
.desc{font-size:13px;margin-top:4px;opacity:.9}
.actions{position:absolute;right:12px;bottom:100px;display:flex;flex-direction:column;gap:18px}
.act{width:48px;height:48px;background:rgba(255,255,255,.15);backdrop-filter:blur(10px);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px}
#tab{position:fixed;bottom:0;left:0;right:0;height:64px;background:rgba(0,0,0,.9);backdrop-filter:blur(20px);display:flex;justify-content:space-around;align-items:center;border-top:1px solid #222;z-index:99}
#tab button{background:none;border:none;color:#666;font-size:10px;font-weight:800}
#tab button.active{color:#fff}
#postBtn{width:48px;height:32px;background:#fff;border-radius:8px;color:#000;font-weight:900;font-size:20px}
#cam{position:fixed;inset:0;background:#000;z-index:200;display:none;flex-direction:column}
#views{position:fixed;inset:0;background:#000;z-index:50;display:none;overflow-y:auto;padding-bottom:70px}
.top{padding:14px;font-weight:900;font-size:18px;border-bottom:1px solid #222;display:flex;justify-content:space-between}
.adBox{height:100dvh;scroll-snap-align:start;background:linear-gradient(135deg,#FFD700,#ff8c00);display:flex;align-items:center;justify-content:center;color:#000;font-weight:900;text-align:center}
.card{background:rgba(255,255,255,.06);border:1px solid #222;border-radius:16px;padding:12px;text-align:center}
</style>
</head>
<body>

<div id="feed"></div>

<div id="views">
<div id="vProfile">
<div class="top"><span>PERFIL</span><span onclick="VIEWS.close()" style="font-size:24px">✕</span></div>
<div style="padding:16px">
<div id="adminBtnArea" style="display:none;margin-bottom:12px">
<button onclick="ADMIN.open()" style="width:100%;background:linear-gradient(145deg,#00FF88,#00CC6A);color:#000;border:none;padding:16px;border-radius:20px;font-weight:900;box-shadow:0 0 20px rgba(0,255,136,.4)">🔧 PAINEL ADMINISTRADOR<br><span style="font-size:10px">VOCÊ É O DONO - CLICA AQUI</span></button>
</div>
<div style="text-align:center;margin:20px 0">
<img id="pPhoto" style="width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid #fff">
<div id="pNick" style="font-weight:900;margin-top:10px;font-size:18px">@user</div>
<div id="pCount" style="color:#888;font-size:12px;margin-top:4px">0 vídeos • Ilimitado</div>
<input type="file" id="photoInp" accept="image/*" hidden onchange="WORK.changePhoto(event)">
<button onclick="document.getElementById('photoInp').click()" style="margin-top:10px;background:#222;color:#fff;border:1px solid #333;padding:8px 16px;border-radius:20px;font-size:12px">Mudar foto</button>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px">
<div class="card"><div id="cMy" style="font-size:22px;font-weight:900">0</div><div style="font-size:9px;color:#888">MEUS VÍDEOS</div></div>
<div class="card"><div style="font-size:22px;font-weight:900">∞</div><div style="font-size:9px;color:#888">ILIMITADO</div></div>
</div>
<div id="grid" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:16px"></div>
<button onclick="WORK.logout()" style="width:100%;margin-top:20px;background:rgba(255,68,68,.15);border:1px solid #ff4444;color:#ff4444;padding:14px;border-radius:14px;font-weight:800">Sair</button>
</div>
</div>

<div id="vAdmin" style="display:none">
<div class="top"><span>ADMIN - DONO</span><span onclick="VIEWS.close()" style="font-size:24px">✕</span></div>
<div style="padding:16px">
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
<div class="card"><div id="totalUsersAdmin" style="font-size:18px;font-weight:900">0</div><div style="font-size:8px">USUÁRIOS</div></div>
<div class="card"><div id="totalVideosAdmin" style="font-size:18px;font-weight:900">0</div><div style="font-size:8px">VÍDEOS</div></div>
<div class="card" style="border-color:#ff4444"><div id="livesHoje" style="font-size:18px;font-weight:900;color:#ff4444">0</div><div style="font-size:8px">LIVES HOJE</div></div>
</div>
<div id="listaLivesHoje" style="margin:10px 0"></div>
<button onclick="ADMIN.resetLives()" style="width:100%;background:rgba(255,68,68,.15);border:1px solid #ff4444;color:#ff4444;padding:10px;border-radius:12px;font-weight:900;font-size:11px;margin:10px 0">🔄 RESETAR LIVES DE HOJE (LIBERAR TODOS)</button>
<div id="listaUsersAdmin" style="margin-top:10px"></div>
</div>
</div>
</div>

<div id="cam">
<div style="padding:12px;display:flex;justify-content:space-between"><span onclick="WORK.closeCam()" style="font-size:24px">✕</span><span id="camType" style="background:red;padding:4px 10px;border-radius:20px;font-size:10px;font-weight:900">🔴 REC</span></div>
<video id="camEl" autoplay muted playsinline style="flex:1"></video>
<input id="descInp" placeholder="Escreva legenda..." style="margin:12px;padding:14px;border-radius:12px;background:#222;border:1px solid #333;color:#fff">
<button onclick="WORK.post()" style="margin:12px;padding:16px;background:#fff;color:#000;border:none;border-radius:14px;font-weight:900">POSTAR - FICA GRAVADO PRA SEMPRE</button>
</div>

<div id="tab">
<button id="tHome" class="active" onclick="VIEWS.home()">🏠<br>INÍCIO</button>
<button onclick="WORK.openCam('video')" id="postBtn">+</button>
<button onclick="WORK.openCam('live')">🔴<br>LIVE</button>
<button onclick="VIEWS.profile()">👤<br>EU</button>
</div>

<script>
const ADMIN={
isAdmin(){
let c=JSON.parse(localStorage.getItem('work_current_user')||'null');
if(!c) return false;
let email=(c.email||'').toLowerCase();
let nick=(c.nick||'').toLowerCase();
return email.includes('jonatha')||nick.includes('jonatha')||email.includes('admin');
},
open(){
if(!this.isAdmin()) return;
document.getElementById('views').style.display='block';
document.getElementById('vProfile').style.display='none';
document.getElementById('vAdmin').style.display='block';
this.refresh();
},
refresh(){
let users=JSON.parse(localStorage.getItem('work_users')||'[]');
WORK.loadAll().then(vids=>{
document.getElementById('totalUsersAdmin').innerText=users.length;
document.getElementById('totalVideosAdmin').innerText=vids.length;
let today=new Date().toDateString();
let lives=0; let html='';
users.forEach(u=>{
let d=JSON.parse(localStorage.getItem('work_live_'+u.id)||'null');
if(d && d.date===today){lives+=d.count; html+=`<div style="font-size:11px;padding:6px;background:#111;border-radius:8px;margin-top:4px">🔴 @${u.nick} - ${d.count}/1 hoje às ${d.lastTime||''}</div>`}
});
document.getElementById('livesHoje').innerText=lives;
document.getElementById('listaLivesHoje').innerHTML=html||'<div style="font-size:11px;color:#666">Nenhuma live hoje</div>';
document.getElementById('listaUsersAdmin').innerHTML=users.map(u=>`<div style="display:flex;justify-content:space-between;padding:10px;background:#111;border-radius:10px;margin-top:6px"><span>@${u.nick} - ${u.email}</span><span style="font-size:10px;color:#888">${(JSON.parse(localStorage.getItem('work_live_'+u.id)||'{}').count||0)}/1</span></div>`).join('');
});
},
resetLives(){
if(!confirm('Resetar lives de hoje pra todos?')) return;
let users=JSON.parse(localStorage.getItem('work_users')||'[]');
users.forEach(u=>localStorage.removeItem('work_live_'+u.id));
alert('✅ Resetado! Todos podem fazer live de novo');
this.refresh();
}
};

const VIEWS={
home(){document.getElementById('views').style.display='none';document.getElementById('vProfile').style.display='block';document.getElementById('vAdmin').style.display='none'},
profile(){
let c=JSON.parse(localStorage.getItem('work_current_user')||'null');
if(!c){let e=prompt('Email:'); if(!e) return; let n=e.split('@')[0]; let users=JSON.parse(localStorage.getItem('work_users')||'[]'); let u=users.find(x=>x.email===e); if(!u){u={id:Date.now(),email:e,nick:n,photo:'https://i.pravatar.cc/200?u='+e}; users.push(u); localStorage.setItem('work_users',JSON.stringify(users));} localStorage.setItem('work_current_user',JSON.stringify(u)); c=u;}
document.getElementById('views').style.display='block';
document.getElementById('vProfile').style.display='block';
document.getElementById('vAdmin').style.display='none';
document.getElementById('pNick').innerText='@'+c.nick;
document.getElementById('pPhoto').src=c.photo;
document.getElementById('adminBtnArea').style.display=ADMIN.isAdmin()?'block':'none';
WORK.my();
},
close(){document.getElementById('views').style.display='none';}
};

const WORK={
db:null,stream:null,rec:null,chunks:[],
initDB(){return new Promise(r=>{let req=indexedDB.open('WorkDB_FINAL',1); req.onupgradeneeded=e=>{e.target.result.createObjectStore('videos',{keyPath:'id'})}; req.onsuccess=e=>{this.db=e.target.result; r()}})},
loadAll(){return new Promise(r=>{if(!this.db) return r([]); let tx=this.db.transaction('videos','readonly'); let req=tx.objectStore('videos').getAll(); req.onsuccess=()=>r(req.result.reverse())})},
canDoLive(){
let c=JSON.parse(localStorage.getItem('work_current_user')||'null');
if(!c) return false;
if(ADMIN.isAdmin()) return true;
let key='work_live_'+c.id; let today=new Date().toDateString();
let data=JSON.parse(localStorage.getItem(key)||'{"date":"","count":0}');
if(data.date!==today){data={date:today,count:0}; localStorage.setItem(key,JSON.stringify(data))}
if(data.count>=1){this.toast('🔴 Você já fez sua LIVE hoje! 1 por dia. Volta amanhã'); return false}
return true;
},
registerLive(){
let c=JSON.parse(localStorage.getItem('work_current_user')||'null');
let key='work_live_'+c.id; let today=new Date().toDateString();
let data=JSON.parse(localStorage.getItem(key)||'{"date":"","count":0}');
if(data.date!==today) data={date:today,count:0};
data.count++; data.lastTime=new Date().toLocaleTimeString();
localStorage.setItem(key,JSON.stringify(data));
},
openCam(type='video'){
let c=JSON.parse(localStorage.getItem('work_current_user')||'null');
if(!c){VIEWS.profile(); return}
if(type==='live'){if(!this.canDoLive()) return; if(!confirm('🔴 LIVE 1 por dia - Iniciar?')) return; this.registerLive();}
document.getElementById('camType').innerText=type==='live'?'🔴 AO VIVO - 1/1 HOJE':'● GRAVANDO - ILIMITADO';
document.getElementById('cam').style.display='flex';
navigator.mediaDevices.getUserMedia({video:true,audio:true}).then(s=>{
this.stream=s; document.getElementById('camEl').srcObject=s;
this.chunks=[]; this.rec=new MediaRecorder(s); this.rec.ondataavailable=e=>this.chunks.push(e.data); this.rec.start();
});
},
closeCam(){if(this.rec) this.rec.stop(); if(this.stream) this.stream.getTracks().forEach(t=>t.stop()); document.getElementById('cam').style.display='none';},
async post(){
if(!this.rec) return;
this.rec.stop();
let blob=new Blob(this.chunks,{type:'video/webm'});
let reader=new FileReader();
reader.onload=async e=>{
await this.initDB();
let c=JSON.parse(localStorage.getItem('work_current_user'));
let vid={id:Date.now(),user:c.nick,photo:c.photo,data:e.target.result,desc:document.getElementById('descInp').value||'Meu vídeo 🔥',likes:0};
let tx=this.db.transaction('videos','readwrite'); tx.objectStore('videos').add(vid);
tx.oncomplete=()=>{this.closeCam(); document.getElementById('descInp').value=''; this.toast('✅ Vídeo salvo! Fica pra sempre no app • Ilimitado'); this.feed();};
};
reader.readAsDataURL(blob);
},
async feed(){
await this.initDB();
let vids=await this.loadAll();
let feed=document.getElementById('feed');
let html='';
vids.forEach((v,i)=>{
if(i>0 && i%5===0){html+=`<div class="adBox"><div>💰 ANÚNCIO ADSENSE<br><span style="font-size:12px">Seu ca-pub- aqui</span><br><br>Anúncio a cada 5 vídeos</div></div>`}
html+=`<div class="item"><video src="${v.data}" loop playsinline onclick="this.paused?this.play():this.pause()"></video><div class="info"><div class="nick">@${v.user}</div><div class="desc">${v.desc}</div><div style="font-size:10px;color:#00FF88;margin-top:4px">♾️ Gravado no app • Ilimitado</div></div><div class="actions"><div class="act">❤️<br><span style="font-size:10px">${v.likes}</span></div><div class="act">💬</div><div class="act">↗️</div></div></div>`;
});
if(vids.length===0) html=`<div class="item" style="flex-direction:column"><div style="font-size:50px">🎬</div><div style="margin-top:10px;font-weight:900">Nenhum vídeo ainda</div><div style="font-size:12px;color:#888;margin-top:6px">Seus vídeos ficam gravados aqui pra sempre</div><button onclick="WORK.openCam('video')" style="margin-top:16px;background:#fff;color:#000;border:none;padding:12px 24px;border-radius:20px;font-weight:900">Postar primeiro vídeo</button></div>`;
feed.innerHTML=html;
},
async my(){
let vids=await this.loadAll();
let c=JSON.parse(localStorage.getItem('work_current_user')||'null');
if(!c) return;
let mine=vids.filter(v=>v.user===c.nick);
document.getElementById('cMy').innerText=mine.length;
document.getElementById('grid').innerHTML=mine.map(v=>`<video src="${v.data}" style="width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:12px"></video>`).join('')||'<div style="grid-column:1/4;color:#666;font-size:12px;text-align:center;padding:20px">Nenhum vídeo ainda<br>Seus vídeos ficam salvos aqui pra sempre</div>';
},
changePhoto(e){
let file=e.target.files[0]; if(!file) return;
let r=new FileReader(); r.onload=ev=>{
let c=JSON.parse(localStorage.getItem('work_current_user')); c.photo=ev.target.result;
localStorage.setItem('work_current_user',JSON.stringify(c));
let users=JSON.parse(localStorage.getItem('work_users')||'[]'); let idx=users.findIndex(u=>u.id===c.id); if(idx>-1){users[idx].photo=ev.target.result; localStorage.setItem('work_users',JSON.stringify(users));}
document.getElementById('pPhoto').src=ev.target.result; this.toast('✅ Foto atualizada');
}; r.readAsDataURL(file);
},
toast(m){let d=document.createElement('div'); d.innerText=m; d.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 20px;border-radius:20px;font-weight:800;z-index:9999;font-size:12px'; document.body.appendChild(d); setTimeout(()=>d.remove(),3000);},
logout(){localStorage.removeItem('work_current_user'); location.reload();}
};
WORK.initDB().then(()=>WORK.feed());
</script>
</body>
</html>
