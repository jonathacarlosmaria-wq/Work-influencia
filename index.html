<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WORK FIRE - BOTÃO DANÇA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100dvh;background:#000;overflow:hidden;font-family:system-ui,sans-serif}
#app{width:100%;max-width:420px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;background:#000;position:relative}
#feed{flex:1;overflow-y:scroll;scroll-snap-type:y mandatory}
#feed::-webkit-scrollbar{display:none}
.post{height:100dvh;width:100%;position:relative;scroll-snap-align:start;background:#111 center/cover no-repeat;flex-shrink:0}
.sideL{position:absolute;left:8px;bottom:110px;display:flex;flex-direction:column;gap:14px;z-index:10;width:64px}
.sideR{position:absolute;right:8px;bottom:110px;display:flex;flex-direction:column;gap:14px;z-index:10;width:64px}
.b{border:none;background:none;display:flex;flex-direction:column;align-items:center;width:100%}
.i{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle,#ff6a00,#8b0000);border:2px solid #ff8c00;display:flex;align-items:center;justify-content:center;font-size:26px}

/* DANÇA E VOLTA AO NORMAL */
@keyframes danca{
0%{transform:scale(1) rotate(0deg)}
10%{transform:scale(1.5,.5) rotate(-8deg)}
20%{transform:scale(.6,1.6) rotate(8deg)}
30%{transform:scale(1.3,.7) rotate(-6deg)}
40%{transform:scale(.8,1.3) rotate(6deg)}
50%{transform:scale(1.2,.9) rotate(-4deg)}
60%{transform:scale(.95,1.1) rotate(4deg)}
70%{transform:scale(1.05,.95) rotate(-2deg)}
85%{transform:scale(.98,1.02) rotate(2deg)}
100%{transform:scale(1) rotate(0deg)}
}
.i.danca{animation:danca.7s cubic-bezier(.34,1.56,.64,1)}

.c{color:#fff;font-size:10px;font-weight:800;margin-top:4px;text-align:center;text-shadow:0 1px 4px #000}
.info{position:absolute;left:80px;right:80px;bottom:85px;background:rgba(0,0,0,.85);border:1px solid #ff3300;border-radius:12px;padding:8px 10px;color:#fff;font-size:12px;z-index:5}
.nav{height:68px;background:#080300;border-top:2px solid #ff4500;display:flex;align-items:center;z-index:20}
.nav button{flex:1;background:none;border:none;color:#6b3a10;font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center}
.nav button.on{color:#ff8c00}
.plus{width:60px;height:60px;border-radius:50%;background:radial-gradient(circle,#ff6a00,#ff0000);border:3px solid #fff;color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;margin-top:-24px}
.plus.danca{animation:danca.6s}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:99;display:none;align-items:flex-end}
.sheet.show{display:flex}
.sheetBox{background:#140800;border-top:2px solid #ff4500;width:100%;border-radius:16px 16px 0 0;max-height:75dvh;display:flex;flex-direction:column}
.page{position:absolute;inset:0;background:#000;z-index:30;display:none;flex-direction:column;overflow:auto}
.page.show{display:flex}
.input{width:100%;padding:11px;background:#1a0a00;border:1px solid #ff4500;border-radius:9px;color:#fff;margin-top:8px}
.btn{width:100%;padding:13px;background:linear-gradient(90deg,#ff4500,#ff8c00);border:none;border-radius:9px;color:#000;font-weight:900;margin-top:10px}
.btn.danca{animation:danca.5s}
.card{background:#140800;border:1px solid #ff4500;border-radius:11px;padding:12px;margin:10px}
</style>
</head>
<body>
<div id="app">
<div id="feed"></div>

<div id="sheetC" class="sheet" onclick="if(event.target==this)this.classList.remove('show')"><div class="sheetBox"><div style="padding:12px;display:flex;justify-content:space-between;border-bottom:1px solid #331100"><b style="color:#ff8c00">💬 <span id="ct">0</span></b><button onclick="document.getElementById('sheetC').classList.remove('show')" style="background:none;border:none;color:#fff;font-size:20px">✕</button></div><div id="listC" style="flex:1;overflow:auto;padding:10px"></div><div style="padding:10px;display:flex;gap:8px"><input id="txtC" class="input" style="flex:1;margin:0" placeholder="Comentar..."><button onclick="sendC()" style="background:#ff4500;border:none;padding:0 14px;border-radius:9px;font-weight:900">OK</button></div></div></div>
<div id="sheetS" class="sheet" onclick="if(event.target==this)this.classList.remove('show')"><div class="sheetBox"><div style="padding:12px;display:flex;justify-content:space-between"><b style="color:#ff8c00">🚀 Compartilhar</b><button onclick="document.getElementById('sheetS').classList.remove('show')" style="background:none;border:none;color:#fff;font-size:20px">✕</button></div><div style="padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px"><button onclick="shareW()" class="card" style="margin:0">💬 WhatsApp</button><button onclick="shareCopy()" class="card" style="margin:0">📋 Copiar</button></div></div></div>

<div id="pBusca" class="page"><div style="display:flex;justify-content:space-between;padding:12px"><h3 style="color:#ff4500">🔍 Busca</h3><button onclick="closeAll()" style="background:none;border:none;color:#fff;font-size:20px">✕</button></div><div class="card"><input id="qBusca" class="input" placeholder="Buscar..." oninput="busca()"><div id="rBusca" style="margin-top:8px"></div></div></div>
<div id="pCriar" class="page"><div style="display:flex;justify-content:space-between;padding:12px"><h3 style="color:#ff4500">🔥 Criar 1:30 GRÁTIS</h3><button onclick="closeAll()" style="background:none;border:none;color:#fff;font-size:20px">✕</button></div><div class="card"><input id="file" type="file" accept="image/*,video/*" style="color:#fff;width:100%"><img id="prev" style="width:100%;margin-top:8px;border-radius:10px;display:none"><input id="desc" class="input" placeholder="Descrição..."><button class="btn" onclick="danca(this);postar()">POSTAR</button></div></div>
<div id="pLive" class="page"><div style="display:flex;justify-content:space-between;padding:12px"><h3 style="color:#ff4500">🔴 Live Pix</h3><button onclick="closeAll()" style="background:none;border:none;color:#fff;font-size:20px">✕</button></div><div id="liveBloq" class="card" style="border-color:#ffcc00;text-align:center"><div style="font-size:36px">🔒</div><b style="color:#ffcc00">Live só quando pagar R$5 hoje</b><div id="pixKey" style="background:#000;padding:8px;border-radius:8px;color:#fff;margin-top:8px;font-size:12px">Configure no Admin</div><button class="btn" style="background:#ffcc00" onclick="danca(this);pagarPix()">JÁ PAGUEI R$5</button></div><div id="liveOk" class="card" style="display:none;border-color:#00ff88;text-align:center"><b style="color:#00ff88">✅ LIBERADA HOJE</b><button class="btn" style="background:#00ff88" onclick="danca(this);alert('Ao vivo 30min!')">AO VIVO 30MIN</button></div></div>
<div id="pEu" class="page"><div style="display:flex;justify-content:space-between;padding:12px"><b style="color:#ff4500">🔥 Eu</b><div><button onclick="danca(this);admin()" style="background:#ffcc00;border:none;padding:6px 10px;border-radius:8px;font-size:10px;font-weight:900">ADMIN</button> <button onclick="closeAll()" style="background:none;border:none;color:#fff;font-size:20px">✕</button></div></div><div style="text-align:center;padding:10px"><div style="width:80px;height:80px;border-radius:50%;background:#ff4500;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:30px">🔥</div><div id="meuUser" style="color:#ff8c00;font-size:12px">@fire.user</div><div id="infoLive" style="color:#888;font-size:10px"></div></div><div id="adminBox" style="display:none" class="card" style="border-color:#ffcc00"><h4 style="color:#ffcc00">ADMIN</h4><input id="pixChave" class="input" placeholder="Chave Pix"><button class="btn" style="background:#00ff88" onclick="danca(this);salvarPix()">SALVAR PIX</button><input id="adTxt" class="input" placeholder="Texto propaganda"><div style="display:flex;gap:6px;margin-top:8px"><input id="adFreq" type="number" value="3" class="input" style="margin:0;width:60px"><label style="color:#fff;font-size:10px;display:flex;align-items:center"><input type="checkbox" id="adOn"> Ativar a cada X</label></div><button class="btn" style="background:#ffcc00" onclick="danca(this);salvarAd()">SALVAR ADS</button></div><div class="card"><b style="color:#ff8c00">🔖 Salvos</b><div id="listaSalvos"></div></div></div>

<div class="nav"><button id="b0" class="on" onclick="danca(this);go(0)"><span style="font-size:18px">🏠</span>Inicio</button><button id="b1" onclick="danca(this);go(1)"><span style="font-size:18px">🔍</span>Busca</button><button onclick="danca(this.querySelector('.plus'));go(2)"><div class="plus">+</div></button><button id="b3" onclick="danca(this);go(3)"><span style="font-size:18px">🔴</span>Live</button><button id="b4" onclick="danca(this);go(4)"><span style="font-size:18px">🔥</span>Eu</button></div>
</div>

<script>
let uid=localStorage.getItem("uid")||"u"+Math.random().toString(36).slice(2,9); localStorage.setItem("uid",uid);
let posts=JSON.parse(localStorage.getItem("posts_danca")||"null")||[{owner:"fire.influencer",img:"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=700",desc:"BOTÃO DANÇA E VOLTA!",fire:7793,firedBy:[],likedBy:[],com:[{u:"ana",t:"Dança! 🔥"}],saveBy:[],share:8,sharedBy:[],isTop:true}];
let cur=0,temp="",cfg=JSON.parse(localStorage.getItem("cfg")||"null")||{pixK:"Configure no Admin",adT:"",adF:3,adOn:false};

function save(){localStorage.setItem("posts_danca",JSON.stringify(posts)); render();}
function saveCfg(){localStorage.setItem("cfg",JSON.stringify(cfg)); render();}

function danca(el){
let t=el.querySelector('.i')||el.querySelector('.plus')||el;
if(!t) t=el;
t.classList.remove('danca');
void t.offsetWidth;
t.classList.add('danca');
setTimeout(()=>t.classList.remove('danca'),750);
}

function render(){
let list=[...posts].sort((a,b)=>(b.isTop?1:0)-(a.isTop?1:0));
let feed=[]; list.forEach((p,i)=>{feed.push(p); if(cfg.adOn && (i+1)%cfg.adF===0) feed.push({ad:true});});
document.getElementById("feed").innerHTML=feed.map(p=>{
if(p.ad) return `<div class="post" style="background:linear-gradient(135deg,#1a1a00,#332200);border:2px solid #ffcc00;display:flex;align-items:center;justify-content:center"><b style="color:#ffcc00">📢 ${cfg.adT||"PROPAGANDA"}</b></div>`;
let idx=posts.indexOf(p);
return `<div class="post" style="background-image:url('${p.img}')">
<div class="sideL">
<button class="b" onclick="danca(this);fire(${idx},this)"><div class="i">🔥</div><div class="c">${p.firedBy.length||p.fire}<br>chamas</div></button>
<button class="b" onclick="danca(this);like(${idx},this)"><div class="i">💖</div><div class="c">${p.likedBy.includes(uid)?'Curtido':'Curtir'}<br>${p.likedBy.length}</div></button>
<button class="b" onclick="danca(this);openC(${idx})"><div class="i">💬</div><div class="c">${p.com.length}<br>comen</div></button>
</div>
<div class="sideR">
<button class="b" onclick="danca(this);openS(${idx})"><div class="i">🚀</div><div class="c">${p.sharedBy.length||p.share}<br>compar</div></button>
<button class="b" onclick="danca(this);savePost(${idx},this)"><div class="i">🔖</div><div class="c">${p.saveBy.includes(uid)?'Salvo':'Salvar'}</div></button>
</div>
<div class="info"><b style="color:#ff8c00">@${p.owner}</b><div>${p.desc}</div></div>
</div>`;
}).join("");
document.getElementById("listaSalvos").innerHTML=posts.filter(p=>p.saveBy.includes(uid)).map(p=>`<div style="display:flex;gap:6px;margin-top:6px"><img src="${p.img}" style="width:40px;height:40px;border-radius:8px"><div style="color:#fff;font-size:11px">${p.desc}</div></div>`).join("")||"<div style='color:#666;font-size:11px'>Nenhum</div>";
document.getElementById("pixKey").innerText=cfg.pixK;
document.getElementById("pixChave").value=cfg.pixK!=="Configure no Admin"?cfg.pixK:"";
document.getElementById("adTxt").value=cfg.adT;
document.getElementById("adFreq").value=cfg.adF;
document.getElementById("adOn").checked=cfg.adOn;
checkLive();
}

function fire(i,btn){if(!posts[i].firedBy) posts[i].firedBy=[]; let id=posts[i].firedBy.indexOf(uid); if(id>=0) posts[i].firedBy.splice(id,1); else posts[i].firedBy.push(uid); if(navigator.vibrate) navigator.vibrate(40); save();}
function like(i,btn){if(!posts[i].likedBy) posts[i].likedBy=[]; let id=posts[i].likedBy.indexOf(uid); if(id>=0) posts[i].likedBy.splice(id,1); else posts[i].likedBy.push(uid); if(navigator.vibrate) navigator.vibrate(30); save();}
function openC(i){cur=i; document.getElementById("ct").innerText=posts[i].com.length; document.getElementById("listC").innerHTML=posts[i].com.map(c=>`<div style="padding:7px 0;border-bottom:1px solid #331100"><b style="color:#ff8c00">@${c.u}</b> ${c.t}</div>`).join(""); document.getElementById("sheetC").classList.add("show");}
function sendC(){let t=document.getElementById("txtC").value.trim(); if(!t) return; posts[cur].com.push({u:"voce",t:t}); document.getElementById("txtC").value=""; save(); openC(cur);}
function openS(i){cur=i; document.getElementById("sheetS").classList.add("show");}
function shareW(){window.open("https://wa.me/?text="+encodeURIComponent(location.href),"_blank"); let p=posts[cur]; if(!p.sharedBy.includes(uid)){p.sharedBy.push(uid); save();} document.getElementById("sheetS").classList.remove("show");}
function shareCopy(){navigator.clipboard.writeText(location.href); alert("Copiado!"); let p=posts[cur]; if(!p.sharedBy.includes(uid)){p.sharedBy.push(uid); save();} document.getElementById("sheetS").classList.remove("show");}
function savePost(i,btn){if(!posts[i].saveBy) posts[i].saveBy=[]; let id=posts[i].saveBy.indexOf(uid); if(id>=0) posts[i].saveBy.splice(id,1); else posts[i].saveBy.push(uid); save();}
function go(n){document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("on")); let el=document.getElementById("b"+n); if(el) el.classList.add("on"); document.querySelectorAll(".page").forEach(p=>p.classList.remove("show")); if(n==1) document.getElementById("pBusca").classList.add("show"); if(n==2) document.getElementById("pCriar").classList.add("show"); if(n==3) document.getElementById("pLive").classList.add("show"); if(n==4) document.getElementById("pEu").classList.add("show");}
function closeAll(){document.querySelectorAll(".page").forEach(p=>p.classList.remove("show")); document.getElementById("b0").classList.add("on");}
function busca(){let q=document.getElementById("qBusca").value.toLowerCase(); let r=posts.filter(p=>p.desc.toLowerCase().includes(q)); document.getElementById("rBusca").innerHTML=r.map(p=>`<div style="display:flex;gap:6px;margin-top:6px"><img src="${p.img}" style="width:40px;height:40px;border-radius:8px"><div style="color:#fff;font-size:11px">${p.desc}</div></div>`).join("")||"<div style='color:#666'>Nada</div>";}
function admin(){let s=prompt("Senha:"); if(s==="fire123") document.getElementById("adminBox").style.display="block";}
function salvarPix(){let k=document.getElementById("pixChave").value.trim(); if(!k) return alert("Coloque Pix"); cfg.pixK=k; saveCfg(); alert("Salvo!");}
function salvarAd(){cfg.adT=document.getElementById("adTxt").value.trim(); cfg.adF=parseInt(document.getElementById("adFreq").value)||3; cfg.adOn=document.getElementById("adOn").checked; saveCfg(); alert("Ads salvo a cada "+cfg.adF);}
function checkLive(){let pago=localStorage.getItem("livePago")===new Date().toDateString(); document.getElementById("liveBloq").style.display=pago?"none":"block"; document.getElementById("liveOk").style.display=pago?"block":"none"; document.getElementById("infoLive").innerText=pago?"✅ Live liberada":"🔒 Live bloqueada";}
function pagarPix(){localStorage.setItem("livePago",new Date().toDateString()); checkLive(); alert("✅ Live liberada hoje!");}
document.getElementById("file").addEventListener("change",e=>{let f=e.target.files[0]; if(!f) return; let r=new FileReader(); r.onload=ev=>{temp=ev.target.result; document.getElementById("prev").src=temp; document.getElementById("prev").style.display="block";}; r.readAsDataURL(f);});
function postar(){let d=document.getElementById("desc").value.trim()||"Meu vídeo 🔥"; if(!temp) return alert("Escolha foto/vídeo"); posts.unshift({owner:"voce",img:temp,desc:d,firedBy:[],likedBy:[],com:[],saveBy:[],sharedBy:[],share:0,isTop:false}); temp=""; document.getElementById("prev").style.display="none"; save(); closeAll();}

render();
</script>
</body>
</html>
