<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Work Influência</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#000;overscroll-behavior:none}
  body{position:fixed;overflow:hidden;height:100dvh}
  #app{width:100%;height:100dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;background:#000}
 .feed{padding:10px;padding-bottom:100px}
 .video-card{background:#1a1a1a;border-radius:12px;margin-bottom:15px;overflow:hidden}
 .video-card video{width:100%;max-height:65vh;object-fit:contain;background:#000}
 .info{padding:10px;color:#fff;display:flex;justify-content:space-between}
 .btn{position:fixed;bottom:30px;right:20px;background:#ff0050;color:#fff;border:none;width:65px;height:65px;border-radius:50%;font-size:35px;z-index:999}
</style>
</head>
<body>
<div id="app">
  <div id="feed" class="feed"></div>
  <button class="btn" onclick="document.getElementById('file').click()">+</button>
  <input type="file" id="file" accept="video/*" style="display:none">
</div>
<script>
const feed = document.getElementById('feed');
const fileInput = document.getElementById('file');

// CARREGA VIDEOS SALVOS
let videos = JSON.parse(localStorage.getItem('work_videos')||'[]');
videos.forEach(v=>mostrar(v));

fileInput.onchange = e=>{
  const file = e.target.files[0];
  if(!file) return;
  const url = URL.createObjectURL(file);
  const obj = {url:url, id:Date.now()};
  videos.unshift(obj);
  // salva só referencia, não o video inteiro pra não pesar
  try{localStorage.setItem('work_videos',JSON.stringify(videos.slice(0,50)))}catch(e){}
  mostrar(obj);
};

function mostrar(obj){
  const d = document.createElement('div');
  d.className='video-card';
  d.innerHTML=`<video src="${obj.url}" controls playsinline></video><div class="info"><span>Work Influência</span><span>❤️</span></div>`;
  feed.prepend(d);
}
console.log("OK - sem tela preta");
</script>
</body>
</html>
