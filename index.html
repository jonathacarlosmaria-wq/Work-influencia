function getFollowers(n){let all=JSON.parse(localStorage.getItem('work_follows')||'{}');let f=[];for(let k in all)if(all[k].includes(n))f.push(k);return f}
function getFollowing(n){return JSON.parse(localStorage.getItem('work_follows')||'{}')[n]||[]}
function isFollowing(t){let me=getU().nick;if(me===t)return false;return getFollowing(me).includes(t)}
