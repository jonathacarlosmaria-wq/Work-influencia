<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WORK OFICIAL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;display:flex;justify-content:center;font-family:system-ui}
.app{width:100%;max-width:440px;height:100dvh;background:#000;position:relative;display:flex;flex-direction:column;overflow:hidden}
.stage{flex:1;position:relative;overflow:hidden;background:#000}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
.grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,transparent 30%,transparent 62%,rgba(0,0,0,.92) 100%)}
.top{position:absolute;top:0;left:0;right:0;height:46px;display:flex;align-items:center;justify-content:center;gap:20px;z-index:10}
.t-tab{color:rgba(255,255,255,.55);font-size:14.5px;font-weight:600;padding:6px 0;border-bottom:2.5px solid transparent}
.t-tab.on{color:#fff;border-color:#fff;font-weight:800}
.right{position:absolute;right:8px;bottom:88px;z-index:10;display:flex;flex-direction:column;gap:18px;align-items:center;width:62px}
.abtn{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:24px;position:relative;overflow:hidden}
.abtn img{width:100%;height:100%;object-fit:cover}
.abtn.follow{border:2.8px solid #FFD700}
.badge{position:absolute;bottom:-3px;left:50%;transform:translateX(-50%);width:20px;height:20px;border-radius:50%;border:2px solid #000;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900}
.badge.plus{background:#fe2c55;color:#fff}
.bot{position:absolute;left:12px;right:80px;bottom:12px;z-index:10;color:#fff}
.urow{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.upic{width:40px;height:40px;border-radius:50%;border:2px solid #fff;object-fit:cover;background:#222}
.uname{font-weight:800;font-size:14px}
.desc{font-size:13px;line-height:1.32;opacity:.96}
.nav{height:68px;min-height:68px;background:#000;border-top:1px solid #1e1e1e;display:flex;align-items:center;justify-content:space-around;flex-shrink:0}
.ntab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:#555;font-size:9px;font-weight:700;cursor:pointer;height:100%;justify-content:center}
.ntab.on{color:#fff}
.nplus{width:44px;height:28px;background:#fff;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#000;font-weight:900;font-size:20px}
#toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;color:#000;padding:11px 20px;border-radius:22px;font-weight:800;font-size:12px;z-index:9000;display:none}#toast.on{display:block}
#cam{position:fixed;inset:0;background:#000;z-index:9999;display:none;flex-direction:column;max-width:440px;left:50%;transform:translateX(-50%)}
#camEl{flex:1;width:100%;object-fit:cover;background:#111}
#liveM{position:fixed;inset:0;background:#000;z-index:9998;display:none;flex-direction:column;max-width:440px;left:50%;transform:translateX(-50%)}
.dot{width:8px;height:8px;background:#fff;border-radius:50%;animation:b 1s infinite}@keyframes b{50%{opacity:.3}}
</style>
</head>
<body>
<div id="toast"></div>
<div class="app">
<div class="stage" id="stage"></div>
<div class="nav">
<div class="ntab on"><div>🏠</div>Início</div>
<div class="ntab"><div>🔍</div>Descobrir</div>
<div onclick="goCam()" style="flex:1;display:flex;justify-content:center"><div class="nplus">+</div></div>
<div class="ntab"><div>📩</div>Inbox</div>
<div class="ntab"><div>👤</div>Perfil</div>
</div>
</div>

<!-- CÂMERA OFICIAL COM OS 3 BOTÕES - FOTO, VÍDEO, LIVE -->
<div id="cam">
<video id="camEl" autoplay muted playsinline></video>
<canvas id="photoCanvas" style="display:none"></canvas>
<div style="position:absolute;top:0;left:0;right:0;padding:10px;display:flex;justify-content:space-between;z-index:10">
<button onclick="closeAll()" style="width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.5);border:1px solid #fff;color:#fff">✕</button>
<button onclick="postNow()" style="background:#fe2c55;color:#fff;border:none;padding:7px 16px;border-radius:18px;font-weight:900;font-size:11px">Postar</button>
</div>
<!-- BOTÕES IGUAIS AO SEU OFICIAL -->
<div style="position:absolute;bottom:88px;left:0;right:0;display:flex;justify-content:center;gap:7px;z-index:10">
<button id="bF" onclick="setM('foto')" style="padding:7px 14px;border-radius:18px;background:#fff;color:#000;font-weight:800;border:none;font-size:10px">FOTO</button>
<button id="bV" onclick="setM('video')" style="padding:7px 14px;border-radius:18px;background:rgba(255,255,255,.15);color:#fff;font-weight:800;border:1px solid rgba(255,255,255,.2);font-size:10px">VÍDEO 60s</button>
<button id="bL" onclick="openLive()" style="padding:7px 14px;border-radius:18px;background:rgba(255,255,255,.15);color:#fff;font-weight:800;border:1px solid rgba(255,255,255,.2);font-size:10px">LIVE 30MIN</button>
</div>
<div style="position:absolute;bottom:0;left:0;right:0;padding:12px;display:flex;align-items:center;gap:10px;background:linear-gradient(0deg,#000,transparent)">
<input id="descInp" placeholder="Legenda..." style="flex:1;padding:11px 14px;border-radius:22px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:11px">
<button id="shut" onclick="cap()" style="width:66px;height:66px;border-radius:50%;background:#fff;border:4px solid rgba(255,255,255,.25);font-size:22px;flex-shrink:0">📸</button>
<button style="width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);color:#fff">🖼️</button>
</div>
</div>

<!-- LIVE COM TEMPO TIKTOK CORRIGIDA -->
<div id="liveM">
<video id="liveV" style="width:100%;height:100%;object-fit:cover" autoplay muted playsinline></video>
<div style="position:absolute;top:0;left:0;right:0;padding:10px;display:flex;justify-content:space-between;z-index:10;background:linear-gradient(180deg,rgba(0,0,0,.7),transparent)">
<div style="display:flex;gap:6px;align-items:center">
<div style="background:#fe2c55;padding:6px 12px;border-radius:6px;font-weight:900;font-size:10px;display:flex;gap:5px;align-items:center;border:1px solid #fff"><div class="dot"></div>AO VIVO</div>
<div id="liveT" style="background:rgba(0,0,0,.75);padding:6px 12px;border-radius:16px;font-size:13px;font-weight:900;border:1px solid #fff;min-width:60px;text-align:center;color:#fff">00:00</div>
</div>
<button onclick="closeAll()" style="width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.6);border:none;color:#fff;font-size:16px">✕</button>
</div>
<div id="liveI" style="position:absolute;top:56px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);padding:7px 12px;border-radius:16px;font-size:11px;font-weight:800;z-index:10;border:1px solid #FFD700;color:#FFD700;white-space:nowrap">🔴 AO VIVO</div>
<button onclick="closeAll()" style="position:absolute;bottom:24px;left:50%;transform:translateX(-50%);width:70px;height:70px;border-radius:50%;background:#fe2c55;border:4px solid #fff;color:#fff;font-size:22px;z-index:10">■</button>
</div>

<script>
let allVideos=[{id:1,img:"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?q=80&w=1000",desc:"WORK OFICIAL SEM DEFORMAR 👑",owner:"jonathacarlosmaria"}];
let cur=0,stream=null,mode='foto',photoData=null,liveTmr=null,liveS=0;
const LIM=1800;
function toast(t){let e=document.getElementById('toast');e.innerText=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2000)}
function closeAll(){document.getElementById('cam').style.display='none';document.getElementById('liveM').style.display='none';if(stream){try{stream.getTracks().forEach(x=>x.stop())}catch{} stream=null}clearInterval(liveTmr)}
function getUso(){let d=JSON.parse(localStorage.getItem('liveUso')||'{}');if(d.data!==new Date().toDateString())return 0;return d.seg||0}
function saveUso(s){localStorage.setItem('liveUso',JSON.stringify({data:new Date().toDateString(),seg:s}))}
function render(){
let v=allVideos[cur];
document.getElementById('stage').innerHTML=`<div class="bg" style="background-image:url('${v.img}')"></div><div class="grad"></div><div class="top"><div class="t-tab">Seguindo</div><div class="t-tab on">Para você</div></div><div class="right"><div class="abtn follow" style="border:2.8px solid #FFD700"><div style="background:#222;width:100%;height:100%;display:flex;align-items:center;justify-content:center">${v.owner[0]}</div><div class="badge plus">+</div></div><div class="abtn">❤️</div><div class="abtn">💬</div><div class="abtn">↗️</div></div><div class="bot"><div class="urow"><div class="upic" style="background:#222;display:flex;align-items:center;justify-content:center">${v.owner[0]}</div><div class="uname">@${v.owner}</div></div><div class="desc">${v.desc}</div></div>`;
}
function goCam(){document.getElementById('cam').style.display='flex';navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}}).then(s=>{stream=s;document.getElementById('camEl').srcObject=s;setM('foto')})}
function setM(m){mode=m;document.getElementById('bF').style.background=m==='foto'?'#fff':'rgba(255,255,255,.15)';document.getElementById('bF').style.color=m==='foto'?'#000':'#fff';document.getElementById('bV').style.background=m==='video'?'#fff':'rgba(255,255,255,.15)';document.getElementById('bV').style.color=m==='video'?'#000':'#fff';document.getElementById('bL').style.background=m==='live'?'#fe2c55':'rgba(255,255,255,.15)';document.getElementById('bL').style.color=m==='live'?'#fff':'#fff';document.getElementById('shut').innerText=m==='foto'?'📸':'●';if(m==='live')openLive()}
function cap(){if(mode==='foto'){let v=document.getElementById('camEl');let c=document.getElementById('photoCanvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);photoData=c.toDataURL();toast('✅ Foto ok! Clique Postar')}else if(mode==='live')openLive()}
function postNow(){toast('✅ Postado!');closeAll()}

// LIVE TIKTOK - TEMPO APARECE QUANDO ENTRA
function openLive(){
let resta=LIM-getUso();
if(resta<=0){toast('⏰ 30min acabaram hoje!');return}
document.getElementById('liveM').style.display='flex';
navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true}).then(s=>{
stream=s;
document.getElementById('liveV').srcObject=s;
liveS=0;
document.getElementById('liveT').innerText='00:00';
document.getElementById('liveI').innerText=`🔴 AO VIVO - Resta: ${Math.floor(resta/60)}min`;
// JÁ COMEÇA CONTANDO AUTOMÁTICO IGUAL TIKTOK
liveTmr=setInterval(()=>{
liveS++;
saveUso(getUso()+liveS);
let m=String(Math.floor(liveS/60)).padStart(2,'0');
let sec=String(liveS%60).padStart(2,'0');
document.getElementById('liveT').innerText=`${m}:${sec}`;
document.getElementById('liveI').innerText=`🔴 Gravando ${m}:${sec} | Resta: ${Math.floor((LIM-(getUso()))/60)}min`;
},1000);
toast('🔴 LIVE com tempo TikTok!');
}).catch(()=>toast('Permita câmera'));
}
render();
</script>
</body>
</html>
