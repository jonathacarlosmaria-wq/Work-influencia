<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>APP CORRIGIDO V35.2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#000;color:#fff;overflow:hidden}
#app{width:100vw;height:100vh;position:relative}
video{width:100%;height:100%;object-fit:cover;background:#111}
.side{position:absolute;right:10px;bottom:110px;display:flex;flex-direction:column;gap:24px;align-items:center;z-index:5}
.avatar-wrap{width:52px;height:52px;position:relative}
.avatar-wrap img{width:52px;height:52px;border-radius:50%;border:2px solid #fff;object-fit:cover}
.btn-follow{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);width:24px;height:24px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:14px;cursor:pointer;z-index:2}
.btn-follow.plus{background:#fe2c55;color:#fff}
.btn-follow.seguindo{background:#fff;color:#000;width:60px;border-radius:12px;font-size:10px;gap:3px}
.btn-follow.seguindo img{width:16px;height:16px;border-radius:50%}
.icon-box{width:48px;height:48px;background:rgba(255,255,255,.18);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;backdrop-filter:blur(8px)}
.label{font-size:12px;font-weight:600;text-shadow:0 1px 4px #000;margin-top:4px}
/* LIVE CORRIGIDA */
#liveM{display:none;position:fixed;inset:0;background:#000;z-index:9999;flex-direction:column}
.top{position:absolute;top:0;left:0;right:0;padding:14px;display:flex;justify-content:space-between;align-items:center;z-index:10;background:linear-gradient(to bottom,rgba(0,0,0,.9),transparent)}
.badge-live{background:#fe2c55;padding:6px 12px;border-radius:5px;font-weight:900;font-size:12px;display:flex;gap:6px;align-items:center}
.timer-box{display:flex;gap:6px;align-items:center;background:rgba(0,0,0,.7);padding:6px 14px;border-radius:20px;font-weight:bold;font-size:13px;border:1px solid rgba(255,255,255,.25)}
.dot{width:10px;height:10px;background:red;border-radius:50%;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.btn-rec{position:absolute;bottom:170px;left:50%;transform:translateX(-50%);width:74px;height:74px;border-radius:50%;background:#fe2c55;border:4px solid #fff;display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff;z-index:20;cursor:pointer;box-shadow:0 0 20px rgba(254,44,85,.6)}
.btn-rec.gravando{background:#fff;color:#fe2c55;animation:pulse 1s infinite}
@keyframes pulse{0%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.08)}100%{transform:translateX(-50%) scale(1)}}
#recInfo{position:absolute;bottom:255px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);padding:8px 16px;border-radius:20px;font-size:12px;font-weight:bold;display:none;z-index:20;border:1px solid rgba(255,255,255,.2);text-align:center}
#liveChat{position:absolute;bottom:120px;left:12px;right:12px;max-height:180px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;z-index:10}
.msg{padding:8px 12px;background:rgba(0,0,0,.6);border-radius:18px;font-size:13px;backdrop-filter:blur(6px);width:fit-content;max-width:85%;word-break:break-word}
.msg b{color:#fe2c55}
.input-bar{position:absolute;bottom:20px;left:12px;right:12px;display:flex;gap:10px;z-index:20}
.input-bar input{flex:1;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);border-radius:24px;padding:14px 18px;color:#fff;outline:none;font-size:14px}
.input-bar button{background:#fe2c55;border:none;color:#fff;padding:14px 22px;border-radius:24px;font-weight:bold;font-size:14px}
</style>
</head>
<body>
<div id="app"><div id="feed" style="width:100%;height:100%"></div></div>

<div id="liveM">
  <div class="top">
    <div style="display:flex;gap:10px;align-items:center">
      <div class="badge-live"><div class="dot"></div> AO VIVO</div>
      <div class="timer-box"><div class="dot"></div><span id="liveTimer">00:00</span></div>
    </div>
    <button onclick="closeLive()" style="width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.2);border:none;color:#fff;font-size:20px">✕</button>
  </div>
  <div id="viewers" style="position:absolute;top:72px;left:12px;background:rgba(0,0,0,.6);padding:6px 12px;border-radius:14px;font-size:12px;z-index:10">1.342 espectadores</div>
  <video id="liveVideo" style="width:100%;height:100%;object-fit:cover" playsinline></video>
  <div id="recInfo"></div>
  <button id="recBtn" class="btn-rec" onclick="toggleRec()">●</button>
  <div id="liveChat"></div>
  <div class="input-bar">
    <input id="liveInput" placeholder="Comente na live..." onkeypress="if(event.key==='Enter') enviarChat()">
    <button onclick="enviarChat()">Enviar</button>
  </div>
</div>

<script>
let videos=[
  {id:1,url:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",user:"jonatha_ofc",avatar:"https://i.pravatar.cc/150?img=11",likes:"12.5K",follow:false},
  {id:2,url:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4",user:"ana_linda",avatar:"https://i.pravatar.cc/150?img=5",likes:"8.9K",follow:true}
];
let cur=0;
const LIMITE=1800; // 30 min
let liveSec=0, timer=null, gravando=false;

function getUso(){let d=JSON.parse(localStorage.getItem('liveUso')||'{}');if(d.data!==new Date().toDateString())return 0;return d.seg||0;}
function saveUso(s){localStorage.setItem('liveUso',JSON.stringify({data:new Date().toDateString(),seg:s}));}
function resta(){return LIMITE-getUso();}

function renderFeed(){
  let v=videos[cur];
  document.getElementById('feed').innerHTML=`
    <video src="${v.url}" autoplay loop muted playsinline onclick="openLive(${v.id})"></video>
    <div class="side">
      <div style="display:flex;flex-direction:column;align-items:center;cursor:pointer" onclick="toggleFollow(${v.id})">
        <div class="avatar-wrap">
          <img src="${v.avatar}">
          <div class="btn-follow ${v.follow?'seguindo':'plus'}" id="follow${v.id}">${v.follow?`<img src='${v.avatar}'> Seguindo`:'+'}</div>
        </div>
        <div class="label">${v.user}</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center"><div class="icon-box">❤️</div><div class="label">${v.likes}</div></div>
      <div style="display:flex;flex-direction:column;align-items:center;cursor:pointer" onclick="openLive(${v.id})"><div class="icon-box">🔴</div><div class="label">LIVE</div></div>
      <div style="display:flex;flex-direction:column;align-items:center"><div class="icon-box">💬</div><div class="label">342</div></div>
    </div>
    <div style="position:absolute;bottom:22px;left:14px;right:80px;z-index:3;text-shadow:0 1px 4px #000"><b>@${v.user}</b><p style="font-size:13px;margin-top:5px">Toque no vídeo pra LIVE! 30min/dia 🔥</p></div>
  `;
}
function toggleFollow(id){
  let v=videos.find(x=>x.id===id); v.follow=!v.follow;
  let el=document.getElementById('follow'+id);
  if(v.follow){el.className='btn-follow seguindo'; el.innerHTML=`<img src='${v.avatar}'> Seguindo`;}
  else{el.className='btn-follow plus'; el.innerHTML='+';}
}
function openLive(id){
  let r=resta();
  if(r<=0){alert('⏰ Você já usou seus 30 minutos de LIVE hoje!\nVolta amanhã à meia-noite.'); return;}
  alert(`🔴 LIVE liberada!\nVocê tem ${Math.floor(r/60)} minutos hoje.`);
  let modal=document.getElementById('liveM');
  let vid=document.getElementById('liveVideo');
  vid.src=videos.find(x=>x.id===id).url;
  modal.style.display='flex'; vid.play();
  liveSec=0; document.getElementById('liveChat').innerHTML='';
  addChat('Sistema',`Bem-vindo! Tempo restante: ${Math.floor(r/60)} min`);
  timer=setInterval(()=>{
    liveSec++;
    let total=getUso()+liveSec; saveUso(total);
    let falta=LIMITE-total;
    let m=String(Math.floor(liveSec/60)).padStart(2,'0');
    let s=String(liveSec%60).padStart(2,'0');
    document.getElementById('liveTimer').innerText=`${m}:${s}`;
    let info=document.getElementById('recInfo');
    info.style.display='block';
    info.innerText=`⏱️ Gravando ${m}:${s} | Resta hoje: ${Math.floor(falta/60)}:${String(falta%60).padStart(2,'0')} / 30:00`;
    if(falta<=0){clearInterval(timer); alert('⏰ Seus 30 minutos acabaram! Live encerrada.'); closeLive();}
    if(falta===300){addChat('Sistema','⚠️ Só 5 minutos restantes!');}
  },1000);
}
function toggleRec(){
  let b=document.getElementById('recBtn');
  let info=document.getElementById('recInfo');
  if(!gravando){gravando=true; b.classList.add('gravando'); b.innerText='■'; info.style.display='block';}
  else{gravando=false; b.classList.remove('gravando'); b.innerText='●'; alert('✅ Vídeo gravado com '+document.getElementById('liveTimer').innerText+' salvo!');}
}
function addChat(nome,txt){
  let c=document.getElementById('liveChat');
  let d=document.createElement('div'); d.className='msg';
  d.innerHTML=`<b>${nome}:</b> ${txt}`;
  c.appendChild(d); c.scrollTop=c.scrollHeight;
}
function enviarChat(){
  let i=document.getElementById('liveInput');
  if(!i.value.trim()) return;
  addChat('Você',i.value); i.value='';
  setTimeout(()=>addChat(['Ana','Leo','Bia'][Math.floor(Math.random()*3)],'🔥🔥 Top demais!'),800);
}
function closeLive(){
  document.getElementById('liveM').style.display='none';
  clearInterval(timer);
  document.getElementById('liveVideo').pause();
  gravando=false;
  document.getElementById('recBtn').classList.remove('gravando');
  document.getElementById('recBtn').innerText='●';
}
renderFeed();
</script>
</body>
</html>
