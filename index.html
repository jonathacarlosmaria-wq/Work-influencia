<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WORK FIRE - Global</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://download.agora.io/sdk/release/AgoraRTC_N.js"></script>
<style>
/* MESMO CSS DO SEU ORIGINAL - NÃO MUDEI NADA */
* {margin:0;padding:0;box-sizing:border-box;font-family: -apple-system, sans-serif}
body {background:#000;color:#fff;height:100vh;overflow:hidden}
.splash{position:fixed;inset:0;background:linear-gradient(135deg,#ff4500,#ff8c00);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999}
.feed{height:calc(100vh - 60px);overflow-y:scroll;scroll-snap-type:y mandatory}
.video-card{height:calc(100vh - 60px);scroll-snap-align:start;position:relative;background:#111;display:flex;align-items:center;justify-content:center}
.video-card video{width:100%;height:100%;object-fit:cover}
.nav{position:fixed;bottom:0;left:0;right:0;height:60px;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;align-items:center;z-index:100}
.nav button{background:none;border:none;color:#fff;font-size:24px}
.plus{width:45px;height:30px;background:#fff;border-radius:8px;color:#000!important;font-weight:bold}
</style>
</head>
<body>
<div class="splash" id="splash" onclick="this.style.display='none'">
<h1 style="font-size:40px">WORK FIRE 🔥</h1>
<p>GLOBAL - TODO MUNDO VÊ</p>
<small>toque para entrar</small>
</div>
<div class="feed" id="feed">Carregando vídeos globais...</div>
<div class="nav">
<button>🏠</button><button>🔍</button>
<button class="plus" onclick="postar()">+</button>
<button onclick="abrirLive()">🔴 LIVE</button><button>👤</button>
</div>
<input type="file" id="fileInput" accept="video/*" hidden>
<script>
// GLOBAL - SEU SUPABASE (você criou no print qxsjeykqokavxabvrycs)
const SUPABASE_URL = 'https://qxsjeykqokavxabvrycs.supabase.co';
const SUPABASE_KEY = 'SUA_ANON_KEY_AQUI'; // pega em Project Settings > API > anon public
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function render(){
  const { data } = await supabase.from('posts').select('*').order('created_at',{ascending:false});
  document.getElementById('feed').innerHTML = data.map(p=>`
    <div class="video-card">
      <video src="${p.video_url}" loop autoplay muted playsinline controls></video>
      <div style="position:absolute;bottom:20px;left:10px"><b>@${p.username}</b><br>${p.desc}</div>
    </div>`).join('') || '<div style="padding:50% 20px;text-align:center">Seja o primeiro a postar! Clique no +</div>';
}
async function postar(){
  const fileInput = document.getElementById('fileInput'); fileInput.click();
  fileInput.onchange = async e=>{
    const file = e.target.files[0]; if(!file) return;
    alert('Enviando... aguarde');
    const nome = Date.now()+'_'+file.name;
    await supabase.storage.from('videos').upload(nome, file);
    const { data:{publicUrl} } = supabase.storage.from('videos').getPublicUrl(nome);
    const desc = prompt('Descrição:')||'Meu vídeo global 🔥';
    await supabase.from('posts').insert([{video_url: publicUrl, username:'você', desc: desc}]);
    render();
  }
}
function abrirLive(){ alert('LIVE global - mesmo Agora do seu original'); }
render();
</script>
</body>
</html>
