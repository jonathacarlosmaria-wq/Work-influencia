<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ff4500">
<title>work influencer</title>
<link rel="icon" href="fire_small.jpg">
<script>
// --- CORREÇÃO DO ERRO DO PRINT - MANIFEST EM 1 ARQUIVO ---
const pwaManifest = {
  name: "work influencer",
  short_name: "Work",
  description: "Plataforma para contratar influenciadores reais",
  start_url: ".",
  display: "standalone",
  background_color: "#000000",
  theme_color: "#ff4500",
  icons: [{src:"fire_small.jpg",sizes:"512x512",type:"image/jpeg",purpose:"any maskable"}]
};
const blob = new Blob([JSON.stringify(pwaManifest)], {type:"application/json"});
const url = URL.createObjectURL(blob);
const a = document.createElement('link'); a.rel='manifest'; a.href=url;
document.head.appendChild(a);
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial, sans-serif}
#splash{position:fixed;inset:0;background:#000;z-index:99999;display:flex;align-items:center;justify-content:center;flex-direction:column}
#splash img{width:100%;height:100%;object-fit:cover;position:absolute}
#splash h1{position:relative;z-index:2;font-size:32px;letter-spacing:2px;text-shadow:0 0 20px #ff4500}
#conteudo{padding:20px;text-align:center;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center}
.btn{background:#ff4500;color:#fff;padding:15px 30px;border:none;border-radius:30px;font-size:18px;margin-top:20px}
</style>
</head>
<body>

<div id="splash">
  <img src="fire_small.jpg" alt="fogo">
  <h1>WORK INFLUENCER 🔥</h1>
</div>

<div id="conteudo">
  <h1 style="font-size:28px">work influencer</h1>
  <p style="margin-top:10px;opacity:0.8">Conectando marcas a influenciadores reais</p>
  <button class="btn">Entrar no App</button>
  <p style="margin-top:30px;font-size:12px;opacity:0.5">Seu app profissional está pronto!</p>
</div>

<script>
// FOGO 5 SEGUNDOS
setTimeout(()=>{
  document.getElementById('splash').style.display='none';
},5000);
</script>
</body>
</html>
