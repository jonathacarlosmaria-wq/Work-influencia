<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>work influencer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#000;color:#fff;overflow:hidden}
#splash{position:fixed;inset:0;z-index:99999;background:#000 url('fire_small.jpg') center/cover no-repeat;display:flex;align-items:center;justify-content:center;transition:opacity .9s}
#splash::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.9),transparent)}
.s-content{position:relative;z-index:2;text-align:center}
.s-content h1{font-size:46px;font-weight:900;text-shadow:0 0 20px #ff4500,0 0 50px #f00;animation:flicker .15s infinite alternate}
@keyframes flicker{0%{text-shadow:0 0 15px #ff4500}100%{text-shadow:0 0 35px #ff4500,0 0 70px #f00}}
.sub{color:#ff8c00;font-weight:900;letter-spacing:5px;font-size:11px;margin-top:10px}
#loader{width:150px;height:3px;background:rgba(255,255,255,.2);border-radius:10px;margin:20px auto 0;overflow:hidden}
#loader div{height:100%;width:0;background:linear-gradient(90deg,#ff2a00,#ffae00);animation:load 3s linear forwards}
@keyframes load{to{width:100%}}
/* SEU APP */
#app{height:100dvh;display:flex;flex-direction:column}
.feed{flex:1;overflow-y:scroll;scroll-snap-type:y mandatory}
.item{height:100dvh;scroll-snap-align:start;position:relative;background:#111}
.item video{width:100%;height:100%;object-fit:cover}
.wm{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.5);padding:3px 7px;border-radius:4px;font-size:10px;font-weight:800}
</style>
</head>
<body>

<div id="splash">
  <div class="s-content">
    <h1>work influencer</h1>
    <div class="sub">🔥 ENTRANDO</div>
    <div id="loader"><div></div></div>
  </div>
</div>

<div id="app">
  <!-- SEU FEED ATUAL AQUI - mantive igual -->
  <div class="feed" id="feed"></div>
</div>

<script>
// ABERTURA SOME EM 3 SEGUNDOS
setTimeout(()=>{let s=document.getElementById('splash');s.style.opacity='0';setTimeout(()=>s.remove(),900)},3000);

// Só 1 vídeo/áudio tocando por vez
document.addEventListener('play',e=>{
  if(e.target.tagName==='VIDEO'||e.target.tagName==='AUDIO'){
    document.querySelectorAll('video,audio').forEach(a=>{if(a!==e.target) a.pause()})
  }
},true);
</script>
</body>
</html>
