<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WORK - BOTÕES ARRUMADOS COM MOVIMENTO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#000;color:#fff;font-family:Arial;height:100dvh;overflow:hidden}
.app{height:100dvh;display:flex;flex-direction:column}
.stage{flex:1;position:relative;background:#000;overflow:hidden;touch-action:none}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
.grad{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.95) 0%,transparent 55%)}
.top{position:absolute;top:10px;left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:10}
.pill{padding:7px 12px;border-radius:20px;font-size:10px;font-weight:900;background:rgba(0,0,0,.7);border:1px solid #333}.pill.on{background:#FFD700;color:#000}

/* ===== BOTÕES ARRUMADOS COM MOVIMENTO ===== */
.actions{position:absolute;right:8px;bottom:135px;display:flex;flex-direction:column;gap:11px;z-index:30;width:72px;align-items:center}
.abtn{width:58px;height:58px;border-radius:20px;background:rgba(30,30,30,.88);border:2px solid #FFD700;display:flex;align-items:center;justify-content:center;font-size:24px;backdrop-filter:blur(10px);box-shadow:0 4px 15px rgba(0,0,0,.6);transition:all.25s cubic-bezier(.34,1.56,.64,1);animation:slideIn.5s backwards}
.abtn:active{transform:scale(.82) rotate(-6deg)}
.actions > div:nth-child(1).abtn{animation-delay:.08s}
.actions > div:nth-child(2).abtn{animation-delay:.18s}
.actions > div:nth-child(3).abtn{animation-delay:.28s}
.actions > div:nth-child(4).abtn{animation-delay:.38s}
.actions > div:nth-child(5).abtn{animation-delay:.48s}
.actions > div:nth-child(6).abtn{animation-delay:.58s}
@keyframes slideIn{0%{transform:translateX(80px) scale(.5);opacity:0}100%{transform:translateX(0) scale(1);opacity:1}}
.abtn.gold{background:linear-gradient(145deg,#FFE55C,#FFD700,#D4AF37)!important;color:#000!important;border:2px solid #000!important;animation:slideIn.5s backwards.28s, goldGlow 2s infinite.8s!important}
@keyframes goldGlow{0%,100%{box-shadow:0 0 12px rgba(255,215,0,.7),0 4px 15px rgba(0,0,0,.6);transform:scale(1)}50%{box-shadow:0 0 28px rgba(255,215,0,1),0 0 45px rgba(255,215,0,.5);transform:scale(1.07)}}
.abtn.liked{animation:heartBump.45s!important;background:#ff2d55!important;border-color:#fff!important}
@keyframes heartBump{0%{transform:scale(1)}30%{transform:scale(1.45) rotate(-12deg)}60%{transform:scale(.85) rotate(6deg)}100%{transform:scale(1)}}
.cnt{font-size:8px;font-weight:900;margin-top:3px;background:rgba(0,0,0,.8);padding:3px 8px;border-radius:12px;border:1px solid rgba(255,215,0,.4);min-width:42px;text-align:center;animation:fadeIn.6s backwards}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.flyHeart{position:absolute;right:25px;bottom:200px;font-size:34px;pointer-events:none;z-index:100;animation:flyUp 1.1s cubic-bezier(.17,.67,.42,1.3) forwards}
@keyframes flyUp{0%{transform:translateY(0) scale(.5) rotate(0);opacity:1}100%{transform:translateY(-210px) scale(1.9) rotate(18deg);opacity:0}}
@keyframes shake{0%,88%,100%{transform:translateX(0)}90%{transform:translateX(-2px)}92%{transform:translateX(2px)}94%{transform:translateX(-2px)}96%{transform:translateX(2px)}}

.meta{position:absolute;left:10px;bottom:10px;right:88px;z-index:10;background:rgba(0,0,0,.65);padding:10px;border-radius:16px;border:1px solid #333}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:1000;display:none;flex-direction:column}.modal.on{display:flex!important}
#toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#FFD700;color:#000;padding:12px 20px;border-radius:20px;z-index:8000;display:none;font-weight:900;max-width:85%;text-align:center}#toast.on{display:block!important}
.nav{height:115px!important;background:linear-gradient(180deg,#FFE55C,#FFD700,#D4AF37)!important;display:flex;justify-content:space-around;align-items:stretch;border-radius:26px 26px 0 0;margin-top:-16px;z-index:50;border-top:3px solid #FFD700;padding:6px 4px 10px 4px}
.tab{color:#000;font-size:13px;font-weight:900;text-align:center;border-radius:18px;min-width:62px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;margin:0 3px;height:100%;background:rgba(0,0,0,.08);border:1.5px solid rgba(0,0,0,.1)}
.tab.on{background:#000!important;color:#FFD700!important;border:2px solid #000}.tab div:first-child{font-size:30px!important}
.create{width:78px;height:78px;background:#000;border-radius:22px;display:flex;align-items:center;justify-content:center;border:3px solid #000;margin:0 4px;align-self:center}.create span{background:linear-gradient(145deg,#FFE55C,#FFD700,#D4AF37);color:#000;width:100%;height:100%;display:flex;align-items:center;justify-content:center;border-radius:18px;font-size:42px;font-weight:900}
.input{width:100%;background:#111;border:1px solid #333;padding:11px;border-radius:12px;color:#fff;margin-top:7px}
#cam{position:fixed;inset:0;background:#000;z-index:9999;display:none;flex-direction:column}#camEl{flex:1;width:100%;height:100%;object-fit:cover;background:#111}.cam-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:14px;z-index:10;background:linear-gradient(180deg,rgba(0,0,0,.8),transparent)}.cam-modes{position:absolute;bottom:105px;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:10}.cam-modes button{padding:10px 14px;border-radius:20px;font-weight:900;font-size:11px;border:1.5px solid #fff}.cam-bottom{position:absolute;bottom:0;left:0;right:0;padding:14px 10px 22px;display:flex;gap:12px;align-items:center;z-index:10;background:linear-gradient(0deg,rgba(0,0,0,.9),transparent)}.progress{position:absolute;bottom:0;left:0;height:5px;background:#FFD700;z-index:20}
.soundBig{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.55);width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:38px;border:3px solid #FFD700;z-index:20;cursor:pointer}
</style>
</head>
<body>
<div id="toast"></div>
<div class="app"><div class="stage" id="stage"></div>
<div class="nav">
<div class="tab on" onclick="goHome()"><div>🏠</div>Início</div>
<div class="tab" onclick="goMy()"><div>◧</div>Meus</div>
<div onclick="goCam()"><div class="create"><span>+</span></div></div>
<div class="tab" onclick="goCam(true)"><div>🔴</div>LIVE</div>
<div class="tab" onclick="goProfile()"><div>👤</div>Eu</div>
</div></div>

<div id="cam"><video id="camEl" autoplay muted playsinline></video><canvas id="photoCanvas" style="display:none"></canvas><div class="progress" id="camProgress" style="width:0%"></div><div class="cam-top"><button onclick="closeCam()" style="width:42px;height:42px;background:rgba(0,0,0,.7);border:2px solid #fff;border-radius:50%;color:#fff">✕</button><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span id="camModeLabel" style="background:#FFD700;color:#000;padding:5px 12px;border-radius:12px;font-size:11px;font-weight:900">📸 FOTO</span><span id="camTimer" style="background:#ff0000;padding:6px 14px;border-radius:20px;font-size:11px;display:none">● 00:00</span></div><button onclick="postCurrent()" style="background:#00ff00;color:#000;border:none;padding:12px 20px;border-radius:22px;font-weight:900">💾 SALVAR</button></div><div class="cam-modes"><button id="btnFoto" onclick="setCamMode('foto')" style="background:#FFD700;color:#000">📸 FOTO</button><button id="btnVideo" onclick="setCamMode('video')" style="background:rgba(0,0,0,.6);color:#fff">📹 1:30</button><button id="btnLive" onclick="setCamMode('live')" style="background:rgba(0,0,0,.6);color:#fff">🔴 LIVE</button></div><div class="cam-bottom"><div style="flex:1"></div><input id="descInp" placeholder="Legenda..." style="flex:1;max-width:60%;padding:14px 16px;border-radius:24px;background:rgba(0,0,0,.6);border:1.5px solid #FFD700;color:#fff"><button id="shutterBtn" onclick="captureAction()" style="width:72px;height:72px;background:#fff;border-radius:50%;border:4px solid #000;font-size:28px">📸</button><div style="flex:1"></div></div></div>

<div class="modal" id="profileM"><div style="flex:1" onclick="closeAll()"></div><div style="position:absolute;bottom:0;left:0;right:0;background:#1e1e1e;border-radius:28px 28px 0 0;padding:16px;border-top:3px solid #FFD700"><b style="color:#FFD700">👤 PERFIL</b><span onclick="closeAll()" style="float:right;font-size:26px;color:#FFD700">×</span><h3 id="profileName"></h3><p id="profileNick" style="color:#FFD700"></p><button onclick="openGalleryAuto()" style="width:100%;margin-top:10px;padding:16px;border-radius:14px;background:linear-gradient(145deg,#FFE55C,#FFD700);color:#000;font-weight:900;border:2px solid #000">🖼️ IMPORTAR GALERIA</button><input id="inName" class="input"><input id="inNick" class="input"><button onclick="saveProfile()" style="width:100%;padding:12px;border-radius:16px;margin-top:10px;background:#FFD700;color:#000;font-weight:900">💾 SALVAR</button><input type="file" id="galleryInput" accept="video/*,image/*" multiple style="display:none"></div></div>
<div class="modal" id="galleryAutoM"><div style="flex:1" onclick="closeAll()"></div><div style="position:absolute;bottom:0;left:0;right:0;background:#1d1d1d;border-radius:28px 28px 0 0;padding:16px;border-top:3px solid #FFD700;max-height:88vh;overflow:auto"><div style="display:flex;justify-content:space-between"><b style="color:#FFD700">📱 GALERIA</b><span onclick="closeAll()" style="font-size:26px;color:#FFD700">×</span></div><div style="margin-top:12px;display:flex;justify-content:space-between"><span id="galleryCount" style="color:#FFD700;font-weight:900">0</span><button onclick="importAllGallery()" id="importAllBtn" style="padding:10px 18px;border-radius:20px;background:#0a0;color:#fff;font-weight:900;display:none">✅ IMPORTAR</button></div><div id="galleryAutoGrid" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px;max-height:50vh;overflow:auto"></div></div></div>
<div class="modal" id="commentsM"><div style="flex:1" onclick="closeAll()"></div><div style="position:absolute;bottom:0;left:0;right:0;background:#1e1e1e;border-radius:28px 28px 0 0;padding:16px;border-top:3px solid #FFD700;max-height:75vh;overflow:auto"><div style="display:flex;justify-content:space-between"><b style="color:#FFD700">💬 Comentários</b><span onclick="closeAll()" style="font-size:26px;color:#FFD700">×</span></div><div id="commentsList" style="margin-top:12px"></div><div style="display:flex;gap:8px;margin-top:12px"><input id="commentInput" class="input" style="flex:1;margin:0" placeholder="Comenta..."><button onclick="sendComment()" style="padding:10px 16px;border-radius:12px;background:#FFD700;color:#000;font-weight:900">Enviar</button></div></div></div>
<div class="modal" id="shareM"><div style="flex:1" onclick="closeAll()"></div><div style="position:absolute;bottom:0;left:0;right:0;background:#1d1d1d;border-radius:28px 28px 0 0;padding:20px;border-top:3px solid #FFD700"><div style="text-align:center"><b style="color:#FFD700">↗️ Compartilhar</b><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px"><button onclick="shareWhats()" style="padding:14px;border-radius:14px;background:#25D366;color:#fff;font-weight:900;border:none">💬 WhatsApp</button><button onclick="shareCopy()" style="padding:14px;border-radius:14px;background:#111;color:#FFD700;border:1.5px solid #FFD700;font-weight:900">🔗 Copiar Link</button><button onclick="shareFace()" style="padding:14px;border-radius:14px;background:#1877F2;color:#fff;font-weight:900;border:none">📘 Facebook</button><button onclick="shareSystem()" style="padding:14px;border-radius:14px;background:#FFD700;color:#000;font-weight:900;border:none">📤 Mais</button></div></div></div></div>
<div class="modal" id="myM"><div style="flex:1" onclick="closeAll()"></div><div style="position:absolute;bottom:0;left:0;right:0;background:#1d1d1d;border-radius:28px 28px 0 0;padding:16px;border-top:2px solid #FFD700;max-height:80vh;overflow:auto"><b style="color:#FFD700">✨ Meus</b><span style="float:right" onclick="closeAll()">×</span><div id="myGrid" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px"></div></div></div>
<div class="modal" id="deleteM"><div style="flex:1" onclick="closeAll()"></div><div style="position:absolute;bottom:0;left:0;right:0;background:#1d1d1d;border-radius:28px 28px 0 0;padding:20px;border-top:3px solid #ff0000"><div style="text-align:center"><h3 style="color:#ff4444">Apagar?</h3><div id="deletePreview" style="margin-top:12px;background:#000;border-radius:12px;padding:8px"></div><div style="display:flex;gap:10px;margin-top:16px"><button onclick="closeAll()" style="flex:1;padding:14px;border-radius:14px;background:#111;color:#fff">Cancelar</button><button onclick="confirmDelete()" style="flex:1;padding:14px;border-radius:14px;background:#ff0000;color:#fff;font-weight:900">🗑️ Apagar</button></div></div></div></div>

<script>
const APP_OWNER_NICK="jonathacarlosmaria";
let db=null,stream=null,rec=null,chunks=[],cur=0,facing='user',camMode='foto',photoData=null,camTimerInt=null,camStartTime=0,VIDEO_MAX=90000,LIVE_MAX=1800000,allVideos=[],galleryFiles=[],deleteId=null,currentMuted=true;
function toast(t){let e=document.getElementById('toast');e.innerText=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2800)}
function closeAll(){document.querySelectorAll('.modal').forEach(m=>{m.classList.remove('on');m.style.display='none'})}
function getCurrentUser(){return JSON.parse(localStorage.getItem('work_current_user')||'{"nick":"'+APP_OWNER_NICK+'","name":"Jonatha"}')}
function goHome(){closeAll();render()}
function goMy(){let myNick=getCurrentUser().nick;let myVideos=allVideos.filter(v=>v.owner===myNick);document.getElementById('myGrid').innerHTML=myVideos.map(v=>{let media=v.type==='foto'||(v.data&&v.data.startsWith('data:image'))?`<img src="${v.data||v.img}" style="width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:12px">`:`<video src="${v.data}" controls playsinline style="width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:12px"></video>`;return `<div style="position:relative;border:2px solid #0a0;border-radius:12px;overflow:hidden">${media}<button onclick="askDelete(${v.id})" style="position:absolute;bottom:6px;right:6px;background:#ff0000;color:#fff;border:2px solid #fff;border-radius:20px;padding:4px 8px;font-size:10px">🗑️</button></div>`}).join('')||'<div style="text-align:center;padding:20px;color:#888">Nenhum</div>';document.getElementById('myM').classList.add('on');document.getElementById('myM').style.display='flex';}
function goProfile(){let c=getCurrentUser();document.getElementById('inName').value=c.name;document.getElementById('inNick').value=c.nick;document.getElementById('profileName').innerText=c.name;document.getElementById('profileNick').innerText='@'+c.nick;document.getElementById('profileM').classList.add('on');document.getElementById('profileM').style.display='flex';}
function saveProfile(){let c=getCurrentUser();c.name=document.getElementById('inName').value.trim();c.nick=document.getElementById('inNick').value.trim().replace('@','');localStorage.setItem('work_current_user',JSON.stringify(c));toast('✅ @'+c.nick);render();}
function saveToBackup(){try{let b=allVideos.filter(v=>v.id!==1).slice(0,50).map(v=>({id:v.id,desc:v.desc,data:v.data,type:v.type,owner:v.owner,likes:v.likes||0,comments:v.commentsList||[] }));localStorage.setItem('work_backup_videos',JSON.stringify(b));}catch{}}
function loadFromBackup(){try{let b=JSON.parse(localStorage.getItem('work_backup_videos')||'[]');if(b.length>0)return b;}catch{}return [];}
function openGalleryAuto(){document.getElementById('galleryInput').click();}
function handleGalleryFiles(files){galleryFiles=Array.from(files);document.getElementById('galleryAutoM').classList.add('on');document.getElementById('galleryAutoM').style.display='flex';document.getElementById('galleryCount').innerText=galleryFiles.length+' itens';document.getElementById('importAllBtn').style.display='block';let grid=document.getElementById('galleryAutoGrid');grid.innerHTML='';galleryFiles.forEach((f,i)=>{let url=URL.createObjectURL(f);let isVid=f.type.startsWith('video/');let el=document.createElement('div');el.style.cssText='position:relative;aspect-ratio:9/16;background:#111;border-radius:12px;overflow:hidden;border:2px solid #FFD700';el.innerHTML=isVid?`<video src="${url}" style="width:100%;height:100%;object-fit:cover" muted></video><div style="position:absolute;top:6px;right:6px"><input type="checkbox" checked data-i="${i}" class="gCheck" style="width:22px;height:22px"></div>`: `<img src="${url}" style="width:100%;height:100%;object-fit:cover"><div style="position:absolute;top:6px;right:6px"><input type="checkbox" checked data-i="${i}" class="gCheck" style="width:22px;height:22px"></div>`;grid.appendChild(el);});}
function importAllGallery(){let checks=document.querySelectorAll('.gCheck:checked');let curUser=getCurrentUser();let done=0;checks.forEach(ch=>{let f=galleryFiles[parseInt(ch.dataset.i)];let rd=new FileReader();rd.onload=ev=>{let id=Date.now()+Math.random();let obj={id:id,data:ev.target.result,desc:f.name,type:f.type.startsWith('video/')?'video':'foto',likes:0,owner:curUser.nick,commentsList:[]};allVideos.unshift(obj);saveToBackup();try{let tx=db.transaction('videos','readwrite');tx.objectStore('videos').add(obj);}catch{}done++;if(done===checks.length){toast(`✅ ${done} salvos!`);closeAll();render();}};rd.readAsDataURL(f);});}
document.getElementById('galleryInput').addEventListener('change',e=>{ if(e.target.files.length) handleGalleryFiles(e.target.files); });
function askDelete(id){deleteId=id;let v=allVideos.find(x=>x.id===id);document.getElementById('deletePreview').innerText=`@${v.owner} - ${v.desc}`;document.getElementById('deleteM').classList.add('on');document.getElementById('deleteM').style.display='flex';}
function confirmDelete(){let id=deleteId;allVideos=allVideos.filter(x=>x.id!==id);saveToBackup();try{let tx=db.transaction('videos','readwrite');tx.objectStore('videos').delete(id);}catch{}if(cur>=allVideos.length)cur=0;closeAll();render();}

function render(){
if(allVideos.length===0)allVideos=[{id:1,desc:"WORK - lateral completa",img:"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?q=80&w=1000",type:'foto',owner:APP_OWNER_NICK,likes:10,commentsList:["Top! 👑"]}];
let v=allVideos[cur];
let media=v.type==='foto'||(v.data&&v.data.startsWith('data:image'))?`<div class="bg" style="background-image:url('${v.data||v.img}')"></div>`:`<video id="mainVideo" src="${v.data}" autoplay loop muted playsinline style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"></video><div id="soundBtn" class="soundBig" onclick="toggleSound()">🔇</div>`;

document.getElementById('stage').innerHTML=`${media}<div class="grad"></div>
<div class="top"><div class="pill">${cur+1}/${allVideos.length} SALVOS</div><div class="pill on">✅ @${v.owner}</div></div>

<div class="actions">
<div onclick="like()" style="display:flex;flex-direction:column;align-items:center"><div class="abtn" id="heartBtn" style="border-color:#ff2d55">❤️</div><div class="cnt">${v.likes||0}</div></div>
<div onclick="openComments()" style="display:flex;flex-direction:column;align-items:center"><div class="abtn" style="border-color:#00d4ff">💬</div><div class="cnt">${(v.commentsList||[]).length}</div></div>
<div onclick="openGalleryAuto()" style="display:flex;flex-direction:column;align-items:center"><div class="abtn gold">🖼️</div><div class="cnt" style="background:linear-gradient(145deg,#FFE55C,#FFD700);color:#000;border-color:#000;font-weight:900">Galeria</div></div>
<div onclick="openShare()" style="display:flex;flex-direction:column;align-items:center"><div class="abtn" style="border-color:#fff">↗️</div><div class="cnt">Share</div></div>
<div onclick="toggleSound()" style="display:flex;flex-direction:column;align-items:center"><div class="abtn" style="background:${currentMuted?'rgba(30,30,30,.88)':'#FFD700'}">${currentMuted?'🔇':'🔊'}</div><div class="cnt">${currentMuted?'Mudo':'Som'}</div></div>
<div onclick="askDelete(${v.id})" style="display:flex;flex-direction:column;align-items:center"><div class="abtn" style="background:#ff0000!important;border-color:#fff!important;animation:slideIn.5s backwards.58s, shake 3.5s infinite 2.5s">🗑️</div><div class="cnt" style="color:#ff4444">Apagar</div></div>
</div>

<div class="meta"><div style="font-weight:700">${v.desc}</div><div style="font-size:10px;color:#FFD700">💬 ${(v.commentsList||[]).length} comentários | 🖼️ Galeria lateral | ↗️ Share | @${v.owner}</div></div>`;

let vid=document.getElementById('mainVideo');if(vid){vid.muted=currentMuted;let sb=document.getElementById('soundBtn');if(sb){sb.innerText=currentMuted?'🔇':'🔊';sb.style.display=currentMuted?'flex':'none'}}
}

function like(){
let v=allVideos[cur];v.likes=(v.likes||0)+1;
let btn=document.getElementById('heartBtn');if(btn){btn.classList.add('liked');setTimeout(()=>btn.classList.remove('liked'),450)}
let h=document.createElement('div');h.className='flyHeart';h.innerText='❤️';document.getElementById('stage').appendChild(h);setTimeout(()=>h.remove(),1100);
saveToBackup();render();toast('❤️ Curtiu!');
}
function openComments(){let v=allVideos[cur];document.getElementById('commentsList').innerHTML=(v.commentsList||[]).map(c=>`<div style="background:rgba(255,255,255,.08);padding:10px;border-radius:12px;margin-bottom:8px;border-left:3px solid #00d4ff">💬 ${c}</div>`).join('')||'<div style="text-align:center;color:#888;padding:20px">Seja o primeiro!</div>';document.getElementById('commentsM').classList.add('on');document.getElementById('commentsM').style.display='flex';}
function sendComment(){let txt=document.getElementById('commentInput').value.trim();if(!txt)return;let v=allVideos[cur];if(!v.commentsList)v.commentsList=[];v.commentsList.push(txt);document.getElementById('commentInput').value='';saveToBackup();openComments();render();toast('💬 Comentado!');}
function openShare(){document.getElementById('shareM').classList.add('on');document.getElementById('shareM').style.display='flex';}
function shareWhats(){let v=allVideos[cur];let text=`WORK de @${v.owner}: ${v.desc} https://jonathacarlosmaria-wq.github.io/Work-influencia/`;window.open(`https://wa.me/?text=${encodeURIComponent(text)}`);}
function shareCopy(){navigator.clipboard.writeText(location.href).then(()=>toast('✅ Link copiado!'));}
function shareFace(){window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(location.href)}`);}
function shareSystem(){if(navigator.share){navigator.share({title:'WORK',text:'Vídeo',url:location.href})}else{shareCopy()}}
function toggleSound(){let vid=document.getElementById('mainVideo');if(!vid)return;currentMuted=!currentMuted;vid.muted=currentMuted;render();toast(currentMuted?'🔇 Mudo':'🔊 Som!');if(!currentMuted)vid.play().catch(()=>{});}
function setCamMode(mode){camMode=mode;photoData=null;document.getElementById('btnFoto').style.background=mode==='foto'?'#FFD700':'rgba(0,0,0,.6)';document.getElementById('btnVideo').style.background=mode==='video'?'#FFD700':'rgba(0,0,0,.6)';document.getElementById('btnLive').style.background=mode==='live'?'#ff0000':'rgba(0,0,0,.6)';let label=document.getElementById('camModeLabel'),timer=document.getElementById('camTimer'),progress=document.getElementById('camProgress');if(camTimerInt){clearInterval(camTimerInt);camTimerInt=null}progress.style.width='0%';if(mode==='foto'){label.innerText='📸 FOTO';timer.style.display='none';document.getElementById('shutterBtn').innerText='📸'}if(mode==='video'){label.innerText=`📹 1:30`;timer.style.display='block';document.getElementById('shutterBtn').innerText='⏺️';startRec(false)}if(mode==='live'){label.innerText=`🔴 LIVE`;timer.style.display='block';document.getElementById('shutterBtn').innerText='🔴';startRec(true)}}
function captureAction(){if(camMode==='foto'){let v=document.getElementById('camEl');let c=document.getElementById('photoCanvas');c.width=v.videoWidth||720;c.height=v.videoHeight||1280;c.getContext('2d').drawImage(v,0,0,c.width,c.height);photoData=c.toDataURL('image/jpeg',0.8);toast('📸 Foto pronta!');document.getElementById('shutterBtn').innerText='✅';}}
function goCam(isLive=false){document.getElementById('cam').style.display='flex';navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:{echoCancellation:false,noiseSuppression:false}}).then(s=>{stream=s;document.getElementById('camEl').srcObject=s;document.getElementById('camEl').muted=true;setCamMode(isLive?'live':'foto');}).catch(()=>toast('❌ Permita câmera'));}
function startRec(isLive){chunks=[];if(stream){let mime='video/webm;codecs=vp9,opus';if(!MediaRecorder.isTypeSupported(mime))mime='video/webm';try{rec=new MediaRecorder(stream,{mimeType:mime,audioBitsPerSecond:128000});}catch{rec=new MediaRecorder(stream);}rec.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data)};rec.start(100);camStartTime=Date.now();camTimerInt=setInterval(()=>{let elapsed=Date.now()-camStartTime;let limit=isLive?LIVE_MAX:VIDEO_MAX;document.getElementById('camTimer').innerText=`${isLive?'🔴':'●'} ${Math.floor(elapsed/1000)}s`;document.getElementById('camProgress').style.width=`${Math.min(100,(elapsed/limit)*100)}%`;if(elapsed>=limit)postCurrent();},100);}}
function closeCam(){if(camTimerInt){clearInterval(camTimerInt);camTimerInt=null}if(rec){try{rec.stop()}catch{}rec=null}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}document.getElementById('cam').style.display='none';document.getElementById('camProgress').style.width='0%';photoData=null}
function postCurrent(){let curUser=getCurrentUser();if(camMode==='foto'){if(!photoData){toast('Tire foto');return}let id=Date.now();let obj={id:id,data:photoData,desc:document.getElementById('descInp').value||'Foto @'+curUser.nick,type:'foto',likes:0,owner:curUser.nick,commentsList:[]};allVideos.unshift(obj);saveToBackup();try{let tx=db.transaction('videos','readwrite');tx.objectStore('videos').add(obj);}catch{}closeCam();document.getElementById('descInp').value='';toast('✅ SALVO!');render();}else{if(!rec||chunks.length===0){toast('Grave');return}if(camTimerInt){clearInterval(camTimerInt);camTimerInt=null}rec.stop();let blob=new Blob(chunks,{type:rec.mimeType||'video/webm'});let r=new FileReader();r.onload=e=>{let id=Date.now()+Math.random();let obj={id:id,data:e.target.result,desc:document.getElementById('descInp').value||'Vídeo 🔊 @'+curUser.nick,type:'video',likes:0,owner:curUser.nick,commentsList:[]};allVideos.unshift(obj);saveToBackup();try{let tx=db.transaction('videos','readwrite');tx.objectStore('videos').add(obj);}catch{}closeCam();document.getElementById('descInp').value='';chunks=[];currentMuted=false;toast('✅ COM SOM SALVO!');render();};r.readAsDataURL(blob);}}
function initDB(){return new Promise(r=>{let q=indexedDB.open('WorkDB_MOVIMENTO_ARRUMADO',17);q.onupgradeneeded=e=>{if(!e.target.result.objectStoreNames.contains('videos'))e.target.result.createObjectStore('videos',{keyPath:'id'})};q.onsuccess=e=>{db=e.target.result;r()};q.onerror=()=>{db=null;r();};});}
function loadAll(){return new Promise(r=>{if(!db){r(loadFromBackup());return;}try{let tx=db.transaction('videos','readonly');let req=tx.objectStore('videos').getAll();req.onsuccess=()=>{let res=req.result;if(res.length===0)res=loadFromBackup();r(res);};req.onerror=()=>{r(loadFromBackup());};}catch{r(loadFromBackup());}});}
let sy=0;const st=document.getElementById('stage');st.addEventListener('touchstart',e=>{sy=e.touches[0].clientY},{passive:true});st.addEventListener('touchend',e=>{let d=sy-e.changedTouches[0].clientY;if(Math.abs(d)>60){if(d>0){cur++;if(cur>=allVideos.length)cur=0}else{cur--;if(cur<0)cur=allVideos.length-1}currentMuted=true;render();}},{passive:true});
initDB().then(async()=>{let saved=await loadAll();saved.reverse().forEach(v=>{allVideos.unshift({id:v.id,desc:v.desc,data:v.data,type:v.type||'video',likes:v.likes||0,owner:v.owner||APP_OWNER_NICK,commentsList:v.commentsList||v.comments||[]})});render();if(!localStorage.getItem('work_current_user')){let u={id:1,nick:APP_OWNER_NICK,name:'Jonatha'};localStorage.setItem('work_current_user',JSON.stringify(u));}toast('✅ Botões arrumados com movimento!');});
</script>
