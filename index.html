let f=e.target.files[0];if(!f||!f.type.startsWith('video/')) return;
let u=URL.createObjectURL(f);let tv=document.createElement('video');tv.preload='metadata';tv.src=u;
tv.onloadedmetadata=async ()=>{let d=Math.round(tv.duration||0);if(d>90){WORK.toast(`Muito longo ${d}s`);return}let o={id:Date.now(),user:"@voce.gold",desc:"Vídeo GOLD da galeria 👑",img:u,blob:f,blobUrl:u,likes:0,liked:false,com:0,share:0,follow:false,type:"video",duration:d,isDefault:false,sound:"GOLD"};await WORK.save(o);WORK.videos.unshift(o);WORK.cur=0;WORK.closeM();WORK.closeCam();WORK.render();WORK.toast(`👑 GOLD ${d}s salvo!`)};
});
WORK.loadSaved();
let sy=0;document.addEventListener('touchstart',e=>sy=e.touches[0].clientY,{passive:true});
document.addEventListener('touchend',e=>{if(document.getElementById('cam').classList.contains('on'))return;if(document.querySelector('.modal.on'))return;let d=sy-e.changedTouches[0].clientY;if(Math.abs(d)>60){if(d>0&&WORK.cur<WORK.videos.length-1) WORK.cur++;if(d<0&&WORK.cur>0) WORK.cur--;WORK.render()}},{passive:true});
</script>
