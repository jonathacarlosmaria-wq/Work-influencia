<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WORK FIRE - LAYOUT ORIGINAL CONSERTADO</title>
<style>
:root{--fire:#ff4500;--fire2:#ff8c00}
*{margin:0;padding:0;box-sizing:border-box!important}
html,body{height:100dvh!important;background:#000!important;overflow:hidden!important}
#app{width:100%!important;max-width:420px!important;height:100dvh!important;margin:0 auto!important;display:flex!important;flex-direction:column!important;position:relative!important;background:#000!important}
#feed{flex:1!important;overflow-y:scroll!important;scroll-snap-type:y mandatory!important}
#feed::-webkit-scrollbar{display:none!important}
.post{height:100dvh!important;width:100%!important;position:relative!important;scroll-snap-align:start!important;background:#111 center/cover no-repeat!important;flex-shrink:0!important}

/* SEU LAYOUT ORIGINAL DA FOTO - MANTIDO */
.top{position:absolute!important;top:14px!important;left:12px!important;right:12px!important;display:flex!important;justify-content:space-between!important;z-index:10!important}
.logo{color:#ff4500!important;font-weight:900!important;font-size:18px!important;text-shadow:0 0 10px #ff4500!important}
.badge{background:linear-gradient(90deg,#ff4500,#ff8c00)!important;color:#000!important;padding:6px 14px!important;border-radius:20px!important;font-weight:900!important;font-size:11px!important}

/* SEUS 5 BOTÕES LATERAIS ORIGINAIS - SÓ COM VIDA */
.side{position:absolute!important;right:10px!important;bottom:110px!important;display:flex!important;flex-direction:column!important;gap:16px!important;z-index:20!important;align-items:center!important;width:60px!important}
.sbtn{display:flex!important;flex-direction:column!important;align-items:center!important;background:none!important;border:none!important;cursor:pointer!important;width:100%!important}
.ibtn{width:52px!important;height:52px!important;border-radius:50%!important;background:radial-gradient(circle,#ff4500,#8b0000)!important;border:2px solid #ff8c00!important;display:flex!important;align-items:center!important;justify-content:center!important;font-size:22px!important;box-shadow:0 0 12px rgba(255,69,0,.7)!important;transition:all.2s!important}
.sbtn:active.ibtn{transform:scale(0.85)!important}
.ibtn.vivo{animation:pulso 1.8s infinite!important}
@keyframes pulso{0%,100%{transform:scale(1);box-shadow:0 0 12px rgba(255,69,0,.6)}50%{transform:scale(1.08);box-shadow:0 0 20px rgba(255,140,0,.9)}}
@keyframes clickPop{0%{transform:scale(1)}30%{transform:scale(1.4)}100%{transform:scale(1)}}
.count{color:#fff!important;font-size:11px!important;font-weight:700!important;text-shadow:0 1px 2px #000!important;margin-top:3px!important}

.info{position:absolute!important;left:12px!important;right:76px!important;bottom:85px!important;background:rgba(10,0,0,.88)!important;border:2px solid #ff3300!important;border-radius:14px!important;padding:10px 12px!important;z-index:5!important}
.nav{height:68px!important;min-height:68px!important;background:#080300!important;border-top:2px solid #ff4500!important;display:flex!important;align-items:center!important;justify-content:space-around!important;z-index:20!important;flex-shrink:0!important}
.nav button{flex:1!important;background:none!important;border:none!important;color:#6b3a10!important;font-size:10px!important;font-weight:800!important;display:flex!important;flex-direction:column!important;align-items:center!important}
.nav button.on{color:#ff8c00!important}
.plus{width:62px!important;height:62px!important;border-radius:50%!important;background:radial-gradient(circle,#ff6a00,#ff0000)!important;border:3px solid #fff!important;color:#fff!important;font-size:30px!important;display:flex!important;align-items:center!important;justify-content:center!important;margin-top:-26px!important;box-shadow:0 0 20px #ff4500!important}

/* SHEET PROFISSIONAL MAS COM COR FIRE */
.sheet{position:fixed!important;inset:0!important;background:rgba(0,0,0,.7)!important;z-index:100!important;display:none!important;align-items:flex-end!important}
.sheet.show{display:flex!important}
.sheetBox{background:#140800!important;border-top:3px solid #ff4500!important;width:100%!important;border-radius:18px 18px 0 0!important;padding:0 0 20px 0!important;max-height:75dvh!important;display:flex!important;flex-direction:column!important}
.page{position:absolute!important;inset:0!important;background:#000!important;z-index:30!important;display:none!important;flex-direction:column!important;overflow:auto!important}
.page.show{display:flex!important}
.card{background:#140800!important;border:2px solid #ff4500!important;border-radius:12px!important;padding:14px!important;margin:10px!important}
.input{width:100%!important;padding:12px!important;background:#1a0a00!important;border:1.5px solid #ff4500!important;border-radius:10px!important;color:#fff!important;margin-top:8px!important}
.btn{width:100%!important;padding:14px!important;background:linear-gradient(90deg,#ff4500,#ff8c00)!important;border:none!important;border-radius:10px!important;color:#000!important;font-weight:900!important;margin-top:10px!important}
</style>
</head>
<body>
<div id="app">
<div id="feed"></div>

<div id="sheetComent" class="sheet" onclick="if(event.target==this)closeSheet('sheetComent')"><div class="sheetBox"><div style="padding:16px;display:flex;justify-content:space-between;border-bottom:1px solid #331100"><b style="color:#ff8c00">💬 <span id="cTotal">0</span> Comentários</b><button onclick="closeSheet('sheetComent')" style="background:none;border:none;color:#fff;font-size:20px">✕</button></div><div id="listC" style="flex:1;overflow:auto;padding:0 16px"></div><div style="padding:12px;display:flex;gap:8px"><input id="txtC" class="input" style="flex:1;margin:0" placeholder="Comente..."><button onclick="sendC()" style="background:linear-gradient(90deg,#ff4500,#ff8c00);border:none;padding:0 18px;border-radius:10px;font-weight:900">Enviar</button></div></div></div>
<div id="sheetShare" class="sheet" onclick="if(event.target==this)closeSheet('sheetShare')"><div class="sheetBox"><div style="padding:16px;display:flex;justify-content:space-between;border-bottom:1px solid #331100"><b style="color:#ff8c00">🚀 Compartilhar</b><button onclick="closeSheet('sheetShare')" style="background:none;border:none;color:#fff;font-size:20px">✕</button></div><div style="padding:16px"><button onclick="shareZap()" class="card" style="width:100%;display:flex;gap:12px;align-items:center">💬 WhatsApp</button><button onclick="shareCopy()" class="card" style="width:100%;display:flex;gap:12px;align-items:center">🔗 Copiar Link</button></div></div></div>

<div id="pCriar" class="page"><div style="display:flex;justify-content:space-between;padding:14px"><h3 style="color:#ff4500">🔥 Criar</h3><button onclick="closeAll()" style="background:none;border:none;color:#fff;font-size:22px">✕</button></div><div class="card"><input id="imgLink" class="input" placeholder="Link imagem"><input id="file" type="file" accept="image/*" style="margin-top:10px;color:#fff"><img id="prev" style="width:100%;margin-top:10px;border-radius:10px;display:none"><input id="desc" class="input" placeholder="Descrição"><button class="btn" onclick="addPost()">POSTAR</button></div></div>
<div id="pEu" class="page"><div style="display:flex;justify-content:space-between;padding:14px"><b style="color:#ff4500">🔥 PERFIL</b><button onclick="closeAll()" style="background:none;border:none;color:#fff;font-size:22px">✕</button></div><div class="card" id="salvosBox"></div></div>

<div class="nav">
<button id="n0" class="on" onclick="go(0)"><span style="font-size:20px">🏠</span><span>Inicio</span></button>
<button onclick="go(1)"><span style="font-size:20px">🔍</span><span>Busca</span></button>
<button onclick="go(2)"><div class="plus">+</div></button>
<button onclick="go(3)"><span style="font-size:20px">🔴</span><span>Live</span></button>
<button id="n4" onclick="go(4)"><span style="font-size:20px">🔥</span><span>Eu</span></button>
</div>
</div>
<script>
// LIMPA CACHE VELHO AUTOMATICO
if(localStorage.getItem("FIRE_LAYOUT_ORIGINAL_V2")==null){
 localStorage.removeItem("posts_fire_4btn");
 localStorage.removeItem("posts_tiktok_fix");
 localStorage.removeItem("posts_final_fix");
}

let posts=[{owner:"fire.influencer",img:"https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=800",desc:"🔥 AGORA COM 4 BOTÕES LATERAIS!",likes:7791,liked:false,comments:[{u:"ana",t:"Lindo! 🔥"}],saves:0,saved:false,shares:8}];
let temp="",cur=0;
try{let p=localStorage.getItem("FIRE_LAYOUT_ORIGINAL_V2"); if(p) posts=JSON.parse(p);}catch(e){}

function render(){
document.getElementById("feed").innerHTML=posts.map((p,i)=>`
<div class="post" style="background-image:url('${p.img}')">
<div class="top"><div class="logo">🔥 WORK FIRE</div><div class="badge">🔥 1 FIRE ONLINE</div></div>
<div class="side">
<button class="sbtn" onclick="doFire(${i},this)"><div class="ibtn vivo">🔥</div><div class="count">${p.likes+100}</div></button>
<button class="sbtn" onclick="doLike(${i},this)"><div class="ibtn vivo" style="${p.liked?'background:radial-gradient(circle,#ff0000,#8b0000)!important':''}">${p.liked?'💖':'🤍'}</div><div class="count">${p.liked?'Curtir':'Curtir'}</div></button>
<button class="sbtn" onclick="openComent(${i},this)"><div class="ibtn vivo">💬</div><div class="count">${p.comments.length}</div></button>
<button class="sbtn" onclick="openShare(${i},this)"><div class="ibtn vivo">🚀</div><div class="count">${p.shares}</div></button>
<button class="sbtn" onclick="doSave(${i},this)"><div class="ibtn vivo" style="${p.saved?'background:radial-gradient(circle,#ffcc00,#8b0000)!important':''}">🔖</div><div class="count">Salvar</div></button>
</div>
<div class="info"><b style="color:#ff8c00">@${p.owner}</b><div style="font-size:13px;margin-top:4px;color:#fff">🔥 ${p.desc}</div></div>
</div>`).join("");
document.getElementById("salvosBox").innerHTML=`<b>🔖 Salvos: ${posts.filter(x=>x.saved).length}</b><div style="margin-top:10px">${posts.filter(x=>x.saved).map(x=>`<div style="display:flex;gap:8px;margin-top:8px"><img src="${x.img}" style="width:50px;height:50px;border-radius:8px;object-fit:cover"><div style="font-size:12px;color:#fff">${x.desc}</div></div>`).join("")||"<div style='color:#666'>Nenhum</div>"}</div>`;
}
function save(){localStorage.setItem("FIRE_LAYOUT_ORIGINAL_V2",JSON.stringify(posts));}
function anim(btn){let ib=btn.querySelector('.ibtn'); ib.style.animation='none'; void ib.offsetWidth; ib.style.animation='clickPop.4s ease, pulso 1.8s infinite 0.4s'; navigator.vibrate&&navigator.vibrate(30);}
function doLike(i,btn){anim(btn); posts[i].liked=!posts[i].liked; save(); render();}
function doSave(i,btn){anim(btn); posts[i].saved=!posts[i].saved; save(); render();}
function doFire(i,btn){anim(btn); posts[i].likes++; save(); render();}
function openComent(i,btn){anim(btn); cur=i; document.getElementById("cTotal").innerText=posts[i].comments.length; document.getElementById("listC").innerHTML=posts[i].comments.map(c=>`<div style="padding:12px 0;border-bottom:1px solid #331100"><b style="color:#ff8c00">@${c.u}</b> <span style="color:#fff">${c.t}</span></div>`).join("")||"<div style='color:#666;padding:20px;text-align:center'>Sem comentários</div>"; document.getElementById("sheetComent").classList.add("show");}
function sendC(){let t=document.getElementById("txtC").value.trim(); if(!t)return; posts[cur].comments.push({u:"fire",t:t}); document.getElementById("txtC").value=""; save(); openComent(cur); render();}
function openShare(i,btn){anim(btn); cur=i; document.getElementById("sheetShare").classList.add("show");}
function shareZap(){window.open(`https://wa.me/?text=${encodeURIComponent(posts[cur].desc+" "+location.href)}`); posts[cur].shares++; save(); render(); closeSheet('sheetShare');}
function shareCopy(){navigator.clipboard.writeText(location.href); posts[cur].shares++; save(); render(); closeSheet('sheetShare');}
function closeSheet(id){document.getElementById(id).classList.remove("show");}
function addPost(){let link=document.getElementById("imgLink").value.trim()||temp; let d=document.getElementById("desc").value.trim()||"🔥 Fire"; if(!link){alert("Imagem");return;} posts.unshift({owner:"fire.influencer",img:link,desc:d,likes:0,liked:false,comments:[],saves:0,saved:false,shares:0}); save(); render(); closeAll(); go(0);}
function go(n){document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("on")); if(document.getElementById("n"+n))document.getElementById("n"+n).classList.add("on"); document.querySelectorAll(".page").forEach(p=>p.classList.remove("show")); if(n==2)document.getElementById("pCriar").classList.add("show"); if(n==4)document.getElementById("pEu").classList.add("show");}
function closeAll(){document.querySelectorAll(".page").forEach(p=>p.classList.remove("show"));}
document.getElementById("file").addEventListener("change",function(e){let r=new FileReader();r.onload=function(ev){temp=ev.target.result;let p=document.getElementById("prev");p.src=temp;p.style.display="block";};if(e.target.files[0])r.readAsDataURL(e.target.files[0]);});
render();
</script>
</body>
</html>
<!-- INICIO - COLE ISSO SUBSTITUINDO SEU <div id="pEu"> ATUAL -->
<div id="pEu" class="page">
<div style="display:flex;justify-content:space-between;padding:14px;align-items:center">
<b style="color:#ff4500">🔥 Meu Perfil</b>
<button onclick="closeAll()" style="background:none;border:none;color:#fff;font-size:22px">✕</button>
</div>

<div style="text-align:center;padding:20px 14px">
<div id="fotoPerfil" style="width:90px;height:90px;border-radius:50%;margin:0 auto;background:radial-gradient(circle,#ff4500,#8b0000);border:3px solid #ff8c00;display:flex;align-items:center;justify-content:center;font-size:36px;overflow:hidden;background-size:cover;background-position:center">🔥</div>
<h3 id="nomePerfil" style="color:#fff;margin-top:12px">FIRE USER</h3>
<div id="userPerfil" style="color:#ff8c00;font-size:13px">@fire.user</div>
<div id="bioPerfil" style="color:#aaa;font-size:12px;margin-top:6px">🔥 Work Fire Influencer</div>
</div>

<div class="card">
<b style="color:#ff8c00">📸 Foto de Perfil</b>
<input id="linkFoto" class="input" placeholder="Cole link da foto">
<input id="fileFoto" type="file" accept="image/*" style="margin-top:10px;color:#fff;width:100%">
<img id="prevFoto" style="width:100%;margin-top:10px;border-radius:12px;display:none;max-height:200px;object-fit:cover">
</div>

<div class="card">
<b style="color:#ff8c00">👤 Cadastro</b>
<input id="cadNome" class="input" placeholder="Seu nome">
<input id="cadUser" class="input" placeholder="@seu usuario">
<input id="cadBio" class="input" placeholder="Sua bio - ex: Influencer Fire">
<button class="btn" onclick="salvarPerfil()">SALVAR PERFIL</button>
</div>

<div class="card">
<b style="color:#ff8c00">🔖 Salvos</b>
<div id="salvos"></div>
</div>
</div>
<!-- FIM DO EU -->

<script>
// COLE ESSE JS JUNTO COM SEUS OUTROS SCRIPTS
let perfilUser = {nome:"FIRE USER", user:"@fire.user", bio:"🔥 Work Fire Influencer", foto:""};
try{let p=localStorage.getItem("PERFIL_FIRE_USER"); if(p) perfilUser=JSON.parse(p);}catch(e){}

function atualizarPerfilTela(){
document.getElementById("nomePerfil").innerText=perfilUser.nome;
document.getElementById("userPerfil").innerText=perfilUser.user;
document.getElementById("bioPerfil").innerText=perfilUser.bio;
let fp=document.getElementById("fotoPerfil");
if(perfilUser.foto){
fp.style.backgroundImage=`url('${perfilUser.foto}')`;
fp.innerText="";
}else{
fp.style.backgroundImage="none";
fp.innerText="🔥";
}
}
function salvarPerfil(){
perfilUser.nome=document.getElementById("cadNome").value.trim()||perfilUser.nome;
perfilUser.user=document.getElementById("cadUser").value.trim()||perfilUser.user;
perfilUser.bio=document.getElementById("cadBio").value.trim()||perfilUser.bio;
let link=document.getElementById("linkFoto").value.trim();
if(link) perfilUser.foto=link;
if(window.tempFotoPerfil) perfilUser.foto=window.tempFotoPerfil;
localStorage.setItem("PERFIL_FIRE_USER",JSON.stringify(perfilUser));
atualizarPerfilTela();
alert("✅ Perfil salvo!");
}
let tempFotoPerfil="";
document.getElementById("fileFoto")?.addEventListener("change",function(e){
let r=new FileReader();
r.onload=function(ev){
window.tempFotoPerfil=ev.target.result;
let pv=document.getElementById("prevFoto");
pv.src=ev.target.result;
pv.style.display="block";
let fp=document.getElementById("fotoPerfil");
fp.style.backgroundImage=`url('${ev.target.result}')`;
fp.innerText="";
};
if(e.target.files[0]) r.readAsDataURL(e.target.files[0]);
});
document.getElementById("linkFoto")?.addEventListener("input",function(e){
let v=e.target.value.trim();
if(v){
let pv=document.getElementById("prevFoto");
pv.src=v;
pv.style.display="block";
}
});
// CHAMA AO ABRIR
setTimeout(atualizarPerfilTela,500);
</script>
