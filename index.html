<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WORK INFLUÊNCIA</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Montserrat,sans-serif;height:100dvh;overflow:hidden}
/* ABERTURA VIDEO TOP */
#splash{position:fixed;inset:0;background:#000;z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden}
.glow{position:absolute;width:600px;height:600px;background:radial-gradient(circle,rgba(255,0,0,0.25) 0%,transparent 70%);animation:glowMove 3s ease forwards}
@keyframes glowMove{0%{transform:scale(0.5);opacity:0}40%{opacity:1}100%{background:radial-gradient(circle,rgba(212,175,55,0.35) 0%,transparent 70%);transform:scale(1.5)}}
.splash-logo{font-size:36px;font-weight:900;letter-spacing:2px;z-index:2;position:relative;text-align:center;line-height:1.1}
.splash-logo.line1{display:block;font-size:18px;letter-spacing:8px;color:#ff0000;animation:line1Anim 2.8s forwards}
.splash-logo.line2{display:block;font-size:42px;margin-top:6px;background:linear-gradient(90deg,#ff0000 0%,#ff0000 30%,#D4AF37 50%,#FFD700 60%,#FFF8DC 70%,#FFD700 80%,#D4AF37 100%);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:textShine 2.8s ease forwards}
@keyframes line1Anim{0%{color:#ff0000;text-shadow:0 0 20px red;opacity:0;transform:translateY(20px)}30%{opacity:1;transform:translateY(0)}100%{color:#D4AF37;letter-spacing:10px;text-shadow:0 0 20px #D4AF37}}
@keyframes textShine{0%{background-position:0% center;filter:drop-shadow(0 0 15px red);transform:scale(0.9)}35%{background-position:0% center;filter:drop-shadow(0 0 20px red)}65%{background-position:100% center;filter:drop-shadow(0 0 30px gold)}100%{background-position:200% center;filter:drop-shadow(0 0 40px #FFD700) drop-shadow(0 0 80px #D4AF37);transform:scale(1)}}
.particles{position:absolute;inset:0;z-index:1;pointer-events:none}
.particles span{position:absolute;width:2px;height:2px;background:#FFD700;border-radius:50%;animation:particle 3s linear infinite;opacity:0}
@keyframes particle{0%{transform:translateY(100vh) translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-10vh) translateX(100px);opacity:0}}
.loading{margin-top:30px;width:120px;height:2px;background:#111;overflow:hidden;z-index:2;border-radius:2px}
.loading-bar{height:100%;width:0%;background:linear-gradient(90deg,#ff0000,#D4AF37,#FFD700);animation:load 2.8s ease forwards}
@keyframes load{to{width:100%}}
.sub{margin-top:12px;color:#444;font-size:10px;letter-spacing:5px;z-index:2}
.app{height:100dvh;display:flex;flex-direction:column;opacity:0}
.topbar{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#000;border-bottom:1px solid #151515}
.logo{font-weight:900;font-size:18px}.logo span{color:#D4AF37}
.saldo{border:1px solid #D4AF37;color:#D4AF37;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:700}
.feed{flex:1;position:relative;overflow:hidden;background:#0a0a0a}
.video-bg-img{position:absolute;inset:0;background-size:cover;background-position:center}
.overlay{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,0.85) 0%,transparent 55%,rgba(0,0,0,0.25) 100%)}
.right-actions{position:absolute;right:12px;bottom:105px;display:flex;flex-direction:column;gap:16px;z-index:2}
.icon{width:48px;height:48px;background:rgba(255,255,255,0.10);backdrop-filter:blur(12px);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:21px;border:1px solid rgba(255,255,255,0.12)}
.action{flex-direction:column;display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700}
.bottom-info{position:absolute;left:16px;right:80px;bottom:18px;z-index:2}
.u{font-size:18px;font-weight:900}.d{font-size:14px;color:#e0e0e0;margin:3px 0}.h{color:#D4AF37;font-size:13px}
.bottom-nav{height:58px;background:#000;border-top:1px solid #151515;display:flex;justify-content:space-around;align-items:center}
.nav{color:#555;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:2px}.nav.active{color:#D4AF37}.nav b{font-size:18px}
.add{width:36px;height:24px;background:#D4AF37;border-radius:6px;color:#000;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px}
#adminPanel,#perfilModal{position:fixed;inset:0;background:#000;z-index:100;display:none;padding:20px;overflow:auto}
.card{background:#111;border:1px solid #222;border-radius:16px;padding:16px;margin-bottom:14px}
input{background:#000;border:1px solid #333;color:#fff;padding:12px;border-radius:10px;width:100%;margin-bottom:10px}
button.main{background:linear-gradient(90deg,#D4AF37,#B8941F);border:none;padding:14px;border-radius:12px;font-weight:900;width:100%;color:#000}
</style>
</head>
<body>
<div id="splash">
<div class="glow"></div>
<div class="particles" id="particles"></div>
<div class="splash-logo"><span class="line1">WORK</span><span class="line2">INFLUÊNCIA</span></div>
<div class="loading"><div class="loading-bar"></div></div>
<div class="sub">PREMIUM EDITION</div>
</div>
<div class="app" id="app">
<div class="topbar"><div class="logo">★ WORK <span>INFLUÊNCIA</span></div><div class="saldo" id="saldoTop">R$ 40,80</div></div>
<div class="feed" id="feed"></div>
<div class="bottom-nav">
<div class="nav active"><b>⌂</b>Início</div><div class="nav"><b>◎</b>Explorar</div><div class="nav"><div class="add">+</div></div><div class="nav" onclick="alert('Carteira: R$ '+saldo)"><b>◧</b>Carteira</div><div class="nav" onclick="openPerfil()"><b>◉</b>Perfil</div>
</div>
</div>
<div id="perfilModal"><h2>Perfil</h2><br><div class="card" style="text-align:center"><div style="width:80px;height:80px;background:#D4AF37;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:36px;color:#000;font-weight:900">U</div><p style="font-weight:900">@usuario.teste</p><p id="saldoPerfil" style="color:#D4AF37;margin:10px 0">R$ 40,80</p><input id="pass" type="password" placeholder="Senha admin (admin123)"><button class="main" onclick="check()">ENTRAR ADMIN</button><br><br><button class="main" style="background:#222;color:#fff" onclick="closeP()">VOLTAR</button></div></div>
<div id="adminPanel"><h2 style="color:#D4AF37">Painel Admin</h2><br><div class="card"><h3 style="color:#D4AF37">Adicionar Vídeo</h3><input id="vU" placeholder="@usuario"><input id="vD" placeholder="Descrição"><input id="vH" placeholder="#hashtag"><input id="vI" placeholder="Link da imagem"><button class="main" onclick="add()">PUBLICAR</button></div><div class="card"><h3 style="color:#D4AF37">Alterar Saldo</h3><input id="nS" placeholder="Ex: 40,80"><button class="main" onclick="upS()">ATUALIZAR</button></div><button class="main" style="background:#222;color:#fff" onclick="closeA()">FECHAR</button></div>
<script>
let p=document.getElementById('particles');for(let i=0;i<20;i++){let s=document.createElement('span');s.style.left=Math.random()*100+'%';s.style.animationDelay=Math.random()*2+'s';s.style.animationDuration=(2+Math.random()*2)+'s';p.appendChild(s)}
let videos=[{user:"@mariana.influ",desc:"Dica de ouro para ganhar pontos",hash:"#workinfluencia",img:"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?q=80&w=1000",likes:"1.2k",com:"89",gift:"12",share:"34"}];
let saldo="40,80";let cur=0;
function render(){let f=document.getElementById('feed');let v=videos[cur];f.innerHTML=`<div class="video-bg-img" style="background-image:url('${v.img}')"></div><div class="overlay"></div><div class="right-actions"><div class="action"><div class="icon">♥</div>${v.likes}</div><div class="action"><div class="icon">💬</div>${v.com}</div><div class="action"><div class="icon">🎁</div>${v.gift}</div><div class="action"><div class="icon">↗</div>${v.share}</div></div><div class="bottom-info"><div class="u">${v.user}</div><div class="d">${v.desc}</div><div class="h">${v.hash}</div></div>`}
setTimeout(()=>{document.getElementById('splash').style.transition='opacity.8s';document.getElementById('splash').style.opacity='0';setTimeout(()=>{document.getElementById('splash').style.display='none';document.getElementById('app').style.opacity='1';document.getElementById('app').style.transition='opacity.6s';render()},800)},3400);
function openPerfil(){document.getElementById('perfilModal').style.display='block';document.getElementById('saldoPerfil').innerText='R$ '+saldo}
function closeP(){document.getElementById('perfilModal').style.display='none'}
function check(){if(document.getElementById('pass').value==='admin123'){closeP();document.getElementById('adminPanel').style.display='block'}else{alert('Senha: admin123')}}
function closeA(){document.getElementById('adminPanel').style.display='none';render()}
function add(){let u=document.getElementById('vU').value||'@novo.influ';let d=document.getElementById('vD').value||'Novo vídeo';let h=document.getElementById('vH').value||'#workinfluencia';let im=document.getElementById('vI').value||'https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=1000';videos.unshift({user:u,desc:d,hash:h,img:im,likes:'0',com:'0',gift:'0',share:'0'});cur=0;closeA();alert('Publicado!')}
function upS(){let ns=document.getElementById('nS').value;if(ns){saldo=ns;document.getElementById('saldoTop').innerText='R$ '+saldo;alert('Saldo: R$ '+saldo)}}
let sy=0;document.addEventListener('touchstart',e=>sy=e.touches[0].clientY);document.addEventListener('touchend',e=>{let diff=sy-e.changedTouches[0].clientY;if(Math.abs(diff)>50){if(diff>0&&cur<videos.length-1)cur++;if(diff<0&&cur>0)cur--;render()}});
</script>
</body>
</html>
