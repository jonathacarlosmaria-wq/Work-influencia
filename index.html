<script>
setTimeout(()=>{let s=document.getElementById('splash');if(s){s.style.opacity='0';setTimeout(()=>s.remove(),900);}},5000);
let uid=localStorage.getItem("uid"); if(!uid){uid="u_"+Math.random().toString(36).slice(2,7);localStorage.setItem("uid",uid);}
let userNome=localStorage.getItem("userNome")||"";let posts=[];let comAtivo=null;let stream=null,recorder=null,chunks=[],recording=false,timerInt=null,sec=0,facing="user",tempBlob=null,videoAtivo=null,observer=null;
function toast(m){let t=document.getElementById('toast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500);}
function pausarTodosExceto(exceto){document.querySelectorAll('#feed video').forEach(v=>{if(v!==exceto){try{v.pause();v.muted=true;}catch(e){}}});}
function setupObserver(){if(observer)observer.disconnect();observer=new IntersectionObserver((entries)=>{let vis=entries.filter(e=>e.isIntersecting&&e.intersectionRatio>=0.7);if(!vis.length)return;let video=vis[0].target.querySelector('video');if(!video||video===videoAtivo)return;pausarTodosExceto(video);videoAtivo=video;video.muted=false;video.play().catch(()=>{video.muted=true;video.play();});},{threshold:[0,0.7]});document.querySelectorAll('.post').forEach(p=>observer.observe(p));}
function escutaGlobal(){const q=window.fFuncs.query(window.fFuncs.collection(window.db,"posts"),window.fFuncs.orderBy("time","desc"));window.fFuncs.onSnapshot(q,(snap)=>{posts=[];snap.forEach(d=>{posts.push({id:d.id,...d.data()})});render();if(comAtivo)renderComs(comAtivo);});}
escutaGlobal();
function render(){document.getElementById("feed").innerHTML=posts.map(p=>{let isLive=p.isLive&&p.liveAtivo;if(isLive){return `<div class="post live-post"><div style="width:100%;height:100%;background:radial-gradient(circle,#440000,#000);display:flex;align-items:center;justify-content:center;flex-direction:column"><div style="background:#ff0000;color:#fff;padding:8px 16px;border-radius:20px;font-weight:900">🔴 AO VIVO GLOBAL</div><div style="color:#fff;margin-top:10px">@${p.owner}</div><div style="color:#ffcc00;font-size:11px;margin-top:6px">${p.desc}</div><button class="btn" style="width:auto;margin-top:15px;background:#ff0000;color:#fff" onclick="abrirCom('${p.id}')">💬 COMENTAR NA LIVE</button></div><div class="info"><b>@${p.owner}</b> 🔴 AO VIVO<div>${p.desc}</div></div></div>`;}let media=p.tipo==="video"?`<video src="${p.img}" loop playsinline preload="metadata" muted></video><div class="btnSom"><i class="fa-solid fa-volume-xmark"></i></div>`:`<div style="width:100%;height:100%;background:url('${p.img}') center/cover no-repeat"></div>`;let comQtd=p.comentarios?p.comentarios.length:0;let curt=p.likedBy?p.likedBy.length:0;return `<div class="post" onclick="toggleSom(this)">${media}<div class="watermark">work influencer • GLOBAL</div><div class="rightBar"><button class="btnTik" onclick="event.stopPropagation();curtirGlobal('${p.id}',this)"><div class="iconTik heart ${p.likedBy&&p.likedBy.includes(uid)?'on':''}"><i class="${p.likedBy&&p.likedBy.includes(uid)?'fa-solid':'fa-regular'} fa-heart"></i></div><div class="txtTik">${curt}<br>Curtir</div></button><button class="btnTik" onclick="event.stopPropagation();abrirCom('${p.id}')"><div class="iconTik"><i class="fa-regular fa-comment-dots"></i></div><div class="txtTik">${comQtd}<br>Comen</div></button><button class="btnTik" onclick="event.stopPropagation();abrirCom('${p.id}')"><div class="iconTik"><i class="fa-solid fa-share"></i></div><div class="txtTik">Compar</div></button></div><div class="info"><b>@${p.owner}</b> 🔊 Toque centro<div>${p.desc||''}</div><div style="color:#00ff88;font-size:10px;margin-top:4px">💬 ${comQtd} comentários globais - clique</div></div></div>`;}).join("");setTimeout(()=>setupObserver(),300);}
function toggleSom(el){let v=el.querySelector('video');if(!v)return;pausarTodosExceto(v);videoAtivo=v;v.muted=false;v.play().catch(()=>{});let b=el.querySelector('.btnSom');if(b)b.style.display='none';}
window.abrirCom=(id)=>{comAtivo=id;document.getElementById("comDrawer").classList.add("show");renderComs(id);};
window.closeCom=()=>{document.getElementById("comDrawer").classList.remove("show");comAtivo=null;};
function renderComs(id){let p=posts.find(x=>x.id===id);let el=document.getElementById("comList");let cnt=document.getElementById("comCount");if(!p){el.innerHTML="";return;}let coms=p.comentarios||[];cnt.innerText=coms.length+" comentários globais";if(coms.length===0){el.innerHTML=`<div style="text-align:center;padding:40px;color:#666">Nenhum comentário global ainda<br>Seja o primeiro! 💬</div>`;return;}el.innerHTML=coms.slice().reverse().map(c=>`<div class="comItem"><div class="comAva">${c.usuario.charAt(0).toUpperCase()}</div><div><div class="comUser">@${c.usuario}</div><div class="comText">${c.texto.replace(/</g,"&lt;")}</div></div></div>`).join("");}
window.enviarComGlobal=async()=>{let inp=document.getElementById("comInput");let txt=inp.value.trim();if(!txt||!comAtivo)return;if(!userNome){alert("Cadastro em Eu!");go(4);return;}try{await window.fFuncs.updateDoc(window.fFuncs.doc(window.db,"posts",comAtivo),{comentarios: window.fFuncs.arrayUnion({usuario:userNome,texto:txt,time:Date.now()})});inp.value="";toast("✅ Comentário global!");}catch(e){alert(e.message);}};
window.curtirGlobal=async(id)=>{try{let p=posts.find(x=>x.id===id);let ja=p.likedBy&&p.likedBy.includes(uid);await window.fFuncs.updateDoc(window.fFuncs.doc(window.db,"posts",id),{likedBy: ja? window.fFuncs.arrayRemove(uid): window.fFuncs.arrayUnion(uid)});}catch(e){}};
async function startCam(mode){facing=mode;try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},audio:{echoCancellation:true,noiseSuppression:true}});let v=document.getElementById("camVideo");v.srcObject=stream;if(facing==="user")v.classList.add("mirror");else v.classList.remove("mirror");document.getElementById("camBox").style.display="block";document.getElementById("camOff").style.display="none";document.getElementById("previewArea").classList.remove("show");document.getElementById("btnPostar").classList.remove("show");}catch(e){alert("Câmera precisa HTTPS: "+e.message);}}
function toggleRec(){if(!recording)startRec();else stopRec();}
function startRec(){if(!stream){alert("Abra câmera");return;}chunks=[];try{recorder=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9'});}catch(e){recorder=new MediaRecorder(stream);}recorder.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data);};recorder.onstop=()=>{let blob=new Blob(chunks,{type:'video/webm'});tempBlob=blob;let url=URL.createObjectURL(blob);let pv=document.getElementById("previewVideo");pv.src=url;pv.muted=false;document.getElementById("previewArea").classList.add("show");document.getElementById("btnPostar").classList.add("show");};recorder.start(200);recording=true;document.getElementById("btnRec").classList.add("stop");document.getElementById("btnRec").innerHTML='<i class="fa-solid fa-stop"></i>';sec=0;timerInt=setInterval(()=>{sec++;let m=String(Math.floor(sec/60)).padStart(2,'0');let s=String(sec%60).padStart(2,'0');document.getElementById("timer").innerText=`${m}:${s} / 01:30 🔊`;if(sec>=90)stopRec();},1000);}
function stopRec(){try{if(recorder&&recording)recorder.stop();}catch(e){}recording=false;let b=document.getElementById("btnRec");if(b){b.classList.remove("stop");b.innerHTML='<i class="fa-solid fa-circle"></i>';}clearInterval(timerInt);}
window.postarGlobal=async()=>{if(!userNome){alert("Vai em Eu e salva nome!");go(4);return;}let file=document.getElementById("file").files[0]||tempBlob;if(!file)return alert("Grave vídeo ou escolha arquivo!");let btn=document.getElementById("btnPostar");btn.innerText="ENVIANDO GLOBAL...";try{let storageRef=window.fFuncs.ref(window.storage,'videos/'+Date.now()+'_'+(file.name||'video.webm'));await window.fFuncs.uploadBytes(storageRef,file);let url=await window.fFuncs.getDownloadURL(storageRef);await window.fFuncs.addDoc(window.fFuncs.collection(window.db,"posts"),{owner:userNome,img:url,tipo:file.type&&file.type.startsWith('image')?'image':'video',desc:document.getElementById("desc").value||"Meu vídeo global 🔥",time:Date.now(),likedBy:[],comentarios:[],isLive:false,liveAtivo:false});alert("✅ POSTADO GLOBAL! Todo mundo vê!");closeAll();document.getElementById("desc").value="";document.getElementById("file").value="";tempBlob=null;document.getElementById("previewArea").classList.remove("show");btn.classList.remove("show");}catch(e){alert("Erro: "+e.message);}btn.innerText="🚀 POSTAR GLOBAL - TODOS VEEM";};
window.iniciarLiveGlobal=async()=>{if(!userNome){alert("Cadastro em Eu!");go(4);return;}try{await window.fFuncs.addDoc(window.fFuncs.collection(window.db,"posts"),{owner:userNome,img:"",desc:"🔴 LIVE GLOBAL AO VIVO! Comente!",time:Date.now(),isLive:true,liveAtivo:true,likedBy:[],comentarios:[]});document.getElementById("liveStatus").innerText="🔴 VOCÊ ESTÁ AO VIVO GLOBAL - TODOS VEEM!";toast("🔴 LIVE GLOBAL ATIVA!");}catch(e){alert(e.message);}};
window.encerrarLiveGlobal=async()=>{let lives=posts.filter(p=>p.owner===userNome&&p.isLive&&p.liveAtivo);for(let l of lives){await window.fFuncs.updateDoc(window.fFuncs.doc(window.db,"posts",l.id),{liveAtivo:false});}document.getElementById("liveStatus").innerText="Live encerrada";toast("Live encerrada");};
document.getElementById("file").addEventListener("change",e=>{let f=e.target.files[0];if(!f)return;tempBlob=f;let url=URL.createObjectURL(f);let pv=document.getElementById("previewVideo");pv.src=url;if(f.type.startsWith('video')){pv.style.display='block';}document.getElementById("previewArea").classList.add("show");document.getElementById("btnPostar").classList.add("show");});
function salvarTudo(){let n=document.getElementById("nomeUser").value.trim().replace(/@/g,"").toLowerCase();if(!n)return alert("Digite nome!");userNome=n;localStorage.setItem("userNome",n);document.getElementById("nomeShow").innerText="@"+n;alert("✅ Você entrou no GLOBAL! Agora pode postar, fazer live e comentar!");go(0);}
function go(n){document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("on"));document.getElementById("b"+n).classList.add("on");document.querySelectorAll(".page").forEach(p=>p.classList.remove("show"));if(n==2)document.getElementById("pCriar").classList.add("show");if(n==3)document.getElementById("pLive").classList.add("show");if(n==4)document.getElementById("pEu").classList.add("show");}
function closeAll(){document.querySelectorAll(".page").forEach(p=>p.classList.remove("show"));document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("on"));document.getElementById("b0").classList.add("on");if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}document.getElementById("camBox").style.display="none";document.getElementById("camOff").style.display="block";}
document.getElementById("nomeUser").value=userNome;if(userNome)document.getElementById("nomeShow").innerText="@"+userNome;
</script>
</body>
</html>
