<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WORK FIRE - COMENTÁRIOS CORRIGIDO</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100dvh;background:#000;overflow:hidden;font-family:-apple-system,sans-serif}
#app{width:100%;max-width:420px;height:100dvh;margin:0 auto;background:#000;display:flex;flex-direction:column;position:relative}
#feed{flex:1;overflow-y:scroll;scroll-snap-type:y mandatory}
#feed::-webkit-scrollbar{display:none}
.post{height:100dvh;width:100%;position:relative;scroll-snap-align:start;background:#111 center/cover no-repeat;flex-shrink:0}
.post video{width:100%;height:100%;object-fit:cover}
.post::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 15%,rgba(0,0,0,.15) 50%,rgba(0,0,0,.92) 100%);pointer-events:none;z-index:1}
.rightBar{position:absolute;right:6px;bottom:95px;z-index:10;display:flex;flex-direction:column;gap:14px;width:68px}
.btnTik{border:none;background:none;display:flex;flex-direction:column;align-items:center;cursor:pointer;width:100%}
.iconTik{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;background:rgba(35,35,35,.75);border:1.5px solid rgba(255,255,255,.18);backdrop-filter:blur(12px)}
.iconTik.fire{background:radial-gradient(circle at 30% 25%,#ff8c00,#ff4500 55%,#8b0000);border-color:#ff8c00}
.iconTik.fire.on{box-shadow:0 0 20px #ff4500;transform:scale(1.12)}
.iconTik.heart.on{background:#ff1844;transform:scale(1.12)}
.iconTik.save.on{background:#ffcc00;color:#000}
.txtTik{color:#fff;font-size:9px;font-weight:800;margin-top:4px;text-shadow:0 1px 8px #000;text-align:center;line-height:10px}
.info{position:absolute;left:10px;right:80px;bottom:84px;z-index:10;background:rgba(0,0,0,.48);border:1px solid rgba(255,69,0,.22);border-radius:12px;padding:10px 11px;backdrop-filter:blur(12px)}
.info b{color:#fff;font-size:12px}
.info div{color:#ddd;font-size:12px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav{height:66px;min-height:66px;background:#0a0700;border-top:1.5px solid rgba(255,69,0,.35);display:flex;align-items:center;justify-content:space-around;z-index:30;flex-shrink:0}
.nav button{flex:1;background:none;border:none;color:rgba(255,255,255,.5);font-size:9px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button.on{color:#ff8c00}
.nav button i{font-size:18px}
.plus{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#ff8c00,#ff2200);border:2.5px solid #fff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;margin-top:-22px;box-shadow:0 0 0 4px #000}
.page{position:absolute;inset:0;background:#000;z-index:20;display:none;flex-direction:column;overflow-y:auto}
.page.show{display:flex}
.card{background:rgba(25,12,0,.92);border:1px solid rgba(255,69,0,.22);border-radius:12px;padding:12px;margin:10px}
.input{width:100%;padding:11px;background:#1e1100;border:1px solid rgba(255,69,0,.32);border-radius:10px;color:#fff;margin-top:7px;font-size:13px}
.btn{width:100%;padding:12px;background:linear-gradient(90deg,#ff4500,#ff8c00);border:none;border-radius:10px;color:#000;font-weight:900;margin-top:10px;font-size:12px}
.avatar{width:88px;height:88px;border-radius:50%;border:3px solid #ff8c00;background:radial-gradient(circle at 30% 30%,#ff7a00,#7a0000);margin:0 auto;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:32px;position:relative;cursor:pointer}
.avatar img{width:100%;height:100%;object-fit:cover}
.cam{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.78);color:#ffcc00;font-size:7px;font-weight:900;text-align:center;padding:4px}
.btnDel{background:rgba(255,0,0,.12);border:1px solid rgba(255,0,0,.35);color:#ff4444;width:100%;padding:11px;border-radius:10px;font-weight:900;margin-top:8px;font-size:11px}

/* CORREÇÃO - GAVETA DE COMENTÁRIOS ESTILO TIKTOK */
#comDrawer{position:absolute;inset:0;z-index:50;display:none;flex-direction:column;justify-content:flex-end;background:rgba(0,0,0,.5)}
#comDrawer.show{display:flex}
.comSheet{width:100%;max-width:420px;margin:0 auto;background:#121212;border-radius:18px 18px 0 0;max-height:72vh;display:flex;flex-direction:column;border-top:1.5px solid rgba(255,69,0,.3);animation:up.25s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.comHead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0}
.comHead b{color:#fff;font-size:14px}
.comHead span{color:#888;font-size:12px}
.comHead button{background:rgba(255,255,255,.12);border:none;color:#fff;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.comList{flex:1;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:12px}
.comList::-webkit-scrollbar{display:none}
.comItem{display:flex;gap:10px;align-items:flex-start}
.comAva{width:32px;height:32px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ff7a00,#7a0000);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;overflow:hidden}
.comAva img{width:100%;height:100%;object-fit:cover}
.comBody{flex:1}
.comUser{color:#888;font-size:11px;font-weight:800}
.comText{color:#fff;font-size:13px;margin-top:2px;line-height:16px;word-break:break-word}
.comTime{color:#555;font-size:10px;margin-top:3px}
.comInputBar{display:flex;gap:8px;padding:10px 12px;border-top:1px solid rgba(255,255,255,.08);background:#121212;flex-shrink:0;align-items:center}
.comInputBar input{flex:1;padding:10px 14px;background:#1e1e1e;border:1px solid rgba(255,255,255,.12);border-radius:20px;color:#fff;font-size:13px;outline:none}
.comInputBar input:focus{border-color:#ff4500}
.comInputBar button{width:38px;height:38px;border-radius:50%;border:none;background:#ff4500;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.comEmpty{color:#555;text-align:center;padding:30px 0;font-size:13px}
</style>
</head>
<body>
<div id="app">
<div id="feed"></div>

<!-- GAVETA DE COMENTÁRIOS - CORREÇÃO DO SEU PRINT -->
<div id="comDrawer" onclick="if(event.target===this)closeCom()">
<div class="comSheet">
<div class="comHead">
<div><b id="comCount">0 comentários</b> <span style="color:#666;font-weight:400;margin-left:6px">💬</span></div>
<button onclick="closeCom()"><i class="fa-solid fa-xmark"></i></button>
</div>
<div id="comList" class="comList"></div>
<div class="comInputBar">
<input id="comInput" placeholder="Adicionar comentário..." onkeypress="if(event.key==='Enter')sendCom()">
<button onclick="sendCom()"><i class="fa-solid fa-paper-plane"></i></button>
</div>
</div>
</div>

<div id="pBusca" class="page"><div style="display:flex;justify-content:space-between;padding:14px"><h3 style="color:#ff4500">Busca</h3><button onclick="closeAll()" style="background:rgba(255,255,255,.12);border:none;color:#fff;width:32px;height:32px;border-radius:50%">✕</button></div><div class="card"><input id="qBusca" class="input" placeholder="Buscar..." oninput="busca()"><div id="rBusca" style="margin-top:10px"></div></div></div>
<div id="pCriar" class="page"><div style="display:flex;justify-content:space-between;padding:14px"><h3 style="color:#ff4500">Criar</h3><button onclick="closeAll()" style="background:rgba(255,255,255,.12);border:none;color:#fff;width:32px;height:32px;border-radius:50%">✕</button></div><div class="card"><input id="file" type="file" accept="image/*,video/*" style="color:#fff;width:100%"><img id="prev" style="width:100%;margin-top:10px;border-radius:12px;display:none"><video id="prevV" style="width:100%;margin-top:10px;border-radius:12px;display:none" controls playsinline></video><input id="desc" class="input" placeholder="Legenda..."><button class="btn" onclick="postar()">POSTAR</button></div></div>
<div id="pLive" class="page"><div style="display:flex;justify-content:space-between;padding:14px"><h3 style="color:#ff4500">Live R$5/dia</h3><button onclick="closeAll()" style="background:rgba(255,255,255,.12);border:none;color:#fff;width:32px;height:32px;border-radius:50%">✕</button></div><div id="liveBloq" class="card" style="text-align:center;border-color:#ffcc00"><b style="color:#ffcc00">Live bloqueada</b><div id="pixKey" style="background:#000;padding:10px;border-radius:8px;margin:10px 0;font-size:11px;color:#fff;word-break:break-all">Configure no Admin</div><button class="btn" style="background:#ffcc00;color:#000" onclick="pagarPix()">JÁ PAGUEI</button></div><div id="liveOk" class="card" style="display:none;border-color:#00ff88;text-align:center"><b style="color:#00ff88">✅ Live liberada hoje</b><div style="color:#888;font-size:11px;margin-top:6px">Comentários ao vivo já funcionam!</div></div></div>
<div id="pEu" class="page"><div style="display:flex;justify-content:space-between;padding:14px;align-items:center"><b style="color:#ff4500">Eu</b><div style="display:flex;gap:8px"><button onclick="abrirAdmin()" style="background:#ffcc00;border:none;padding:8px 14px;border-radius:20px;font-weight:900;font-size:11px;color:#000">ADMIN</button><button onclick="closeAll()" style="background:rgba(255,255,255,.12);border:none;color:#fff;width:32px;height:32px;border-radius:50%">✕</button></div></div><div class="card" style="border:1.5px solid #ff8c00;text-align:center"><div style="color:#ff8c00;font-weight:900;font-size:13px">👤 MEU CADASTRO</div><input id="fotoPerfil" type="file" accept="image/*" hidden onchange="trocarFoto(this)"><div class="avatar" onclick="document.getElementById('fotoPerfil').click()"><div id="avatarBox">🔥</div><div class="cam">📷 FOTO</div></div><input id="nomeUser" class="input" placeholder="Seu nome" style="text-align:center;font-weight:900;color:#ff8c00"><input id="apelidoUser" class="input" placeholder="Apelido" style="text-align:center"><button class="btn" onclick="salvarTudo()">💾 SALVAR</button><button class="btnDel" onclick="apagarCadastro()">🗑️ APAGAR CADASTRO</button><div id="nomeShow" style="color:#ff8c00;font-size:12px;margin-top:8px;font-weight:900"></div><div style="color:#333;font-size:8px;margin-top:4px">ID: <span id="uidShow"></span></div></div><div id="adminBox" style="display:none" class="card"><h4 style="color:#ffcc00">⚙️ Admin</h4><input id="pixChave" class="input" placeholder="Chave Pix"><button class="btn" style="background:#00ff88;color:#000" onclick="salvarPix()">SALVAR PIX</button><div style="height:1px;background:rgba(255,69,0,.2);margin:12px 0"></div><label style="color:#ffcc00;font-size:10px;font-weight:900">PROPAGANDA</label><input id="adTxt" class="input" placeholder="Texto propaganda"><div style="display:flex;gap:8px;margin-top:8px"><input id="adFreq" type="number" value="3" class="input" style="margin:0;width:60px"><label style="color:#fff;font-size:11px"><input type="checkbox" id="adOn"> Ativar</label></div><button class="btn" style="background:#ffcc00;color:#000" onclick="salvarAd()">SALVAR PROPAGANDA</button></div><div class="card"><b style="color:#ff8c00">🔖 Salvos</b><div id="listaSalvos"></div></div><div class="card"><b style="color:#ff8c00">🎬 Meus vídeos</b><div id="meusVideos"></div></div></div>

<div class="nav">
<button id="b0" class="on" onclick="go(0)"><i class="fa-solid fa-house"></i><span>Inicio</span></button>
<button id="b1" onclick="go(1)"><i class="fa-solid fa-magnifying-glass"></i><span>Busca</span></button>
<button id="b2" onclick="go(2)"><div class="plus"><i class="fa-solid fa-plus"></i></div></button>
<button id="b3" onclick="go(3)"><i class="fa-solid fa-tower-broadcast"></i><span>Live</span></button>
<button id="b4" onclick="go(4)"><i class="fa-solid fa-user"></i><span>Eu</span></button>
</div>
</div>

<script>
let uid=localStorage.getItem("uid")||"u_"+Math.random().toString(36).slice(2,7);localStorage.setItem("uid",uid);
let userFoto=localStorage.getItem("userFoto")||"",userNome=localStorage.getItem("userNome")||"",userApelido=localStorage.getItem("userApelido")||"";
let posts=JSON.parse(localStorage.getItem("posts_comFix")||"null")||[{owner:"fire.influencer",img:"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=700",desc:"Comentários corrigidos - agora gaveta TikTok 🔥",firedBy:[],likedBy:[],com:[{u:"ana",t:"Top demais! 🔥",time:Date.now()-60000},{u:"fire.fan",t:"Amei o vídeo ❤️",time:Date.now()-30000}],saveBy:[],sharedBy:[],share:1,isTop:true,type:"img"}];
let temp="",tempType="img",cfg=JSON.parse(localStorage.getItem("cfg_comFix")||"null")||{pixK:"Configure no Admin",adT:"🔥 Oferta!",adF:3,adOn:false};
let comIdx=null;

function save(){localStorage.setItem("posts_comFix",JSON.stringify(posts));render();}
function saveCfg(){localStorage.setItem("cfg_comFix",JSON.stringify(cfg));render();}
function salvarTudo(){let n=document.getElementById("nomeUser").value.trim().replace(/@/g,"").replace(/\s/g,"").toLowerCase();let a=document.getElementById("apelidoUser").value.trim();if(!n){alert("Digite seu nome");return;}userNome=n;userApelido=a;localStorage.setItem("userNome",n);localStorage.setItem("userApelido",a);render();alert("✅ Salvo @"+n);}
function apagarCadastro(){if(!confirm("Apagar cadastro?"))return;userFoto="";userNome="";userApelido="";localStorage.removeItem("userFoto");localStorage.removeItem("userNome");localStorage.removeItem("userApelido");document.getElementById("avatarBox").innerHTML="🔥";document.getElementById("nomeUser").value="";document.getElementById("apelidoUser").value="";render();alert("🗑️ Apagado");}
function trocarFoto(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{userFoto=e.target.result;localStorage.setItem("userFoto",userFoto);document.getElementById("avatarBox").innerHTML=`<img src="${userFoto}">`;render();};r.readAsDataURL(f);}

// CORREÇÃO - ABRE GAVETA EM VEZ DE PROMPT
function openCom(idx){
comIdx=idx;
let p=posts[idx];
document.getElementById("comCount").innerText=p.com.length+" comentários";
renderComList();
document.getElementById("comDrawer").classList.add("show");
setTimeout(()=>document.getElementById("comInput").focus(),300);
}
function closeCom(){
document.getElementById("comDrawer").classList.remove("show");
comIdx=null;
}
function renderComList(){
let list=document.getElementById("comList");
if(comIdx===null)return;
let p=posts[comIdx];
if(p.com.length===0){list.innerHTML=`<div class="comEmpty">Seja o primeiro a comentar! 💬</div>`;return;}
list.innerHTML=p.com.slice().reverse().map(c=>{
let ago=getAgo(c.time);
return `<div class="comItem"><div class="comAva">${userFoto&&c.u===userNome?`<img src="${userFoto}">`:c.u.charAt(0).toUpperCase()}</div><div class="comBody"><div class="comUser">@${c.u} • ${ago}</div><div class="comText">${escapeHtml(c.t)}</div></div></div>`;
}).join("");
}
function getAgo(t){
if(!t)return "agora";
let d=Math.floor((Date.now()-t)/1000);
if(d<60)return "agora";
if(d<3600)return Math.floor(d/60)+"m";
if(d<86400)return Math.floor(d/3600)+"h";
return Math.floor(d/86400)+"d";
}
function escapeHtml(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function sendCom(){
let inp=document.getElementById("comInput");
let txt=inp.value.trim();
if(!txt){return;}
if(comIdx===null){return;}
if(!userNome){alert("Faça cadastro em Eu primeiro!");go(4);closeCom();return;}
posts[comIdx].com.push({u:userNome,t:txt,time:Date.now()});
inp.value="";
save();
renderComList();
}

function render(){
let list=[...posts].sort((a,b)=>(b.isTop?1:0)-(a.isTop?1:0));let feed=[];list.forEach((p,i)=>{feed.push(p);if(cfg.adOn&&cfg.adT&&(i+1)%cfg.adF===0)feed.push({ad:true});});
document.getElementById("feed").innerHTML=feed.map(p=>{
if(p.ad) return `<div class="post" style="background:linear-gradient(135deg,#1e1800,#332200);border:2px solid #ffcc00;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px"><span style="background:#ffcc00;color:#000;padding:4px 12px;border-radius:20px;font-size:10px;font-weight:900">ANÚNCIO</span><b style="color:#ffcc00;font-size:15px;text-align:center;padding:0 20px">${cfg.adT}</b></div>`;
let idx=posts.indexOf(p);let fired=p.firedBy.includes(uid),liked=p.likedBy.includes(uid),saved=p.saveBy.includes(uid);
let media=p.type==="video"?`<video src="${p.img}" autoplay muted loop playsinline style="width:100%;height:100%;object-fit:cover"></video>`:`<div style="width:100%;height:100%;background:url('${p.img}') center/cover no-repeat"></div>`;
return `<div class="post">${media}<div class="rightBar"><button class="btnTik" onclick="fire(${idx})"><div class="iconTik fire ${fired?'on':''}"><i class="fa-solid fa-fire"></i></div><div class="txtTik">${p.firedBy.length}<br>Chamas</div></button><button class="btnTik" onclick="like(${idx})"><div class="iconTik heart ${liked?'on':''}"><i class="${liked?'fa-solid':'fa-regular'} fa-heart"></i></div><div class="txtTik">${p.likedBy.length}<br>Curtir</div></button><button class="btnTik" onclick="openCom(${idx})"><div class="iconTik"><i class="fa-regular fa-comment-dots"></i></div><div class="txtTik">${p.com.length}<br>Comen</div></button><button class="btnTik" onclick="shareP(${idx})"><div class="iconTik"><i class="fa-solid fa-share"></i></div><div class="txtTik">${p.sharedBy.length||p.share||0}<br>Compar</div></button><button class="btnTik" onclick="saveP(${idx})"><div class="iconTik save ${saved?'on':''}"><i class="${saved?'fa-solid':'fa-regular'} fa-bookmark"></i></div><div class="txtTik">Salvar</div></button></div><div class="info"><b>@${p.owner}</b><div>${p.desc}</div></div></div>`;
}).join("");
document.getElementById("listaSalvos").innerHTML=posts.filter(p=>p.saveBy.includes(uid)).map(p=>`<div style="display:flex;gap:8px;margin-top:8px;background:rgba(255,255,255,.04);padding:6px;border-radius:8px"><img src="${p.img}" style="width:42px;height:42px;border-radius:8px"><div style="color:#fff;font-size:11px">${p.desc}</div></div>`).join("")||"<div style='color:#555;font-size:11px'>Nenhum</div>";
let meus=posts.filter(p=>p.owner===(userNome||"")&&p.owner!=="fire.influencer");document.getElementById("meusVideos").innerHTML=meus.map(p=>`<div style="display:flex;gap:8px;margin-top:8px;background:rgba(255,255,255,.04);padding:6px;border-radius:8px"><img src="${p.img}" style="width:42px;height:42px;border-radius:8px"><div style="color:#fff;font-size:11px">${p.desc}</div></div>`).join("")||"<div style='color:#555;font-size:11px'>Nenhum vídeo</div>";
document.getElementById("pixKey").innerText=cfg.pixK;document.getElementById("pixChave").value=cfg.pixK!=="Configure no Admin"?cfg.pixK:"";document.getElementById("adTxt").value=cfg.adT;document.getElementById("adFreq").value=cfg.adF;document.getElementById("adOn").checked=cfg.adOn;
document.getElementById("uidShow").innerText=uid;document.getElementById("nomeUser").value=userNome;document.getElementById("apelidoUser").value=userApelido;document.getElementById("nomeShow").innerText=userNome?"@"+userNome:"@fire.user";if(userFoto)document.getElementById("avatarBox").innerHTML=`<img src="${userFoto}">`;else document.getElementById("avatarBox").innerHTML="🔥";
}
function fire(i){let p=posts[i];if(p.firedBy.includes(uid))p.firedBy=p.firedBy.filter(x=>x!==uid);else p.firedBy.push(uid);save();}
function like(i){let p=posts[i];if(p.likedBy.includes(uid))p.likedBy=p.likedBy.filter(x=>x!==uid);else p.likedBy.push(uid);save();}
function saveP(i){let p=posts[i];if(p.saveBy.includes(uid))p.saveBy=p.saveBy.filter(x=>x!==uid);else p.saveBy.push(uid);save();}
function shareP(i){if(!posts[i].sharedBy.includes(uid)){posts[i].sharedBy.push(uid);save();}window.open("https://wa.me/?text="+encodeURIComponent(location.href),"_blank");}
function go(n){closeCom();document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("on"));document.getElementById("b"+n).classList.add("on");document.querySelectorAll(".page").forEach(p=>p.classList.remove("show"));if(n==1)document.getElementById("pBusca").classList.add("show");if(n==2)document.getElementById("pCriar").classList.add("show");if(n==3)document.getElementById("pLive").classList.add("show");if(n==4)document.getElementById("pEu").classList.add("show");}
function closeAll(){closeCom();document.querySelectorAll(".page").forEach(p=>p.classList.remove("show"));document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("on"));document.getElementById("b0").classList.add("on");}
function abrirAdmin(){let s=prompt("Senha Admin:");if(s==="fire123")document.getElementById("adminBox").style.display="block";else if(s)alert("Senha: fire123");}
function salvarPix(){let k=document.getElementById("pixChave").value.trim();if(!k)return alert("Digite Pix");cfg.pixK=k;saveCfg();alert("Pix salvo!");}
function salvarAd(){cfg.adT=document.getElementById("adTxt").value.trim();cfg.adF=parseInt(document.getElementById("adFreq").value)||3;cfg.adOn=document.getElementById("adOn").checked;saveCfg();alert(cfg.adOn?"✅ Ativada":"❌ Desativada");}
function pagarPix(){localStorage.setItem("livePago",new Date().toDateString());render();alert("✅ Liberada!");}
function busca(){let q=document.getElementById("qBusca").value.toLowerCase();let r=posts.filter(p=>p.desc.toLowerCase().includes(q));document.getElementById("rBusca").innerHTML=r.map(p=>`<div style="display:flex;gap:8px;margin-top:8px;background:rgba(255,255,255,.05);padding:6px;border-radius:8px"><img src="${p.img}" style="width:40px;height:40px;border-radius:8px"><div style="color:#fff;font-size:11px">${p.desc}</div></div>`).join("")||"<div style='color:#555'>Nada</div>";}
document.getElementById("file").addEventListener("change",e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=ev=>{temp=ev.target.result;if(f.type.startsWith("video")){tempType="video";document.getElementById("prevV").src=temp;document.getElementById("prevV").style.display="block";document.getElementById("prev").style.display="none";}else{tempType="img";document.getElementById("prev").src=temp;document.getElementById("prev").style.display="block";document.getElementById("prevV").style.display="none";}};r.readAsDataURL(f);});
function postar(){let d=document.getElementById("desc").value.trim()||"Meu vídeo 🔥";if(!temp)return alert("Escolha foto/vídeo");if(!userNome){alert("Faça cadastro em Eu!");go(4);return;}posts.unshift({owner:userNome,img:temp,desc:d,firedBy:[],likedBy:[],com:[],saveBy:[],sharedBy:[],share:0,isTop:false,type:tempType});temp="";document.getElementById("prev").style.display="none";document.getElementById("prevV").style.display="none";document.getElementById("desc").value="";save();closeAll();}
render();
</script>
</body>
</html>
