<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WORK FIRE - SOM + SEM TRAVAR</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100dvh;background:#000;overflow:hidden;font-family:-apple-system,sans-serif}
#app{width:100%;max-width:420px;height:100dvh;margin:0 auto;background:#000;display:flex;flex-direction:column;position:relative}
#feed{flex:1;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch}
#feed::-webkit-scrollbar{display:none}
.post{height:100dvh;width:100%;position:relative;scroll-snap-align:start;background:#111;flex-shrink:0;overflow:hidden;contain:layout style paint}
.post video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
.post::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 20%,rgba(0,0,0,.2) 60%,rgba(0,0,0,.9) 100%);pointer-events:none;z-index:1}
.rightBar{position:absolute;right:8px;bottom:90px;z-index:10;display:flex;flex-direction:column;gap:12px;width:60px}
.btnTik{border:none;background:none;display:flex;flex-direction:column;align-items:center;cursor:pointer;width:100%}
.iconTik{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;background:rgba(35,35,35,.85);border:1.5px solid rgba(255,255,255,.18)}
.iconTik.fire{background:radial-gradient(circle at 30% 25%,#ff8c00,#ff4500 55%,#8b0000);border-color:#ff8c00}
.iconTik.fire.on{background:#ff4500;box-shadow:0 0 18px #ff4500}
.txtTik{color:#fff;font-size:8.5px;font-weight:800;margin-top:3px;text-shadow:0 1px 6px #000;text-align:center}
.info{position:absolute;left:10px;right:76px;bottom:82px;z-index:10;background:rgba(0,0,0,.55);border:1px solid rgba(255,69,0,.22);border-radius:12px;padding:9px 10px}
.info b{color:#fff;font-size:11px}
.info div{color:#ddd;font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{height:64px;min-height:64px;background:#0a0700;border-top:1.5px solid rgba(255,69,0,.35);display:flex;align-items:center;justify-content:space-around;z-index:30;flex-shrink:0}
.nav button{flex:1;background:none;border:none;color:rgba(255,255,255,.5);font-size:8.5px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button.on{color:#ff8c00}
.nav button i{font-size:18px}
.plus{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#ff8c00,#ff2200);border:2.5px solid #fff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;margin-top:-20px;box-shadow:0 0 0 4px #000}
.page{position:absolute;inset:0;background:#000;z-index:20;display:none;flex-direction:column;overflow-y:auto;padding-bottom:70px}
.page.show{display:flex}
.card{background:rgba(25,12,0,.92);border:1px solid rgba(255,69,0,.22);border-radius:12px;padding:12px;margin:10px}
.input{width:100%;padding:11px;background:#1e1100;border:1px solid rgba(255,69,0,.32);border-radius:10px;color:#fff;margin-top:7px;font-size:13px}
.btn{width:100%;padding:14px;background:linear-gradient(90deg,#ff4500,#ff8c00);border:none;border-radius:12px;color:#000;font-weight:900;margin-top:10px;font-size:13px;cursor:pointer}
.camBox{position:relative;width:100%;height:42vh;background:#000;border-radius:14px;overflow:hidden;border:2px solid #00ff88;margin-top:10px}
.camBox video{width:100%;height:100%;object-fit:cover}
.camBox video.mirror{transform:scaleX(-1)}
.timerCam{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#00ff88;color:#000;padding:5px 14px;border-radius:20px;font-weight:900;font-size:13px;z-index:5}
.ctrlCam{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:20px;z-index:5;align-items:center}
.circ{width:68px;height:68px;border-radius:50%;border:4px solid #fff;background:#ff0000;display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;cursor:pointer}
.circ.stop{background:#fff;color:#ff0000}
.previewArea{display:none;margin-top:10px;border:3px solid #00ff88;border-radius:14px;overflow:hidden;background:#000;position:relative}
.previewArea.show{display:block}
.btnPostar{width:100%;padding:16px;background:linear-gradient(90deg,#00ff88,#00ff44);border:3px solid #fff;border-radius:14px;color:#000;font-weight:900;font-size:15px;margin-top:10px;display:none;box-shadow:0 0 15px rgba(0,255,136,.6)}
.btnPostar.show{display:block}
/* FIX SOM + TRAVAMENTO */
.volBtn{position:absolute;left:12px;bottom:26px;z-index:20;width:44px;height:44px;border-radius:50%;background:#00ff88;border:2.5px solid #fff;color:#000;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;box-shadow:0 0 12px #00ff88}
.volBtn.off{background:#ff0000;color:#fff;animation:pulseVol 1s infinite}
.tapSom{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#00ff88;color:#000;padding:12px 20px;border-radius:30px;font-weight:900;font-size:13px;z-index:25;box-shadow:0 0 15px #00ff88}
@keyframes pulseVol{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
</style>
</head>
<body>
<div id="app">
<div id="feed"></div>

<div id="pCriar" class="page">
<div style="display:flex;justify-content:space-between;padding:14px"><h3 style="color:#00ff88">✅ SOM + SEM TRAVAR</h3><button onclick="closeAll();stopCam()" style="background:rgba(255,255,255,.12);border:none;color:#fff;width:32px;height:32px;border-radius:50%">✕</button></div>
<div class="card" style="border:2px solid #00ff88">
<div style="background:#00ff88;color:#000;padding:7px;border-radius:8px;text-align:center;font-weight:900;font-size:11px">✅ AUTO CORRIGIDO: ÁUDIO + NÃO TRAVA</div>
<div class="camBox" id="camBox" style="display:none"><div id="timer" class="timerCam">00:00 / 01:30 🔊 COM SOM</div><video id="camVideo" autoplay muted playsinline class="mirror"></video><div class="ctrlCam"><div id="btnRec" class="circ" onclick="toggleRec()"><i class="fa-solid fa-circle"></i></div></div></div>
<div id="camOff" style="text-align:center;padding:16px;background:#111;border-radius:12px;border:2px solid #00ff88;margin-top:10px"><i class="fa-solid fa-volume-high" style="font-size:28px;color:#00ff88"></i><div style="color:#fff;font-size:12px;margin-top:6px;font-weight:900">SOM + LEVE CORRIGIDO AUTO 🔊</div><div style="color:#00ff88;font-size:10px">Só 1 vídeo toca • Áudio real</div><button class="btn" onclick="startCam('user')" style="margin-top:10px;background:#00ff88;color:#000">ABRIR CÂMERA COM SOM</button></div>
<div id="previewArea" class="previewArea"><video id="previewVideo" style="width:100%;height:38vh;object-fit:cover;display:block" controls playsinline loop></video></div>
<button id="btnPostar" class="btnPostar" onclick="postar()">🚀 POSTAR COM SOM 🔊</button>
<input id="file" type="file" accept="video/*" style="color:#fff;width:100%;margin-top:10px"><input id="desc" class="input" placeholder="Legenda...">
</div></div>

<div class="nav"><button id="b0" class="on" onclick="go(0)"><i class="fa-solid fa-house"></i><span>Inicio</span></button><button id="b1"><i class="fa-solid fa-magnifying-glass"></i><span>Busca</span></button><button id="b2" onclick="go(2)"><div class="plus"><i class="fa-solid fa-plus"></i></div></button><button id="b3"><i class="fa-solid fa-tower-broadcast"></i><span>Live</span></button><button id="b4"><i class="fa-solid fa-user"></i><span>Eu</span></button></div>
</div>

<script>
let posts=[]; let temp=""; let stream=null,recorder=null,chunks=[],recording=false,timerInt=null,sec=0,somAtivado=false,observer=null;
let saved=localStorage.getItem("work_final_som_leve"); if(saved){try{posts=JSON.parse(saved);}catch(e){posts=[];}}
function save(){try{localStorage.setItem("work_final_som_leve",JSON.stringify(posts.slice(0,15)));}catch(e){}}

// AUTO FIX SOM + TRAVAMENTO
function setupObserver(){
if(observer) observer.disconnect();
observer=new IntersectionObserver((entries)=>{
entries.forEach(en=>{
let v=en.target.querySelector('video'); if(!v) return;
if(en.isIntersecting){ v.play().catch(()=>{}); if(somAtivado){v.muted=false; v.volume=1;}} else {v.pause();}
});
},{threshold:0.7});
document.querySelectorAll('.post').forEach(p=>observer.observe(p));
}
function ativarSom(){
somAtivado=true;
document.querySelectorAll('#feed video').forEach(v=>{v.muted=false; v.volume=1; v.play().catch(()=>{});});
document.querySelectorAll('.volBtn').forEach(b=>{b.classList.remove('off'); b.innerHTML='<i class="fa-solid fa-volume-high"></i>';});
let t=document.getElementById('tapSom'); if(t) t.style.display='none';
localStorage.setItem('somAtivado','1');
}
function toggleSom(btn){
let v=btn.closest('.post').querySelector('video'); if(!v) return;
if(v.muted){v.muted=false; v.volume=1; v.play().catch(()=>{}); btn.classList.remove('off'); btn.innerHTML='<i class="fa-solid fa-volume-high"></i>'; ativarSom();}
else{v.muted=true; btn.classList.add('off'); btn.innerHTML='<i class="fa-solid fa-volume-xmark"></i>';}
}
if(localStorage.getItem('somAtivado')=='1') somAtivado=true;

async function startCam(f){
if(stream) stream.getTracks().forEach(t=>t.stop());
stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:f,width:720,height:1280},audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,sampleRate:48000}});
document.getElementById("camVideo").srcObject=stream;
document.getElementById("camBox").style.display="block";
document.getElementById("camOff").style.display="none";
}
function stopCam(){if(stream) stream.getTracks().forEach(t=>t.stop()); stream=null; document.getElementById("camBox").style.display="none"; document.getElementById("camOff").style.display="block"; clearInterval(timerInt); if(recording) stopRec();}
function toggleRec(){if(!recording) startRec(); else stopRec();}
function startRec(){
if(!stream) return alert("Abra câmera");
chunks=[];
let mime="video/webm;codecs=vp9,opus"; if(!MediaRecorder.isTypeSupported(mime)) mime="video/webm";
recorder=new MediaRecorder(stream,{mimeType:mime,audioBitsPerSecond:128000,videoBitsPerSecond:1200000});
recorder.ondataavailable=e=>{if(e.data.size>0) chunks.push(e.data);};
recorder.onstop=()=>{
let blob=new Blob(chunks,{type:mime});
temp=URL.createObjectURL(blob);
let pv=document.getElementById("previewVideo");
pv.src=temp; pv.muted=false; pv.volume=1; pv.play().catch(()=>{});
document.getElementById("previewArea").classList.add("show");
document.getElementById("btnPostar").classList.add("show");
};
recorder.start(100); recording=true;
document.getElementById("btnRec").classList.add("stop"); document.getElementById("btnRec").innerHTML='<i class="fa-solid fa-stop"></i>';
sec=0; timerInt=setInterval(()=>{sec++; let m=String(Math.floor(sec/60)).padStart(2,'0'); let s=String(sec%60).padStart(2,'0'); document.getElementById("timer").innerText=`${m}:${s} / 01:30 🔊`; if(sec>=90) stopRec();},1000);
}
function stopRec(){try{recorder.stop();}catch(e){} recording=false; document.getElementById("btnRec").classList.remove("stop"); document.getElementById("btnRec").innerHTML='<i class="fa-solid fa-circle"></i>'; clearInterval(timerInt);}

function render(){
document.getElementById("feed").innerHTML=posts.map((p,i)=>{
let media=p.img?`<video src="${p.img}" loop playsinline ${somAtivado?'':'muted'} preload="metadata" style="width:100%;height:100%;object-fit:cover" onclick="ativarSom()"></video><button class="volBtn ${somAtivado?'':'off'}" onclick="toggleSom(this)"><i class="fa-solid ${somAtivado?'fa-volume-high':'fa-volume-xmark'}"></i></button>${i==0&&!somAtivado?`<div id="tapSom" class="tapSom" onclick="ativarSom()">🔊 TOQUE PARA SOM</div>`:''}`:`<div style="width:100%;height:100%;background:#222;display:flex;align-items:center;justify-content:center;color:#555">SEM VIDEO</div>`;
return `<div class="post">${media}<div class="rightBar"><div class="iconTik fire"><i class="fa-solid fa-fire"></i></div><div class="txtTik">0<br>Chamas</div><div class="iconTik"><i class="fa-regular fa-heart"></i></div><div class="txtTik">0<br>Curtir</div><div class="iconTik"><i class="fa-regular fa-comment-dots"></i></div><div class="txtTik">0<br>Comen</div><div class="iconTik"><i class="fa-solid fa-share"></i></div><div class="txtTik">0<br>Compar</div><div class="iconTik"><i class="fa-regular fa-bookmark"></i></div><div class="txtTik">Salvar</div></div><div class="info"><b>@${p.owner||'tales'}</b> 1:30 🔊<div>${p.desc||'Meu vídeo 1:30 🔥'}</div></div></div>`;
}).join("");
setTimeout(setupObserver,200);
}
function postar(){
let d=document.getElementById("desc").value||"Meu vídeo 1:30 🔥";
if(!temp) return alert("Grave vídeo COM SOM!");
posts.unshift({id:Date.now(),owner:"tales",img:temp,desc:d});
save();
temp=""; document.getElementById("previewArea").classList.remove("show"); document.getElementById("btnPostar").classList.remove("show");
render(); go(0); stopCam();
}
function go(n){document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("on")); document.getElementById("b0").classList.add("on"); document.querySelectorAll(".page").forEach(p=>p.classList.remove("show")); if(n==2) document.getElementById("pCriar").classList.add("show");}
function closeAll(){stopCam(); document.querySelectorAll(".page").forEach(p=>p.classList.remove("show"));}

document.getElementById("file").addEventListener("change",e=>{
let f=e.target.files[0]; if(!f) return;
temp=URL.createObjectURL(f);
let pv=document.getElementById("previewVideo"); pv.src=temp; pv.muted=false; pv.volume=1; pv.play().catch(()=>{});
document.getElementById("previewArea").classList.add("show"); document.getElementById("btnPostar").classList.add("show");
});
render();
document.addEventListener('click',()=>{if(!somAtivado){/* primeiro toque habilita audio context */}}, {once:true});
</script>
</body>
</html>
