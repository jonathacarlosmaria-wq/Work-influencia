<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>WORK FIRE - CHAMAS ARDENTES</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100dvh;background:#000;overflow:hidden;font-family:system-ui}
.app{width:100%;max-width:420px;height:100dvh;margin:0 auto;background:#000;position:relative;display:flex;flex-direction:column;border-left:2px solid #ff4500;border-right:2px solid #ff4500;box-shadow:0 0 40px rgba(255,69,0,.5),inset 0 0 20px rgba(255,69,0,.2)}
.stage{flex:1;position:relative;overflow:hidden}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;background-color:#111}
.fire-overlay{position:absolute;inset:0;background:radial-gradient(ellipse at bottom,rgba(255,69,0,.25) 0%,transparent 60%),linear-gradient(180deg,rgba(255,100,0,.15) 0%,transparent 30%,rgba(0,0,0,.9) 100%);pointer-events:none}
.flame-border{position:absolute;inset:0;border:2px solid transparent;background:linear-gradient(black,black) padding-box,linear-gradient(180deg,#ff4500,#ff8c00,#ff4500) border-box;animation:burn 2s infinite alternate;pointer-events:none}
@keyframes burn{0%{box-shadow:0 0 15px #ff4500}100%{box-shadow:0 0 30px #ff8c00,0 0 50px #ff4500}}
@keyframes flicker{0%,100%{opacity:1}50%{opacity:.8;transform:scale(1.02)}}
.top{position:absolute;top:10px;left:10px;right:10px;z-index:5;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;color:#ff4500;font-size:14px;text-shadow:0 0 10px #ff4500,0 0 20px #ff8c00;animation:flicker 1.5s infinite}
.pill{padding:5px 10px;border-radius:100px;font-size:10px;font-weight:900}
.right{position:absolute;right:8px;bottom:110px;z-index:5;display:flex;flex-direction:column;gap:11px;align-items:center}
.btn{width:48px;height:48px;border-radius:12px;background:rgba(20,10,0,.9);border:1.6px solid #ff4500;display:flex;align-items:center;justify-content:center;color:#ff8c00;font-size:18px;box-shadow:0 0 10px rgba(255,69,0,.4)}
.btn.on{background:linear-gradient(90deg,#ff4500,#ff8c00);color:#000;border-color:#ff8c00;box-shadow:0 0 15px #ff4500}
.num{font-size:9px;font-weight:800;color:#fff;margin-top:3px;text-align:center;text-shadow:0 0 5px #ff4500}
.bottom{position:absolute;left:8px;right:70px;bottom:8px;z-index:5}
.card{background:rgba(15,8,0,.92);border:1.5px solid #ff4500;border-radius:16px;padding:10px;box-shadow:0 0 20px rgba(255,69,0,.3),inset 0 0 10px rgba(255,69,0,.1)}
.nav{height:60px;min-height:60px;background:linear-gradient(0deg,#1a0a00,#000);border-top:2.5px solid #ff4500;display:flex;justify-content:space-around;align-items:center;flex-shrink:0;box-shadow:0 -5px 20px rgba(255,69,0,.3)}
.ntab{color:#994400;font-size:9px;font-weight:900;text-align:center;flex:1}.ntab.on{color:#ff8c00;text-shadow:0 0 8px #ff4500}
.modal{position:absolute;left:0;right:0;top:0;bottom:0;background:rgba(0,0,0,.75);z-index:100;display:none;flex-direction:column;justify-content:flex-end}.modal.on{display:flex}
.box{width:100%;background:linear-gradient(180deg,#1a0a00,#161616);border-top:3px solid #ff4500;border-radius:20px 20px 0 0;display:flex;flex-direction:column;max-height:75dvh;box-shadow:0 -10px 30px rgba(255,69,0,.4)}
.toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:linear-gradient(90deg,#ff4500,#ff8c00);color:#000;padding:10px 18px;border-radius:100px;font-weight:900;display:none;z-index:300;font-size:12px;box-shadow:0 0 20px #ff4500}.toast.on{display:block}
#cam{position:absolute;inset:0;background:#000;z-index:200;display:none;flex-direction:column}#camEl{flex:1;width:100%;object-fit:cover;background:#000}
.mode{padding:7px 12px;border-radius:100px;border:1.5px solid #ff4500;background:#221000;color:#ff8c00;font-weight:900;font-size:10px}.mode.on{background:linear-gradient(90deg,#ff4500,#ff8c00);color:#000}
.fire-btn{background:linear-gradient(90deg,#ff4500,#ff8c00,#ff4500);background-size:200% 100%;animation:fireMove 1.5s linear infinite;color:#000;border:none;padding:11px;border-radius:100px;font-weight:900;box-shadow:0 0 15px #ff4500}
@keyframes fireMove{0%{background-position:0% 50%}100%{background-position:200% 50%}}
</style>
</head>
<body>
<div class="app">
<div class="stage" id="stage">
<div class="bg" id="bg"></div><div class="fire-overlay"></div>
<div class="top">
<div class="logo">🔥 WORK FIRE</div>
<div style="background:linear-gradient(90deg,#ff0000,#ff4500);color:#fff;padding:4px 10px;border-radius:100px;font-size:9px;font-weight:900;cursor:pointer;box-shadow:0 0 10px #ff0000;animation:flicker 1s infinite" onclick="startLive()" id="liveT">● LIVE</div>
</div>
<div class="right">
<div onclick="doLike()" style="text-align:center"><div class="btn" id="bL">🔥</div><div class="num" id="nL">2.1k</div></div>
<div onclick="openC()" style="text-align:center"><div class="btn">💬</div><div class="num" id="nC">3</div></div>
<div onclick="doSave()" style="text-align:center"><div class="btn" id="bS">⭐</div><div class="num">Salvar</div></div>
<div onclick="doShare()" style="text-align:center"><div class="btn">↗</div><div class="num">Share</div></div>
<div onclick="openHire()" style="text-align:center"><div class="btn fire-btn" style="width:auto;padding:0 12px;height:38px;border-radius:100px;font-size:10px">🔥 CONTRATAR</div></div>
</div>
<div class="bottom">
<div class="card">
<div style="display:flex;gap:8px;align-items:center"><div id="uP" style="width:34px;height:34px;border-radius:50%;background:#221000;border:1.5px solid #ff4500;display:flex;align-items:center;justify-content:center;color:#ff8c00;font-weight:900;font-size:12px;box-shadow:0 0 10px #ff4500">🔥</div><div><div style="display:flex;gap:5px;align-items:center"><div id="uN" style="color:#ff8c00;font-weight:900;font-size:12px;text-shadow:0 0 8px #ff4500">@fire.creator</div><div style="background:linear-gradient(90deg,#ff4500,#ff8c00);color:#000;font-size:7px;padding:2px 5px;border-radius:100px;font-weight:900">🔥 FIRE</div></div><div style="font-size:9px;color:#ff8c00" id="typeTag">🔥 Em chamas</div></div></div>
<div id="uD" style="font-size:11px;color:#ffcc99;margin-top:6px;line-height:1.3">🔥 Criador em chamas • Entrega ardente 24h</div>
</div>
</div>
<div id="toast" class="toast"></div>
<div class="modal" id="mHire"><div style="flex:1" onclick="closeAll()"></div><div class="box"><div style="padding:14px"><div style="display:flex;justify-content:space-between"><b style="color:#ff8c00;font-size:13px">🔥 Contratar em Chamas</b><button onclick="closeAll()" style="width:28px;height:28px;border-radius:50%;background:#221000;border:1px solid #ff4500;color:#ff8c00">×</button></div><div style="margin-top:10px;background:#221000;border:1px solid #ff4500;border-radius:10px;padding:10px"><div style="color:#ff8c00;font-weight:900;font-size:12px" id="hireName">@fire.creator 🔥</div><div style="font-size:10px;color:#ffaa77">Online em chamas 🔥🟢</div></div><button onclick="confirmHire()" class="fire-btn" style="width:100%;margin-top:10px;padding:12px">🔥 CONTRATAR AGORA</button></div></div></div>
<div class="modal" id="mC"><div style="flex:1" onclick="closeAll()"></div><div class="box"><div style="padding:10px;display:flex;justify-content:space-between;border-bottom:1px solid #441100"><b style="color:#ff8c00;font-size:12px" id="cT">💬</b><button onclick="closeAll()" style="width:26px;height:26px;border-radius:50%;background:#221000;border:1px solid #ff4500;color:#ff8c00">×</button></div><div id="cL" style="padding:10px;display:flex;flex-direction:column;gap:8px;max-height:45vh;overflow:auto"></div><div style="padding:10px;display:flex;gap:6px;border-top:1.5px solid #ff4500"><input id="cI" placeholder="Comentar..." style="flex:1;background:#221000;border:1.5px solid #ff4500;border-radius:100px;padding:10px;color:#fff;font-size:14px;outline:none"><button onclick="sendC()" style="background:linear-gradient(90deg,#ff4500,#ff8c00);color:#000;padding:10px 14px;border-radius:100px;font-weight:900;border:none;font-size:12px">🔥 Enviar</button></div></div></div>

<div id="cam">
<video id="camEl" autoplay muted playsinline></video>
<div id="recTimer" style="position:absolute;top:55px;left:50%;transform:translateX(-50%);background:rgba(20,10,0,.85);border:1.5px solid #ff4500;color:#ff8c00;padding:5px 12px;border-radius:100px;font-size:11px;font-weight:900;display:none;z-index:5;box-shadow:0 0 10px #ff4500"><span style="width:8px;height:8px;background:#ff0000;border-radius:50%;display:inline-block;box-shadow:0 0 6px #ff0000"></span> <span id="recTime">00:00</span> / 01:30</div>
<div style="position:absolute;top:0;left:0;right:0;padding:10px;display:flex;justify-content:space-between;z-index:5;background:linear-gradient(180deg,rgba(20,10,0,.7),transparent)">
<button onclick="closeCam()" style="width:32px;height:32px;border-radius:50%;background:rgba(20,10,0,.7);border:1px solid #ff4500;color:#ff8c00">✕</button>
<div id="camStatus" style="color:#ff8c00;font-weight:900;font-size:10px;background:rgba(20,10,0,.6);padding:5px 10px;border-radius:100px;border:1px solid #ff4500">🔥 Foto em chamas</div>
<button onclick="doPost()" id="postBtn" class="fire-btn" style="padding:6px 12px;border-radius:100px;font-weight:900;border:none;display:none;font-size:11px">🔥 Postar</button>
</div>
<div style="position:absolute;bottom:80px;left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:5">
<button class="mode on" id="modeFoto" onclick="setMode('foto')">📸 FOTO</button>
<button class="mode" id="modeVideo" onclick="setMode('video')">🎬 1:30</button>
<button class="mode" id="modeLive" onclick="setMode('live')">🔴 30min</button>
</div>
<div style="position:absolute;bottom:0;left:0;right:0;padding:10px;display:flex;gap:8px;align-items:center;z-index:5;background:linear-gradient(0deg,rgba(20,10,0,.85),transparent)">
<input id="dI" placeholder="Legenda em chamas..." style="flex:1;background:#221000;border:1.5px solid #ff4500;border-radius:100px;padding:10px;color:#fff;font-size:14px;outline:none">
<button id="capBtn" onclick="actionBtn()" style="width:62px;height:62px;border-radius:50%;background:linear-gradient(90deg,#ff4500,#ff8c00);border:3px solid #000;font-size:22px;flex-shrink:0;box-shadow:0 0 20px #ff4500">📸</button>
</div>
</div>

</div>
<div class="nav">
<div class="ntab on">🔥<br>Início</div>
<div class="ntab">🔍<br>Buscar</div>
<div class="ntab" onclick="openCam()"><div style="width:46px;height:46px;border-radius:50%;background:linear-gradient(90deg,#ff4500,#ff8c00);border:2px solid #000;display:flex;align-items:center;justify-content:center;color:#000;font-size:22px;margin:0 auto;box-shadow:0 0 15px #ff4500">+</div></div>
<div class="ntab" onclick="startLive()">🔴<br>LIVE</div>
<div class="ntab">👑<br>Eu</div>
</div>
</div>

<script>
let cur=0,photo=null,stream=null,recorder=null,chunks=[],recTimer=null,recSec=0,mode='foto',liveTimer=null,liveSec=0,videoBlob=null,isPosting=false;
let posts=[
{type:'foto',img:"https://images.unsplash.com/photo-1514565131-fce0801e5785?q=80&w=600",desc:"🔥 Edição em chamas 4K • Entrega ardente 24h",owner:"fire.creator",likes:2100,liked:false,saved:false,coms:["🔥 Quero!"]},
{type:'video',img:"https://images.unsplash.com/photo-1498050108023-c5249f4df085?q=80&w=600",desc:"🎬🔥 Vídeo 1:30 em chamas - Sites que queimam!",owner:"dev.fire",likes:3400,liked:false,saved:false,coms:["Top demais! 🔥"]},
];
const $=id=>document.getElementById(id);
function toast(t){let e=$('toast');e.innerText=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2000)}
function closeAll(){document.querySelectorAll('.modal').forEach(m=>m.classList.remove('on'))}
function closeCam(){
$('cam').style.display='none';$('postBtn').style.display='none';$('recTimer').style.display='none';
photo=null;videoBlob=null;chunks=[];
if(recorder&&recorder.state!=='inactive'){try{recorder.stop()}catch{}}recorder=null;
if(recTimer){clearInterval(recTimer);recTimer=null}recSec=0;
if(stream){try{stream.getTracks().forEach(s=>s.stop())}catch{}stream=null}
$('capBtn').innerText='📸';$('capBtn').style.background='linear-gradient(90deg,#ff4500,#ff8c00)';
isPosting=false;
}
function load(){
let p=posts[cur];$('bg').style.backgroundImage=`url('${p.data||p.img}')`;$('uN').innerText='@'+p.owner;$('uD').innerText=p.desc;$('uP').innerText='🔥';$('nL').innerText=p.likes>=1000?(p.likes/1000).toFixed(1)+'k':p.likes;$('nC').innerText=p.coms.length;$('bL').innerText=p.liked?'🔥':'🤍';$('bL').className=p.liked?'btn on':'btn';$('typeTag').innerText=p.type==='foto'?'📸 Foto':p.type==='video'?'🎬 1:30':'🔴 LIVE 30min';$('cT').innerText=`💬 ${p.coms.length}`;$('cL').innerHTML=p.coms.map(c=>`<div style="display:flex;gap:6px"><div style="width:22px;height:22px;border-radius:50%;background:linear-gradient(90deg,#ff4500,#ff8c00);color:#000;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:9px">🔥</div><div style="flex:1;background:#221000;border:1px solid #ff4500;border-radius:8px;padding:6px 8px"><div style="color:#ffcc99;font-size:11px;word-break:break-word">${c}</div></div></div>`).join('');$('hireName').innerText='@'+p.owner+' 🔥';
if(posts.length>20)posts=posts.slice(0,20);
}
function doLike(){let p=posts[cur];p.liked=!p.liked;p.likes+=p.liked?1:-1;load()}
function doSave(){posts[cur].saved=!posts[cur].saved;load();toast(posts[cur].saved?'🔥 Salvo!':'Removido')}
function doShare(){navigator.clipboard.writeText(location.href).then(()=>toast('🔥 Link copiado!'))}
function openHire(){$('mHire').classList.add('on')}
function confirmHire(){closeAll();toast('🔥 Pedido em chamas enviado!')}
function openC(){$('mC').classList.add('on')}
function sendC(){let i=$('cI');if(!i.value.trim())return;posts[cur].coms.push(i.value.trim());if(posts[cur].coms.length>30)posts[cur].coms.shift();i.value='';load()}
function setMode(m){
mode=m;document.querySelectorAll('.mode').forEach(b=>b.classList.remove('on'));
if(m==='foto'){$('modeFoto').classList.add('on');$('capBtn').innerText='📸';$('camStatus').innerText='🔥 Foto em chamas';$('capBtn').style.background='linear-gradient(90deg,#ff4500,#ff8c00)';$('recTimer').style.display='none'}
if(m==='video'){$('modeVideo').classList.add('on');$('capBtn').innerText='●';$('capBtn').style.background='#ff0000';$('camStatus').innerText='🔥 Vídeo 1:30';}
if(m==='live'){$('modeLive').classList.add('on');$('capBtn').innerText='🔴';$('camStatus').innerText='🔥 LIVE 30min/dia';checkLiveLimit()}
}
function checkLiveLimit(){
let today=new Date().toDateString();let last=localStorage.getItem('work_fire_date');let used=localStorage.getItem('work_fire_used');
if(last===today&&used==='1'){ $('camStatus').innerText='❌ 1 LIVE/dia feita';$('capBtn').style.opacity='.4';return false}
else{$('capBtn').style.opacity='1';return true}
}
async function openCam(){
$('cam').style.display='flex';setMode('foto');
try{
stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:720},height:{ideal:1280},facingMode:'user'},audio:true});
$('camEl').srcObject=stream;
}catch(e){toast('❌ Permita câmera')}
}
function actionBtn(){if(mode==='foto')capFoto();if(mode==='video'){if(recorder&&recorder.state==='recording')stopVideo();else startVideo()}if(mode==='live'){if(liveTimer)stopLive();else startLiveRec()}}
function capFoto(){
let v=$('camEl');if(!v.videoWidth)return toast('Aguarde câmera');
let c=document.createElement('canvas');let maxW=720;let scale=maxW/v.videoWidth;c.width=maxW;c.height=v.videoHeight*scale;
let ctx=c.getContext('2d');ctx.drawImage(v,0,0,c.width,c.height);
photo=c.toDataURL('image/jpeg',0.6);
$('postBtn').style.display='block';$('camStatus').innerText='🔥 Foto em chamas pronta!';toast('🔥 Foto 720p!')
}
function startVideo(){
chunks=[];try{recorder=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp8',videoBitsPerSecond:800000})}catch{recorder=new MediaRecorder(stream)}
recorder.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data)};
recorder.onstop=()=>{videoBlob=new Blob(chunks,{type:'video/webm'});photo=URL.createObjectURL(videoBlob);$('postBtn').style.display='block';$('camStatus').innerText='🔥 Vídeo pronto!';toast('🔥 Vídeo 1:30!')};
recorder.start(500);recSec=0;$('recTimer').style.display='block';$('capBtn').innerText='■';
recTimer=setInterval(()=>{recSec++;let m=Math.floor(recSec/60).toString().padStart(2,'0');let s=(recSec%60).toString().padStart(2,'0');$('recTime').innerText=`${m}:${s}`;if(recSec>=90)stopVideo()},1000);
}
function stopVideo(){if(recorder&&recorder.state==='recording')recorder.stop();if(recTimer)clearInterval(recTimer);$('capBtn').innerText='●';}
function startLiveRec(){if(!checkLiveLimit())return toast('❌ 1 LIVE/dia!');toast('🔥 LIVE 30min iniciada!');liveSec=0;$('recTimer').style.display='block';$('capBtn').innerText='■ LIVE';liveTimer=setInterval(()=>{liveSec++;let m=Math.floor(liveSec/60).toString().padStart(2,'0');let s=(liveSec%60).toString().padStart(2,'0');$('recTime').innerText=`${m}:${s}`;$('liveT').innerText=`● ${m}:${s}`;if(liveSec>=1800)stopLive()},1000);}
function stopLive(){if(liveTimer)clearInterval(liveTimer);liveTimer=null;localStorage.setItem('work_fire_used','1');localStorage.setItem('work_fire_date',new Date().toDateString());$('recTimer').style.display='none';$('liveT').innerText='● Feita';$('capBtn').innerText='🔴';toast('🔥 LIVE encerrada!')}
async function doPost(){
if(isPosting)return;isPosting=true;
if(!photo){isPosting=false;return toast('Tire foto/vídeo!')}
let desc=$('dI').value.trim()||(mode==='foto'?'🔥 Foto em chamas':mode==='video'?'🔥🎬 Vídeo 1:30 em chamas':'🔥 LIVE 30min');
if(mode==='video'&&videoBlob){
let r=new FileReader();r.onload=e=>{
let data=e.target.result;
if(data.length>2500000){toast('❌ Vídeo grande! Max 2.5MB');isPosting=false;return}
posts.unshift({type:'video',img:data,desc:desc,owner:'você',likes:0,liked:false,saved:false,coms:[],data:data});if(posts.length>20)posts.pop();$('dI').value='';closeCam();cur=0;load();toast('🔥🎬 Postado em chamas!');isPosting=false;
};r.readAsDataURL(videoBlob);
}else{
posts.unshift({type:mode,img:photo,desc:desc,owner:'você',likes:0,liked:false,saved:false,coms:[],data:photo});if(posts.length>20)posts.pop();$('dI').value='';closeCam();cur=0;load();toast('🔥📸 Postado em chamas!');isPosting=false;
}
}
function startLive(){if(!checkLiveLimit())return toast('❌ Só 1 LIVE/dia!');openCam();setMode('live')}
let sy=0,canSwipe=true;
$('stage').addEventListener('touchstart',e=>{sy=e.touches[0].clientY},{passive:true});
$('stage').addEventListener('touchend',e=>{
if(!canSwipe)return;let d=sy-e.changedTouches[0].clientY;if(Math.abs(d)>55){canSwipe=false;if(d>0){cur++;if(cur>=posts.length)cur=0}else{cur--;if(cur<0)cur=posts.length-1}load();setTimeout(()=>canSwipe=true,300)}
},{passive:true});
load();toast('🔥 Tema Chamas Ardentes - leve!');
</script>
</body>
</html>
