<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WORK - BARRA GRANDE BOTÕES ANIMADOS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#000;color:#fff;font-family:Arial;height:100dvh;overflow:hidden}
.app{height:100dvh;display:flex;flex-direction:column}
.stage{flex:1;position:relative;background:#000;overflow:hidden;touch-action:none}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
.grad{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.95) 0%,transparent 60%)}
.top{position:absolute;top:10px;left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:10}
.pill{padding:7px 12px;border-radius:20px;font-size:10px;font-weight:900;background:rgba(0,0,0,.7);border:1px solid #333}.pill.on{background:#FFD700;color:#000;box-shadow:0 0 12px gold}
.actions{position:absolute;right:8px;bottom:125px;display:flex;flex-direction:column;gap:14px;z-index:20;width:70px;align-items:center}
.cnt{font-size:9px;font-weight:900;margin-top:3px;background:rgba(0,0,0,.6);padding:2px 6px;border-radius:10px}
.meta{position:absolute;left:10px;bottom:12px;right:84px;z-index:10;background:rgba(0,0,0,.55);padding:10px;border-radius:16px;border:1px solid #333}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:1000;display:none;flex-direction:column}.modal.on{display:flex!important}
#toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#FFD700;color:#000;padding:12px 20px;border-radius:20px;z-index:8000;display:none;font-weight:900}#toast.on{display:block!important}

/* BARRA DE BAIXO GRANDE - BOTÕES DO TAMANHO DA BARRA */
.nav{
  height:115px!important;
  background:linear-gradient(180deg,#FFE55C,#FFD700,#D4AF37)!important;
  display:flex;
  justify-content:space-around;
  align-items:stretch;
  border-radius:26px 26px 0 0;
  margin-top:-16px;
  z-index:50;
  border-top:3px solid #FFD700;
  box-shadow:0 -4px 22px rgba(255,215,0,.5);
  padding:6px 4px 10px 4px;
}
.tab{
  color:#000;font-size:13px;font-weight:900;text-align:center;padding:0;border-radius:18px;min-width:62px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;margin:0 3px;height:100%;background:rgba(0,0,0,.08);border:1.5px solid rgba(0,0,0,.1);
}
.tab.on{background:#000!important;color:#FFD700!important;border:2px solid #000;box-shadow:0 4px 15px rgba(0,0,0,.4),0 0 20px rgba(255,215,0,.6);transform:translateY(-2px);}
.tab div:first-child{font-size:30px!important;line-height:1;margin-bottom:4px;}
.create{width:78px;height:78px;background:#000;border-radius:22px;display:flex;align-items:center;justify-content:center;border:3px solid #000;box-shadow:0 6px 20px rgba(0,0,0,.5),0 0 25px rgba(255,215,0,.7);margin:0 4px;align-self:center;}
.create span{background:linear-gradient(145deg,#FFE55C,#FFD700,#D4AF37);color:#000;width:100%;height:100%;display:flex;align-items:center;justify-content:center;border-radius:18px;font-size:42px;font-weight:900;box-shadow:inset 0 2px 8px rgba(255,255,255,.6);}

/* BOTÕES ANIMADOS */
@keyframes goldShake{0%{transform:translateX(0) scale(1)}15%{transform:translateX(-6px) rotate(-3deg) scale(1.15);box-shadow:0 0 35px gold,0 0 60px gold}30%{transform:translateX(6px) rotate(3deg) scale(1.25);box-shadow:0 0 45px gold}45%{transform:translateX(-4px) scale(1.1)}100%{transform:translateX(0) scale(1)}}
@keyframes heartPop{0%{transform:scale(1)}30%{transform:scale(1.5) rotate(-10deg)}60%{transform:scale(1.8) rotate(10deg);filter:drop-shadow(0 0 20px #ff0000)}100%{transform:scale(1)}}
@keyframes commentBounce{0%{transform:translateY(0) scale(1)}25%{transform:translateY(-8px) scale(1.2)}50%{transform:translateY(0) scale(1.3);box-shadow:0 0 25px #FFD700}100%{transform:translateY(0) scale(1)}}
@keyframes shareFly{0%{transform:translateX(0) scale(1) rotate(0deg)}30%{transform:translateX(8px) translateY(-8px) scale(1.3) rotate(15deg);box-shadow:0 0 30px #FFD700}60%{transform:translateX(-4px) scale(1.1) rotate(-5deg)}100%{transform:translateX(0) scale(1) rotate(0deg)}}
@keyframes avatarPulse{0%{transform:translateX(-50%) scale(1);box-shadow:0 0 0 0 rgba(255,215,0,.7)}50%{transform:translateX(-50%) scale(1.3);box-shadow:0 0 0 12px rgba(255,215,0,0)}100%{transform:translateX(-50%) scale(1)}}
.abtn{width:56px;height:56px;border-radius:18px;background:#1e1e1e;border:1.5px solid #D4AF37;display:flex;align-items:center;justify-content:center;font-size:22px;transition:.15s;position:relative}
.abtn:active{transform:scale(.85)}
.abtn.heart-anim{animation:heartPop.6s ease!important;background:radial-gradient(circle,#ff4444,#cc0000)!important;border-color:#ff0000!important;color:#fff!important}
.abtn.comment-anim{animation:commentBounce.6s ease!important;background:radial-gradient(circle,#FFE55C,#FFD700)!important;border-color:#FFD700!important}
.abtn.share-anim{animation:shareFly.6s ease!important;background:radial-gradient(circle,#FFE55C,#FFD700)!important}
#followPlus.follow-anim{animation:avatarPulse.7s ease!important}
.btn-gold{background:linear-gradient(145deg,#FFE55C,#FFD700,#D4AF37)!important;color:#000!important;border:2px solid #FFD700!important;font-weight:900;cursor:pointer}
.btn-gold:active{transform:scale(.88) translateY(2px)!important;box-shadow:0 0 35px gold!important}
.tab:active{transform:scale(.9)}
.shaking{animation:goldShake.55s cubic-bezier(.36,.07,.19,.97) both!important}
.input{width:100%;background:#111;border:1px solid #333;padding:11px;border-radius:12px;color:#fff;margin-top:7px;outline:none}
</style>
</head>
<body>
<div id="toast"></div>
<div class="app"><div class="stage" id="stage"></div>
<div class="nav">
<div class="tab on" onclick="shakeGold(this); goHome()"><div>🏠</div>Início</div>
<div class="tab" onclick="shakeGold(this); goMy()"><div>◧</div>Meus</div>
<div onclick="shakeGold(this); goCam()"><div class="create"><span>+</span></div></div>
<div class="tab" onclick="shakeGold(this); goCam(true)"><div>🔴</div>LIVE</div>
<div class="tab" onclick="shakeGold(this); goProfile()"><div>👤</div>Eu</div>
</div></div>

<div class="modal" id="profileM"><div style="flex:1" onclick="closeAll()"></div><div style="position:absolute;bottom:0;left:0;right:0;background:#1e1e1e;border-radius:28px 28px 0 0;padding:16px;border-top:3px solid #FFD700;max-height:94vh;overflow:auto">
<div style="display:flex;justify-content:space-between"><b style="color:#FFD700">👤 PERFIL • BARRA GRANDE</b><span onclick="closeAll()" style="font-size:26px;color:#FFD700;cursor:pointer">×</span></div>
<div style="text-align:center;padding:12px;background:rgba(0,0,0,.3);border-radius:20px;margin:10px 0;border:1px solid rgba(255,215,0,.15)">
<div id="avatarBox" style="width:110px;height:110px;margin:0 auto;border-radius:28px;background:#111;border:3px solid #FFD700;display:flex;align-items:center;justify-content:center;font-size:32px;overflow:hidden">👤</div>
<h3 id="profileName" style="margin-top:10px">Jonatha</h3><p id="profileNick" style="color:#FFD700;font-size:12px">@jonathacarlosmaria</p>
<div style="display:flex;gap:8px;justify-content:center;margin-top:12px"><button id="followBtn" onclick="toggleFollow()" class="btn-gold" style="flex:1;max-width:140px;padding:12px;border-radius:20px"><span id="followText">➕ SEGUIR</span></button><button onclick="shareProfile()" style="padding:12px 16px;border-radius:20px;background:rgba(255,215,0,.15);color:#FFD700;border:1px solid #FFD700">🔗</button></div>
</div>
<button onclick="pickAvatar()" style="width:100%;padding:10px;border-radius:12px;background:rgba(255,215,0,.12);color:#FFD700;border:1.5px dashed #FFD700;font-weight:800">📸 Trocar Foto</button>
<input id="inName" class="input" placeholder="Nome"><input id="inNick" class="input" placeholder="Nick"><button onclick="saveProfile()" class="btn-gold" style="width:100%;padding:12px;border-radius:16px;margin-top:10px">💾 SALVAR</button>
<p id="accInfo" style="color:#FFD700;text-align:center;margin:10px 0;font-size:12px">jonathacarlosmaria@gmail.com</p>
</div></div>

<div class="modal" id="commentsM" style="z-index:2000"><div style="flex:1" onclick="closeAll()"></div><div style="position:absolute;bottom:0;left:0;right:0;background:#1f1f1f;border-radius:28px 28px 0 0;max-height:85vh;display:flex;flex-direction:column;border-top:3px solid #FFD700"><div style="padding:14px 18px;display:flex;justify-content:space-between;border-bottom:1px solid #333"><span style="color:#FFD700;font-weight:900">💬 <span id="commentCount">0</span></span><span onclick="closeAll()" style="font-size:26px;color:#FFD700;cursor:pointer">×</span></div><div id="commentsList" style="flex:1;overflow:auto;padding:10px 14px;display:flex;flex-direction:column;gap:8px;max-height:55vh"></div><div style="padding:12px 14px;display:flex;gap:8px;background:#111"><input id="commentInput" placeholder="Comentar..." style="flex:1;background:rgba(255,255,255,.08);border:1px solid #D4AF37;border-radius:20px;padding:12px 14px;color:#fff;outline:none" onkeypress="if(event.key==='Enter') sendComment()"><button onclick="sendComment()" class="btn-gold" style="width:44px;height:44px;border-radius:50%">➤</button></div></div></div>

<div class="modal" id="shareM" style="z-index:3000"><div style="flex:1" onclick="closeAll()"></div><div style="position:absolute;bottom:0;left:0;right:0;background:#1e1e1e;border-radius:28px 28px 0 0;padding:18px;border-top:3px solid #FFD700">
<div style="width:40px;height:4px;background:#444;border-radius:2px;margin:0 auto 14px"></div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><b style="color:#FFD700">🔗 COMPARTILHAR</b><span onclick="closeAll()" style="font-size:26px;color:#FFD700;cursor:pointer">×</span></div>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px;margin-bottom:16px">
<button onclick="shareWhatsApp()" style="background:rgba(37,211,102,.15);border:1.5px solid #25D366;border-radius:18px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:48px;height:48px;background:#25D366;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px">💬</div><span style="color:#fff;font-size:10px;font-weight:800">WhatsApp</span></button>
<button onclick="shareFacebook()" style="background:rgba(24,119,242,.15);border:1.5px solid #1877F2;border-radius:18px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:48px;height:48px;background:#1877F2;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff">f</div><span style="color:#fff;font-size:10px;font-weight:800">Facebook</span></button>
<button onclick="copyLinkShare()" style="background:rgba(255,215,0,.15);border:1.5px solid #FFD700;border-radius:18px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:48px;height:48px;background:#FFD700;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px">🔗</div><span style="color:#fff;font-size:10px;font-weight:800">Copiar Link</span></button>
<button onclick="shareNative()" style="background:rgba(255,255,255,.08);border:1.5px solid #555;border-radius:18px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:48px;height:48px;background:#333;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px">📤</div><span style="color:#fff;font-size:10px;font-weight:800">Mais</span></button>
</div>
<div style="background:rgba(0,0,0,.4);border:1px solid #333;border-radius:14px;padding:10px;display:flex;gap:8px;align-items:center"><div style="flex:1;overflow:hidden"><div style="font-size:11px;color:#888">Link</div><div id="shareLinkText" style="font-size:11px;color:#FFD700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">https://work.app/v/123</div></div><button onclick="copyLinkShare()" class="btn-gold" style="padding:8px 14px;border-radius:12px;font-size:11px">COPIAR</button></div>
</div></div>

<div id="cam" style="position:fixed;inset:0;background:#000;z-index:999;display:none;flex-direction:column"><video id="camEl" autoplay muted playsinline style="flex:1;width:100%;object-fit:cover"></video><div style="position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:14px"><button onclick="closeCam()" style="width:38px;height:38px;background:rgba(0,0,0,.7);border:none;border-radius:50%;color:#fff">✕</button><span style="background:red;padding:7px 12px;border-radius:20px;font-size:11px;font-weight:900">● GRAVANDO</span><button onclick="postVideo()" style="background:#fff;color:#000;border:none;padding:7px 16px;border-radius:20px;font-weight:900">POSTAR</button></div><div style="position:absolute;bottom:0;left:0;right:0;padding:12px;display:flex;gap:8px"><button onclick="flipCam()" style="width:44px;height:44px;background:rgba(255,255,255,.2);border-radius:50%">🔄</button><input id="descInp" placeholder="Legenda..." style="flex:1;padding:12px;border-radius:20px;background:rgba(0,0,0,.6);border:1px solid #444;color:#fff"></div></div>
<div class="modal" id="myM"><div style="flex:1" onclick="closeAll()"></div><div style="position:absolute;bottom:0;left:0;right:0;background:#1d1d1d;border-radius:28px 28px 0 0;padding:16px;border-top:2px solid #FFD700;max-height:80vh;overflow:auto"><b style="color:#FFD700">✨ Meus</b><span style="float:right" onclick="closeAll()">×</span><div id="myGrid" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:12px"></div></div></div>
<div class="modal" id="adM"><div style="flex:1;display:flex;align-items:center;justify-content:center;padding:20px"><div style="background:#fff;color:#000;border-radius:20px;padding:20px;width:100%;max-width:300px;text-align:center"><div style="font-size:40px">💰</div><button onclick="closeAd()" class="btn-gold" style="width:100%;margin-top:10px;padding:12px;border-radius:12px">Continuar</button></div></div></div>
<input type="file" id="fileAvatar" accept="image/*" style="display:none">

<script>
function shakeGold(el){if(!el)return;el.classList.remove('shaking');void el.offsetWidth;el.classList.add('shaking');if(navigator.vibrate)navigator.vibrate(70);setTimeout(()=>el.classList.remove('shaking'),550);}
let db=null,stream=null,rec=null,chunks=[],cur=0,facing='user',isFollowing=false;
let allVideos=[
{id:1,desc:"Barra grande - Botões tamanho da barra",img:"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?q=80&w=1000",likes:230,share:20,comments:[]},
{id:2,desc:"Botões animados quando aperta",img:"https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?q=80&w=1000",likes:230,share:20,comments:[]},
{id:3,desc:"Compartilhar certinho modal",img:"https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=1000",likes:340,share:30,comments:[]}
];
function toast(t){let e=document.getElementById('toast');e.innerText=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2500)}
function closeAll(){document.querySelectorAll('.modal').forEach(m=>{m.classList.remove('on');m.style.display='none'})}
function closeAd(){document.getElementById('adM').classList.remove('on');document.getElementById('adM').style.display='none'}
function goHome(){closeAll();render()} function goMy(){loadAll().then(vs=>{document.getElementById('myGrid').innerHTML=vs.map(v=>`<video src="${v.data}" style="width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:12px"></video>`).join('')||'<div style="color:#888">Nenhum</div>';document.getElementById('myM').classList.add('on');document.getElementById('myM').style.display='flex';});}
function goProfile(){let c=JSON.parse(localStorage.getItem('work_current_user')||'null');if(!c){c={id:1,email:'jonathacarlosmaria@gmail.com',nick:'jonathacarlosmaria',name:'Jonatha'};localStorage.setItem('work_users',JSON.stringify([c]));localStorage.setItem('work_current_user',JSON.stringify(c));}document.getElementById('inName').value=c.name;document.getElementById('inNick').value=c.nick;document.getElementById('accInfo').innerText=c.email;document.getElementById('profileName').innerText=c.name;document.getElementById('profileNick').innerText='@'+c.nick;if(c.avatar)document.getElementById('avatarBox').innerHTML=`<img src="${c.avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:26px">`;document.getElementById('profileM').classList.add('on');document.getElementById('profileM').style.display='flex';}
function saveProfile(){let c=JSON.parse(localStorage.getItem('work_current_user'));c.name=document.getElementById('inName').value;c.nick=document.getElementById('inNick').value;localStorage.setItem('work_current_user',JSON.stringify(c));document.getElementById('profileName').innerText=c.name;document.getElementById('profileNick').innerText='@'+c.nick;toast('✅ Salvo');render();}
function getShareUrl(){return location.href.split('?')[0]+'?v='+allVideos[cur].id;}
function shareVideo(){let btn=document.getElementById('btn-share');if(btn){btn.classList.remove('share-anim');void btn.offsetWidth;btn.classList.add('share-anim');shakeGold(btn);setTimeout(()=>btn.classList.remove('share-anim'),600);}let url=getShareUrl();document.getElementById('shareLinkText').innerText=url;document.getElementById('shareM').classList.add('on');document.getElementById('shareM').style.display='flex';}
function shareWhatsApp(){let v=allVideos[cur];let url=getShareUrl();let text=encodeURIComponent(v.desc+' 🔥 Olha no WORK: '+url);window.open('https://wa.me/?text='+text,'_blank');v.share=(v.share||0)+1;render();toast('💬 WhatsApp');closeAll();}
function shareFacebook(){let url=getShareUrl();window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(url),'_blank');allVideos[cur].share=(allVideos[cur].share||0)+1;render();toast('📘 Facebook');closeAll();}
async function copyLinkShare(){let url=getShareUrl();try{await navigator.clipboard.writeText(url);allVideos[cur].share=(allVideos[cur].share||0)+1;render();toast('🔗 Copiado!');closeAll();}catch{prompt('Copie:',url);allVideos[cur].share=(allVideos[cur].share||0)+1;render();closeAll();}}
async function shareNative(){let v=allVideos[cur];let url=getShareUrl();if(navigator.share){try{await navigator.share({title:'WORK',text:v.desc,url:url});v.share=(v.share||0)+1;render();toast('✅ Compartilhado');closeAll();return;}catch(e){}}copyLinkShare();}
function shareProfile(){let c=JSON.parse(localStorage.getItem('work_current_user'));let url=location.href.split('?')[0]+'/@'+(c?c.nick:'jonathacarlosmaria');navigator.clipboard.writeText(url);toast('🔗 Perfil copiado')}
function likeVideo(){let btn=document.getElementById('btn-like');if(btn){btn.classList.remove('heart-anim');void btn.offsetWidth;btn.classList.add('heart-anim');shakeGold(btn);setTimeout(()=>btn.classList.remove('heart-anim'),650);}allVideos[cur].likes++;render();toast('❤️ Curtido');}
function openComments(){let btn=document.getElementById('btn-comment');if(btn){btn.classList.remove('comment-anim');void btn.offsetWidth;btn.classList.add('comment-anim');shakeGold(btn);setTimeout(()=>btn.classList.remove('comment-anim'),650);}let v=allVideos[cur];try{let s=JSON.parse(localStorage.getItem('work_comments_'+v.id)||'null');if(s)v.comments=s;}catch{}if(!v.comments)v.comments=[];document.getElementById('commentCount').innerText=v.comments.length;document.getElementById('commentsList').innerHTML=v.comments.map((c,i)=>`<div style="display:flex;gap:8px;background:rgba(255,255,255,.06);border-radius:14px;padding:10px"><div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(145deg,#FFD700,#D4AF37);display:flex;align-items:center;justify-content:center;color:#000;font-weight:900;font-size:12px">${c.user.charAt(1).toUpperCase()}</div><div style="flex:1"><div style="font-size:11px;color:#FFD700;font-weight:900">${c.user}</div><div style="font-size:13px;color:#fff">${c.text}</div></div></div>`).join('')||'<div style="color:#666;text-align:center;padding:20px">💬 Nenhum</div>';document.getElementById('commentsM').classList.add('on');document.getElementById('commentsM').style.display='flex';}
function sendComment(){let c=JSON.parse(localStorage.getItem('work_current_user')||'null');if(!c)return;let input=document.getElementById('commentInput');let t=input.value.trim();if(!t)return;let v=allVideos[cur];if(!v.comments)v.comments=[];v.comments.unshift({user:'@'+(c.nick||c.email.split('@')[0]),text:t});input.value='';localStorage.setItem('work_comments_'+v.id,JSON.stringify(v.comments));openComments();render();}
function toggleFollow(){let btn=document.getElementById('followBtn');let txt=document.getElementById('followText');let plus=document.getElementById('followPlus');if(btn)shakeGold(btn);if(plus){plus.classList.remove('follow-anim');void plus.offsetWidth;plus.classList.add('follow-anim');setTimeout(()=>plus.classList.remove('follow-anim'),700);}isFollowing=!isFollowing;if(isFollowing){if(txt)txt.innerText='✅ SEGUINDO';if(btn){btn.style.background='#000';btn.style.color='#FFD700';}if(plus){plus.innerText='✓';plus.style.background='#000';plus.style.color='#FFD700';plus.style.borderColor='#FFD700';}toast('✅ Seguindo');}else{if(txt)txt.innerText='➕ SEGUIR';if(btn){btn.style.background='linear-gradient(145deg,#FFE55C,#FFD700,#D4AF37)';btn.style.color='#000';}if(plus){plus.innerText='+';plus.style.background='#FF3B30';plus.style.color='#fff';plus.style.borderColor='#fff';}toast('❌ Deixou de seguir');}}
function render(){
 let v=allVideos[cur];let c=JSON.parse(localStorage.getItem('work_current_user')||'null');let userAvatar=c&&c.avatar? c.avatar : v.img;
 let media=v.data?`<video src="${v.data}" autoplay loop muted playsinline style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"></video>`:`<div class="bg" style="background-image:url('${v.img}')"></div>`;
 document.getElementById('stage').innerHTML=`${media}<div class="grad"></div>
 <div class="top"><div class="pill">${cur+1}/${allVideos.length}</div><div class="pill on">BARRA GRANDE</div></div>
 <div class="actions">
  <div style="position:relative;width:58px;height:58px;margin-bottom:6px;cursor:pointer" onclick="toggleFollow()">
    <div style="width:56px;height:56px;border-radius:50%;border:3px solid #FFD700;overflow:hidden;background:#111;box-shadow:0 0 15px rgba(255,215,0,.6)"><img src="${userAvatar}" style="width:100%;height:100%;object-fit:cover"></div>
    <div id="followPlus" style="position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:24px;height:24px;background:${isFollowing?'#000':'#FF3B30'};border:2.5px solid ${isFollowing?'#FFD700':'#fff'};border-radius:50%;display:flex!important;align-items:center;justify-content:center;color:${isFollowing?'#FFD700':'#fff'};font-size:13px;font-weight:900;z-index:999">${isFollowing?'✓':'+'}</div>
  </div>
  <div onclick="likeVideo()"><div id="btn-like" class="abtn">❤️</div><div class="cnt">${v.likes}</div></div>
  <div onclick="openComments()"><div id="btn-comment" class="abtn">💬</div><div class="cnt">${v.comments? v.comments.length:0}</div></div>
  <div onclick="shareVideo()"><div id="btn-share" class="abtn">🔗</div><div class="cnt">${v.share}</div></div>
 </div>
 <div class="meta"><div style="font-weight:700;font-size:13px">${v.desc}</div><div style="font-size:10px;color:#FFD700;margin-top:3px">Barra grande + botões tamanho da barra</div></div>`;
}
function nextVideo(){cur=(cur+1)%allVideos.length;render()} function prevVideo(){cur=(cur-1+allVideos.length)%allVideos.length;render()}
function goCam(){document.getElementById('cam').style.display='flex';navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:true}).then(s=>{stream=s;document.getElementById('camEl').srcObject=s;chunks=[];rec=new MediaRecorder(s);rec.ondataavailable=e=>chunks.push(e.data);rec.start();});}
function closeCam(){if(rec)rec.stop();if(stream)stream.getTracks().forEach(t=>t.stop());document.getElementById('cam').style.display='none';}
function flipCam(){facing=facing==='user'?'environment':'user';if(stream)stream.getTracks().forEach(t=>t.stop());navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:true}).then(s=>{stream=s;document.getElementById('camEl').srcObject=s;chunks=[];rec=new MediaRecorder(s);rec.ondataavailable=e=>chunks.push(e.data);rec.start();});}
function postVideo(){if(!rec)return;rec.stop();let blob=new Blob(chunks,{type:'video/webm'});let r=new FileReader();r.onload=e=>{let tx=db.transaction('videos','readwrite');let vid={id:Date.now(),user:'jonatha',data:e.target.result,desc:document.getElementById('descInp').value||'Meu vídeo'};tx.objectStore('videos').add(vid);tx.oncomplete=()=>{allVideos.unshift({id:vid.id,desc:vid.desc,data:vid.data,likes:0,share:0,comments:[]});closeCam();document.getElementById('descInp').value='';toast('✅ Salvo');render();}};r.readAsDataURL(blob);}
function initDB(){return new Promise(r=>{let q=indexedDB.open('WorkDB_BARRA_GRANDE_FINAL',1);q.onupgradeneeded=e=>e.target.result.createObjectStore('videos',{keyPath:'id'});q.onsuccess=e=>{db=e.target.result;r()}})}
function loadAll(){return new Promise(r=>{if(!db)return r([]);let tx=db.transaction('videos','readonly');let req=tx.objectStore('videos').getAll();req.onsuccess=()=>r(req.result)})}
function pickAvatar(){document.getElementById('fileAvatar').click();}
document.getElementById('fileAvatar').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=ev=>{let b64=ev.target.result;let c=JSON.parse(localStorage.getItem('work_current_user'));c.avatar=b64;localStorage.setItem('work_current_user',JSON.stringify(c));document.getElementById('avatarBox').innerHTML=`<img src="${b64}" style="width:100%;height:100%;object-fit:cover;border-radius:26px">`;render();toast('📸 Foto no feed!');};rd.readAsDataURL(f);});
let sy=0;const st=document.getElementById('stage');st.addEventListener('touchstart',e=>{sy=e.touches[0].clientY},{passive:true});st.addEventListener('touchend',e=>{let d=sy-e.changedTouches[0].clientY;if(Math.abs(d)>60){if(d>0)nextVideo();else prevVideo();}},{passive:true});
initDB().then(async()=>{let saved=await loadAll();saved.reverse().forEach(v=>{allVideos.unshift({id:v.id,desc:v.desc,data:v.data,likes:0,share:0,comments:[]})});render();if(!localStorage.getItem('work_current_user')){let u={id:1,email:'jonathacarlosmaria@gmail.com',nick:'jonathacarlosmaria',name:'Jonatha'};localStorage.setItem('work_users',JSON.stringify([u]));localStorage.setItem('work_current_user',JSON.stringify(u));}});
</script>
</body>
</html>
