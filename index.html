<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WORK - FINAL COM ADM E CADASTRO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#000;color:#fff;font-family:Arial;height:100dvh;overflow:hidden}
.app{height:100dvh;display:flex;flex-direction:column}
.stage{flex:1;position:relative;background:#000;overflow:hidden;touch-action:none}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
.grad{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.92) 0%,transparent 60%)}
.top{position:absolute;top:6px;left:0;right:0;display:flex;justify-content:center;gap:5px;z-index:10;padding:0 8px}
.pill{padding:5px 9px;border-radius:18px;font-size:8px;font-weight:900;background:rgba(0,0,0,.75);border:1px solid #333;white-space:nowrap;max-width:46%;overflow:hidden;text-overflow:ellipsis}.pill.on{background:#FFD700;color:#000}
.actions{position:absolute;right:5px;top:74px;bottom:108px;display:flex;flex-direction:column;gap:7px;z-index:30;width:54px;align-items:center}
.action-item{display:flex;flex-direction:column;align-items:center;width:100%;cursor:pointer}
.abtn{width:46px;height:46px;border-radius:13px;background:rgba(28,28,28,.94);border:2px solid #FFD700;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 3px 10px rgba(0,0,0,.7)}
.abtn.gold{background:linear-gradient(145deg,#FFE55C,#FFD700,#D4AF37)!important;color:#000!important;border:2px solid #000!important;box-shadow:0 0 12px rgba(255,215,0,.7)!important}
.bounce{animation:bounce.6s cubic-bezier(.34,1.56,.64,1)!important}
@keyframes bounce{0%{transform:scale(1)}30%{transform:scale(1.5) rotate(-10deg)}60%{transform:scale(.8) rotate(8deg)}100%{transform:scale(1)}}
.shake{animation:shake.5s!important}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px) rotate(-8deg)}75%{transform:translateX(8px) rotate(8deg)}}
.spin{animation:spin.7s!important}
@keyframes spin{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.4)}100%{transform:rotate(360deg) scale(1)}}
.fly{animation:fly.6s!important}
@keyframes fly{0%{transform:translateX(0)}40%{transform:translateX(18px) translateY(-12px) scale(1.3) rotate(15deg)}100%{transform:translateX(0)}}
.pulse{animation:pulse.5s!important}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.6)}100%{transform:scale(1)}}
.trashAnim{animation:trash.6s!important}
@keyframes trash{0%{transform:rotate(0)}20%{transform:rotate(-20deg) scale(1.2)}40%{transform:rotate(20deg) scale(1.2)}100%{transform:rotate(0)}}
.cnt{font-size:6.5px;font-weight:900;margin-top:2px;background:rgba(0,0,0,.85);padding:2px 5px;border-radius:8px;min-width:30px;text-align:center;color:#fff;border:1px solid rgba(255,255,255,.12)}
.flyHeart{position:absolute;right:12px;bottom:200px;font-size:30px;pointer-events:none;z-index:100;animation:flyUp 1s forwards}
@keyframes flyUp{0%{transform:translateY(0) scale(.5);opacity:1}100%{transform:translateY(-160px) scale(1.8);opacity:0}}
.meta{position:absolute;left:8px;bottom:8px;right:65px;z-index:10;background:rgba(0,0,0,.6);padding:8px 10px;border-radius:13px;border:1px solid #333}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:1000;display:none;flex-direction:column}.modal.on{display:flex!important}
#toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#FFD700;color:#000;padding:10px 16px;border-radius:16px;z-index:8000;display:none;font-weight:900;font-size:11px;max-width:80%;text-align:center}#toast.on{display:block!important}
.nav{height:96px!important;background:linear-gradient(180deg,#FFE55C,#FFD700,#D4AF37)!important;display:flex;justify-content:space-around;align-items:stretch;border-radius:20px 20px 0 0;margin-top:-10px;z-index:50;border-top:3px solid #FFD700;padding:4px 2px 5px 2px}
.tab{color:#000;font-size:9px;font-weight:900;text-align:center;border-radius:12px;min-width:50px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 2px;height:100%;background:rgba(0,0,0,.07)}
.tab.on{background:#000!important;color:#FFD700!important;border:2px solid #000}.tab div:first-child{font-size:22px!important}
.create{width:62px;height:62px;background:#000;border-radius:16px;display:flex;align-items:center;justify-content:center;border:3px solid #000;margin:0 2px;align-self:center}.create span{background:linear-gradient(145deg,#FFE55C,#FFD700,#D4AF37);color:#000;width:100%;height:100%;display:flex;align-items:center;justify-content:center;border-radius:12px;font-size:32px;font-weight:900}
.input{width:100%;background:#111;border:1px solid #333;padding:10px;border-radius:10px;color:#fff;margin-top:6px;font-size:12px}
#cam{position:fixed;inset:0;background:#000;z-index:9999;display:none;flex-direction:column}#camEl{flex:1;width:100%;height:100%;object-fit:cover;background:#111}.cam-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px;z-index:10;background:linear-gradient(180deg,rgba(0,0,0,.8),transparent)}.cam-modes{position:absolute;bottom:92px;left:0;right:0;display:flex;justify-content:center;gap:5px;z-index:10}.cam-modes button{padding:7px 10px;border-radius:16px;font-weight:900;font-size:9px;border:1.5px solid #fff}.cam-bottom{position:absolute;bottom:0;left:0;right:0;padding:10px 8px 16px;display:flex;gap:8px;align-items:center;z-index:10;background:linear-gradient(0deg,rgba(0,0,0,.9),transparent)}.progress{position:absolute;bottom:0;left:0;height:4px;background:#FFD700;z-index:20}
.soundBig{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.5);width:66px;height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;border:3px solid #FFD700;z-index:20}
</style>
</head>
<body>
<div id="toast"></div>
<div class="app"><div class="stage" id="stage"></div>
<div class="nav">
<div class="tab on" onclick="goHome()"><div>🏠</div>Início</div>
<div class="tab" onclick="goMy()"><div>◧</div>Meus</div>
<div onclick="goCam()"><div class="create"><span>+</span></div></div>

</div></div>

<!-- BARRA ADM + CADASTRO -->
<div id="adminBar" style="position:absolute;top:38px;left:8px;z-index:20;display:none;flex-direction:column;gap:5px">
<button onclick="openAdmin()" style="padding:6px 12px;border-radius:18px;background:linear-gradient(145deg,#FF0000,#B00000);color:#fff;font-weight:900;border:2px solid #fff;font-size:9px;box-shadow:0 2px 8px rgba(255,0,0,.6)">👑 ADM PAINEL</button>
<div style="background:rgba(0,0,0,.8);padding:4px 8px;border-radius:10px;font-size:8px;color:#FFD700;border:1px solid #FFD700">Logado: <span id="currentNick">@...</span></div>
</div>
<button id="registerBtn" onclick="openRegister()" style="position:absolute;top:38px;left:8px;z-index:20;padding:7px 14px;border-radius:18px;background:linear-gradient(145deg,#FFE55C,#FFD700);color:#000;font-weight:900;border:2px solid #000;font-size:10px;display:none;box-shadow:0 2px 10px rgba(255,215,0,.7)">📝 CADASTRAR-SE</button>

<div id="cam"><video id="camEl" autoplay muted playsinline></video><canvas id="photoCanvas" style="display:none"></canvas><div class="progress" id="camProgress" style="width:0%"></div><div class="cam-top"><button onclick="closeCam()" style="width:34px;height:34px;background:rgba(0,0,0,.7);border:2px solid #fff;border-radius:50%;color:#fff">✕</button><div style="display:flex;flex-direction:column;align-items:center;gap:3px"><span id="camModeLabel" style="background:#FFD700;color:#000;padding:4px 9px;border-radius:10px;font-size:9px;font-weight:900">📸 FOTO</span><span id="camTimer" style="background:#ff0000;padding:4px 9px;border-radius:16px;font-size:9px;display:none">● 00:00</span></div><button onclick="postCurrent()" style="background:#00ff00;color:#000;border:none;padding:8px 13px;border-radius:16px;font-weight:900;font-size:10px">💾 SALVAR</button></div><div class="cam-modes"><button id="btnFoto" onclick="setCamMode('foto')" style="background:#FFD700;color:#000">📸 FOTO</button><button id="btnVideo" onclick="setCamMode('video')" style="background:rgba(0,0,0,.6);color:#fff">📹 1:30</button><button id="btnLive" onclick="setCamMode('live')" style="background:rgba(0,0,0,.6);color:#fff">🔴 LIVE</button></div><div class="cam-bottom"><div style="flex:1"></div><input id="descInp" placeholder="Legenda..." style="flex:1;max-width:58%;padding:10px 12px;border-radius:18px;background:rgba(0,0,0,.6);border:1.5px solid #FFD700;color:#fff;font-size:11px"><button id="shutterBtn" onclick="captureAction()" style="width:58px;height:58px;background:#fff;border-radius:50%;border:3px solid #000;font-size:20px">📸</button><div style="flex:1"></div></div></div>

<div class="modal" id="profileM"><div style="flex:1" onclick="closeAll()"></div><div style="position:absolute;bottom:0;left:0;right:0;background:#1e1e1e;border-radius:22px 22px 0 0;padding:12px;border-top:3px solid #FFD700"><b style="color:#FFD700">👤 PERFIL</b><span onclick="closeAll()" style="float:right;font-size:20px;color:#FFD700">×</span><h3 id="profileName" style="font-size:14px;margin-top:6px"></h3><p id="profileNick" style="color:#FFD700;font-size:10px"></p><button onclick="openGalleryAuto()" style="width:100%;margin-top:8px;padding:11px;border-radius:10px;background:linear-gradient(145deg,#FFE55C,#FFD700);color:#000;font-weight:900;border:2px solid #000;font-size:12px">🖼️ IMPORTAR GALERIA</button><input id="inName" class="input" placeholder="Nome"><input id="inNick" class="input" placeholder="@nick"><button onclick="saveProfile()" style="width:100%;padding:10px;border-radius:10px;margin-top:6px;background:#FFD700;color:#000;font-weight:900;font-size:12px">💾 SALVAR LOGIN</button><input type="file" id="galleryInput" accept="video/*,image/*" multiple style="display:none"><button onclick="logout()" style="width:100%;padding:8px;border-radius:8px;margin-top:6px;background:#111;color:#ff4444;border:1px solid #ff0000;font-size:10px">🚪 SAIR / TROCAR CONTA</button></div></div>

<div class="modal" id="registerM"><div style="flex:1" onclick="closeAll()"></div><div style="position:absolute;bottom:0;left:0;right:0;background:#1e1e1e;border-radius:22px 22px 0 0;padding:16px;border-top:3px solid #FFD700"><b style="color:#FFD700">📝 CADASTRO - WORK</b><span onclick="closeAll()" style="float:right;font-size:20px;color:#FFD700">×</span><p style="font-size:10px;color:#aaa;margin-top:6px">Crie seu usuário para postar vídeos no app</p><input id="regName" class="input" placeholder="Seu nome completo"><input id="regNick" class="input" placeholder="Escolha seu @nick (ex: joao123)"><input id="regPass" class="input" type="password" placeholder="Senha (4 dígitos)"><button onclick="doRegister()" style="width:100%;padding:12px;border-radius:12px;margin-top:10px;background:linear-gradient(145deg,#FFE55C,#FFD700);color:#000;font-weight:900;border:2px solid #000;font-size:13px">✅ CRIAR CONTA E ENTRAR</button><p style="text-align:center;margin-top:8px;font-size:9px;color:#888">Já tem conta? <span onclick="closeAll();goProfile()" style="color:#FFD700;text-decoration:underline">Fazer login</span></p></div></div>

<div class="modal" id="adminM"><div style="flex:1" onclick="closeAll()"></div><div style="position:absolute;bottom:0;left:0;right:0;background:#1a0000;border-radius:22px 22px 0 0;padding:14px;border-top:3px solid #ff0000;max-height:82vh;overflow:auto"><div style="display:flex;justify-content:space-between"><b style="color:#ff4444;font-size:13px">👑 PAINEL ADM - @jonathacarlosmaria</b><span onclick="closeAll()" style="font-size:22px;color:#ff4444">×</span></div><div style="margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:7px"><button onclick="adminDeleteAll()" style="padding:10px;border-radius:10px;background:#ff0000;color:#fff;font-weight:900;border:1px solid #fff;font-size:10px">🗑️ APAGAR TUDO</button><button onclick="adminBackup()" style="padding:10px;border-radius:10px;background:#111;color:#FFD700;border:1.5px solid #FFD700;font-weight:900;font-size:10px">💾 BACKUP</button><button onclick="adminListUsers()" style="padding:10px;border-radius:10px;background:#FFD700;color:#000;font-weight:900;border:1px solid #000;font-size:10px">👥 USUÁRIOS</button><button onclick="adminResetApp()" style="padding:10px;border-radius:10px;background:#000;color:#ff4444;border:1.5px solid #ff0000;font-weight:900;font-size:10px">⚠️ RESET APP</button></div><div id="adminUsersList" style="margin-top:12px;background:#000;border-radius:10px;padding:8px;max-height:30vh;overflow:auto;border:1px solid #333"></div><div style="margin-top:10px;background:rgba(255,215,0,.1);padding:8px;border-radius:8px;border:1px solid #FFD700"><div style="font-size:10px;color:#FFD700;font-weight:900">📊 ESTATÍSTICAS</div><div id="adminStats" style="font-size:9px;color:#fff;margin-top:4px"></div></div></div></div>

<div class="modal" id="galleryAutoM"><div style="flex:1" onclick="closeAll()"></div><div style="position:absolute;bottom:0;left:0;right:0;background:#1d1d1d;border-radius:22px 22px 0 0;padding:12px;border-top:3px solid #FFD700;max-height:82vh;overflow:auto"><div style="display:flex;justify-content:space-between"><b style="color:#FFD700;font-size:13px">📱 GALERIA</b><span onclick="closeAll()" style="font-size:20px;color:#FFD700">×</span></div><div style="margin-top:8px;display:flex;justify-content:space-between"><span id="galleryCount" style="color:#FFD700;font-weight:900;font-size:10px">0 itens</span><button onclick="importAllGallery()" id="importAllBtn" style="padding:6px 12px;border-radius:14px;background:#0a0;color:#fff;font-weight:900;display:none;font-size:10px">✅ IMPORTAR</button></div><div id="galleryAutoGrid" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-top:8px;max-height:44vh;overflow:auto"></div></div></div>
<div class="modal" id="commentsM"><div style="flex:1" onclick="closeAll()"></div><div style="position:absolute;bottom:0;left:0;right:0;background:#1e1e1e;border-radius:22px 22px 0 0;padding:12px;border-top:3px solid #FFD700;max-height:68vh;overflow:auto"><div style="display:flex;justify-content:space-between"><b style="color:#FFD700;font-size:13px">💬 Comentários</b><span onclick="closeAll()" style="font-size:20px;color:#FFD700">×</span></div><div id="commentsList" style="margin-top:8px"></div><div style="display:flex;gap:5px;margin-top:8px"><input id="commentInput" class="input" style="flex:1;margin:0" placeholder="Escreve..."><button onclick="sendComment()" style="padding:8px 11px;border-radius:8px;background:#FFD700;color:#000;font-weight:900;font-size:11px">Enviar</button></div></div></div>
<div class="modal" id="shareM"><div style="flex:1" onclick="closeAll()"></div><div style="position:absolute;bottom:0;left:0;right:0;background:#1d1d1d;border-radius:22px 22px 0 0;padding:14px;border-top:3px solid #FFD700"><div style="text-align:center"><b style="color:#FFD700;font-size:13px">↗️ Compartilhar</b><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px"><button onclick="shareWhats()" style="padding:10px;border-radius:10px;background:#25D366;color:#fff;font-weight:900;border:none;font-size:11px">WhatsApp</button><button onclick="shareCopy()" style="padding:10px;border-radius:10px;background:#111;color:#FFD700;border:1.5px solid #FFD700;font-weight:900;font-size:11px">Copiar Link</button><button onclick="shareFace()" style="padding:10px;border-radius:10px;background:#1877F2;color:#fff;font-weight:900;border:none;font-size:11px">Facebook</button><button onclick="shareSystem()" style="padding:10px;border-radius:10px;background:#FFD700;color:#000;font-weight:900;border:none;font-size:11px">Mais</button></div></div></div></div>
<div class="modal" id="myM"><div style="flex:1" onclick="closeAll()"></div><div style="position:absolute;bottom:0;left:0;right:0;background:#1d1d1d;border-radius:22px 22px 0 0;padding:12px;border-top:2px solid #FFD700;max-height:74vh;overflow:auto"><b style="color:#FFD700;font-size:13px">✨ Meus</b><span style="float:right" onclick="closeAll()">×</span><div id="myGrid" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-top:8px"></div></div></div>
<div class="modal" id="deleteM"><div style="flex:1" onclick="closeAll()"></div><div style="position:absolute;bottom:0;left:0;right:0;background:#1d1d1d;border-radius:22px 22px 0 0;padding:14px;border-top:3px solid #ff0000"><div style="text-align:center"><h3 style="color:#ff4444;font-size:13px">Apagar vídeo?</h3><div id="deletePreview" style="margin-top:6px;background:#000;border-radius:8px;padding:5px;font-size:10px"></div><div style="display:flex;gap:6px;margin-top:10px"><button onclick="closeAll()" style="flex:1;padding:10px;border-radius:10px;background:#111;color:#fff;font-size:11px">Cancelar</button><button onclick="confirmDelete()" style="flex:1;padding:10px;border-radius:10px;background:#ff0000;color:#fff;font-weight:900;font-size:11px">🗑️ Apagar</button></div></div></div></div>

<script>
const APP_OWNER_NICK="jonathacarlosmaria";
const ADMIN_NICK="jonathacarlosmaria";
let db=null,stream=null,rec=null,chunks=[],cur=0,camMode='foto',photoData=null,camTimerInt=null,camStartTime=0,VIDEO_MAX=90000,LIVE_MAX=1800000,allVideos=[],galleryFiles=[],deleteId=null,currentMuted=true;
function toast(t){let e=document.getElementById('toast');e.innerText=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)}
function closeAll(){document.querySelectorAll('.modal').forEach(m=>{m.classList.remove('on');m.style.display='none'})}
function getCurrentUser(){try{return JSON.parse(localStorage.getItem('work_current_user')||'{"nick":"'+APP_OWNER_NICK+'","name":"Jonatha"}')}catch{return {nick:APP_OWNER_NICK,name:"Jonatha"}}}
function goHome(){closeAll();render()}
function goMy(){let myNick=getCurrentUser().nick;let myVideos=allVideos.filter(v=>v.owner===myNick);document.getElementById('myGrid').innerHTML=myVideos.map(v=>{let media=v.type==='foto'||(v.data&&v.data.startsWith('data:image'))?`<img src="${v.data||v.img}" style="width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:8px">`:`<video src="${v.data}" controls playsinline style="width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:8px"></video>`;return `<div style="position:relative;border:1px solid #0a0;border-radius:8px;overflow:hidden">${media}<button onclick="askDelete(${v.id})" style="position:absolute;bottom:3px;right:3px;background:#ff0000;color:#fff;border:1px solid #fff;border-radius:10px;padding:1px 5px;font-size:8px">🗑️</button></div>`}).join('')||'<div style="text-align:center;padding:12px;color:#888;font-size:11px">Nenhum</div>';document.getElementById('myM').classList.add('on');document.getElementById('myM').style.display='flex';}
function goProfile(){let c=getCurrentUser();document.getElementById('inName').value=c.name;document.getElementById('inNick').value=c.nick;document.getElementById('profileName').innerText=c.name;document.getElementById('profileNick').innerText='@'+c.nick+' • '+allVideos.filter(v=>v.owner===c.nick).length+' vídeos';document.getElementById('profileM').classList.add('on');document.getElementById('profileM').style.display='flex';}
function saveProfile(){let c=getCurrentUser();c.name=document.getElementById('inName').value.trim()||c.name;c.nick=document.getElementById('inNick').value.trim().replace('@','')||c.nick;localStorage.setItem('work_current_user',JSON.stringify(c));checkAdmin();toast('✅ @'+c.nick);render();}
function logout(){localStorage.removeItem('work_current_user');closeAll();checkAdmin();toast('🚪 Deslogado');openRegister();}
function saveToBackup(){try{let b=allVideos.filter(v=>v.id!==1).slice(0,60).map(v=>({id:v.id,desc:v.desc,data:v.data,type:v.type,owner:v.owner,likes:v.likes||0,comments:v.commentsList||[] }));localStorage.setItem('work_backup_videos',JSON.stringify(b));}catch{}}
function loadFromBackup(){try{let b=JSON.parse(localStorage.getItem('work_backup_videos')||'[]');if(b.length>0)return b;}catch{}return [];}
function openGalleryAuto(){document.getElementById('galleryInput').click();}
function handleGalleryFiles(files){galleryFiles=Array.from(files);document.getElementById('galleryAutoM').classList.add('on');document.getElementById('galleryAutoM').style.display='flex';document.getElementById('galleryCount').innerText=galleryFiles.length+' itens';document.getElementById('importAllBtn').style.display='block';let grid=document.getElementById('galleryAutoGrid');grid.innerHTML='';galleryFiles.forEach((f,i)=>{let url=URL.createObjectURL(f);let isVid=f.type.startsWith('video/');let el=document.createElement('div');el.style.cssText='position:relative;aspect-ratio:9/16;background:#111;border-radius:8px;overflow:hidden;border:1.5px solid #FFD700';el.innerHTML=isVid?`<video src="${url}" style="width:100%;height:100%;object-fit:cover" muted></video><div style="position:absolute;top:3px;right:3px"><input type="checkbox" checked data-i="${i}" class="gCheck" style="width:16px;height:16px"></div>`: `<img src="${url}" style="width:100%;height:100%;object-fit:cover"><div style="position:absolute;top:3px;right:3px"><input type="checkbox" checked data-i="${i}" class="gCheck" style="width:16px;height:16px"></div>`;grid.appendChild(el);});}
function importAllGallery(){let checks=document.querySelectorAll('.gCheck:checked');if(!checks.length){toast('Selecione');return}let curUser=getCurrentUser();let done=0;checks.forEach(ch=>{let f=galleryFiles[parseInt(ch.dataset.i)];let rd=new FileReader();rd.onload=ev=>{let id=Date.now()+Math.random();let obj={id:id,data:ev.target.result,desc:f.name,type:f.type.startsWith('video/')?'video':'foto',likes:0,owner:curUser.nick,commentsList:[]};allVideos.unshift(obj);saveToBackup();try{let tx=db.transaction('videos','readwrite');tx.objectStore('videos').add(obj);}catch{}done++;if(done===checks.length){toast(`✅ ${done} salvos!`);closeAll();render();}};rd.readAsDataURL(f);});}
document.getElementById('galleryInput').addEventListener('change',e=>{ if(e.target.files.length) handleGalleryFiles(e.target.files); });
function askDelete(id){deleteId=id;let v=allVideos.find(x=>x.id===id);document.getElementById('deletePreview').innerText=`@${v.owner} - ${v.desc}`;document.getElementById('deleteM').classList.add('on');document.getElementById('deleteM').style.display='flex';}
function confirmDelete(){let id=deleteId;allVideos=allVideos.filter(x=>x.id!==id);saveToBackup();try{let tx=db.transaction('videos','readwrite');tx.objectStore('videos').delete(id);}catch{}if(cur>=allVideos.length)cur=0;closeAll();render();toast('🗑️ Apagado');}
function animateBtn(el, cls){el.classList.remove('bounce','shake','spin','fly','pulse','trashAnim');void el.offsetWidth;el.classList.add(cls);setTimeout(()=>el.classList.remove(cls),700);}
function render(){
if(allVideos.length===0)allVideos=[{id:1,desc:"WORK - lateral completa",img:"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?q=80&w=1000",type:'foto',owner:APP_OWNER_NICK,likes:10,commentsList:["Top! 👑"]}];
let v=allVideos[cur];
let media=v.type==='foto'||(v.data&&v.data.startsWith('data:image'))?`<div class="bg" style="background-image:url('${v.data||v.img}')"></div>`:`<video id="mainVideo" src="${v.data}" autoplay loop muted playsinline style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"></video><div id="soundBtn" class="soundBig" onclick="toggleSound()" style="display:${currentMuted?'flex':'none'}">${currentMuted?'🔇':'🔊'}</div>`;
document.getElementById('stage').innerHTML=`${media}<div class="grad"></div>
<div class="top"><div class="pill">1/1 SALVOS</div><div class="pill on">✅ @${v.owner}</div></div>
<div class="actions">
<div class="action-item" onclick="like(this)"><div class="abtn" style="border-color:#ff2d55">❤️</div><div class="cnt">${v.likes||10}</div></div>
<div class="action-item" onclick="openComments(this)"><div class="abtn" style="border-color:#00d4ff">💬</div><div class="cnt">${(v.commentsList||[]).length}</div></div>
<div class="action-item" onclick="openGalleryAutoAnim(this)"><div class="abtn gold">🖼️</div><div class="cnt" style="background:linear-gradient(145deg,#FFE55C,#FFD700);color:#000;border-color:#000">Galeria</div></div>
<div class="action-item" onclick="openShare(this)"><div class="abtn" style="border-color:#4da3ff">↗️</div><div class="cnt">Share</div></div>
<div class="action-item" onclick="toggleSound(this)"><div class="abtn" style="border-color:${currentMuted?'#ff5050':'#00e676'}">${currentMuted?'🔇':'🔊'}</div><div class="cnt">${currentMuted?'Mudo':'Som'}</div></div>
<div class="action-item" onclick="askDeleteAnim(this, ${v.id})"><div class="abtn" style="background:#ff1a1a!important;border-color:#fff!important">🗑️</div><div class="cnt" style="color:#ff6666">Apagar</div></div>
</div>
<div class="meta"><div style="font-weight:700;font-size:11px">WORK - lateral completa</div><div style="font-size:8px;color:#FFD700;margin-top:2px">💬 ${(v.commentsList||[]).length} | 🖼️ Galeria | ↗️ Share | @${v.owner}</div></div>`;
let vid=document.getElementById('mainVideo');if(vid){vid.muted=currentMuted}
}
function like(item){let btn=item.querySelector('.abtn');animateBtn(btn,'bounce');let h=document.createElement('div');h.className='flyHeart';h.innerText='❤️';document.getElementById('stage').appendChild(h);setTimeout(()=>h.remove(),1000);let v=allVideos[cur];v.likes=(v.likes||0)+1;saveToBackup();setTimeout(()=>{render();toast('❤️ Curtiu!')},250);}
function openComments(item){if(item)animateBtn(item.querySelector('.abtn'),'shake');let v=allVideos[cur];document.getElementById('commentsList').innerHTML=(v.commentsList||[]).map(c=>`<div style="background:rgba(255,255,255,.08);padding:7px;border-radius:8px;margin-bottom:4px;border-left:2px solid #00d4ff;font-size:10px">💬 ${c}</div>`).join('')||'<div style="text-align:center;color:#888;padding:12px;font-size:10px">Seja o primeiro!</div>';setTimeout(()=>{document.getElementById('commentsM').classList.add('on');document.getElementById('commentsM').style.display='flex';},200);}
function openGalleryAutoAnim(item){animateBtn(item.querySelector('.abtn'),'spin');setTimeout(()=>openGalleryAuto(),300);}
function openShare(item){animateBtn(item.querySelector('.abtn'),'fly');setTimeout(()=>{document.getElementById('shareM').classList.add('on');document.getElementById('shareM').style.display='flex';},250);}
function toggleSound(item){if(item&&item.querySelector){animateBtn(item.querySelector('.abtn'),'pulse');}let vid=document.getElementById('mainVideo');if(!vid){currentMuted=!currentMuted;setTimeout(()=>render(),200);return}currentMuted=!currentMuted;vid.muted=currentMuted;setTimeout(()=>render(),200);}
function askDeleteAnim(item,id){animateBtn(item.querySelector('.abtn'),'trashAnim');setTimeout(()=>askDelete(id),300);}
function shareWhats(){let v=allVideos[cur];window.open(`https://wa.me/?text=${encodeURIComponent(`WORK de @${v.owner}: ${v.desc} https://jonathacarlosmaria-wq.github.io/Work-influencia/`)}`);}
function shareCopy(){navigator.clipboard.writeText(location.href).then(()=>toast('✅ Copiado!'));}
function shareFace(){window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(location.href)}`);}
function shareSystem(){if(navigator.share){navigator.share({title:'WORK',url:location.href})}else{shareCopy()}}
function sendComment(){let txt=document.getElementById('commentInput').value.trim();if(!txt)return;let v=allVideos[cur];if(!v.commentsList)v.commentsList=[];v.commentsList.push(txt);document.getElementById('commentInput').value='';saveToBackup();openComments();render();}
function setCamMode(mode){camMode=mode;photoData=null;document.getElementById('btnFoto').style.background=mode==='foto'?'#FFD700':'rgba(0,0,0,.6)';document.getElementById('btnVideo').style.background=mode==='video'?'#FFD700':'rgba(0,0,0,.6)';document.getElementById('btnLive').style.background=mode==='live'?'#ff0000':'rgba(0,0,0,.6)';let label=document.getElementById('camModeLabel'),timer=document.getElementById('camTimer'),progress=document.getElementById('camProgress');if(camTimerInt){clearInterval(camTimerInt);camTimerInt=null}progress.style.width='0%';if(mode==='foto'){label.innerText='📸 FOTO';timer.style.display='none';document.getElementById('shutterBtn').innerText='📸'}if(mode==='video'){label.innerText=`📹 1:30`;timer.style.display='block';document.getElementById('shutterBtn').innerText='⏺️';startRec(false)}if(mode==='live'){label.innerText=`🔴 LIVE`;timer.style.display='block';document.getElementById('shutterBtn').innerText='🔴';startRec(true)}}
function captureAction(){if(camMode==='foto'){let v=document.getElementById('camEl');let c=document.getElementById('photoCanvas');c.width=v.videoWidth||720;c.height=v.videoHeight||1280;c.getContext('2d').drawImage(v,0,0,c.width,c.height);photoData=c.toDataURL('image/jpeg',0.8);toast('📸 Pronta!');document.getElementById('shutterBtn').innerText='✅';}}
function goCam(isLive=false){document.getElementById('cam').style.display='flex';navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true}).then(s=>{stream=s;document.getElementById('camEl').srcObject=s;document.getElementById('camEl').muted=true;setCamMode(isLive?'live':'foto');}).catch(()=>toast('❌ Permita câmera'));}
function startRec(isLive){chunks=[];if(stream){try{rec=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9,opus'});}catch{rec=new MediaRecorder(stream);}rec.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data)};rec.start(100);camStartTime=Date.now();camTimerInt=setInterval(()=>{let elapsed=Date.now()-camStartTime;let limit=isLive?LIVE_MAX:VIDEO_MAX;document.getElementById('camTimer').innerText=`${isLive?'🔴':'●'} ${Math.floor(elapsed/1000)}s`;document.getElementById('camProgress').style.width=`${Math.min(100,(elapsed/limit)*100)}%`;if(elapsed>=limit)postCurrent();},100);}}
function closeCam(){if(camTimerInt){clearInterval(camTimerInt);camTimerInt=null}if(rec){try{rec.stop()}catch{}rec=null}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}document.getElementById('cam').style.display='none';document.getElementById('camProgress').style.width='0%';photoData=null}
function postCurrent(){let curUser=getCurrentUser();if(camMode==='foto'){if(!photoData){toast('Tire foto');return}let id=Date.now();let obj={id:id,data:photoData,desc:document.getElementById('descInp').value||'Foto @'+curUser.nick,type:'foto',likes:0,owner:curUser.nick,commentsList:[]};allVideos.unshift(obj);saveToBackup();try{let tx=db.transaction('videos','readwrite');tx.objectStore('videos').add(obj);}catch{}closeCam();document.getElementById('descInp').value='';toast('✅ FOTO SALVA!');render();}else{if(!rec||chunks.length===0){toast('Grave');return}if(camTimerInt){clearInterval(camTimerInt);camTimerInt=null}rec.stop();let blob=new Blob(chunks,{type:rec.mimeType||'video/webm'});let r=new FileReader();r.onload=e=>{let id=Date.now()+Math.random();let obj={id:id,data:e.target.result,desc:document.getElementById('descInp').value||'Vídeo 🔊 @'+curUser.nick,type:'video',likes:0,owner:curUser.nick,commentsList:[]};allVideos.unshift(obj);saveToBackup();try{let tx=db.transaction('videos','readwrite');tx.objectStore('videos').add(obj);}catch{}closeCam();document.getElementById('descInp').value='';chunks=[];currentMuted=false;toast('✅ COM SOM!');render();};r.readAsDataURL(blob);}}
// ADM E CADASTRO
function checkAdmin(){
let user=getCurrentUser();
let isAdmin=user.nick===ADMIN_NICK;
let bar=document.getElementById('adminBar');
let regBtn=document.getElementById('registerBtn');
let nickSpan=document.getElementById('currentNick');
if(nickSpan) nickSpan.innerText="@"+user.nick;
if(isAdmin){
if(bar) bar.style.display="flex";
if(regBtn) regBtn.style.display="none";
}else{
if(bar) bar.style.display="none";
}
if(!localStorage.getItem('work_current_user')){
if(regBtn) regBtn.style.display="block";
setTimeout(()=>openRegister(),1000);
}else{
if(regBtn) regBtn.style.display="none";
}
}
function openRegister(){document.getElementById('registerM').classList.add('on');document.getElementById('registerM').style.display='flex';}
function doRegister(){
let name=document.getElementById('regName').value.trim();
let nick=document.getElementById('regNick').value.trim().replace('@','').toLowerCase();
let pass=document.getElementById('regPass').value.trim();
if(!name||!nick){toast('❌ Preencha nome e @nick');return;}
if(nick.length<3){toast('❌ @nick mínimo 3 letras');return;}
let newUser={id:Date.now(),name:name,nick:nick,pass:pass,created:Date.now()};
localStorage.setItem('work_current_user',JSON.stringify(newUser));
let users=JSON.parse(localStorage.getItem('work_all_users')||'[]');
users.push(newUser);
localStorage.setItem('work_all_users',JSON.stringify(users));
closeAll();checkAdmin();render();toast('✅ Bem-vindo @'+nick+'! 👑');
}
function openAdmin(){
let user=getCurrentUser();
if(user.nick!==ADMIN_NICK){toast('❌ Só admin');return;}
document.getElementById('adminM').classList.add('on');document.getElementById('adminM').style.display='flex';
let stats=document.getElementById('adminStats');
let users=JSON.parse(localStorage.getItem('work_all_users')||'[]');
if(stats) stats.innerHTML=`Total vídeos: ${allVideos.length}<br>Total usuários: ${users.length+1}<br>Seus vídeos: ${allVideos.filter(v=>v.owner===ADMIN_NICK).length}<br>Armazenamento: ${Math.round(JSON.stringify(localStorage).length/1024)} KB`;
adminListUsers();
}
function adminListUsers(){
let users=JSON.parse(localStorage.getItem('work_all_users')||'[]');
let div=document.getElementById('adminUsersList');
if(!div) return;
if(users.length===0){div.innerHTML='<div style="text-align:center;color:#888;font-size:10px;padding:10px">Nenhum usuário ainda</div>';return;}
div.innerHTML=users.map(u=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px;background:#111;margin-bottom:4px;border-radius:6px;border-left:2px solid #FFD700"><div><div style="font-size:10px;font-weight:900;color:#fff">${u.name}</div><div style="font-size:8px;color:#FFD700">@${u.nick}</div></div><button onclick="adminDeleteUser('${u.nick}')" style="padding:3px 6px;border-radius:8px;background:#ff0000;color:#fff;font-size:8px;border:none">🗑️</button></div>`).join('');
}
function adminDeleteUser(nick){if(!confirm('Apagar @'+nick+'?')) return;let users=JSON.parse(localStorage.getItem('work_all_users')||'[]');users=users.filter(u=>u.nick!==nick);localStorage.setItem('work_all_users',JSON.stringify(users));allVideos=allVideos.filter(v=>v.owner!==nick);saveToBackup();adminListUsers();render();toast('🗑️ @'+nick+' apagado');}
function adminDeleteAll(){if(!confirm('APAGAR TODOS OS VÍDEOS?')) return;if(!confirm('TEM CERTEZA?')) return;allVideos=[allVideos[0]];saveToBackup();try{let tx=db.transaction('videos','readwrite');tx.objectStore('videos').clear();}catch{}render();toast('🗑️ Tudo apagado');closeAll();}
function adminBackup(){let data=JSON.stringify(allVideos.slice(0,20));navigator.clipboard.writeText(data).then(()=>toast('💾 Backup copiado!'));}
function adminResetApp(){if(!confirm('RESETAR APP TODO?')) return;localStorage.clear();indexedDB.deleteDatabase('WorkDB_FINAL_ADM');location.reload();}

function initDB(){return new Promise(r=>{let q=indexedDB.open('WorkDB_FINAL_ADM',25);q.onupgradeneeded=e=>{if(!e.target.result.objectStoreNames.contains('videos'))e.target.result.createObjectStore('videos',{keyPath:'id'})};q.onsuccess=e=>{db=e.target.result;r()};q.onerror=()=>{db=null;r();};});}
function loadAll(){return new Promise(r=>{if(!db){r(loadFromBackup());return;}try{let tx=db.transaction('videos','readonly');let req=tx.objectStore('videos').getAll();req.onsuccess=()=>{let res=req.result;if(res.length===0)res=loadFromBackup();r(res);};req.onerror=()=>{r(loadFromBackup());};}catch{r(loadFromBackup());}});}
let sy=0;const st=document.getElementById('stage');st.addEventListener('touchstart',e=>{sy=e.touches[0].clientY},{passive:true});st.addEventListener('touchend',e=>{let d=sy-e.changedTouches[0].clientY;if(Math.abs(d)>60){if(d>0){cur++;if(cur>=allVideos.length)cur=0}else{cur--;if(cur<0)cur=allVideos.length-1}currentMuted=true;render();}},{passive:true});
initDB().then(async()=>{let saved=await loadAll();saved.reverse().forEach(v=>{allVideos.unshift({id:v.id,desc:v.desc,data:v.data,type:v.type||'video',likes:v.likes||0,owner:v.owner||APP_OWNER_NICK,commentsList:v.commentsList||v.comments||[]})});render();if(!localStorage.getItem('work_current_user')){let u={id:1,nick:APP_OWNER_NICK,name:'Jonatha'};localStorage.setItem('work_current_user',JSON.stringify(u));}checkAdmin();toast('✅ ADM e Cadastro restaurados!');});
</script>
</body>
