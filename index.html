<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store">
<title>WORK V9 - COM POSTAGEM</title>
<style>
*{margin:0;padding:0;box-sizing:border-box!important}
html,body{height:100dvh!important;overflow:hidden!important;background:#000!important}
.app{width:100%!important;max-width:420px!important;height:100dvh!important;margin:0 auto!important;display:flex!important;flex-direction:column!important;position:relative!important;overflow:hidden!important}
.feedContainer{flex:1!important;overflow-y:scroll!important;scroll-snap-type:y mandatory!important}
.feedContainer::-webkit-scrollbar{display:none}
.post{height:100dvh!important;min-height:100dvh!important;position:relative!important;scroll-snap-align:start!important;background:#111 center/cover no-repeat!important}
.post::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.85) 0%,transparent 50%)}
.top{position:absolute!important;top:10px!important;left:12px!important;right:12px!important;z-index:10!important;display:flex!important;justify-content:space-between!important}
.logo{color:#ff3b00!important;font-weight:900!important}
.onlineBadge{padding:5px 10px!important;border-radius:100px!important;background:#00c851!important;color:#fff!important;font-weight:900!important;font-size:10px!important}
.side{position:absolute!important;right:12px!important;bottom:110px!important;z-index:10!important;display:flex!important;flex-direction:column!important;gap:18px!important}
.sbtn{background:none!important;border:none!important;color:#fff!important;display:flex!important;flex-direction:column!important;align-items:center!important}
.iconBtn{width:52px!important;height:52px!important;border-radius:50%!important;background:#140800!important;border:2px solid #ff4500!important;display:flex!important;align-items:center!important;justify-content:center!important;font-size:24px!important}
.info{position:absolute!important;left:12px!important;right:78px!important;bottom:16px!important;z-index:10!important;background:rgba(8,4,0,.94)!important;border:2px solid #ff3300!important;border-radius:14px!important;padding:10px!important}
.nav{height:62px!important;min-height:62px!important;background:#080400!important;border-top:2px solid #2a1500!important;display:flex!important;flex-shrink:0!important}
.nav button{flex:1!important;background:none!important;border:0!important;color:#5a3a20!important;font-weight:700!important;display:flex!important;flex-direction:column!important;align-items:center!important}
.nav button.active{color:#ff8c00!important}
.plus{width:58px!important;height:58px!important;border-radius:50%!important;background:radial-gradient(circle,#ff6a00,#b52000)!important;color:#fff!important;font-size:28px!important;display:flex!important;align-items:center!important;justify-content:center!important;margin:-22px auto 0!important}
.page{position:absolute!important;inset:0!important;background:#000!important;z-index:300!important;display:none!important;flex-direction:column!important;overflow:auto!important}
.page.show{display:flex!important}
.adReal{position:absolute!important;inset:0!important;background:rgba(0,0,0,.95)!important;z-index:500!important;display:none!important;flex-direction:column!important;align-items:center!important;justify-content:center!important}
.card{background:#111!important;border:1px solid #ff4500!important;border-radius:12px!important;padding:14px!important;margin:10px 12px!important}
.input{width:100%!important;padding:12px!important;border-radius:10px!important;background:#1e1e1e!important;border:1px solid #333!important;color:#fff!important;margin-top:8px!important}
.btn{width:100%!important;padding:12px!important;border-radius:10px!important;background:#fe2c55!important;border:none!important;color:#fff!important;font-weight:900!important;margin-top:10px!important;cursor:pointer!important}
</style>
</head>
<body>
<div class="app">
<div class="feedContainer" id="feedContainer"></div>

<div class="adReal" id="adBox"><div style="background:#111;border:2px solid #00ff00;border-radius:16px;padding:20px;width:90%;max-width:340px;text-align:center"><div style="color:#00ff00;font-weight:900">ANÚNCIO REAL</div><div id="realAdContainer" style="margin:16px 0;min-height:80px;background:#000;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#666">Sem ID = Sem anúncio</div><div style="font-size:11px;color:#666">Fecha em <span id="adTimer">5</span>s</div><button onclick="closeAd()" style="width:100%;padding:12px;border-radius:10px;background:#fe2c55;border:none;color:#fff;font-weight:900;margin-top:10px">✕ FECHAR</button></div></div>

<!-- CRIAR POST - ESSE QUE FALTAVA -->
<div class="page" id="pCriar">
<div style="display:flex;justify-content:space-between;padding:12px"><h2>➕ Criar Post</h2><button onclick="closeAll()" style="background:none;border:none;color:#fff;font-size:22px">✕</button></div>
<div class="card"><div style="font-weight:900">📸 NOVO POST</div><input id="postImg" class="input" placeholder="Link da imagem https://..."><div style="text-align:center;margin:8px 0;color:#666">ou</div><input type="file" id="fileInput" accept="image/*" style="width:100%;color:#fff"><div id="preview" style="margin-top:10px;display:none"><img id="previewImg" style="width:100%;border-radius:12px;max-height:200px;object-fit:cover"></div><input id="postDesc" class="input" placeholder="Descrição do post..."><button class="btn" style="background:linear-gradient(90deg,#ff4500,#ff8c00);color:#000" onclick="criarPost()">🚀 POSTAR AGORA</button></div>
</div>

<div class="page" id="pAdmin">
<div style="display:flex;justify-content:space-between;padding:12px"><h2>👑 ADMIN</h2><button onclick="closeAll()" style="background:none;border:none;color:#fff;font-size:22px">✕</button></div>
<div class="card" style="border-color:#00ff00"><div style="color:#00ff00;font-weight:900">🟢 <span id="onlineCount">1</span> ONLINE</div><div style="font-size:11px">Posts: <span id="statPosts">0</span> | Ads: <span id="statAds">0</span> | <span id="statMoney">R$ 0,00</span></div></div>
<div class="card"><div style="font-weight:900">💰 ID GOOGLE AQUI DENTRO</div><input id="adsenseId" class="input" placeholder="ca-pub-..."><input id="admobId" class="input" placeholder="ca-app-pub-..."><input id="adFreq" class="input" type="number" value="5"><button class="btn" onclick="saveAds()">💾 Salvar</button></div>
</div>

<div class="page" id="pEu">
<div style="display:flex;justify-content:space-between;padding:12px"><b>👤 MEU PERFIL</b><button onclick="closeAll()" style="background:none;border:none;color:#fff;font-size:22px">✕</button></div>
<div style="padding:16px;text-align:center"><div id="perfilFoto" style="width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,#fe2c55,#ff8c00);margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:36px">👑</div><div style="font-weight:900;margin-top:8px" id="perfilNome">ADMIN</div><div style="font-size:12px;color:#aaa" id="perfilUser">@você</div><div style="color:#00ff00;font-size:11px">● <span id="onlinePerfil">1</span> ONLINE</div></div>
<div class="card"><div style="font-weight:900">📝 MEU CADASTRO</div><input id="cadNome" class="input" placeholder="Seu nome"><input id="cadUser" class="input" placeholder="Seu @usuario"><input id="cadBio" class="input" placeholder="Sua bio"><input id="cadFoto" class="input" placeholder="Link foto https://"><button class="btn" style="background:linear-gradient(90deg,#ff4500,#ff8c00);color:#000" onclick="salvarPerfil()">💾 SALVAR PERFIL</button></div>
<div class="card"><button onclick="openAdmin()" style="width:100%;padding:16px;border-radius:12px;background:linear-gradient(90deg,#ff4500,#ff8c00);border:3px solid #fff;color:#000;font-weight:900">👑 PAINEL ADMINISTRADOR</button><div style="font-size:10px;color:#aaa;text-align:center;margin-top:6px">Senha: admin123</div></div>
</div>

<div class="nav">
<button id="b0" class="active" onclick="go(0)">🏠<span>Inicio</span></button>
<button onclick="go(1)">🔍<span>Busca</span></button>
<button onclick="go(2)"><div class="plus">+</div></button>
<button onclick="go(3)">🔴<span>Live</span></button>
<button id="b4" onclick="go(4)">👑<span>Eu</span></button>
</div>
</div>
<script>
let userData=JSON.parse(localStorage.getItem('userPerfil_v2')||'{"nome":"ADMINISTRADOR","user":"@você","bio":"Dono do app","foto":""}');
let posts=JSON.parse(localStorage.getItem('posts_v9')||'[{"owner":"work.influencer","img":"https://images.unsplash.com/photo-1499092346589-b9b6be3e94b2?w=800","desc":"💼 V9 - Com postagem + cadastro","likes":5234}]');
let adConfig=JSON.parse(localStorage.getItem('adConfig_v2')||'{"freq":5,"adsense":"","admob":""}');
let totalAds=parseInt(localStorage.getItem('adViews')||'0')||0, cur=0, adCount=0, online=1, tempImg='';
function updateOnline(){ online=1+Math.floor(Math.random()*5); document.getElementById('onlineCount').innerText=online; document.getElementById('onlinePerfil').innerText=online; document.getElementById('statPosts').innerText=posts.length; document.getElementById('statAds').innerText=totalAds; document.getElementById('statMoney').innerText='R$ '+(totalAds*0.45).toFixed(2); document.getElementById('adFreq').value=adConfig.freq; document.getElementById('adsenseId').value=adConfig.adsense||''; document.getElementById('admobId').value=adConfig.admob||''; document.getElementById('perfilNome').innerText=userData.nome; document.getElementById('perfilUser').innerText=userData.user; document.getElementById('cadNome').value=userData.nome; document.getElementById('cadUser').value=userData.user; document.getElementById('cadBio').value=userData.bio; document.getElementById('cadFoto').value=userData.foto||''; if(userData.foto) document.getElementById('perfilFoto').innerHTML='<img src="'+userData.foto+'" style="width:100%;height:100%;border-radius:50%;object-fit:cover">'; }
function salvarPerfil(){ userData.nome=document.getElementById('cadNome').value||'ADMIN'; userData.user=document.getElementById('cadUser').value||'@você'; userData.bio=document.getElementById('cadBio').value||''; userData.foto=document.getElementById('cadFoto').value||''; localStorage.setItem('userPerfil_v2',JSON.stringify(userData)); updateOnline(); alert('✅ Salvo!'); }
function renderFeed(){ document.getElementById('feedContainer').innerHTML=posts.map((p,i)=>`<div class="post" style="background-image:url('${p.img}')"><div class="top"><div class="logo">💼 WORK</div><div class="onlineBadge">🟢 ${online} ONLINE</div></div><div class="side"><button class="sbtn" onclick="like(${i})"><div class="iconBtn">${p.liked?'❤️':'🤍'}</div><small>${p.likes}</small></button></div><div class="info"><div style="font-weight:900">@${p.owner}</div><div>${p.desc}</div></div></div>`).join(''); }
function criarPost(){ let img=document.getElementById('postImg').value||tempImg; let desc=document.getElementById('postDesc').value||'Novo post'; if(!img){alert('Coloca imagem');return;} posts.unshift({owner:userData.user.replace('@','')||'voce',img:img,desc:desc,likes:0,liked:false}); localStorage.setItem('posts_v9',JSON.stringify(posts)); document.getElementById('postImg').value=''; document.getElementById('postDesc').value=''; tempImg=''; document.getElementById('preview').style.display='none'; renderFeed(); closeAll(); go(0); alert('✅ Post criado!'); updateOnline(); }
function like(i){ posts[i].liked=!posts[i].liked; posts[i].likes+=(posts[i].liked?1:-1); localStorage.setItem('posts_v9',JSON.stringify(posts)); renderFeed(); }
function showAd(){ adCount++; if(adCount%parseInt(adConfig.freq||5)!==0) return; if(!adConfig.adsense&&!adConfig.admob) return; document.getElementById('adBox').style.display='flex'; totalAds++; localStorage.setItem('adViews',totalAds+''); let t=5; let timer=setInterval(()=>{t--; document.getElementById('adTimer').innerText=t; if(t<=0) clearInterval(timer)},1000); }
function closeAd(){ document.getElementById('adBox').style.display='none'; }
function go(n){ if(n===2){ document.querySelectorAll('.page').forEach(p=>p.classList.remove('show')); document.getElementById('pCriar').classList.add('show'); return; } document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active')); document.getElementById('b'+n)?.classList.add('active'); document.querySelectorAll('.page').forEach(p=>p.classList.remove('show')); if(n===4) document.getElementById('pEu').classList.add('show'); if(n===0) showAd(); }
function closeAll(){ document.querySelectorAll('.page').forEach(p=>p.classList.remove('show')); document.getElementById('adBox').style.display='none'; }
function openAdmin(){ let s=prompt('Senha:'); if(s==='admin123'){ document.getElementById('pAdmin').classList.add('show'); updateOnline(); } }
function saveAds(){ adConfig.freq=parseInt(document.getElementById('adFreq').value)||5; adConfig.adsense=document.getElementById('adsenseId').value.trim(); adConfig.admob=document.getElementById('admobId').value.trim(); localStorage.setItem('adConfig_v2',JSON.stringify(adConfig)); alert('✅ Salvo!'); closeAll(); }
document.getElementById('fileInput').addEventListener('change',function(e){ let r=new FileReader(); r.onload=function(ev){ tempImg=ev.target.result; document.getElementById('previewImg').src=tempImg; document.getElementById('preview').style.display='block'; }; r.readAsDataURL(e.target.files[0]); });
document.getElementById('feedContainer').addEventListener('scroll',()=>{ let c=document.getElementById('feedContainer'); let nc=Math.round(c.scrollTop/c.clientHeight); if(nc!==cur){cur=nc; showAd();} });
renderFeed(); updateOnline();
</script>
</body>
</html>
