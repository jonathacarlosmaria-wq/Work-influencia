<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WORK FIRE - LIVE REAL FUNCIONANDO</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif;text-align:center;padding:10px}
#liveVideo{width:100%;max-width:400px;height:60vh;background:#111;border:3px solid red;border-radius:14px;margin:10px auto;display:block}
button{padding:15px;margin:6px;border:none;border-radius:12px;font-weight:900;width:90%;max-width:320px;cursor:pointer}
.btn-live{background:linear-gradient(90deg,red,orange);color:#fff}
.btn-watch{background:#222;color:#fff;border:1.5px solid red}
input{padding:12px;border-radius:10px;border:1px solid orange;background:#111;color:#fff;width:90%;max-width:300px;margin:8px}
#meuID{background:#111;border:1px dashed orange;padding:8px;border-radius:8px;margin:10px auto;max-width:400px;font-size:12px;word-break:break-all}
</style>
</head>
<body>
<h3>🔴 WORK FIRE - LIVE REAL</h3>
<div id="meuID">Gerando seu ID...</div>
<input id="nomeUser" placeholder="Seu @ nome">
<br>
<button onclick="salvar()" style="background:orange;width:180px">SALVAR</button>
<video id="liveVideo" autoplay playsinline muted></video>
<p id="status">Canal: live1 - Aguardando</p>

<input id="idRemoto" placeholder="ID da live pra assistir (cole aqui)">
<br>
<button class="btn-live" onclick="startLive()">🔴 COMEÇAR MINHA LIVE</button>
<button class="btn-watch" onclick="assistir()">👁️ ASSISTIR LIVE DO ID</button>
<button onclick="parar()" style="background:#fff;color:red;width:150px">ENCERRAR</button>
<br><br>
<div style="background:#111;padding:10px;border-radius:8px;max-width:400px;margin:0 auto;text-align:left;font-size:11px">
<b>Como usar LIVE REAL:</b><br>
1. Salva seu @ nome<br>
2. Clica COMEÇAR LIVE - seu ID aparece em cima<br>
3. Manda seu ID pro amigo colar no campo e clicar ASSISTIR<br>
4. LIVE REAL instantânea, sem token, sem expirar!
</div>

<script>
let peer=null, localStream=null, meuID="", userNome=localStorage.getItem("userNome")||"";
document.getElementById("nomeUser").value=userNome;
let videoEl=document.getElementById("liveVideo");
let statusEl=document.getElementById("status");

function initPeer(){
  peer=new Peer();
  peer.on('open', id=>{
    meuID=id;
    document.getElementById("meuID").innerHTML="SEU ID DE LIVE: <b style='color:#00ff88'>"+id+"</b><br><small>Copia e manda pra quem vai assistir</small>";
    statusEl.innerText="Pronto @"+(userNome||"")+" - ID: "+id;
  });
  peer.on('call', async call=>{
    let stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});
    localStream=stream;
    videoEl.srcObject=stream;
    call.answer(stream);
    statusEl.innerText="🔴 AO VIVO - Alguém assistindo!";
  });
}
initPeer();

function salvar(){
  let n=document.getElementById("nomeUser").value.trim().toLowerCase();
  if(!n){alert("Digite nome");return;}
  userNome=n; localStorage.setItem("userNome",n);
  statusEl.innerText="Salvo @"+n+" - ID: "+meuID;
  alert("Salvo @"+n);
}

async function startLive(){
  if(!userNome){alert("Salva nome");return;}
  try{
    localStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});
    videoEl.srcObject=localStream;
    videoEl.muted=true;
    statusEl.innerText="🔴 AO VIVO! Seu ID: "+meuID+" - Manda pros outros assistirem";
    alert("🔴 LIVE INICIADA!\n\nSeu ID: "+meuID+"\n\nManda esse ID pra quem quiser assistir colar no campo de baixo.");
  }catch(e){alert("Erro camera: "+e.message);}
}

async function assistir(){
  let remoteID=document.getElementById("idRemoto").value.trim();
  if(!remoteID){alert("Cole o ID da live que você quer assistir");return;}
  try{
    statusEl.innerText="Conectando na live "+remoteID+"...";
    let stream=await navigator.mediaDevices.getUserMedia({video:false,audio:true}).catch(()=>null);
    let call=peer.call(remoteID, stream || new MediaStream());
    call.on('stream', remoteStream=>{
      videoEl.srcObject=remoteStream;
      videoEl.muted=false;
      statusEl.innerText="👁️ ASSISTINDO LIVE de "+remoteID;
    });
    call.on('error', e=>alert("Erro: "+e));
  }catch(e){alert(e.message);}
}

function parar(){
  if(localStream){localStream.getTracks().forEach(t=>t.stop());}
  videoEl.srcObject=null;
  statusEl.innerText="Live encerrada";
}
</script>
</body>
</html>
