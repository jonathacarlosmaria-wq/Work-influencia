<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WORK - FOTO + SEGUIR + OURO BALANÇANDO FINAL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#000;color:#fff;font-family:Arial;height:100dvh;overflow:hidden}
.app{height:100dvh;display:flex;flex-direction:column}
.stage{flex:1;position:relative;background:#000;overflow:hidden;touch-action:none}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
.grad{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.95) 0%,transparent 60%)}
.top{position:absolute;top:10px;left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:10}
.pill{padding:7px 12px;border-radius:20px;font-size:10px;font-weight:900;background:rgba(0,0,0,.7);border:1px solid #333}.pill.on{background:#FFD700;color:#000;box-shadow:0 0 12px gold}
.actions{position:absolute;right:8px;bottom:110px;display:flex;flex-direction:column;gap:12px;z-index:20;width:70px;align-items:center}
.abtn{width:56px;height:56px;border-radius:18px;background:#1e1e1e;border:1.5px solid #D4AF37;display:flex;align-items:center;justify-content:center;font-size:22px}
.cnt{font-size:9px;font-weight:900;margin-top:3px;background:rgba(0,0,0,.6);padding:2px 6px;border-radius:10px}
.meta{position:absolute;left:10px;bottom:12px;right:84px;z-index:10;background:rgba(0,0,0,.55);padding:10px;border-radius:16px;border:1px solid #333}
.nav{height:92px;background:linear-gradient(180deg,#FFE55C,#FFD700,#D4AF37)!important;display:flex;justify-content:space-around;align-items:center;border-radius:26px 26px 0 0;margin-top:-16px;z-index:50;border-top:3px solid #FFD700;box-shadow:0 -4px 22px rgba(255,215,0,.5)}
.tab{color:#3d2e00;font-size:10px;font-weight:900;text-align:center;padding:8px 10px;border-radius:16px;min-width:56px;cursor:pointer}
.tab.on{background:#000;color:#FFD700}
.create{width:70px;height:50px;background:#000;border-radius:18px;display:flex;align-items:center;justify-content:center;border:2px solid #FFD700}
.create span{background:#FFD700;color:#000;width:100%;height:100%;display:flex;align-items:center;justify-content:center;border-radius:14px;font-size:32px;font-weight:900}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:1000;display:none;flex-direction:column}.modal.on{display:flex!important}
#toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#FFD700;color:#000;padding:12px 20px;border-radius:20px;z-index:8000;display:none;font-weight:900}#toast.on{display:block!important}
@keyframes goldShake{0%{transform:translateX(0) scale(1)}15%{transform:translateX(-6px) rotate(-3deg) scale(1.08);box-shadow:0 0 28px gold}30%{transform:translateX(6px) rotate(3deg) scale(1.1)}45%{transform:translateX(-4px) rotate(-1deg) scale(1.04)}100%{transform:translateX(0) scale(1)}}
.btn-gold{background:linear-gradient(145deg,#FFE55C,#FFD700,#D4AF37)!important;color:#000!important;border:2px solid #FFD700!important;font-weight:900;cursor:pointer}
.shaking{animation:goldShake.5s ease!important}
.input{width:100%;background:#111;border:1px solid #333;padding:11px;border-radius:12px;color:#fff;margin-top:7px;outline:none}
</style>
</head>
<body>
<div id="toast"></div>
<div class="app"><div class="stage" id="stage"></div>
<div class="nav">
<div class="tab on" onclick="shakeGold(this); goHome()">🏠<br>Início</div>
<div class="tab" onclick="shakeGold(this); goMy()">◧<br>Meus</div>
<div onclick="shakeGold(this); goCam()"><div class="create"><span>+</span></div></div>
<div class="tab" onclick="shakeGold(this); goCam(true)">🔴<br>LIVE</div>
<div class="tab" onclick="shakeGold(this); goProfile()">👤<br>Eu</div>
</div></div>

<div class="modal" id="profileM"><div style="flex:1" onclick="closeAll()"></div><div style="position:absolute;bottom:0;left:0;right:0;background:#1e1e1e;border-radius:28px 28px 0 0;padding:16px;border-top:3px solid #FFD700;max-height:94vh;overflow:auto">
<div style="display:flex;justify-content:space-between"><b style="color:#FFD700">👤 PERFIL • FOTO + SEGUIR</b><span onclick="closeAll()" style="font-size:26px;color:#FFD700;cursor:pointer">×</span></div>
<div style="text-align:center;padding:12px;background:rgba(0,0,0,.3);border-radius:20px;margin:10px 0;border:1px solid rgba(255,215,0,.15)">
<div id="avatarBox" style="width:110px;height:110px;margin:0 auto;border-radius:28px;background:#111;border:3px solid #FFD700;display:flex;align-items:center;justify-content:center;font-size:32px;overflow:hidden;box-shadow:0 0 20px rgba(255,215,0,.3)">👤</div>
<h3 id="profileName" style="color:#fff;margin-top:10px;font-size:18px;font-weight:900">Jonatha</h3><p id="profileNick" style="color:#FFD700;font-size:12px">@jonathacarlosmaria</p>
<div style="display:flex;gap:8px;justify-content:center;margin-top:12px"><button id="followBtn" onclick="toggleFollow()" class="btn-gold" style="flex:1;padding:12px 20px;border-radius:20px;font-size:13px;max-width:140px"><span id="followText">➕ SEGUIR</span></button><button onclick="shakeGold(this); shareProfile()" style="padding:12px 16px;border-radius:20px;background:rgba(255,215,0,.15);color:#FFD700;border:1px solid #FFD700">🔗</button></div>
<div style="display:flex;justify-content:space-around;margin-top:14px"><div><div style="font-weight:900">0</div><div style="font-size:10px;color:#888">Seguindo</div></div><div><div style="font-weight:900">1.2k</div><div style="font-size:10px;color:#888">Seguidores</div></div><div><div style="font-weight:900">4.8k</div><div style="font-size:10px;color:#888">Curtidas</div></div></div>
</div>
<div id="adminArea" style="display:none;margin:8px 0"><button onclick="shakeGold(this); openAdmin()" class="btn-gold" style="width:100%;padding:12px;border-radius:16px">🔧 PAINEL ADMIN</button></div>
<button onclick="shakeGold(this); pickAvatar()" style="width:100%;margin:8px 0;padding:10px;border-radius:12px;background:rgba(255,215,0,.12);color:#FFD700;border:1.5px dashed #FFD700;font-weight:800">📸 Trocar Foto - Aparece no feed</button>
<input id="inName" class="input" placeholder="Nome"><input id="inNick" class="input" placeholder="Nick"><textarea id="inBio" class="input" placeholder="Bio" style="min-height:60px"></textarea>
<button onclick="shakeGold(this); saveProfile()" class="btn-gold" style="width:100%;padding:12px;border-radius:16px;margin-top:10px">💾 SALVAR</button><p id="accInfo" style="color:#FFD700;text-align:center;margin:10px 0;font-size:12px">jonathacarlosmaria@gmail.com</p>
</div></div>

<div class="modal" id="commentsM" style="z-index:2000"><div style="flex:1" onclick="closeAll()"></div><div style="position:absolute;bottom:0;left:0;right:0;background:#1f1f1f;border-radius:28px 28px 0 0;max-height:85vh;display:flex;flex-direction:column;border-top:3px solid #FFD700"><div style="padding:14px 18px;display:flex;justify-content:space-between;border-bottom:1px solid #333"><span style="color:#FFD700;font-weight:900">💬 <span id="commentCount">0</span></span><span onclick="closeAll()" style="font-size:26px;color:#FFD700;cursor:pointer">×</span></div><div id="commentsList" style="flex:1;overflow:auto;padding:10px 14px;display:flex;flex-direction:column;gap:8px;max-height:55vh"></div><div style="padding:12px 14px;display:flex;gap:8px;background:#111;border-top:1px solid #333"><input id="commentInput" placeholder="Comentar..." style="flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(212,175,55,.2);border-radius:20px;padding:12px 14px;color:#fff;outline:none" onkeypress="if(event.key==='Enter') sendComment()"><button onclick="sendComment()" class="btn-gold" style="width:44px;height:44px;border-radius:50%">➤</button></div></div></div>

<div class="modal" id="adminM"><div style="flex:1" onclick="closeAll()"></div><div style="position:absolute;bottom:0;left:0;right:0;background:#0f0f0f;border-radius:28px 28px 0 0;padding:16px;border-top:3px solid #00FF88;max-height:90vh;overflow:auto"><div style="display:flex;justify-content:space-between"><b style="color:#00FF88">🔧 ADMIN</b><span onclick="closeAll()" style="font-size:26px;color:#00FF88;cursor:pointer">×</span></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0"><div style="background:#1a1a1a;padding:10px;border-radius:12px;text-align:center"><div id="uCount" style="font-weight:900">0</div><div style="font-size:8px;color:#888">USERS</div></div><div style="background:#1a1a1a;padding:10px;border-radius:12px;text-align:center;border:1px solid #FFD700"><div id="vCount" style="font-weight:900">0</div><div style="font-size:8px;color:#888">VÍDEOS</div></div><div style="background:#1a1a1a;padding:10px;border-radius:12px;text-align:center"><div id="lCount" style="font-weight:900">0</div><div style="font-size:8px;color:#888">LIVES</div></div></div></div></div>

<div id="cam" style="position:fixed;inset:0;background:#000;z-index:999;display:none;flex-direction:column"><video id="camEl" autoplay muted playsinline style="flex:1;width:100%;object-fit:cover"></video><div style="position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:14px"><button onclick="closeCam()" style="width:38px;height:38px;background:rgba(0,0,0,.7);border:none;border-radius:50%;color:#fff">✕</button><span id="camTag" style="background:red;padding:7px 12px;border-radius:20px;font-size:11px;font-weight:900">● GRAVANDO</span><button onclick="postVideo()" style="background:#fff;color:#000;border:none;padding:7px 16px;border-radius:20px;font-weight:900">POSTAR</button></div><div style="position:absolute;bottom:0;left:0;right:0;padding:12px;display:flex;gap:8px"><button onclick="flipCam()" style="width:44px;height:44px;background:rgba(255,255,255,.2);border-radius:50%">🔄</button><input id="descInp" placeholder="Legenda..." style="flex:1;padding:12px;border-radius:20px;background:rgba(0,0,0,.6);border:1px solid #444;color:#fff"></div></div>
<div class="modal" id="myM"><div style="flex:1" onclick="closeAll()"></div><div style="position:absolute;bottom:0;left:0;right:0;background:#1d1d1d;border-radius:28px 28px 0 0;padding:16px;border-top:2px solid #FFD700;max-height:80vh;overflow:auto"><b style="color:#FFD700">✨ Meus</b><span style="float:right;cursor:pointer" onclick="closeAll()">×</span><div id="myGrid" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:12px"></div></div></div>
<div class="modal" id="adM"><div style="flex:1;display:flex;align-items:center;justify-content:center;padding:20px"><div style="background:#fff;color:#000;border-radius:20px;padding:20px;width:100%;max-width:300px;text-align:center"><div style="font-size:40px">💰</div><button onclick="closeAd()" class="btn-gold" style="width:100%;margin-top:10px;padding:12px;border-radius:12px">Continuar</button></div></div></div>
<input type="file" id="fileAvatar" accept="image/*" style="display:none">

<script>
function shakeGold(el){if(!el)return;el.classList.remove('shaking');void el.offsetWidth;el.classList.add('shaking');if(navigator.vibrate)navigator.vibrate(70);setTimeout(()=>el.classList.remove('shaking'),520);}
let db=null,stream=null,rec=null,chunks=[],cur=0,facing='user',viewCount=0,isFollowing=false;
let allVideos=[
{id:1,desc:"Video 1 - Foto + Seguir no feed",img:"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?q=80&w=1000",likes:230,share:20,comments:[]},
{id:2,desc:"Video 2 - Like, Comment, Share funcionando",img:"https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?q=80&w=1000",likes:230,share:20,comments:[]},
{id:3,desc:"Video 3 - Barra dourada balançando",img:"https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=1000",likes:340,share:30,comments:[]}
];
function toast(t){let e=document.getElementById('toast');e.innerText=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2000)}
function closeAll(){document.querySelectorAll('.modal').forEach(m=>{m.classList.remove('on');m.style.display='none'})}
function closeAd(){document.getElementById('adM').classList.remove('on');document.getElementById('adM').style.display='none'}
function isAdmin(){let c=JSON.parse(localStorage.getItem('work_current_user')||'null');return c&&c.email.toLowerCase().includes('jonatha')}
function openAdmin(){if(!isAdmin())return;document.getElementById('adminM').classList.add('on');document.getElementById('adminM').style.display='flex';let u=JSON.parse(localStorage.getItem('work_users')||'[]');document.getElementById('uCount').innerText=u.length;document.getElementById('vCount').innerText=allVideos.length;}
function goHome(){closeAll();render()} function goMy(){loadAll().then(vs=>{document.getElementById('myGrid').innerHTML=vs.map(v=>`<video src="${v.data}" style="width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:12px"></video>`).join('')||'<div style="color:#888">Nenhum</div>';document.getElementById('myM').classList.add('on');document.getElementById('myM').style.display='flex';});}
function goProfile(){let c=JSON.parse(localStorage.getItem('work_current_user')||'null');if(!c){c={id:1,email:'jonathacarlosmaria@gmail.com',nick:'jonathacarlosmaria',name:'Jonatha'};localStorage.setItem('work_users',JSON.stringify([c]));localStorage.setItem('work_current_user',JSON.stringify(c));}document.getElementById('inName').value=c.name;document.getElementById('inNick').value=c.nick;document.getElementById('accInfo').innerText=c.email;document.getElementById('adminArea').style.display=isAdmin()?'block':'none';document.getElementById('profileName').innerText=c.name;document.getElementById('profileNick').innerText='@'+c.nick;if(c.avatar)document.getElementById('avatarBox').innerHTML=`<img src="${c.avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:26px">`;else{let v=allVideos[cur];if(v&&v.img)document.getElementById('avatarBox').innerHTML=`<img src="${v.img}" style="width:100%;height:100%;object-fit:cover;border-radius:26px">`;}document.getElementById('profileM').classList.add('on');document.getElementById('profileM').style.display='flex';}
function saveProfile(){let c=JSON.parse(localStorage.getItem('work_current_user'));c.name=document.getElementById('inName').value;c.nick=document.getElementById('inNick').value;localStorage.setItem('work_current_user',JSON.stringify(c));document.getElementById('profileName').innerText=c.name;document.getElementById('profileNick').innerText='@'+c.nick;toast('✅ Salvo');setTimeout(closeAll,500);render();}
function likeVideo(){allVideos[cur].likes++;render();toast('❤️')}
async function shareVideo(){let v=allVideos[cur];let url=location.href.split('?')[0]+'?v='+v.id;if(navigator.share){try{await navigator.share({title:'WORK',text:v.desc,url:url});v.share++;render();toast('✅ Compartilhado');return;}catch(e){}}try{await navigator.clipboard.writeText(url);v.share++;render();toast('🔗 Link copiado')}catch{prompt('Copie:',url);v.share++;render();}}
function shareProfile(){let c=JSON.parse(localStorage.getItem('work_current_user'));let url=location.href.split('?')[0]+'/@'+(c?c.nick:'jonathacarlosmaria');navigator.clipboard.writeText(url);toast('🔗 Perfil copiado')}
function toggleFollow(){let btn=document.getElementById('followBtn');let txt=document.getElementById('followText');let plus=document.getElementById('followPlus');if(btn)shakeGold(btn);if(plus)shakeGold(plus);isFollowing=!isFollowing;if(isFollowing){if(txt)txt.innerText='✅ SEGUINDO';if(btn){btn.style.background='#000';btn.style.color='#FFD700';}if(plus){plus.innerText='✓';plus.style.background='#000';plus.style.color='#FFD700';plus.style.borderColor='#FFD700';}toast('✅ Seguindo')}else{if(txt)txt.innerText='➕ SEGUIR';if(btn){btn.style.background='linear-gradient(145deg,#FFE55C,#FFD700,#D4AF37)';btn.style.color='#000';}if(plus){plus.innerText='+';plus.style.background='#FF3B30';}toast('❌ Deixou de seguir')}}
function openComments(){let v=allVideos[cur];try{let s=JSON.parse(localStorage.getItem('work_comments_'+v.id)||'null');if(s)v.comments=s;}catch{}if(!v.comments)v.comments=[];document.getElementById('commentCount').innerText=v.comments.length;document.getElementById('commentsList').innerHTML=v.comments.map((c,i)=>`<div style="display:flex;gap:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,215,0,.15);border-radius:14px;padding:10px"><div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(145deg,#FFD700,#D4AF37);display:flex;align-items:center;justify-content:center;color:#000;font-weight:900;font-size:12px">${c.user.charAt(1).toUpperCase()}</div><div style="flex:1"><div style="display:flex;justify-content:space-between"><div style="font-size:11px;color:#FFD700;font-weight:900">${c.user}</div><div style="font-size:9px;color:#666">${c.time||'agora'}</div></div><div style="font-size:13px;color:#fff;margin-top:2px">${c.text}</div><div style="display:flex;gap:12px;margin-top:6px"><span onclick="likeComment(${i})" style="font-size:11px;color:#888;cursor:pointer">❤️ ${c.likes||0}</span><span onclick="document.getElementById('commentInput').value='${c.user} ';document.getElementById('commentInput').focus()" style="font-size:11px;color:#888;cursor:pointer">↩️ Responder</span></div></div></div>`).join('')||'<div style="color:#666;text-align:center;padding:20px">💬 Nenhum comentário</div>';document.getElementById('commentsM').classList.add('on');document.getElementById('commentsM').style.display='flex';}
function sendComment(){let c=JSON.parse(localStorage.getItem('work_current_user')||'null');if(!c){toast('Login');return;}let input=document.getElementById('commentInput');let t=input.value.trim();if(!t)return;let v=allVideos[cur];if(!v.comments)v.comments=[];v.comments.unshift({user:'@'+(c.nick||c.email.split('@')[0]),text:t,time:new Date().toLocaleTimeString().slice(0,5),likes:0});input.value='';localStorage.setItem('work_comments_'+v.id,JSON.stringify(v.comments));openComments();render();toast('💬 Comentado');}
function likeComment(i){let v=allVideos[cur];if(!v.comments[i].likes)v.comments[i].likes=0;v.comments[i].likes++;localStorage.setItem('work_comments_'+v.id,JSON.stringify(v.comments));openComments();}
function render(){
 let v=allVideos[cur];
 let c=JSON.parse(localStorage.getItem('work_current_user')||'null');
 let userAvatar=c&&c.avatar? c.avatar : v.img;
 let media=v.data?`<video src="${v.data}" autoplay loop muted playsinline style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"></video>`:`<div class="bg" style="background-image:url('${v.img}')"></div>`;
 document.getElementById('stage').innerHTML=`${media}<div class="grad"></div>
 <div class="top"><div class="pill">${cur+1}/${allVideos.length}</div><div class="pill on">FOTO + SEGUIR + OURO</div></div>
 <div class="actions">
  <div style="position:relative;width:58px;height:58px;margin-bottom:4px;cursor:pointer" onclick="shakeGold(this); toggleFollow()">
    <div style="width:56px;height:56px;border-radius:50%;border:3px solid #FFD700;overflow:hidden;background:#111;box-shadow:0 0 15px rgba(255,215,0,.5)"><img src="${userAvatar}" style="width:100%;height:100%;object-fit:cover"></div>
    <div id="followPlus" style="position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);width:22px;height:22px;background:${isFollowing?'#000':'#FF3B30'};border:2px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;color:${isFollowing?'#FFD700':'#fff'};font-size:12px;font-weight:900;border-color:${isFollowing?'#FFD700':'#fff'}">${isFollowing?'✓':'+'}</div>
  </div>
  <div onclick="let b=this.querySelector('.abtn');shakeGold(b);likeVideo()"><div class="abtn">❤️</div><div class="cnt">${v.likes}</div></div>
  <div onclick="let b=this.querySelector('.abtn');shakeGold(b);openComments()"><div class="abtn">💬</div><div class="cnt">${v.comments? v.comments.length:0}</div></div>
  <div onclick="let b=this.querySelector('.abtn');shakeGold(b);shareVideo()"><div class="abtn">🔗</div><div class="cnt">${v.share}</div></div>
 </div>
 <div class="meta"><div style="font-weight:700;font-size:13px">${v.desc}</div><div style="font-size:10px;color:#FFD700;margin-top:3px">@${c?c.nick:'jonathacarlosmaria'} • Foto no feed + Seguir + Compartilhar + Comentários</div></div>`;
}
function nextVideo(){cur=(cur+1)%allVideos.length;viewCount++;if(viewCount%5===0)testAd();render()} function prevVideo(){cur=(cur-1+allVideos.length)%allVideos.length;render()}
function goCam(isLive){document.getElementById('camTag').innerText=isLive?'🔴 AO VIVO':'● GRAVANDO';document.getElementById('cam').style.display='flex';navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:true}).then(s=>{stream=s;document.getElementById('camEl').srcObject=s;chunks=[];rec=new MediaRecorder(s);rec.ondataavailable=e=>chunks.push(e.data);rec.start();});}
function closeCam(){if(rec)rec.stop();if(stream)stream.getTracks().forEach(t=>t.stop());document.getElementById('cam').style.display='none';}
function flipCam(){facing=facing==='user'?'environment':'user';if(stream)stream.getTracks().forEach(t=>t.stop());navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:true}).then(s=>{stream=s;document.getElementById('camEl').srcObject=s;chunks=[];rec=new MediaRecorder(s);rec.ondataavailable=e=>chunks.push(e.data);rec.start();});}
function postVideo(){if(!rec)return;rec.stop();let blob=new Blob(chunks,{type:'video/webm'});let r=new FileReader();r.onload=e=>{let tx=db.transaction('videos','readwrite');let vid={id:Date.now(),user:'jonatha',data:e.target.result,desc:document.getElementById('descInp').value||'Meu vídeo'};tx.objectStore('videos').add(vid);tx.oncomplete=()=>{allVideos.unshift({id:vid.id,desc:vid.desc,data:vid.data,likes:0,share:0,comments:[]});closeCam();document.getElementById('descInp').value='';toast('✅ Salvo');render();}};r.readAsDataURL(blob);}
function initDB(){return new Promise(r=>{let q=indexedDB.open('WorkDB_FOTO_SEGUIR_FINAL',1);q.onupgradeneeded=e=>e.target.result.createObjectStore('videos',{keyPath:'id'});q.onsuccess=e=>{db=e.target.result;r()}})}
function loadAll(){return new Promise(r=>{if(!db)return r([]);let tx=db.transaction('videos','readonly');let req=tx.objectStore('videos').getAll();req.onsuccess=()=>r(req.result)})}
function pickAvatar(){document.getElementById('fileAvatar').click();} function deleteAcc(){localStorage.removeItem('work_current_user');toast('Cancelada');closeAll();}
document.getElementById('fileAvatar').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=ev=>{let b64=ev.target.result;let c=JSON.parse(localStorage.getItem('work_current_user'));c.avatar=b64;localStorage.setItem('work_current_user',JSON.stringify(c));document.getElementById('avatarBox').innerHTML=`<img src="${b64}" style="width:100%;height:100%;object-fit:cover;border-radius:26px">`;render();toast('📸 Foto atualizada no feed!');};rd.readAsDataURL(f);});
let sy=0;const st=document.getElementById('stage');st.addEventListener('touchstart',e=>{sy=e.touches[0].clientY},{passive:true});st.addEventListener('touchend',e=>{let d=sy-e.changedTouches[0].clientY;if(Math.abs(d)>60){if(d>0)nextVideo();else prevVideo();}},{passive:true});
initDB().then(async()=>{let saved=await loadAll();saved.reverse().forEach(v=>{allVideos.unshift({id:v.id,desc:v.desc,data:v.data,likes:0,share:0,comments:[]})});render();if(!localStorage.getItem('work_current_user')){let u={id:1,email:'jonathacarlosmaria@gmail.com',nick:'jonathacarlosmaria',name:'Jonatha'};localStorage.setItem('work_users',JSON.stringify([u]));localStorage.setItem('work_current_user',JSON.stringify(u));}});
</script>
