<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>WORK GOLD V54 SEM CORTE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100dvh;background:#000;overflow:hidden}
.app{width:100%;max-width:420px;height:100dvh;margin:0 auto;background:#000;position:relative;display:flex;flex-direction:column}
.stage{flex:1;position:relative;background:#000;overflow:hidden}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;background-color:#111}
.right{position:absolute;right:10px;bottom:90px;z-index:5;display:flex;flex-direction:column;gap:14px}
.btn{width:52px;height:52px;border-radius:50%;background:#1f1f1f;border:2px solid #FFD700;display:flex;align-items:center;justify-content:center;color:#FFD700;font-size:20px}
.num{font-size:11px;color:#fff;font-weight:900;text-align:center;margin-top:3px}
.nav{height:60px;min-height:60px;background:#0a0a0a;border-top:2px solid #FFD700;display:flex;justify-content:space-around;align-items:center;flex-shrink:0}

/* MODAL 100% LARGURA - CORREÇÃO DO CORTE NO MEIO */
.modal{position:absolute;left:0;right:0;top:0;bottom:0;width:100%;background:rgba(0,0,0,.6);z-index:100;display:none;flex-direction:column;justify-content:flex-end}
.modal.on{display:flex}
.box{width:100%!important;max-width:100%!important;transform:none!important;margin:0!important;background:#181818;border-top:3px solid #FFD700;border-radius:20px 20px 0 0;display:flex;flex-direction:column;max-height:78dvh}
.list{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.bar{flex-shrink:0;padding:12px;background:#0f0f0f;border-top:1.5px solid #FFD700;display:flex;gap:8px;padding-bottom:16px}
.inp{flex:1;background:#222;border:2px solid #FFD700;border-radius:100px;padding:12px 16px;color:#fff;font-size:16px;outline:none}
.send{padding:12px 18px;border-radius:100px;background:#FFD700;color:#000;font-weight:900;border:none}
.toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#FFD700;color:#000;padding:10px 18px;border-radius:100px;font-weight:900;display:none;z-index:200}.toast.on{display:block}
</style>
</head>
<body>
<div class="app">
<div class="stage" id="stage">
<div class="bg" id="bg"></div>
<div style="position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(30,30,30,.9);border:1px solid #FFD700;border-radius:100px;padding:4px;display:flex;gap:6px;z-index:5"><div style="padding:7px 14px;border-radius:100px;color:#888;font-size:12px;font-weight:900">Seguindo</div><div style="padding:7px 14px;border-radius:100px;background:#FFD700;color:#000;font-size:12px;font-weight:900">Para você</div></div>
<div style="position:absolute;top:12px;right:10px;z-index:5;background:#1a1a1a;border:1.5px solid #FFD700;color:#FFD700;padding:5px 10px;border-radius:100px;font-size:10px;font-weight:900">🔴 LIVE</div>
<div class="right">
<div onclick="like()" style="text-align:center"><div class="btn" id="bL">🤍</div><div class="num" id="nL">120.3K</div></div>
<div onclick="openC()" style="text-align:center"><div class="btn" style="background:#FFD700;color:#000;border-color:#000">💬</div><div class="num" id="nC">3</div></div>
<div onclick="save()" style="text-align:center"><div class="btn" id="bS">🔖</div><div class="num">Salvar</div></div>
<div onclick="share()" style="text-align:center"><div class="btn">↗</div><div class="num">Share</div></div>
</div>
<div style="position:absolute;left:10px;right:76px;bottom:10px;z-index:5"><div style="background:rgba(15,15,15,.9);border:1px solid rgba(255,215,0,.4);border-radius:14px;padding:10px"><div style="display:flex;gap:8px;align-items:center"><div style="width:32px;height:32px;border-radius:50%;background:#222;border:2px solid #FFD700;display:flex;align-items:center;justify-content:center;color:#FFD700;font-weight:900" id="uP">L</div><div style="color:#FFD700;font-weight:900;font-size:13px" id="uN">@lux.studio</div></div><div style="font-size:12px;margin-top:4px;color:#fff" id="uD">Golden city views at sunset ✨ #gold</div></div></div>
<div id="toast" class="toast"></div>

<div class="modal" id="mC">
<div style="flex:1" onclick="closeM()"></div>
<div class="box">
<div style="padding:12px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2a2a2a;flex-shrink:0">
<b style="color:#FFD700" id="cT">💬 3 comentários</b>
<button onclick="closeM()" style="width:30px;height:30px;border-radius:50%;background:#222;border:1px solid #FFD700;color:#FFD700">×</button>
</div>
<div class="list" id="cL"></div>
<div class="bar">
<input id="cI" class="inp" placeholder="Escreva um comentário...">
<button class="send" onclick="sendC()">Enviar</button>
</div>
</div>
</div>
</div>

<div class="nav">
<div style="color:#FFD700;font-size:10px;font-weight:900;text-align:center">⌂<br>Início</div>
<div style="color:#666;font-size:10px;font-weight:900;text-align:center">⌕<br>Buscar</div>
<div style="text-align:center"><div style="width:42px;height:42px;border-radius:50%;background:#000;border:2px solid #FFD700;display:flex;align-items:center;justify-content:center;color:#FFD700;margin:0 auto">+</div></div>
<div style="color:#666;font-size:10px;font-weight:900;text-align:center">◎<br>LIVE</div>
<div style="color:#666;font-size:10px;font-weight:900;text-align:center">👑<br>Eu</div>
</div>
</div>

<script>
let cur=0;
let posts=[
{img:"https://images.unsplash.com/photo-1514565131-fce0801e5785?q=80&w=1000",desc:"Golden city views at sunset ✨ #gold #luxury",owner:"lux.studio",likes:120300,liked:false,saved:false,coms:["Lindo demais! 😍","Gold vibes ✨","Top 👑"]},
{img:"https://images.unsplash.com/photo-1506905925346-21bda4d32df4?q=80&w=1000",desc:"WORK GOLD V54 Tela Normal sem corte 👑",owner:"gold.travel",likes:89200,liked:false,saved:false,coms:["Agora normal!","Sem corte"]},
];
const $=id=>document.getElementById(id);
function closeM(){$('mC').classList.remove('on')}
function load(){
let p=posts[cur];
$('bg').style.backgroundImage=`url('${p.img}')`;
$('uN').innerText='@'+p.owner;$('uD').innerText=p.desc;$('uP').innerText=p.owner[0].toUpperCase();
$('nL').innerText=(p.likes/1000).toFixed(1).replace('.0','')+'K';$('nC').innerText=p.coms.length;
$('bL').innerText=p.liked?'💛':'🤍';$('bS').innerText=p.saved?'⭐':'🔖';
$('cT').innerText=`💬 ${p.coms.length} comentários`;
$('cL').innerHTML=p.coms.map((c,i)=>`<div style="display:flex;gap:8px"><div style="width:26px;height:26px;border-radius:50%;background:#FFD700;color:#000;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:10px;flex-shrink:0">${i+1}</div><div style="flex:1;background:#222;border-radius:10px;padding:8px 10px"><b style="color:#FFD700;font-size:11px">@gold_${i+1}</b><div style="font-size:12px;margin-top:2px;color:#fff">${c}</div></div></div>`).join('');
}
function like(){let p=posts[cur];p.liked=!p.liked;p.likes+=p.liked?1:-1;if(p.likes<0)p.likes=0;load()}
function save(){let p=posts[cur];p.saved=!p.saved;load();let t=$('toast');t.innerText=p.saved?'⭐ Salvo!':'Removido';t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1500)}
function share(){navigator.clipboard.writeText(location.href);let t=$('toast');t.innerText='🔗 Link copiado!';t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1500)}
function openC(){load();$('mC').classList.add('on');setTimeout(()=>$('cI').focus(),100)}
function sendC(){let i=$('cI');let t=i.value.trim();if(!t)return;posts[cur].coms.push(t);i.value='';load();openC();let toastEl=$('toast');toastEl.innerText='Enviado ✨';toastEl.classList.add('on');setTimeout(()=>toastEl.classList.remove('on'),1500)}
$('cI').addEventListener('keydown',e=>{if(e.key==='Enter')sendC()});
let sy=0;$('stage').addEventListener('touchstart',e=>sy=e.touches[0].clientY,{passive:true});
$('stage').addEventListener('touchend',e=>{let d=sy-e.changedTouches[0].clientY;if(Math.abs(d)>60){if(d>0){cur++;if(cur>=posts.length)cur=0}else{cur--;if(cur<0)cur=posts.length-1}load()}},{passive:true});
load();
</script>
</body>
</html>
