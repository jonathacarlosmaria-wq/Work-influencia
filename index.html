<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#000;overflow:hidden;display:flex;justify-content:center;font-family:system-ui,Arial}
.app{width:100%;max-width:440px;height:100dvh;background:#000;position:relative;display:flex;flex-direction:column;overflow:hidden}
.stage{flex:1;width:100%;position:relative;background:#000;overflow:hidden;touch-action:pan-y}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
.vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,transparent 30%,transparent 62%,rgba(0,0,0,.92) 100%)}
.top{position:absolute;top:0;left:0;right:0;height:46px;display:flex;align-items:center;justify-content:center;gap:20px;z-index:30}
.t-tab{color:rgba(255,255,255,.55);font-size:14.5px;font-weight:600;padding:6px 0;border-bottom:2.5px solid transparent;cursor:pointer}

.live{position:absolute;top:54px;left:10px;z-index:20;background:rgba(0,0,0,.7);border:1px solid rgba(255,215,0,.3);padding:6px 12px;border-radius:20px;font-size:10px;font-weight:900;display:flex;gap:6px;align-items:center;color:#FFD700}
.dot{width:8px;height:8px;background:#FFD700;border-radius:50%;animation:b 1s infinite}@keyframes b{50%{opacity:.3}}
.right{position:absolute;right:8px;bottom:88px;z-index:30;display:flex;flex-direction:column;gap:18px;align-items:center;width:62px}
.act{width:62px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.abtn{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,215,0,.35);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;font-size:24px;position:relative;overflow:hidden;flex-shrink:0}
.abtn img{width:100%;height:100%;object-fit:cover;display:block}
.abtn.follow{border:2.8px solid #FFD700;background:#111;box-shadow:0 0 15px rgba(255,215,0,.4)}
.cnt{font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 6px #000;text-align:center}
.badge{position:absolute;bottom:-3px;left:50%;transform:translateX(-50%);width:20px;height:20px;border-radius:50%;border:2px solid #000;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900}
.badge.plus{background:#FFD700;color:#000}
.badge.ok{background:#00e676;color:#fff}
.bot{position:absolute;left:12px;right:80px;bottom:12px;z-index:20;color:#fff;pointer-events:none}
.bot *{pointer-events:auto}
.urow{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.upic{width:40px;height:40px;border-radius:50%;border:2px solid #FFD700;object-fit:cover;background:#222;flex-shrink:0;display:block}
.uname{font-weight:800;font-size:14px;color:#FFD700}
.fmini{margin-left:8px;padding:5px 12px;border-radius:18px;font-size:11px;font-weight:900;border:1.5px solid #FFD700;cursor:pointer}
.fmini.follow{background:transparent;color:#FFD700}
.fmini.following{background:#FFD700;color:#000}
.desc{font-size:13px;line-height:1.32;opacity:.96;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.music{margin-top:6px;font-size:11px;opacity:.85;display:flex;gap:5px;align-items:center;color:#FFD700}
.prog{position:absolute;bottom:0;left:0;height:3px;background:#FFD700;z-index:40}
.nav{height:68px;min-height:68px;flex-shrink:0;background:#000;border-top:1px solid rgba(255,215,0,.2);display:flex;align-items:center;justify-content:space-around;z-index:50;width:100%}
.ntab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:#555;font-size:9px;font-weight:700;cursor:pointer;justify-content:center;height:100%}
.ntab.on{color:#FFD700}
.ntab div:first-child{font-size:22px;line-height:1}
.nplus{width:44px;height:28px;background:#FFD700;border-radius:7px;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 0 12px rgba(255,215,0,.5)}
.nplus span{color:#000;font-weight:900;font-size:20px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:1000;display:none;flex-direction:column}.modal.on{display:flex!important}
#toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#FFD700;color:#000;padding:11px 20px;border-radius:22px;font-weight:800;font-size:12px;z-index:9000;display:none;box-shadow:0 0 18px rgba(255,215,0,.5)}#toast.on{display:block}
.input{width:100%;background:#1c1c1e;border:1px solid rgba(255,215,0,.2);padding:12px;border-radius:12px;color:#fff;margin-top:8px;font-size:13px;outline:none}
#cam{position:fixed;inset:0;background:#000;z-index:9999;display:none;flex-direction:column;width:100%;max-width:440px;left:50%;transform:translateX(-50%)}
#camEl{flex:1;width:100%;object-fit:cover;background:#111}
#liveM{position:fixed;inset:0;background:#000;z-index:9998;display:none;flex-direction:column;width:100%;max-width:440px;left:50%;transform:translateX(-50%)}
.heart{position:absolute;font-size:86px;animation:pop.9s forwards;pointer-events:none;z-index:80}@keyframes pop{0%{transform:translate(-50%,-50%) scale(0);opacity:0}15%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{transform:translate(-50%,-85%) scale(1);opacity:0}}
.bounce{animation:bou.45s}@keyframes bou{50%{transform:scale(1.3)}}
</style>
</head>

<div id="cam"><video id="camEl" autoplay muted playsinline></video><canvas id="photoCanvas" style="display:none"></canvas>
<div style="position:absolute;top:0;left:0;right:0;padding:10px;display:flex;justify-content:space-between;z-index:10;background:linear-gradient(180deg,rgba(0,0,0,.7),transparent)"><button onclick="closeAll()" style="width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.6);border:1px solid #FFD700;color:#FFD700">✕</button><div id="camL" style="background:#FFD700;color:#000;padding:5px 12px;border-radius:14px;font-size:10px;font-weight:900">FOTO HD</div><button onclick="postNow()" style="background:#FFD700;color:#000;border:none;padding:7px 16px;border-radius:18px;font-weight:900;font-size:11px">Postar</button></div>

<button id="bF" onclick="setM('foto')" style="padding:7px 14px;border-radius:18px;background:#FFD700;color:#000;font-weight:800;border:none;font-size:10px">FOTO</button>
<button id="bV" onclick="setM('video')" style="padding:7px 14px;border-radius:18px;background:rgba(255,255,255,.15);color:#fff;font-weight:800;border:1px solid rgba(255,215,0,.3);font-size:10px">VÍDEO 60s</button>

</div>
<div style="position:absolute;bottom:0;left:0;right:0;padding:12px;display:flex;align-items:center;gap:10px;background:linear-gradient(0deg,#000,transparent)"><input id="descInp" placeholder="Legenda dourada 👑 #work..." style="flex:1;padding:11px 14px;border-radius:22px;background:rgba(255,255,255,.14);border:1px solid rgba(255,215,0,.3);color:#fff;font-size:11px;outline:none"><button id="shut" onclick="cap()" style="width:66px;height:66px;border-radius:50%;background:#FFD700;border:4px solid rgba(255,255,255,.25);font-size:22px;flex-shrink:0">📸</button><button onclick="openGal()" style="width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.14);border:1px solid rgba(255,215,0,.3);color:#FFD700">🖼️</button></div><div id="recP" style="position:absolute;bottom:0;left:0;height:4px;background:#FFD700;width:0%"></div></div>

<div style="position:absolute;top:0;left:0;right:0;padding:10px;display:flex;justify-content:space-between;z-index:10;background:linear-gradient(180deg,rgba(0,0,0,.8),transparent)">
<div style="display:flex;gap:6px"><div style="background:#FFD700;padding:5px 10px;border-radius:5px;font-weight:900;font-size:10px;display:flex;gap:5px;align-items:center;color:#000;border:2px solid #fff"><div class="dot"></div>AO VIVO</div><div id="liveT" style="background:rgba(0,0,0,.6);padding:5px 10px;border-radius:16px;font-size:11px;font-weight:800;color:#FFD700;border:1px solid #FFD700;min-width:60px;text-align:center">00:00</div></div>

<button id="liveB" onclick="togLive()" style="position:absolute;bottom:20px;left:50%;transform:translateX(-50%);width:68px;height:68px;border-radius:50%;background:#FFD700;border:4px solid #fff;color:#000;font-size:26px;box-shadow:0 0 20px rgba(255,215,0,.5)">●</button>
<div style="position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:8px;color:rgba(255,215,0,.6)">⏱️ 30 MIN/DIA • DOURADO 👑</div>
</div>

<div class="modal" id="profileM"><div style="flex:1" onclick="closeAll()"></div><div style="background:#111;border-radius:20px 20px 0 0;padding:14px;max-height:86vh;overflow:auto;border-top:2px solid #FFD700"><div style="display:flex;justify-content:space-between"><b style="color:#FFD700">Perfil Dourado 👑</b><span onclick="closeAll()" style="font-size:20px;cursor:pointer;color:#FFD700">×</span></div><div style="text-align:center;margin-top:12px"><div style="position:relative;display:inline-block"><img id="pPrev" style="width:88px;height:88px;border-radius:50%;border:3px solid #FFD700;object-fit:cover;display:none;box-shadow:0 0 15px rgba(255,215,0,.4)"><div id="pPh" style="width:88px;height:88px;border-radius:50%;background:#222;display:flex;align-items:center;justify-content:center;font-size:32px;border:3px solid #FFD700">👑</div><button onclick="document.getElementById('pInp').click()" style="position:absolute;bottom:0;right:0;width:28px;height:28px;border-radius:50%;background:#FFD700;border:2px solid #111;color:#000;font-weight:900">+</button></div><input type="file" id="pInp" accept="image/*" style="display:none"><div id="pName" style="font-weight:800;margin-top:10px;color:#FFD700"></div><div id="pNick" style="color:#777;font-size:12px"></div><div style="display:flex;gap:20px;justify-content:center;margin-top:12px"><div style="text-align:center"><div id="pFol" style="font-weight:900;font-size:17px;color:#FFD700">0</div><div style="font-size:10px;color:#666">Seguidores</div></div><div style="text-align:center"><div id="pFing" style="font-weight:900;font-size:17px;color:#FFD700">0</div><div style="font-size:10px;color:#666">Seguindo</div></div><div style="text-align:center"><div id="pLikes" style="font-weight:900;font-size:17px;color:#FFD700">0</div><div style="font-size:10px;color:#666">Curtidas</div></div></div></div><input id="inName" class="input" placeholder="Nome"><input id="inNick" class="input" placeholder="@nick"><button onclick="saveP()" style="width:100%;margin-top:10px;padding:13px;border-radius:12px;background:#FFD700;color:#000;font-weight:900;border:none">Salvar Dourado</button><input type="file" id="gInp" accept="video/*,image/*" multiple style="display:none"><button onclick="openGal()" style="width:100%;margin-top:8px;padding:11px;border-radius:12px;background:#1e1e1e;color:#FFD700;font-weight:700;border:1px solid rgba(255,215,0,.3)">🖼️ Galeria</button></div></div>

<div class="modal" id="cM"><div style="flex:1" onclick="closeAll()"></div><div style="background:#111;border-radius:20px 20px 0 0;padding:12px;max-height:70vh;display:flex;flex-direction:column;border-top:2px solid #FFD700"><div style="display:flex;justify-content:space-between"><b style="color:#FFD700" id="cC">Comentários</b><span onclick="closeAll()" style="cursor:pointer;color:#FFD700">×</span></div><div id="cL" style="flex:1;overflow:auto;margin-top:10px;display:flex;flex-direction:column;gap:10px"></div><div style="display:flex;gap:8px;margin-top:10px"><input id="cI" class="input" style="flex:1;margin:0" placeholder="Comentar..."><button onclick="sendC()" style="padding:10px 16px;border-radius:20px;background:#FFD700;color:#000;font-weight:800;border:none">Enviar</button></div></div></div>

<script>
const ADMIN="jonathacarlosmaria";
let stream=null,cur=0,mode='foto',photoData=null,allVideos=[],rec=null,chunks=[],recT=null,recS=0,liveTmr=null,liveS=0,liveRec=false;
const LIM=1800;
function toast(t){let e=document.getElementById('toast');e.innerText=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)}
function closeAll(){document.querySelectorAll('.modal').forEach(m=>m.style.display='none');document.getElementById('cam').style.display='none';document.getElementById('liveM').style.display='none';if(stream){try{stream.getTracks().forEach(x=>x.stop())}catch{} stream=null}clearInterval(recT);clearInterval(liveTmr);document.getElementById('recP').style.width='0%';if(liveRec)liveRec=false}
function getU(){try{let u=JSON.parse(localStorage.getItem('work_current_user')||'{}');if(!u.nick)u={nick:ADMIN,name:"Jonatha 👑",pic:localStorage.getItem('work_owner_pic')||""};return u}catch{return {nick:ADMIN,name:"Jonatha 👑",pic:""}}}
function getPic(n){let me=getU();if(me.nick===n&&me.pic)return me.pic;let us=JSON.parse(localStorage.getItem('work_all_users')||'[]');let f=us.find(x=>x.nick===n);return f&&f.pic?f.pic:""}
function getFollowers(n){let all=JSON.parse(localStorage.getItem('work_follows')||'{}');let f=[];for(let k in all)if(all[k].includes(n))f.push(k);return f}
function getFollowing(n){return JSON.parse(localStorage.getItem('work_follows')||'{}')[n]||[]}
function isFollowing(t){let me=getU().nick;if(me===t)return false;return getFollowing(me).includes(t)}
function toggleFollow(t){let me=getU().nick;if(me===t){toast('Não pode seguir você');return}let all=JSON.parse(localStorage.getItem('work_follows')||'{}');if(!all[me])all[me]=[];let i=all[me].indexOf(t);if(i>=0){all[me].splice(i,1);toast('Deixou de seguir')}else{all[me].push(t);toast('✅ Seguindo dourado @'+t);let b=document.querySelector('.abtn.follow');if(b){b.classList.add('bounce');setTimeout(()=>b.classList.remove('bounce'),450)}}localStorage.setItem('work_follows',JSON.stringify(all));render();upd()}
function upd(){let c=getU();document.getElementById('pName').innerText=c.name;document.getElementById('pNick').innerText='@'+c.nick;document.getElementById('pFol').innerText=getFollowers(c.nick).length;document.getElementById('pFing').innerText=getFollowing(c.nick).length;document.getElementById('pLikes').innerText=allVideos.filter(v=>v.owner===c.nick).reduce((s,v)=>s+(v.likes||0),0);let pr=document.getElementById('pPrev');let ph=document.getElementById('pPh');if(c.pic){pr.src=c.pic;pr.style.display='block';ph.style.display='none';document.getElementById('navPic').innerHTML=`<img src="${c.pic}" style="width:22px;height:22px;border-radius:50%;object-fit:cover;border:1.5px solid #FFD700">`}else{pr.style.display='none';ph.style.display='flex';document.getElementById('navPic').innerText='👤'}}
function goHome(){closeAll();render()}
function goProfile(){let c=getU();document.getElementById('inName').value=c.name;document.getElementById('inNick').value=c.nick;upd();document.getElementById('profileM').style.display='flex'}
function saveP(){let c=getU();c.name=document.getElementById('inName').value.trim()||c.name;c.nick=document.getElementById('inNick').value.trim().replace('@','')||c.nick;localStorage.setItem('work_current_user',JSON.stringify(c));if(c.pic)localStorage.setItem('work_owner_pic',c.pic);let us=JSON.parse(localStorage.getItem('work_all_users')||'[]');let idx=us.findIndex(u=>u.nick===c.nick);if(idx>=0){us[idx].name=c.name;us[idx].pic=c.pic||""}else us.push({nick:c.nick,name:c.name,pic:c.pic||"",created:Date.now()});localStorage.setItem('work_all_users',JSON.stringify(us));upd();toast('✅ Salvo dourado!');render()}
document.getElementById('pInp').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=ev=>{let c=getU();c.pic=ev.target.result;localStorage.setItem('work_current_user',JSON.stringify(c));localStorage.setItem('work_owner_pic',c.pic);let us=JSON.parse(localStorage.getItem('work_all_users')||'[]');let idx=us.findIndex(u=>u.nick===c.nick);if(idx>=0)us[idx].pic=c.pic;else us.push({nick:c.nick,name:c.name,pic:c.pic});localStorage.setItem('work_all_users',JSON.stringify(us));upd();render();toast('📸 Foto no SEGUIR dourado!')};rd.readAsDataURL(f)});
function saveB(){try{let b=allVideos.filter(v=>v.id!==1).slice(0,100).map(v=>({id:v.id,desc:v.desc,data:v.data,type:v.type,owner:v.owner,likes:v.likes,comments:v.commentsList}));localStorage.setItem('work_backup_videos',JSON.stringify(b))}catch{}}
function loadB(){try{return JSON.parse(localStorage.getItem('work_backup_videos')||'[]')}catch{return[]}}
function getUso(){let d=JSON.parse(localStorage.getItem('liveUso')||'{}');if(d.data!==new Date().toDateString())return 0;return d.seg||0}
function saveUso(s){localStorage.setItem('liveUso',JSON.stringify({data:new Date().toDateString(),seg:s}))}
function fmt(n){if(n>=1000000)return (n/1000000).toFixed(1)+'M';if(n>=1000)return (n/1000).toFixed(1)+'K';return n}
function render(){
if(allVideos.length===0) allVideos=[{id:1,desc:"WORK V36.1 DOURADO SEM DEFORMAR - Original + dourado 👑 #work #gold",img:"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?q=80&w=1000",type:'foto',owner:ADMIN,likes:22400,commentsList:["Sem deformar!","Dourado perfeito!","V36.1 brabo 🔥"],music:"som original dourado"}];
let v=allVideos[cur];
let following=isFollowing(v.owner);
let pic=getPic(v.owner);
let inner=pic?`<img src="${pic}">`:`<div style="width:100%;height:100%;background:#222;display:flex;align-items:center;justify-content:center;font-weight:900;color:#FFD700">${v.owner[0].toUpperCase()}</div>`;
let badge=following?`<div class="badge ok">✓</div>`:`<div class="badge plus">+</div>`;
let upic=pic?`<img src="${pic}" class="upic">`:`<div class="upic" style="display:flex;align-items:center;justify-content:center;background:#222;font-weight:900;color:#FFD700">${v.owner[0].toUpperCase()}</div>`;
let media=v.type==='foto'||(v.data&&v.data.startsWith('data:image'))||v.img?`<div class="bg" style="background-image:url('${v.data||v.img}')"></div>`:`<video class="vid" id="fv" src="${v.data}" autoplay loop muted playsinline></video>`;
document.getElementById('stage').innerHTML=`${media}<div class="grad"></div><div class="top"><div class="t-tab">Seguindo</div><div class="t-tab on">Para você</div></div><div class="live"><div class="dot"></div>${Math.floor(Math.random()*800+150)} • @${v.owner}</div><div class="right"><div class="act" onclick="toggleFollow('${v.owner}')"><div class="abtn follow">${inner}${badge}</div></div><div class="act" onclick="like(event)"><div class="abtn" id="lb">❤️</div><div class="cnt">${fmt(v.likes||0)}</div></div><div class="act" onclick="openC()"><div class="abtn">💬</div><div class="cnt">${(v.commentsList||[]).length}</div></div><div class="act" onclick="share()"><div class="abtn">↗️</div><div class="cnt">Share</div></div></div><div class="bot"><div class="urow">${upic}<div class="uname">@${v.owner}</div><div class="fmini ${following?'following':'follow'}" onclick="toggleFollow('${v.owner}')">${following?'Seguindo':'Seguir'}</div></div><div class="desc">${v.desc}</div><div class="music">🎵 ${v.music||'som original'}</div></div>`;
let fv=document.getElementById('fv');if(fv){fv.addEventListener('timeupdate',()=>{document.getElementById('prog').style.width=(fv.currentTime/fv.duration*100)+'%'})}
document.getElementById('stage').ondblclick=(e)=>like(e);
}
function like(e){let v=allVideos[cur];v.likes=(v.likes||0)+1;saveB();let h=document.createElement('div');h.className='heart';h.innerText='💛';h.style.left=(e.clientX||200)+'px';h.style.top=(e.clientY||300)+'px';document.getElementById('stage').appendChild(h);setTimeout(()=>h.remove(),900);let b=document.getElementById('lb');if(b){b.classList.add('bounce');setTimeout(()=>b.classList.remove('bounce'),450)}render()}
function openC(){let v=allVideos[cur];document.getElementById('cC').innerText=v.commentsList.length+' comentários';document.getElementById('cL').innerHTML=v.commentsList.map(c=>`<div style="display:flex;gap:8px"><div style="width:28px;height:28px;border-radius:50%;background:#222;display:flex;align-items:center;justify-content:center">👤</div><div><b style="font-size:11px">@user</b><div style="font-size:12px;opacity:.9;margin-top:2px">${c}</div></div></div>`).join('')||'Sem comentários';document.getElementById('cM').style.display='flex'}
function sendC(){let i=document.getElementById('cI');let t=i.value.trim();if(!t)return;let v=allVideos[cur];if(!v.commentsList)v.commentsList=[];v.commentsList.push(t);i.value='';saveB();openC();render()}
function share(){navigator.clipboard.writeText(location.href).then(()=>toast('🔗 Link copiado!'))}
function setM(m){mode=m;document.getElementById('bF').style.background=m==='foto'?'#FFD700':'rgba(255,255,255,.15)';document.getElementById('bF').style.color=m==='foto'?'#000':'#fff';document.getElementById('bV').style.background=m==='video'?'#FFD700':'rgba(255,255,255,.15)';document.getElementById('bV').style.color=m==='video'?'#000':'#fff';document.getElementById('bL').style.background=m==='live'?'#FFD700':'rgba(255,255,255,.15)';document.getElementById('bL').style.color=m==='live'?'#000':'#fff';document.getElementById('camL').innerText=m==='foto'?'FOTO HD':m==='video'?'VÍDEO 60s':'LIVE 30MIN';document.getElementById('shut').innerText=m==='foto'?'📸':'●';document.getElementById('shut').style.background=m==='live'?'#FFD700':'#FFD700'}
function goCam(){document.getElementById('cam').style.display='flex';navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true}).then(s=>{stream=s;document.getElementById('camEl').srcObject=s;setM('foto')}).catch(()=>toast('Permita câmera'))}
function cap(){
if(mode==='foto'){let v=document.getElementById('camEl');let c=document.getElementById('photoCanvas');c.width=v.videoWidth||1080;c.height=v.videoHeight||1920;c.getContext('2d').drawImage(v,0,0,c.width,c.height);photoData=c.toDataURL('image/jpeg',0.9);toast('✅ Foto pronta! Clique Postar');document.getElementById('shut').innerText='✅'}
else if(mode==='video'){if(!rec){chunks=[];rec=new MediaRecorder(stream,{mimeType:'video/webm'});rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{let b=new Blob(chunks,{type:'video/webm'});let rd=new FileReader();rd.onload=ev=>{photoData=ev.target.result;toast('✅ Vídeo pronto! Clique Postar')};rd.readAsDataURL(b)};rec.start();recS=0;recT=setInterval(()=>{recS++;document.getElementById('recP').style.width=(recS/60*100)+'%';document.getElementById('camL').innerText=`🔴 ${String(Math.floor(recS/60)).padStart(2,'0')}:${String(recS%60).padStart(2,'0')} / 01:00`;if(recS>=60){toggleV()}},1000);document.getElementById('shut').innerText='■';document.getElementById('shut').style.background='#fe2c55';toast('🔴 Gravando 60s')}else toggleV()}
else if(mode==='live'){openLive()}
}
function toggleV(){if(rec&&rec.state==='recording'){rec.stop();clearInterval(recT);document.getElementById('shut').innerText='✅';document.getElementById('shut').style.background='#FFD700'}}
function openLive(){let resta=LIM-getUso();if(resta<=0){toast('⏰ 30min dourados acabaram hoje! Volta amanhã 👑');return}document.getElementById('cam').style.display='none';document.getElementById('liveM').style.display='flex';navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true}).then(s=>{stream=s;document.getElementById('liveV').srcObject=s;liveS=0;document.getElementById('liveI').innerText=`Você tem ${Math.floor(resta/60)}:${String(resta%60).padStart(2,'0')} hoje • Clique ● para gravar`;document.getElementById('liveT').innerText='00:00';liveTmr=setInterval(()=>{liveS++;let tot=getUso()+liveS;saveUso(tot);let falta=LIM-tot;let m=String(Math.floor(liveS/60)).padStart(2,'0');let sc=String(liveS%60).padStart(2,'0');document.getElementById('liveT').innerText=`${m}:${sc}`;document.getElementById('liveI').innerText=`⏱️ ${m}:${sc} | Resta: ${Math.floor(falta/60)}:${String(falta%60).padStart(2,'0')}`;if(falta<=0){clearInterval(liveTmr);toast('⏰ Acabou 30min!');closeAll()}},1000)}).catch(()=>toast('Permita câmera'))}
function togLive(){let b=document.getElementById('liveB');if(!liveRec){liveRec=true;b.innerText='■';b.style.background='#fff';b.style.color='#fe2c55';toast('🔴 Gravando LIVE dourada')}else{liveRec=false;b.innerText='●';b.style.background='#FFD700';b.style.color='#000';toast('✅ LIVE salva!');let me=getU();allVideos.unshift({id:Date.now(),desc:`Minha LIVE dourada 🔴 ${document.getElementById('liveT').innerText} #live`,type:'foto',img:'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?q=80&w=1000',likes:0,owner:me.nick,commentsList:[],music:'AO VIVO DOURADO'});saveB();closeAll();render()}}
function postNow(){let me=getU();if(mode==='foto'||mode==='video'){if(!photoData){toast('Capture primeiro');return}let obj={id:Date.now(),data:photoData,desc:document.getElementById('descInp').value||'Foto dourada 👑 #work',type:mode==='foto'?'foto':'video',likes:0,owner:me.nick,commentsList:[],music:'som original dourado'};allVideos.unshift(obj);saveB();closeAll();document.getElementById('descInp').value='';photoData=null;toast('✅ Postado dourado!');render()}else openLive()}
function openGal(){document.getElementById('gInp').click()}
document.getElementById('gInp').addEventListener('change',e=>{let files=Array.from(e.target.files);let done=0;files.forEach(f=>{let rd=new FileReader();rd.onload=ev=>{allVideos.unshift({id:Date.now()+Math.random(),data:ev.target.result,desc:f.name,type:f.type.startsWith('video')?'video':'foto',likes:0,owner:getU().nick,commentsList:[],music:'original'});saveB();done++;if(done===files.length){toast(`✅ ${done} importados!`);render()}};rd.readAsDataURL(f)})});
let sy=0;document.getElementById('stage').addEventListener('touchstart',e=>{sy=e.touches[0].clientY},{passive:true});document.getElementById('stage').addEventListener('touchend',e=>{let d=sy-e.changedTouches[0].clientY;if(Math.abs(d)>60){if(d>0){cur++;if(cur>=allVideos.length)cur=0}else{cur--;if(cur<0)cur=allVideos.length-1}render()}},{passive:true});
(async()=>{let saved=[];try{saved=JSON.parse(localStorage.getItem('work_backup_videos')||'[]')}catch{}saved.reverse().forEach(v=>{allVideos.unshift({id:v.id,desc:v.desc||"",data:v.data||"",type:v.type||'foto',img:v.img||"",likes:v.likes||0,owner:v.owner||ADMIN,commentsList:v.comments||v.commentsList||[],music:v.music||'som original'})});render();if(!localStorage.getItem('work_current_user'))localStorage.setItem('work_current_user',JSON.stringify({nick:ADMIN,name:"Jonatha 👑",pic:localStorage.getItem('work_owner_pic')||""}));toast('✅ V36.1 DOURADO 100% - SEM DEFORMAR!');})();
</script>
