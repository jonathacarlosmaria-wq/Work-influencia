<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WORK INFLUENCER 🔥</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{background:#000;color:#fff;height:100vh;overflow:hidden}
.splash{position:fixed;inset:0;background:linear-gradient(135deg,#ff4500,#ff8c00);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;text-align:center}
.splash h1{font-size:44px;font-weight:900}
.feed{height:calc(100vh - 60px);overflow-y:scroll;scroll-snap-type:y mandatory;background:#000}
.video-card{height:calc(100vh - 60px);scroll-snap-align:start;position:relative;background:#111;display:flex;align-items:center;justify-content:center}
.video-card video{width:100%;height:100%;object-fit:cover;background:#000}
.info{position:absolute;bottom:20px;left:12px;right:80px;text-shadow:0 1px 4px #000}
.info b{font-size:16px}
.info span{font-size:14px;opacity:.9;display:block;margin-top:4px}
.actions{position:absolute;right:12px;bottom:90px;display:flex;flex-direction:column;gap:22px;align-items:center}
.actions button{background:none;border:none;color:#fff;font-size:30px;display:flex;flex-direction:column;align-items:center}
.actions small{font-size:12px;margin-top:4px}
.nav{position:fixed;bottom:0;left:0;right:0;height:60px;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;align-items:center;z-index:100}
.nav button{background:none;border:none;color:#fff;font-size:24px}
.plus{width:46px;height:30px;background:#fff;border-radius:8px;color:#000!important;font-weight:900;font-size:22px!important}
</style>
</head>
<body>
<div class="splash" id="splash" onclick="this.style.display='none'">
<div style="font-size:60px">🔥</div>
<h1>WORK INFLUENCER</h1>
<p style="margin-top:8px;font-weight:600">LIVE REAL AGORA</p>
<small style="margin-top:18px;background:rgba(0,0,0,.3);padding:8px 16px;border-radius:20px">Toque para entrar</small>
</div>
<div class="feed" id="feed"><div style="padding:50% 20px;text-align:center;color:#888">Carregando feed...</div></div>
<div class="nav">
<button>🏠</button><button>🔍</button>
<button class="plus" onclick="document.getElementById('fileInput').click()">+</button>
<button style="color:#ff3b30;font-weight:bold">🔴 LIVE</button><button>👤</button>
</div>
<input type="file" id="fileInput" accept="video/*" hidden>
<script>
const SUPABASE_URL = 'https://rjrjdfwxqbjjfflqpydm.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ4cmpkZnd4cWJqamZmbHFweWRtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExNDg1MTksImV4cCI6MjEwNjcyNDUxOX0.HNJ0nJ_XJHNmjyWxhd7MyS2IrCLlWB85rIVKQqQrsQU';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
async function carregarFeed(){
 const feed=document.getElementById('feed');
 const {data,error}=await supabase.from('posts').select('*').order('created_at',{ascending:false}).limit(50);
 if(error){feed.innerHTML=`<div style="padding:60% 20px;text-align:center">Erro: ${error.message}</div>`;return;}
 if(!data||data.length===0){feed.innerHTML=`<div style="padding:50% 20px;text-align:center;line-height:1.6"><div style="font-size:50px">🎬</div><b>Nenhum vídeo ainda</b><br><span style="color:#aaa">Seja o primeiro!</span><br><br><button onclick="document.getElementById('fileInput').click()" style="background:#ff4500;color:#fff;border:none;padding:12px 24px;border-radius:25px;font-weight:bold">+ Postar agora</button></div>`;return;}
 feed.innerHTML=data.map(p=>`<div class="video-card"><video src="${p.video_url}" loop playsinline preload="metadata" onclick="if(this.paused){this.play()}else{this.pause()};this.muted=false"></video><div class="info"><b>@${p.username||'user'}</b><span>${p.desc||''}</span></div><div class="actions"><button>❤️<small>${p.likes||0}</small></button><button>💬</button><button>↗️</button></div></div>`).join('');
 const v=document.querySelector('video');if(v){v.play().catch(()=>{});}
}
document.getElementById('fileInput').onchange=async(e)=>{
 const file=e.target.files[0];if(!file)return;
 const splash=document.getElementById('splash');splash.style.display='flex';splash.innerHTML='<div style="font-size:50px">⏳</div><h1>Enviando... 🔥</h1>';
 const nome=Date.now()+'_'+file.name.replace(/\s/g,'_');
 const {error}=await supabase.storage.from('videos').upload(nome,file);
 if(error){alert('Erro upload: '+error.message);splash.style.display='none';return;}
 const {data:{publicUrl}}=supabase.storage.from('videos').getPublicUrl(nome);
 const legenda=prompt('Legenda:')||'';
 await supabase.from('posts').insert([{video_url:publicUrl,username:'você',desc:legenda}]);
 splash.style.display='none';carregarFeed();
};
carregarFeed();
</script>
</body>
</html>
