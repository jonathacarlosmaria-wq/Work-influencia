<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WORK GOLD V48 - COMENTARIOS FIX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#000;display:flex;justify-content:center;overflow:hidden;height:100dvh}
.app{width:100%;max-width:440px;height:100dvh;background:#000;position:relative;display:flex;flex-direction:column}
.stage{flex:1;position:relative;background:#111;overflow:hidden}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
.grad{position:absolute;inset:0;background:linear-gradient(0deg,#000 80%,transparent)}
.right{position:absolute;right:8px;bottom:100px;z-index:50;display:flex;flex-direction:column;gap:12px}
.btn{width:56px;height:56px;border-radius:50%;background:#222;border:2px solid #FFD700;display:flex;align-items:center;justify-content:center;color:#FFD700;font-size:22px;cursor:pointer}
.btn:active{transform:scale(.9)}
.btn-gold{background:#FFD700;color:#000;border:2px solid #000}
.cnt{font-size:10px;color:#fff;font-weight:900;text-align:center}
.bot{position:absolute;left:10px;right:80px;bottom:84px;z-index:10}
.card{background:#1a1a1a;border:1.5px solid #FFD700;border-radius:18px;padding:12px}
.nav{height:72px;background:#0f0e05;border-top:2px solid #FFD700;display:flex;justify-content:space-around;align-items:center;border-radius:20px 20px 0 0}
.ntab{flex:1;display:flex;flex-direction:column;align-items:center;color:#8a7000;font-size:9px;font-weight:900}
.ntab.on{color:#FFD700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:9999;display:none;max-width:440px;left:50%;transform:translateX(-50%);flex-direction:column}.modal.on{display:flex}
.box{background:#121212;border-top:3px solid #FFD700;border-radius:26px 26px 0 0;margin-top:auto;width:100%;max-height:90vh;display:flex;flex-direction:column}
.input{width:100%;background:#1e1e1e;border:2px solid #FFD700;border-radius:14px;padding:16px;color:#fff;font-size:16px;outline:none}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#FFD700;color:#000;padding:12px 20px;border-radius:100px;font-weight:900;z-index:10000;display:none}.toast.on{display:block}
</style>
</head>
<body>
<div id="toast" class="toast"></div>
<div class="app">
<div class="stage" id="stage">
<div class="bg" id="bg"></div><div class="grad"></div>
<div style="position:absolute;top:12px;left:12px;right:12px;z-index:10;display:flex;justify-content:space-between"><div style="display:flex;background:#222;border:1.5px solid #FFD700;border-radius:100px;padding:4px"><div style="padding:8px 18px;border-radius:100px;background:#FFD700;color:#000;font-weight:900;font-size:13px">Para você</div></div><div style="padding:6px 12px;border-radius:100px;background:#222;border:1.5px solid #FFD700;color:#FFD700;font-size:11px;font-weight:900">🔴 LIVE</div></div>

<!-- BOTÕES FIXOS - NÃO SÃO RECRIADOS - SEMPRE FUNCIONAM -->
<div class="right">
<div style="display:flex;flex-direction:column;align-items:center" onclick="likeNow()"><div class="btn" id="bLike">🤍</div><div class="cnt" id="tLike">120K</div></div>
<div style="display:flex;flex-direction:column;align-items:center" onclick="openComNow()"><div class="btn btn-gold" id="bCom">💬</div><div class="cnt" id="tCom">3</div></div>
<div style="display:flex;flex-direction:column;align-items:center" onclick="saveNow()"><div class="btn" id="bSave">🔖</div><div class="cnt">Salvar</div></div>
<div style="display:flex;flex-direction:column;align-items:center" onclick="shareNow()"><div class="btn">↗</div><div class="cnt">Share</div></div>
</div>

<div class="bot"><div class="card"><div style="display:flex;gap:10px;align-items:center;margin-bottom:6px"><div style="width:40px;height:40px;border-radius:50%;background:#222;border:2px solid #FFD700;display:flex;align-items:center;justify-content:center;color:#FFD700;font-weight:900">L</div><div style="color:#FFD700;font-weight:900">@lux.studio</div></div><div style="color:#fff;font-size:12px" id="tDesc">Golden city views ✨ #gold</div></div></div>
</div>
<div class="nav">
<div class="ntab on"><div style="font-size:22px">⌂</div>Início</div>
<div class="ntab"><div style="font-size:22px">⌕</div>Buscar</div>
<div class="ntab"><div style="width:52px;height:52px;border-radius:50%;background:#000;border:2.5px solid #FFD700;display:flex;align-items:center;justify-content:center;color:#FFD700;font-size:28px">+</div></div>
<div class="ntab"><div style="font-size:22px">◎</div>LIVE</div>
<div class="ntab"><div style="font-size:22px">👑</div>Eu</div>
</div>
</div>

<!-- MODAL COMENTÁRIOS -->
<div class="modal" id="mCom">
<div style="flex:1" onclick="closeAll()"></div>
<div class="box">
<div style="padding:14px;display:flex;justify-content:space-between;border-bottom:1px solid #333;align-items:center">
<div><b style="color:#FFD700" id="cTitle">💬 3 comentários</b><div style="font-size:10px;color:#888" id="cSub">@lux.studio</div></div>
<button onclick="closeAll()" style="width:32px;height:32px;border-radius:50%;background:#222;border:1px solid #FFD700;color:#FFD700">×</button>
</div>
<div id="cList" style="flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px;max-height:50vh"></div>
<div style="padding:12px;background:#0a0a0a;border-top:2px solid #FFD700;display:flex;gap:8px">
<input id="cInput" type="text" class="input" style="flex:1;border-radius:100px" placeholder="Escreva um comentário Gold...">
<button onclick="sendComNow()" style="padding:14px 20px;border-radius:100px;background:#FFD700;color:#000;font-weight:900;border:2px solid #000">Enviar</button>
</div>
</div>
</div>

<script>
let videos=[
{id:1,img:"https://images.unsplash.com/photo-1514565131-fce0801e5785?q=80&w=1000",desc:"Golden city views at sunset ✨ #gold #luxury",likes:120300,clist:["Lindo demais! 😍","Gold vibes ✨","Top 👑"]},
{id:2,img:"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?q=80&w=1000",desc:"WORK GOLD V48 - Comentários funcionando!",likes:45200,clist:["Funcionando!"]},
];
let cur=0;
const $=id=>document.getElementById(id);
function toast(t){$('toast').innerText=t;$('toast').classList.add('on');setTimeout(()=>$('toast').classList.remove('on'),2000)}
function closeAll(){$('mCom').classList.remove('on')}
function fmt(n){if(n>=1000)return (n/1000).toFixed(1)+'K';return n}
function loadVideo(){
let v=videos[cur];
$('bg').style.backgroundImage=`url('${v.img}')`;
$('tDesc').innerText=v.desc;
$('tLike').innerText=fmt(v.likes);
$('tCom').innerText=fmt(v.clist.length);
$('cTitle').innerText=`💬 ${v.clist.length} comentários`;
$('cList').innerHTML=v.clist.map((c,i)=>`<div style="display:flex;gap:8px"><div style="width:28px;height:28px;border-radius:50%;background:#FFD700;color:#000;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:10px">${i+1}</div><div style="flex:1;background:#1e1e1e;padding:8px 10px;border-radius:12px"><b style="color:#FFD700;font-size:11px">@gold_${i+1}</b><div style="color:#fff;font-size:12px">${c}</div></div></div>`).join('');
try{localStorage.setItem('work_v48',JSON.stringify(videos))}catch{}
}
function likeNow(){let v=videos[cur];v.likes++;loadVideo();toast('💛 Like Gold!');$('bLike').innerText='💛';}
function saveNow(){toast('⭐ Salvo Gold!')}
function shareNow(){navigator.clipboard.writeText(location.href).then(()=>toast('🔗 Link copiado!'))}
// FUNÇÃO COMENTÁRIOS CORRIGIDA DEFINITIVO
function openComNow(){
console.log('Abrindo comentários V48');
let v=videos[cur];
$('cTitle').innerText=`💬 ${v.clist.length} comentários`;
$('cSub').innerText=`@${v.owner||'lux.studio'}`;
$('cList').innerHTML=v.clist.map((c,i)=>`<div style="display:flex;gap:8px"><div style="width:28px;height:28px;border-radius:50%;background:#FFD700;color:#000;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:10px">${i+1}</div><div style="flex:1;background:#1e1e1e;padding:8px 10px;border-radius:12px"><b style="color:#FFD700;font-size:11px">@gold_${i+1}</b><div style="color:#fff;font-size:12px">${c}</div></div></div>`).join('') || '<div style="text-align:center;color:#666;padding:20px">Seja o primeiro! ✨</div>';
$('mCom').classList.add('on');
setTimeout(()=>{$('cInput').focus();},200);
}
function sendComNow(){
let inp=$('cInput');let t=inp.value.trim();
if(!t){toast('Digite um comentário');return}
videos[cur].clist.push(t);
inp.value='';
loadVideo();
openComNow();
toast('✨ Comentário enviado!');
}
$('cInput').addEventListener('keydown',e=>{if(e.key==='Enter'){sendComNow()}});
// Swipe troca vídeo
let sy=0;$('stage').addEventListener('touchstart',e=>sy=e.touches[0].clientY,{passive:true});
$('stage').addEventListener('touchend',e=>{let d=sy-e.changedTouches[0].clientY;if(Math.abs(d)>50){if(d>0){cur++;if(cur>=videos.length)cur=0}else{cur--;if(cur<0)cur=videos.length-1}loadVideo()}},{passive:true});
try{let b=JSON.parse(localStorage.getItem('work_v48')||'[]');if(b.length>0)videos=b}catch{}
loadVideo();
toast('V48 - Clique no 💬 AMARELO agora!');
</script>
</body>
</html>
