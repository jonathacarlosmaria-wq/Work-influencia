<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WORK FIRE - PROFISSIONAL</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100dvh;background:#000;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
#app{width:100%;max-width:420px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;background:#000;position:relative}
#feed{flex:1;overflow-y:scroll;scroll-snap-type:y mandatory;background:#000}
#feed::-webkit-scrollbar{display:none}
.post{height:100dvh;width:100%;position:relative;scroll-snap-align:start;background:#0a0a0a center/cover no-repeat;flex-shrink:0}
.post::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.4) 70%,rgba(0,0,0,.85) 100%);pointer-events:none}
.sideL{position:absolute;left:10px;bottom:112px;display:flex;flex-direction:column;gap:16px;z-index:15;width:66px}
.sideR{position:absolute;right:10px;bottom:112px;display:flex;flex-direction:column;gap:16px;z-index:15;width:66px}
.b{border:none;background:none;display:flex;flex-direction:column;align-items:center;width:100%;cursor:pointer}
.i{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;position:relative;transition:all.25s cubic-bezier(.34,1.56,.64,1);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.i.fire{background:radial-gradient(120% 120% at 30% 20%,#ff8a00 0%,#ff4500 40%,#8b0000 100%);border:1.5px solid rgba(255,140,0,.6);box-shadow:0 4px 16px rgba(255,69,0,.4),inset 0 1px 2px rgba(255,255,255,.3)}
.i.fire.active{background:radial-gradient(120% 120% at 30% 20%,#ff2a2a 0%,#ff0000 50%,#8b0000 100%);border-color:#ff0000;box-shadow:0 0 24px rgba(255,0,0,.7);transform:scale(1.05)}
.i.heart{background:rgba(20,20,20,.65);border:1.5px solid rgba(255,255,255,.15);box-shadow:0 4px 16px rgba(0,0,0,.4);color:#fff}
.i.heart.liked{background:radial-gradient(120% 120% at 30% 20%,#ff5a8a 0%,#ff0040 60%,#cc0033 100%);border-color:#ff2a6d;box-shadow:0 0 24px rgba(255,42,109,.6);color:#fff;transform:scale(1.05)}
.i.chat{background:rgba(20,20,20,.6);border:1.5px solid rgba(255,255,255,.12);color:#fff}
.i.share{background:rgba(20,20,20,.6);border:1.5px solid rgba(255,255,255,.12);color:#fff}
.i.save{background:rgba(20,20,20,.6);border:1.5px solid rgba(255,255,255,.12);color:#fff}
.i.save.active{background:radial-gradient(120% 120% at 30% 20%,#ffdd44 0%,#ffaa00 60%,#ff8c00 100%);border-color:#ffcc00;color:#000;box-shadow:0 0 20px rgba(255,204,0,.5)}
@keyframes dance{0%{transform:scale(1) rotate(0)}15%{transform:scale(1.35,.65) rotate(-5deg)}30%{transform:scale(.7,1.35) rotate(5deg)}50%{transform:scale(1.15,.85) rotate(-3deg)}100%{transform:scale(1.05) rotate(0)}}
.i.anim{animation:dance.65s cubic-bezier(.34,1.56,.64,1)}
.c{color:#fff;font-size:10px;font-weight:700;margin-top:6px;text-align:center;line-height:1.2;text-shadow:0 1px 8px rgba(0,0,0,.9)}
.info{position:absolute;left:82px;right:82px;bottom:86px;background:linear-gradient(180deg,rgba(20,10,0,.9),rgba(0,0,0,.9));border:1px solid rgba(255,69,0,.3);border-radius:14px;padding:10px 12px;z-index:10;backdrop-filter:blur(20px)}
.info b{color:#ff8c00;font-size:12px}
.info div{color:#f0f0f0;font-size:12px;line-height:1.3;margin-top:2px}
.meta{color:rgba(255,255,255,.6)!important;font-size:10px!important;display:flex;gap:8px;margin-top:6px!important}
.nav{height:70px;background:linear-gradient(180deg,#0f0a00,#080300);border-top:1px solid rgba(255,69,0,.25);display:flex;align-items:center;z-index:20}
.nav button{flex:1;background:none;border:none;color:rgba(255,255,255,.4);font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button.on{color:#ff8c00}
.plus{width:58px;height:58px;border-radius:50%;background:radial-gradient(120% 120% at 30% 20%,#ff8c00,#ff4500 50%,#cc2200);border:2.5px solid #fff;color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;margin-top:-28px;box-shadow:0 6px 20px rgba(255,69,0,.5),0 0 0 4px rgba(0,0,0,.8)}
.page{position:absolute;inset:0;background:#000;z-index:30;display:none;flex-direction:column;overflow:auto}
.page.show{display:flex}
.input{width:100%;padding:12px;background:rgba(30,15,0,.8);border:1px solid rgba(255,69,0,.3);border-radius:10px;color:#fff;margin-top:8px;outline:none}
.btn{width:100%;padding:14px;background:linear-gradient(90deg,#ff4500,#ff8c00);border:none;border-radius:10px;color:#000;font-weight:900;margin-top:10px}
.card{background:linear-gradient(180deg,rgba(30,15,0,.9),rgba(20,8,0,.9));border:1px solid rgba(255,69,0,.2);border-radius:12px;padding:12px;margin:10px}
video.bgvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>
<div id="app">
<div id="feed"></div>
<div id="pCriar" class="page"><div style="display:flex;justify-content:space-between;padding:14px"><h3 style="color:#ff4500">🔥 Criar</h3><button onclick="closeAll()" style="background:none;border:none;color:#fff;font-size:20px"><i class="fa-solid fa-xmark"></i></button></div><div class="card"><input id="file" type="file" accept="video/*" style="color:#fff;width:100%"><video id="prev" style="width:100%;margin-top:10px;border-radius:12px;display:none" controls></video><input id="desc" class="input" placeholder="Escreva uma legenda..."><button class="btn" onclick="postar()"><i class="fa-solid fa-fire"></i> POSTAR AGORA</button><div id="statusPost" style="color:#ff8c00;text-align:center;margin-top:10px;font-size:12px"></div></div></div>
<div class="nav"><button id="b0" class="on" onclick="go(0)"><i class="fa-solid fa-house" style="font-size:18px"></i><span>Inicio</span></button><button onclick="go(2)"><div class="plus"><i class="fa-solid fa-plus"></i></div></button><button id="b4" onclick="go(4)"><i class="fa-solid fa-fire" style="font-size:18px"></i><span>Eu</span></button></div>
</div>
<script>
const SUPABASE_URL='https://rjrjdfwxqbjjfflqpydm.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ4cmpkZnd4cWJqamZmbHFweWRtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExNDg1MTksImV4cCI6MjEwNjcyNDUxOX0.HNJ0nJ_XJHNmjyWxhd7MyS2IrCLlWB85rIVKQqQrsQU';
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON);
let uid=localStorage.getItem("uid")||"u_"+Math.random().toString(36).slice(2,8); localStorage.setItem("uid",uid);
let posts=[]; let tempFile=null;

async function load(){
 const feed=document.getElementById("feed");
 feed.innerHTML='<div style="height:100dvh;display:flex;align-items:center;justify-content:center;color:#666">Carregando feed...</div>';
 const {data,error}=await supabase.from("posts").select("*").order("created_at",{ascending:false}).limit(50);
 if(error){feed.innerHTML=`<div style="height:100dvh;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;padding:20px;text-align:center"><div style="font-size:40px">🔥</div><b>Erro: ${error.message}</b><br><small style="color:#aaa">Verifique tabela posts</small></div>`; return;}
 posts=data||[];
 if(posts.length===0){
   feed.innerHTML=`<div style="height:100dvh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:#fff;text-align:center"><div style="font-size:50px">🎬</div><b>Nenhum vídeo ainda</b><span style="color:#aaa">Seja o primeiro!</span><button class="btn" style="width:180px" onclick="go(2)">+ Postar agora</button></div>`; return;
 }
 render();
}

function render(){
 document.getElementById("feed").innerHTML=posts.map((p,idx)=>{
   let isVideo=p.video_url.includes(".mp4")||p.video_url.includes("videos");
   let bg=isVideo?`<video class="bgvid" src="${p.video_url}" loop muted playsinline preload="metadata" onclick="this.paused?this.play():this.pause();this.muted=false"></video>`:`<div class="post" style="background-image:url('${p.video_url}')"></div>`;
   return `<div class="post">${bg}
   <div class="sideL">
     <button class="b" onclick="fire(${idx},this)"><div class="i fire"><i class="fa-solid fa-fire"></i></div><div class="c"><b>${p.likes||0}</b><br><span>Chamas</span></div></button>
     <button class="b"><div class="i heart"><i class="fa-regular fa-heart"></i></div><div class="c"><b>Curtir</b></div></button>
   </div>
   <div class="sideR">
     <button class="b"><div class="i share"><i class="fa-solid fa-rocket"></i></div><div class="c"><b>Share</b></div></button>
     <button class="b"><div class="i save"><i class="fa-regular fa-bookmark"></i></div><div class="c"><b>Salvar</b></div></button>
   </div>
   <div class="info"><b>@${p.username||'fire.user'} <span style="background:#ffcc00;color:#000;padding:2px 6px;border-radius:10px;font-size:9px">🌟 INFLUENCER</span></b><div>${p.desc||''}</div><div class="meta"><span><i class="fa-solid fa-fire"></i> ${p.likes||0}</span><span>• profissional</span></div></div>
   </div>`;
 }).join("");
 let first=document.querySelector(".bgvid"); if(first){first.play().catch(()=>{});}
}

function anim(el){let i=el.querySelector('.i'); if(!i) return; i.classList.remove('anim'); void i.offsetWidth; i.classList.add('anim'); setTimeout(()=>i.classList.remove('anim'),700);}
function fire(i,btn){anim(btn); posts[i].likes=(posts[i].likes||0)+1; supabase.from("posts").update({likes:posts[i].likes}).eq("id",posts[i].id).then(()=>{}); render();}

function go(n){document.querySelectorAll(".page").forEach(p=>p.classList.remove("show")); if(n==2) document.getElementById("pCriar").classList.add("show"); if(n==0) load();}
function closeAll(){document.querySelectorAll(".page").forEach(p=>p.classList.remove("show"));}

document.getElementById("file").addEventListener("change",e=>{
 let f=e.target.files[0]; if(!f) return; tempFile=f;
 let v=document.getElementById("prev"); v.src=URL.createObjectURL(f); v.style.display="block";
});

async function postar(){
 if(!tempFile) return alert("Escolha um vídeo");
 document.getElementById("statusPost").innerText="⏳ Enviando...";
 let nome=Date.now()+"_"+tempFile.name.replace(/\s/g,"_");
 let {error}=await supabase.storage.from("videos").upload(nome,tempFile);
 if(error){document.getElementById("statusPost").innerText="Erro: "+error.message; return;}
 let {data:{publicUrl}}=supabase.storage.from("videos").getPublicUrl(nome);
 let desc=document.getElementById("desc").value||"Meu vídeo 🔥";
 let {error:err2}=await supabase.from("posts").insert([{video_url:publicUrl,username:"você",desc:desc,likes:0}]);
 if(err2){document.getElementById("statusPost").innerText="Erro salvar: "+err2.message; return;}
 document.getElementById("statusPost").innerText="✅ Postado!";
 tempFile=null; document.getElementById("prev").style.display="none"; closeAll(); load();
}
load();
</script>
</body>
</html>
