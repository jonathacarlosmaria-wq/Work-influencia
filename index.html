<!DOCTYPE html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>WORK INFLUÊNCIA</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#000;color:#fff;overflow:hidden}.feed{height:100vh;width:100vw;overflow-y:scroll;scroll-snap-type:y mandatory}.vid{height:100vh;width:100vw;scroll-snap-align:start;position:relative}.vid video{width:100vw;height:100vh;object-fit:cover}.top{position:fixed;top:0;left:0;right:0;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:20;background:linear-gradient(180deg,rgba(0,0,0,.8),transparent)}.logo{color:#FFD700;font-weight:900;font-size:13px}.badgeLive{position:fixed;top:56px;left:50%;transform:translateX(-50%);background:red;color:#fff;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:900;z-index:20;display:none}.side{position:fixed;right:10px;bottom:110px;z-index:20;display:flex;flex-direction:column;gap:18px}.btn{width:58px;height:58px;border-radius:50%;background:rgba(0,0,0,.45);border:1.5px solid #FFD700;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform.22s cubic-bezier(.34,1.56,.64,1);will-change:transform}.btn:active{transform:scale(1.45);filter:drop-shadow(0 0 18px #FFD700)}.btn b{font-size:20px}.btn span{font-size:10px;color:#FFD700;font-weight:800}.btn-gold{background:linear-gradient(135deg,#FFD700,#FFA500);box-shadow:0 0 20px rgba(255,215,0,.6);animation:pulse 2s infinite}@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,215,0,.7)}50%{box-shadow:0 0 0 14px rgba(255,215,0,0)}100%{box-shadow:0 0 0 0 rgba(255,215,0,0)}}.bottom{position:fixed;bottom:0;left:0;right:0;padding:12px;z-index:20;background:linear-gradient(0deg,rgba(0,0,0,.9),transparent);display:flex;justify-content:space-between;align-items:flex-end}.userBox{background:rgba(0,0,0,.55);backdrop-filter:blur(12px);border:1px solid rgba(255,215,0,.3);border-radius:16px;padding:10px 12px;flex:1;margin-right:10px}.btnPostar{background:linear-gradient(90deg,#FFD700,#FFA500);color:#000;border:0;padding:13px 18px;border-radius:28px;font-weight:900;font-size:13px;box-shadow:0 0 22px rgba(255,215,0,.7)}.btnPostar:active{transform:scale(1.18)}.progress{height:3px;background:rgba(255,255,255,.2);border-radius:2px;margin-top:6px;overflow:hidden}.progress i{display:block;height:100%;background:#FFD700;width:12%}#adBox{position:fixed;inset:0;background:#000;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px}</style></head><body><div class="top"><div class="logo">★ WORK INFLUÊNCIA</div><div id="tempoBadge" style="font-size:9px;background:#FFD700;color:#000;padding:3px 7px;border-radius:12px;font-weight:900">40min hoje</div></div><div id="liveTop" class="badgeLive">🔴 LIVE <span id="liveTimer">40:00</span></div><div class="feed" id="feed"><div class="vid"><video src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" loop muted playsinline autoplay></video></div></div><div class="side"><div class="btn btn-gold" onclick="this.style.transform='scale(1.45)';setTimeout(()=>this.style.transform='scale(1)',300)"><b>❤️</b><span>12.5K</span></div><div class="btn" onclick="this.style.transform='scale(1.45)';setTimeout(()=>this.style.transform='scale(1)',300)"><b>💬</b><span>834</span></div><div class="btn" onclick="this.style.transform='scale(1.45)';setTimeout(()=>this.style.transform='scale(1)',300)"><b>↗️</b><span>1.2K</span></div><div class="btn" style="background:linear-gradient(135deg,#FFD700,#FFA500)" onclick="this.style.transform='scale(1.45)';setTimeout(()=>this.style.transform='scale(1)',300)"><b>🎁</b><span>567</span></div></div><div class="bottom"><div class="userBox"><div style="display:flex;gap:8px;align-items:center"><div style="width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#FFD700,#FFA500);display:flex;align-items:center;justify-content:center;color:#000;font-weight:900;font-size:12px">T</div><b style="font-size:12px">@thiago.work</b><span style="color:#FFD700;font-size:10px">✓</span></div><div style="font-size:11px;margin-top:4px">Como organizar sua rotina pra crescer no digital ✨</div><div class="progress"><i></i></div></div><button class="btnPostar" onclick="document.getElementById('videoInput').click()">📹 Postar 1:30</button></div><input type="file" id="videoInput" accept="video/*" style="display:none"><div id="adBox"><div style="background:#111;border:1.5px solid #FFD700;border-radius:16px;width:100%;max-width:340px;padding:12px;text-align:center"><div style="font-size:10px;color:#FFD700">PUBLICIDADE</div><div style="margin:12px 0;min-height:220px;background:#000;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#555">Seu AdMob aqui<br>Você ganha R$0,03 💰</div><button onclick="this.parentElement.parentElement.style.display='none'" style="background:linear-gradient(90deg,#FFD700,#FFA500);border:0;padding:8px 18px;border-radius:20px;font-weight:900">PULAR →</button></div></div><script>let tempoHoje=parseInt(localStorage.getItem('tempoLiveHoje')||'0');let hojeStr=new Date().toDateString();if(localStorage.getItem('dataLive')!==hojeStr){tempoHoje=0;localStorage.setItem('tempoLiveHoje','0');localStorage.setItem('dataLive',hojeStr);}document.getElementById('tempoBadge').textContent=Math.floor((2400-tempoHoje)/60)+'min hoje';let vistos=0;document.getElementById('feed').addEventListener('scroll',()=>{vistos++;if(vistos%5===0)document.getElementById('adBox').style.display='flex'});document.getElementById('videoInput').addEventListener('change',function(){let f=this.files[0];if(!f)return;let url=URL.createObjectURL(f);let v=document.createElement('video');v.src=url;v.onloadedmetadata=()=>{if(v.duration>92){alert('Máximo 1:30!');return;}let feed=document.getElementById('feed');let d=document.createElement('div');d.className='vid';d.innerHTML=`<video src="${url}" loop playsinline autoplay muted></video>`;feed.prepend(d);d.scrollIntoView({behavior:'smooth'});}});</script></body></html>
