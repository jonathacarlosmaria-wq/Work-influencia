<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store">
<title>WORK FIRE - BOTÕES VIVOS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box!important}
html,body{height:100dvh!important;overflow:hidden!important;background:#000!important}
.app{width:100%!important;max-width:420px!important;height:100dvh!important;margin:0 auto!important;display:flex!important;flex-direction:column!important;position:relative!important;overflow:hidden!important;background:radial-gradient(circle at 50% 0%,#2a0a00,#000)!important}
.feedContainer{flex:1!important;overflow-y:scroll!important;scroll-snap-type:y mandatory!important}
.feedContainer::-webkit-scrollbar{display:none}
.post{height:100dvh!important;position:relative!important;scroll-snap-align:start!important;background:#111 center/cover no-repeat!important}
.post::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(20,0,0,.9) 0%,transparent 60%)}
.top{position:absolute!important;top:10px!important;left:12px!important;right:12px!important;z-index:10!important;display:flex!important;justify-content:space-between!important}
.logo{color:#ff3b00!important;font-weight:900!important;text-shadow:0 0 10px #ff4500!important;animation:fire 1s infinite alternate!important}
@keyframes fire{0%{text-shadow:0 0 5px #ff4500}100%{text-shadow:0 0 15px #ff8c00,0 0 20px #ff4500}}
.onlineBadge{padding:6px 12px!important;border-radius:100px!important;background:linear-gradient(90deg,#ff4500,#ff8c00)!important;color:#000!important;font-weight:900!important;font-size:11px!important;animation:pulse 1.5s infinite!important}
.side{position:absolute!important;right:12px!important;bottom:110px!important;z-index:10!important;display:flex!important;flex-direction:column!important;gap:20px!important}
.sbtn{background:none!important;border:none!important;color:#fff!important;display:flex!important;flex-direction:column!important;align-items:center!important}
.iconBtn{width:56px!important;height:56px!important;border-radius:50%!important;background:radial-gradient(circle,#ff4500,#8b0000)!important;border:2px solid #ff8c00!important;display:flex!important;align-items:center!important;justify-content:center!important;font-size:26px!important;box-shadow:0 0 15px rgba(255,69,0,.6)!important;animation:alive 2s infinite!important}
@keyframes alive{0%,100%{transform:scale(1);box-shadow:0 0 10px rgba(255,69,0,.6)}50%{transform:scale(1.08);box-shadow:0 0 20px rgba(255,140,0,.9)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.info{position:absolute!important;left:12px!important;right:78px!important;bottom:16px!important;z-index:10!important;background:linear-gradient(90deg,rgba(30,5,0,.95),rgba(60,15,0,.9))!important;border:2px solid #ff3300!important;border-radius:14px!important;padding:12px!important;box-shadow:0 0 10px rgba(255,69,0,.3)!important}
.nav{height:66px!important;min-height:66px!important;background:linear-gradient(0deg,#1a0800,#0a0300)!important;border-top:2px solid #ff4500!important;display:flex!important;flex-shrink:0!important}
.nav button{flex:1!important;background:none!important;border:0!important;color:#5a2a00!important;font-weight:800!important;display:flex!important;flex-direction:column!important;align-items:center!important;transition:.2s!important}
.nav button.active{color:#ff8c00!important;text-shadow:0 0 8px #ff4500!important;transform:scale(1.1)!important}
.plus{width:62px!important;height:62px!important;border-radius:50%!important;background:radial-gradient(circle,#ff6a00,#ff0000)!important;border:3px solid #fff!important;color:#fff!important;font-size:30px!important;display:flex!important;align-items:center!important;justify-content:center!important;margin:-24px auto 0!important;box-shadow:0 0 20px #ff4500!important;animation:alive 1.2s infinite!important}
.page{position:absolute!important;inset:0!important;background:radial-gradient(circle,#1a0800,#000)!important;z-index:300!important;display:none!important;flex-direction:column!important;overflow:auto!important}
.page.show{display:flex!important}
.card{background:linear-gradient(135deg,#1e0a00,#2a1200)!important;border:2px solid #ff4500!important;border-radius:14px!important;padding:14px!important;margin:10px 12px!important;box-shadow:0 0 12px rgba(255,69,0,.25)!important}
.input{width:100%!important;padding:13px!important;border-radius:10px!important;background:#1a0a00!important;border:1.5px solid #ff4500!important;color:#fff!important;margin-top:8px!important}
.btn{width:100%!important;padding:13px!important;border-radius:10px!important;background:linear-gradient(90deg,#ff4500,#ff8c00)!important;border:none!important;color:#000!important;font-weight:900!important;margin-top:10px!important;box-shadow:0 0 15px rgba(255,69,0,.5)!important;animation:pulse 1.5s infinite!important}
.adReal{position:absolute!important;inset:0!important;background:rgba(0,0,0,.96)!important;z-index:500!important;display:none!important;flex-direction:column!important;align-items:center!important;justify-content:center!important}
</style>
</head>
<body>
<div class="app">
<div class="feedContainer" id="feedContainer"></div>
<div class="adReal" id="adBox"><div style="background:#111;border:2px solid #ff4500;border-radius:16px;padding:20px;width:90%;max-width:340px;text-align:center"><div style="color:#ff4500;font-weight:900">🔥 ANÚNCIO FIRE</div><div style="margin:16px 0;min-height:80px;background:#000;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#666">Sem ID = Sem anúncio</div><button onclick="closeAd()" style="width:100%;padding:12px;border-radius:10px;background:linear-gradient(90deg,#ff4500,#ff8c00);border:none;color:#000;font-weight:900">✕ FECHAR</button></div></div>

<div class="page" id="pCriar"><div style="display:flex;justify-content:space-between;padding:12px"><h2>🔥 Criar Post Fire</h2><button onclick="closeAll()" style="background:none;border:none;color:#fff;font-size:22px">✕</button></div><div class="card"><input id="postImg" class="input" placeholder="Link imagem https://..."><input id="postDesc" class="input" placeholder="Descrição fire..."><button class="btn" onclick="criarPost()">🔥 POSTAR COM FOGO</button></div></div>

<div class="page" id="pAdmin"><div style="display:flex;justify-content:space-between;padding:12px"><h2>🔥 ADMIN FIRE</h2><button onclick="closeAll()" style="background:none;border:none;color:#fff;font-size:22px">✕</button></div><div class="card" style="border-color:#00ff00"><div style="color:#00ff00;font-weight:900">🟢 <span id="onlineCount">1</span> ONLINE FIRE</div><div style="font-size:11px">Posts: <span id="statPosts">0</span> | Ads: <span id="statAds">0</span></div></div><div class="card"><div style="font-weight:900">💰 ID GOOGLE</div><input id="adsenseId" class="input" placeholder="ca-pub-..."><input id="adFreq" class="input" type="number" value="5"><button class="btn" onclick="saveAds()">💾 Salvar</button></div></div>

<div class="page" id="pEu"><div style="display:flex;justify-content:space-between;padding:12px"><b>🔥 MEU PERFIL FIRE</b><button onclick="closeAll()" style="background:none;border:none;color:#fff;font-size:22px">✕</button></div><div style="padding:16px;text-align:center"><div id="perfilFoto" style="width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,#ff4500,#8b0000);margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:36px;box-shadow:0 0 20px #ff4500;animation:alive 1.5s infinite">🔥</div><div style="font-weight:900;margin-top:8px" id="perfilNome">FIRE ADMIN</div><div style="color:#ff8c00;font-size:11px">● <span id="onlinePerfil">1</span> ONLINE FIRE</div></div><div class="card"><div style="font-weight:900">📝 CADASTRO FIRE</div><input id="cadNome" class="input" placeholder="Seu nome"><input id="cadUser" class="input" placeholder="Seu @"><input id="cadBio" class="input" placeholder="Sua bio fire"><input id="cadFoto" class="input" placeholder="Link foto"><button class="btn" onclick="salvarPerfil()">🔥 SALVAR PERFIL FIRE</button></div><div class="card"><button onclick="openAdmin()" style="width:100%;padding:16px;border-radius:12px;background:linear-gradient(90deg,#ff4500,#ff8c00);border:3px solid #fff;color:#000;font-weight:900;animation:pulse 1s infinite">🔥 PAINEL FIRE</button><div style="font-size:10px;color:#aaa;text-align:center;margin-top:6px">Senha: admin123</div></div></div>

<div class="nav"><button id="b0" class="active" onclick="go(0)">🏠<span>Inicio</span></button><button onclick="go(1)">🔍<span>Busca</span></button><button onclick="go(2)"><div class="plus">+</div></button><button onclick="go(3)">🔴<span>Live</span></button><button id="b4" onclick="go(4)">🔥<span>Eu</span></button></div>
</div>
<script>
let userData=JSON.parse(localStorage.getItem('userPerfil_v2')||'{"nome":"FIRE ADMIN","user":"@fire","bio":"Fogo","foto":""}');
let posts=JSON.parse(localStorage.getItem('posts_fire')||'[{"owner":"fire.influencer","img":"https://images.unsplash.com/photo-1499092346589-b9b6be3e94b2?w=800","desc":"🔥 TEMA FIRE - Botões vivos pulsando!","likes":7777}]');
let adConfig=JSON.parse(localStorage.getItem('adConfig_v2')||'{"freq":5,"adsense":"","admob":""}');
let totalAds=0,cur=0,adCount=0,online=1;
function updateOnline(){ online=3+Math.floor(Math.random()*7); document.getElementById('onlineCount').innerText=online; document.getElementById('onlinePerfil').innerText=online; document.getElementById('statPosts').innerText=posts.length; document.getElementById('perfilNome').innerText=userData.nome; document.getElementById('perfilUser')?.innerText; document.getElementById('cadNome').value=userData.nome; document.getElementById('cadUser').value=userData.user; document.getElementById('cadBio').value=userData.bio; document.getElementById('cadFoto').value=userData.foto||''; if(userData.foto) document.getElementById('perfilFoto').innerHTML='<img src="'+userData.foto+'" style="width:100%;height:100%;border-radius:50%;object-fit:cover">'; }
function salvarPerfil(){ userData.nome=document.getElementById('cadNome').value||'FIRE'; userData.user=document.getElementById('cadUser').value||'@fire'; userData.bio=document.getElementById('cadBio').value||''; userData.foto=document.getElementById('cadFoto').value||''; localStorage.setItem('userPerfil_v2',JSON.stringify(userData)); updateOnline(); alert('🔥 Salvo!'); }
function renderFeed(){ document.getElementById('feedContainer').innerHTML=posts.map(p=>`<div class="post" style="background-image:url('${p.img}')"><div class="top"><div class="logo">🔥 WORK FIRE</div><div class="onlineBadge">🔥 ${online} FIRE ONLINE</div></div><div class="side"><button class="sbtn"><div class="iconBtn">🔥</div><small>${p.likes}</small></button><button class="sbtn"><div class="iconBtn">❤️</div></button></div><div class="info"><div style="font-weight:900">@${p.owner}</div><div>🔥 ${p.desc}</div></div></div>`).join(''); }
function criarPost(){ let img=document.getElementById('postImg').value; let desc=document.getElementById('postDesc').value||'Fire post'; if(!img){alert('Imagem');return;} posts.unshift({owner:userData.user.replace('@',''),img:img,desc:desc,likes:0}); localStorage.setItem('posts_fire',JSON.stringify(posts)); renderFeed(); closeAll(); go(0); updateOnline(); }
function closeAd(){ document.getElementById('adBox').style.display='none'; }
function go(n){ if(n===2){ document.querySelectorAll('.page').forEach(p=>p.classList.remove('show')); document.getElementById('pCriar').classList.add('show'); return; } document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active')); document.getElementById('b'+n)?.classList.add('active'); document.querySelectorAll('.page').forEach(p=>p.classList.remove('show')); if(n===4) document.getElementById('pEu').classList.add('show'); }
function closeAll(){ document.querySelectorAll('.page').forEach(p=>p.classList.remove('show')); document.getElementById('adBox').style.display='none'; }
function openAdmin(){ let s=prompt('Senha:'); if(s==='admin123') document.getElementById('pAdmin').classList.add('show'); }
function saveAds(){ adConfig.adsense=document.getElementById('adsenseId').value; localStorage.setItem('adConfig_v2',JSON.stringify(adConfig)); alert('Salvo'); closeAll(); }
renderFeed(); updateOnline(); setInterval(()=>{ online=3+Math.floor(Math.random()*7); let a=document.getElementById('onlineCount'); if(a) a.innerText=online; let b=document.getElementById('onlinePerfil'); if(b) b.innerText=online; },2500);
</script>
</body>
</html>
