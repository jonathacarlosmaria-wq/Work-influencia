<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WORK FIRE - BOTÃO DE SOM</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100dvh;background:#000;overflow:hidden;font-family:-apple-system,sans-serif}
#app{width:100%;max-width:420px;height:100dvh;margin:0 auto;background:#000;display:flex;flex-direction:column;position:relative}
#feed{flex:1;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch}
#feed::-webkit-scrollbar{display:none}
.post{height:100dvh;width:100%;position:relative;scroll-snap-align:start;background:#111;flex-shrink:0;overflow:hidden}
.post video,.post img{width:100%;height:100%;object-fit:cover;display:block;background:#000}
.post::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 20%,rgba(0,0,0,.2) 60%,rgba(0,0,0,.9) 100%);pointer-events:none;z-index:1}
.rightBar{position:absolute;right:8px;bottom:90px;z-index:10;display:flex;flex-direction:column;gap:11px;width:60px}
.btnTik{border:none;background:none;display:flex;flex-direction:column;align-items:center;cursor:pointer;width:100%}
.iconTik{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff;background:rgba(35,35,35,.85);border:1.5px solid rgba(255,255,255,.18)}
.iconTik.fire{background:radial-gradient(circle at 30% 25%,#ff8c00,#ff4500 55%,#8b0000)}
.txtTik{color:#fff;font-size:8px;font-weight:800;margin-top:3px;text-shadow:0 1px 6px #000;text-align:center}
.info{position:absolute;left:10px;right:76px;bottom:82px;z-index:10;background:rgba(0,0,0,.6);border-radius:12px;padding:9px 10px}
.info b{color:#fff;font-size:11px}
.info div{color:#ddd;font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{height:64px;background:#0a0700;border-top:1.5px solid rgba(255,69,0,.35);display:flex;align-items:center;justify-content:space-around;z-index:30;flex-shrink:0}
.nav button{flex:1;background:none;border:none;color:rgba(255,255,255,.5);font-size:8.5px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button.on{color:#ff8c00}
.nav button i{font-size:18px}
.plus{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#ff8c00,#ff2200);border:2.5px solid #fff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;margin-top:-20px;box-shadow:0 0 0 4px #000}
.page{position:absolute;inset:0;background:#000;z-index:20;display:none;flex-direction:column;overflow-y:auto;padding-bottom:70px}
.page.show{display:flex}
.card{background:rgba(25,12,0,.92);border:1px solid rgba(255,69,0,.22);border-radius:12px;padding:12px;margin:10px}
.input{width:100%;padding:11px;background:#1e1100;border:1px solid rgba(255,69,0,.32);border-radius:10px;color:#fff;margin-top:7px;font-size:13px}
.btn{width:100%;padding:14px;background:linear-gradient(90deg,#ff4500,#ff8c00);border:none;border-radius:12px;color:#000;font-weight:900;margin-top:10px;font-size:13px;cursor:pointer}
.camBox{position:relative;width:100%;height:42vh;background:#000;border-radius:14px;overflow:hidden;border:2px solid #00ff88;margin-top:10px}
.camBox video{width:100%;height:100%;object-fit:cover}
.camBox video.mirror{transform:scaleX(-1)}
.timerCam{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#00ff88;color:#000;padding:5px 14px;border-radius:20px;font-weight:900;font-size:13px;z-index:5}
.ctrlCam{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:20px;z-index:5}
.circ{width:68px;height:68px;border-radius:50%;border:4px solid #fff;background:#ff0000;display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;cursor:pointer}
.circ.stop{background:#fff;color:#ff0000}
.previewArea{display:none;margin-top:10px;border:3px solid #00ff88;border-radius:14px;overflow:hidden;background:#000;position:relative}
.previewArea.show{display:block}
.btnPostar{width:100%;padding:16px;background:linear-gradient(90deg,#00ff88,#00ff44);border:3px solid #fff;border-radius:14px;color:#000;font-weight:900;font-size:15px;margin-top:10px;display:none}
.btnPostar.show{display:block}

/* BOTÃO DE SOM - NOVO DESIGN */
.soundBtn{position:absolute;left:12px;top:50%;transform:translateY(-50%);z-index:20;width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.6);border:2.5px solid #fff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;backdrop-filter:blur(6px);transition:.2s}
.soundBtn.on{background:#00ff88;border-color:#00ff88;color:#000;box-shadow:0 0 18px #00ff88}
.soundBtn.off{background:rgba(0,0,0,.7);border-color:rgba(255,255,255,.8);color:#fff}
.soundBtn.pulse{animation:pulseSom 1.2s infinite}
@keyframes pulseSom{0%,100%{transform:translateY(-50%) scale(1)}50%{transform:translateY(-50%) scale(1.08)}}
.soundLabel{position:absolute;left:12px;top:50%;transform:translateY(-50%) translateX(60px);z-index:19;background:rgba(0,0,0,.7);color:#fff;padding:6px 12px;border-radius:20px;font-size:10px;font-weight:800;pointer-events:none;opacity:0;transition:.2s}
.soundLabel.show{opacity:1}
.tapSom{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,255,136,.95);color:#000;padding:12px 22px;border-radius:30px;font-weight:900;font-size:13px;z-index:25;display:flex;align-items:center;gap:8px}
</style>
</head>
<body>
<div id="app">
<div id="feed"></div>

<div id="pCriar" class="page">
<div style="display:flex;justify-content:space-between;padding:14px"><h3 style="color:#00ff88">📤 BOTÃO DE SOM 🔊</h3><button onclick="closeAll();stopCam()" style="background:rgba(255,255,255,.12);border:none;color:#fff;width:32px;height:32px;border-radius:50%">✕</button></div>
<div class="card" style="border:2px solid #00ff88">
<div style="background:#00ff88;color:#000;padding:7px;border-radius:8px;text-align:center;font-weight:900;font-size:11px">🔊 BOTÃO DE SOM - USUÁRIO ESCOLHE 🔊 / 🔇</div>
<div class="camBox" id="camBox" style="display:none"><div id="timer" class="timerCam">00:00 / 05:00 🔊 COM SOM</div><video id="camVideo" autoplay muted playsinline class="mirror"></video><div class="ctrlCam"><div id="btnRec" class="circ" onclick="toggleRec()"><i class="fa-solid fa-circle"></i></div></div></div>
<div id="camOff" style="text-align:center;padding:14px;background:#111;border-radius:12px;border:2px solid #00ff88;margin-top:10px"><i class="fa-solid fa-volume-high" style="font-size:28px;color:#00ff88"></i><div style="color:#fff;font-size:12px;margin-top:6px;font-weight:900">VÍDEO COM BOTÃO DE SOM</div><button class="btn" onclick="startCam('user')" style="margin-top:10px;background:#00ff88;color:#000">ABRIR CÂMERA COM SOM</button></div>
<div id="previewArea" class="previewArea"><video id="previewVideo" style="width:100%;height:38vh;object-fit:cover;display:block" controls playsinline loop></video></div>
<button id="btnPostar" class="btnPostar" onclick="postar()">🚀 POSTAR COM SOM 🔊</button>
<input id="file" type="file" accept="video/*,image/*" style="color:#fff;width:100%;margin-top:10px"><input id="desc" class="input" placeholder="Legenda...">
</div></div>

<div id="pEu" class="page"><div style="display:flex;justify-content:space-between;padding:14px"><b style="color:#ff4500">Eu</b><button onclick="closeAll()" style="background:rgba(255,255,255,.12);border:none;color:#fff;width:32px;height:32px;border-radius:50%">✕</button></div>
<div class="card" style="text-align:center;border:2px solid #00ff88"><input id="fotoPerfil" type="file" accept="image/*" hidden onchange="trocarFoto(this)"><div id="avatarBox" style="width:80px;height:80px;border-radius:50%;border:3px solid #ff8c00;background:radial-gradient(circle at 30% 30%,#ff7a00,#7a0000);margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:28px">🔥</div><input id="nomeUser" class="input" placeholder="Seu nome" style="text-align:center;font-weight:900"><button class="btn" onclick="salvarPerfil()">💾 SALVAR PERFIL</button><div style="color:#00ff88;font-size:9px;margin-top:8px">♾️ ILIMITADO • PERFIL GRAVADO • SOM COM BOTÃO</div></div>
<div class="card"><b style="color:#ff8c00">🎬 Meus posts - excluir quando quiser</b><div id="meusGrid" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px"></div></div>
</div>

<div class="nav"><button id="b0" class="on" onclick="go(0)"><i class="fa-solid fa-house"></i><span>Inicio</span></button><button onclick="go(2)"><div class="plus"><i class="fa-solid fa-plus"></i></div></button><button onclick="go(4)"><i class="fa-solid fa-user"></i><span>Eu</span></button></div>
</div>

<script>
let uid=localStorage.getItem("uid")||"u_"+Math.random().toString(36).slice(2,7); localStorage.setItem("uid",uid);
let userFoto=localStorage.getItem("userFoto")||"",userNome=localStorage.getItem("userNome")||"";
let posts=JSON.parse(localStorage.getItem("work_som_btn")||"[]"); let temp="",tempType="video";
let stream=null,recorder=null,chunks=[],recording=false,timerInt=null,sec=0,somGlobal=false,observer=null;

if(localStorage.getItem('somGlobal')==='1') somGlobal=true;

function save(){try{localStorage.setItem("work_som_btn",JSON.stringify(posts.slice(0,30)));}catch(e){posts=posts.slice(0,15); save();}}

// SISTEMA SOM - BOTÃO QUE USUÁRIO ESCOLHE
function setupObserver(){
if(observer) observer.disconnect();
observer=new IntersectionObserver((entries)=>{
entries.forEach(en=>{
let v=en.target.querySelector('video'); if(!v) return;
if(en.isIntersecting){
if(somGlobal){v.muted=false; v.volume=1;}
v.play().catch(()=>{});
} else {v.pause();}
});
},{threshold:0.7});
document.querySelectorAll('.post').forEach(p=>observer.observe(p));
}

function toggleSomGlobal(btn){
let post=btn.closest('.post');
let video=post.querySelector('video');
let label=post.querySelector('.soundLabel');
if(!video) return;

if(video.muted){
// LIGAR SOM
video.muted=false;
video.volume=1;
video.play().catch(()=>{});
btn.classList.remove('off');
btn.classList.add('on');
btn.innerHTML='<i class="fa-solid fa-volume-high"></i>';
if(label){label.innerText='SOM LIGADO 🔊'; label.classList.add('show'); setTimeout(()=>label.classList.remove('show'),1500);}
somGlobal=true;
localStorage.setItem('somGlobal','1');
document.querySelectorAll('#feed video').forEach(v=>{
if(v!==video){v.muted=false; v.volume=1;}
});
document.querySelectorAll('.soundBtn').forEach(b=>{
if(b!==btn){b.classList.remove('off'); b.classList.add('on'); b.innerHTML='<i class="fa-solid fa-volume-high"></i>';}
});
let tap=document.getElementById('tapSom'); if(tap) tap.style.display='none';
} else {
// DESLIGAR SOM
video.muted=true;
btn.classList.remove('on');
btn.classList.add('off');
btn.innerHTML='<i class="fa-solid fa-volume-xmark"></i>';
if(label){label.innerText='SOM DESLIGADO 🔇'; label.classList.add('show'); setTimeout(()=>label.classList.remove('show'),1500);}
somGlobal=false;
localStorage.setItem('somGlobal','0');
document.querySelectorAll('#feed video').forEach(v=>{v.muted=true;});
document.querySelectorAll('.soundBtn').forEach(b=>{
b.classList.remove('on'); b.classList.add('off'); b.innerHTML='<i class="fa-solid fa-volume-xmark"></i>';
});
}
}

function ativarSomPrimeiroToque(){
if(!somGlobal){
somGlobal=true;
localStorage.setItem('somGlobal','1');
document.querySelectorAll('#feed video').forEach(v=>{v.muted=false; v.volume=1; v.play().catch(()=>{});});
document.querySelectorAll('.soundBtn').forEach(b=>{b.classList.remove('off'); b.classList.add('on'); b.innerHTML='<i class="fa-solid fa-volume-high"></i>';});
let tap=document.getElementById('tapSom'); if(tap) tap.style.display='none';
}
}

async function startCam(f){if(stream) stream.getTracks().forEach(t=>t.stop()); stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:f,width:720,height:1280},audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}}); document.getElementById("camVideo").srcObject=stream; document.getElementById("camBox").style.display="block"; document.getElementById("camOff").style.display="none";}
function stopCam(){if(stream) stream.getTracks().forEach(t=>t.stop()); stream=null; document.getElementById("camBox").style.display="none"; document.getElementById("camOff").style.display="block"; clearInterval(timerInt); if(recording) stopRec();}
function toggleRec(){if(!recording) startRec(); else stopRec();}
function startRec(){if(!stream) return alert("Abra câmera"); chunks=[]; let mime="video/webm;codecs=vp9,opus"; if(!MediaRecorder.isTypeSupported(mime)) mime="video/webm"; recorder=new MediaRecorder(stream,{mimeType:mime,audioBitsPerSecond:128000,videoBitsPerSecond:1200000}); recorder.ondataavailable=e=>{if(e.data.size>0) chunks.push(e.data);}; recorder.onstop=()=>{let blob=new Blob(chunks,{type:mime}); temp=URL.createObjectURL(blob); tempType="video"; let pv=document.getElementById("previewVideo"); pv.src=temp; pv.muted=false; pv.volume=1; pv.play().catch(()=>{}); document.getElementById("previewArea").classList.add("show"); document.getElementById("btnPostar").classList.add("show");}; recorder.start(100); recording=true; sec=0; timerInt=setInterval(()=>{sec++; let m=String(Math.floor(sec/60)).padStart(2,'0'); let s=String(sec%60).padStart(2,'0'); document.getElementById("timer").innerText=`${m}:${s} / 05:00 🔊`; if(sec>=300) stopRec();},1000);}
function stopRec(){try{recorder.stop();}catch(e){} recording=false; clearInterval(timerInt);}

function salvarPerfil(){let n=document.getElementById("nomeUser").value.trim().toLowerCase().replace(/@/g,"").replace(/\s/g,""); if(!n) return alert("Digite nome"); userNome=n; localStorage.setItem("userNome",n); render(); alert("✅ Perfil @"+n+" gravado! ♾️ ilimitado");}

function trocarFoto(inp){let f=inp.files[0]; if(!f) return; let r=new FileReader(); r.onload=e=>{userFoto=e.target.result; localStorage.setItem("userFoto",userFoto); document.getElementById("avatarBox").innerHTML=`<img src="${userFoto}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`; render();}; r.readAsDataURL(f);}

function postar(){let d=document.getElementById("desc").value||"Meu vídeo com botão de som 🔊"; if(!temp) return alert("Grave vídeo"); if(!userNome){alert("Salve perfil em EU"); go(4); return;} posts.unshift({id:Date.now(),owner:userNome,ownerId:uid,img:temp,desc:d,type:tempType,time:Date.now()}); save(); temp=""; document.getElementById("previewArea").classList.remove("show"); document.getElementById("btnPostar").classList.remove("show"); document.getElementById("desc").value=""; render(); go(0); stopCam();}

function render(){
let lista=posts.sort((a,b)=>b.time-a.time);
document.getElementById("feed").innerHTML=lista.map((p,i)=>{

let media=p.type==="video"?`
<video src="${p.img}" loop playsinline ${somGlobal?'':'muted'} preload="metadata" style="width:100%;height:100%;object-fit:cover" onclick="ativarSomPrimeiroToque()"></video>
<button class="soundBtn ${somGlobal?'on':'off pulse'}" onclick="toggleSomGlobal(this)">
<i class="fa-solid ${somGlobal?'fa-volume-high':'fa-volume-xmark'}"></i>
</button>
<div class="soundLabel">${somGlobal?'SOM LIGADO 🔊':'TOQUE P/ SOM'}</div>
${i==0&&!somGlobal?`<div id="tapSom" class="tapSom" onclick="ativarSomPrimeiroToque()">🔊 TOQUE PARA ATIVAR SOM</div>`:''}
`:`<img src="${p.img}">`;

return `<div class="post">${media}<div class="rightBar"><div class="iconTik fire"><i class="fa-solid fa-fire"></i></div><div class="txtTik">Chamas</div><div class="iconTik"><i class="fa-regular fa-heart"></i></div><div class="txtTik">Curtir</div><div class="iconTik"><i class="fa-regular fa-comment-dots"></i></div><div class="txtTik">Comen</div>${p.ownerId===uid?`<button class="btnTik" onclick="excluirPost(${p.id})"><div class="iconTik" style="background:#ff0000"><i class="fa-solid fa-trash"></i></div><div class="txtTik">Excluir</div></button>`:`<div class="iconTik"><i class="fa-solid fa-share"></i></div>`}</div><div class="info"><b>@${p.owner}</b> ${p.type==="video"?`<span style="background:${somGlobal?'#00ff88':'#333'};color:${somGlobal?'#000':'#fff'};padding:2px 6px;border-radius:10px;font-size:8px">${somGlobal?'🔊 SOM ON':'🔇 SOM OFF'}</span>`:''}<div>${p.desc.slice(0,60)}</div></div></div>`;
}).join("");

let meus=posts.filter(p=>p.ownerId===uid);
document.getElementById("meusGrid").innerHTML=meus.map(p=>`<div style="position:relative;border-radius:10px;overflow:hidden;background:#111;height:110px;border:1px solid rgba(255,69,0,.2)">${p.type==="video"?`<video src="${p.img}" muted style="width:100%;height:100%;object-fit:cover"></video>`:`<img src="${p.img}" style="width:100%;height:100%;object-fit:cover">`}<div style="position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:#ff0000;color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px" onclick="excluirPost(${p.id})">✕</div></div>`).join("")||"<div style='color:#555;font-size:10px;grid-column:1/2'>Nenhum post</div>";
document.getElementById("nomeUser").value=userNome;
if(userFoto) document.getElementById("avatarBox").innerHTML=`<img src="${userFoto}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
setTimeout(setupObserver,200);
}

function excluirPost(id){if(!confirm("Excluir?")) return; posts=posts.filter(p=>p.id!=id); save(); render();}
function go(n){document.querySelectorAll(".page").forEach(p=>p.classList.remove("show")); if(n==2) document.getElementById("pCriar").classList.add("show"); if(n==4) document.getElementById("pEu").classList.add("show"); if(n==0) document.getElementById("b0").classList.add("on");}
function closeAll(){stopCam(); document.querySelectorAll(".page").forEach(p=>p.classList.remove("show"));}

document.getElementById("file").addEventListener("change",e=>{
let f=e.target.files[0]; if(!f) return; temp=URL.createObjectURL(f); tempType=f.type.startsWith('video/')?'video':'image';
let pv=document.getElementById("previewVideo"); pv.src=temp; pv.muted=false; pv.volume=1; pv.play().catch(()=>{}); document.getElementById("previewArea").classList.add("show"); document.getElementById("btnPostar").classList.add("show");
});

render();
</script>
</body>
</html>
