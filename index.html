<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WORK - LIVE TEMPO TIKTOK - SEM DEFORMAR</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;display:flex;justify-content:center;font-family:system-ui}
.app{width:100%;max-width:440px;height:100dvh;background:#000;position:relative;display:flex;flex-direction:column;overflow:hidden}
.stage{flex:1;position:relative;overflow:hidden}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
.vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.2),transparent 30%,transparent 60%,rgba(0,0,0,.9))}
.top{position:absolute;top:0;left:0;right:0;height:44px;display:flex;align-items:center;justify-content:center;gap:18px;z-index:10}
.t{color:rgba(255,255,255,.5);font-size:14px;font-weight:600;padding:5px 0;border-bottom:2px solid transparent}
.t.on{color:#fff;border-color:#fff}
.right{position:absolute;right:8px;bottom:86px;z-index:10;display:flex;flex-direction:column;gap:16px;align-items:center;width:60px}
.ab{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:22px;position:relative;overflow:hidden}
.ab img{width:100%;height:100%;object-fit:cover}
.ab.f{border:2.5px solid #FFD700;background:#111}
.badge{position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);width:18px;height:18px;border-radius:50%;border:2px solid #000;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900}
.badge.plus{background:#fe2c55;color:#fff}
.badge.ok{background:#00e676;color:#fff}
.bot{position:absolute;left:10px;right:78px;bottom:10px;z-index:10;color:#fff}
.urow{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.up{width:36px;height:36px;border-radius:50%;border:2px solid #fff;object-fit:cover;background:#222}
.un{font-weight:800;font-size:13px}
.fb{margin-left:6px;padding:4px 10px;border-radius:14px;font-size:10px;font-weight:900;border:1px solid #fff;cursor:pointer}
.fb.f{background:transparent;color:#fff}
.fb.ok{background:#fff;color:#000}
.de{font-size:12px;line-height:1.3;opacity:.9}
.nav{height:66px;min-height:66px;background:#000;border-top:1px solid #1e1e1e;display:flex;align-items:center;justify-content:space-around;flex-shrink:0}
.nt{flex:1;display:flex;flex-direction:column;align-items:center;color:#555;font-size:9px;font-weight:700}
.nt.on{color:#fff}
.nt div:first-child{font-size:20px}
.np{width:42px;height:26px;background:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#000;font-weight:900;font-size:18px}
#toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;color:#000;padding:10px 18px;border-radius:20px;font-weight:800;font-size:11px;z-index:9000;display:none}#toast.on{display:block}
#cam{position:fixed;inset:0;background:#000;z-index:9999;display:none;flex-direction:column;max-width:440px;left:50%;transform:translateX(-50%)}
#camEl{flex:1;width:100%;object-fit:cover}
#liveM{position:fixed;inset:0;background:#000;z-index:9998;display:none;flex-direction:column;max-width:440px;left:50%;transform:translateX(-50%)}
#liveV{width:100%;height:100%;object-fit:cover}
.liveTop{position:absolute;top:0;left:0;right:0;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;z-index:10;background:linear-gradient(180deg,rgba(0,0,0,.7),transparent)}
.liveBadge{background:#fe2c55;color:#fff;padding:5px 10px;border-radius:4px;font-weight:900;font-size:11px;display:flex;align-items:center;gap:5px;border:1px solid #fff}
.liveTime{background:rgba(0,0,0,.6);color:#fff;padding:5px 10px;border-radius:14px;font-size:12px;font-weight:900;border:1px solid rgba(255,255,255,.3);min-width:56px;text-align:center}
.dot{width:7px;height:7px;background:#fff;border-radius:50%;animation:b 1s infinite}@keyframes b{50%{opacity:.3}}
</style>
</head>
<body>
<div id="toast"></div>
<div class="app">
<div class="stage" id="stage"></div>
<div class="nav">
<div class="nt on"><div>🏠</div>Início</div>
<div class="nt"><div>🔍</div>Descobrir</div>
<div onclick="goCam()"><div class="np">+</div></div>
<div class="nt"><div>📩</div>Inbox</div>
<div class="nt" onclick="goProfile()"><div id="np">👤</div>Perfil</div>
</div>
</div>

<div id="cam"><video id="camEl" autoplay muted playsinline></video><canvas id="pc" style="display:none"></canvas><div style="position:absolute;top:0;left:0;right:0;padding:10px;display:flex;justify-content:space-between"><button onclick="closeAll()" style="width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.5);border:1px solid #fff;color:#fff">✕</button><button onclick="postNow()" style="background:#fe2c55;color:#fff;border:none;padding:6px 14px;border-radius:16px;font-weight:900;font-size:11px">Postar</button></div><div style="position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:8px"><button id="bF" onclick="setM('foto')" style="padding:6px 12px;border-radius:16px;background:#fff;color:#000;font-weight:800;border:none;font-size:10px">FOTO</button><button id="bV" onclick="setM('video')" style="padding:6px 12px;border-radius:16px;background:rgba(255,255,255,.15);color:#fff;font-weight:800;border:1px solid #fff;font-size:10px">VÍDEO</button><button id="bL" onclick="setM('live')" style="padding:6px 12px;border-radius:16px;background:rgba(255,255,255,.15);color:#fff;font-weight:800;border:1px solid #fff;font-size:10px">LIVE</button></div><div style="position:absolute;bottom:50px;left:0;right:0;display:flex;justify-content:center"><button id="shut" onclick="cap()" style="width:64px;height:64px;border-radius:50%;background:#fff;border:4px solid rgba(255,255,255,.3);font-size:20px">📸</button></div></div>

<div id="liveM">
<video id="liveV" autoplay muted playsinline></video>
<div class="liveTop">
<div style="display:flex;gap:8px;align-items:center">
<div class="liveBadge"><div class="dot"></div>AO VIVO</div>
<div id="liveT" class="liveTime">00:00</div>
</div>
<button onclick="closeAll()" style="width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.5);border:1px solid #fff;color:#fff">✕</button>
</div>
<div id="liveI" style="position:absolute;top:52px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);padding:6px 12px;border-radius:14px;font-size:10px;font-weight:700;color:#FFD700;border:1px solid rgba(255,215,0,.3);z-index:10;white-space:nowrap">🔴 Gravando...</div>
<div style="position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(255,255,255,.2);z-index:10"><div id="liveBar" style="height:100%;width:0%;background:#fe2c55;transition:width 1s linear"></div></div>
<button id="liveB" onclick="stopLive()" style="position:absolute;bottom:20px;left:50%;transform:translateX(-50%);width:68px;height:68px;border-radius:50%;background:#fe2c55;border:4px solid #fff;color:#fff;font-size:24px;z-index:10">■</button>
</div>

<div id="profileM" style="position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:1000;display:none;flex-direction:column"><div style="flex:1" onclick="closeAll()"></div><div style="background:#121212;border-radius:18px 18px 0 0;padding:14px"><div style="text-align:center"><img id="pp" style="width:80px;height:80px;border-radius:50%;border:3px solid #fff;object-fit:cover;display:none"><div id="ph" style="width:80px;height:80px;border-radius:50%;background:#222;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto">👤</div><input type="file" id="pi" accept="image/*" style="display:none"><br><button onclick="document.getElementById('pi').click()" style="margin-top:8px;padding:6px 12px;border-radius:14px;background:#fe2c55;color:#fff;border:none;font-weight:800;font-size:10px">📸 Foto</button><div id="pn" style="font-weight:800;margin-top:8px"></div><div id="pnn" style="color:#777;font-size:11px"></div></div><button onclick="closeAll()" style="width:100%;margin-top:12px;padding:10px;border-radius:10px;background:#fff;color:#000;font-weight:800;border:none">Fechar</button></div></div>

<script>
const ADMIN="jonathacarlosmaria";
let db=null,stream=null,cur=0,mode='foto',photoData=null,allVideos=[];
let liveTmr=null,liveS=0;
const LIM=1800;
function toast(t){let e=document.getElementById('toast');e.innerText=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2000)}
function closeAll(){document.getElementById('cam').style.display='none';document.getElementById('liveM').style.display='none';document.getElementById('profileM').style.display='none';if(stream){try{stream.getTracks().forEach(x=>x.stop())}catch{} stream=null}clearInterval(liveTmr);liveS=0;document.getElementById('liveBar').style.width='0%'}
function getU(){try{let u=JSON.parse(localStorage.getItem('work_current_user')||'{}');if(!u.nick)u={nick:ADMIN,name:"Jonatha",pic:localStorage.getItem('work_owner_pic')||""};return u}catch{return {nick:ADMIN,name:"Jonatha"}}
}
function getPic(n){let me=getU();if(me.nick===n&&me.pic)return me.pic;return ""}
function getUso(){let d=JSON.parse(localStorage.getItem('liveUso')||'{}');if(d.data!==new Date().toDateString())return 0;return d.seg||0}
function saveUso(s){localStorage.setItem('liveUso',JSON.stringify({data:new Date().toDateString(),seg:s}))}
function render(){
if(allVideos.length===0) allVideos=[{id:1,desc:"WORK SEM DEFORMAR - LIVE TEMPO TIKTOK 🔴👑",img:"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?q=80&w=1000",type:'foto',owner:ADMIN,likes:1200}];
let v=allVideos[cur];
let pic=getPic(v.owner);
let inner=pic?`<img src="${pic}">`:`${v.owner[0].toUpperCase()}`;
let badge=`<div class="badge plus">+</div>`;
let up=pic?`<img src="${pic}" class="up">`:`<div class="up" style="display:flex;align-items:center;justify-content:center;background:#222;font-weight:900">${v.owner[0].toUpperCase()}</div>`;
document.getElementById('stage').innerHTML=`<div class="bg" style="background-image:url('${v.data||v.img}')"></div><div class="grad"></div><div class="top"><div class="t">Seguindo</div><div class="t on">Para você</div></div><div class="right"><div class="ab f">${inner}${badge}</div><div class="ab">❤️</div><div class="ab">💬</div><div class="ab">↗️</div></div><div class="bot"><div class="urow">${up}<div class="un">@${v.owner}</div></div><div class="de">${v.desc}</div></div>`;
}
function goCam(){document.getElementById('cam').style.display='flex';navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true}).then(s=>{stream=s;document.getElementById('camEl').srcObject=s;setM('foto')}).catch(()=>toast('Permita câmera'))}
function setM(m){mode=m;document.getElementById('bF').style.background=m==='foto'?'#fff':'rgba(255,255,255,.15)';document.getElementById('bL').style.background=m==='live'?'#fe2c55':'rgba(255,255,255,.15)';document.getElementById('shut').innerText=m==='foto'?'📸':'●';if(m==='live'){closeAll();openLive()}}
function cap(){if(mode==='foto'){let v=document.getElementById('camEl');let c=document.getElementById('pc');c.width=v.videoWidth||1080;c.height=v.videoHeight||1920;c.getContext('2d').drawImage(v,0,0,c.width,c.height);photoData=c.toDataURL('image/jpeg',0.9);toast('✅ Foto! Clique Postar')}else if(mode==='live'){openLive()}}
function postNow(){if(!photoData){toast('Tire foto');return}let me=getU();allVideos.unshift({id:Date.now(),data:photoData,desc:'Foto #work',type:'foto',likes:0,owner:me.nick});closeAll();photoData=null;toast('✅ Postado!');render()}

// ===== LIVE IGUAL TIKTOK - TEMPO AUTOMÁTICO =====
function openLive(){
let resta=LIM-getUso();
if(resta<=0){toast('⏰ 30min acabaram hoje!');return}
document.getElementById('liveM').style.display='flex';
navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true}).then(s=>{
stream=s;
document.getElementById('liveV').srcObject=s;
liveS=0;
document.getElementById('liveT').innerText='00:00';
document.getElementById('liveBar').style.width='0%';
document.getElementById('liveI').innerText=`🔴 AO VIVO - Resta hoje: ${Math.floor(resta/60)}:${String(resta%60).padStart(2,'0')}`;
// JÁ COMEÇA A CONTAR AUTOMÁTICO IGUAL TIKTOK
liveTmr=setInterval(()=>{
liveS++;
let total=getUso()+liveS;
saveUso(total);
let falta=LIM-total;
let m=String(Math.floor(liveS/60)).padStart(2,'0');
let sec=String(liveS%60).padStart(2,'0');
document.getElementById('liveT').innerText=`${m}:${sec}`;
document.getElementById('liveI').innerText=`🔴 ${m}:${sec} gravando | Resta: ${Math.floor(falta/60)}:${String(falta%60).padStart(2,'0')}`;
document.getElementById('liveBar').style.width=(liveS/1800*100)+'%';
if(falta<=0){clearInterval(liveTmr);toast('⏰ 30min!');closeAll()}
},1000);
toast('🔴 LIVE começou - Tempo contando igual TikTok!');
}).catch(()=>toast('Permita câmera'));
}
function stopLive(){clearInterval(liveTmr);toast(`✅ LIVE ${document.getElementById('liveT').innerText} salva!`);closeAll();render()}
function goProfile(){let c=getU();document.getElementById('pn').innerText=c.name;document.getElementById('pnn').innerText='@'+c.nick;let pp=document.getElementById('pp');let ph=document.getElementById('ph');if(c.pic){pp.src=c.pic;pp.style.display='block';ph.style.display='none';document.getElementById('np').innerHTML=`<img src="${c.pic}" style="width:20px;height:20px;border-radius:50%;object-fit:cover">`}else{pp.style.display='none';ph.style.display='flex'}document.getElementById('profileM').style.display='flex'}
document.getElementById('pi').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=ev=>{let c=getU();c.pic=ev.target.result;localStorage.setItem('work_current_user',JSON.stringify(c));localStorage.setItem('work_owner_pic',c.pic);goProfile();render();toast('📸 Foto no seguir!')};r.readAsDataURL(f)});

let sy=0;
document.getElementById('stage').addEventListener('touchstart',e=>{sy=e.touches[0].clientY},{passive:true});
document.getElementById('stage').addEventListener('touchend',e=>{let d=sy-e.changedTouches[0].clientY;if(Math.abs(d)>60){if(d>0){cur++;if(cur>=allVideos.length)cur=0}else{cur--;if(cur<0)cur=allVideos.length-1}render()}},{passive:true});
render();
toast('✅ SEM DEFORMAR - LIVE TEMPO TIKTOK');
</script>
</body>
</html>
