<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WORK FIRE - LADO CERTO TIKTOK</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100dvh;background:#000;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
#app{width:100%;max-width:420px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;background:#000;position:relative}
#feed{flex:1;overflow-y:scroll;scroll-snap-type:y mandatory;background:#000}
#feed::-webkit-scrollbar{display:none}
.post{height:100dvh;width:100%;position:relative;scroll-snap-align:start;background:#0a0a0a center/cover no-repeat;flex-shrink:0}
.post::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.3) 60%,rgba(0,0,0,.88) 100%);pointer-events:none}
/* LADO CERTO TIKTOK - TUDO NA DIREITA */
.side{position:absolute;right:10px;bottom:112px;display:flex;flex-direction:column;gap:18px;z-index:15;width:70px;align-items:center}
.b{border:none;background:none;display:flex;flex-direction:column;align-items:center;width:100%;cursor:pointer;position:relative}
.i{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;position:relative;transition:all.25s cubic-bezier(.34,1.56,.64,1);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.i.fire{background:radial-gradient(120% at 30% 20%,#ff8a00,#ff4500 45%,#8b0000);border:1.5px solid rgba(255,140,0,.6);box-shadow:0 4px 18px rgba(255,69,0,.45),inset 0 1px 2px rgba(255,255,255,.3);color:#fff}
.i.fire.active{background:radial-gradient(120% at 30% 20%,#ff3333,#ff0000 55%,#8b0000);border-color:#ff0000;box-shadow:0 0 26px rgba(255,0,0,.75);transform:scale(1.06)}
.i.heart{background:rgba(22,22,22,.72);border:1.5px solid rgba(255,255,255,.14);box-shadow:0 4px 16px rgba(0,0,0,.45);color:#fff}
.i.heart.liked{background:radial-gradient(120% at 30% 20%,#ff6a9a,#ff0040 65%,#cc0033);border-color:#ff2a6d;box-shadow:0 0 26px rgba(255,42,109,.65);transform:scale(1.06)}
.i.chat,.i.share,.i.save{background:rgba(22,22,22,.68);border:1.5px solid rgba(255,255,255,.13);box-shadow:0 4px 16px rgba(0,0,0,.4);color:#fff}
.i.save.active{background:radial-gradient(120% at 30% 20%,#ffeb66,#ffaa00 65%,#ff8c00);border-color:#ffcc00;color:#000;box-shadow:0 0 22px rgba(255,204,0,.55)}
@keyframes dança{0%{transform:scale(1) rotate(0)}12%{transform:scale(1.45,.55) rotate(-6deg)}28%{transform:scale(.62,1.45) rotate(6deg)}45%{transform:scale(1.25,.75) rotate(-4deg)}62%{transform:scale(.88,1.18) rotate(4deg)}100%{transform:scale(1.06) rotate(0)}}
.i.anim{animation:dança.68s cubic-bezier(.34,1.56,.64,1)}
.burst{position:absolute;top:0;left:50%;transform:translateX(-50%);font-size:26px;pointer-events:none;animation:burst.75s forwards;z-index:20}
@keyframes burst{0%{transform:translate(-50%,0) scale(0);opacity:1}100%{transform:translate(-50%,-85px) scale(2.2);opacity:0}}
.c{color:#fff;font-size:11px;font-weight:700;margin-top:6px;text-align:center;line-height:1.15;text-shadow:0 1px 10px rgba(0,0,0,.95)}
.c b{font-size:12px;font-weight:900;display:block}
.c span{font-size:10px;opacity:.85;font-weight:600}
.info{position:absolute;left:12px;right:88px;bottom:86px;background:linear-gradient(180deg,rgba(22,12,0,.92),rgba(0,0,0,.92));border:1px solid rgba(255,69,0,.28);border-radius:14px;padding:10px 12px;z-index:12;backdrop-filter:blur(22px)}
.meta{color:rgba(255,255,255,.55)!important;font-size:10px!important;display:flex;gap:8px;margin-top:6px!important;flex-wrap:wrap}
.nav{height:70px;background:linear-gradient(180deg,#100a00,#080300);border-top:1px solid rgba(255,69,0,.22);display:flex;align-items:center;z-index:20}
.nav button{flex:1;background:none;border:none;color:rgba(255,255,255,.38);font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button.on{color:#ff8c00}
.plus{width:58px;height:58px;border-radius:50%;background:radial-gradient(120% at 30% 20%,#ff8c00,#ff4500 55%,#cc2200);border:2.5px solid #fff;color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;margin-top:-28px;box-shadow:0 6px 22px rgba(255,69,0,.55),0 0 0 4px rgba(0,0,0,.85)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(10px);z-index:99;display:none;align-items:flex-end}
.sheet.show{display:flex}
.sheetBox{background:linear-gradient(180deg,#1e1400,#140a00);border-top:1px solid rgba(255,69,0,.3);width:100%;border-radius:20px 20px 0 0;max-height:80dvh;display:flex;flex-direction:column}
.page{position:absolute;inset:0;background:#000;z-index:30;display:none;flex-direction:column;overflow:auto}
.page.show{display:flex}
.input{width:100%;padding:12px;background:rgba(30,15,0,.85);border:1px solid rgba(255,69,0,.3);border-radius:10px;color:#fff;margin-top:8px;outline:none}
.btn{width:100%;padding:14px;background:linear-gradient(90deg,#ff4500,#ff8c00);border:none;border-radius:10px;color:#000;font-weight:900;margin-top:10px}
.card{background:linear-gradient(180deg,rgba(30,15,0,.92),rgba(20,8,0,.92));border:1px solid rgba(255,69,0,.22);border-radius:12px;padding:12px;margin:10px}
.shareGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:16px}
.shareItem{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;font-size:10px;font-weight:700}
.shareItem i{font-size:22px}
</style>
</head>
<body>
<div id="app">
<div id="feed"></div>

<div id="sheetC" class="sheet" onclick="if(event.target==this)this.classList.remove('show')"><div class="sheetBox"><div style="padding:14px;display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,69,0,.15)"><b style="color:#ff8c00"><i class="fa-solid fa-comment-dots"></i> <span id="ct">0</span> comentários</b><button onclick="document.getElementById('sheetC').classList.remove('show')" style="background:none;border:none;color:#fff;font-size:18px"><i class="fa-solid fa-xmark"></i></button></div><div id="listC" style="flex:1;overflow:auto;padding:12px"></div><div style="padding:12px;display:flex;gap:8px;border-top:1px solid rgba(255,69,0,.15)"><input id="txtC" class="input" style="flex:1;margin:0" placeholder="Comente..."><button onclick="sendC()" style="background:linear-gradient(90deg,#ff4500,#ff8c00);border:none;padding:0 18px;border-radius:10px;font-weight:900;color:#000"><i class="fa-solid fa-paper-plane"></i></button></div></div></div>

<div id="sheetS" class="sheet" onclick="if(event.target==this)this.classList.remove('show')"><div class="sheetBox"><div style="padding:14px;display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,69,0,.15)"><b style="color:#ff8c00"><i class="fa-solid fa-rocket"></i> Compartilhar</b><button onclick="document.getElementById('sheetS').classList.remove('show')" style="background:none;border:none;color:#fff;font-size:18px"><i class="fa-solid fa-xmark"></i></button></div><div class="shareGrid"><button class="shareItem" onclick="shareTo('whatsapp')"><i class="fa-brands fa-whatsapp" style="color:#25D366"></i>WhatsApp</button><button class="shareItem" onclick="shareTo('facebook')"><i class="fa-brands fa-facebook" style="color:#1877F2"></i>Facebook</button><button class="shareItem" onclick="shareTo('instagram')"><i class="fa-brands fa-instagram" style="color:#E4405F"></i>Instagram</button><button class="shareItem" onclick="shareTo('twitter')"><i class="fa-brands fa-x-twitter" style="color:#fff"></i>X</button><button class="shareItem" onclick="shareTo('telegram')"><i class="fa-brands fa-telegram" style="color:#26A5E4"></i>Telegram</button><button class="shareItem" onclick="shareTo('tiktok')"><i class="fa-brands fa-tiktok" style="color:#fff"></i>TikTok</button><button class="shareItem" onclick="shareTo('copy')"><i class="fa-solid fa-link" style="color:#ff8c00"></i>Copiar</button><button class="shareItem" onclick="shareTo('native')"><i class="fa-solid fa-share-nodes" style="color:#fff"></i>Mais</button></div></div></div>

<div id="pBusca" class="page"><div style="display:flex;justify-content:space-between;padding:14px"><h3 style="color:#ff4500">🔍 Busca</h3><button onclick="closeAll()" style="background:none;border:none;color:#fff;font-size:20px"><i class="fa-solid fa-xmark"></i></button></div><div class="card"><input id="qBusca" class="input" placeholder="Buscar..." oninput="busca()"><div id="rBusca" style="margin-top:10px"></div></div></div>
<div id="pCriar" class="page"><div style="display:flex;justify-content:space-between;padding:14px"><h3 style="color:#ff4500">🔥 Criar 1:30</h3><button onclick="closeAll()" style="background:none;border:none;color:#fff;font-size:20px"><i class="fa-solid fa-xmark"></i></button></div><div class="card"><input id="file" type="file" accept="image/*,video/*" style="color:#fff;width:100%"><img id="prev" style="width:100%;margin-top:10px;border-radius:12px;display:none"><input id="desc" class="input" placeholder="Legenda..."><button class="btn" onclick="postar()">POSTAR</button></div></div>
<div id="pLive" class="page"><div style="display:flex;justify-content:space-between;padding:14px"><h3 style="color:#ff4500">🔴 Live Pix R$5/dia</h3><button onclick="closeAll()" style="background:none;border:none;color:#fff;font-size:20px"><i class="fa-solid fa-xmark"></i></button></div><div id="liveBloq" class="card" style="border-color:#ffcc00;text-align:center"><div style="font-size:38px">🔒</div><b style="color:#ffcc00">Live bloqueada</b><div id="pixKey" style="background:#000;padding:10px;border-radius:10px;color:#fff;margin-top:10px;font-size:12px;font-family:monospace">Configure no Admin</div><button class="btn" style="background:linear-gradient(90deg,#ffcc00,#ff8c00)" onclick="pagarPix()">JÁ PAGUEI R$5</button></div><div id="liveOk" class="card" style="display:none;border-color:#00ff88;text-align:center"><b style="color:#00ff88">✅ LIVE LIBERADA</b><button class="btn" style="background:#00ff88;color:#000" onclick="alert('Ao vivo 30min!')">AO VIVO</button></div></div>
<div id="pEu" class="page"><div style="display:flex;justify-content:space-between;padding:14px"><b style="color:#ff4500">Eu</b><div><button onclick="admin()" style="background:linear-gradient(90deg,#ffcc00,#ff8c00);border:none;padding:7px 12px;border-radius:20px;font-size:10px;font-weight:900"><i class="fa-solid fa-crown"></i> ADMIN</button> <button onclick="closeAll()" style="background:none;border:none;color:#fff;font-size:20px;margin-left:8px"><i class="fa-solid fa-xmark"></i></button></div></div><div style="text-align:center;padding:12px"><div style="width:88px;height:88px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ff6a00,#8b0000);margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:34px;border:3px solid #ff8c00">🔥</div><div id="meuUser" style="color:#ff8c00;font-size:13px;margin-top:8px">@fire.user</div><div id="infoLive" style="color:#666;font-size:11px"></div><div style="color:#444;font-size:9px">ID: <span id="uidShow"></span> • TikTok lado certo</div></div><div id="adminBox" style="display:none" class="card"><h4 style="color:#ffcc00">Admin</h4><input id="pixChave" class="input" placeholder="Chave Pix"><button class="btn" style="background:#00ff88;color:#000" onclick="salvarPix()">SALVAR PIX</button><input id="adTxt" class="input" placeholder="Texto ads"><div style="display:flex;gap:8px;margin-top:8px;align-items:center"><input id="adFreq" type="number" value="3" class="input" style="margin:0;width:70px"><label style="color:#fff;font-size:11px"><input type="checkbox" id="adOn"> Ads</label></div><button class="btn" style="background:linear-gradient(90deg,#ffcc00,#ff8c00)" onclick="salvarAd()">SALVAR ADS</button></div><div class="card"><b style="color:#ff8c00"><i class="fa-solid fa-bookmark"></i> Salvos</b><div id="listaSalvos"></div></div></div>

<div class="nav"><button id="b0" class="on" onclick="go(0)"><i class="fa-solid fa-house" style="font-size:18px"></i><span>Inicio</span></button><button id="b1" onclick="go(1)"><i class="fa-solid fa-magnifying-glass" style="font-size:18px"></i><span>Busca</span></button><button onclick="go(2)"><div class="plus"><i class="fa-solid fa-plus"></i></div></button><button id="b3" onclick="go(3)"><i class="fa-solid fa-tower-broadcast" style="font-size:18px"></i><span>Live</span></button><button id="b4" onclick="go(4)"><i class="fa-solid fa-fire" style="font-size:18px"></i><span>Eu</span></button></div>
</div>

<script>
let uid=localStorage.getItem("uid_final")||"u_"+Math.random().toString(36).slice(2,8); localStorage.setItem("uid_final",uid);
let posts=JSON.parse(localStorage.getItem("posts_final")||"null")||[{owner:"fire.influencer",img:"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=700",desc:"Layout TikTok lado certo! 🔥 Tudo na direita + compartilhar redes sociais!",fire:7793,firedBy:[],likedBy:[],com:[{u:"ana",t:"Agora sim lado certo!"}],saveBy:[],share:8,sharedBy:[],isTop:true}];
let cur=0,temp="",cfg=JSON.parse(localStorage.getItem("cfg_final")||"null")||{pixK:"Configure no Admin",adT:"",adF:3,adOn:false};
function save(){localStorage.setItem("posts_final",JSON.stringify(posts)); render();}
function saveCfg(){localStorage.setItem("cfg_final",JSON.stringify(cfg)); render();}
function anim(el){let i=el.querySelector('.i')||el; i.classList.remove('anim'); void i.offsetWidth; i.classList.add('anim'); setTimeout(()=>i.classList.remove('anim'),700);}
function burst(btn,emoji){let b=document.createElement('div'); b.className='burst'; b.innerText=emoji; btn.appendChild(b); setTimeout(()=>b.remove(),750);}
function render(){
let list=[...posts].sort((a,b)=>(b.isTop?1:0)-(a.isTop?1:0));
let feed=[]; list.forEach((p,i)=>{feed.push(p); if(cfg.adOn && (i+1)%cfg.adF===0) feed.push({ad:true});});
document.getElementById("feed").innerHTML=feed.map(p=>{
if(p.ad) return `<div class="post" style="background:linear-gradient(135deg,#1a1a00,#332200);border:2px solid #ffcc00;display:flex;align-items:center;justify-content:center"><b style="color:#ffcc00">${cfg.adT||"PROPAGANDA"}</b></div>`;
let idx=posts.indexOf(p); let fired=p.firedBy.includes(uid); let liked=p.likedBy.includes(uid); let saved=p.saveBy.includes(uid);
return `<div class="post" style="background-image:url('${p.img}')">
<div class="side">
<button class="b" onclick="fire(${idx},this)"><div class="i fire ${fired?'active':''}"><i class="fa-solid fa-fire"></i></div><div class="c"><b>${(p.firedBy.length||p.fire).toLocaleString('pt-BR')}</b><span>${fired?'Feito':'Chamas'}</span></div></button>
<button class="b" onclick="like(${idx},this)"><div class="i heart ${liked?'liked':''}"><i class="${liked?'fa-solid':'fa-regular'} fa-heart"></i></div><div class="c"><b>${p.likedBy.length}</b><span>${liked?'Curtido':'Curtir'}</span></div></button>
<button class="b" onclick="anim(this);openC(${idx})"><div class="i chat"><i class="fa-regular fa-comment-dots"></i></div><div class="c"><b>${p.com.length}</b><span>Comen</span></div></button>
<button class="b" onclick="anim(this);openS(${idx})"><div class="i share"><i class="fa-solid fa-share"></i></div><div class="c"><b>${p.sharedBy.length||p.share}</b><span>Compar</span></div></button>
<button class="b" onclick="savePost(${idx},this)"><div class="i save ${saved?'active':''}"><i class="${saved?'fa-solid':'fa-regular'} fa-bookmark"></i></div><div class="c"><b>${saved?'Salvo':'Salvar'}</b></div></button>
</div>
<div class="info"><b>@${p.owner}</b><div>${p.desc}</div><div class="meta"><span>🔥 ${p.firedBy.length}</span><span>💖 ${p.likedBy.length}</span><span>• lado certo TikTok</span></div></div>
</div>`;
}).join("");
document.getElementById("listaSalvos").innerHTML=posts.filter(p=>p.saveBy.includes(uid)).map(p=>`<div style="display:flex;gap:8px;margin-top:8px"><img src="${p.img}" style="width:44px;height:44px;border-radius:8px"><div style="color:#fff;font-size:11px">${p.desc}</div></div>`).join("")||"<div style='color:#555'>Nenhum</div>";
document.getElementById("pixKey").innerText=cfg.pixK; document.getElementById("pixChave").value=cfg.pixK!="Configure no Admin"?cfg.pixK:""; document.getElementById("adTxt").value=cfg.adT; document.getElementById("adFreq").value=cfg.adF; document.getElementById("adOn").checked=cfg.adOn; document.getElementById("uidShow").innerText=uid; checkLive();
}
function fire(i,btn){anim(btn); let p=posts[i]; if(p.firedBy.includes(uid)){p.firedBy=p.firedBy.filter(x=>x!==uid); burst(btn,'💨');}else{p.firedBy.push(uid); burst(btn,'🔥'); if(navigator.vibrate) navigator.vibrate([50,30,50]);} save();}
function like(i,btn){anim(btn); let p=posts[i]; if(p.likedBy.includes(uid)){p.likedBy=p.likedBy.filter(x=>x!==uid); burst(btn,'💔');}else{p.likedBy.push(uid); burst(btn,'💖'); if(navigator.vibrate) navigator.vibrate(30);} save();}
function savePost(i,btn){anim(btn); let p=posts[i]; if(p.saveBy.includes(uid)) p.saveBy=p.saveBy.filter(x=>x!==uid); else{p.saveBy.push(uid); burst(btn,'🔖');} save();}
function openC(i){cur=i; document.getElementById("ct").innerText=posts[i].com.length; document.getElementById("listC").innerHTML=posts[i].com.map(c=>`<div style="padding:10px 0;border-bottom:1px solid rgba(255,69,0,.12)"><b style="color:#ff8c00">@${c.u}</b> ${c.t}</div>`).join(""); document.getElementById("sheetC").classList.add("show");}
function sendC(){let t=document.getElementById("txtC").value.trim(); if(!t) return; posts[cur].com.push({u:"voce",t:t}); document.getElementById("txtC").value=""; save(); openC(cur);}
function openS(i){cur=i; document.getElementById("sheetS").classList.add("show");}
function shareTo(type){
let url=location.href; let text=encodeURIComponent(posts[cur].desc+" - "+url);
let links={whatsapp:`https://wa.me/?text=${text}`,facebook:`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`,instagram:`https://www.instagram.com/`,twitter:`https://twitter.com/intent/tweet?text=${text}`,telegram:`https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(posts[cur].desc)}`,tiktok:`https://www.tiktok.com/`};
if(type==='copy'){navigator.clipboard.writeText(url); alert("✅ Link copiado!");}else if(type==='native' && navigator.share){navigator.share({title:"Work Fire",text:posts[cur].desc,url:url});}else if(links[type]){window.open(links[type],"_blank");}
let p=posts[cur]; if(!p.sharedBy.includes(uid)){p.sharedBy.push(uid); save();}
document.getElementById("sheetS").classList.remove("show");
}
function go(n){document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("on")); let el=document.getElementById("b"+n); if(el) el.classList.add("on"); document.querySelectorAll(".page").forEach(p=>p.classList.remove("show")); if(n==1) document.getElementById("pBusca").classList.add("show"); if(n==2) document.getElementById("pCriar").classList.add("show"); if(n==3) document.getElementById("pLive").classList.add("show"); if(n==4) document.getElementById("pEu").classList.add("show");}
function closeAll(){document.querySelectorAll(".page").forEach(p=>p.classList.remove("show")); document.getElementById("b0").classList.add("on");}
function busca(){let q=document.getElementById("qBusca").value.toLowerCase(); let r=posts.filter(p=>p.desc.toLowerCase().includes(q)); document.getElementById("rBusca").innerHTML=r.map(p=>`<div style="display:flex;gap:8px;margin-top:8px"><img src="${p.img}" style="width:40px;height:40px;border-radius:8px"><div style="color:#fff;font-size:11px">${p.desc}</div></div>`).join("")||"<div style='color:#555'>Nada</div>";}
function admin(){let s=prompt("Senha:"); if(s==="fire123") document.getElementById("adminBox").style.display="block";}
function salvarPix(){let k=document.getElementById("pixChave").value.trim(); if(!k) return alert("Coloque Pix"); cfg.pixK=k; saveCfg(); alert("Pix salvo!");}
function salvarAd(){cfg.adT=document.getElementById("adTxt").value.trim(); cfg.adF=parseInt(document.getElementById("adFreq").value)||3; cfg.adOn=document.getElementById("adOn").checked; saveCfg(); alert("Ads salvo!");}
function checkLive(){let pago=localStorage.getItem("livePago")===new Date().toDateString(); document.getElementById("liveBloq").style.display=pago?"none":"block"; document.getElementById("liveOk").style.display=pago?"block":"none"; document.getElementById("infoLive").innerText=pago?"✅ Live liberada":"🔒 Live bloqueada";}
function pagarPix(){localStorage.setItem("livePago",new Date().toDateString()); checkLive(); alert("Live liberada!");}
document.getElementById("file").addEventListener("change",e=>{let f=e.target.files[0]; if(!f) return; let r=new FileReader(); r.onload=ev=>{temp=ev.target.result; document.getElementById("prev").src=temp; document.getElementById("prev").style.display="block";}; r.readAsDataURL(f);});
function postar(){let d=document.getElementById("desc").value.trim()||"Meu vídeo 🔥"; if(!temp) return alert("Escolha foto/vídeo"); posts.unshift({owner:"voce",img:temp,desc:d,firedBy:[],likedBy:[],com:[],saveBy:[],sharedBy:[],share:0,isTop:false}); temp=""; document.getElementById("prev").style.display="none"; save(); closeAll();}
render();
</script>
</body>
</html>
