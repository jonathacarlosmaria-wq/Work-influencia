<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WORK FIRE - PERFIL EDITÁVEL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#000;color:#fff;font-family:system-ui;height:100dvh;overflow:hidden}
.app{max-width:420px;height:100dvh;margin:0 auto;background:#000;display:flex;flex-direction:column;position:relative}
.feed{flex:1;position:relative;background:#111 url('https://images.unsplash.com/photo-1514565131-fce0801e5785?w=600') center/cover}
.ov{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.9),transparent 60%)}
.side{position:absolute;right:10px;bottom:90px;display:flex;flex-direction:column;gap:10px;z-index:2}
.sbtn{width:52px;height:52px;border-radius:14px;background:#1a0a00;border:2px solid #ff4500;color:#ff8c00;display:flex;align-items:center;justify-content:center;font-size:22px;flex-direction:column}
.sbtn small{font-size:10px;color:#fff;margin-top:2px;font-weight:900}
.info{position:absolute;left:10px;right:75px;bottom:10px;z-index:2;background:rgba(15,8,0,.92);border:1.8px solid #ff4500;border-radius:16px;padding:12px}
.nav{height:70px;background:#0f0800;border-top:3px solid #ff4500;display:flex;flex-shrink:0;z-index:100}
.nav button{flex:1;background:none;border:0;color:#555;font-weight:900;font-size:10px;cursor:pointer}
.nav button.active{color:#ff8c00}
.nav button b{font-size:22px;display:block}
.plus{width:54px;height:54px;border-radius:50%;background:conic-gradient(from 0deg,#ff0000,#ff8c00,#ffff00,#ff4500);border:3px solid #000;color:#000;font-size:30px;display:flex;align-items:center;justify-content:center;margin:auto;font-weight:900}
.page{position:absolute;inset:0;background:#000;z-index:200;display:none;flex-direction:column}
.page.show{display:flex}
#video{flex:1;width:100%;object-fit:cover;background:#000}
#video.front{transform:scaleX(-1)}
.input{width:100%;padding:14px;border-radius:100px;background:#1a0a00;border:1.8px solid #ff4500;color:#fff;outline:none;margin-top:8px}
</style>
</head>
<body>
<div class="app">

<div class="feed" id="feed" onclick="nextPost()">
<div class="ov"></div>
<div class="side">
<button class="sbtn" onclick="event.stopPropagation(); like()">🤍<small id="likeCount">2.1k</small></button>
<button class="sbtn" onclick="event.stopPropagation(); openC()">💬<small id="comCount">2</small></button>
<button class="sbtn" onclick="event.stopPropagation(); save()">💾<small>Salvar</small></button>
<button class="sbtn" onclick="event.stopPropagation(); share()">↗<small>Share</small></button>
</div>
<div class="info">
<div style="display:flex;gap:10px;align-items:center">
<div id="avatarFeed" style="width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#ff4500,#ff8c00);display:flex;align-items:center;justify-content:center;color:#000;font-weight:900;overflow:hidden"><img id="imgFeed" style="width:100%;height:100%;object-fit:cover;display:none"></div>
<div style="flex:1">
<div style="color:#ff8c00;font-weight:900;font-size:13px;display:flex;gap:6px;align-items:center"><span id="nameFeed">@smart.fire</span><span style="background:linear-gradient(90deg,#ff4500,#ff8c00);color:#000;font-size:8px;padding:2px 6px;border-radius:100px">INTELIGENTE</span></div>
<div style="font-size:11px;color:#aaa" id="bioFeed">Dança inteligente ao clicar</div>
</div>
<button id="followBtn" onclick="event.stopPropagation(); follow()" style="border:1.8px solid #ff4500;background:rgba(255,69,0,.2);color:#ff8c00;padding:8px 14px;border-radius:100px;font-size:11px;font-weight:900">Seguir</button>
</div>
<div style="font-size:12px;color:#ffcc99;margin-top:8px" id="descFeed">🧠 Botões inteligentes! Cada um dança diferente!</div>
</div>
</div>

<!-- PÁGINA EU - PERFIL EDITÁVEL COM FOTO -->
<div class="page" id="pProfile" style="overflow:auto">
<div style="padding:14px">
<div style="display:flex;justify-content:space-between;align-items:center">
<b style="color:#ff8c00;font-size:16px">👑 Meu Perfil</b>
<button onclick="closeAll()" style="padding:7px 14px;border-radius:100px;background:#222;border:1px solid #ff4500;color:#ff8c00;font-weight:900">✕ Fechar</button>
</div>

<div style="background:linear-gradient(135deg,#1a0a00,#221000);border:2px solid #ff4500;border-radius:20px;padding:18px;text-align:center;margin:14px 0">

<!-- FOTO EDITÁVEL -->
<div style="position:relative;width:96px;height:96px;margin:0 auto">
<div id="profilePhoto" style="width:96px;height:96px;border-radius:50%;background:conic-gradient(from 0deg,#ff4500,#ff8c00,#ffff00,#ff4500);border:3px solid #ff8c00;display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden">
<span id="photoEmoji">👑</span>
<img id="photoImg" style="width:100%;height:100%;object-fit:cover;display:none">
</div>
<button onclick="changePhoto()" style="position:absolute;bottom:0;right:0;width:32px;height:32px;border-radius:50%;background:#ff4500;border:2px solid #000;color:#000;font-size:16px;display:flex;align-items:center;justify-content:center;font-weight:900">📸</button>
</div>

<div style="color:#ff8c00;font-weight:900;font-size:18px;margin-top:10px" id="pNameDisplay">@você.fire</div>
<div style="color:#aaa;font-size:12px" id="pBioDisplay">Toque em Editar pra colocar suas infos</div>

<div style="display:flex;justify-content:space-around;margin-top:14px">
<div><div style="color:#ff8c00;font-weight:900;font-size:20px" id="countPosts">0</div><div style="color:#666;font-size:10px">POSTS</div></div>
<div><div style="color:#ff8c00;font-weight:900;font-size:20px" id="countLikes">0</div><div style="color:#666;font-size:10px">LIKES</div></div>
<div><div style="color:#ff8c00;font-weight:900;font-size:20px" id="countSaved">0</div><div style="color:#666;font-size:10px">SALVOS</div></div>
</div>
</div>

<!-- FORM EDITAR -->
<div style="background:#111;border:1.5px solid #331100;border-radius:16px;padding:14px">
<div style="color:#ff8c00;font-weight:900;font-size:13px;margin-bottom:8px">✏️ Editar suas informações</div>

<label style="font-size:11px;color:#aaa">Seu @nome (sem @)</label>
<input id="inputName" class="input" placeholder="Ex: joao.fire" maxlength="20">

<label style="font-size:11px;color:#aaa;margin-top:10px;display:block">Seu nome de exibição</label>
<input id="inputDisplay" class="input" placeholder="Ex: João Silva" maxlength="25">

<label style="font-size:11px;color:#aaa;margin-top:10px;display:block">Sua bio</label>
<input id="inputBio" class="input" placeholder="Ex: Editor de vídeos 🔥" maxlength="60">

<label style="font-size:11px;color:#aaa;margin-top:10px;display:block">Seu trabalho / profissão</label>
<input id="inputWork" class="input" placeholder="Ex: Design 4K, Edição" maxlength="40">

<div style="display:flex;gap:8px;margin-top:14px">
<button onclick="saveProfile()" style="flex:1;padding:14px;border-radius:100px;background:linear-gradient(90deg,#ff4500,#ff8c00);border:none;color:#000;font-weight:900;font-size:13px">💾 Salvar perfil</button>
<button onclick="changePhoto()" style="padding:14px 18px;border-radius:100px;background:#222;border:1.5px solid #ff4500;color:#ff8c00;font-weight:900">📸 Foto</button>
</div>
</div>

<div style="display:flex;gap:8px;margin:12px 0">
<button id="tabMy" onclick="tabProfile('my')" style="flex:1;padding:10px;border-radius:100px;background:#ff4500;color:#000;font-weight:900;border:none;font-size:12px">📸 Meus posts</button>
<button id="tabSaved" onclick="tabProfile('saved')" style="flex:1;padding:10px;border-radius:100px;background:#222;border:1px solid #ff4500;color:#ff8c00;font-weight:900;font-size:12px">⭐ Salvos</button>
</div>

<div id="pList" style="display:flex;flex-direction:column;gap:8px;padding-bottom:20px"></div>
</div>
<input type="file" id="filePhoto" accept="image/*" style="display:none" onchange="handlePhoto(event)">
</div>

<!-- Outras páginas -->
<div class="page" id="pCam">
<video id="video" autoplay muted playsinline class="front"></video>
<div style="position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:2">
<button onclick="closeAll()" style="width:36px;height:36px;border-radius:50%;background:#000;border:1px solid #ff4500;color:#ff8c00">✕</button>
<button onclick="switchCam()" style="padding:8px 14px;border-radius:100px;background:#ff4500;border:none;color:#000;font-weight:900" id="camLabel">🔄 FRENTE</button>
</div>
<div style="position:absolute;bottom:20px;left:0;right:0;display:flex;justify-content:center;gap:20px;z-index:2">
<button onclick="openGal()" style="width:44px;height:44px;border-radius:10px;background:#222;border:1px solid #ff4500;color:#ff8c00">🖼️</button>
<button onclick="take()" style="width:74px;height:74px;border-radius:50%;background:conic-gradient(from 0deg,#ff0000,#ff8c00,#ffff00,#ff4500);border:4px solid #000;font-size:28px">📸</button>
<button onclick="switchCam()" style="width:44px;height:44px;border-radius:10px;background:#222;border:1px solid #ff4500;color:#ff8c00">🔄</button>
</div>
<input type="file" id="fileGal" accept="image/*" style="display:none" onchange="handleGal(event)">
</div>

<div class="page" id="pSearch" style="padding:14px"><div style="display:flex;justify-content:space-between"><b style="color:#ff8c00">🔍 Buscar</b><button onclick="closeAll()" style="padding:6px 14px;border-radius:100px;background:#222;border:1px solid #ff4500;color:#ff8c00">X</button></div><div id="sList" style="margin-top:10px"></div></div>
<div class="page" id="pLive" style="padding:14px;justify-content:center;align-items:center"><div style="text-align:center"><div style="font-size:50px">🔴</div><h2 style="color:red">LIVE 30min</h2><button onclick="closeAll()" style="margin-top:15px;padding:10px 20px;border-radius:100px;background:red;border:none;color:#fff">Sair</button></div></div>
<div class="page" id="pCom" style="padding:14px"><div style="display:flex;justify-content:space-between"><b style="color:#ff8c00" id="comTitle">💬 Comentários</b><button onclick="closeAll()" style="padding:6px 14px;border-radius:100px;background:#222;border:1px solid #ff4500;color:#ff8c00">X</button></div><div id="comList" style="flex:1;margin:10px 0;overflow:auto"></div><div style="display:flex;gap:8px"><input id="comInput" placeholder="Comentar..." style="flex:1;padding:12px;border-radius:100px;background:#222;border:1px solid #ff4500;color:#fff"><button onclick="sendCom()" style="padding:12px 18px;border-radius:100px;background:#ff4500;border:none;font-weight:900">Enviar</button></div></div>

<div id="nav">
<button id="b0" class="active" onclick="go(0)"><b>🔥</b>Work</button>
<button id="b1" onclick="go(1)"><b>🔍</b>Buscar</button>
<button id="b2" onclick="go(2)"><div class="plus">+</div></button>
<button id="b3" onclick="go(3)"><b>🔴</b>LIVE</button>
<button id="b4" onclick="go(4)"><b>👑</b>Eu</button>
</div>
</div>

<script>
let posts=JSON.parse(localStorage.getItem('work_eu_final')||'null')||[
{owner:"smart.fire",display:"Smart Fire",bio:"Dança inteligente ao clicar",work:"Botões inteligentes!",img:"https://images.unsplash.com/photo-1514565131-fce0801e5785?w=600",likes:2100,liked:false,saved:false,follow:false,coms:["Top!","Funciona!"]},
];
let cur=0, stream=null, lado="user", fotoTemp=null, tab="my";
let profile=JSON.parse(localStorage.getItem('my_profile_v2')||'{"name":"você.fire","display":"Você Fire","bio":"Toque em Editar pra colocar suas infos","work":"Criador","photo":null}');

function save(){localStorage.setItem('work_eu_final', JSON.stringify(posts.slice(0,50))); localStorage.setItem('my_profile_v2', JSON.stringify(profile))}

function render(){
let p=posts[cur];
document.getElementById('feed').style.backgroundImage=`url('${p.img}')`;
document.getElementById('nameFeed').innerText='@'+(p.owner||'smart.fire');
document.getElementById('bioFeed').innerText=p.bio||p.work||'';
document.getElementById('descFeed').innerText=p.desc||p.work||'';
document.getElementById('likeCount').innerText=p.likes>=1000?(p.likes/1000).toFixed(1)+'k':p.likes;
document.getElementById('comCount').innerText=p.coms.length;
document.getElementById('followBtn').innerText=p.follow?'Seguindo ✓':'Seguir';
document.getElementById('comTitle').innerText=`💬 ${p.coms.length} comentários`;
document.getElementById('comList').innerHTML=p.coms.map(c=>`<div style="background:#222;padding:10px;border-radius:10px;margin:5px 0">${c}</div>`).join('');
document.getElementById('sList').innerHTML=posts.map((x,i)=>`<div onclick="cur=${i};closeAll();render();go(0)" style="background:#222;padding:12px;border-radius:12px;margin:6px 0;display:flex;gap:10px"><div style="width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#ff4500,#ff8c00);display:flex;align-items:center;justify-content:center;font-weight:900;color:#000;overflow:hidden">${x.photo?`<img src="${x.photo}" style="width:100%;height:100%;object-fit:cover">`:x.owner[0].toUpperCase()}</div><div><div style="color:#ff8c00;font-weight:900">@${x.owner}</div><div style="font-size:11px;color:#aaa">${(x.bio||x.desc||'').slice(0,40)}</div></div></div>`).join('');

// Perfil
document.getElementById('pNameDisplay').innerText='@'+profile.name;
document.getElementById('pBioDisplay').innerText=profile.bio+' • '+profile.work;
document.getElementById('inputName').value=profile.name;
document.getElementById('inputDisplay').value=profile.display;
document.getElementById('inputBio').value=profile.bio;
document.getElementById('inputWork').value=profile.work;
if(profile.photo){
document.getElementById('photoImg').src=profile.photo;
document.getElementById('photoImg').style.display='block';
document.getElementById('photoEmoji').style.display='none';
document.getElementById('imgFeed').src=profile.photo;
document.getElementById('imgFeed').style.display='block';
}else{
document.getElementById('photoImg').style.display='none';
document.getElementById('photoEmoji').style.display='block';
document.getElementById('imgFeed').style.display='none';
}
let meus=posts.filter(x=>x.owner===profile.name);
let salvos=posts.filter(x=>x.saved);
document.getElementById('countPosts').innerText=meus.length;
document.getElementById('countLikes').innerText=posts.reduce((s,x)=>s+x.likes,0);
document.getElementById('countSaved').innerText=salvos.length;
let list=tab==='my'?meus:salvos;
document.getElementById('pList').innerHTML=list.map(x=>{
let idx=posts.indexOf(x);
return `<div style="background:#222;border:1px solid #331100;border-radius:12px;padding:10px;display:flex;gap:10px"><div style="width:60px;height:60px;border-radius:10px;background:url('${x.img}') center/cover"></div><div style="flex:1"><div style="color:#ff8c00;font-weight:900;font-size:12px">@${x.owner}</div><div style="font-size:11px;color:#fff">${(x.desc||x.bio||'').slice(0,50)}</div></div><button onclick="cur=${idx};closeAll();render();go(0)" style="padding:6px 12px;border-radius:100px;background:#ff4500;border:none;color:#000;font-weight:900;font-size:11px">Ver</button></div>`;
}).join('')||`<div style="text-align:center;color:#666;padding:30px">${tab==='my'?'Nenhum post ainda<br>Clique em + pra criar com sua foto!':'Nenhum salvo'}</div>`;
}

function tabProfile(t){
tab=t;
document.getElementById('tabMy').style.background=t==='my'?'#ff4500':'#222';
document.getElementById('tabMy').style.color=t==='my'?'#000':'#ff8c00';
document.getElementById('tabSaved').style.background=t==='saved'?'#ff4500':'#222';
document.getElementById('tabSaved').style.color=t==='saved'?'#000':'#ff8c00';
render();
}

function go(n){
document.querySelectorAll('#nav button').forEach(b=>b.classList.remove('active'));
document.getElementById('b'+n).classList.add('active');
document.querySelectorAll('.page').forEach(p=>p.classList.remove('show'));
if(n===2)openCam();
if(n===1)document.getElementById('pSearch').classList.add('show');
if(n===3)document.getElementById('pLive').classList.add('show');
if(n===4){document.getElementById('pProfile').classList.add('show'); render();}
}
function closeAll(){
document.querySelectorAll('.page').forEach(p=>p.classList.remove('show'));
if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
go(0);
}
function openC(){document.getElementById('pCom').classList.add('show')}
function nextPost(){cur++; if(cur>=posts.length)cur=0; render()}
function like(){posts[cur].liked=!posts[cur].liked; posts[cur].likes+=posts[cur].liked?1:-1; save(); render()}
function save(){posts[cur].saved=!posts[cur].saved; save(); render(); alert(posts[cur].saved?'⭐ Salvo no seu perfil Eu!':'Removido')}
function follow(){posts[cur].follow=!posts[cur].follow; render()}
function share(){navigator.clipboard.writeText('@'+posts[cur].owner).then(()=>alert('Copiado!'))}
function sendCom(){let v=document.getElementById('comInput').value; if(!v)return; posts[cur].coms.push(v); document.getElementById('comInput').value=''; save(); render()}

function saveProfile(){
profile.name=document.getElementById('inputName').value.trim().replace('@','')||profile.name;
profile.display=document.getElementById('inputDisplay').value.trim()||profile.display;
profile.bio=document.getElementById('inputBio').value.trim()||profile.bio;
profile.work=document.getElementById('inputWork').value.trim()||profile.work;
save(); render();
alert('✅ Perfil salvo!\n@'+profile.name+'\n'+profile.display+'\n'+profile.bio);
}
function changePhoto(){document.getElementById('filePhoto').click()}
function handlePhoto(e){
let f=e.target.files[0]; if(!f)return;
let r=new FileReader(); r.onload=ev=>{profile.photo=ev.target.result; save(); render(); alert('✅ Foto de perfil atualizada!')}; r.readAsDataURL(f);
}

// Câmera 2 lados
async function openCam(){document.getElementById('pCam').classList.add('show'); await startCam(lado)}
async function startCam(face){
lado=face;
if(stream){stream.getTracks().forEach(t=>t.stop())}
try{
stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:face,width:{ideal:1280}}});
let v=document.getElementById('video'); v.srcObject=stream; v.className=face==='user'?'front':'';
document.getElementById('camLabel').innerText=face==='user'?'🔄 FRENTE':'🔄 TRÁS';
}catch(err){alert('Permita câmera'); closeAll()}
}
async function switchCam(){lado=lado==='user'?'environment':'user'; await startCam(lado)}
function take(){
let v=document.getElementById('video'); let c=document.createElement('canvas'); c.width=v.videoWidth; c.height=v.videoHeight;
let ctx=c.getContext('2d'); if(lado==='user'){ctx.translate(c.width,0);ctx.scale(-1,1)} ctx.drawImage(v,0,0);
let data=c.toDataURL('image/jpeg',0.8);
let desc=prompt('Legenda do post:','Meu trabalho com câmera '+(lado==='user'?'frontal':'traseira')+' 🔥')||'Meu post';
posts.unshift({owner:profile.name,display:profile.display,bio:profile.bio,work:profile.work,photo:profile.photo,img:data,desc:desc,likes:0,liked:false,saved:false,follow:false,coms:[]});
save(); closeAll(); cur=0; render();
}
function openGal(){document.getElementById('fileGal').click()}
function handleGal(e){
let f=e.target.files[0]; if(!f)return;
let r=new FileReader(); r.onload=ev=>{
let data=ev.target.result;
let desc=prompt('Legenda:','Foto da galeria 🔥')||'Post';
posts.unshift({owner:profile.name,display:profile.display,bio:profile.bio,photo:profile.photo,img:data,desc:desc,likes:0,liked:false,saved:false,follow:false,coms:[]});
save(); closeAll(); cur=0; render();
}; r.readAsDataURL(f);
}

render();
</script>
</body>
</html>
