this.chunks=[];let mime='';if(MediaRecorder.isTypeSupported('video/mp4')) mime='video/mp4';let o=mime?{mimeType:mime}:{};try{this.recorder=new MediaRecorder(this.stream,o)}catch{this.recorder=new MediaRecorder(this.stream)}

stop(){if(!this.rec) return;clearInterval(this.inter);this.rec=false;document.getElementById('rec').classList.remove('on');if(this.recorder) this.recorder.stop()},
pick(){document.getElementById('file').click()},
my(){this.loadAll().then(all=>{document.getElementById('cMy').innerText=all.length;document.getElementById('grid').innerHTML=all.map(v=>`<div style="position:relative;aspect-ratio:9/16;background:#111;border-radius:14px;overflow:hidden;border:1px solid rgba(212,175,55,.2);box-shadow:0 4px 16px rgba(0,0,0,.5)"><video src="${v.blobUrl||v.img}" style="width:100%;height:100%;object-fit:cover" muted></video><div style="position:absolute;top:6px;right:6px;background:rgba(0,0,0,.7);width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;border:1px solid rgba(212,175,55,.3)" onclick="WORK.del(${v.id}).then(()=>{WORK.videos=WORK.videos.filter(x=>x.id!==${v.id});WORK.render();WORK.my()})">✕</div><div style="position:absolute;bottom:0;left:0;right:0;background:linear-gradient(0deg,rgba(0,0,0,.9),transparent);padding:8px"><p style="font-size:9px;font-weight:900;color:#D4AF37">${v.duration||''}s • GOLD</p></div></div>`).join('')||'<p style="color:#666;text-align:center">Nenhum vídeo GOLD</p>';document.getElementById('listM').classList.add('on')})},
closeM(){document.querySelectorAll('.modal').forEach(m=>m.classList.remove('on'))}
};
document.getElementById('file').addEventListener('change',e=>{
let f=e.target.files[0];if(!f||!f.type.startsWith('video/')) return;
let u=URL.createObjectURL(f);let tv=document.createElement('video');tv.preload='metadata';tv.src=u;
tv.onloadedmetadata=async ()=>{let d=Math.round(tv.duration||0);if(d>90){WORK.toast(`Muito longo ${d}s`);return}let o={id:Date.now(),user:"@voce.gold",desc:"Vídeo GOLD da galeria 👑",img:u,blob:f,blobUrl:u,likes:0,liked:false,com:0,share:0,follow:false,type:"video",duration:d,isDefault:false,sound:"GOLD"};await WORK.save(o);WORK.videos.unshift(o);WORK.cur=0;WORK.closeM();WORK.closeCam();WORK.render();WORK.toast(`👑 GOLD ${d}s salvo!`)};
});
WORK.loadSaved();
let sy=0;document.addEventListener('touchstart',e=>sy=e.touches[0].clientY,{passive:true});
document.addEventListener('touchend',e=>{if(document.getElementById('cam').classList.contains('on'))return;if(document.querySelector('.modal.on'))return;let d=sy-e.changedTouches[0].clientY;if(Math.abs(d)>60){if(d>0&&WORK.cur<WORK.videos.length-1) WORK.cur++;if(d<0&&WORK.cur>0) WORK.cur--;WORK.render()}},{passive:true});
</script>
</body>
</html>
