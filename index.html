<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WORK FIRE - Global</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial,sans-serif;overflow:hidden;height:100vh}
.feed{height:100vh;width:100vw;overflow-y:scroll;scroll-snap-type:y mandatory}
.post{height:100vh;width:100vw;position:relative;scroll-snap-align:start;background:#111;display:flex;align-items:center;justify-content:center}
.post video,.post img{width:100%;height:100%;object-fit:cover}
.post-info{position:absolute;bottom:90px;left:12px;right:80px;z-index:2;text-shadow:0 2px 8px #000}
.actions{position:absolute;right:10px;bottom:120px;display:flex;flex-direction:column;gap:18px}
.act{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:22px}
.nav{position:fixed;bottom:0;left:0;right:0;height:68px;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;align-items:center;z-index:10}
.nav button{background:none;border:none;color:#fff;font-size:11px;opacity:.6}
.nav button.active{opacity:1}
#uploadModal{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column;padding:18px}
#uploadModal.show{display:flex}
.btn{padding:14px;border:none;border-radius:12px;font-weight:900;cursor:pointer}
.btn-fire{background:#FE2C55;color:#fff;width:100%}
input,textarea{width:100%;background:#1a1a1a;border:1px solid #333;border-radius:10px;padding:12px;color:#fff;margin:6px 0}
.progress{height:6px;background:#222;border-radius:10px;margin:8px 0}
.progress div{height:100%;background:#FE2C55;width:0%}
.live-badge{position:absolute;top:14px;left:12px;background:#FE2C55;padding:4px 10px;border-radius:6px;font-weight:900;font-size:12px}
</style>
</head>
<body>
<div class="feed" id="feed"></div>
<div class="nav">
<button class="active" onclick="document.getElementById('feed').scrollTo(0,0)">🏠<br>Inicio</button>
<button onclick="document.getElementById('liveArea').style.display='block'">🔴<br>LIVE</button>
<button onclick="document.getElementById('uploadModal').classList.add('show')" style="background:#fff;color:#000;width:44px;height:30px;border-radius:8px;font-size:22px;font-weight:900;opacity:1">+</button>
<button>📦<br>Pedidos</button>
<button>👤<br>Perfil</button>
</div>
<div id="uploadModal">
<h2>Novo Fire 🔥</h2>
<input type="file" id="fileInp" accept="video/*,image/*">
<div class="progress"><div id="prog"></div></div>
<textarea id="descInp" placeholder="Legenda #workfire"></textarea>
<input id="ownerInp" placeholder="Seu @nome">
<button class="btn btn-fire" onclick="uploadGlobal()">POSTAR GLOBAL 🌍</button>
<button class="btn" style="background:#222;margin-top:10px" onclick="document.getElementById('uploadModal').classList.remove('show')">Cancelar</button>
<p id="statusUp" style="margin-top:10px;opacity:.7;font-size:13px"></p>
</div>
<div id="liveArea" style="display:none;position:fixed;inset:0;background:#000;z-index:15">
<video id="liveVideo" autoplay playsinline muted style="width:100%;height:100%;object-fit:cover"></video>
<div style="position:absolute;top:16px;left:12px;right:12px;display:flex;justify-content:space-between">
<div class="live-badge">AO VIVO GLOBAL</div>
<button onclick="document.getElementById('liveArea').style.display='none'" style="background:rgba(0,0,0,.6);border:none;color:#fff;padding:8px 14px;border-radius:20px">✕</button>
</div>
<div style="position:absolute;bottom:88px;left:0;right:0;padding:12px;display:flex;gap:8px">
<button class="btn btn-fire" onclick="startLive()" style="flex:1">COMEÇAR LIVE</button>
<button class="btn" onclick="watchLives()" style="flex:1;background:#25F4EE;color:#000">VER LIVES</button>
</div>
</div>
<script>
const SUPABASE_URL='https://rxrjdfwxqbjjfflqpydm.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ4cmpkZnd4cWJqamZmbHFweWRtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExNDg1MTksImV4cCI6MjEwNjcyNDUxOX0.HNJ0nJ_XJHNmjyWxhd7MyS2IrCLlWB85rIVKQqQrsQU';
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
async function loadPosts(){
let {data}=await supabaseClient.from('posts').select('*').order('time',{ascending:false}).limit(50);
let feed=document.getElementById('feed'); feed.innerHTML='';
if(!data||data.length==0){feed.innerHTML='<div class=post style=flex-direction:column><h1 style=font-size:60px>🔥</h1><p>Seja o primeiro!</p><button class="btn btn-fire" style="margin-top:20px;width:auto;padding:10px 24px" onclick="document.getElementById(\'uploadModal\').classList.add(\'show\')">POSTAR</button></div>';return;}
data.forEach(p=>{
let isV=p.img.includes('.mp4')||p.img.includes('video');
let el=document.createElement('div'); el.className='post';
el.innerHTML=(isV?`<video src="${p.img}" loop autoplay muted playsinline></video>`:`<img src="${p.img}">`)+`<div class=post-info><h3>@${p.owner}</h3><p>${p.desc||''}</p><p style="font-size:11px;opacity:.6">🌍 Global</p></div><div class=actions><div class=act>❤️</div><div class=act>💬</div><div class=act>↗️</div></div>`;
feed.appendChild(el);
});
}
async function uploadGlobal(){
let file=document.getElementById('fileInp').files[0]; let desc=document.getElementById('descInp').value; let owner=document.getElementById('ownerInp').value||'anon';
if(!file){alert('Escolha video');return;}
document.getElementById('prog').style.width='30%'; document.getElementById('statusUp').innerText='Enviando...';
try{
let name=Date.now()+'_'+file.name.replace(/[^a-z0-9.]/gi,'_');
let {error}=await supabaseClient.storage.from('videos').upload(name,file); if(error) throw error;
document.getElementById('prog').style.width='70%';
let {data}=supabaseClient.storage.from('videos').getPublicUrl(name);
await supabaseClient.from('posts').insert([{id:Date.now().toString(),owner,img:data.publicUrl,desc,time:Date.now()}]);
document.getElementById('prog').style.width='100%'; document.getElementById('statusUp').innerText='POSTADO! 🌍';
setTimeout(()=>{document.getElementById('uploadModal').classList.remove('show'); loadPosts(); document.getElementById('prog').style.width='0%';},1000);
}catch(e){alert('Erro: '+e.message);}
}
let peer=null;
async function startLive(){
let stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});
document.getElementById('liveVideo').srcObject=stream;
peer=new Peer('workfire_'+Date.now());
peer.on('open',async id=>{await supabaseClient.from('lives').upsert({device:id,owner:document.getElementById('ownerInp').value||'jonatha',active:true,startedAt:Date.now()}); alert('LIVE ATIVA ID: '+id);});
peer.on('call',c=>c.answer(stream));
}
async function watchLives(){
let {data}=await supabaseClient.from('lives').select('*').eq('active',true);
if(!data||data.length==0){alert('Sem lives');return;}
let t=prompt('Lives:\n'+data.map(l=>l.device+' '+l.owner).join('\n')+'\nID:'); if(!t) return;
if(!peer) peer=new Peer();
peer.on('open',()=>{let call=peer.call(t.trim(),new MediaStream()); call.on('stream',s=>document.getElementById('liveVideo').srcObject=s);});
}
loadPosts();
supabaseClient.channel('posts').on('postgres_changes',{event:'*',schema:'public',table:'posts'},()=>loadPosts()).subscribe();
</script>
</body>
</html>
