<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WORK FIRE - BOTÃO SOM CORRIGIDO</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent
}
html,body{
  width:100%;
  height:100dvh;
  background:#000;
  overflow:hidden;
  font-family:-apple-system,sans-serif
}
#app{
  width:100%;
  max-width:420px;
  height:100dvh;
  margin:0 auto;
  background:#000;
  display:flex;
  flex-direction:column;
  position:relative
}
#feed{
  flex:1;
  overflow-y:scroll;
  scroll-snap-type:y mandatory
}
#feed::-webkit-scrollbar{display:none}
.post{
  height:100dvh;
  width:100%;
  position:relative;
  scroll-snap-align:start;
  background:#111;
  flex-shrink:0;
  overflow:hidden
}
.post video,.post img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block
}
.post::after{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,transparent 20%,rgba(0,0,0,.2) 60%,rgba(0,0,0,.9) 100%);
  pointer-events:none;
  z-index:1
}
.rightBar{
  position:absolute;
  right:8px;
  bottom:90px;
  z-index:10;
  display:flex;
  flex-direction:column;
  gap:12px;
  width:60px
}
.btnTik{
  border:none;
  background:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  cursor:pointer;
  width:100%
}
.iconTik{
  width:48px;
  height:48px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  color:#fff;
  background:rgba(35,35,35,.85);
  border:1.5px solid rgba(255,255,255,.18)
}
.iconTik.fire{
  background:radial-gradient(circle at 30% 25%,#ff8c00,#ff4500 55%,#8b0000);
  border-color:#ff8c00
}
.iconTik.fire.on{background:#ff4500;box-shadow:0 0 18px #ff4500}
.iconTik.heart.on{background:#ff1844}
.txtTik{
  color:#fff;
  font-size:8.5px;
  font-weight:800;
  margin-top:3px;
  text-shadow:0 1px 6px #000;
  text-align:center
}
.info{
  position:absolute;
  left:10px;
  right:76px;
  bottom:82px;
  z-index:10;
  background:rgba(0,0,0,.55);
  border:1px solid rgba(255,69,0,.22);
  border-radius:12px;
  padding:9px 10px
}
.info b{color:#fff;font-size:11px}
.info div{color:#ddd;font-size:11px;margin-top:2px}
.nav{
  height:64px;
  background:#0a0700;
  border-top:1.5px solid rgba(255,69,0,.35);
  display:flex;
  align-items:center;
  justify-content:space-around;
  z-index:30
}
.nav button{
  flex:1;
  background:none;
  border:none;
  color:rgba(255,255,255,.5);
  font-size:8.5px;
  font-weight:800;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px
}
.nav button.on{color:#ff8c00}
.nav button i{font-size:18px}
.plus{
  width:46px;
  height:46px;
  border-radius:50%;
  background:linear-gradient(135deg,#ff8c00,#ff2200);
  border:2.5px solid #fff;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  margin-top:-20px;
  box-shadow:0 0 0 4px #000
}
.page{
  position:absolute;
  inset:0;
  background:#000;
  z-index:20;
  display:none;
  flex-direction:column;
  overflow-y:auto;
  padding-bottom:70px
}
.page.show{display:flex}
.card{
  background:rgba(25,12,0,.92);
  border:1px solid rgba(255,69,0,.22);
  border-radius:12px;
  padding:12px;
  margin:10px
}
.input{
  width:100%;
  padding:11px;
  background:#1e1100;
  border:1px solid rgba(255,69,0,.32);
  border-radius:10px;
  color:#fff;
  margin-top:7px;
  font-size:13px
}
.btn{
  width:100%;
  padding:14px;
  background:linear-gradient(90deg,#ff4500,#ff8c00);
  border:none;
  border-radius:12px;
  color:#000;
  font-weight:900;
  margin-top:10px;
  font-size:13px;
  cursor:pointer
}
.avatar{
  width:88px;
  height:88px;
  border-radius:50%;
  border:3px solid #ff8c00;
  background:radial-gradient(circle at 30% 30%,#ff7a00,#7a0000);
  margin:0 auto;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  position:relative
}
.avatar img{width:100%;height:100%;object-fit:cover}
.cam{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  background:rgba(0,0,0,.78);
  color:#ffcc00;
  font-size:7px;
  font-weight:900;
  text-align:center;
  padding:4px
}
.camBox{
  position:relative;
  width:100%;
  height:45vh;
  background:#000;
  border-radius:14px;
  overflow:hidden;
  border:2px solid #ff4500;
  margin-top:10px
}
.camBox video{
  width:100%;
  height:100%;
  object-fit:cover
}
.camBox video.mirror{transform:scaleX(-1)}
.timerCam{
  position:absolute;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(255,0,0,.9);
  color:#fff;
  padding:5px 14px;
  border-radius:20px;
  font-weight:900;
  font-size:13px;
  z-index:5
}
.ctrlCam{
  position:absolute;
  bottom:12px;
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  gap:20px;
  z-index:5
}
.circ{
  width:70px;
  height:70px;
  border-radius:50%;
  border:4px solid #fff;
  background:#ff0000;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:28px;
  cursor:pointer
}
.previewArea{
  display:none;
  margin-top:10px;
  border:3px solid #00ff88;
  border-radius:14px;
  overflow:hidden;
  background:#000
}
.previewArea.show{display:block}
.btnPostar{
  width:100%;
  padding:18px;
  background:linear-gradient(90deg,#00ff88,#00ff44);
  border:3px solid #fff;
  border-radius:14px;
  color:#000;
  font-weight:900;
  font-size:16px;
  margin-top:10px;
  display:none
}
.btnPostar.show{display:block}
.soundBtn{
  position:absolute;
  left:12px;
  top:50%;
  transform:translateY(-50%);
  z-index:20;
  width:52px;
  height:52px;
  border-radius:50%;
  background:rgba(0,0,0,.6);
  border:2.5px solid #fff;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  cursor:pointer
}
.soundBtn.on{
  background:#00ff88;
  border-color:#00ff88;
  color:#000;
  box-shadow:0 0 18px #00ff88
}
.soundBtn.off{
  background:rgba(0,0,0,.7);
  color:#fff
}
.soundBtn.pulse{
  animation:pulseSom 1.2s infinite
}
@keyframes pulseSom{
  0%,100%{transform:translateY(-50%) scale(1)}
  50%{transform:translateY(-50%) scale(1.08)}
}
.tapSom{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:rgba(0,255,136,.95);
  color:#000;
  padding:12px 22px;
  border-radius:30px;
  font-weight:900;
  font-size:13px;
  z-index:25
}
</style>
</head>
<body>
<div id="app">
  <div id="feed"></div>

  <div id="pCriar" class="page">
    <div style="display:flex;justify-content:space-between;padding:14px">
      <h3 style="color:#ff4500">📹 Postar 1:30 🔊</h3>
      <button onclick="closeAll();stopCam()" style="background:rgba(255,255,255,.12);border:none;color:#fff;width:32px;height:32px;border-radius:50%">✕</button>
    </div>
    <div class="card" style="border:2px solid #ff4500">
      <div style="display:flex;gap:8px">
        <button onclick="startCam('user')" class="btn" style="flex:1;margin:0;background:#222;color:#fff;border:1px solid #ff8c00;font-size:11px">FRENTE</button>
        <button onclick="startCam('environment')" class="btn" style="flex:1;margin:0;background:#222;color:#fff;border:1px solid #ff8c00;font-size:11px">TRÁS</button>
        <button onclick="switchCam()" class="btn" style="flex:1;margin:0;background:#ff8c00;color:#000;font-size:11px">TROCAR</button>
      </div>
      <div class="camBox" id="camBox" style="display:none">
        <div id="timer" class="timerCam">00:00 / 01:30 🔊 COM SOM</div>
        <video id="camVideo" autoplay muted playsinline class="mirror"></video>
        <div class="ctrlCam">
          <div id="btnRec" class="circ" onclick="toggleRec()"><i class="fa-solid fa-circle"></i></div>
        </div>
      </div>
      <div id="camOff" style="text-align:center;padding:18px;background:#111;border-radius:12px;border:1px dashed #ff4500;margin-top:10px">
        <i class="fa-solid fa-video" style="font-size:32px;color:#ff4500"></i>
        <div style="color:#fff;font-size:13px;margin-top:8px;font-weight:900">Grave seu vídeo 1:30 COM SOM!</div>
        <button class="btn" onclick="startCam('user')" style="margin-top:12px">ABRIR CÂMERA</button>
      </div>
      <div id="previewArea" class="previewArea">
        <video id="previewVideo" style="width:100%;height:40vh;object-fit:cover;display:block" controls playsinline loop></video>
      </div>
      <button id="btnPostar" class="btnPostar" onclick="postar()">🚀 POSTAR COM SOM</button>
      <input id="file" type="file" accept="image/*,video/*" style="color:#fff;width:100%;margin-top:12px">
      <input id="desc" class="input" placeholder="Legenda...">
    </div>
  </div>

  <div id="pEu" class="page">
    <div style="display:flex;justify-content:space-between;padding:14px">
      <b style="color:#ff4500">Eu</b>
      <button onclick="closeAll()" style="background:rgba(255,255,255,.12);border:none;color:#fff;width:32px;height:32px;border-radius:50%">✕</button>
    </div>
    <div class="card" style="text-align:center">
      <div class="avatar" onclick="document.getElementById('fotoPerfil').click()">
        <div id="avatarBox">🔥</div>
        <div class="cam">📷 FOTO</div>
      </div>
      <input id="fotoPerfil" type="file" accept="image/*" hidden>
      <input id="nomeUser" class="input" placeholder="Seu nome" style="text-align:center;font-weight:900;color:#ff8c00">
      <button class="btn" onclick="salvarTudo()">💾 SALVAR PERFIL GRAVADO</button>
      <div id="nomeShow" style="color:#ff8c00;font-size:12px;margin-top:8px;font-weight:900"></div>
      <div style="color:#333;font-size:8px">ID: <span id="uidShow"></span> • ♾️ ILIMITADO</div>
    </div>
    <div class="card">
      <b style="color:#ff8c00">🎬 Meus vídeos - excluir quando quiser</b>
      <div id="meusVideos"></div>
    </div>
  </div>

  <div class="nav">
    <button id="b0" class="on" onclick="go(0)"><i class="fa-solid fa-house"></i><span>Inicio</span></button>
    <button id="b1" onclick="go(1)"><i class="fa-solid fa-magnifying-glass"></i><span>Busca</span></button>
    <button id="b2" onclick="go(2)"><div class="plus"><i class="fa-solid fa-plus"></i></div></button>
    <button id="b3"><i class="fa-solid fa-tower-broadcast"></i><span>Live</span></button>
    <button id="b4" onclick="go(4)"><i class="fa-solid fa-user"></i><span>Eu</span></button>
  </div>
</div>

<script>
let db;
function openDB(){
  return new Promise((res)=>{
    try{
      let req=indexedDB.open("WorkFireSom",3);
      req.onupgradeneeded=e=>{
        let d=e.target.result;
        if(!d.objectStoreNames.contains("posts")){
          d.createObjectStore("posts",{keyPath:"id"});
        }
      };
      req.onsuccess=e=>{db=e.target.result; res(db);};
      req.onerror=()=>res(null);
    }catch(e){res(null);}
  });
}
function savePostDB(p){
  if(!db) return Promise.resolve();
  return new Promise(r=>{
    try{
      let tx=db.transaction("posts","readwrite");
      tx.objectStore("posts").put(p);
      tx.oncomplete=()=>r();
      tx.onerror=()=>r();
    }catch(e){r();}
  });
}
function getAllPostsDB(){
  if(!db) return Promise.resolve([]);
  return new Promise(r=>{
    try{
      let tx=db.transaction("posts","readonly");
      let req=tx.objectStore("posts").getAll();
      req.onsuccess=()=>r(req.result||[]);
      req.onerror=()=>r([]);
    }catch(e){r([]);}
  });
}
function deletePostDB(id){
  if(!db) return;
  try{db.transaction("posts","readwrite").objectStore("posts").delete(id);}catch(e){}
}

let uid=localStorage.getItem("uid");
if(!uid){
  uid="u_"+Math.random().toString(36).slice(2,7);
  localStorage.setItem("uid",uid);
}
let userFoto=localStorage.getItem("userFoto")||"";
let userNome=localStorage.getItem("userNome")||"";
let posts=[];
let temp="",tempType="img";
let stream=null,recorder=null,chunks=[];
let recording=false,timerInt=null,sec=0,facing="user";
let observer=null;
let somGlobal=localStorage.getItem('somGlobal')=='1';

async function init(){
  await openDB();
  let stored=await getAllPostsDB();
  if(stored.length>0){
    posts=stored.sort((a,b)=>(b.time||0)-(a.time||0));
  }else{
    posts=[{
      id:Date.now(),
      owner:"fire.influencer",
      img:"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=700",
      desc:"✅ BOTÃO DE SOM - toque no 🔊 pra ouvir!",
      firedBy:[],likedBy:[],com:[],
      isTop:true,
      type:"img",
      time:Date.now()
    }];
    for(let p of posts) await savePostDB(p);
  }
  render();
  setTimeout(setupObserver,500);
}
init();

function setupObserver(){
  if(observer) observer.disconnect();
  observer=new IntersectionObserver((entries)=>{
    entries.forEach(en=>{
      let v=en.target.querySelector('video');
      if(!v) return;
      if(en.isIntersecting){
        if(somGlobal){v.muted=false; v.volume=1;}
        v.play().catch(()=>{});
      }else{
        v.pause();
      }
    });
  },{threshold:0.65});
  document.querySelectorAll('.post').forEach(p=>observer.observe(p));
}

function toggleSomGlobal(btn){
  let video=btn.closest('.post').querySelector('video');
  if(!video) return;
  if(video.muted){
    video.muted=false;
    video.volume=1;
    video.play().catch(()=>{});
    btn.classList.remove('off');
    btn.classList.add('on');
    btn.innerHTML='<i class="fa-solid fa-volume-high"></i>';
    somGlobal=true;
    localStorage.setItem('somGlobal','1');
    document.querySelectorAll('#feed video').forEach(v=>{
      v.muted=false; v.volume=1;
    });
    document.querySelectorAll('.soundBtn').forEach(b=>{
      b.classList.remove('off');
      b.classList.add('on');
      b.innerHTML='<i class="fa-solid fa-volume-high"></i>';
    });
    let tap=document.getElementById('tapSom');
    if(tap) tap.style.display='none';
  }else{
    video.muted=true;
    btn.classList.remove('on');
    btn.classList.add('off');
    btn.innerHTML='<i class="fa-solid fa-volume-xmark"></i>';
    somGlobal=false;
    localStorage.setItem('somGlobal','0');
    document.querySelectorAll('#feed video').forEach(v=>{v.muted=true;});
    document.querySelectorAll('.soundBtn').forEach(b=>{
      b.classList.remove('on');
      b.classList.add('off');
      b.innerHTML='<i class="fa-solid fa-volume-xmark"></i>';
    });
  }
}

function ativarSomPrimeiroToque(){
  if(!somGlobal){
    somGlobal=true;
    localStorage.setItem('somGlobal','1');
    document.querySelectorAll('#feed video').forEach(v=>{
      v.muted=false; v.volume=1; v.play().catch(()=>{});
    });
    document.querySelectorAll('.soundBtn').forEach(b=>{
      b.classList.remove('off');
      b.classList.add('on');
      b.innerHTML='<i class="fa-solid fa-volume-high"></i>';
    });
    let tap=document.getElementById('tapSom');
    if(tap) tap.style.display='none';
  }
}

async function startCam(mode){
  facing=mode||facing;
  try{
    if(stream) stream.getTracks().forEach(t=>t.stop());
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},
      audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}
    });
    let v=document.getElementById("camVideo");
    v.srcObject=stream;
    if(facing==="user") v.classList.add("mirror");
    else v.classList.remove("mirror");
    document.getElementById("camBox").style.display="block";
    document.getElementById("camOff").style.display="none";
  }catch(e){
    alert("Câmera precisa HTTPS: "+e.message);
  }
}

function stopCam(){
  try{if(stream) stream.getTracks().forEach(t=>t.stop());}catch(e){}
  stream=null;
  document.getElementById("camBox").style.display="none";
  document.getElementById("camOff").style.display="block";
  if(timerInt){clearInterval(timerInt); timerInt=null;}
  if(recording) stopRec();
}

function switchCam(){
  startCam(facing==="user"?"environment":"user");
}

function toggleRec(){
  if(!recording) startRec();
  else stopRec();
}

function startRec(){
  if(!stream){alert("Abra câmera");return;}
  chunks=[];
  let mime="video/webm;codecs=vp9,opus";
  if(!MediaRecorder.isTypeSupported(mime)) mime="video/webm";
  try{
    recorder=new MediaRecorder(stream,{
      mimeType:mime,
      audioBitsPerSecond:128000,
      videoBitsPerSecond:1200000
    });
  }catch(e){
    recorder=new MediaRecorder(stream);
  }
  recorder.ondataavailable=e=>{
    if(e.data.size>0) chunks.push(e.data);
  };
  recorder.onstop=()=>{
    let blob=new Blob(chunks,{type:'video/webm'});
    temp=URL.createObjectURL(blob);
    tempType="video";
    let pv=document.getElementById("previewVideo");
    pv.src=temp;
    pv.muted=false;
    pv.volume=1;
    pv.play().catch(()=>{});
    document.getElementById("previewArea").classList.add("show");
    document.getElementById("btnPostar").classList.add("show");
  };
  recorder.start(200);
  recording=true;
  document.getElementById("btnRec").classList.add("stop");
  sec=0;
  timerInt=setInterval(()=>{
    sec++;
    let m=String(Math.floor(sec/60)).padStart(2,'0');
    let s=String(sec%60).padStart(2,'0');
    document.getElementById("timer").innerText=m+":"+s+" / 01:30 🔊";
    if(sec>=90) stopRec();
  },1000);
}

function stopRec(){
  try{if(recorder&&recording) recorder.stop();}catch(e){}
  recording=false;
  if(timerInt){clearInterval(timerInt); timerInt=null;}
  let b=document.getElementById("btnRec");
  if(b){
    b.classList.remove("stop");
    b.innerHTML='<i class="fa-solid fa-circle"></i>';
  }
}

function salvarTudo(){
  let n=document.getElementById("nomeUser").value.trim().replace(/@/g,"").replace(/\s/g,"").toLowerCase();
  if(!n){alert("Digite nome"); return;}
  userNome=n;
  localStorage.setItem("userNome",n);
  render();
  alert("✅ Perfil @"+n+" gravado ♾️ ILIMITADO");
}

function render(){
  let list=[...posts].sort((a,b)=>(b.time||0)-(a.time||0));
  document.getElementById("feed").innerHTML=list.map((p,i)=>{
    let idx=posts.indexOf(p);
    let fired=p.firedBy&&p.firedBy.includes(uid);
    let liked=p.likedBy&&p.likedBy.includes(uid);
    let media=p.type==="video"?"<video src=\""+p.img+"\" autoplay loop playsinline "+(somGlobal?'':'muted')+" preload=\"metadata\" style=\"width:100%;height:100%;object-fit:cover\" onclick=\"ativarSomPrimeiroToque()\"></video><button class=\"soundBtn "+(somGlobal?'on':'off pulse')+"\" onclick=\"toggleSomGlobal(this)\"><i class=\"fa-solid "+(somGlobal?'fa-volume-high':'fa-volume-xmark')+"\"></i></button>"+(i==0&&!somGlobal?"<div id=\"tapSom\" class=\"tapSom\" onclick=\"ativarSomPrimeiroToque()\">🔊 TOQUE PARA SOM</div>":''):"<div style=\"width:100%;height:100%;background:url('"+p.img+"') center/cover no-repeat\"></div>";
    return "<div class=\"post\">"+media+"<div class=\"rightBar\"><button class=\"btnTik\" onclick=\"fire("+idx+",this)\"><div class=\"iconTik fire "+(fired?'on':'')+"\"><i class=\"fa-solid fa-fire\"></i></div><div class=\"txtTik\">"+(p.firedBy?p.firedBy.length:0)+"<br>Chamas</div></button><button class=\"btnTik\" onclick=\"like("+idx+",this)\"><div class=\"iconTik heart "+(liked?'on':'')+"\"><i class=\""+(liked?'fa-solid':'fa-regular')+" fa-heart\"></i></div><div class=\"txtTik\">"+(p.likedBy?p.likedBy.length:0)+"<br>Curtir</div></button><button class=\"btnTik\"><div class=\"iconTik\"><i class=\"fa-regular fa-comment-dots\"></i></div><div class=\"txtTik\">"+(p.com?p.com.length:0)+"<br>Comen</div></button><button class=\"btnTik\"><div class=\"iconTik\"><i class=\"fa-solid fa-share\"></i></div><div class=\"txtTik\">Compar</div></button>"+(p.owner===userNome?"<button class=\"btnTik\" onclick=\"excluirPost("+p.id+")\"><div class=\"iconTik\" style=\"background:#ff0000\"><i class=\"fa-solid fa-trash\"></i></div><div class=\"txtTik\">Excluir</div></button>":'')+"</div><div class=\"info\"><b>@"+p.owner+"</b> "+(p.type==="video"?"<span style=\"background:"+(somGlobal?'#00ff88':'#333')+";color:"+(somGlobal?'#000':'#fff')+";padding:2px 6px;border-radius:10px;font-size:8px\">"+(somGlobal?'🔊 ON':'🔇 OFF')+"</span>":'')+"<div>"+(p.desc||'')+"</div></div></div>";
  }).join("");
  let meus=posts.filter(p=>p.owner===userNome);
  document.getElementById("meusVideos").innerHTML=meus.map(p=>"<div style=\"display:flex;gap:8px;margin-top:8px;background:rgba(255,255,255,.04);padding:6px;border-radius:8px\"><div style=\"width:42px;height:42px;border-radius:8px;background:url('"+p.img+"') center/cover\"></div><div style=\"color:#fff;font-size:11px\">"+(p.desc||'').slice(0,40)+" <span onclick=\"excluirPost("+p.id+")\" style=\"color:#ff0000\"> [X]</span></div></div>").join("")||"<div style='color:#555'>Nenhum</div>";
  document.getElementById("uidShow").innerText=uid;
  document.getElementById("nomeUser").value=userNome;
  document.getElementById("nomeShow").innerText=userNome?"@"+userNome+" • "+meus.length+" posts • ♾️ ILIMITADO":"";
  if(userFoto) document.getElementById("avatarBox").innerHTML="<img src=\""+userFoto+"\">";
  setTimeout(setupObserver,200);
}

async function fire(i,btn){
  let p=posts[i];
  if(!p.firedBy) p.firedBy=[];
  if(p.firedBy.includes(uid)) p.firedBy=p.firedBy.filter(x=>x!==uid);
  else p.firedBy.push(uid);
  await savePostDB(p);
  render();
}

async function like(i,btn){
  let p=posts[i];
  if(!p.likedBy) p.likedBy=[];
  if(p.likedBy.includes(uid)) p.likedBy=p.likedBy.filter(x=>x!==uid);
  else p.likedBy.push(uid);
  await savePostDB(p);
  render();
}

function go(n){
  if(n!==2) stopCam();
  document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("on"));
  document.getElementById("b"+n).classList.add("on");
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("show"));
  if(n==2) document.getElementById("pCriar").classList.add("show");
  if(n==4) document.getElementById("pEu").classList.add("show");
}

function closeAll(){
  stopCam();
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("show"));
  document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("on"));
  document.getElementById("b0").classList.add("on");
}

function excluirPost(id){
  if(!confirm("Excluir?")) return;
  posts=posts.filter(p=>p.id!=id);
  deletePostDB(id);
  render();
}

document.getElementById("file").addEventListener("change",e=>{
  let f=e.target.files[0];
  if(!f) return;
  if(f.type.startsWith("video")){
    temp=URL.createObjectURL(f);
    tempType="video";
    let pv=document.getElementById("previewVideo");
    pv.src=temp;
    pv.muted=false;
    pv.volume=1;
    pv.play().catch(()=>{});
    document.getElementById("previewArea").classList.add("show");
    document.getElementById("btnPostar").classList.add("show");
  }else{
    let r=new FileReader();
    r.onload=ev=>{
      temp=ev.target.result;
      tempType="img";
      document.getElementById("previewArea").classList.add("show");
      document.getElementById("btnPostar").classList.add("show");
    };
    r.readAsDataURL(f);
  }
});

async function postar(){
  let d=document.getElementById("desc").value.trim()||"Meu vídeo 🔊";
  if(!temp){alert("Grave vídeo"); return;}
  if(!userNome){alert("Salve perfil"); go(4); return;}
  let novo={
    id:Date.now()+Math.random(),
    owner:userNome,
    img:temp,
    desc:d,
    firedBy:[],likedBy:[],com:[],saveBy:[],share:0,
    type:tempType,
    time:Date.now()
  };
  await savePostDB(novo);
  posts.unshift(novo);
  temp="";
  document.getElementById("previewArea").classList.remove("show");
  document.getElementById("btnPostar").classList.remove("show");
  document.getElementById("desc").value="";
  render();
  closeAll();
  stopCam();
}
</script>
</body>
</html>
