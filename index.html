<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WORK FIRE - SEM TELA PRETA + SOM TIKTOK</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100dvh;background:#000;overflow:hidden;font-family:-apple-system,sans-serif}
#app{width:100%;max-width:420px;height:100dvh;margin:0 auto;background:#000;display:flex;flex-direction:column;position:relative}
#feed{flex:1;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;background:#000}
#feed::-webkit-scrollbar{display:none}
.post{height:100dvh;width:100%;position:relative;scroll-snap-align:start;background:#111 center/cover no-repeat;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.post video{width:100%;height:100%;object-fit:cover;display:block}
.post::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 20%,rgba(0,0,0,.2) 60%,rgba(0,0,0,.9) 100%);pointer-events:none;z-index:1}
.rightBar{position:absolute;right:8px;bottom:90px;z-index:10;display:flex;flex-direction:column;gap:12px;width:60px}
.btnTik{border:none;background:none;display:flex;flex-direction:column;align-items:center;cursor:pointer;width:100%}
.iconTik{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;background:rgba(35,35,35,.85);border:1.5px solid rgba(255,255,255,.18)}
.iconTik.fire{background:radial-gradient(circle at 30% 25%,#ff8c00,#ff4500 55%,#8b0000)}
.iconTik.fire.on{background:#ff4500;box-shadow:0 0 18px #ff4500}
.iconTik.heart.on{background:#ff1844}
.iconTik.save.on{background:#ffcc00;color:#000}
.txtTik{color:#fff;font-size:8.5px;font-weight:800;margin-top:3px;text-align:center}
.info{position:absolute;left:10px;right:76px;bottom:82px;z-index:10;background:rgba(0,0,0,.55);border-radius:12px;padding:9px 10px}
.info b{color:#fff;font-size:11px}
.info div{color:#ddd;font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{height:64px;background:#0a0700;border-top:1.5px solid rgba(255,69,0,.35);display:flex;align-items:center;justify-content:space-around;z-index:30;flex-shrink:0}
.nav button{flex:1;background:none;border:none;color:rgba(255,255,255,.5);font-size:8.5px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button.on{color:#ff8c00}
.nav button i{font-size:18px}
.plus{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#ff8c00,#ff2200);border:2.5px solid #fff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;margin-top:-20px}
.page{position:absolute;inset:0;background:#000;z-index:20;display:none;flex-direction:column;overflow-y:auto;padding-bottom:70px}
.page.show{display:flex}
.card{background:rgba(25,12,0,.92);border:1px solid rgba(255,69,0,.22);border-radius:12px;padding:12px;margin:10px}
.input{width:100%;padding:11px;background:#1e1100;border:1px solid rgba(255,69,0,.32);border-radius:10px;color:#fff;margin-top:7px}
.btn{width:100%;padding:14px;background:linear-gradient(90deg,#ff4500,#ff8c00);border:none;border-radius:12px;color:#000;font-weight:900;margin-top:10px}
.previewArea{display:none;margin-top:10px;border:3px solid #00ff88;border-radius:14px;overflow:hidden;position:relative}
.previewArea.show{display:block}
.btnPostar{width:100%;padding:18px;background:linear-gradient(90deg,#00ff88,#00ff44);border:3px solid #fff;border-radius:14px;color:#000;font-weight:900;font-size:16px;margin-top:10px;display:none}
.btnPostar.show{display:block}
.camBox{position:relative;width:100%;height:45vh;background:#000;border-radius:14px;overflow:hidden;border:2px solid #ff4500;margin-top:10px}
.camBox video{width:100%;height:100%;object-fit:cover}
.timerCam{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:red;color:#fff;padding:5px 14px;border-radius:20px;font-weight:900;font-size:13px;z-index:5}
.ctrlCam{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:20px;z-index:5}
.circ{width:70px;height:70px;border-radius:50%;border:4px solid #fff;background:red;display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px}
.avatar{width:88px;height:88px;border-radius:50%;border:3px solid #ff8c00;background:radial-gradient(circle at 30% 30%,#ff7a00,#7a0000);margin:0 auto;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:32px;position:relative}
.avatar img{width:100%;height:100%;object-fit:cover}
#comDrawer{position:absolute;inset:0;z-index:60;display:none;flex-direction:column;justify-content:flex-end;background:rgba(0,0,0,.55)}
#comDrawer.show{display:flex}
.comSheet{width:100%;max-width:420px;margin:0 auto;background:#161616;border-radius:20px 20px 0 0;max-height:75vh;display:flex;flex-direction:column}
</style>
</head>
<body>
<div id="app">
<div id="feed" style="background:#000"></div>
<div id="comDrawer" onclick="if(event.target.id==='comDrawer')closeCom()"><div class="comSheet"><div style="display:flex;justify-content:space-between;padding:12px"><b id="comCount" style="color:#fff">0 comentários</b><button onclick="closeCom()" style="background:#333;border:none;color:#fff;width:30px;height:30px;border-radius:50%">✕</button></div><div id="comList" style="flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px"></div><div style="display:flex;gap:8px;padding:10px"><input id="comInput" style="flex:1;padding:11px;background:#232323;border-radius:20px;color:#fff;border:none" placeholder="Comentar..." onkeydown="if(event.key==='Enter')sendCom()"><button onclick="sendCom()" style="width:40px;height:40px;border-radius:50%;border:none;background:#ff4500;color:#fff">➤</button></div></div></div>

<div id="pBusca" class="page"><div style="display:flex;justify-content:space-between;padding:14px"><h3 style="color:#ff4500">Busca</h3><button onclick="closeAll()" style="background:#333;border:none;color:#fff;width:32px;height:32px;border-radius:50%">✕</button></div><div class="card"><input id="qBusca" class="input" placeholder="Buscar..." oninput="busca()"><div id="rBusca"></div></div></div>

<div id="pCriar" class="page"><div style="display:flex;justify-content:space-between;padding:14px"><h3 style="color:#ff4500">📹 Postar 1:30 COM SOM</h3><button onclick="closeAll();stopCam()" style="background:#333;border:none;color:#fff;width:32px;height:32px;border-radius:50%">✕</button></div><div class="card" style="border:2px solid #ff4500"><div style="display:flex;gap:8px"><button onclick="startCam('user')" class="btn" style="flex:1;margin:0;background:#222;color:#fff;font-size:11px">FRENTE</button><button onclick="startCam('environment')" class="btn" style="flex:1;margin:0;background:#222;color:#fff;font-size:11px">TRÁS</button><button onclick="switchCam()" class="btn" style="flex:1;margin:0;background:#ff8c00;color:#000;font-size:11px">TROCAR</button></div><div class="camBox" id="camBox" style="display:none"><div id="timer" class="timerCam">00:00 / 01:30</div><video id="camVideo" autoplay muted playsinline style="width:100%;height:100%;object-fit:cover"></video><div class="ctrlCam"><div id="btnRec" class="circ" onclick="toggleRec()"><i class="fa-solid fa-circle"></i></div></div></div><div id="camOff" style="text-align:center;padding:18px;background:#111;border-radius:12px;margin-top:10px"><div style="color:#fff;font-weight:900">Grave COM SOM!</div><button class="btn" onclick="startCam('user')" style="margin-top:12px">ABRIR CÂMERA</button></div><div id="previewArea" class="previewArea"><video id="previewVideo" style="width:100%;height:40vh;object-fit:cover;display:block" controls playsinline loop></video><img id="prev" style="width:100%;display:none"></div><button id="btnPostar" class="btnPostar" onclick="postar()">🚀 POSTAR AGORA</button><input id="file" type="file" accept="image/*,video/*" style="color:#fff;width:100%;margin-top:12px"><input id="desc" class="input" placeholder="Legenda..."></div></div>

<div id="pEu" class="page"><div style="display:flex;justify-content:space-between;padding:14px"><b style="color:#ff4500">Eu</b><button onclick="closeAll()" style="background:#333;border:none;color:#fff;width:32px;height:32px;border-radius:50%">✕</button></div><div class="card" style="text-align:center"><div style="color:#00ff88;font-weight:900;font-size:12px">✅ SEM TELA PRETA + SOM DIRETO</div><div class="avatar" onclick="document.getElementById('fotoPerfil').click()" style="margin-top:10px"><div id="avatarBox">🔥</div></div><input id="fotoPerfil" type="file" accept="image/*" hidden onchange="trocarFoto(this)"><input id="nomeUser" class="input" placeholder="Seu nome @"><button class="btn" onclick="salvarTudo()">💾 SALVAR</button><div id="nomeShow" style="color:#ff8c00;margin-top:8px"></div><div style="color:#555;font-size:8px">ID: <span id="uidShow"></span></div></div></div>

<div class="nav"><button id="b0" class="on" onclick="go(0)"><i class="fa-solid fa-house"></i><span>Inicio</span></button><button id="b1" onclick="go(1)"><i class="fa-solid fa-magnifying-glass"></i><span>Busca</span></button><button id="b2" onclick="go(2)"><div class="plus"><i class="fa-solid fa-plus"></i></div></button><button id="b4" onclick="go(4)"><i class="fa-solid fa-user"></i><span>Eu</span></button></div>
</div>

<script>
// ANTI TELA PRETA - GARANTE POSTS
let uid=localStorage.getItem("uid");if(!uid){uid="u_"+Math.random().toString(36).slice(2,5);localStorage.setItem("uid",uid)}
let userNome=localStorage.getItem("userNome")||"",userFoto=localStorage.getItem("userFoto")||"";
let posts=JSON.parse(localStorage.getItem("posts_tiktokfix")||"[]");
if(posts.length===0){
posts=[{id:1,owner:"fire.influencer",img:"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=700",desc:"✅ Teste - Som direto TikTok! Toque 1x na tela libera áudio.",type:"img",firedBy:[],likedBy:[],com:[],saveBy:[],time:Date.now()}];
localStorage.setItem("posts_tiktokfix",JSON.stringify(posts));
}
let temp="",tempType="img",comIdx=null,stream=null,recorder=null,chunks=[],recording=false,timerInt=null,sec=0,facing="user";
let videoAtivo=null,audioLiberado=false,observer=null;

function salvar(){localStorage.setItem("posts_tiktokfix",JSON.stringify(posts))}

// SOM DIRETO - PAUSA TODOS EXCETO ATUAL
function pausarTodosExceto(exceto){
document.querySelectorAll('#feed video').forEach(v=>{
if(v!==exceto){try{v.pause();v.muted=true;}catch(e){}}
});
}
function setupObserver(){
if(observer) observer.disconnect();
observer=new IntersectionObserver((entries)=>{
let vis=entries.filter(e=>e.isIntersecting && e.intersectionRatio>=0.6).sort((a,b)=>b.intersectionRatio-a.intersectionRatio);
if(vis.length===0) return;
let video=vis[0].target.querySelector('video');
if(!video) return;
pausarTodosExceto(video);
videoAtivo=video;
if(audioLiberado){video.muted=false;video.volume=1;}else{video.muted=true;}
video.play().catch(()=>{video.muted=true;video.play().catch(()=>{})});
},{threshold:[0,0.6,1]});
document.querySelectorAll('.post').forEach(p=>observer.observe(p));
}

// LIBERA AUDIO NO PRIMEIRO TOQUE
document.body.addEventListener('click',()=>{
if(!audioLiberado){
audioLiberado=true;
if(videoAtivo){videoAtivo.muted=false;videoAtivo.volume=1;videoAtivo.play().catch(()=>{})}
}
},{once:true});

function render(){
try{
let feed=document.getElementById("feed");
if(!feed) return;
feed.innerHTML=posts.map((p,i)=>{
let media=p.type==="video"?`<video src="${p.img}" loop playsinline muted preload="metadata" style="width:100%;height:100%;object-fit:cover"></video>`:`<div style="width:100%;height:100%;background:url('${p.img}') center/cover no-repeat"></div>`;
return `<div class="post">${media}
<div class="rightBar">
<button class="btnTik" onclick="fire(${i})"><div class="iconTik fire ${(p.firedBy&&p.firedBy.includes(uid))?'on':''}"><i class="fa-solid fa-fire"></i></div><div class="txtTik">${p.firedBy?p.firedBy.length:0}<br>Chamas</div></button>
<button class="btnTik" onclick="like(${i})"><div class="iconTik heart ${(p.likedBy&&p.likedBy.includes(uid))?'on':''}"><i class="fa-solid fa-heart"></i></div><div class="txtTik">${p.likedBy?p.likedBy.length:0}<br>Curtir</div></button>
<button class="btnTik" onclick="openCom(${i})"><div class="iconTik"><i class="fa-regular fa-comment-dots"></i></div><div class="txtTik">${p.com?p.com.length:0}<br>Comen</div></button>
<button class="btnTik" onclick="saveP(${i})"><div class="iconTik save ${(p.saveBy&&p.saveBy.includes(uid))?'on':''}"><i class="fa-solid fa-bookmark"></i></div><div class="txtTik">Salvar</div></button>
</div>
<div class="info"><b>@${p.owner}</b> ${p.type==="video"?'<span style="background:#00ff88;color:#000;padding:2px 6px;border-radius:10px;font-size:8px">🔊 SOM DIRETO</span>':''}<div>${p.desc||''}</div></div>
</div>`;
}).join("");
setTimeout(()=>{try{setupObserver()}catch(e){}},500);
document.getElementById("uidShow").innerText=uid;
document.getElementById("nomeShow").innerText=userNome?"@"+userNome:"";
if(userFoto) document.getElementById("avatarBox").innerHTML=`<img src="${userFoto}">`;
}catch(e){
document.getElementById("feed").innerHTML=`<div class="post" style="background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column"><b style="color:#ff4500">Recarregue a página</b><button onclick="location.reload()" style="margin-top:10px;padding:10px 20px;background:#ff4500;border:none;border-radius:10px;color:#fff">RECARREGAR</button></div>`;
}
}
render();

function mostrarBotaoPostar(){document.getElementById("previewArea").classList.add("show");document.getElementById("btnPostar").classList.add("show")}

async function startCam(mode){
facing=mode||facing;
try{
if(stream) stream.getTracks().forEach(t=>t.stop());
stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
let v=document.getElementById("camVideo");v.srcObject=stream;
document.getElementById("camBox").style.display="block";
document.getElementById("camOff").style.display="none";
}catch(e){alert("Permita microfone: "+e.message)}
}
function stopCam(){try{if(stream)stream.getTracks().forEach(t=>t.stop())}catch(e){}stream=null;document.getElementById("camBox").style.display="none";document.getElementById("camOff").style.display="block";if(timerInt){clearInterval(timerInt);timerInt=null}if(recording)stopRec()}
function switchCam(){startCam(facing==="user"?"environment":"user")}
function toggleRec(){if(!recording)startRec();else stopRec()}
function startRec(){
if(!stream){alert("Abra câmera");return}
chunks=[];
let mime="video/webm;codecs=vp9,opus";if(!MediaRecorder.isTypeSupported(mime)) mime="video/webm";
let opts={mimeType:mime,audioBitsPerSecond:128000};
try{recorder=new MediaRecorder(stream,opts)}catch(e){recorder=new MediaRecorder(stream)}
recorder.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data)};
recorder.onstop=()=>{
let blob=new Blob(chunks,{type:'video/webm'});
let url=URL.createObjectURL(blob);
temp=url;tempType="video";
let pv=document.getElementById("previewVideo");if(pv){pv.src=url;pv.muted=false;pv.volume=1}
mostrarBotaoPostar();
};
recorder.start(200);recording=true;
sec=0;timerInt=setInterval(()=>{sec++;let m=String(Math.floor(sec/60)).padStart(2,'0');let s=String(sec%60).padStart(2,'0');document.getElementById("timer").innerText=`${m}:${s} / 01:30 COM SOM`;if(sec>=90)stopRec()},1000);
document.getElementById("btnRec").innerHTML='<i class="fa-solid fa-stop"></i>';
}
function stopRec(){try{if(recorder&&recording)recorder.stop()}catch(e){}recording=false;if(timerInt){clearInterval(timerInt);timerInt=null}document.getElementById("btnRec").innerHTML='<i class="fa-solid fa-circle"></i>';}

function salvarTudo(){let n=document.getElementById("nomeUser").value.trim().replace(/@/g,"").toLowerCase();if(!n){alert("Digite nome");return}userNome=n;localStorage.setItem("userNome",n);render();alert("Salvo @"+n)}
function trocarFoto(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{userFoto=e.target.result;localStorage.setItem("userFoto",userFoto);document.getElementById("avatarBox").innerHTML=`<img src="${userFoto}">`;render()};r.readAsDataURL(f)}

function fire(i){let p=posts[i];if(!p.firedBy)p.firedBy=[];if(p.firedBy.includes(uid))p.firedBy=p.firedBy.filter(x=>x!==uid);else p.firedBy.push(uid);salvar();render()}
function like(i){let p=posts[i];if(!p.likedBy)p.likedBy=[];if(p.likedBy.includes(uid))p.likedBy=p.likedBy.filter(x=>x!==uid);else p.likedBy.push(uid);salvar();render()}
function saveP(i){let p=posts[i];if(!p.saveBy)p.saveBy=[];if(p.saveBy.includes(uid))p.saveBy=p.saveBy.filter(x=>x!==uid);else p.saveBy.push(uid);salvar();render()}
function openCom(i){comIdx=posts[i].id;document.getElementById("comDrawer").classList.add("show");renderCom()}
function closeCom(){document.getElementById("comDrawer").classList.remove("show")}
function renderCom(){let p=posts.find(x=>x.id===comIdx);let el=document.getElementById("comList");if(!p)return;el.innerHTML=(p.com||[]).map(c=>`<div style="display:flex;gap:8px"><div style="width:30px;height:30px;border-radius:50%;background:#ff8c00;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900">${c.u.charAt(0).toUpperCase()}</div><div><div style="color:#999;font-size:11px">@${c.u}</div><div style="color:#fff">${c.t}</div></div></div>`).join("")||"<div style='color:#666;text-align:center;padding:20px'>Sem comentários</div>";document.getElementById("comCount").innerText=(p.com?p.com.length:0)+" comentários"}
function sendCom(){let inp=document.getElementById("comInput");let t=inp.value.trim();if(!t||comIdx===null)return;let p=posts.find(x=>x.id===comIdx);if(!p)return;if(!p.com)p.com=[];p.com.push({u:userNome||uid,t});salvar();inp.value="";renderCom();render()}

function go(n){if(n!==2)stopCam();document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("on"));document.getElementById("b"+n).classList.add("on");document.querySelectorAll(".page").forEach(p=>p.classList.remove("show"));if(n==1)document.getElementById("pBusca").classList.add("show");if(n==2)document.getElementById("pCriar").classList.add("show");if(n==4)document.getElementById("pEu").classList.add("show")}
function closeAll(){stopCam();document.querySelectorAll(".page").forEach(p=>p.classList.remove("show"));document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("on"));document.getElementById("b0").classList.add("on")}
function busca(){let q=document.getElementById("qBusca").value.toLowerCase();let r=posts.filter(p=>(p.desc||'').toLowerCase().includes(q));document.getElementById("rBusca").innerHTML=r.map(p=>`<div style="display:flex;gap:8px;margin-top:8px;background:rgba(255,255,255,.05);padding:6px;border-radius:8px"><div style="width:40px;height:40px;border-radius:8px;background:url('${p.img}') center/cover"></div><div style="color:#fff;font-size:11px">${p.desc||''}</div></div>`).join("")||"<div style='color:#555'>Nada</div>"}

document.getElementById("file").addEventListener("change",e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=ev=>{temp=ev.target.result;tempType=f.type.startsWith("video")?"video":"img";let pv=document.getElementById("previewVideo");if(pv){pv.src=temp;pv.muted=false}mostrarBotaoPostar()};r.readAsDataURL(f)})

async function postar(){
let d=document.getElementById("desc").value.trim()||"Meu vídeo 🔥";
if(!temp){alert("Grave!");return}
if(!userNome){alert("Cadastro em Eu!");go(4);return}
let novo={id:Date.now(),owner:userNome,img:temp,desc:d,firedBy:[],likedBy:[],com:[],saveBy:[],type:tempType,time:Date.now()};
posts.unshift(novo);salvar();
temp="";document.getElementById("previewArea").classList.remove("show");document.getElementById("btnPostar").classList.remove("show");
render();closeAll();alert("✅ Postado COM SOM DIRETO!");
}
</script>
</body>
</html>
