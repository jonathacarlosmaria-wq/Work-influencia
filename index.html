<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WORK - FIX APAGAR NÃO SOBREPOSTO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial;height:100dvh;overflow:hidden}
.app{height:100dvh;display:flex;flex-direction:column}
.stage{flex:1;position:relative;background:#000;overflow:hidden;border-radius:0 0 28px 28px}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
.media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.grad{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.96) 0%,transparent 58%)}
.prog{position:absolute;top:0;left:0;height:4px;background:linear-gradient(90deg,#D4AF37,#FFD700);z-index:20}
.top{position:absolute;top:10px;left:0;right:0;height:58px;display:flex;justify-content:center;gap:10px;z-index:10;padding:0 14px}
.pill{padding:10px 16px;border-radius:28px;font-size:11px;font-weight:900;background:rgba(0,0,0,.45);border:1.5px solid rgba(212,175,55,.3)}.pill.on{background:linear-gradient(145deg,#D4AF37,#FFD700);color:#000}
.actions{position:absolute;right:10px;bottom:102px;display:flex;flex-direction:column;gap:16px;z-index:10;align-items:center;width:78px}
.act{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;width:100%}
.btn{width:62px;height:62px;border-radius:22px;background:linear-gradient(145deg,#1e1e1e,#0a0a0a);border:1.5px solid rgba(212,175,55,.38);display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 8px 22px rgba(0,0,0,.65)}
.btn.mexendo{animation:mexe9s 9s ease-in-out!important}
@keyframes mexe9s{50%{transform:translate(-3px,6px) rotate(-10deg) scale(1.35)}}
.btn.liked{background:linear-gradient(145deg,#ff4d6d,#a00);color:#fff}
.cnt{font-size:9px;font-weight:900;background:rgba(0,0,0,.45);padding:3px 7px;border-radius:20px;border:1px solid rgba(212,175,55,.18);min-width:36px;text-align:center}
.cnt-share{font-size:7px;font-weight:900;color:#FFD700;margin-top:1px}
.meta{position:absolute;left:12px;bottom:14px;right:84px;z-index:10;background:rgba(0,0,0,.42);backdrop-filter:blur(24px);padding:12px 14px;border-radius:20px;border:1.5px solid rgba(212,175,55,.18)}
.user{font-weight:900;font-size:13px;display:flex;gap:8px;align-items:center}
.own{background:linear-gradient(145deg,#FFD700,#D4AF37);color:#000;padding:3px 8px;border-radius:20px;font-size:8px;font-weight:900}
.nav{height:96px!important;background:linear-gradient(180deg,#FFE55C,#FFD700,#D4AF37,#B8960C)!important;display:flex!important;justify-content:space-around!important;align-items:center!important;padding:12px 8px 18px!important;border-radius:32px 32px 0 0!important;margin-top:-20px!important;border-top:3px solid #FFD700!important;z-index:50!important;position:relative!important}
.tab{color:#3d2e00!important;font-size:10px;text-align:center;padding:10px 14px;border-radius:22px;min-width:64px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;border:1.5px solid rgba(0,0,0,.18)!important;background:rgba(0,0,0,.12)!important;font-weight:800}
.tab.on{background:#000!important;color:#FFD700!important}
.ico{font-size:28px;display:block}
.create{width:78px;height:54px;border-radius:24px;background:#000!important;display:flex;align-items:center;justify-content:center;border:2px solid #FFD700!important}
.create span{background:linear-gradient(145deg,#FFD700,#D4AF37)!important;color:#000!important;width:100%;height:100%;display:flex;align-items:center;justify-content:center;border-radius:20px;font-size:36px;font-weight:900}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:1000;display:none;flex-direction:column}.modal.on{display:flex!important}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
#toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#1d1d1d;padding:14px 24px;border-radius:24px;z-index:3000;display:none;text-align:center;border:1.5px solid rgba(212,175,55,.3);font-size:12px;font-weight:800}#toast.on{display:block!important}
</style>
</head>
<body>
<div id="toast"></div>
<div class="app"><div class="stage" id="stage"></div>
<div class="nav">
<div class="tab on"><span class="ico">⌂</span><span>Início</span></div>
<div class="tab" onclick="WORK.my()"><span class="ico">◧</span><span>Meus</span></div>
<div class="tab" onclick="WORK.openCam('video')"><div class="create"><span>+</span></div></div>
<div class="tab" onclick="WORK.openCam('live')"><span class="ico">●</span><span>LIVE</span></div>
<div class="tab" onclick="WORK.openProfile()"><span class="ico" id="icoEu">👤</span><span>Eu</span></div>
</div></div>

<div class="modal" id="profileM"><div style="flex:1" onclick="WORK.closeM()"></div>
<div style="position:absolute;bottom:0;left:0;right:0;background:#1f1f1f;border-radius:32px 32px 0 0;padding:20px;border-top:3px solid #FFD700;animation:up.35s">
<div style="display:flex;justify-content:space-between;margin-bottom:12px"><span style="color:#D4AF37;font-weight:900">👤 PERFIL</span><span onclick="WORK.closeM()" style="font-size:26px;color:#D4AF37">×</span></div>
<div style="text-align:center"><div id="avatarBox" style="width:110px;height:110px;margin:0 auto 14px;border-radius:28px;background:#111;border:3px solid #D4AF37;display:flex;align-items:center;justify-content:center;font-size:42px;overflow:hidden">👤</div>
<button onclick="WORK.pickAvatar()" style="background:rgba(212,175,55,.12);border:1.5px dashed rgba(212,175,55,.35);border-radius:18px;padding:10px 16px;color:#D4AF37;font-weight:800">📸 Escolher Foto</button></div>
<div style="margin-top:16px"><input id="inName" placeholder="Seu nome" style="width:100%;background:rgba(0,0,0,.45);border:1.5px solid rgba(212,175,55,.22);border-radius:18px;padding:13px 16px;color:#fff;margin-bottom:10px"><input id="inNick" placeholder="apelido" style="width:100%;background:rgba(0,0,0,.45);border:1.5px solid rgba(212,175,55,.22);border-radius:18px;padding:13px 16px;color:#fff;margin-bottom:10px"><textarea id="inBio" placeholder="Sobre você" style="width:100%;background:rgba(0,0,0,.45);border:1.5px solid rgba(212,175,55,.22);border-radius:18px;padding:13px 16px;color:#fff;min-height:70px"></textarea>
<button onclick="WORK.saveProfile()" style="width:100%;background:linear-gradient(145deg,#FFD700,#D4AF37);color:#000;border:none;padding:16px;border-radius:22px;font-weight:900;margin-top:12px">💾 SALVAR</button></div>
</div></div>

<div id="cam" style="position:fixed;inset:0;background:#000;z-index:999;display:none;flex-direction:column"><video id="camEl" autoplay playsinline muted style="width:100%;height:100%;object-fit:cover"></video>
<div style="position:absolute;top:0;left:0;right:0;height:68px;display:flex;justify-content:space-between;align-items:center;padding:0 16px;background:linear-gradient(180deg,rgba(0,0,0,.85),transparent)"><button onclick="WORK.closeCam()" style="background:rgba(0,0,0,.65);color:#FFD700;border:1.5px solid rgba(212,175,55,.4);padding:9px 16px;border-radius:24px;font-weight:800">✕ Fechar</button><div id="timer" style="display:none;background:linear-gradient(145deg,#ff2c55,#a00);padding:7px 16px;border-radius:24px;font-size:12px;font-weight:900">00:00 / 01:30</div><button onclick="WORK.flip()" style="background:rgba(0,0,0,.65);color:#D4AF37;border:1.5px solid rgba(212,175,55,.3);padding:9px 16px;border-radius:24px">🔄</button></div>
<div style="position:absolute;bottom:0;left:0;right:0;height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(0deg,rgba(0,0,0,.96),transparent)"><div style="display:flex;gap:12px"><i id="mV" style="padding:10px 20px;border-radius:26px;background:linear-gradient(145deg,#D4AF37,#FFD700);color:#000;font-size:12px;font-weight:900;font-style:normal">VÍDEO 90s</i><i id="mL" style="padding:10px 20px;border-radius:26px;background:rgba(255,255,255,.08);color:#888;font-size:12px;font-weight:900;font-style:normal" onclick="WORK.setMode('live')">LIVE 30min</i></div>
<div style="display:flex;align-items:center;gap:32px"><div style="width:54px;height:54px;border-radius:20px;background:#1e1e1e;display:flex;align-items:center;justify-content:center;font-size:22px;border:1.5px solid rgba(212,175,55,.22)" onclick="WORK.pick()">🖼️</div><div id="rec" style="width:86px;height:86px;border-radius:28px;border:2.5px solid #D4AF37;display:flex;align-items:center;justify-content:center" onclick="WORK.press()"><div style="width:68px;height:68px;background:linear-gradient(145deg,#ff4d6d,#a00);border-radius:20px"></div></div><div style="width:54px;height:54px;border-radius:20px;background:#1e1e1e;display:flex;align-items:center;justify-content:center;font-size:22px;border:1.5px solid rgba(212,175,55,.22)">⚡</div></div></div></div>

<div class="modal" id="listM"><div style="flex:1" onclick="WORK.closeM()"></div><div style="position:absolute;bottom:0;left:0;right:0;background:#1d1d1d;border-radius:28px 28px 0 0;padding:18px;border-top:2px solid #FFD700;max-height:85vh;display:flex;flex-direction:column"><div style="display:flex;justify-content:space-between;font-weight:900"><span style="color:#D4AF37">✨ Meus vídeos - Só você apaga o seu • <span id="cMy">0</span></span><span onclick="WORK.closeM()" style="font-size:26px;color:#D4AF37">×</span></div><div id="grid" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;overflow:auto;max-height:60vh"></div></div></div>
<input type="file" id="file" accept="video/*" style="display:none"><input type="file" id="fileAvatar" accept="image/*" style="display:none">

<script>
const WORK={
db:null,profile:{name:'',nick:'',age:'',bio:'',avatar:''},
videos:[{id:'w1',user:"@work",desc:"Vídeo exemplo - poste o seu!",img:"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?q=80&w=1000",likes:2451,liked:false,com:1,share:89,follow:false,type:"img",isDefault:true,userId:"system"}],
cur:0,stream:null,facing:'user',mode:'video',recorder:null,chunks:[],sec:0,inter:null,rec:false,
initDB(){return new Promise(r=>{let req=indexedDB.open('WorkFinalV5',5);req.onupgradeneeded=e=>{let d=e.target.result;if(!d.objectStoreNames.contains('videos')) d.createObjectStore('videos',{keyPath:'id'})};req.onsuccess=e=>{this.db=e.target.result;r()}})},
async save(v){await this.initDB();let tx=this.db.transaction('videos','readwrite');tx.objectStore('videos').put(v);return new Promise(r=>tx.oncomplete=()=>r())},
async loadAll(){await this.initDB();return new Promise(r=>{let tx=this.db.transaction('videos','readonly');let req=tx.objectStore('videos').getAll();req.onsuccess=()=>r(req.result)})},
async del(id){await this.initDB();let tx=this.db.transaction('videos','readwrite');tx.objectStore('videos').delete(id);return new Promise(r=>tx.oncomplete=()=>r())},
async loadSaved(){let saved=await this.loadAll();saved.forEach(v=>{try{if(v.blob){v.blobUrl=URL.createObjectURL(v.blob);v.img=v.blobUrl} v.isMine=true}catch{}});this.videos = saved.concat(this.videos.filter(v=>v.isDefault)); this.render();},
toast(t){let e=document.getElementById('toast');e.innerText=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2500)},
mexe(el){if(!el) return;el.classList.remove('mexendo');void el.offsetWidth;el.classList.add('mexendo');setTimeout(()=>el.classList.remove('mexendo'),9000)},
fmt(n){return n>=1000?(n/1000).toFixed(1)+'k':n||0},
loadProfile(){try{let p=JSON.parse(localStorage.getItem('work_profile')||'null');if(p){this.profile=p;document.getElementById('inName').value=p.name||'';document.getElementById('inNick').value=p.nick||'';document.getElementById('inBio').value=p.bio||'';if(p.avatar){document.getElementById('avatarBox').innerHTML=`<img src="${p.avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:25px">`;document.getElementById('icoEu').innerHTML=`<img src="${p.avatar}" style="width:28px;height:28px;border-radius:50%;border:1.5px solid #FFD700;object-fit:cover">`}}}catch{}},
openProfile(){this.loadProfile();let m=document.getElementById('profileM');m.classList.add('on');m.style.display='flex'},
share(){
let v=this.videos[this.cur];
let url = location.href;
if(navigator.share){navigator.share({title:'WORK', text:v.desc, url:url}).then(()=>{v.share++;this.render()});}
else{navigator.clipboard.writeText(url).then(()=>{v.share++;this.render();this.toast('🔗 Link copiado!')});}
},
canDelete(v){if(v.isDefault) return false; return true;},
async postVideo(blobOrFile){
 try{
  let myId=localStorage.getItem('work_my_id'); if(!myId){myId='user_'+Date.now(); localStorage.setItem('work_my_id',myId);}
  let url=URL.createObjectURL(blobOrFile);
  let novo={id:Date.now(), userId:myId, user:this.profile.nick?'@'+this.profile.nick:'@voce', desc:this.profile.bio||"Meu vídeo WORK 👑", img:url, blob:blobOrFile, blobUrl:url, likes:0,liked:false,com:0,share:0,follow:false,type:"video",isDefault:false,isMine:true,duration:this.sec};
  await this.save(novo); this.videos.unshift(novo); this.cur=0; this.render(); this.closeCam(); this.closeM(); this.toast('✅ Vídeo postado e gravado!');
 }catch(e){this.toast('❌ Erro ao postar');}
},
delVideo(id){
 if(!confirm('Apagar SEU vídeo? Só você pode apagar.')) return;
 this.del(id).then(()=>{
  this.videos=this.videos.filter(v=>v.id!==id);
  this.my();
  this.render();
  this.toast('🗑️ Seu vídeo apagado');
 });
},
closeM(){document.querySelectorAll('.modal').forEach(m=>{m.classList.remove('on');m.style.display='none'})},
saveProfile(){
 let name=document.getElementById('inName').value.trim(); let nick=document.getElementById('inNick').value.trim().replace('@',''); let bio=document.getElementById('inBio').value.trim();
 this.profile={...this.profile,name,nick,bio}; localStorage.setItem('work_profile',JSON.stringify(this.profile));
 this.toast('👑 Salvo!'); this.closeM(); this.render();
},
pickAvatar(){document.getElementById('fileAvatar').click()},
pick(){document.getElementById('file').click()},
render(){
 let v=this.videos[this.cur]; if(!v) return;
 let media=v.type==='video'?`<video class="media" id="vid" src="${v.blobUrl||v.img}" autoplay loop muted playsinline></video><div class="prog" id="prog" style="width:0%"></div>`:`<div class="bg" style="background-image:url('${v.img}')"></div>`;
 let followBtn=this.profile.avatar?`<div style="position:relative;width:62px;height:62px;border-radius:22px;border:2.5px solid #FFD700;overflow:visible"><img src="${this.profile.avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:19px;display:block"><div style="position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;background:${v.follow?'#000':'linear-gradient(145deg,#FFD700,#D4AF37)'};border:2px solid #000;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:${v.follow?'#FFD700':'#000'}">${v.follow?'✓':'＋'}</div></div>`:`<div class="btn ${v.follow?'followed':''}">${v.follow?'✓':'＋'}</div>`;

 document.getElementById('stage').innerHTML=`
 ${media}<div class="grad"></div>
 <div class="top"><div class="pill">Seguindo</div><div class="pill on">SEM APAGAR POR CIMA ✨</div><div class="pill">🔍</div></div>
 <div class="actions">
  <div class="act" onclick="WORK.mexe(this.querySelector('.btn'));WORK.like()"><div class="btn ${v.liked?'liked':''}">${v.liked?'❤️':'♡'}</div><div class="cnt">${this.fmt(v.likes)}</div></div>
  <div class="act" onclick="WORK.mexe(this.querySelector('.btn'))"><div class="btn">💬</div><div class="cnt">0</div></div>
  <div class="act" onclick="WORK.mexe(this.querySelector('.btn'));WORK.share()"><div class="btn">🔗</div><div class="cnt">${this.fmt(v.share)}</div><div class="cnt-share">COMPARTILHAR</div></div>
  <div class="act" onclick="WORK.mexe(this.querySelector('.follow-wrap,.btn'));WORK.follow()"><div class="follow-wrap">${followBtn}</div><div class="cnt" style="margin-top:8px">${v.follow?'Seguindo':'Seguir'}</div></div>
  <div class="act" onclick="WORK.mexe(this.querySelector('.btn'));WORK.openCam('live')"><div class="btn" style="background:linear-gradient(145deg,#ff4d6d,#900)">●</div><div class="cnt">LIVE</div></div>
 </div>
 <div class="meta">
   <div class="user">${v.user} ${v.isMine?'<span class="own">EU</span>':''}</div>
   <div style="font-size:13px;margin-top:6px">${v.desc}</div>
   <div style="font-size:10px;color:#D4AF37;margin-top:4px">♫ Para apagar vá em Meus - Só você apaga o seu</div>
 </div>
 `;
 let vd=document.getElementById('vid'); if(vd){vd.addEventListener('timeupdate',()=>{let p=document.getElementById('prog'); if(p&&vd.duration) p.style.width=(vd.currentTime/vd.duration*100)+'%'}); vd.play().catch(()=>{})}
},
like(){let v=this.videos[this.cur];v.liked=!v.liked;v.likes+=v.liked?1:-1;this.render()},
follow(){let v=this.videos[this.cur];v.follow=!v.follow;this.render()},
my(){
 this.loadAll().then(all=>{
  document.getElementById('cMy').innerText=all.length;
  document.getElementById('grid').innerHTML=all.map(v=>`
    <div style="position:relative;aspect-ratio:9/16;background:#111;border-radius:18px;overflow:hidden;border:1.5px solid rgba(212,175,55,.22)">
      <video src="${v.blobUrl||v.img}" style="width:100%;height:100%;object-fit:cover" muted></video>
      <div style="position:absolute;top:6px;right:6px;background:rgba(0,0,0,.7);border-radius:20px;padding:4px 8px;font-size:9px">MEU</div>
      <button onclick="WORK.delVideo(${v.id})" style="position:absolute;bottom:6px;left:6px;right:6px;background:rgba(255,59,48,.9);border:none;color:#fff;padding:8px;border-radius:12px;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:4px">🗑️ APAGAR MEU VÍDEO</button>
    </div>
  `).join('')||'<p style="color:#666;text-align:center;padding:20px">Nenhum vídeo seu ainda<br>Poste um vídeo que ele fica gravado aqui e só você apaga</p>';
  let m=document.getElementById('listM');m.classList.add('on');m.style.display='flex'
 })
},
openCam(m){this.mode=m;document.getElementById('cam').style.display='flex';navigator.mediaDevices.getUserMedia({video:{facingMode:this.facing,width:{ideal:720},height:{ideal:1280}},audio:true}).then(s=>{this.stream=s;document.getElementById('camEl').srcObject=s;document.getElementById('camEl').play()}).catch(()=>alert('Permita câmera'))},
closeCam(){if(this.rec) this.stop();if(this.stream){this.stream.getTracks().forEach(t=>t.stop());this.stream=null}document.getElementById('cam').style.display='none'},
setMode(m){this.mode=m},
flip(){this.facing=this.facing==='user'?'environment':'user';if(this.stream) this.stream.getTracks().forEach(t=>t.stop());navigator.mediaDevices.getUserMedia({video:{facingMode:this.facing},audio:true}).then(s=>{this.stream=s;document.getElementById('camEl').srcObject=s})},
press(){if(!this.rec) this.start(); else this.stop()},
start(){
 if(!this.stream) return; this.chunks=[];
 let o={}; try{this.recorder=new MediaRecorder(this.stream,o)}catch{this.recorder=new MediaRecorder(this.stream)}
 this.recorder.ondataavailable=e=>{if(e.data.size>0) this.chunks.push(e.data)};
 this.recorder.onstop=async ()=>{let blob=new Blob(this.chunks,{type:this.recorder.mimeType||'video/webm'}); await WORK.postVideo(blob);};
 this.recorder.start(100); this.rec=true; this.sec=0;
 document.getElementById('rec').classList.add('on'); let t=document.getElementById('timer'); t.style.display='block';
 this.inter=setInterval(()=>{this.sec++;let mm=String(Math.floor(this.sec/60)).padStart(2,'0'), ss=String(this.sec%60).padStart(2,'0');t.innerText=`${mm}:${ss} / 01:30`; if(this.sec>=90) this.stop()},1000);
},
stop(){if(!this.rec) return; clearInterval(this.inter); this.rec=false; document.getElementById('rec').classList.remove('on'); if(this.recorder) this.recorder.stop()},
};
document.getElementById('file').addEventListener('change', async e=>{
 let f=e.target.files[0]; if(!f) return;
 WORK.toast(`⏳ Postando...`);
 try{await WORK.postVideo(f);}catch(err){WORK.toast('❌ Erro');}
 e.target.value='';
});
document.getElementById('fileAvatar').addEventListener('change',e=>{
 let f=e.target.files[0]; if(!f) return;
 let r=new FileReader(); r.onload=ev=>{
  let b64=ev.target.result; WORK.profile.avatar=b64;
  document.getElementById('avatarBox').innerHTML=`<img src="${b64}" style="width:100%;height:100%;object-fit:cover;border-radius:25px">`;
  document.getElementById('icoEu').innerHTML=`<img src="${b64}" style="width:28px;height:28px;border-radius:50%;border:1.5px solid #FFD700;object-fit:cover">`;
  localStorage.setItem('work_profile',JSON.stringify(WORK.profile));
  WORK.toast('📸 Foto no Seguir!'); WORK.render();
 }; r.readAsDataURL(f);
});
WORK.loadSaved(); WORK.loadProfile();
</script>
</body>
</html>
