<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WORK FIRE - BOTAO SOM NA LATERAL</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100dvh;background:#000;overflow:hidden;font-family:-apple-system,sans-serif}
#app{width:100%;max-width:420px;height:100dvh;margin:0 auto;background:#000;display:flex;flex-direction:column;position:relative}
#feed{flex:1;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch}
#feed::-webkit-scrollbar{display:none}
.post{height:100dvh;width:100%;position:relative;scroll-snap-align:start;background:#111;flex-shrink:0;overflow:hidden}
.post video{width:100%;height:100%;object-fit:cover;display:block}
.post::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 20%,rgba(0,0,0,.2) 60%,rgba(0,0,0,.9) 100%);pointer-events:none;z-index:1}
.rightBar{position:absolute;right:8px;bottom:80px;z-index:10;display:flex;flex-direction:column;gap:10px;width:60px}
.btnTik{border:none;background:none;display:flex;flex-direction:column;align-items:center;cursor:pointer;width:100%}
.iconTik{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;background:rgba(35,35,35,.85);border:1.5px solid rgba(255,255,255,.18)}
.iconTik.fire{background:radial-gradient(circle at 30% 25%,#ff8c00,#ff4500 55%,#8b0000);border-color:#ff8c00}
.iconTik.fire.on{background:#ff4500;box-shadow:0 0 18px #ff4500}
.iconTik.heart.on{background:#ff1844}
.iconTik.save.on{background:#ffcc00;color:#000}
.iconTik.share.on{background:#00ff88;color:#000;box-shadow:0 0 12px #00ff88}
.iconTik.audio.on{background:#00ff88;color:#000;box-shadow:0 0 18px #00ff88;border-color:#00ff88}
.txtTik{color:#fff;font-size:8px;font-weight:800;margin-top:3px;text-shadow:0 1px 6px #000;text-align:center;line-height:9px}
.info{position:absolute;left:10px;right:76px;bottom:82px;z-index:10;background:rgba(0,0,0,.55);border:1px solid rgba(255,69,0,.22);border-radius:12px;padding:9px 10px}
.info b{color:#fff;font-size:11px}
.info div{color:#ddd;font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{height:64px;background:#0a0700;border-top:1.5px solid rgba(255,69,0,.35);display:flex;align-items:center;justify-content:space-around;z-index:30}
.nav button{flex:1;background:none;border:none;color:rgba(255,255,255,.5);font-size:8.5px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button.on{color:#ff8c00}
.plus{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#ff8c00,#ff2200);border:2.5px solid #fff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;margin-top:-20px}
.page{position:absolute;inset:0;background:#000;z-index:20;display:none;flex-direction:column;overflow-y:auto;padding-bottom:70px}
.page.show{display:flex}
.card{background:rgba(25,12,0,.92);border:1px solid rgba(255,69,0,.22);border-radius:12px;padding:12px;margin:10px}
.input{width:100%;padding:11px;background:#1e1100;border:1px solid rgba(255,69,0,.32);border-radius:10px;color:#fff;margin-top:7px;font-size:13px}
.btn{width:100%;padding:14px;background:linear-gradient(90deg,#ff4500,#ff8c00);border:none;border-radius:12px;color:#000;font-weight:900;margin-top:10px;font-size:13px;cursor:pointer}
.camBox{position:relative;width:100%;height:45vh;background:#000;border-radius:14px;overflow:hidden;border:2px solid #ff4500;margin-top:10px}
.camBox video{width:100%;height:100%;object-fit:cover}
.timerCam{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(255,0,0,.9);color:#fff;padding:5px 14px;border-radius:20px;font-weight:900;font-size:13px;z-index:5}
.btnPostar{width:100%;padding:18px;background:linear-gradient(90deg,#00ff88,#00ff44);border:3px solid #fff;border-radius:14px;color:#000;font-weight:900;font-size:16px;margin-top:10px;display:none}
.btnPostar.show{display:block}
#shareDrawer{position:absolute;inset:0;z-index:60;display:none;flex-direction:column;justify-content:flex-end;background:rgba(0,0,0,.55)}
#shareDrawer.show{display:flex}
.comSheet{width:100%;max-width:420px;margin:0 auto;background:#161616;border-radius:20px 20px 0 0;max-height:75vh;display:flex;flex-direction:column;border-top:1.5px solid rgba(255,69,0,.35)}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#00ff88;color:#000;padding:12px 22px;border-radius:24px;font-weight:900;font-size:13px;z-index:99}
</style>
</head>
<body>
<div id="app">
<div id="feed"></div>
<div id="shareDrawer" onclick="if(event.target.id==='shareDrawer')closeShare()"><div class="comSheet" style="padding:16px"><b style="color:#fff">Compartilhar</b><div style="display:flex;gap:12px;margin-top:18px;justify-content:space-around"><button onclick="shareWhats()" style="width:56px;height:56px;border-radius:50%;background:#25D366;border:none;color:#fff;font-size:26px"><i class="fa-brands fa-whatsapp"></i></button><button onclick="shareCopy()" style="width:56px;height:56px;border-radius:50%;background:#333;border:none;color:#fff"><i class="fa-solid fa-link"></i></button><button onclick="shareSystem()" style="width:56px;height:56px;border-radius:50%;background:#ff4500;border:none;color:#fff"><i class="fa-solid fa-share-nodes"></i></button></div><button onclick="closeShare()" style="width:100%;padding:14px;margin-top:18px;background:rgba(255,255,255,.08);border:none;border-radius:12px;color:#fff;font-weight:900">Fechar</button></div></div>
<div id="pCriar" class="page"><div class="card" style="border:2px solid #ff4500"><h3 style="color:#ff4500">Postar com som</h3><div id="camOff"><button class="btn" onclick="startCam('user')">ABRIR CÂMERA COM ÁUDIO</button></div><div id="camBox" style="display:none"><div id="timer" class="timerCam">00:00 / 01:30 COM SOM</div><video id="camVideo" autoplay muted playsinline></video><div style="text-align:center;margin-top:8px"><button onclick="toggleRec()" id="btnRec" style="width:70px;height:70px;border-radius:50%;background:#ff0000;border:4px solid #fff;color:#fff;font-size:28px">●</button></div></div><div id="previewArea" style="display:none;margin-top:10px;border:3px solid #00ff88;border-radius:14px;overflow:hidden"><video id="previewVideo" style="width:100%;height:40vh;object-fit:cover" controls playsinline loop></video></div><button id="btnPostar" class="btnPostar" onclick="postar()">POSTAR AGORA</button><input id="file" type="file" accept="image/*,video/*" style="color:#fff;width:100%;margin-top:12px"><input id="desc" class="input" placeholder="Legenda..."></div></div>
<div class="nav"><button id="b0" class="on" onclick="go(0)"><i class="fa-solid fa-house"></i><span>Inicio</span></button><button id="b2" onclick="go(2)"><div class="plus"><i class="fa-solid fa-plus"></i></div></button><button id="b4" onclick="go(4)"><i class="fa-solid fa-user"></i><span>Eu</span></button></div>
</div>
<script>
let db;function openDB(){return new Promise((res)=>{let req=indexedDB.open("WorkFireLateral",10);req.onupgradeneeded=e=>{let d=e.target.result;if(!d.objectStoreNames.contains("posts"))d.createObjectStore("posts",{keyPath:"id"})};req.onsuccess=e=>{db=e.target.result;res(db)};req.onerror=()=>res(null)})}
function savePostDB(p){if(!db)return Promise.resolve();return new Promise(r=>{let tx=db.transaction("posts","readwrite");tx.objectStore("posts").put(p);tx.oncomplete=()=>r()})}
function getAllPostsDB(){if(!db)return Promise.resolve([]);return new Promise(r=>{let tx=db.transaction("posts","readonly");let req=tx.objectStore("posts").getAll();req.onsuccess=()=>r(req.result||[])})}
let uid=localStorage.getItem("uid")||"u_"+Math.random().toString(36).slice(2,7);localStorage.setItem("uid",uid);
let posts=[];let temp="",tempType="img";let stream=null,recorder=null,chunks=[];let recording=false,timerInt=null,sec=0,facing="user";
let videoAtivo=null;let audioOn=localStorage.getItem('audioOn')=='1';let observer=null;let shareIdx=null;
async function init(){await openDB();let stored=await getAllPostsDB();if(stored.length>0){posts=stored.sort((a,b)=>(b.time||0)-(a.time||0))}else{posts=[{id:Date.now(),owner:"fire",img:"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=700",desc:"Botão som na lateral! Toque no 🔊",firedBy:[],likedBy:[],com:[],saveBy:[],sharedBy:[],isTop:true,type:"img",time:Date.now()}];for(let p of posts)await savePostDB(p)}render();setTimeout(setupObserver,600)}init();
function pausarTodosExceto(exceto){document.querySelectorAll('#feed video').forEach(v=>{if(v!==exceto){v.pause();v.muted=true;}})}
function setupObserver(){if(observer) observer.disconnect();observer=new IntersectionObserver((entries)=>{let vis=entries.filter(e=>e.isIntersecting&&e.intersectionRatio>=0.8).sort((a,b)=>b.intersectionRatio-a.intersectionRatio);if(vis.length===0) return;let video=vis[0].target.querySelector('video');if(!video) return;pausarTodosExceto(video);videoAtivo=video;if(audioOn){video.muted=false;video.volume=1;}else{video.muted=true;}video.play().catch(()=>{});atualizarBotoes();},{threshold:[0,0.8,1]});document.querySelectorAll('.post').forEach(p=>observer.observe(p));}
function atualizarBotoes(){document.querySelectorAll('.post').forEach(post=>{let v=post.querySelector('video');let b=post.querySelector('.iconTik.audio');if(!v||!b) return;let btn=b.closest('.btnTik');if(v===videoAtivo&&!v.muted&&!v.paused&&audioOn){b.classList.add('on');b.innerHTML='<i class="fa-solid fa-volume-high"></i>';if(btn) btn.querySelector('.txtTik').innerHTML='Áudio<br>ON';}else{b.classList.remove('on');b.innerHTML='<i class="fa-solid fa-volume-xmark"></i>';if(btn) btn.querySelector('.txtTik').innerHTML='Áudio<br>OFF';}})}
function toggleAudio(btnEl){
  let post=btnEl.closest('.post');let video=post.querySelector('video');
  if(!video){toast("Foto sem som");return;}
  pausarTodosExceto(video);
  let icon=btnEl.querySelector('.iconTik.audio');
  if(video.muted){
    video.muted=false;video.volume=1;video.play().catch(()=>{});videoAtivo=video;audioOn=true;localStorage.setItem('audioOn','1');
    icon.classList.add('on');icon.innerHTML='<i class="fa-solid fa-volume-high"></i>';btnEl.querySelector('.txtTik').innerHTML='Áudio<br>ON';toast("🔊 Som ligado - único!");
  }else{
    video.muted=true;audioOn=false;localStorage.setItem('audioOn','0');
    icon.classList.remove('on');icon.innerHTML='<i class="fa-solid fa-volume-xmark"></i>';btnEl.querySelector('.txtTik').innerHTML='Áudio<br>OFF';toast("🔇 Som off");
  }
  atualizarBotoes();
}
function toast(m){let t=document.createElement("div");t.innerText=m;t.className="toast";document.body.appendChild(t);setTimeout(()=>t.remove(),2000)}
function mostrarBotaoPostar(){document.getElementById("previewArea").style.display="block";document.getElementById("btnPostar").style.display="block"}
function closeShare(){document.getElementById("shareDrawer").style.display="none"}
async function shareP(i){shareIdx=i;let p=posts[i];if(!p.sharedBy)p.sharedBy=[];if(!p.sharedBy.includes(uid))p.sharedBy.push(uid);await savePostDB(p);render();document.getElementById("shareDrawer").style.display="flex";document.getElementById("shareDrawer").classList.add("show")}
function shareWhats(){window.open("https://wa.me/?text="+encodeURIComponent(location.href),"_blank");closeShare()}
function shareCopy(){navigator.clipboard.writeText(location.href);toast("Link copiado!");closeShare()}
function shareSystem(){if(navigator.share)navigator.share({url:location.href}).catch(()=>shareCopy());else shareCopy()}
async function startCam(mode){facing=mode;try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});let v=document.getElementById("camVideo");v.srcObject=stream;document.getElementById("camBox").style.display="block";document.getElementById("camOff").style.display="none";}catch(e){alert(e.message)}}
function stopCam(){try{if(stream)stream.getTracks().forEach(t=>t.stop())}catch(e){}document.getElementById("camBox").style.display="none";document.getElementById("camOff").style.display="block";if(timerInt)clearInterval(timerInt)}
function toggleRec(){if(!recording)startRec();else stopRec()}
function startRec(){if(!stream)return;chunks=[];recorder=new MediaRecorder(stream,{mimeType:"video/webm;codecs=vp9,opus",audioBitsPerSecond:128000});recorder.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data)};recorder.onstop=()=>{let blob=new Blob(chunks,{type:'video/webm'});temp=URL.createObjectURL(blob);tempType="video";let pv=document.getElementById("previewVideo");pv.src=temp;pv.muted=false;mostrarBotaoPostar();toast("Gravado com som!")};recorder.start();recording=true;sec=0;timerInt=setInterval(()=>{sec++;document.getElementById("timer").innerText=String(Math.floor(sec/60)).padStart(2,'0')+":"+String(sec%60).padStart(2,'0')+" / 01:30";if(sec>=90)stopRec()},1000)}
function stopRec(){try{recorder.stop()}catch(e){}recording=false;clearInterval(timerInt)}
function render(){let list=[...posts].sort((a,b)=>(b.isTop?1:0)-(a.isTop?1:0)||(b.time||0)-(a.time||0));document.getElementById("feed").innerHTML=list.map((p)=>{let idx=posts.indexOf(p);let fired=p.firedBy&&p.firedBy.includes(uid);let liked=p.likedBy&&p.likedBy.includes(uid);let saved=p.saveBy&&p.saveBy.includes(uid);let shared=p.sharedBy&&p.sharedBy.includes(uid);let media=p.type==="video"?'<video src="'+p.img+'" loop playsinline muted preload="metadata" style="width:100%;height:100%;object-fit:cover"></video>':'<div style="width:100%;height:100%;background:url(\''+p.img+'\') center/cover no-repeat"></div>';let audioBtn=p.type==="video"?'<button class="btnTik" onclick="toggleAudio(this)"><div class="iconTik audio '+(audioOn&&videoAtivo&&posts[idx].img===videoAtivo.src?'on':'')+'"><i class="fa-solid '+(audioOn?'fa-volume-high':'fa-volume-xmark')+'"></i></div><div class="txtTik">Áudio<br>'+(audioOn?'ON':'OFF')+'</div></button>':'<button class="btnTik" style="opacity:.3"><div class="iconTik audio"><i class="fa-solid fa-volume-xmark"></i></div><div class="txtTik">Áudio<br>OFF</div></button>';return '<div class="post">'+media+'<div class="rightBar">'+audioBtn+'<button class="btnTik" onclick="fire('+idx+',this)"><div class="iconTik fire '+(fired?'on':'')+'"><i class="fa-solid fa-fire"></i></div><div class="txtTik">'+(p.firedBy?p.firedBy.length:0)+'<br>Chamas</div></button><button class="btnTik" onclick="like('+idx+',this)"><div class="iconTik heart '+(liked?'on':'')+'"><i class="'+(liked?'fa-solid':'fa-regular')+' fa-heart"></i></div><div class="txtTik">'+(p.likedBy?p.likedBy.length:0)+'<br>Curtir</div></button><button class="btnTik" onclick="shareP('+idx+',this)"><div class="iconTik share '+(shared?'on':'')+'"><i class="fa-solid fa-share"></i></div><div class="txtTik">'+(p.sharedBy?p.sharedBy.length:0)+'<br>Compar</div></button><button class="btnTik" onclick="saveP('+idx+',this)"><div class="iconTik save '+(saved?'on':'')+'"><i class="'+(saved?'fa-solid':'fa-regular')+' fa-bookmark"></i></div><div class="txtTik">Salvar</div></button></div><div class="info"><b>@'+p.owner+'</b> '+(p.type==="video"?'<span style="background:'+(audioOn?'#00ff88':'#333')+';color:'+(audioOn?'#000':'#fff')+';padding:2px 6px;border-radius:10px;font-size:8px">'+(audioOn?'🔊 SOM ON':'🔇 TOQUE 🔊')+'</span>':'')+'<div>'+(p.desc||'')+'</div></div></div>'}).join("");setTimeout(setupObserver,300)}
async function fire(i){let p=posts[i];if(!p.firedBy)p.firedBy=[];if(p.firedBy.includes(uid))p.firedBy=p.firedBy.filter(x=>x!==uid);else p.firedBy.push(uid);await savePostDB(p);render()}
async function like(i){let p=posts[i];if(!p.likedBy)p.likedBy=[];if(p.likedBy.includes(uid))p.likedBy=p.likedBy.filter(x=>x!==uid);else p.likedBy.push(uid);await savePostDB(p);render()}
async function saveP(i){let p=posts[i];if(!p.saveBy)p.saveBy=[];if(p.saveBy.includes(uid))p.saveBy=p.saveBy.filter(x=>x!==uid);else p.saveBy.push(uid);await savePostDB(p);render()}
function go(n){document.querySelectorAll(".page").forEach(p=>p.classList.remove("show"));if(n==2)document.getElementById("pCriar").classList.add("show")}
function closeAll(){stopCam();document.querySelectorAll(".page").forEach(p=>p.classList.remove("show"))}
document.getElementById("file").addEventListener("change",e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=ev=>{temp=ev.target.result;tempType=f.type.startsWith("video")?"video":"img";document.getElementById("previewVideo").src=temp;mostrarBotaoPostar()};r.readAsDataURL(f)})
async function postar(){let d=document.getElementById("desc").value.trim()||"Video 🔊";if(!temp){alert("Grave!");return}let novo={id:Date.now()+Math.random(),owner:"eu",img:temp,desc:d,firedBy:[],likedBy:[],com:[],saveBy:[],sharedBy:[],isTop:false,type:tempType,time:Date.now()};await savePostDB(novo);posts.unshift(novo);render();closeAll();toast("Postado!")}
document.getElementById('feed').addEventListener('scroll',()=>{document.querySelectorAll('#feed video').forEach(v=>{if(v!==videoAtivo){v.pause();v.muted=true}})}, {passive:true});
</script>
</body>
</html>
