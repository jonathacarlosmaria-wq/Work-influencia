<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work Influência - Global</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial}
#feed{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory}
.video-card{height:100vh;scroll-snap-align:start;position:relative;background:#111;display:flex;align-items:center;justify-content:center}
video{width:100%;height:100%;object-fit:cover}
.info{position:absolute;bottom:80px;left:15px;z-index:2}
.acoes{position:absolute;right:15px;bottom:120px;z-index:2;display:flex;flex-direction:column;gap:20px}
.btn-acao{background:rgba(255,255,255,0.2);width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;border:none;color:#fff}
#postar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#ff0050;color:#fff;padding:15px 30px;border-radius:30px;border:none;font-weight:bold;z-index:10}
</style>
</head>
<body>

<div id="feed">Carregando feed global...</div>

<input type="file" id="fileInput" accept="video/*" style="display:none">
<button id="postar" onclick="document.getElementById('fileInput').click()">+ POSTAR VÍDEO</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, orderBy, query, serverTimestamp, updateDoc, doc, increment } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyAdr--djcqvYFaZX7CmgzIDBJl1JJww54w",
  authDomain: "work-influencia.firebaseapp.com",
  projectId: "work-influencia",
  storageBucket: "work-influencia.firebasestorage.app",
  messagingSenderId: "184507137189",
  appId: "1:184507137189:web:f5607b39b2f8be2045214c",
  measurementId: "G-0LBD6K4X5C"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

// FEED GLOBAL TEMPO REAL
const q = query(collection(db, "videos"), orderBy("criadoEm", "desc"));
onSnapshot(q, (snap) => {
  const feed = document.getElementById("feed");
  if(snap.empty){ feed.innerHTML = "<div style='padding:50px;text-align:center'>Nenhum vídeo ainda.<br>Seja o primeiro a postar! 👇</div>"; return; }
  feed.innerHTML = "";
  snap.forEach(d => {
    const v = d.data();
    const id = d.id;
    feed.innerHTML += `
      <div class="video-card">
        <video src="${v.url}" loop autoplay muted playsinline onclick="this.paused?this.play():this.pause()"></video>
        <div class="info">
          <b>@${v.usuario || 'usuario'}</b><br>
          <span>${v.descricao || ''}</span>
        </div>
        <div class="acoes">
          <button class="btn-acao" onclick="curtir('${id}')">❤️<br><small style="font-size:12px">${v.curtidas||0}</small></button>
          <button class="btn-acao">💬</button>
          <button class="btn-acao">↗️</button>
        </div>
      </div>
    `;
  });
});

window.curtir = async (id) => {
  await updateDoc(doc(db, "videos", id), { curtidas: increment(1) });
}

// UPLOAD
document.getElementById('fileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const btn = document.getElementById('postar');
  btn.innerText = "ENVIANDO 0%";

  const storageRef = ref(storage, 'videos/' + Date.now() + '_' + file.name);
  const task = uploadBytesResumable(storageRef, file);

  task.on('state_changed',
    (snap) => { btn.innerText = "ENVIANDO " + Math.round(snap.bytesTransferred/snap.totalBytes*100) + "%"; },
    (err) => { alert("Erro: " + err.message); btn.innerText = "+ POSTAR VÍDEO"; },
    async () => {
      const url = await getDownloadURL(task.snapshot.ref);
      await addDoc(collection(db, "videos"), {
        url: url,
        usuario: "jonatha",
        descricao: "Meu vídeo 🔥 #workinfluencia",
        curtidas: 0,
        criadoEm: serverTimestamp()
      });
      btn.innerText = "+ POSTAR VÍDEO";
      alert("✅ Postado! Agora TODO MUNDO vê!");
    }
  );
});
</script>
</body>
</html>
