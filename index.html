<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WORK FIRE - SOM TIKTOK</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100dvh;background:#000;overflow:hidden;font-family:-apple-system,sans-serif}
#app{width:100%;max-width:420px;height:100dvh;margin:0 auto;background:#000;display:flex;flex-direction:column;position:relative}
#feed{flex:1;overflow-y:scroll;scroll-snap-type:y mandatory}
#feed::-webkit-scrollbar{display:none}
.post{height:100dvh;width:100%;position:relative;scroll-snap-align:start;background:#111;flex-shrink:0;overflow:hidden}
.post video{width:100%;height:100%;object-fit:cover;display:block}
.rightBar{position:absolute;right:8px;bottom:90px;z-index:20;display:flex;flex-direction:column;gap:10px;width:60px}
.btnTik{border:none;background:none;display:flex;flex-direction:column;align-items:center;cursor:pointer;width:100%}
.btnTik:active{transform:scale(.88)}
.iconTik{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;background:rgba(35,35,35,.9);border:1.5px solid rgba(255,255,255,.2)}
.iconTik.fire{background:radial-gradient(circle at 30% 25%,#ff8c00,#ff4500 55%,#8b0000)}
.iconTik.audio{background:rgba(0,0,0,.8);border:2px solid #fff}
.iconTik.audio.on{background:#00ff88;color:#000;border-color:#00ff88;box-shadow:0 0 18px #00ff88}
.iconTik.fire.on{background:#ff4500;box-shadow:0 0 18px #ff4500}
.iconTik.heart.on{background:#ff1844}
.txtTik{color:#fff;font-size:8px;font-weight:800;margin-top:3px;text-align:center;line-height:9px;text-shadow:0 1px 6px #000}
.info{position:absolute;left:10px;right:76px;bottom:82px;z-index:10;background:rgba(0,0,0,.55);border:1px solid rgba(255,69,0,.22);border-radius:12px;padding:9px 10px}
.info b{color:#fff;font-size:11px}
.info div{color:#ddd;font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tapPlay{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;pointer-events:none}
.tapPlay i{font-size:50px;color:rgba(255,255,255,.8)}
.nav{height:64px;min-height:64px;background:#0a0700;border-top:1.5px solid rgba(255,69,0,.35);display:flex;align-items:center;justify-content:space-around;z-index:30}
.nav button{flex:1;background:none;border:none;color:rgba(255,255,255,.5);font-size:8.5px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button.on{color:#ff8c00}
.nav button i{font-size:18px}
.plus{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#ff8c00,#ff2200);border:2.5px solid #fff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;margin-top:-20px}
.page{position:absolute;inset:0;background:#000;z-index:20;display:none;flex-direction:column;overflow-y:auto;padding-bottom:70px}
.page.show{display:flex}
.card{background:rgba(25,12,0,.92);border:1px solid rgba(255,69,0,.22);border-radius:12px;padding:12px;margin:10px}
.input{width:100%;padding:11px;background:#1e1100;border:1px solid rgba(255,69,0,.32);border-radius:10px;color:#fff;margin-top:7px}
.btn{width:100%;padding:14px;background:linear-gradient(90deg,#ff4500,#ff8c00);border:none;border-radius:12px;color:#000;font-weight:900;margin-top:10px}
.camBox{position:relative;width:100%;height:45vh;background:#000;border-radius:14px;overflow:hidden;border:2px solid #ff4500;margin-top:10px}
.camBox video{width:100%;height:100%;object-fit:cover}
.timerCam{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#ff0000;color:#fff;padding:5px 14px;border-radius:20px;font-weight:900;font-size:13px;z-index:5}
.circ{width:70px;height:70px;border-radius:50%;border:4px solid #fff;background:#ff0000;display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;cursor:pointer}
.circ.stop{background:#fff;color:#ff0000}
.previewArea{display:none;margin-top:10px;border:3px solid #00ff88;border-radius:14px;overflow:hidden;background:#000;position:relative}
.previewArea.show{display:block}
.btnPostar{width:100%;padding:18px;background:linear-gradient(90deg,#00ff88,#00ff44);border:3px solid #fff;border-radius:14px;color:#000;font-weight:900;font-size:16px;margin-top:10px;display:none}
.btnPostar.show{display:block}
#comDrawer,#shareDrawer{position:absolute;inset:0;z-index:60;display:none;flex-direction:column;justify-content:flex-end;background:rgba(0,0,0,.55)}
#comDrawer.show,#shareDrawer.show{display:flex}
.comSheet{width:100%;max-width:420px;margin:0 auto;background:#161616;border-radius:20px 20px 0 0;max-height:75vh;display:flex;flex-direction:column}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#00ff88;color:#000;padding:10px 18px;border-radius:20px;font-weight:900;font-size:12px;z-index:99}
</style>
</head>
<body>
<div id="app">
<div id="feed"></div>
<div id="comDrawer" onclick="if(event.target.id==='comDrawer')closeCom()"><div class="comSheet"><div style="padding:12px"><b id="comCount" style="color:#fff">0 comentários</b> <button onclick="closeCom()" style="float:right;background:rgba(255,255,255,.1);border:none;color:#fff;width:30px;height:30px;border-radius:50%">X</button></div><div id="comList" style="flex:1;overflow-y:auto;padding:12px"></div><div style="display:flex;gap:8px;padding:10px"><input id="comInput" style="flex:1;padding:11px;background:#232323;border-radius:24px;border:none;color:#fff" placeholder="Comentar..."><button onclick="sendCom()" style="width:40px;height:40px;border-radius:50%;border:none;background:#ff4500;color:#fff">></button></div></div></div>
<div id="shareDrawer" onclick="if(event.target.id==='shareDrawer')closeShare()"><div class="comSheet" style="padding:16px"><b style="color:#fff">Compartilhar</b><div style="display:flex;gap:12px;margin-top:18px;justify-content:space-around"><button onclick="shareWhats()" style="width:56px;height:56px;border-radius:50%;background:#25D366;border:none;color:#fff;font-size:26px"><i class="fa-brands fa-whatsapp"></i></button><button onclick="shareCopy()" style="width:56px;height:56px;border-radius:50%;background:#333;border:none;color:#fff"><i class="fa-solid fa-link"></i></button></div><button onclick="closeShare()" style="width:100%;padding:14px;margin-top:18px;background:rgba(255,255,255,.08);border:none;border-radius:12px;color:#fff">Fechar</button></div></div>
<div id="pBusca" class="page"><div style="display:flex;justify-content:space-between;padding:14px"><h3 style="color:#ff4500">Busca</h3><button onclick="closeAll()" style="background:rgba(255,255,255,.12);border:none;color:#fff;width:32px;height:32px;border-radius:50%">X</button></div><div class="card"><input id="qBusca" class="input" placeholder="Buscar..." oninput="busca()"><div id="rBusca"></div></div></div>
<div id="pCriar" class="page"><div style="display:flex;justify-content:space-between;padding:14px"><h3 style="color:#ff4500">Postar</h3><button onclick="closeAll();stopCam()" style="background:rgba(255,255,255,.12);border:none;color:#fff;width:32px;height:32px;border-radius:50%">X</button></div><div class="card" style="border:2px solid #ff4500"><div style="display:flex;gap:8px"><button onclick="startCam('user')" class="btn" style="flex:1;margin:0;background:#222;color:#fff">FRENTE</button><button onclick="startCam('environment')" class="btn" style="flex:1;margin:0;background:#222;color:#fff">TRAS</button></div><div class="camBox" id="camBox" style="display:none"><div id="timer" class="timerCam">00:00 / 01:30 COM SOM</div><video id="camVideo" autoplay muted playsinline></video><div style="position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center"><div id="btnRec" class="circ" onclick="toggleRec()"><i class="fa-solid fa-circle"></i></div></div></div><div id="camOff" style="text-align:center;padding:18px;background:#111;border-radius:12px;margin-top:10px"><button class="btn" onclick="startCam('user')">ABRIR CAMERA COM AUDIO</button><div style="color:#00ff88;font-size:11px;margin-top:8px">⚠️ Permita MICROFONE para ter som!</div></div><div id="previewArea" class="previewArea"><video id="previewVideo" style="width:100%;height:40vh;object-fit:cover" controls playsinline loop></video></div><button id="btnPostar" class="btnPostar" onclick="postar()">POSTAR AGORA</button><input id="file" type="file" accept="video/*" style="color:#fff;width:100%;margin-top:12px"><input id="desc" class="input" placeholder="Legenda..."></div></div>
<div id="pEu" class="page"><div style="display:flex;justify-content:space-between;padding:14px"><b style="color:#ff4500">Eu</b><button onclick="closeAll()" style="background:rgba(255,255,255,.12);border:none;color:#fff;width:32px;height:32px;border-radius:50%">X</button></div><div class="card"><input id="nomeUser" class="input" placeholder="Seu nome"><button class="btn" onclick="salvarTudo()">SALVAR</button><div style="color:#333;font-size:8px">ID: <span id="uidShow"></span></div></div></div>
<div class="nav"><button id="b0" class="on" onclick="go(0)"><i class="fa-solid fa-house"></i><span>Inicio</span></button><button id="b1" onclick="go(1)"><i class="fa-solid fa-magnifying-glass"></i><span>Busca</span></button><button id="b2" onclick="go(2)"><div class="plus"><i class="fa-solid fa-plus"></i></div></button><button id="b4" onclick="go(4)"><i class="fa-solid fa-user"></i><span>Eu</span></button></div>
</div>
<script>
let db;function openDB(){return new Promise((res)=>{let req=indexedDB.open("WorkFireTikTokSom",15);req.onupgradeneeded=e=>{let d=e.target.result;if(!d.objectStoreNames.contains("posts"))d.createObjectStore("posts",{keyPath:"id"})};req.onsuccess=e=>{db=e.target.result;res(db)};req.onerror=()=>res(null)})}
function savePostDB(p){if(!db)return Promise.resolve();return new Promise(r=>{let tx=db.transaction("posts","readwrite");tx.objectStore("posts").put(p);tx.oncomplete=()=>r()})}
function getAllPostsDB(){if(!db)return Promise.resolve([]);return new Promise(r=>{let tx=db.transaction("posts","readonly");let req=tx.objectStore("posts").getAll();req.onsuccess=()=>r(req.result||[])})}
let uid=localStorage.getItem("uid")||"u_"+Math.random().toString(36).slice(2,7);localStorage.setItem("uid",uid);
let userNome=localStorage.getItem("userNome")||"";let posts=[];let temp="",tempType="img",comIdx=null;let stream=null,recorder=null,chunks=[];let recording=false,timerInt=null,sec=0,facing="user";
let videoAtivo=null;let audioOn=localStorage.getItem('audioOn')==='1';let observer=null;
async function init(){await openDB();let stored=await getAllPostsDB();if(stored.length>0){posts=stored.sort((a,b)=>(b.time||0)-(a.time||0))}else{posts=[{id:Date.now(),owner:"fire",img:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",desc:"Teste TikTok - toque no 🔊 lateral ou no vídeo!",firedBy:[],likedBy:[],com:[],saveBy:[],sharedBy:[],type:"video",time:Date.now()}];for(let p of posts)await savePostDB(p)}render();setTimeout(setupObserver,600)}init();
function pausarTodosExceto(exceto){document.querySelectorAll('#feed video').forEach(v=>{if(v!==exceto){v.pause();v.muted=true;}})}
function setupObserver(){if(observer)observer.disconnect();observer=new IntersectionObserver((entries)=>{let vis=entries.filter(e=>e.isIntersecting&&e.intersectionRatio>=0.8).sort((a,b)=>b.intersectionRatio-a.intersectionRatio);if(vis.length===0)return;let video=vis[0].target.querySelector('video');if(!video)return;pausarTodosExceto(video);videoAtivo=video;video.muted=!audioOn;if(audioOn){video.volume=1;video.muted=false;}video.play().catch(()=>{});atualizarBotoes();},{threshold:[0,0.8,1]});document.querySelectorAll('.post').forEach(p=>observer.observe(p));}
function atualizarBotoes(){document.querySelectorAll('.post').forEach(post=>{let v=post.querySelector('video');let b=post.querySelector('.iconTik.audio');if(!b)return;if(v&&v===videoAtivo&&!v.muted&&!v.paused&&audioOn){b.classList.add('on');b.innerHTML='<i class="fa-solid fa-volume-high"></i>';b.nextElementSibling.innerHTML='Som<br>ON';}else{b.classList.remove('on');b.innerHTML='<i class="fa-solid fa-volume-xmark"></i>';b.nextElementSibling.innerHTML='Som<br>OFF';}})}
function toggleAudio(btnEl){let post=btnEl.closest('.post');let video=post.querySelector('video');if(!video){toast("Foto sem som");return;}pausarTodosExceto(video);let icon=btnEl.querySelector('.iconTik.audio');if(video.muted){video.muted=false;video.volume=1;video.play().catch(()=>{});videoAtivo=video;audioOn=true;localStorage.setItem('audioOn','1');icon.classList.add('on');icon.innerHTML='<i class="fa-solid fa-volume-high"></i>';toast("🔊 Som ligado! Igual TikTok");}else{video.muted=true;audioOn=false;localStorage.setItem('audioOn','0');icon.classList.remove('on');icon.innerHTML='<i class="fa-solid fa-volume-xmark"></i>';toast("🔇 Mutado");}atualizarBotoes();}
function toggleAudioByVideo(postEl){let video=postEl.querySelector('video');if(!video)return;let btn=postEl.querySelector('.btnTik');if(btn)toggleAudio(btn);}
function toast(m){let t=document.createElement("div");t.innerText=m;t.className="toast";document.body.appendChild(t);setTimeout(()=>t.remove(),2000)}
function mostrarBotaoPostar(){document.getElementById("previewArea").classList.add("show");document.getElementById("btnPostar").classList.add("show")}
async function startCam(mode){facing=mode;try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,sampleRate:48000}});let v=document.getElementById("camVideo");v.srcObject=stream;document.getElementById("camBox").style.display="block";document.getElementById("camOff").style.display="none";}catch(e){alert("PRECISA PERMITIR MICROFONE! Erro: "+e.message)}}
function stopCam(){try{if(stream)stream.getTracks().forEach(t=>t.stop())}catch(e){}document.getElementById("camBox").style.display="none";document.getElementById("camOff").style.display="block";if(timerInt)clearInterval(timerInt)}
function toggleRec(){if(!recording)startRec();else stopRec()}
function startRec(){if(!stream){alert("Abra camera com microfone!");return}chunks=[];let opts={mimeType:'video/webm;codecs=vp9,opus',audioBitsPerSecond:128000,videoBitsPerSecond:2500000};if(!MediaRecorder.isTypeSupported(opts.mimeType))opts={mimeType:'video/webm',audioBitsPerSecond:128000};recorder=new MediaRecorder(stream,opts);recorder.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data)};recorder.onstop=()=>{let blob=new Blob(chunks,{type:'video/webm'});console.log("Gravado:",blob.size,"bytes, com audio:",blob.type);temp=URL.createObjectURL(blob);tempType="video";let pv=document.getElementById("previewVideo");pv.src=temp;pv.muted=false;pv.volume=1;mostrarBotaoPostar();toast("✅ Gravado COM SOM!")};recorder.start(100);recording=true;sec=0;document.getElementById("btnRec").classList.add("stop");timerInt=setInterval(()=>{sec++;document.getElementById("timer").innerText=String(Math.floor(sec/60)).padStart(2,'0')+":"+String(sec%60).padStart(2,'0')+" / 01:30 COM SOM";if(sec>=90)stopRec()},1000)}
function stopRec(){try{recorder.stop()}catch(e){}recording=false;document.getElementById("btnRec").classList.remove("stop");clearInterval(timerInt)}
function salvarTudo(){let n=document.getElementById("nomeUser").value.trim().replace(/@/g,"").toLowerCase();if(!n){alert("Nome");return}userNome=n;localStorage.setItem("userNome",n);render();alert("Salvo")}
function openCom(i){let p=posts[i];comIdx=p.id;document.getElementById("comCount").innerText=(p.com?p.com.length:0)+" comentarios";document.getElementById("comList").innerHTML=(p.com||[]).map(c=>'<div style="color:#fff;font-size:12px"><b>@'+c.u+'</b> '+c.t+'</div>').join("")||"<div style='color:#555'>Sem comentarios</div>";document.getElementById("comDrawer").classList.add("show")}
function closeCom(){document.getElementById("comDrawer").classList.remove("show")}
function closeShare(){document.getElementById("shareDrawer").classList.remove("show")}
async function shareP(i){document.getElementById("shareDrawer").classList.add("show")}
function shareWhats(){window.open("https://wa.me/?text="+encodeURIComponent(location.href),"_blank");closeShare()}
function shareCopy(){navigator.clipboard.writeText(location.href);toast("Copiado");closeShare()}
async function sendCom(){let inp=document.getElementById("comInput");let txt=inp.value.trim();if(!txt||comIdx===null)return;let p=posts.find(x=>x.id===comIdx);if(!p.com)p.com=[];p.com.push({u:userNome||"anon",t:txt});await savePostDB(p);inp.value="";render();openCom(posts.indexOf(p))}
function render(){let list=[...posts].sort((a,b)=>(b.time||0)-(a.time||0));document.getElementById("feed").innerHTML=list.map((p)=>{let idx=posts.indexOf(p);let fired=p.firedBy&&p.firedBy.includes(uid);let liked=p.likedBy&&p.likedBy.includes(uid);let media=p.type==="video"?'<video src="'+p.img+'" loop playsinline muted preload="metadata" onclick="toggleAudioByVideo(this.closest(\'.post\'))"></video>':'<div style="width:100%;height:100%;background:url(\''+p.img+'\') center/cover"></div>';return '<div class="post" onclick="if(event.target.tagName===\'VIDEO\')toggleAudioByVideo(this)"><div class="tapPlay" style="display:'+(p.type==="video"&&!audioOn?'flex':'none')+'"><i class="fa-solid fa-volume-xmark"></i></div>'+media+'<div class="rightBar"><button class="btnTik" onclick="toggleAudio(this)"><div class="iconTik audio"><i class="fa-solid fa-volume-xmark"></i></div><div class="txtTik">Som<br>OFF</div></button><button class="btnTik" onclick="fire('+idx+')"><div class="iconTik fire '+(fired?'on':'')+'"><i class="fa-solid fa-fire"></i></div><div class="txtTik">'+(p.firedBy?p.firedBy.length:0)+'<br>Chamas</div></button><button class="btnTik" onclick="like('+idx+')"><div class="iconTik heart '+(liked?'on':'')+'"><i class="fa-regular fa-heart"></i></div><div class="txtTik">'+(p.likedBy?p.likedBy.length:0)+'<br>Curtir</div></button><button class="btnTik" onclick="openCom('+idx+')"><div class="iconTik"><i class="fa-regular fa-comment-dots"></i></div><div class="txtTik">'+(p.com?p.com.length:0)+'<br>Comen</div></button><button class="btnTik" onclick="shareP('+idx+')"><div class="iconTik"><i class="fa-solid fa-share"></i></div><div class="txtTik">Compar</div></button><button class="btnTik"><div class="iconTik"><i class="fa-regular fa-bookmark"></i></div><div class="txtTik">Salvar</div></button></div><div class="info"><b>@'+p.owner+'</b> <span style="background:'+(audioOn?'#00ff88':'#fff')+';color:#000;padding:2px 6px;border-radius:10px;font-size:8px;font-weight:900">'+(audioOn?'🔊 COM SOM':'🔇 TOQUE P/ SOM')+'</span><div>'+(p.desc||'')+'</div></div></div>'}).join("");document.getElementById("uidShow").innerText=uid;document.getElementById("nomeUser").value=userNome;setTimeout(setupObserver,200)}
async function fire(i){let p=posts[i];if(!p.firedBy)p.firedBy=[];if(p.firedBy.includes(uid))p.firedBy=p.firedBy.filter(x=>x!==uid);else p.firedBy.push(uid);await savePostDB(p);render()}
async function like(i){let p=posts[i];if(!p.likedBy)p.likedBy=[];if(p.likedBy.includes(uid))p.likedBy=p.likedBy.filter(x=>x!==uid);else p.likedBy.push(uid);await savePostDB(p);render()}
function go(n){document.querySelectorAll(".page").forEach(p=>p.classList.remove("show"));if(n==1)document.getElementById("pBusca").classList.add("show");if(n==2)document.getElementById("pCriar").classList.add("show");if(n==4)document.getElementById("pEu").classList.add("show");document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("on"));document.getElementById("b"+n).classList.add("on")}
function closeAll(){document.querySelectorAll(".page").forEach(p=>p.classList.remove("show"));document.getElementById("b0").classList.add("on")}
function busca(){let q=document.getElementById("qBusca").value.toLowerCase();let r=posts.filter(p=>(p.desc||'').toLowerCase().includes(q));document.getElementById("rBusca").innerHTML=r.map(p=>'<div style="color:#fff">'+p.desc+'</div>').join("")}
document.getElementById("file").addEventListener("change",e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=ev=>{temp=ev.target.result;tempType="video";let pv=document.getElementById("previewVideo");pv.src=temp;pv.muted=false;mostrarBotaoPostar();toast("Video carregado COM SOM")};r.readAsDataURL(f)})
async function postar(){let d=document.getElementById("desc").value.trim()||"Meu video 1:30 🔥";if(!temp){alert("Grave ou escolha video COM SOM!");return}let novo={id:Date.now()+Math.random(),owner:userNome||"tales",img:temp,desc:d,firedBy:[],likedBy:[],com:[],saveBy:[],type:tempType,time:Date.now()};await savePostDB(novo);posts.unshift(novo);render();closeAll();toast("Postado com som! Igual TikTok")}
document.getElementById('feed').addEventListener('scroll',()=>{document.querySelectorAll('#feed video').forEach(v=>{if(v!==videoAtivo){v.pause();v.muted=true}})}, {passive:true});
</script>
</body>
</html>
