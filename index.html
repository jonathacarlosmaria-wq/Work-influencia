<!-- Só adicione isso no seu CSS original, sem tirar nada: -->
<style>
.iconTik.audio{background:rgba(0,0,0,.7);border:2px solid #fff}
.iconTik.audio.on{background:#00ff88;color:#000;border-color:#00ff88;box-shadow:0 0 18px #00ff88}
</style>

<!-- No seu render(), na rightBar, ADICIONE como PRIMEIRO botão, mantendo os outros: -->
<div class="rightBar">
  <!-- BOTAO ADICIONADO - NÃO TIRA OS OUTROS -->
  <button class="btnTik" onclick="toggleAudio(this)">
    <div class="iconTik audio"><i class="fa-solid fa-volume-xmark"></i></div>
    <div class="txtTik">Som<br>OFF</div>
  </button>

  <!-- SEUS BOTOES ORIGINAIS MANTIDOS -->
  <button class="btnTik" onclick="fire(...)">Chamas</button>
  <button class="btnTik" onclick="like(...)">Curtir</button>
  <button class="btnTik" onclick="openCom(...)">Comen</button>
  <button class="btnTik" onclick="shareP(...)">Compar</button>
  <button class="btnTik" onclick="saveP(...)">Salvar</button>
</div>

<script>
// FUNCOES ADICIONADAS - CORRIGEM SOM MISTURANDO, MANTEM LAYOUT
let videoAtivo=null;let audioOn=false;let observer=null;
function pausarTodosExceto(exceto){
  document.querySelectorAll('#feed video').forEach(v=>{
    if(v!==exceto){v.pause();v.muted=true;}
  });
}
function setupObserver(){
  if(observer) observer.disconnect();
  observer=new IntersectionObserver((entries)=>{
    let vis=entries.filter(e=>e.isIntersecting&&e.intersectionRatio>=0.8)
   .sort((a,b)=>b.intersectionRatio-a.intersectionRatio);
    if(vis.length===0) return;
    let video=vis[0].target.querySelector('video');
    if(!video) return;
    pausarTodosExceto(video);
    videoAtivo=video;
    video.muted=!audioOn;
    if(audioOn) video.volume=1;
    video.play().catch(()=>{});
  },{threshold:[0,0.8,1]});
  document.querySelectorAll('.post').forEach(p=>observer.observe(p));
}
function toggleAudio(btnEl){
  let post=btnEl.closest('.post');
  let video=post.querySelector('video');
  if(!video) return;
  pausarTodosExceto(video);
  let icon=btnEl.querySelector('.iconTik.audio');
  if(video.muted){
    video.muted=false;video.volume=1;video.play();videoAtivo=video;audioOn=true;
    icon.classList.add('on');icon.innerHTML='<i class="fa-solid fa-volume-high"></i>';
  }else{
    video.muted=true;audioOn=false;
    icon.classList.remove('on');icon.innerHTML='<i class="fa-solid fa-volume-xmark"></i>';
  }
}
document.getElementById('feed').addEventListener('scroll',()=>{
  document.querySelectorAll('#feed video').forEach(v=>{
    if(v!==videoAtivo){v.pause();v.muted=true}
  });
},{passive:true});
</script>
