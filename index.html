<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>WORK GOLD ORIGINAL - CORRIGIDO SEM CORTE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100dvh;background:#000;overflow:hidden}
.app{width:100%;max-width:420px;height:100dvh;margin:0 auto;background:#000;position:relative;display:flex;flex-direction:column;overflow:hidden}
.stage{flex:1;position:relative;background:#000;overflow:hidden}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;background-color:#111}
.shadow{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.85) 0%,transparent 50%,rgba(0,0,0,.2) 100%)}
.top{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:5;background:#1e1e1e;border:1.5px solid #FFD700;border-radius:100px;padding:4px;display:flex;gap:6px}
.pill{padding:7px 14px;border-radius:100px;font-size:12px;font-weight:900;color:#888}.pill.on{background:#FFD700;color:#000}
.live{position:absolute;top:12px;right:10px;z-index:5;background:#1a1a1a;border:1.5px solid #FFD700;color:#FFD700;padding:5px 10px;border-radius:100px;font-size:10px;font-weight:900}
.right{position:absolute;right:10px;bottom:95px;z-index:5;display:flex;flex-direction:column;gap:14px;align-items:center}
.btn{width:52px;height:52px;border-radius:50%;background:#1f1f1f;border:2px solid #FFD700;display:flex;align-items:center;justify-content:center;font-size:20px;color:#FFD700}
.btn.on{background:#FFD700;color:#000}
.num{font-size:11px;font-weight:900;color:#fff;margin-top:3px;text-align:center}
.bottom{position:absolute;left:10px;right:76px;bottom:12px;z-index:5}
.card{background:rgba(15,15,15,.88);border:1px solid rgba(255,215,0,.4);border-radius:14px;padding:10px}
.nav{height:62px;min-height:62px;background:#0c0c0c;border-top:2px solid #FFD700;display:flex;justify-content:space-around;align-items:center;flex-shrink:0;z-index:20}
.ntab{flex:1;color:#555;font-size:9px;font-weight:900;text-align:center}.ntab.on{color:#FFD700}

/* SEU PROJETO ORIGINAL + CORREÇÃO DO CORTE NO MEIO */
.modal{position:absolute;left:0;right:0;top:0;bottom:0;width:100%;background:rgba(0,0,0,.7);z-index:100;display:none;flex-direction:column;justify-content:flex-end}
.modal.on{display:flex}
.box{width:100%!important;max-width:100%!important;transform:none!important;margin:0!important;background:#151515;border-top:3px solid #FFD700;border-radius:20px 20px 0 0;display:flex;flex-direction:column;max-height:78dvh}
.list{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.input-bar{flex-shrink:0;padding:12px;background:#0f0f0f;border-top:1.5px solid #FFD700;display:flex;gap:8px;padding-bottom:18px}
.inp{flex:1;background:#222;border:2px solid #FFD700;border-radius:100px;padding:12px 16px;color:#fff;font-size:16px;outline:none}
.send{padding:12px 18px;border-radius:100px;background:#FFD700;color:#000;font-weight:900;border:none}
.toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#FFD700;color:#000;padding:10px 18px;border-radius:100px;font-weight:900;display:none;z-index:200}.toast.on{display:block}
#cam{position:absolute;inset:0;background:#000;z-index:200;display:none;flex-direction:column}#camEl{flex:1;width:100%;object-fit:cover}
</style>
</head>
<body>
<div class="app">
<div class="stage" id="stage">
<div class="bg" id="bg"></div><div class="shadow"></div>
<div class="top"><div class="pill">Seguindo</div><div class="pill on">Para você</div></div>
<div class="live" onclick="toast('LIVE 30min/dia ativo')">🔴 LIVE 30min</div>

<div class="right">
<div onclick="follow()" style="text-align:center"><div class="btn" id="bF" style="position:relative;overflow:hidden"><span id="fL">L</span><div id="fB" style="position:absolute;bottom:-2px;right:-2px;width:16px;height:16px;background:#FFD700;color:#000;border-radius:50%;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:900">+</div></div></div>
<div onclick="like()" style="text-align:center"><div class="btn" id="bL">🤍</div><div class="num" id="nL">120K</div></div>
<div onclick="openC()" style="text-align:center"><div class="btn" style="background:#FFD700;color:#000;border-color:#000">💬</div><div class="num" id="nC">3</div></div>
<div onclick="save()" style="text-align:center"><div class="btn" id="bS">🔖</div><div class="num" id="nS">Salvar</div></div>
<div onclick="share()" style="text-align:center"><div class="btn">↗</div><div class="num">Share</div></div>
</div>

<div class="bottom">
<div class="card">
<div style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><div style="width:32px;height:32px;border-radius:50%;background:#222;border:2px solid #FFD700;display:flex;align-items:center;justify-content:center;color:#FFD700;font-weight:900" id="uP">L</div><div style="color:#FFD700;font-weight:900;font-size:13px" id="uN">@lux.studio</div><div style="margin-left:auto;color:#FFD700;font-size:10px" onclick="openAdmin()">⚙️</div></div>
<div style="font-size:12px;color:#fff" id="uD">Golden city views at sunset ✨ #gold #luxury</div>
</div>
</div>

<div id="toast" class="toast"></div>

<!-- COMENTÁRIOS CORRIGIDO SEM CORTE NO MEIO -->
<div class="modal" id="mC">
<div style="flex:1" onclick="closeM()"></div>
<div class="box">
<div style="padding:12px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2a2a2a;flex-shrink:0">
<div><b style="color:#FFD700" id="cT">💬 3 comentários</b><div style="font-size:10px;color:#888" id="cUser">@lux.studio</div></div>
<button onclick="closeM()" style="width:30px;height:30px;border-radius:50%;background:#222;border:1px solid #FFD700;color:#FFD700">×</button>
</div>
<div class="list" id="cL"></div>
<div class="input-bar">
<input id="cI" class="inp" placeholder="Escreva um comentário...">
<button class="send" onclick="sendC()">Enviar</button>
</div>
</div>
</div>

<!-- PERFIL ORIGINAL -->
<div class="modal" id="mP">
<div style="flex:1" onclick="closeM()"></div>
<div class="box" style="max-height:85dvh"><div style="padding:14px">
<div style="display:flex;justify-content:space-between"><b style="color:#FFD700">👑 Meu Perfil</b><button onclick="closeM()" style="width:28px;height:28px;border-radius:50%;background:#222;border:1px solid #FFD700;color:#FFD700">×</button></div>
<div style="text-align:center;margin-top:12px"><img id="pImg" style="width:70px;height:70px;border-radius:50%;border:2px solid #FFD700;display:none;object-fit:cover"><div id="pEm" style="width:70px;height:70px;border-radius:50%;background:#222;border:2px solid #FFD700;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto">👑</div><br><input type="file" id="pFile" accept="image/*" style="display:none"><button onclick="document.getElementById('pFile').click()" style="margin-top:8px;padding:5px 12px;border-radius:100px;background:#FFD700;border:none;font-weight:900;font-size:11px">Trocar foto</button></div>
<input id="iN" class="inp" placeholder="Seu nome" style="margin-top:12px;width:100%"><input id="iH" class="inp" placeholder="Seu @nick" style="margin-top:8px;width:100%"><button onclick="saveP()" style="width:100%;margin-top:10px;padding:12px;border-radius:100px;background:#FFD700;color:#000;font-weight:900;border:none">SALVAR PERFIL</button>
</div></div>
</div>

<!-- ADMIN ORIGINAL -->
<div class="modal" id="mA">
<div style="flex:1" onclick="closeM()"></div>
<div class="box"><div style="padding:14px">
<div style="display:flex;justify-content:space-between"><b style="color:#FFD700">⚙️ Admin</b><button onclick="closeM()" style="width:28px;height:28px;border-radius:50%;background:#222;border:1px solid #FFD700;color:#FFD700">×</button></div>
<button onclick="clearAll()" style="width:100%;margin-top:12px;padding:10px;border-radius:100px;background:#222;border:1px solid #ff4444;color:#ff4444;font-weight:900">🗑️ Limpar Posts</button>
<button onclick="resetApp()" style="width:100%;margin-top:8px;padding:10px;border-radius:100px;background:#FFD700;color:#000;font-weight:900;border:none">🔄 Resetar App</button>
</div></div>
</div>

<!-- CAMERA ORIGINAL -->
<div id="cam"><video id="camEl" autoplay muted playsinline></video><div style="position:absolute;top:0;left:0;right:0;padding:10px;display:flex;justify-content:space-between;z-index:5"><button onclick="closeCam()" style="width:32px;height:32px;border-radius:50%;background:#000;border:1px solid #FFD700;color:#FFD700">✕</button><button onclick="doPost()" style="background:#FFD700;color:#000;padding:6px 14px;border-radius:100px;font-weight:900;border:none">Postar</button></div><div style="position:absolute;bottom:0;left:0;right:0;padding:10px;display:flex;gap:8px;z-index:5"><input id="dI" class="inp" style="flex:1" placeholder="Legenda..."><button onclick="cap()" style="width:60px;height:60px;border-radius:50%;background:#FFD700;border:3px solid #000;font-size:24px">📸</button></div></div>

</div>

<div class="nav">
<div class="ntab on" onclick="home()">⌂<br>Início</div>
<div class="ntab" onclick="toast('Buscar em breve')">⌕<br>Buscar</div>
<div class="ntab" onclick="openCam()"><div style="width:46px;height:46px;border-radius:50%;background:#000;border:2px solid #FFD700;display:flex;align-items:center;justify-content:center;color:#FFD700;font-size:24px;margin:0 auto">+</div></div>
<div class="ntab" onclick="toast('LIVE 30min/dia ativo')">◎<br>LIVE</div>
<div class="ntab" onclick="openPro()">👑<br>Eu</div>
</div>
</div>

<script>
let cur=0,photo=null,stream=null;
let posts=[
{img:"https://images.unsplash.com/photo-1514565131-fce0801e5785?q=80&w=1000",desc:"Golden city views at sunset ✨ #gold #luxury",owner:"lux.studio",likes:120300,liked:false,follow:false,saved:false,coms:["Lindo demais! 😍","Gold vibes ✨","Top 👑"]},
{img:"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?q=80&w=1000",desc:"WORK GOLD ORIGINAL - Tela corrigida 👑",owner:"jonathacarlosmaria",likes:45200,liked:false,follow:false,saved:false,coms:["Perfeito agora sem corte!"]},
];
const $=id=>document.getElementById(id);
function toast(t){$('toast').innerText=t;$('toast').classList.add('on');setTimeout(()=>$('toast').classList.remove('on'),2000)}
function closeM(){document.querySelectorAll('.modal').forEach(m=>m.classList.remove('on'))}
function closeCam(){$('cam').style.display='none';if(stream){try{stream.getTracks().forEach(s=>s.stop())}catch{}}}
function fmt(n){return n>=1000?(n/1000).toFixed(1).replace('.0','')+'K':n}
function load(){
try{let b=JSON.parse(localStorage.getItem('work_original')||'[]');if(b.length)posts=b}catch{}
let p=posts[cur];
$('bg').style.backgroundImage=`url('${p.data||p.img}')`;
$('uN').innerText='@'+p.owner;$('uD').innerText=p.desc;$('uP').innerText=p.owner[0].toUpperCase();$('fL').innerText=p.owner[0].toUpperCase();
$('nL').innerText=fmt(p.likes);$('nC').innerText=p.coms.length;
$('bL').innerText=p.liked?'💛':'🤍';$('bL').className=p.liked?'btn on':'btn';
$('bS').innerText=p.saved?'⭐':'🔖';$('bS').className=p.saved?'btn on':'btn';$('nS').innerText=p.saved?'Salvo':'Salvar';
$('fB').innerText=p.follow?'✓':'+';$('fB').style.background=p.follow?'#00e676':'#FFD700';
$('cT').innerText=`💬 ${p.coms.length} comentários`;$('cUser').innerText='@'+p.owner;
$('cL').innerHTML=p.coms.map((c,i)=>`<div style="display:flex;gap:8px"><div style="width:26px;height:26px;border-radius:50%;background:#FFD700;color:#000;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:10px;flex-shrink:0">${i+1}</div><div style="flex:1;background:#222;border-radius:10px;padding:8px 10px"><b style="color:#FFD700;font-size:11px">@gold_${i+1}</b><div style="font-size:12px;margin-top:2px;color:#fff">${c}</div></div></div>`).join('') || '<div style="text-align:center;color:#666;padding:20px">Nenhum comentário</div>';
localStorage.setItem('work_original',JSON.stringify(posts));
}
function follow(){let p=posts[cur];p.follow=!p.follow;load();toast(p.follow?'✅ Seguindo @'+p.owner:'Deixou de seguir')}
function like(){let p=posts[cur];p.liked=!p.liked;p.likes+=p.liked?1:-1;if(p.likes<0)p.likes=0;load();toast(p.liked?'💛 Curtiu!':'Descurtiu')}
function save(){let p=posts[cur];p.saved=!p.saved;load();toast(p.saved?'⭐ Salvo!':'Removido')}
function share(){navigator.clipboard.writeText(location.href).then(()=>toast('🔗 Link copiado!'))}
function openC(){load();$('mC').classList.add('on');setTimeout(()=>$('cI').focus(),100)}
function sendC(){let i=$('cI');let t=i.value.trim();if(!t)return;posts[cur].coms.push(t);i.value='';load();openC();toast('Enviado ✨')}
function home(){closeM();closeCam();load()}
function openPro(){closeM();let u=JSON.parse(localStorage.getItem('work_user')||'{"name":"Jonatha Carlos Maria 👑","nick":"jonathacarlosmaria"}');$('iN').value=u.name;$('iH').value=u.nick;let pic=localStorage.getItem('work_pic');if(pic){$('pImg').src=pic;$('pImg').style.display='block';$('pEm').style.display='none'}else{$('pImg').style.display='none';$('pEm').style.display='flex'} $('mP').classList.add('on')}
function saveP(){let name=$('iN').value.trim()||'Jonatha Carlos Maria 👑';let nick=$('iH').value.trim()||'jonathacarlosmaria';localStorage.setItem('work_user',JSON.stringify({name,nick}));closeM();toast('Perfil salvo ✨')}
function openAdmin(){$('mA').classList.add('on')}
function clearAll(){if(confirm('Limpar todos posts?')){localStorage.removeItem('work_original');posts=posts.slice(0,2);load();closeM();toast('Limpo!')}}
function resetApp(){if(confirm('Resetar app?')){localStorage.clear();location.reload()}}
function openCam(){$('cam').style.display='flex';navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}}).then(s=>{stream=s;$('camEl').srcObject=s}).catch(()=>toast('Permita câmera'))}
function cap(){let v=$('camEl');let c=document.createElement('canvas');c.width=v.videoWidth||720;c.height=v.videoHeight||1280;c.getContext('2d').drawImage(v,0,0,c.width,c.height);photo=c.toDataURL('image/jpeg',0.9);toast('Foto pronta! Clique Postar')}
function doPost(){if(!photo){toast('Tire uma foto');return}posts.unshift({img:photo,desc:$('dI').value||'Post Gold ✨',owner:JSON.parse(localStorage.getItem('work_user')||'{"nick":"jonathacarlosmaria"}').nick,likes:0,liked:false,follow:false,saved:false,coms:[],data:photo});$('dI').value='';photo=null;closeCam();cur=0;load();toast('Postado! ✨')}
$('pFile').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=ev=>{localStorage.setItem('work_pic',ev.target.result);$('pImg').src=ev.target.result;$('pImg').style.display='block';$('pEm').style.display='none';toast('Foto salva!')};r.readAsDataURL(f)});
$('cI').addEventListener('keydown',e=>{if(e.key==='Enter')sendC()});
let sy=0;$('stage').addEventListener('touchstart',e=>sy=e.touches[0].clientY,{passive:true});
$('stage').addEventListener('touchend',e=>{let d=sy-e.changedTouches[0].clientY;if(Math.abs(d)>50){if(d>0){cur++;if(cur>=posts.length)cur=0}else{cur--;if(cur<0)cur=posts.length-1}load()}},{passive:true});
load();toast('Projeto Original Restaurado - Sem Corte 👑');
</script>
</body>
</html>
