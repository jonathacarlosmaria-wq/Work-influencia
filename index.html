<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Work Influência</title>
<script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
<style>
  /* CORREÇÃO DO CORTAR E ESTICAR - TODO CELULAR */
  html, body {
    overscroll-behavior: none;
    overscroll-behavior-y: contain;
    position: fixed;
    overflow: hidden;
    width: 100%;
    height: 100%;
    height: 100dvh;
    margin: 0;
    padding: 0;
    padding-top: env(safe-area-inset-top);
  }
  #app {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    height: -webkit-fill-available;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-y: contain;
  }
</style>
</head>
<body>
<div id="app">
  <!-- SEU LAYOUT 100% IGUAL AO GUARDADO FICA AQUI DENTRO -->
  <!-- NÃO MUDEI NADA VISUAL -->
</div>

<script>
// SEU CÓDIGO GUARDADO CONTINUA IGUAL

// ADIÇÃO OPÇÃO 1 - P2P ILIMITADO (invisível, só espalha vídeos)
const gun = Gun(['https://gun-manhattan.herokuapp.com/gun']);
const feedP2P = gun.get('work-influencia-videos');

feedP2P.map().on((videoData, id) => {
  if(videoData && !document.getElementById(id)){
    // Adiciona vídeo de outro celular automaticamente no feed
    adicionarVideoNoFeed(videoData);
  }
});

function postarVideoP2P(videoObj){
  const id = 'video_' + Date.now();
  feedP2P.get(id).put(videoObj); // espalha pra todos online
  // salva local também (IndexDB que já tinha)
  salvarNoIndexDB(videoObj);
}

console.log("✅ P2P Ilimitado ativo - vídeos espalhados entre celulares online");
</script>
</body>
</html>
