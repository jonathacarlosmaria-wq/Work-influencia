#toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:linear-gradient(145deg,#FFE77A,#FFD700);color:#000;padding:12px 22px;border-radius:100px;font-weight:900;font-size:12px;z-index:99999;display:none;border:2px solid #000}#toast.on{display:block}

</style>

<script>
const ADMIN="jonathacarlosmaria";let stream=null,cur=0,mode='foto',photoData=null,allVideos=[],rec=null,chunks=[],recT=null,recS=0,liveTmr=null,liveS=0,liveRec=false;const LIM=1800;
function toast(t){let e=document.getElementById('toast');e.innerText=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2500)}
function closeAll(){document.querySelectorAll('.modal').forEach(m=>{m.style.display='none';m.classList.remove('on')});document.getElementById('cam').style.display='none';document.getElementById('liveM').style.display='none';if(stream){try{stream.getTracks().forEach(x=>x.stop())}catch{}stream=null}clearInterval(recT);clearInterval(liveTmr);document.getElementById('recP').style.width='0%'}
function getU(){try{let u=JSON.parse(localStorage.getItem('work_current_user')||'{}');if(!u.nick)u={nick:ADMIN,name:"Jonatha Carlos Maria 👑",pic:localStorage.getItem('work_owner_pic')||""};return u}catch{return {nick:ADMIN,name:"Jonatha 👑",pic:""}}}
function getPic(n){let me=getU();if(me.nick===n&&me.pic)return me.pic;let us=JSON.parse(localStorage.getItem('work_all_users')||'[]');let f=us.find(x=>x.nick===n);return f&&f.pic?f.pic:""}
function track(){let u=getU();let o=JSON.parse(localStorage.getItem('work_online_users')||'{}');o[u.nick]={name:u.name,nick:u.nick,last:Date.now()};localStorage.setItem('work_online_users',JSON.stringify(o));up()}
function getOn(){let o=JSON.parse(localStorage.getItem('work_online_users')||'{}');return Object.values(o).filter(x=>Date.now()-x.last<300000)}
function up(){let el=document.getElementById('onlineCount');if(el)el.innerText=getOn().length}
function isFollowing(t){return (JSON.parse(localStorage.getItem('work_follows')||'{}')[getU().nick]||[]).includes(t)}
function toggleFollow(t){if(getU().nick===t){toast('ADMIN 👑');return}let all=JSON.parse(localStorage.getItem('work_follows')||'{}');if(!all[getU().nick])all[getU().nick]=[];let i=all[getU().nick].indexOf(t);if(i>=0){all[getU().nick].splice(i,1);toast('Deixou de seguir')}else{all[getU().nick].push(t);toast('✅ Seguindo @'+t+' 💛')}localStorage.setItem('work_follows',JSON.stringify(all));render()}
function isLiked(id){return (JSON.parse(localStorage.getItem('work_likes')||'{}')[getU().nick]||[]).includes(id)}
function toggleLike(id){let l=JSON.parse(localStorage.getItem('work_likes')||'{}');if(!l[getU().nick])l[getU().nick]=[];let v=allVideos.find(x=>x.id===id);if(!v)return;let i=l[getU().nick].indexOf(id);if(i>=0){l[getU().nick].splice(i,1);v.likes=Math.max(0,(v.likes||1)-1)}else{l[getU().nick].push(id);v.likes=(v.likes||0)+1}localStorage.setItem('work_likes',JSON.stringify(l));saveB();render()}
function isSaved(id){return (JSON.parse(localStorage.getItem('work_saves')||'{}')[getU().nick]||[]).includes(id)}
function toggleSave(id){let s=JSON.parse(localStorage.getItem('work_saves')||'{}');if(!s[getU().nick])s[getU().nick]=[];let i=s[getU().nick].indexOf(id);if(i>=0){s[getU().nick].splice(i,1);toast('🔖 Removido')}else{s[getU().nick].push(id);toast('🔖 Salvo Gold!')}localStorage.setItem('work_saves',JSON.stringify(s));render()}
function upd(){let c=getU();document.getElementById('pName').innerText=c.name;document.getElementById('pNick').innerText='@'+c.nick;let pr=document.getElementById('pPrev');let ph=document.getElementById('pPh');if(c.pic){pr.src=c.pic;pr.style.display='block';ph.style.display='none';document.getElementById('navPic').innerHTML=`<img src="${c.pic}" style="width:24px;height:24px;border-radius:50%;border:2px solid #FFD700">`}else{pr.style.display='none';ph.style.display='flex';document.getElementById('navPic').innerText='👑'}let cPic=document.getElementById('cMyPic');let cPh=document.getElementById('cMyPh');if(c.pic){cPic.src=c.pic;cPic.style.display='block';cPh.style.display='none'}else{cPic.style.display='none';cPh.style.display='flex'}}
function goHome(){closeAll();render()}
function goProfile(){let c=getU();document.getElementById('inName').value=c.name;document.getElementById('inNick').value=c.nick;upd();let m=document.getElementById('profileM');m.style.display='flex';m.classList.add('on')}
function saveP(){let c=getU();c.name=document.getElementById('inName').value.trim()||c.name;c.nick=document.getElementById('inNick').value.trim().replace('@','')||c.nick;localStorage.setItem('work_current_user',JSON.stringify(c));if(c.pic)localStorage.setItem('work_owner_pic',c.pic);upd();toast('✨ Salvo!');render()}
document.getElementById('pInp').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=ev=>{let c=getU();c.pic=ev.target.result;localStorage.setItem('work_current_user',JSON.stringify(c));localStorage.setItem('work_owner_pic',c.pic);upd();render();toast('📸 Foto Gold!')};rd.readAsDataURL(f)});
function saveB(){try{let b=allVideos.slice(0,100).map(v=>({id:v.id,desc:v.desc,data:v.data,img:v.img,owner:v.owner,likes:v.likes,commentsList:v.commentsList}));localStorage.setItem('work_backup_videos',JSON.stringify(b))}catch{}}
function getUso(){let d=JSON.parse(localStorage.getItem('liveUso')||'{}');if(d.data!==new Date().toDateString())return 0;return d.seg||0}
function saveUso(s){localStorage.setItem('liveUso',JSON.stringify({data:new Date().toDateString(),seg:s}))}
function fmt(n){if(n>=1000000)return (n/1000000).toFixed(1).replace('.0','')+'M';if(n>=1000)return (n/1000).toFixed(1).replace('.0','')+'K';return n+''}

function render(){
if(allVideos.length===0){
let backup=[];try{backup=JSON.parse(localStorage.getItem('work_backup_videos')||'[]')}catch{}
let iniciais=[
{id:1001,desc:"Golden city views at sunset ✨ #goldenaesthetic #luxury #travel",img:"https://images.unsplash.com/photo-1514565131-fce0801e5785?q=80&w=1000",owner:"lux.studio",likes:120300,commentsList:["Que cidade linda! 😍","Gold aesthetic perfeito ✨","Luxo total 👑","Amo esse pôr do sol 💛","Que vista!","Top demais!"]},
{id:1002,desc:"Botões laterais 100% corrigidos! Like, Comentário, Save, Share 👑",img:"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?q=80&w=1000",owner:ADMIN,likes:58200,commentsList:["Funcionando!","Like dourado 💛","Comentários OK!"]},
];
allVideos=[...backup,...iniciais];
}
let v=allVideos[cur];
let pic=getPic(v.owner);
let inner=pic?`<img src="${pic}">`:`<div style="width:100%;height:100%;background:#222;display:flex;align-items:center;justify-content:center;color:#FFD700;font-weight:900;font-size:20px">${v.owner[0].toUpperCase()}</div>`;
let badge=isFollowing(v.owner)?`<div class="badge ok">✓</div>`:`<div class="badge plus">+</div>`;
let upic=pic?`<img src="${pic}" class="upic">`:`<div class="upic" style="display:flex;align-items:center;justify-content:center;background:#222;color:#FFD700;font-weight:900">${v.owner[0].toUpperCase()}</div>`;
let imgUrl=v.data||v.img||"https://images.unsplash.com/photo-1514565131-fce0801e5785?q=80&w=1000";
let liked=isLiked(v.id);
let saved=isSaved(v.id);
let cCount=(v.commentsList||[]).length;
document.getElementById('stage').innerHTML=`
<div class="bg" style="background-image:url('${imgUrl}')"></div>
<div class="grad"></div>
<div class="top-pill-wrap"><div class="top-pill"><div class="t-tab">Seguindo</div><div class="t-tab on">Para voce</div></div></div>
<div class="live-badge"><b><span style="width:8px;height:8px;background:#FF2C2C;border-radius:50%;display:inline-block"></span> LIVE</b><span style="font-size:12px">${fmt(v.likes)}</span></div>
<div class="right">
<div class="act" onclick="event.stopPropagation(); toggleFollow('${v.owner}')"><div class="abtn follow">${inner}${badge}</div></div>
<div class="act" onclick="event.stopPropagation(); likeBtn(${v.id},event)"><div class="abtn ${liked?'liked':''}"><span style="font-size:26px">${liked?'💛':'🤍'}</span></div><div class="cnt">${fmt(v.likes||0)}</div></div>
<div class="act" onclick="event.stopPropagation(); openComments()"><div class="abtn" style="border-color:#FFD700"><span style="font-size:22px">💬</span></div><div class="cnt">${fmt(cCount)}</div></div>
<div class="act" onclick="event.stopPropagation(); toggleSave(${v.id})"><div class="abtn ${saved?'liked':''}"><span style="font-size:22px">${saved?'⭐':'🔖'}</span></div><div class="cnt">${saved?'Salvo':'Salvar'}</div></div>
<div class="act" onclick="event.stopPropagation(); sharePost()"><div class="abtn"><span style="font-size:22px">↗</span></div><div class="cnt">Share</div></div>
</div>
<div class="bot"><div class="glass-card"><div class="urow">${upic}<div class="uname">@${v.owner}</div></div><div style="font-size:13px;color:#fff">${v.desc}</div><div style="margin-top:8px;font-size:11px;color:#FFD700">♫ Golden Hour • Lux Vibes</div></div></div>`;
}

// FUNÇÃO CORRIGIDA - NOME DIFERENTE PARA NÃO CONFLITAR
function openComments(){
console.log('Abrindo comentários Gold...');
let v=allVideos[cur];
let modal=document.getElementById('cM');
let list=document.getElementById('cL');
let title=document.getElementById('cC');
let count=document.getElementById('cCount');
title.innerText=`💬 ${v.commentsList.length} comentários`;
count.innerText=`@${v.owner} • ${v.commentsList.length} comentários Gold`;
list.innerHTML=(v.commentsList||[]).map((c,i)=>`
<div style="display:flex;gap:10px;align-items:flex-start">
<div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(145deg,#FFE77A,#FFD700);display:flex;align-items:center;justify-content:center;color:#000;font-weight:900;font-size:11px;flex-shrink:0">${i+1}</div>
<div style="flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,215,0,.14);padding:10px 12px;border-radius:16px 16px 16px 4px">
<div style="display:flex;gap:6px;align-items:center"><b style="font-size:11px;color:#FFD700">@gold_user_${i+1}</b><span style="font-size:9px;color:#666">• agora</span><span onclick="toast('💛 Curtiu!')" style="margin-left:auto;cursor:pointer">💛</span></div>
<div style="font-size:12.5px;color:#fff;margin-top:4px;line-height:1.35">${c}</div>
</div>
</div>
`).join('') || '<div style="text-align:center;color:#666;padding:20px">Seja o primeiro a comentar Gold! ✨</div>';
modal.style.display='flex';
modal.classList.add('on');
upd();
setTimeout(()=>{list.scrollTop=list.scrollHeight;document.getElementById('cI').focus()},150);
toast('💬 Comentários Gold abertos!');
}
function openC(){openComments();}

function likeBtn(id,e){
let v=allVideos.find(x=>x.id===id)||allVideos[cur];
let x=e.clientX||window.innerWidth/2;let y=e.clientY||window.innerHeight/2;
let h=document.createElement('div');h.className='heart';h.innerText='💛';h.style.left=x+'px';h.style.top=y+'px';document.getElementById('stage').appendChild(h);setTimeout(()=>h.remove(),900);
toggleLike(id);
toast(v.likes+1+' likes Gold!');
}
function sendC(){
let input=document.getElementById('cI');let t=input.value.trim();
if(!t){toast('Digite um comentário');input.focus();return}
let v=allVideos[cur];if(!v.commentsList)v.commentsList=[];
v.commentsList.push(t);
input.value='';
saveB();
openComments();
render();
toast('✨ Comentário enviado!');
}
document.getElementById('cI').addEventListener('keypress',function(e){if(e.key==='Enter'){e.preventDefault();sendC()}});
document.getElementById('cSend').addEventListener('click',function(e){e.preventDefault();sendC()});

function sharePost(){let v=allVideos[cur];if(navigator.clipboard){navigator.clipboard.writeText(location.href).then(()=>toast('🔗 Link Gold copiado! ✨'))}else{toast('🔗 Compartilhado @'+v.owner+' ✨')}}
function goCam(){document.getElementById('cam').style.display='flex';navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true}).then(s=>{stream=s;document.getElementById('camEl').srcObject=s;setM('foto')}).catch(()=>toast('Permita câmera'))}
function setM(m){mode=m;document.getElementById('bF').style.background=m==='foto'?'#FFD700':'rgba(0,0,0,.45)';document.getElementById('bF').style.color=m==='foto'?'#000':'#FFD700';document.getElementById('bV').style.background=m==='video'?'#FFD700':'rgba(0,0,0,.45)';document.getElementById('bV').style.color=m==='video'?'#000':'#FFD700';document.getElementById('camL').innerText=m==='foto'?'📸 FOTO GOLD':m==='video'?'🎥 1:30 GOLD':'🔴 LIVE 30MIN GOLD';document.getElementById('shut').innerText=m==='foto'?'📸':'●';}
function cap(){if(mode==='foto'){let v=document.getElementById('camEl');let c=document.getElementById('photoCanvas');c.width=v.videoWidth||1080;c.height=v.videoHeight||1920;c.getContext('2d').drawImage(v,0,0,c.width,c.height);photoData=c.toDataURL('image/jpeg',0.9);toast('✨ Foto Gold! Clique Postar')}else if(mode==='video'){if(!rec){chunks=[];rec=new MediaRecorder(stream,{mimeType:'video/webm'});rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{let b=new Blob(chunks,{type:'video/webm'});let rd=new FileReader();rd.onload=ev=>{photoData=ev.target.result;toast('✨ Vídeo 1:30 Gold pronto!')};rd.readAsDataURL(b)};rec.start();recS=0;recT=setInterval(()=>{recS++;document.getElementById('recP').style.width=(recS/90*100)+'%';document.getElementById('camL').innerText=`🔴 ${recS}s / 90s GOLD`;if(recS>=90)toggleV()},1000);document.getElementById('shut').innerText='■';toast('🔴 Gravando 1:30...')}else toggleV()}else openLive()}
function toggleV(){if(rec&&rec.state==='recording'){rec.stop();clearInterval(recT);document.getElementById('shut').innerText='✨'}}
function openLive(){let resta=LIM-getUso();if(resta<=0){toast('⏰ 30min acabaram hoje!');return}document.getElementById('cam').style.display='none';document.getElementById('liveM').style.display='flex';navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true}).then(s=>{stream=s;document.getElementById('liveV').srcObject=s;liveS=0;document.getElementById('liveI').innerText=`✨ Gold • ${Math.floor(resta/60)}:${String(resta%60).padStart(2,'0')} livre hoje • Clique ●`;document.getElementById('liveT').innerText='00:00 / 30:00';document.getElementById('liveBar').style.width='0%'}).catch(()=>toast('Permita câmera'))}
function togLive(){let b=document.getElementById('liveB');if(!liveRec){liveRec=true;b.innerText='■';b.style.background='#fff';b.style.color='#8B0000';toast('🔴 LIVE GOLD gravando!');liveTmr=setInterval(()=>{liveS++;let tot=getUso()+liveS;saveUso(tot);let falta=LIM-tot;let m=String(Math.floor(liveS/60)).padStart(2,'0');let sc=String(liveS%60).padStart(2,'0');document.getElementById('liveT').innerText=`${m}:${sc} / 30:00`;document.getElementById('liveI').innerText=`🔴 GOLD ${m}:${sc} • Resta: ${Math.floor(falta/60)}:${String(falta%60).padStart(2,'0')}`;document.getElementById('liveBar').style.width=(liveS/1800*100)+'%';if(falta<=0){clearInterval(liveTmr);saveLive();closeAll();toast('⏰ 30min acabaram! Salvo!')}},1000)}else{liveRec=false;b.innerText='●';b.style.background='#FFD700';b.style.color='#000';clearInterval(liveTmr);saveLive();toast('⏸️ Pausado Gold!')}}
function saveLive(){if(liveS<2)return;let me=getU();let c=document.createElement('canvas');let v=document.getElementById('liveV');c.width=720;c.height=1280;try{c.getContext('2d').drawImage(v,0,0,720,1280)}catch{}let thumb=c.toDataURL('image/jpeg',0.7);allVideos.unshift({id:Date.now(),data:thumb,desc:`LIVE GOLD ✨ ${String(Math.floor(liveS/60)).padStart(2,'0')}:${String(liveS%60).padStart(2,'0')} #gold`,owner:me.nick,likes:0,commentsList:[]});saveB();render()}
function postNow(){if(!photoData){toast('Tire foto/vídeo');return}let me=getU();allVideos.unshift({id:Date.now(),data:photoData,desc:document.getElementById('descInp').value||'Golden city views ✨ #gold',owner:me.nick,likes:0,commentsList:[]});saveB();closeAll();document.getElementById('descInp').value='';photoData=null;toast('✨ Postado Gold!');render()}
function openAdmin(){if(getU().nick!==ADMIN){toast('Só ADMIN 👑');return}let m=document.getElementById('adminM');m.style.display='flex';m.classList.add('on');let on=getOn();document.getElementById('aS').innerHTML=`<div style="background:rgba(255,215,0,.1);border:1.5px solid rgba(255,215,0,.3);padding:14px;border-radius:18px;text-align:center"><div style="font-size:22px;font-weight:900;color:#FFD700">${on.length}</div><div style="font-size:9px;color:#aaa">ONLINE GOLD</div></div><div style="background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.1);padding:14px;border-radius:18px;text-align:center"><div style="font-size:22px;font-weight:900;color:#fff">${JSON.parse(localStorage.getItem('work_all_users')||'[]').length+1}</div><div style="font-size:9px;color:#aaa">USUÁRIOS</div></div>`;document.getElementById('aO').innerHTML=on.map(u=>`<div style="display:flex;gap:10px;padding:10px;background:rgba(255,255,255,.05);margin-bottom:6px;border-radius:14px"><div style="width:32px;height:32px;border-radius:50%;background:#FFD700;display:flex;align-items:center;justify-content:center;color:#000;font-weight:900">${u.nick[0].toUpperCase()}</div><div><div style="font-size:11px;color:#fff">${u.name}</div><div style="font-size:9px;color:#FFD700">@${u.nick}</div></div></div>`).join('')||'<div style="text-align:center;color:#666;padding:14px">Ninguém online</div>'}
let sy=0;document.getElementById('stage').addEventListener('touchstart',e=>{sy=e.touches[0].clientY},{passive:true});document.getElementById('stage').addEventListener('touchend',e=>{let d=sy-e.changedTouches[0].clientY;if(Math.abs(d)>60){if(d>0){cur++;if(cur>=allVideos.length)cur=0}else{cur--;if(cur<0)cur=allVideos.length-1}render()}},{passive:true});
render();if(!localStorage.getItem('work_current_user'))localStorage.setItem('work_current_user',JSON.stringify({nick:ADMIN,name:"Jonatha Carlos Maria 👑 Gold",pic:localStorage.getItem('work_owner_pic')||""}));track();setInterval(track,25000);up();toast('✨ V43 - BOTÃO COMENTÁRIOS CORRIGIDO! CLIQUE AGORA 💬');
</script>
