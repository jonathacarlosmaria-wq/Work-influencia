<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WORK FIRE - BOTÕES ANIMADOS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100dvh;background:#000;overflow:hidden;font-family:system-ui,sans-serif}
#app{width:100%;max-width:420px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;background:#000;position:relative}
#feed{flex:1;overflow-y:scroll;scroll-snap-type:y mandatory;background:#000}
#feed::-webkit-scrollbar{display:none}
.post{height:100dvh;width:100%;position:relative;scroll-snap-align:start;background:#111 center/cover no-repeat;flex-shrink:0;overflow:hidden}

/* BOTÕES ANIMADOS - IGUAL FOTO MAS VIVOS */
.side{position:absolute;right:10px;bottom:110px;display:flex;flex-direction:column;gap:18px;z-index:20;width:62px;align-items:center}
.sbtn{display:flex;flex-direction:column;align-items:center;background:none;border:none;width:100%;cursor:pointer;position:relative}

.ibtn{
width:56px;height:56px;border-radius:50%;
background:radial-gradient(circle at 30% 30%, #ff6a00, #8b0000);
border:2.5px solid #ff8c00;
display:flex;align-items:center;justify-content:center;
font-size:26px;
box-shadow:0 0 16px rgba(255,69,0,.7), inset 0 2px 4px rgba(255,255,255,.3);
animation:vivo 2s infinite ease-in-out;
transition:all.25s cubic-bezier(.34,1.56,.64,1);
position:relative;overflow:hidden
}
.ibtn::before{
content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
background:linear-gradient(120deg,transparent,rgba(255,255,255,.3),transparent);
transform:rotate(25deg) translateX(-100%);
animation:brilho 3s infinite
}
@keyframes brilho{0%{transform:rotate(25deg) translateX(-100%)}50%,100%{transform:rotate(25deg) translateX(100%)}}
@keyframes vivo{
0%,100%{transform:scale(1);box-shadow:0 0 16px rgba(255,69,0,.7)}
50%{transform:scale(1.09);box-shadow:0 0 26px rgba(255,140,0,1),0 0 40px rgba(255,69,0,.5)}
}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.6) rotate(-5deg)}60%{transform:scale(.9) rotate(5deg)}100%{transform:scale(1)}}
@keyframes heartBurst{0%{transform:translate(-50%,-50%) scale(0);opacity:1}100%{transform:translate(-50%,-150%) scale(2.5);opacity:0}}
@keyframes fireBurst{0%{transform:translate(-50%,-50%) scale(0)}20%{transform:translate(-50%,-50%) scale(1.4)}100%{transform:translate(-50%,-80%) scale(0);opacity:0}}

.ibtn.liked{
background:radial-gradient(circle at 30% 30%, #ff2a6d, #b00040)!important;
border-color:#ff2a6d!important;
box-shadow:0 0 28px #ff2a6d, 0 0 50px rgba(255,42,109,.6)!important;
animation:vivoLike 1s infinite
}
@keyframes vivoLike{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.ibtn.saved{
background:radial-gradient(circle at 30% 30%, #ffcc00, #ff8c00)!important;
border-color:#ffcc00!important;
box-shadow:0 0 24px #ffcc00!important
}
.count{
color:#fff;font-size:12px;font-weight:800;margin-top:6px;
text-shadow:0 1px 6px #000, 0 0 10px rgba(0,0,0,.8);
transition:.2s;letter-spacing:.3px
}
.count.pop{animation:countPop.4s}
@keyframes countPop{0%{transform:scale(1)}50%{transform:scale(1.4);color:#ff8c00}100%{transform:scale(1)}}

.burst{position:absolute;left:50%;top:50%;pointer-events:none;font-size:30px;z-index:5;animation:heartBurst.8s forwards}

.info{position:absolute;left:14px;right:78px;bottom:88px;background:rgba(0,0,0,.88);border:1.5px solid #ff3300;border-radius:14px;padding:10px 12px;z-index:5;backdrop-filter:blur(8px)}
.info b{color:#ff8c00;font-size:14px}
.info div{color:#fff;font-size:13px;margin-top:3px}
.nav{height:70px;min-height:70px;background:#080300;border-top:2px solid #ff4500;display:flex;align-items:center;z-index:30;flex-shrink:0}
.nav button{flex:1;background:none;border:none;color:#6b3a10;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;transition:.2s}
.nav button.on{color:#ff8c00;text-shadow:0 0 8px #ff8c00}
.plus{width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ff6a00,#ff0000);border:3px solid #fff;color:#fff;font-size:32px;display:flex;align-items:center;justify-content:center;margin-top:-26px;box-shadow:0 0 20px #ff4500, 0 6px 20px rgba(0,0,0,.6);animation:vivo 2s infinite}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:none;align-items:flex-end}
.sheet.show{display:flex}
.sheetBox{background:#140800;border-top:3px solid #ff4500;width:100%;border-radius:18px 18px 0 0;max-height:75dvh;display:flex;flex-direction:column}
.page{position:absolute;inset:0;background:#000;z-index:40;display:none;flex-direction:column;overflow:auto}
.page.show{display:flex}
.input{width:100%;padding:12px;background:#1a0a00;border:1.5px solid #ff4500;border-radius:10px;color:#fff;margin-top:8px}
.btn{width:100%;padding:14px;background:linear-gradient(90deg,#ff4500,#ff8c00);border:none;border-radius:10px;color:#000;font-weight:900;margin-top:10px}
.card{background:#140800;border:2px solid #ff4500;border-radius:12px;padding:14px;margin:10px}
</style>
</head>
<body>
<div id="app">
<div id="feed"></div>

<div id="sheetC" class="sheet" onclick="if(event.target==this)closeS('sheetC')"><div class="sheetBox"><div style="padding:14px;display:flex;justify-content:space-between;border-bottom:1px solid #331100"><b style="color:#ff8c00">💬 <span id="ct">0</span></b><button onclick="closeS('sheetC')" style="background:none;border:none;color:#fff;font-size:20px">✕</button></div><div id="listC" style="flex:1;overflow:auto;padding:0 14px"></div><div style="padding:12px;display:flex;gap:8px"><input id="txtC" class="input" style="flex:1;margin:0" placeholder="Comentar..."><button onclick="sendC()" style="background:linear-gradient(90deg,#ff4500,#ff8c00);border:none;padding:0 16px;border-radius:10px;font-weight:900">Enviar</button></div></div></div>
<div id="sheetS" class="sheet" onclick="if(event.target==this)closeS('sheetS')"><div class="sheetBox"><div style="padding:14px;display:flex;justify-content:space-between"><b style="color:#ff8c00">🚀 Compartilhar</b><button onclick="closeS('sheetS')" style="background:none;border:none;color:#fff;font-size:20px">✕</button></div><div style="padding:14px"><button onclick="doZap()" class="card" style="width:100%">💬 WhatsApp</button><button onclick="doCopy()" class="card" style="width:100%">🔗 Copiar</button></div></div></div>

<div id="pBusca" class="page"><div style="display:flex;justify-content:space-between;padding:14px"><h3 style="color:#ff4500">🔍 Busca</h3><button onclick="closeAll()" style="background:none;border:none;color:#fff;font-size:22px">✕</button></div><div class="card"><input id="buscaInput" class="input" placeholder="Buscar..." oninput="doBusca()"><div id="buscaRes" style="margin-top:10px"></div></div></div>
<div id="pCriar" class="page"><div style="display:flex;justify-content:space-between;padding:14px"><h3 style="color:#ff4500">🔥 Criar</h3><button onclick="closeAll()" style="background:none;border:none;color:#fff;font-size:22px">✕</button></div><div class="card"><input id="imgLink" class="input" placeholder="Link imagem"><input id="file" type="file" accept="image/*" style="margin-top:10px;color:#fff;width:100%"><img id="prev" style="width:100%;margin-top:10px;border-radius:10px;display:none"><input id="desc" class="input" placeholder="Descrição"><button class="btn" onclick="addPost()">POSTAR</button></div></div>
<div id="pLive" class="page"><div style="display:flex;justify-content:space-between;padding:14px"><h3 style="color:#ff0000">🔴 Live</h3><button onclick="closeAll()" style="background:none;border:none;color:#fff;font-size:22px">✕</button></div><div class="card" style="text-align:center"><div style="font-size:50px">🔴</div><h3 style="color:#fff;margin-top:10px">Live em breve</h3></div></div>
<div id="pEu" class="page"><div style="display:flex;justify-content:space-between;padding:14px"><b style="color:#ff4500">🔥 Eu</b><button onclick="closeAll()" style="background:none;border:none;color:#fff;font-size:22px">✕</button></div><div style="text-align:center;padding:20px"><div id="fotoPerfil" style="width:90px;height:90px;border-radius:50%;margin:0 auto;background:radial-gradient(circle,#ff4500,#8b0000);border:3px solid #ff8c00;display:flex;align-items:center;justify-content:center;font-size:36px;background-size:cover">🔥</div><h3 id="nomePerfil" style="color:#fff;margin-top:10px">FIRE USER</h3><div id="userPerfil" style="color:#ff8c00">@fire.user</div></div><div class="card"><input id="linkFoto" class="input" placeholder="Link foto"><input id="fileFoto" type="file" accept="image/*" style="margin-top:8px;color:#fff;width:100%"><img id="prevFoto" style="width:100%;margin-top:10px;border-radius:10px;display:none"><input id="cadNome" class="input" placeholder="Nome"><input id="cadUser" class="input" placeholder="@usuario"><button class="btn" onclick="salvarPerfil()">SALVAR</button></div><div class="card"><b style="color:#ff8c00">🔖 Salvos</b><div id="salvos"></div></div></div>

<div class="nav">
<button id="n0" class="on" onclick="go(0)"><span style="font-size:20px">🏠</span><span>Inicio</span></button>
<button id="n1" onclick="go(1)"><span style="font-size:20px">🔍</span><span>Busca</span></button>
<button onclick="go(2)"><div class="plus">+</div></button>
<button id="n3" onclick="go(3)"><span style="font-size:20px">🔴</span><span>Live</span></button>
<button id="n4" onclick="go(4)"><span style="font-size:20px">🔥</span><span>Eu</span></button>
</div>
</div>

<script>
let posts=[{owner:"fire.influencer",img:"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=800",desc:"AGORA COM TUDO QUE VOCÊ PEDIU!",likes:7793,liked:false,comments:[{u:"ana",t:"🔥 botões animados!"}],saves:0,saved:false,shares:8}];
let temp="",cur=0;
let perfilUser={nome:"FIRE USER",user:"@fire.user",bio:"Work Fire",foto:""};
try{let s=localStorage.getItem("WORK_FIRE_BASE_FOTO"); if(s) posts=JSON.parse(s);}catch(e){}
try{let p=localStorage.getItem("PERFIL_FIRE_USER"); if(p) perfilUser=JSON.parse(p);}catch(e){}

function render(){
document.getElementById("feed").innerHTML=posts.map((p,i)=>`
<div class="post" style="background-image:url('${p.img}')">
<div class="side">
<button class="sbtn" onclick="doFire(${i},this)"><div class="ibtn">🔥</div><div class="count">${p.likes}</div></button>
<button class="sbtn" onclick="doLike(${i},this)"><div class="ibtn ${p.liked?'liked':''}">${p.liked?'💖':'💖'}</div><div class="count">Curtir</div></button>
<button class="sbtn" onclick="openC(${i},this)"><div class="ibtn">💬</div><div class="count">${p.comments.length}</div></button>
<button class="sbtn" onclick="openS(${i},this)"><div class="ibtn">🚀</div><div class="count">${p.shares}</div></button>
<button class="sbtn" onclick="doSave(${i},this)"><div class="ibtn ${p.saved?'saved':''}">🔖</div><div class="count">Salvar</div></button>
</div>
<div class="info"><b style="color:#ff8c00">@${p.owner}</b><div style="font-size:13px;margin-top:4px;color:#fff">🔥 ${p.desc}</div></div>
</div>`).join("");
document.getElementById("salvos").innerHTML=posts.filter(x=>x.saved).map(x=>`<div style="display:flex;gap:8px;margin-top:8px"><img src="${x.img}" style="width:50px;height:50px;border-radius:8px"><div style="color:#fff;font-size:12px">${x.desc}</div></div>`).join("")||"<div style='color:#666'>Nenhum</div>";
atualizarPerfilTela();
}
function save(){localStorage.setItem("WORK_FIRE_BASE_FOTO",JSON.stringify(posts));}
function anim(b){
let ib=b.querySelector('.ibtn');
let count=b.querySelector('.count');
ib.style.animation='none'; ib.offsetHeight;
ib.style.animation='pop.45s cubic-bezier(.34,1.56,.64,1), vivo 2s infinite.45s';
if(count){count.classList.remove('pop'); count.offsetHeight; count.classList.add('pop');}
if(navigator.vibrate) navigator.vibrate(40);

// burst
let burst=document.createElement('div');
burst.className='burst';
burst.innerText=ib.innerText;
b.appendChild(burst);
setTimeout(()=>burst.remove(),800);
}
function doLike(i,b){anim(b); posts[i].liked=!posts[i].liked; if(posts[i].liked){posts[i].likes++;} save(); render();}
function doSave(i,b){anim(b); posts[i].saved=!posts[i].saved; save(); render();}
function doFire(i,b){anim(b); posts[i].likes+=3; // fire vale 3
// solta 3 foguinhos
for(let k=0;k<3;k++){
setTimeout(()=>{
let burst=document.createElement('div');
burst.className='burst';
burst.style.animation='fireBurst.7s forwards';
burst.innerText='🔥';
b.appendChild(burst);
setTimeout(()=>burst.remove(),700);
},k*80);
}
save(); render();}
function openC(i,b){anim(b); cur=i; document.getElementById("ct").innerText=posts[i].comments.length; document.getElementById("listC").innerHTML=posts[i].comments.map(c=>`<div style="padding:10px 0;border-bottom:1px solid #331100"><b style="color:#ff8c00">@${c.u}</b> <span style="color:#fff">${c.t}</span></div>`).join(""); document.getElementById("sheetC").classList.add("show");}
function sendC(){let t=document.getElementById("txtC").value.trim(); if(!t)return; posts[cur].comments.push({u:"fire",t:t}); document.getElementById("txtC").value=""; save(); openC(cur); render();}
function openS(i,b){anim(b); cur=i; document.getElementById("sheetS").classList.add("show");}
function doZap(){window.open(`https://wa.me/?text=${encodeURIComponent(posts[cur].desc+" "+location.href)}`); posts[cur].shares++; save(); render(); closeS('sheetS');}
function doCopy(){navigator.clipboard.writeText(location.href); posts[cur].shares++; save(); render(); closeS('sheetS');}
function closeS(id){document.getElementById(id).classList.remove("show");}
function addPost(){let l=document.getElementById("imgLink").value.trim()||temp; if(!l)return alert("Imagem!"); let d=document.getElementById("desc").value.trim()||"Fire!"; posts.unshift({owner:"fire.influencer",img:l,desc:d,likes:0,liked:false,comments:[],saves:0,saved:false,shares:0}); save(); render(); closeAll(); go(0);}
function go(n){document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("on")); if(document.getElementById("n"+n))document.getElementById("n"+n).classList.add("on"); document.querySelectorAll(".page").forEach(p=>p.classList.remove("show")); if(n==1)document.getElementById("pBusca").classList.add("show"); if(n==2)document.getElementById("pCriar").classList.add("show"); if(n==3)document.getElementById("pLive").classList.add("show"); if(n==4)document.getElementById("pEu").classList.add("show");}
function closeAll(){document.querySelectorAll(".page").forEach(p=>p.classList.remove("show")); go(0);}
function doBusca(){let q=document.getElementById("buscaInput").value.toLowerCase(); let r=posts.filter(p=>p.desc.toLowerCase().includes(q)); document.getElementById("buscaRes").innerHTML=r.map(p=>`<div style="display:flex;gap:8px;margin-top:8px"><img src="${p.img}" style="width:50px;height:50px;border-radius:8px"><div style="color:#fff;font-size:12px">${p.desc}</div></div>`).join("")||"<div style='color:#666'>Nada</div>";}
function atualizarPerfilTela(){document.getElementById("nomePerfil").innerText=perfilUser.nome; document.getElementById("userPerfil").innerText=perfilUser.user; let fp=document.getElementById("fotoPerfil"); if(perfilUser.foto){fp.style.backgroundImage=`url('${perfilUser.foto}')`; fp.innerText="";}else{fp.style.backgroundImage="none"; fp.innerText="🔥";}}
function salvarPerfil(){perfilUser.nome=document.getElementById("cadNome").value.trim()||perfilUser.nome; perfilUser.user=document.getElementById("cadUser").value.trim()||perfilUser.user; let link=document.getElementById("linkFoto").value.trim(); if(link)perfilUser.foto=link; if(window.tempFotoPerfil)perfilUser.foto=window.tempFotoPerfil; localStorage.setItem("PERFIL_FIRE_USER",JSON.stringify(perfilUser)); atualizarPerfilTela(); alert("Salvo!");}
document.getElementById("file").addEventListener("change",e=>{let r=new FileReader();r.onload=ev=>{temp=ev.target.result;document.getElementById("prev").src=temp;document.getElementById("prev").style.display="block";}; if(e.target.files[0])r.readAsDataURL(e.target.files[0]);});
document.getElementById("fileFoto").addEventListener("change",e=>{let r=new FileReader();r.onload=ev=>{window.tempFotoPerfil=ev.target.result;document.getElementById("prevFoto").src=ev.target.result;document.getElementById("prevFoto").style.display="block";document.getElementById("fotoPerfil").style.backgroundImage=`url('${ev.target.result}')`;document.getElementById("fotoPerfil").innerText="";}; if(e.target.files[0])r.readAsDataURL(e.target.files[0]);});
render();
</script>
</body>
</html>
