<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>V35.2 LIVE 30MIN</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;color:#fff;overflow:hidden}
#app{width:100vw;height:100vh;position:relative}
video{width:100%;height:100%;object-fit:cover}
.side{position:absolute;right:10px;bottom:100px;display:flex;flex-direction:column;gap:22px;align-items:center;z-index:5}
.avatar{width:52px;height:52px;border-radius:50%;border:2px solid #fff;position:relative}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.follow{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-weight:bold}
.plus{background:#fe2c55;color:#fff}
.seguindo{background:#fff;color:#000;width:58px;border-radius:12px;font-size:9px}
.seguindo img{width:16px;height:16px;border-radius:50%;margin-right:2px}
.icon{width:48px;height:48px;background:rgba(255,255,255,.18);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px}
#liveM{display:none;position:fixed;inset:0;background:#000;z-index:9999;flex-direction:column}
.top{position:absolute;top:0;left:0;right:0;padding:14px;display:flex;justify-content:space-between;z-index:10;background:linear-gradient(to bottom,rgba(0,0,0,.8),transparent)}
.badge{background:#fe2c55;padding:5px 10px;border-radius:4px;font-weight:bold;font-size:12px;display:flex;gap:5px;align-items:center}
.timer{display:flex;gap:6px;align-items:center;background:rgba(0,0,0,.6);padding:6px 12px;border-radius:20px;font-weight:bold;font-size:13px;border:1px solid rgba(255,255,255,.2)}
.dot{width:10px;height:10px;background:red;border-radius:50%;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.rec{position:absolute;bottom:165px;left:50%;transform:translateX(-50%);width:72px;height:72px;border-radius:50%;background:#fe2c55;border:4px solid #fff;display:flex;align-items:center;justify-content:center;font-size:28px;z-index:10}
.rec.on{background:#fff;color:#fe2c55;animation:pulse 1s infinite}
@keyframes pulse{0%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.1)}100%{transform:translateX(-50%) scale(1)}}
#recStatus{position:absolute;bottom:250px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);padding:6px 14px;border-radius:20px;font-size:12px;display:none;z-index:10}
#liveChat{position:absolute;bottom:115px;left:10px;right:10px;max-height:180px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;z-index:5}
.msg{background:rgba(0,0,0,.6);padding:7px 11px;border-radius:16px;font-size:13px;width:fit-content;max-width:85%}
.msg b{color:#fe2c55}
</style>
</head>
<body>
<div id="app"><div id="feed" style="width:100%;height:100%;position:relative"></div></div>
<div id="liveM"><div class="top"><div style="display:flex;gap:10px"><div class="badge"><div class="dot"></div>AO VIVO</div><div class="timer"><div class="dot"></div><span id="liveTimer">00:00</span></div></div><button onclick="closeLive()" style="width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.2);border:none;color:#fff;font-size:18px">✕</button></div><video id="liveVideo" style="width:100%;height:100%;object-fit:cover" playsinline></video><div id="recStatus"></div><button id="recBtn" class="rec" onclick="toggleRec()">●</button><div id="liveChat"></div><div style="position:absolute;bottom:18px;left:10px;right:10px;display:flex;gap:8px;z-index:10"><input id="liveInput" placeholder="Comente na live..." style="flex:1;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:24px;padding:13px 16px;color:#fff;outline:none" onkeypress="if(event.key==='Enter') enviar()"><button onclick="enviar()" style="background:#fe2c55;border:none;color:#fff;padding:13px 20px;border-radius:24px;font-weight:bold">Enviar</button></div></div>
<script>
let videos=[{id:1,url:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",user:"jonatha_ofc",avatar:"https://i.pravatar.cc/150?img=11",likes:"12.5K",follow:false}];
let LIMITE=1800,liveSec=0,tInt=null,rec=false;
function getUso(){let d=JSON.parse(localStorage.getItem('liveUso')||'{}');if(d.data!==new Date().toDateString())return 0;return d.seg||0;}
function saveUso(s){localStorage.setItem('liveUso',JSON.stringify({data:new Date().toDateString(),seg:s}));}
function resta(){return LIMITE-getUso();}
function render(){let v=videos[0];document.getElementById('feed').innerHTML=`<video src="${v.url}" autoplay loop muted playsinline onclick="openLive(${v.id})"></video><div class="side"><div style="display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer" onclick="toggleF(${v.id})"><div class="avatar"><img src="${v.avatar}"><div class="follow ${v.follow?'seguindo':'plus'}" id="f${v.id}">${v.follow?`<img src='${v.avatar}'> Seguindo`:'+'}</div></div><span>${v.user}</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div class="icon">❤️</div><span>${v.likes}</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer" onclick="openLive(${v.id})"><div class="icon">🔴</div><span>LIVE</span></div></div>`;}
function toggleF(id){let v=videos.find(x=>x.id===id);v.follow=!v.follow;let el=document.getElementById('f'+id);if(v.follow){el.className='follow seguindo';el.innerHTML=`<img src='${v.avatar}'> Seguindo`;}else{el.className='follow plus';el.innerHTML='+';}}
function openLive(id){let r=resta();if(r<=0){alert('⏰ 30min acabaram hoje!');return;}alert(`${Math.floor(r/60)} min hoje`);let m=document.getElementById('liveM'),vid=document.getElementById('liveVideo');vid.src=videos[0].url;m.style.display='flex';vid.play();liveSec=0;add('Sistema',`Resta ${Math.floor(r/60)} min`);tInt=setInterval(()=>{liveSec++;let total=getUso()+liveSec;saveUso(total);let falta=LIMITE-total;document.getElementById('liveTimer').innerText=`${String(Math.floor(liveSec/60)).padStart(2,'0')}:${String(liveSec%60).padStart(2,'0')}`;document.getElementById('recStatus').style.display='block';document.getElementById('recStatus').innerText=`Resta: ${Math.floor(falta/60)}:${String(falta%60).padStart(2,'0')} / 30:00`;if(falta<=0){clearInterval(tInt);alert('Acabou!');closeLive();}},1000);}
function toggleRec(){let b=document.getElementById('recBtn');if(!rec){rec=true;b.classList.add('on');b.innerText='■';}else{rec=false;b.classList.remove('on');b.innerText='●';alert('Gravado: '+document.getElementById('liveTimer').innerText);}}
function add(n,t){let c=document.getElementById('liveChat'),d=document.createElement('div');d.className='msg';d.innerHTML=`<b>${n}:</b> ${t}`;c.appendChild(d);c.scrollTop=c.scrollHeight;}
function enviar(){let i=document.getElementById('liveInput');if(!i.value.trim())return;add('Você',i.value);i.value='';}
function closeLive(){document.getElementById('liveM').style.display='none';clearInterval(tInt);document.getElementById('liveVideo').pause();rec=false;}
render();
</script>
</body>
</html>
