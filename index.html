<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WORK - SÓ ARRASTA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#000;color:#fff;font-family:-apple-system,Arial;height:100dvh;overflow:hidden}
.app{height:100dvh;display:flex;flex-direction:column}
.stage{flex:1;position:relative;background:#000;overflow:hidden;touch-action:none;transition:transform.25s ease}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
.media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.grad{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.96) 0%,transparent 58%);pointer-events:none}
.prog{position:absolute;top:0;left:0;height:4px;background:linear-gradient(90deg,#D4AF37,#FFD700);z-index:20}
.top{position:absolute;top:10px;left:0;right:0;height:58px;display:flex;justify-content:center;gap:10px;z-index:10;padding:0 14px;pointer-events:none}
.pill{padding:10px 16px;border-radius:28px;font-size:11px;font-weight:900;background:rgba(0,0,0,.45);border:1.5px solid rgba(212,175,55,.3)}.pill.on{background:linear-gradient(145deg,#D4AF37,#FFD700);color:#000}
.actions{position:absolute;right:10px;bottom:102px;display:flex;flex-direction:column;gap:16px;z-index:20;align-items:center;width:78px}
.act{display:flex;flex-direction:column;align-items:center;gap:5px;width:100%}
.btn{width:62px;height:62px;border-radius:22px;background:linear-gradient(145deg,#1e1e1e,#0a0a0a);border:1.5px solid rgba(212,175,55,.38);display:flex;align-items:center;justify-content:center;font-size:24px}
.btn.liked{background:linear-gradient(145deg,#ff4d6d,#a00);color:#fff}
.cnt{font-size:9px;font-weight:900;background:rgba(0,0,0,.45);padding:3px 7px;border-radius:20px;border:1px solid rgba(212,175,55,.18);min-width:36px;text-align:center}
.meta{position:absolute;left:12px;bottom:14px;right:84px;z-index:10;background:rgba(0,0,0,.42);backdrop-filter:blur(24px);padding:12px 14px;border-radius:20px;border:1.5px solid rgba(212,175,55,.18);pointer-events:none}
.user{font-weight:900;font-size:13px;display:flex;gap:8px;align-items:center}
.nav{height:96px!important;background:linear-gradient(180deg,#FFE55C,#FFD700,#D4AF37,#B8960C)!important;display:flex!important;justify-content:space-around!important;align-items:center!important;padding:12px 8px 18px!important;border-radius:32px 32px 0 0!important;margin-top:-20px!important;border-top:3px solid #FFD700!important;z-index:50!important}
.tab{color:#3d2e00!important;font-size:10px;text-align:center;padding:10px 14px;border-radius:22px;min-width:64px;display:flex;flex-direction:column;align-items:center;gap:5px;border:1.5px solid rgba(0,0,0,.18)!important;background:rgba(0,0,0,.12)!important;font-weight:800}
.tab.on{background:#000!important;color:#FFD700!important}
.ico{font-size:28px;display:block}
.create{width:78px;height:54px;border-radius:24px;background:#000!important;display:flex;align-items:center;justify-content:center;border:2px solid #FFD700!important}
.create span{background:linear-gradient(145deg,#FFD700,#D4AF37)!important;color:#000!important;width:100%;height:100%;display:flex;align-items:center;justify-content:center;border-radius:20px;font-size:36px;font-weight:900}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:1000;display:none;flex-direction:column}.modal.on{display:flex!important}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
#toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#1d1d1d;padding:14px 24px;border-radius:24px;z-index:6000;display:none;text-align:center;border:1.5px solid rgba(212,175,55,.3);font-size:12px;font-weight:800}#toast.on{display:block!important}
</style>
</head>
<body>
<div id="toast"></div>
<div id="authScreen" style="position:fixed;inset:0;background:#000;z-index:5000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px">
  <h1 style="font-size:48px;font-weight:900;background:linear-gradient(145deg,#FFE55C,#FFD700,#D4AF37);-webkit-background-clip:text;-webkit-text-fill-color:transparent">WORK</h1>
  <div style="width:100%;max-width:360px;background:rgba(255,255,255,.05);border:1.8px solid rgba(212,175,55,.28);border-radius:32px;padding:26px;margin-top:20px">
    <div id="loginForm"><input id="authEmail" type="email" placeholder="Seu email" style="width:100%;background:rgba(0,0,0,.55);border:1.5px solid rgba(212,175,55,.22);border-radius:18px;padding:15px;color:#fff;margin-bottom:12px;outline:none"><input id="authPass" type="password" placeholder="Sua senha" style="width:100%;background:rgba(0,0,0,.55);border:1.5px solid rgba(212,175,55,.22);border-radius:18px;padding:15px;color:#fff;margin-bottom:20px;outline:none"><button onclick="AUTH.login()" style="width:100%;background:linear-gradient(145deg,#FFE55C,#FFD700,#D4AF37);color:#000;border:none;padding:17px;border-radius:24px;font-weight:900">ENTRAR 👑</button><p style="text-align:center;margin-top:18px;color:#888;font-size:13px">Não tem conta? <span onclick="AUTH.showRegister()" style="color:#FFD700;font-weight:900">Cadastre-se</span></p></div>
    <div id="registerForm" style="display:none"><input id="regName" placeholder="Seu nome" style="width:100%;background:rgba(0,0,0,.55);border:1.5px solid rgba(212,175,55,.22);border-radius:18px;padding:15px;color:#fff;margin-bottom:12px;outline:none"><input id="regEmail" type="email" placeholder="Seu email" style="width:100%;background:rgba(0,0,0,.55);border:1.5px solid rgba(212,175,55,.22);border-radius:18px;padding:15px;color:#fff;margin-bottom:12px;outline:none"><input id="regPass" type="password" placeholder="Senha 6 dígitos" style="width:100%;background:rgba(0,0,0,.55);border:1.5px solid rgba(212,175,55,.22);border-radius:18px;padding:15px;color:#fff;margin-bottom:20px;outline:none"><button onclick="AUTH.register()" style="width:100%;background:linear-gradient(145deg,#FFE55C,#FFD700,#D4AF37);color:#000;border:none;padding:17px;border-radius:24px;font-weight:900">CRIAR CONTA</button><p style="text-align:center;margin-top:18px;color:#888;font-size:13px">Já tem? <span onclick="AUTH.showLogin()" style="color:#FFD700;font-weight:900">Login</span></p></div>
  </div>
</div>
<div class="app"><div class="stage" id="stage"></div><div class="nav"><div class="tab on"><span class="ico">⌂</span><span>Início</span></div><div class="tab" onclick="WORK.my()"><span class="ico">◧</span><span>Meus</span></div><div class="tab" onclick="WORK.requireAuth(()=>WORK.openCam('video'))"><div class="create"><span>+</span></div></div><div class="tab" onclick="WORK.requireAuth(()=>WORK.openCam('live'))"><span class="ico">●</span><span>LIVE</span></div><div class="tab" onclick="WORK.openProfile()"><span class="ico" id="icoEu">👤</span><span id="txtEu">Eu</span></div></div></div>
<div class="modal" id="profileM"><div style="flex:1" onclick="WORK.closeM()"></div><div style="position:absolute;bottom:0;left:0;right:0;background:#1f1f1f;border-radius:32px 32px 0 0;padding:20px;border-top:3px solid #FFD700;max-height:88vh;overflow:auto"><div style="display:flex;justify-content:space-between"><span style="color:#D4AF37;font-weight:900">👤 PERFIL</span><span onclick="WORK.closeM()" style="font-size:26px;color:#D4AF37">×</span></div><div style="text-align:center;margin-top:12px"><div id="avatarBox" style="width:110px;height:110px;margin:0 auto 14px;border-radius:28px;background:#111;border:3px solid #D4AF37;display:flex;align-items:center;justify-content:center;font-size:42px;overflow:hidden">👤</div><button onclick="WORK.pickAvatar()" style="background:rgba(212,175,55,.12);border:1.5px dashed rgba(212,175,55,.35);border-radius:18px;padding:10px 16px;color:#D4AF37;font-weight:800">📸 Foto</button></div><div style="margin-top:16px"><input id="inName" placeholder="Seu nome" style="width:100%;background:rgba(0,0,0,.45);border:1.5px solid rgba(212,175,55,.22);border-radius:18px;padding:13px;color:#fff;margin-bottom:10px"><input id="inNick" placeholder="Apelido" style="width:100%;background:rgba(0,0,0,.45);border:1.5px solid rgba(212,175,55,.22);border-radius:18px;padding:13px;color:#fff;margin-bottom:10px"><textarea id="inBio" placeholder="Sobre você" style="width:100%;background:rgba(0,0,0,.45);border:1.5px solid rgba(212,175,55,.22);border-radius:18px;padding:13px;color:#fff;min-height:70px;margin-bottom:12px"></textarea><button onclick="WORK.saveProfile()" style="width:100%;background:linear-gradient(145deg,#FFD700,#D4AF37);color:#000;border:none;padding:16px;border-radius:22px;font-weight:900">💾 SALVAR</button><p id="accountInfo" style="color:#888;font-size:12px;text-align:center;margin:14px 0"></p><button onclick="AUTH.logout()" style="width:100%;background:rgba(255,255,255,.08);border:1.5px solid rgba(212,175,55,.25);color:#fff;padding:14px;border-radius:20px;font-weight:800;margin-bottom:10px">🚪 SAIR</button><button onclick="AUTH.deleteAccount()" style="width:100%;background:rgba(255,59,48,.12);border:1.5px solid rgba(255,59,48,.4);color:#FF453A;padding:14px;border-radius:20px;font-weight:900">⚠️ CANCELAR CONTA</button></div></div></div>
<div class="modal" id="commentsM" style="z-index:2000"><div style="flex:1" onclick="WORK.closeM()"></div><div style="position:absolute;bottom:0;left:0;right:0;background:#1f1f1f;border-radius:32px 32px 0 0;max-height:82vh;display:flex;flex-direction:column;border-top:3px solid #FFD700"><div style="padding:16px 20px;border-bottom:1.5px solid rgba(212,175,55,.15);display:flex;justify-content:space-between"><span style="color:#D4AF37;font-weight:900">💬 <span id="commentCount">0</span></span><span onclick="WORK.closeM()" style="font-size:26px;color:#D4AF37">×</span></div><div id="commentsList" style="flex:1;overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:12px;max-height:50vh"></div><div style="padding:14px 16px;border-top:1.5px solid rgba(212,175,55,.15);display:flex;gap:10px"><input id="commentInput" placeholder="Comente..." style="flex:1;background:rgba(255,255,255,.08);border:1.5px solid rgba(212,175,55,.2);border-radius:24px;padding:12px 18px;color:#fff;outline:none"><button onclick="WORK.sendComment()" style="width:44px;height:44px;border-radius:50%;background:linear-gradient(145deg,#FFD700,#D4AF37);border:none;font-weight:900">➤</button></div></div></div>
<div id="cam" style="position:fixed;inset:0;background:#000;z-index:999;display:none;flex-direction:column"><video id="camEl" autoplay playsinline muted style="width:100%;height:100%;object-fit:cover"></video><div style="position:absolute;top:0;left:0;right:0;height:68px;display:flex;justify-content:space-between;align-items:center;padding:0 16px"><button onclick="WORK.closeCam()" style="background:rgba(0,0,0,.65);color:#FFD700;border:1.5px solid rgba(212,175,55,.4);padding:9px 16px;border-radius:24px">✕</button><div id="timer" style="display:none;background:#a00;padding:7px 16px;border-radius:24px;font-size:12px;font-weight:900">00:00</div><button onclick="WORK.flip()" style="background:rgba(0,0,0,.65);color:#D4AF37;padding:9px 16px;border-radius:24px">🔄</button></div><div style="position:absolute;bottom:0;left:0;right:0;height:190px;display:flex;align-items:center;justify-content:center;gap:32px"><div onclick="WORK.pick()">🖼️</div><div id="rec" style="width:86px;height:86px;border-radius:28px;border:2.5px solid #D4AF37;display:flex;align-items:center;justify-content:center" onclick="WORK.press()"><div style="width:68px;height:68px;background:#a00;border-radius:20px"></div></div><div>⚡</div></div></div>
<div class="modal" id="listM"><div style="flex:1" onclick="WORK.closeM()"></div><div style="position:absolute;bottom:0;left:0;right:0;background:#1d1d1d;border-radius:28px 28px 0 0;padding:18px;border-top:2px solid #FFD700"><div style="display:flex;justify-content:space-between"><span style="color:#D4AF37">✨ Meus • <span id="cMy">0</span></span><span onclick="WORK.closeM()" style="font-size:26px;color:#D4AF37">×</span></div><div id="grid" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;overflow:auto;max-height:60vh"></div></div></div>
<input type="file" id="file" accept="video/*" style="display:none"><input type="file" id="fileAvatar" accept="image/*" style="display:none">
<script>
const WORK={
db:null,profile:{},videos:[
{id:'v1',user:"@work",desc:"Vídeo 1 - Arraste pra cima 👆",img:"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?q=80&w=1000",likes:120,liked:false,share:10,follow:false,type:"img",userId:"system",comments:[]},
{id:'v2',user:"@work",desc:"Vídeo 2 - Continua arrastando",img:"https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?q=80&w=1000",likes:230,liked:false,share:20,follow:false,type:"img",userId:"system",comments:[]},
{id:'v3',user:"@work",desc:"Vídeo 3 - Agora só arrasta funciona!",img:"https://images.unsplash.com/photo-1517841905240-472988babdf9?q=80&w=1000",likes:340,liked:false,share:30,follow:false,type:"img",userId:"system",comments:[]}
],
cur:0,stream:null,facing:'user',recorder:null,chunks:[],sec:0,inter:null,rec:false,startY:0,
initDB(){return new Promise(r=>{let req=indexedDB.open('WorkArraste',5);req.onupgradeneeded=e=>{let d=e.target.result;if(!d.objectStoreNames.contains('videos')) d.createObjectStore('videos',{keyPath:'id'})};req.onsuccess=e=>{this.db=e.target.result;r()}})},
async save(v){await this.initDB();let tx=this.db.transaction('videos','readwrite');tx.objectStore('videos').put(v);return new Promise(r=>tx.oncomplete=()=>r())},
async loadAll(){await this.initDB();return new Promise(r=>{let tx=this.db.transaction('videos','readonly');let req=tx.objectStore('videos').getAll();req.onsuccess=()=>r(req.result)})},
async del(id){await this.initDB();let tx=this.db.transaction('videos','readwrite');tx.objectStore('videos').delete(id);return new Promise(r=>tx.oncomplete=()=>r())},
async loadSaved(){let saved=await this.loadAll();saved.forEach(v=>{try{if(v.blob){v.blobUrl=URL.createObjectURL(v.blob);v.img=v.blobUrl}}catch{}});if(saved.length) this.videos = saved.concat(this.videos); this.render();},
toast(t){let e=document.getElementById('toast');e.innerText=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2000)},
fmt(n){return n>=1000?(n/1000).toFixed(1)+'k':n||0},
requireAuth(cb){let c=JSON.parse(localStorage.getItem('work_current_user')||'null');if(!c){document.getElementById('authScreen').style.display='flex';return}cb();},
next(){ this.cur=(this.cur+1)%this.videos.length; this.render(); },
prev(){ this.cur=(this.cur-1+this.videos.length)%this.videos.length; this.render(); },
loadProfile(){try{let c=JSON.parse(localStorage.getItem('work_current_user')||'null');if(c){this.profile=c;document.getElementById('inName').value=c.name||'';document.getElementById('inNick').value=c.nick||'';document.getElementById('inBio').value=c.bio||'';document.getElementById('accountInfo').innerHTML=`<b style="color:#FFD700">${c.email}</b>`;document.getElementById('txtEu').innerText=c.name.split(' ')[0]||'Eu';if(c.avatar){document.getElementById('avatarBox').innerHTML=`<img src="${c.avatar}" style="width:100%;height:100%;object-fit:cover">`;document.getElementById('icoEu').innerHTML=`<img src="${c.avatar}" style="width:28px;height:28px;border-radius:50%;border:1.5px solid #FFD700;object-fit:cover">`}}}catch{}},
openProfile(){this.loadProfile();document.getElementById('profileM').classList.add('on');document.getElementById('profileM').style.display='flex'},
share(){let v=this.videos[this.cur];if(navigator.share){navigator.share({title:'WORK',text:v.desc,url:location.href}).then(()=>{v.share++;this.render()})}else{navigator.clipboard.writeText(location.href);v.share++;this.render();this.toast('🔗 Copiado')}},
openComments(){let v=this.videos[this.cur];try{let s=JSON.parse(localStorage.getItem('work_comments_'+v.id)||'null');if(s) v.comments=s}catch{}document.getElementById('commentCount').innerText=v.comments?v.comments.length:0;document.getElementById('commentsList').innerHTML=(v.comments||[]).map(c=>`<div style="display:flex;gap:10px;background:rgba(0,0,0,.35);border-radius:20px;padding:12px"><div style="width:36px;height:36px;border-radius:50%;background:#222;border:1.5px solid #D4AF37;display:flex;align-items:center;justify-content:center">${c.user.charAt(1).toUpperCase()}</div><div><div style="font-size:12px;color:#FFD700;font-weight:900">${c.user}</div><div style="font-size:13px;color:#ddd">${c.text}</div></div></div>`).join('')||'Sem comentários';document.getElementById('commentsM').classList.add('on');document.getElementById('commentsM').style.display='flex'},
sendComment(){let c=JSON.parse(localStorage.getItem('work_current_user')||'null');if(!c){this.toast('Faça login');return}let i=document.getElementById('commentInput');let t=i.value.trim();if(!t) return;let v=this.videos[this.cur];if(!v.comments) v.comments=[];v.comments.push({user:'@'+(c.nick||c.email.split('@')[0]),text:t});i.value='';this.openComments();this.render();localStorage.setItem('work_comments_'+v.id,JSON.stringify(v.comments))},
async postVideo(b){let c=JSON.parse(localStorage.getItem('work_current_user')||'null');if(!c)return;let url=URL.createObjectURL(b);let n={id:Date.now(),userId:c.id,user:'@'+(c.nick||c.email.split('@')[0]),desc:c.bio||"Meu vídeo",img:url,blob:b,blobUrl:url,likes:0,liked:false,share:0,follow:false,type:"video",comments:[]};await this.save(n);this.videos.unshift(n);this.cur=0;this.render();this.closeCam();this.toast('✅ Postado')},
delVideo(id){if(!confirm('Apagar?')) return;this.del(id).then(()=>{this.videos=this.videos.filter(v=>v.id!==id);if(this.cur>=this.videos.length) this.cur=0;this.my();this.render()})},
closeM(){document.querySelectorAll('.modal').forEach(m=>{m.classList.remove('on');m.style.display='none'})},
saveProfile(){let c=JSON.parse(localStorage.getItem('work_current_user')||'null');if(!c) return;c.name=document.getElementById('inName').value||c.name;c.nick=document.getElementById('inNick').value||c.nick;c.bio=document.getElementById('inBio').value;localStorage.setItem('work_current_user',JSON.stringify(c));let u=AUTH.getUsers();let i=u.findIndex(x=>x.id===c.id);if(i>=0){u[i]=c;AUTH.saveUsers(u)}this.toast('Salvo');this.closeM();this.render()},
pickAvatar(){document.getElementById('fileAvatar').click()},pick(){document.getElementById('file').click()},
render(){
 let v=this.videos[this.cur]; if(!v) return;
 try{let s=JSON.parse(localStorage.getItem('work_comments_'+v.id)||'null');if(s) v.comments=s}catch{}
 let media=v.type==='video'?`<video class="media" src="${v.blobUrl||v.img}" autoplay loop muted playsinline></video>`:`<div class="bg" style="background-image:url('${v.img}')"></div>`;
 document.getElementById('stage').innerHTML=`${media}<div class="grad"></div><div class="top"><div class="pill">${this.cur+1}/${this.videos.length}</div><div class="pill on">SÓ ARRASTA 👆</div></div><div class="actions"><div class="act" onclick="event.stopPropagation();WORK.like()"><div class="btn ${v.liked?'liked':''}">${v.liked?'❤️':'♡'}</div><div class="cnt">${this.fmt(v.likes)}</div></div><div class="act" onclick="event.stopPropagation();WORK.requireAuth(()=>WORK.openComments())"><div class="btn">💬</div><div class="cnt">${v.comments?v.comments.length:0}</div></div><div class="act" onclick="event.stopPropagation();WORK.share()"><div class="btn">🔗</div><div class="cnt">${this.fmt(v.share)}</div></div><div class="act" onclick="event.stopPropagation();WORK.follow()"><div class="btn">${v.follow?'✓':'＋'}</div><div class="cnt">${v.follow?'Seguindo':'Seguir'}</div></div></div><div class="meta"><div class="user">${v.user}</div><div style="font-size:13px;margin-top:6px">${v.desc}</div><div style="font-size:10px;color:#D4AF37;margin-top:4px">Arraste pra cima/baixo pra passar • ${this.cur+1}/${this.videos.length}</div></div>`;
 let vd=document.querySelector('.media'); if(vd&&vd.tagName==='VIDEO'){vd.play().catch(()=>{})}
},
like(){let v=this.videos[this.cur];v.liked=!v.liked;v.likes+=v.liked?1:-1;this.render()},follow(){this.videos[this.cur].follow=!this.videos[this.cur].follow;this.render()},
my(){this.loadAll().then(all=>{document.getElementById('cMy').innerText=all.length;document.getElementById('grid').innerHTML=all.map(v=>`<div style="position:relative;aspect-ratio:9/16;background:#111;border-radius:18px;overflow:hidden"><video src="${v.blobUrl||v.img}" style="width:100%;height:100%;object-fit:cover" muted></video><button onclick="WORK.delVideo(${v.id})" style="position:absolute;bottom:6px;left:6px;right:6px;background:#f33;border:none;color:#fff;padding:8px;border-radius:12px;font-size:10px;font-weight:900">APAGAR</button></div>`).join('')||'Nenhum vídeo';document.getElementById('listM').classList.add('on');document.getElementById('listM').style.display='flex'})},
openCam(m){this.requireAuth(()=>{document.getElementById('cam').style.display='flex';navigator.mediaDevices.getUserMedia({video:{facingMode:this.facing},audio:true}).then(s=>{this.stream=s;document.getElementById('camEl').srcObject=s})})},
closeCam(){if(this.stream){this.stream.getTracks().forEach(t=>t.stop());this.stream=null}document.getElementById('cam').style.display='none'},flip(){},press(){},
};
const AUTH={getUsers(){try{return JSON.parse(localStorage.getItem('work_users')||'[]')}catch{return []}},saveUsers(u){localStorage.setItem('work_users',JSON.stringify(u))},showRegister(){document.getElementById('loginForm').style.display='none';document.getElementById('registerForm').style.display='block'},showLogin(){document.getElementById('registerForm').style.display='none';document.getElementById('loginForm').style.display='block'},register(){let n=document.getElementById('regName').value.trim();let e=document.getElementById('regEmail').value.trim().toLowerCase();let p=document.getElementById('regPass').value.trim();if(!n||!e||!p||p.length<6){WORK.toast('Preencha tudo 6 dígitos');return}let u=this.getUsers();if(u.find(x=>x.email===e)){WORK.toast('Já existe');this.showLogin();return}let nu={id:'u_'+Date.now(),name:n,nick:e.split('@')[0],email:e,pass:btoa(p),avatar:'',bio:'',createdAt:new Date().toISOString()};u.push(nu);this.saveUsers(u);localStorage.setItem('work_current_user',JSON.stringify(nu));document.getElementById('authScreen').style.display='none';WORK.render()},login(){let e=document.getElementById('authEmail').value.trim().toLowerCase();let p=document.getElementById('authPass').value.trim();let u=this.getUsers();let user=u.find(x=>x.email===e&&atob(x.pass)===p);if(!user){WORK.toast('Erro');return}localStorage.setItem('work_current_user',JSON.stringify(user));document.getElementById('authScreen').style.display='none';WORK.render()},logout(){localStorage.removeItem('work_current_user');location.reload()},deleteAccount(){if(!confirm('Cancelar conta?')) return;let c=JSON.parse(localStorage.getItem('work_current_user')||'null');if(!c) return;let u=this.getUsers().filter(x=>x.id!==c.id);this.saveUsers(u);WORK.loadAll().then(a=>{a.filter(v=>v.userId===c.id).forEach(v=>WORK.del(v.id))});localStorage.removeItem('work_current_user');location.reload()},check(){let c=JSON.parse(localStorage.getItem('work_current_user')||'null');if(c) document.getElementById('authScreen').style.display='none';else document.getElementById('authScreen').style.display='flex'}};

document.getElementById('file').addEventListener('change', async e=>{let f=e.target.files[0];if(!f) return;WORK.requireAuth(async()=>{await WORK.postVideo(f)})});
document.getElementById('fileAvatar').addEventListener('change',e=>{let f=e.target.files[0];if(!f) return;let r=new FileReader();r.onload=ev=>{let b64=ev.target.result;let c=JSON.parse(localStorage.getItem('work_current_user')||'null');if(!c) return;c.avatar=b64;localStorage.setItem('work_current_user',JSON.stringify(c));let u=AUTH.getUsers();let i=u.findIndex(x=>x.id===c.id);if(i>=0){u[i]=c;AUTH.saveUsers(u)}document.getElementById('avatarBox').innerHTML=`<img src="${b64}" style="width:100%;height:100%;object-fit:cover">`;};r.readAsDataURL(f)});

// SÓ ARRASTA - LOGICA TIKTOK
let startY=0, isDragging=false;
const stage=document.getElementById('stage');
stage.addEventListener('touchstart', e=>{ startY=e.touches[0].clientY; isDragging=true; stage.style.transition='none'; }, {passive:true});
stage.addEventListener('touchmove', e=>{
 if(!isDragging) return;
 let curY=e.touches[0].clientY;
 let diff=curY-startY;
 if(Math.abs(diff)>5){ e.preventDefault(); }
 stage.style.transform=`translateY(${diff*0.6}px)`;
}, {passive:false});
stage.addEventListener('touchend', e=>{
 if(!isDragging) return;
 let endY=e.changedTouches[0].clientY;
 let diff=startY-endY;
 stage.style.transition='transform.25s ease';
 stage.style.transform='translateY(0)';
 isDragging=false;
 if(Math.abs(diff)>70){
   if(diff>0) WORK.next();
   else WORK.prev();
 }
});
WORK.loadSaved(); AUTH.check();
