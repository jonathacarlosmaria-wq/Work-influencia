<!-- SUBSTITUI SÓ O CSS E JS DOS COMENTÁRIOS - CORREÇÃO TECLADO -->
<style>
/* FIX TECLADO ANDROID */
.modal input,.modal textarea {
  -webkit-user-select: text!important;
  user-select: text!important;
  pointer-events: auto!important;
  touch-action: manipulation!important;
  -webkit-appearance: none!important;
}
#cM { z-index: 99999!important; }
#cM #commentModalBox {
  backdrop-filter: none!important; /* REMOVE BLUR QUE TRAVA TECLADO */
  background: #121212!important;
}
</style>

<!-- MODAL COMENTÁRIOS V44 CORRIGIDO -->
<div class="modal" id="cM" style="z-index:99999">
<div style="flex:1" onclick="closeAll()"></div>
<div id="commentModalBox" style="background:#121212;border-radius:28px 28px 0 0;max-height:85vh;display:flex;flex-direction:column;border-top:3px solid #FFD700;width:100%;max-width:440px">
<div style="padding:16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #333">
<div><b id="cC" style="color:#FFD700">💬 Comentários</b><div id="cCount" style="font-size:10px;color:#888">Toque para digitar</div></div>
<button onclick="closeAll()" style="width:34px;height:34px;border-radius:50%;background:#222;border:1px solid #FFD700;color:#FFD700;font-size:18px">×</button>
</div>
<div id="cL" style="flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;min-height:200px"></div>
<div style="padding:12px 14px 20px;background:#0a0a0a;border-top:1px solid #333;display:flex;gap:10px;align-items:center;position:sticky;bottom:0">
<div style="width:36px;height:36px;border-radius:50%;background:#222;border:2px solid #FFD700;display:flex;align-items:center;justify-content:center;color:#FFD700;font-weight:900">👑</div>
<input id="cI" type="text" inputmode="text" autocomplete="off" autocorrect="off" spellcheck="false"
style="flex:1;background:#1e1e1e;border:1.5px solid #FFD700;padding:14px 18px;border-radius:100px;color:#fff;outline:none;font-size:16px;-webkit-user-select:text;user-select:text"
placeholder="Escreva um comentário..."
onfocus="this.style.borderColor='#FFE77A'"
onblur="this.style.borderColor='#FFD700'">
<button onclick="sendC()" style="padding:14px 22px;border-radius:100px;background:#FFD700;color:#000;font-weight:900;border:2px solid #000;flex-shrink:0;font-size:13px">Enviar</button>
</div>
</div>
</div>

<script>
// COMENTÁRIOS V44 - FIX TOTAL
function openComments(){
let v=allVideos[cur];
let modal=document.getElementById('cM');
let list=document.getElementById('cL');
document.getElementById('cC').innerText=`💬 ${v.commentsList.length} comentários Gold`;
document.getElementById('cCount').innerText=`@${v.owner} • digite abaixo`;

list.innerHTML=v.commentsList.map((c,i)=>`
<div style="display:flex;gap:10px">
<div style="width:32px;height:32px;border-radius:50%;background:#FFD700;display:flex;align-items:center;justify-content:center;color:#000;font-weight:900;font-size:11px">${i+1}</div>
<div style="flex:1;background:#1e1e1e;border:1px solid #333;padding:10px 12px;border-radius:14px">
<b style="font-size:11px;color:#FFD700">@user_${i+1}</b>
<div style="font-size:13px;color:#fff;margin-top:2px">${c}</div>
</div>
</div>`).join('') || '<div style="text-align:center;color:#666;padding:30px">Seja o primeiro! ✨</div>';

modal.style.display='flex';
modal.classList.add('on');

// FIX TECLADO - FOCA DEPOIS DE 300ms
setTimeout(()=>{
let input=document.getElementById('cI');
input.focus();
input.click(); // Força teclado Android
list.scrollTop=list.scrollHeight;
},350);
toast('💬 Digite seu comentário Gold!');
}
function openC(){openComments()}
function sendC(){
let input=document.getElementById('cI');
let t=input.value.trim();
if(!t){input.focus();return}
let v=allVideos[cur];
if(!v.commentsList)v.commentsList=[];
v.commentsList.push(t);
input.value='';
try{localStorage.setItem('work_backup_videos',JSON.stringify(allVideos.slice(0,100).map(x=>({id:x.id,desc:x.desc,data:x.data,img:x.img,owner:x.owner,likes:x.likes,commentsList:x.commentsList}))))}catch{}
openComments();
render();
toast('✨ Comentário enviado!');
// Mantém foco pra continuar digitando
setTimeout(()=>document.getElementById('cI').focus(),200);
}
</script>
